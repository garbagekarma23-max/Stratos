<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The Stratos favicon: the classic rocket from the app (src/10-core.js, RK.classic), with its orange fins.
       It turns light on a dark browser bar. -->
  <style>
    .hull{fill:#0d0f14}.port{fill:#ffffff}.fin{fill:#ff7a1a}.noz{fill:#6e7380}
    @media (prefers-color-scheme: dark){.hull{fill:#eeeff2}.port{fill:#15161a}.noz{fill:#a7abb6}}
  </style>
  <g transform="translate(5 0.6) scale(1.25)">
    <path class="fin" d="M4 20L1 28L1 30L6.2 27Z"/>
    <path class="fin" d="M20 20L23 28L23 30L17.8 27Z"/>
    <path class="hull" d="M12 1C16.5 5 18 11 18 18L18 27L6 27L6 18C6 11 7.5 5 12 1Z"/>
    <circle class="port" cx="12" cy="13.5" r="2.7"/>
    <rect class="noz" x="9" y="27" width="6" height="2" rx="1"/>
  </g>
</svg>
