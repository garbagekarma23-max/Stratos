# VCE Health and Human Development, Units 3 and 4: Australia's health and health in a global context, 47 points.
# Checked against the VCAA's VCE Health and Human Development Study Design, accredited from 2025, in October 2026.
# Each unit is a unit here, and each area of study is a chapter, or two when it is large. Every brief is in our own
# words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW Health and Movement Science (the hms bank) shares the health indicators and the Ottawa Charter, so expect some
# reuses. Points on mental health, drugs and Aboriginal and Torres Strait Islander health always go to the review page.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-hhd-u34
subject: Health and Human Development
bank: hhd
name: Health and Human Development, Units 3 and 4
about: VCE, Australia's health and global health
short: Health and Human Development
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Health and Human Development Study Design (from 2025), Units 3 and 4
note: Follows the VCE Health and Human Development study design. Not made or endorsed by the VCAA.
chips: [burden of disease, Ottawa Charter, social model of health, human development, SDG 3]

units:
  - title: "Unit 3: Australia's health in a globalised world"
    chapters:
      - title: Concepts and measures of health
        id: vic-hhd-u34-1-1
        points:
          - title: Health, wellbeing and illness
            id: hhd-health-wellbeing-illness
            brief: Health and wellbeing have physical, social, emotional, mental and spiritual dimensions, and illness is a person's experience of being unwell. All are dynamic and subjective.
          - title: Health as a resource
            id: hhd-health-as-resource
            brief: Good health is a resource for individuals, communities, Australia and the world, because it lets people work, learn and take part.
          - title: Health status indicators
            id: hhd-health-status-indicators
            brief: Measures such as life expectancy, mortality, morbidity and self-assessed health status describe a population's health.
          - title: Incidence and prevalence
            id: hhd-incidence-prevalence
            brief: Incidence counts new cases in a period; prevalence counts all cases at a time. Morbidity is how much illness there is.
          - title: Mortality and self-assessed health
            id: hhd-mortality-self-assessed-health
            brief: Maternal, infant and under-five mortality rates and how people rate their own health add to the picture of health status.

      - title: Burden of disease
        id: vic-hhd-u34-1-2-2
        points:
          - title: Burden of disease
            id: hhd-burden-disease
            brief: A measure of the impact of illness, injury and early death, counted in DALYs (disability-adjusted life years).
          - title: Years of life lost and years lived with disability
            id: hhd-years-life-lost-years
            brief: A DALY is the sum of YLL (years lost to early death) and YLD (years lived with illness or disability).
          - title: Health-adjusted life expectancy
            id: hhd-health-adjusted-life-expectancy
            brief: HALE is the years a person can expect to live in full health, which is less than life expectancy.

      - title: Australia's health
        id: vic-hhd-u34-1-3
        points:
          - title: Australia's health status
            id: hhd-australia-s-health-status
            brief: Australia has one of the highest life expectancies in the world, with cancers, heart disease and mental health conditions leading the burden of disease.
          - title: Variations in health between groups
            id: hhd-variations-health-between-groups
            brief: Aboriginal and Torres Strait Islander peoples, people in rural areas and people on low incomes have poorer health than other Australians.
          - title: Smoking, vaping and alcohol
            id: hhd-smoking-vaping-alcohol
            brief: Tobacco, vaping and alcohol add to Australia's burden of disease through cancers, heart disease and injury.
          - title: Overweight and obesity
            id: hhd-overweight-obesity
            brief: Excess body weight raises the risk of type 2 diabetes, heart disease and some cancers.
          - title: Nutritional imbalance
            id: hhd-nutritional-imbalance
            brief: Eating too little fruit, vegetables, dairy and fibre and too much fat, salt and sugar harms Australians' health.

      - title: Improvements in Australia's health
        id: vic-hhd-u34-1-2
        points:
          - title: Old public health
            id: hhd-old-public-health
            brief: Early government action to improve health through the physical environment, such as clean water, sewerage and safe housing.
          - title: The biomedical approach
            id: hhd-biomedical-approach
            brief: Treating disease once it occurs, using doctors, technology and medicine. It saves lives but is costly and does not prevent illness.
          - title: The social model of health
            id: hhd-social-model-health
            brief: An approach that addresses the social, economic and environmental causes of health, involving communities and reducing inequity.
          - title: The Ottawa Charter
            id: hhd-ottawa-charter
            brief: The WHO's framework for health promotion, with five action areas and the strategies enable, mediate and advocate.
          - title: The five action areas
            id: hhd-five-action-areas
            brief: Build healthy public policy, create supportive environments, strengthen community action, develop personal skills and reorient health services.
          - title: Health promotion
            id: hhd-tobacco-control-australia
            brief: Health promotion helps people gain control over their health, as Australia's mix of taxes, plain packaging and campaigns against smoking shows.

      - title: Promoting health in Australia
        id: vic-hhd-u34-1-5
        points:
          - title: Improving Aboriginal and Torres Strait Islander health
            id: hhd-improving-aboriginal-torres-strait
            brief: Programs led by community-controlled health organisations, which respect culture and self-determination, improve health and promote social justice.
          - title: Initiatives for healthy eating
            id: hhd-initiatives-healthy-eating
            brief: The Australian Dietary Guidelines, the Australian Guide to Healthy Eating and the Aboriginal and Torres Strait Islander Guide to Healthy Eating promote better diets.
          - title: Challenges to changing diets
            id: hhd-challenges-changing-diets
            brief: Culture, habits, cost, food environments and food marketing make lasting changes to what people eat hard.
          - title: Australia's health system and equity
            id: hhd-australia-s-health-system
            brief: Medicare, the PBS, the NDIS and private health insurance aim to give all Australians access to care, though gaps remain.
          - title: The National Disability Insurance Scheme
            id: hhd-national-disability-insurance-scheme
            brief: The NDIS funds support for Australians with a permanent and significant disability, to help them live more independently.

  - title: "Unit 4: Health and human development in a global context"
    chapters:
      - title: Global health and human development
        id: vic-hhd-u34-2-1
        points:
          - title: Human development
            id: hhd-human-development
            brief: Human development means creating conditions where people can reach their potential, lead productive lives and have choices.
          - title: The Human Development Index
            id: hhd-human-development-index
            brief: The HDI combines life expectancy, education and income per person into one measure of a country's development.
          - title: Low-, middle- and high-income countries
            id: hhd-low-middle-high-income
            brief: Countries differ in income, health care, education, infrastructure and life expectancy across these groups.
          - title: Health status across countries
            id: hhd-health-status-across-countries
            brief: Life expectancy, child mortality and causes of death differ widely between high-income and low- and middle-income countries.
          - title: Sustainability and health
            id: hhd-sustainability-health
            brief: Environmental, social and economic sustainability let health and human development last for future generations.

      - title: Factors in health and development
        id: vic-hhd-u34-2-2-2
        points:
          - title: Safe water and sanitation
            id: hhd-safe-water-sanitation
            brief: Lack of clean water and toilets spreads disease such as diarrhoea, a leading cause of child deaths in poorer countries.
          - title: Poverty
            id: hhd-poverty-inequality
            brief: Poverty limits access to food, housing, health care and education, which lowers health and development.
          - title: Discrimination and health
            id: hhd-discrimination-health
            brief: Discrimination by gender, ethnicity or disability can block access to education, work and health care.

      - title: Global trends
        id: vic-hhd-u34-2-3-2
        points:
          - title: Climate change and health
            id: hhd-climate-change-health
            brief: Rising temperatures, extreme weather and changing disease patterns threaten health, hitting poorer countries hardest.
          - title: Conflict and migration
            id: hhd-conflict-migration
            brief: War and forced migration destroy health systems, food supplies and shelter, and expose people to violence and disease.
          - title: World trade and health
            id: hhd-tobacco-alcohol-processed-food
            brief: Global trade spreads the marketing of tobacco, e-cigarettes and processed foods, raising chronic disease in many countries.
          - title: Tourism and health
            id: hhd-tourism-health
            brief: Tourism brings income and jobs but can spread disease and strain local resources.
          - title: Digital technologies and health
            id: hhd-digital-technology-world-trade
            brief: Digital technology spreads health information, telehealth and education, but access is uneven between and within countries.

      - title: The Sustainable Development Goals
        id: vic-hhd-u34-2-2
        points:
          - title: What the SDGs are
            id: hhd-sdgs-are
            brief: Seventeen goals agreed by United Nations members in 2015 to end poverty, protect the planet and improve lives by 2030.
          - title: SDG 3 and its targets
            id: hhd-sdg-3-targets
            brief: Goal 3 aims to ensure healthy lives and wellbeing for all at all ages, with targets on child and maternal deaths and disease.
          - title: Links between SDG 3 and other goals
            id: hhd-links-between-sdg-3
            brief: Progress on SDG 3 depends on ending poverty and hunger, education, gender equality, clean water and responsible consumption (SDGs 1, 2, 4, 5, 6 and 12).
          - title: The goal and objectives of the WHO
            id: hhd-world-health-organization-s
            brief: The WHO aims for the highest possible health for everyone, working on universal health coverage, health emergencies and healthier populations.

      - title: Aid and health programs
        id: vic-hhd-u34-2-3
        points:
          - title: Types of aid
            id: hhd-types-aid
            brief: Bilateral aid goes from one government to another, multilateral aid through bodies such as the UN, and non-government organisations give humanitarian and development aid.
          - title: Australia's aid program
            id: hhd-australia-s-aid-program
            brief: Australia gives aid through the Department of Foreign Affairs and Trade, mostly to countries in the Indo-Pacific.
          - title: Non-government organisations
            id: hhd-non-government-organisations
            brief: Groups such as charities run health and development programs, often working closely with local communities.
          - title: What makes a program work
            id: hhd-makes-program-work
            brief: Programs work best when they are run with the community, target real needs, build local skills and can be sustained.
          - title: Evaluating a health program
            id: hhd-evaluating-health-program
            brief: A program is judged by whether it reached its goals, who it helped, whether it lasts and its links to the SDGs.
          - title: Taking action for global health
            id: hhd-taking-action-global-health
            brief: Individuals can volunteer, fundraise, advocate or make ethical choices to support health and human development.
