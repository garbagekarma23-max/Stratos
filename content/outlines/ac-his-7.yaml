# Australian Curriculum History, Year 7: the deep time history of Australia and the ancient world (about 60,000 years
# ago to c.650 CE), with the year's overview and the historical concepts and skills, 40 points.
# Follows ACARA's Australian Curriculum: Humanities and Social Sciences, History 7-10, Version 9.0 (History curriculum
# content, Years 7-10), checked on australiancurriculum.edu.au in November 2026. Version 9.0 was approved in April 2022
# and released for use from 2023; each state and territory sets when its schools start it (Queensland schools teach
# every v9 learning area by the end of 2027). No newer version is announced. Western Australia and South Australia
# teach their own versions built on it.
# The first unit is the year's overview with the Historical knowledge and skills strand's concepts and skills, taught
# as ideas. The Deep time history of Australia sub-strand, which every school studies, is the second unit. The ancient
# world sub-strand is the third: schools study at least one of Egypt, Greece, Rome, India and China; this outline covers
# Egypt, Greece and Rome, one chapter each, and India and China can be added as chapters later. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-his-7
subject: History
bank: his
name: History, Year 7
about: "Australian Curriculum, Year 7: Deep time history and the ancient world"
short: History
years: [7]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: History, Version 9.0, Year 7"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [BCE and CE, Sahul, Lake Mungo, pharaoh, democracy, Roman Republic]

units:
  - title: Studying the ancient past
    chapters:
      - title: The ancient past in time
        id: ac-his-7-1-1
        points:
          - title: Prehistory and history
            id: his-prehistory-history
            brief: Prehistory is the time before writing, known mostly from archaeology. History in the narrow sense starts with written records, which began about 5,000 years ago.
          - title: BCE, CE and BP
            id: his-bce-ce-bp
            brief: Dates before the year 1 are BCE and count down towards it; dates after are CE and count up. Archaeologists also use BP, years before present.
          - title: Centuries and millennia
            id: his-centuries-millennia
            brief: A century is 100 years and a millennium is 1,000. The 5th century BCE runs from 500 to 401 BCE, and the 1st century CE from 1 to 100 CE.
          - title: Periods of the ancient past
            id: his-periods-ancient-past
            brief: Archaeologists name early periods by the main tool material, the Stone Age, then the Bronze Age, then the Iron Age, though each began at different times in different places.

      - title: How we know about the ancient past
        id: ac-his-7-1-2
        points:
          - title: Primary and secondary sources
            id: his-primary-secondary-sources
            brief: A primary source comes from the time being studied, such as a tomb painting. A secondary source is made later about that time, such as a textbook.
            codes: [AC9HH7S02]
          - title: Origin, content, context and purpose
            id: his-origin-content-context-purpose
            brief: To use a source, ask who made it and when, what it shows, what was happening at the time, and why it was made.
            codes: [AC9HH7S03]
          - title: Archaeology and stratigraphy
            id: his-archaeology-stratigraphy
            brief: Archaeologists excavate sites layer by layer. In undisturbed ground the deeper layers are usually older, which helps date what is found in them.
            codes: [AC9HH7K08]
          - title: Science and the ancient past
            id: his-science-ancient-past
            brief: Radiocarbon dating finds the age of once-living things, and DNA testing and CT scans reveal the health, diet and family of people such as Egyptian mummies.
            codes: [AC9HH7K08]
          - title: Protecting ancient sites
            id: his-protecting-ancient-sites
            brief: Building, war, looting and tourism threaten ancient sites. UNESCO lists World Heritage sites, and the temples of Abu Simbel were moved to save them from a dam's lake.
            codes: [AC9HH7K08]

      - title: Thinking historically
        id: ac-his-7-1-3
        points:
          - title: Asking historical questions
            id: his-asking-historical-questions
            brief: A good historical question is open, such as why or how, can be answered from evidence, and guides what sources to look for.
            codes: [AC9HH7S01]
          - title: Accuracy and usefulness of a source
            id: his-accuracy-usefulness-source
            brief: A source is accurate when other evidence agrees with it, and useful when it helps answer the question asked. A biased source can still be useful.
            codes: [AC9HH7S04]
          - title: Cause, effect, continuity and change
            id: his-cause-effect-continuity-change
            brief: A cause is what made something happen, and an effect is what followed. Continuity is what stayed the same over time, and change is what became different.
            codes: [AC9HH7S05]
          - title: Perspectives in the past
            id: his-perspectives-past
            brief: A perspective is a point of view shaped by a person's place in society, beliefs and time, so a pharaoh and a farmer saw the same event differently.
            codes: [AC9HH7S06]
          - title: Historical interpretations
            id: his-historical-interpretations
            brief: An interpretation is a historian's explanation of the past from the evidence. Historians can interpret the same evidence differently, and new evidence can change an interpretation.
            codes: [AC9HH7S07]

  - title: Deep time history of Australia
    chapters:
      - title: First peoples of Sahul
        id: ac-his-7-2-1
        points:
          - title: The Out of Africa theory
            id: his-out-africa-theory
            brief: Most scientists think modern humans evolved in Africa and spread from there across the world, moved by changes in climate and the search for food.
            codes: [AC9HH7K01]
          - title: Sahul and the sea crossing
            id: his-sahul-sea-crossing
            brief: In the last ice age, low seas joined Australia, New Guinea and Tasmania into one continent, Sahul. Its first people still had to cross open sea to reach it, so they were skilled seafarers.
            codes: [AC9HH7K02]
          - title: Dating the first arrivals
            id: his-dating-first-arrivals
            brief: Radiocarbon and thermoluminescence dating of sites such as Madjedbebe rock shelter in Arnhem Land show people have lived in Australia for more than 60,000 years.
            codes: [AC9HH7K02]
          - title: Lake Mungo
            id: his-lake-mungo
            brief: At Lake Mungo in the Willandra Lakes of western New South Wales, remains about 40,000 years old show early burial and cremation rites, among the oldest known in the world.
            codes: [AC9HH7K03]
          - title: The world's oldest continuing cultures
            id: his-world-s-oldest-continuing
            brief: First Nations Australians have the oldest continuing cultures on Earth, with practices such as the use of ochre and rock art carried on, and changed, over tens of thousands of years.
            codes: [AC9HH7K03]

      - title: Living on Country over deep time
        id: ac-his-7-2-2
        points:
          - title: Rising seas after the ice age
            id: his-rising-seas-after-ice
            brief: As the last ice age ended, seas rose and cut off Tasmania and New Guinea and formed the Torres Strait Islands. Oral traditions of First Nations Australians tell of land lost to the sea.
            codes: [AC9HH7K04]
          - title: Megafauna and changing climate
            id: his-megafauna-changing-climate
            brief: Giant animals such as Diprotodon lived in Australia alongside its first peoples before dying out. A drier climate changed where people could find water and food.
            codes: [AC9HH7K04]
          - title: Stone tools and technology
            id: his-stone-tools-technology
            brief: Early First Nations Australians made ground-edge axes, among the oldest known in the world, as well as grindstones for seeds and hafted tools fixed to handles.
            codes: [AC9HH7K05]
          - title: Budj Bim and land management
            id: his-budj-bim-land-management
            brief: The Gunditjmara built channels and weirs at Budj Bim in western Victoria to trap and farm eels thousands of years ago. Cultural burning and water management cared for Country elsewhere.
            codes: [AC9HH7K05]
          - title: Kinship, moieties and totems
            id: his-kinship-moieties-totems
            brief: Kinship systems, moieties and totems set out each person's relationships, roles and responsibilities to others and to Country, and are passed on through lore.
            codes: [AC9HH7K06]
          - title: Caring for heritage and ancestral remains
            id: his-caring-heritage-ancestral-remains
            brief: Ancestral remains and sacred sites belong to living communities, so research needs their consent. The return of Mungo Man to Country in 2017 followed decades of advocacy.
            codes: [AC9HH7K07]

  - title: The ancient world
    chapters:
      - title: Ancient Egypt
        id: ac-his-7-3-1
        points:
          - title: The gift of the Nile
            id: his-gift-nile
            brief: The Nile's yearly flood left rich black soil along its banks in a desert land, so Egypt's farming, towns and power grew along the river.
            codes: [AC9HH7K09]
          - title: Egypt's social pyramid
            id: his-egypt-s-social-pyramid
            brief: The pharaoh ruled at the top, then viziers, priests and nobles, then scribes and craftworkers, with farmers and slaves at the bottom. Women could own property.
            codes: [AC9HH7K10]
          - title: Death and the afterlife in Egypt
            id: his-death-afterlife-egypt
            brief: Egyptians believed the soul lived on if the body was kept, so the wealthy were mummified and buried with goods, first in pyramids and later in hidden tombs.
            codes: [AC9HH7K11]
          - title: Egypt's wars and treaties
            id: his-egypt-s-wars-treaties
            brief: Egypt fought Nubia and the Hittites. After the Battle of Kadesh, Ramesses II and the Hittite king signed one of the earliest known peace treaties.
            codes: [AC9HH7K12]
          - title: Hatshepsut
            id: his-hatshepsut
            brief: Hatshepsut ruled as pharaoh for about 20 years, sent a trading expedition to the land of Punt, and built a great temple at Deir el-Bahari.
            codes: [AC9HH7K13]

      - title: Ancient Greece
        id: ac-his-7-3-2
        points:
          - title: Mountains, sea and city-states
            id: his-mountains-sea-city-states
            brief: Greece's mountains split it into separate city-states, each called a polis with its own government, and its long coast made the Greeks sailors and traders.
            codes: [AC9HH7K09]
          - title: Democracy in Athens
            id: his-democracy-athens
            brief: Athenian citizens voted directly on laws in the Assembly. Only free adult men born to Athenian parents were citizens, so women, slaves and foreigners had no vote.
            codes: [AC9HH7K10]
          - title: Life in Sparta
            id: his-life-sparta
            brief: Sparta was built for war. Boys trained as soldiers from age 7, and the helots, an enslaved people, farmed the land.
            codes: [AC9HH7K10]
          - title: The Persian Wars
            id: his-persian-wars
            brief: The Greek city-states joined to defeat Persian invasions, at Marathon in 490 BCE and at Salamis in 480 BCE, which led to Athens' golden age.
            codes: [AC9HH7K12]
          - title: Gods and the Olympic Games
            id: his-gods-olympic-games
            brief: The Greeks worshipped many gods led by Zeus, consulted oracles, and held the Olympic Games at Olympia in his honour every four years.
            codes: [AC9HH7K11]

      - title: Ancient Rome
        id: ac-his-7-3-3
        points:
          - title: The Roman Republic
            id: his-roman-republic
            brief: After driving out its kings, Rome was run by two elected consuls and the Senate. Patricians held most power, and plebeians fought for a share of it.
            codes: [AC9HH7K10]
          - title: Families and slaves in Rome
            id: his-families-slaves-rome
            brief: The father, the paterfamilias, had power over his household. Slaves did much of Rome's work, and some were freed and became citizens.
            codes: [AC9HH7K10, AC9HH7K11]
          - title: The army and Rome's expansion
            id: his-army-rome-s-expansion
            brief: Well-trained legions helped Rome spread from a city on the Tiber across the Mediterranean, defeating Carthage in the Punic Wars.
            codes: [AC9HH7K09, AC9HH7K12]
          - title: From Julius Caesar to Augustus
            id: his-from-julius-caesar-augustus
            brief: Julius Caesar took power and was murdered in 44 BCE. His heir Octavian became Augustus, the first emperor, in 27 BCE, ending the Republic.
            codes: [AC9HH7K13]
          - title: Pompeii
            id: his-pompeii
            brief: The eruption of Vesuvius in 79 CE buried Pompeii in ash, preserving homes, shops, graffiti and the shapes of victims, which show everyday Roman life.
            codes: [AC9HH7K08, AC9HH7K11]
