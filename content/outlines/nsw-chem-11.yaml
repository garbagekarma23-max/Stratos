# NSW Chemistry, Year 11: Modules 1 to 4, 39 points.
# Drafted from NESA's Chemistry Stage 6 Syllabus (2017), the syllabus taught in Year 11 in 2026. The structure follows
# the syllabus: each module is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: a Chemistry 11-12 Syllabus (2025) replaces this one. Search results disagreed on the start (Year 11
# from 2027 or 2028). Check NESA's Chemistry page before the first run.

id: nsw-chem-11
subject: Chemistry
bank: chem
name: Chemistry, Year 11
about: HSC, Matter, quantities, reactions and energy
short: Chemistry
years: [11]
place: nsw
kind: standard
syllabus: NSW Chemistry Stage 6 Syllabus (2017), Year 11 course, Modules 1 to 4
note: Follows the NSW Chemistry syllabus. Not made or endorsed by NESA.
chips: [isotope, mole, limiting reagent, redox, enthalpy]

units:
  - title: Properties and structure of matter
    chapters:
      - title: Matter and atoms
        id: nsw-chem-11-1-1
        points:
          - title: Pure substances and mixtures
            id: chem-pure-substances-mixtures
            brief: Elements and compounds are pure substances. Mixtures can be separated by physical means such as filtration, distillation and chromatography, based on differences in properties.
          - title: Atomic structure
            id: chem-atomic-structure
            brief: Atoms have a nucleus of protons and neutrons, with electrons around it. The atomic number is the number of protons and the mass number counts protons and neutrons.
          - title: Isotopes
            id: chem-isotopes
            brief: Atoms of the same element with different numbers of neutrons. Some are radioactive. Relative atomic mass is a weighted average of the isotopes.
          - title: Electron configuration
            id: chem-electron-configuration
            brief: Electrons fill energy levels and subshells (s, p, d) in order. The outer electrons decide how an element reacts.
          - title: Periodic table trends
            id: chem-periodic-table-trends
            brief: Across a period, atomic radius falls and electronegativity and first ionisation energy rise. Down a group, atomic radius rises and the other two fall.

      - title: Bonding
        id: nsw-chem-11-1-2
        points:
          - title: Ionic bonding
            id: chem-ionic-bonding
            brief: Metals lose electrons and non-metals gain them, forming ions held in a lattice. Ionic compounds have high melting points and conduct when melted or dissolved.
          - title: Covalent bonding
            id: chem-covalent-bonding
            brief: Non-metal atoms share pairs of electrons. Covalent molecular substances have low melting points. Covalent network solids, such as diamond, are very hard.
          - title: Metallic bonding
            id: chem-metallic-bonding
            brief: Metal ions in a sea of delocalised electrons, which explains why metals conduct and can be bent and shaped.
          - title: Shapes and polarity of molecules
            id: chem-shapes-polarity-molecules
            brief: Electron pairs push apart, giving shapes such as linear, bent and tetrahedral. Uneven sharing of electrons in an uneven shape makes a molecule polar.
          - title: Intermolecular forces
            id: chem-intermolecular-forces
            brief: Dispersion forces, dipole-dipole forces and hydrogen bonds hold molecules to each other and explain differences in boiling points.
          - title: Allotropes
            id: chem-allotropes
            brief: Different forms of the same element, such as diamond, graphite and fullerenes for carbon, with different structures and properties.

  - title: Introduction to quantitative chemistry
    chapters:
      - title: The mole
        id: nsw-chem-11-2-1
        points:
          - title: Balanced equations
            id: chem-balanced-equations
            brief: Mass is conserved in a reaction, so equations are balanced with the same number of each atom on both sides.
          - title: The mole and Avogadro's number
            id: chem-mole-avogadro-s-number
            brief: A mole is 6.022 × 10²³ particles. It lets chemists count particles by weighing.
          - title: Molar mass and moles
            id: chem-molar-mass-moles
            brief: n = m/M, where n is moles, m is mass in grams and M is molar mass in g/mol.
          - title: Limiting reagents
            id: chem-limiting-reagents
            brief: The reactant that runs out first limits how much product forms. The other is in excess.
          - title: Empirical formulas and percentage composition
            id: chem-empirical-formulas-percentage-composition
            brief: The simplest whole-number ratio of atoms in a compound, found from the mass of each element.

      - title: Solutions and gases
        id: nsw-chem-11-2-2
        points:
          - title: Concentration
            id: chem-concentration
            brief: c = n/V in mol/L, and other units such as g/L and parts per million.
          - title: Dilution
            id: chem-dilution
            brief: Adding water lowers concentration but keeps the moles of solute, so c₁V₁ = c₂V₂.
          - title: Gas laws
            id: chem-gas-laws
            brief: Boyle's, Charles's and Gay-Lussac's laws relate pressure, volume and temperature, with temperature always in kelvin.
          - title: The ideal gas law
            id: chem-ideal-gas-law
            brief: PV = nRT links pressure, volume, moles and temperature for an ideal gas.
          - title: Molar volume of gases
            id: chem-molar-volume-gases
            brief: One mole of any gas takes up the same volume at the same temperature and pressure, such as 24.79 L at 25°C and 100 kPa.

  - title: Reactive chemistry
    chapters:
      - title: Types of reactions
        id: nsw-chem-11-3-1
        points:
          - title: Synthesis, decomposition and combustion
            id: chem-synthesis-decomposition-combustion
            brief: Synthesis joins substances, decomposition breaks one apart, and combustion burns a fuel in oxygen, giving carbon dioxide and water when complete.
          - title: Precipitation reactions
            id: chem-precipitation-reactions
            brief: Two solutions mix to form an insoluble solid. Solubility rules predict which ionic compounds will precipitate.
          - title: Reactions of acids
            id: chem-reactions-acids
            brief: Acids react with metals to give a salt and hydrogen, with carbonates to give a salt, water and carbon dioxide, and with bases to give a salt and water.
          - title: Rates of reaction
            id: chem-rates-reaction
            brief: Collision theory explains rates. Higher temperature, concentration and surface area, and a catalyst, all speed a reaction up.
          - title: Activation energy and catalysts
            id: chem-activation-energy-catalysts
            brief: Particles must collide with enough energy to react. A catalyst gives a path with lower activation energy and is not used up.

      - title: Metals and redox
        id: nsw-chem-11-3-2
        points:
          - title: The activity series of metals
            id: chem-activity-series-metals
            brief: Metals ranked by how easily they lose electrons. A more reactive metal displaces a less reactive one from its compounds.
          - title: Oxidation and reduction
            id: chem-oxidation-reduction
            brief: Oxidation is loss of electrons and reduction is gain. They always happen together in a redox reaction.
          - title: Oxidation numbers
            id: chem-oxidation-numbers
            brief: Rules for assigning oxidation numbers, used to tell which species is oxidised and which is reduced.
          - title: Half-equations
            id: chem-half-equations
            brief: Writing the oxidation and reduction halves of a redox reaction separately, balanced for atoms and charge.
          - title: Galvanic cells
            id: chem-galvanic-cells
            brief: A redox reaction split into two half-cells joined by a wire and salt bridge, so electrons flow through the wire as a current. Standard potentials predict the voltage.

  - title: Drivers of reactions
    chapters:
      - title: Energy in reactions
        id: nsw-chem-11-4-1
        points:
          - title: Exothermic and endothermic reactions
            id: chem-exothermic-endothermic-reactions
            brief: Exothermic reactions release heat, so ΔH is negative. Endothermic reactions absorb heat, so ΔH is positive.
          - title: Energy profile diagrams
            id: chem-energy-profile-diagrams
            brief: Diagrams of energy against the course of a reaction, showing reactants, products, activation energy and ΔH.
          - title: Calorimetry
            id: chem-calorimetry
            brief: q = mcΔT measures the heat released or absorbed, such as in the combustion of a fuel or dissolving a salt.
          - title: Hess's law
            id: chem-hess-s-law
            brief: The enthalpy change of a reaction is the same however it happens, so equations and their ΔH values can be added.
          - title: Bond energies
            id: chem-bond-energies
            brief: Breaking bonds takes energy and making them releases it. ΔH is roughly the energy to break bonds minus the energy released making them.

      - title: Entropy and spontaneity
        id: nsw-chem-11-4-2
        points:
          - title: Entropy
            id: chem-entropy
            brief: Entropy measures how spread out energy and matter are. Gases have more entropy than liquids, and liquids more than solids.
          - title: Gibbs free energy
            id: chem-gibbs-free-energy
            brief: ΔG = ΔH - TΔS. A reaction is spontaneous when ΔG is negative.
          - title: Predicting spontaneity
            id: chem-predicting-spontaneity
            brief: Using the signs of ΔH and ΔS to decide whether a reaction is spontaneous at all temperatures, at none, or only at high or low ones.
