# NSW Science, Stage 5 (Years 9 and 10): Working scientifically and the eight Stage 5 focus areas, 71 points.
# Follows NESA's Science 7-10 Syllabus (2023), checked on the NSW Curriculum website (curriculum.nsw.edu.au) in
# November 2026. It replaces the Science 7-10 Syllabus (2018). Schools teach it in Year 9 from 2026 and Year 10 from
# 2027 (the staggered start NSW recommends), and the 2018 syllabus must not be taught after December 2027, so this
# follows the new syllabus.
# Structure: Working scientifically and Data science 2 make the first unit. Energy with Waves and motion is a unit;
# Disease with Genetics and evolutionary change is a unit; Environmental sustainability is a unit; Materials with
# Reactions is a unit. Each focus area's content groups become chapters, merged where a group is small. The depth study
# and the hands-on investigations are taught only as the ideas behind them. Outcome codes (SC5-...) are on the points.
# Aboriginal and Torres Strait Islander knowledges are included where the syllabus names them: plant medicines,
# artworks recording changes in animals, sustainable harvesting and the use of minerals. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-sci-s5
subject: Science
bank: sci
name: Science, Stage 5
about: NSW Stage 5, Years 9 and 10
short: Science
years: [9, 10]
level: Stage 5
place: nsw
kind: standard
syllabus: NSW Science 7-10 Syllabus (2023), Stage 5
note: Follows the NSW Science syllabus. Not made or endorsed by NESA.
chips: [Ohm's law, natural selection, Punnett square, greenhouse effect, half-life, pseudoscience]

units:
  - title: Working scientifically and data
    chapters:
      - title: Questions, claims and evidence
        id: nsw-sci-s5-1-1
        points:
          - title: Hypotheses and investigable questions
            id: sci-hypotheses-investigable-questions
            brief: An investigable question can be answered by collecting data. A hypothesis is a testable explanation that predicts what will happen if it is right.
            codes: [SC5-WS-02, SC5-DA2-01]
          - title: Validity, reliability and accuracy
            id: sci-validity-reliability-accuracy
            brief: A valid test measures what it aims to and controls other variables, reliable results come out the same when repeated, and accurate results are close to the true value.
            codes: [SC5-WS-03, SC5-WS-06]
          - title: Science and pseudoscience
            id: sci-science-pseudoscience
            brief: Science tests claims with evidence and changes its mind when the evidence does. Pseudoscience looks scientific but avoids testing, relies on stories and never changes.
            codes: [SC5-DA2-01]
          - title: Judging claims and sources
            id: sci-judging-claims-sources
            brief: Check who made a claim and why, whether the evidence and sample are good enough, and whether a graph's scale or selected data could mislead.
            codes: [SC5-DA2-01, SC5-WS-06]
          - title: Large datasets and descriptive statistics
            id: sci-large-datasets-descriptive-statistics
            brief: Large datasets, such as weather or health records, are summed up with the mean, median, mode and range, and with graphs, to show patterns clearly.
            codes: [SC5-DA2-01, SC5-WS-05]
          - title: Correlation and causation
            id: sci-correlation-causation-nsw
            brief: Two variables that change together are correlated, but that does not prove one causes the other. A third factor or chance may explain the link.
            codes: [SC5-DA2-01]

  - title: Energy, waves and motion
    chapters:
      - title: Energy for the future
        id: nsw-sci-s5-2-1
        points:
          - title: Energy efficiency
            id: sci-energy-efficiency
            brief: In any device the total energy out equals the energy in, but some is wasted, often as heat. Efficiency is the useful energy out divided by the energy in, as a percentage.
            codes: [SC5-EGY-01]
          - title: Generating electricity
            id: sci-generating-electricity
            brief: Electricity is made from non-renewable sources, such as coal and gas, and renewable ones, such as solar, wind and hydro, each with costs and benefits for cost, emissions and reliability.
            codes: [SC5-EGY-01]
          - title: Future energy demand
            id: sci-future-energy-demand
            brief: Energy use has grown with population and technology. Trends in the data help predict future demand and explain why cleaner energy sources are being developed.
            codes: [SC5-EGY-01]

      - title: Electric circuits
        id: nsw-sci-s5-2-2
        points:
          - title: Circuits and circuit diagrams
            id: sci-circuits-circuit-diagrams
            brief: A complete circuit needs a power source, a closed path of wires and a load, and circuit diagrams draw each part with a standard symbol.
            codes: [SC5-EGY-01]
          - title: Series and parallel circuits
            id: sci-series-parallel-circuits
            brief: In a series circuit the current is the same everywhere and passes through each part in turn. In a parallel circuit the current splits between branches.
            codes: [SC5-EGY-01]
          - title: "Ohm's law"
            id: sci-ohm-s-law
            brief: Voltage equals current times resistance (V = IR), so for a fixed resistance the current rises as the voltage rises.
            codes: [SC5-EGY-01]
          - title: Electrical energy and star ratings
            id: sci-electrical-energy-star-ratings
            brief: An appliance uses more energy the higher its power and the longer it runs, and energy star ratings compare how efficiently similar appliances use it.
            codes: [SC5-EGY-01]

      - title: Waves
        id: nsw-sci-s5-2-3
        points:
          - title: Mechanical and electromagnetic waves
            id: sci-mechanical-electromagnetic-waves
            brief: Waves carry energy without carrying matter along. Mechanical waves, such as sound, need a medium, while electromagnetic waves, such as light, can travel through a vacuum.
            codes: [SC5-WAM-01]
          - title: Transverse and longitudinal waves
            id: sci-transverse-longitudinal-waves
            brief: In a transverse wave particles move at right angles to the wave's direction. In a longitudinal wave, such as sound, they move back and forth along it.
            codes: [SC5-WAM-01]
          - title: The wave equation
            id: sci-wave-equation
            brief: Waves are described by wavelength, frequency, amplitude and speed, and wave speed equals frequency times wavelength.
            codes: [SC5-WAM-01]
          - title: The electromagnetic spectrum
            id: sci-electromagnetic-spectrum-nsw
            brief: Radio waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays differ in wavelength and energy, which decides their uses and risks.
            codes: [SC5-WAM-01]

      - title: Sound and light
        id: nsw-sci-s5-2-4
        points:
          - title: Pitch and loudness
            id: sci-pitch-loudness
            brief: Sound travels as compressions and rarefactions. A higher frequency gives a higher pitch, and a larger amplitude gives a louder sound.
            codes: [SC5-WAM-01]
          - title: The Doppler effect and ultrasound
            id: sci-doppler-effect-ultrasound
            brief: A sound's pitch rises as its source comes towards us and falls as it moves away. Ultrasound, too high to hear, is reflected inside the body to make medical images.
            codes: [SC5-WAM-01]
          - title: Reflection, refraction and absorption
            id: sci-reflection-refraction-absorption
            brief: Light bounces off surfaces (reflection), bends when it passes into a new material (refraction) and is taken in by dark surfaces (absorption).
            codes: [SC5-WAM-01]
          - title: Studying stars with light
            id: sci-studying-stars-with-light
            brief: Splitting a star's light into a spectrum shows which elements it contains and whether it is moving towards or away from us.
            codes: [SC5-WAM-01]

      - title: Motion and Newton's laws
        id: nsw-sci-s5-2-5
        points:
          - title: Speed, velocity and displacement
            id: sci-speed-velocity-displacement
            brief: Distance is how far something travels and displacement is how far it ends up from the start in a direction. Average velocity is the change in displacement divided by time.
            codes: [SC5-WAM-02]
          - title: Acceleration
            id: sci-acceleration
            brief: Acceleration is the change in velocity divided by the time taken, in metres per second squared, and on a velocity-time graph it is the slope.
            codes: [SC5-WAM-02]
          - title: "Newton's first law"
            id: sci-newton-s-first-law-nsw
            brief: An object stays still or keeps moving at a steady velocity unless an unbalanced force, the net force, acts on it. This is inertia.
            codes: [SC5-WAM-02]
          - title: "Newton's second law"
            id: sci-newton-s-second-law-nsw
            brief: Net force equals mass times acceleration (F = ma), so a bigger force or a smaller mass gives a bigger acceleration.
            codes: [SC5-WAM-02]
          - title: "Newton's third law"
            id: sci-newton-s-third-law-nsw
            brief: When one object pushes on another, the second pushes back with an equal force in the opposite direction, as when a rocket pushes gas out and the gas pushes it forward.
            codes: [SC5-WAM-02]

  - title: Body, disease and genetics
    chapters:
      - title: Coordination and homeostasis
        id: nsw-sci-s5-3-1
        points:
          - title: Homeostasis
            id: sci-homeostasis
            brief: The body keeps conditions such as temperature and blood glucose stable, using feedback that reverses any change.
            codes: [SC5-DIS-01]
          - title: The nervous system
            id: sci-nervous-system-nsw
            brief: Receptors detect a stimulus, nerves carry fast electrical messages to the brain or spinal cord, and effectors such as muscles respond. A reflex skips the brain.
            codes: [SC5-DIS-01]
          - title: The endocrine system
            id: sci-endocrine-system-nsw
            brief: Glands release hormones into the blood, which act more slowly and for longer than nerves, such as insulin lowering blood glucose.
            codes: [SC5-DIS-01]

      - title: Disease
        id: nsw-sci-s5-3-2
        points:
          - title: Infectious and non-infectious diseases
            id: sci-infectious-non-infectious-diseases
            brief: Infectious diseases are caused by pathogens and can spread. Non-infectious diseases, such as heart disease and type 2 diabetes, come from genes, lifestyle or environment, and healthy habits lower the risk.
            codes: [SC5-DIS-01]
          - title: How pathogens spread
            id: sci-pathogens-spread
            brief: Bacteria, viruses, fungi and parasites spread through contact, air, water, food and animals, and hygiene, clean water and isolation slow the spread.
            codes: [SC5-DIS-01]
          - title: The body's defences
            id: sci-body-s-defences
            brief: Skin, mucus and stomach acid stop most pathogens getting in. If they do, white blood cells attack them and make antibodies that recognise them next time.
            codes: [SC5-DIS-01]
          - title: Vaccination and immunity
            id: sci-vaccination-immunity
            brief: A vaccine trains the immune system with a harmless form of a pathogen, and when most people are vaccinated, data show the disease becomes rare and protects those who cannot be.
            codes: [SC5-DIS-01]
          - title: Aboriginal and Torres Strait Islander plant medicines
            id: sci-aboriginal-torres-strait-islander-nsw
            brief: Aboriginal and Torres Strait Islander Peoples have long used plants to prevent and treat illness, such as tea tree leaves used by Bundjalung people on wounds and for coughs.
            codes: [SC5-DIS-01]

      - title: DNA and inheritance
        id: nsw-sci-s5-3-3
        points:
          - title: DNA, genes and chromosomes
            id: sci-dna-genes-chromosomes-nsw
            brief: DNA carries genetic information. A gene is a section of DNA coding for a trait, and DNA is coiled into chromosomes in the nucleus.
            codes: [SC5-GEV-02]
          - title: The double helix
            id: sci-double-helix
            brief: DNA is two strands twisted into a double helix, with bases that pair A with T and C with G. Its structure was found using the work of Franklin, Wilkins, Watson and Crick.
            codes: [SC5-GEV-02]
          - title: Sexual and asexual reproduction
            id: sci-sexual-asexual-reproduction-nsw
            brief: Asexual reproduction makes offspring identical to one parent. Sexual reproduction mixes genes from two parents, so offspring vary.
            codes: [SC5-GEV-02]
          - title: Mutations
            id: sci-mutations-nsw
            brief: A mutation is a change in DNA. It may be harmful, helpful or have little effect, and only mutations in sex cells pass to offspring.
            codes: [SC5-GEV-02]
          - title: Dominant and recessive alleles
            id: sci-dominant-recessive-alleles
            brief: Each trait has two alleles, one from each parent. A dominant allele shows over a recessive one, and a Punnett square predicts the chances of each genotype and phenotype in offspring.
            codes: [SC5-GEV-02]

      - title: Genetic technology and evolution
        id: nsw-sci-s5-3-4
        points:
          - title: Genetic technologies and testing
            id: sci-genetic-technologies-testing
            brief: Genetic engineering, cloning and genetic testing are used in medicine, farming, industry and conservation, and raise social, economic and ethical questions such as privacy.
            codes: [SC5-GEV-02]
          - title: Natural selection
            id: sci-natural-selection-nsw
            brief: Individuals vary, and those with traits better suited to the environment survive and reproduce more, so those traits become more common over generations.
            codes: [SC5-GEV-01]
          - title: Evidence for evolution
            id: sci-evidence-evolution-nsw
            brief: Fossils, similar bone structures in different animals and shared DNA show that species have changed over time and share common ancestors.
            codes: [SC5-GEV-01]
          - title: Darwin, Wallace and the theory of evolution
            id: sci-darwin-wallace-theory-evolution
            brief: Darwin and Wallace each proposed natural selection from their observations, and later evidence from genetics strengthened and refined the theory.
            codes: [SC5-GEV-01]
          - title: Aboriginal rock art as a record of change
            id: sci-aboriginal-rock-art-as
            brief: Some Aboriginal rock art shows animals no longer found in that area, such as the thylacine in Arnhem Land, recording changes in plants and animals over thousands of years.
            codes: [SC5-GEV-01]

  - title: Environmental sustainability
    chapters:
      - title: Climate change
        id: nsw-sci-s5-4-1
        points:
          - title: Weather and climate
            id: sci-weather-climate
            brief: Weather is the conditions over hours or days. Climate is the average pattern over 30 years or more, shaped by natural processes such as ocean currents and volcanic eruptions.
            codes: [SC5-ENV-01]
          - title: The enhanced greenhouse effect
            id: sci-enhanced-greenhouse-effect
            brief: Greenhouse gases trap heat that keeps Earth warm. Burning fossil fuels since industrialisation has added more of them, strengthening the natural effect into the enhanced greenhouse effect, so global temperatures have risen.
            codes: [SC5-ENV-01]
          - title: Impacts of climate change
            id: sci-impacts-climate-change
            brief: Satellites and other data show rising sea levels, warmer oceans and shrinking ice, and climate change alters the water cycle and puts ecosystems under stress.
            codes: [SC5-ENV-01]
          - title: Reducing emissions
            id: sci-reducing-emissions
            brief: Emissions can be cut by renewable energy, using less energy and capturing carbon, and each method has advantages and limits.
            codes: [SC5-ENV-01]

      - title: Sustainable resource use
        id: nsw-sci-s5-4-2
        points:
          - title: Pollution
            id: sci-pollution
            brief: Human activities pollute air, water and soil, such as plastics in oceans and fertiliser running into rivers, harming living things and people's health.
            codes: [SC5-ENV-01]
          - title: Aboriginal and Torres Strait Islander sustainable harvesting
            id: sci-aboriginal-torres-strait-islander-2-nsw
            brief: Aboriginal and Torres Strait Islander Peoples developed harvesting practices from deep ecological knowledge, such as taking only part of a resource and following seasons, so it lasts.
            codes: [SC5-ENV-01]
          - title: Reduce, reuse and recycle
            id: sci-reduce-reuse-recycle
            brief: Using less, reusing items and recycling materials such as aluminium, paper and plastic saves resources and energy, and scientists keep finding new ways to recycle.
            codes: [SC5-ENV-01]

  - title: Materials and reactions
    chapters:
      - title: Chemical bonding
        id: nsw-sci-s5-5-1
        points:
          - title: Ions and ionic bonding
            id: sci-ions-ionic-bonding
            brief: Atoms gain or lose electrons to get a full outer shell, forming ions. Metal and non-metal ions attract in ionic compounds, such as sodium chloride (NaCl).
            codes: [SC5-MAT-01]
          - title: Covalent bonding
            id: sci-covalent-bonding
            brief: Non-metal atoms share electrons to form molecules, such as water, and some elements, such as oxygen (O2), exist as pairs of atoms.
            codes: [SC5-MAT-01]
          - title: Metallic bonding
            id: sci-metallic-bonding
            brief: In metals, positive ions sit in a sea of shared electrons that can move, which is why metals conduct electricity and can be bent.
            codes: [SC5-MAT-01]
          - title: Properties from bonding
            id: sci-properties-from-bonding
            brief: Ionic compounds have high melting points and conduct when dissolved, covalent molecules often have low melting points, and these properties decide their uses.
            codes: [SC5-MAT-01]

      - title: Carbon compounds
        id: nsw-sci-s5-5-2
        points:
          - title: Organic compounds and hydrocarbons
            id: sci-organic-compounds-hydrocarbons
            brief: Organic compounds are based on carbon, and hydrocarbons contain only carbon and hydrogen. Most come from crude oil, natural gas and living things.
            codes: [SC5-MAT-01]
          - title: Fractional distillation of crude oil
            id: sci-fractional-distillation-crude-oil
            brief: Crude oil is heated and its parts separate in a tall column by boiling point, giving products such as petrol, diesel and bitumen.
            codes: [SC5-MAT-01]
          - title: Naming alkanes
            id: sci-naming-alkanes
            brief: Alkanes with one to eight carbons are named methane, ethane, propane, butane, pentane, hexane, heptane and octane, and drawn with their bonds.
            codes: [SC5-MAT-01]
          - title: Complete and incomplete combustion
            id: sci-complete-incomplete-combustion
            brief: With enough oxygen, hydrocarbons burn to carbon dioxide and water. With too little, they also make carbon monoxide and soot and release less energy.
            codes: [SC5-MAT-01]

      - title: Resources and polymers
        id: nsw-sci-s5-5-3
        points:
          - title: "Australia's mineral resources"
            id: sci-australia-s-mineral-resources
            brief: Australia mines minerals such as iron ore, bauxite and coal, which are finite, and extracting them can damage land, water and habitats.
            codes: [SC5-MAT-01]
          - title: Aboriginal and Torres Strait Islander uses of minerals
            id: sci-aboriginal-torres-strait-islander-3-nsw
            brief: Aboriginal and Torres Strait Islander Peoples have used minerals for many purposes, such as ochre for paint and ceremony and hard stone for axes and grinding tools.
            codes: [SC5-MAT-01]
          - title: Polymers and plastics
            id: sci-polymers-plastics
            brief: Polymers are long chains of small repeating molecules, mostly made from crude oil. Many plastics last for centuries in the environment, so alternatives are being developed.
            codes: [SC5-MAT-01]

      - title: Chemical reactions
        id: nsw-sci-s5-5-4
        points:
          - title: Conservation of mass
            id: sci-conservation-mass-nsw
            brief: In a chemical reaction atoms are rearranged, not made or destroyed, so in a closed system the total mass stays the same.
            codes: [SC5-RXN-01]
          - title: Balanced chemical equations
            id: sci-balanced-chemical-equations
            brief: A balanced equation has the same number of each kind of atom on both sides, with states shown as (s), (l), (g) and (aq).
            codes: [SC5-RXN-01]
          - title: Types of reactions
            id: sci-types-reactions
            brief: Common reactions include combustion, decomposition, precipitation, where two solutions form an insoluble solid, and acids reacting with metals or carbonates.
            codes: [SC5-RXN-01]
          - title: Acids, bases and neutralisation
            id: sci-acids-bases-neutralisation-nsw
            brief: The pH scale runs from acidic below 7 to basic above 7, with pure water at 7. An acid and a base neutralise each other to make a salt and water.
            codes: [SC5-RXN-01]
          - title: Rates of reaction
            id: sci-rates-reaction-nsw
            brief: Reactions go faster at higher temperature, higher concentration, with more surface area or with a catalyst, because particles collide more often or with more energy.
            codes: [SC5-RXN-02]

      - title: Nuclear reactions
        id: nsw-sci-s5-5-5
        points:
          - title: Where elements come from
            id: sci-where-elements-come-from
            brief: Hydrogen and helium formed soon after the Big Bang, and heavier elements formed later by fusion inside stars.
            codes: [SC5-RXN-01]
          - title: Radioactive decay and half-life
            id: sci-radioactive-decay-half-life
            brief: An unstable nucleus gives off alpha, beta or gamma radiation as it decays. Half-life is the time for half the atoms in a sample to decay.
            codes: [SC5-RXN-01]
          - title: Uses of radioisotopes
            id: sci-uses-radioisotopes
            brief: Radioisotopes are used to find and treat cancer, sterilise equipment, check for leaks and date ancient materials, with care because radiation can harm cells.
            codes: [SC5-RXN-01]
          - title: Fission and fusion
            id: sci-fission-fusion
            brief: Fission splits a heavy nucleus, as in nuclear power stations, which leave radioactive waste. Fusion joins light nuclei, as in the Sun. Both release huge amounts of energy.
            codes: [SC5-RXN-01]
