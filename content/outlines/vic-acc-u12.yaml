# VCE Accounting, Units 1 and 2: accounting for a service business and a trading business, 47 points.
# Checked against the VCAA's VCE Accounting Study Design, accredited from 2025, in October 2026. Each unit is a unit
# here, and each area of study is a chapter, or two when it is large. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW has no Accounting course yet, so this is a new bank (acc). The matcher still looks in Business Studies and
# Economics, which count as the same subject family.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-acc-u12
subject: Accounting
bank: acc
name: Accounting, Units 1 and 2
about: VCE, Service and trading businesses
short: Accounting
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Accounting Study Design (from 2025), Units 1 and 2
note: Follows the VCE Accounting study design. Not made or endorsed by the VCAA.
chips: [source document, accounting equation, cash basis, perpetual inventory, depreciation]

units:
  - title: "Unit 1: The role of accounting in business"
    chapters:
      - title: Starting a business
        id: vic-acc-u12-1-1
        points:
          - title: Why people start a business
            id: acc-people-start-business
            brief: People start a business to be their own boss, earn a profit, use a skill or meet a need they have spotted.
          - title: Financing a new business
            id: acc-financing-new-business
            brief: A new business needs money and other resources, from the owner (internal finance) or from lenders and investors (external finance).
          - title: Why small businesses succeed or fail
            id: acc-small-businesses-succeed-or
            brief: Good records, cash management, planning and market knowledge help small businesses last. Poor records and cash shortages are common reasons they close.
          - title: Help from professionals
            id: acc-help-from-professionals
            brief: Accountants, business advisers and professional bodies help owners plan, keep records and avoid costly mistakes.
          - title: Other ways to invest
            id: acc-other-ways-invest
            brief: An owner could instead put money in a bank, shares or property, so a business must earn more than these to be worth the risk.
          - title: Types of business ownership
            id: acc-types-business-ownership
            brief: Sole traders, partnerships and companies differ in who owns them, who is liable for debts and how they are taxed.

      - title: The language of accounting
        id: vic-acc-u12-1-2-2
        points:
          - title: What accounting is
            id: acc-accounting
            brief: Accounting is recording, reporting, analysing and advising on financial information so owners can make decisions.
          - title: Assets, liabilities and owner's equity
            id: acc-assets-liabilities-owner-s
            brief: Assets are resources the business controls, liabilities are what it owes, and owner's equity is the owner's claim on its assets.
          - title: Revenue and expenses
            id: acc-revenue-expenses
            brief: Revenue is an inflow that increases owner's equity, such as fees earned. Expenses are outflows that decrease it, such as wages.
          - title: Current and non-current items
            id: acc-current-non-current-items
            brief: A current asset or liability will be used, received or paid within 12 months. A non-current one lasts longer.
          - title: Setting a price
            id: acc-setting-price
            brief: Businesses set prices from the recommended retail price, by adding a mark-up to cost, or by working out the sales needed to cover costs.
          - title: Ethics in accounting
            id: acc-ethics-accounting
            brief: Owners and accountants must record honestly, keep information private and consider social and environmental effects of decisions.

      - title: Recording for a service business
        id: vic-acc-u12-1-2
        points:
          - title: Assumptions and qualitative characteristics
            id: acc-entity-assumption
            brief: Rules such as treating the business as separate from its owner, and qualities such as relevance and faithful representation, guide what is recorded and how.
          - title: Source documents
            id: acc-source-documents
            brief: Receipts, invoices, cheque butts and bank statements prove a transaction happened and give the details to record.
          - title: Cash and credit transactions
            id: acc-cash-credit-transactions
            brief: A cash transaction is paid at once. A credit transaction is paid later, creating an amount owed by or to the business.
          - title: The accounting equation
            id: acc-accounting-equation
            brief: Assets equal liabilities plus owner's equity. Every transaction has a twofold effect that keeps the two sides in balance.
          - title: Special journals
            id: acc-cash-receipts-cash-payments
            brief: The sales, purchases, cash receipts and cash payments journals list similar transactions in date order, each from its source document.
          - title: Internal controls
            id: acc-internal-controls
            brief: Steps such as separating duties, banking cash daily and checking records against statements protect a business from theft and fraud.

      - title: Reporting for a service business
        id: vic-acc-u12-1-4
        points:
          - title: The cash flow statement
            id: acc-cash-budget-cash-summary
            brief: A report of cash in and out over a period, grouped into operating, investing and financing activities.
          - title: The income statement
            id: acc-profit-cash-basis
            brief: A report of revenue less expenses for the period, showing the profit or loss of a service business.
          - title: Balance sheet basics
            id: acc-balance-sheet-basics
            brief: A balance sheet lists assets, liabilities and owner's equity at a point in time, showing the accounting equation holds.
          - title: Cash and profit
            id: acc-cash-profit
            brief: Profit is revenue less expenses; cash is money in the bank. A business can make a profit and still be short of cash.
          - title: Measuring performance
            id: acc-measuring-performance
            brief: Financial indicators, such as profit, and non-financial ones, such as customer complaints, often shown as graphs, tell owners how the business is going.

  - title: "Unit 2: Accounting and decision-making for a trading business"
    chapters:
      - title: Recording inventory
        id: vic-acc-u12-2-1
        points:
          - title: Characteristics of a trading business
            id: acc-characteristics-trading-business
            brief: A trading business buys finished goods and resells them at a higher price, rather than making goods or selling services.
          - title: What inventory is
            id: acc-inventory
            brief: Goods a trading business buys to sell for a profit. It is usually its largest current asset.
          - title: The cost price of inventory
            id: acc-cost-price-inventory
            brief: Inventory is recorded at what it cost to buy and get ready for sale, such as freight in, not counting GST.
          - title: Perpetual inventory records
            id: acc-perpetual-inventory-records
            brief: An inventory card for each item is updated with every purchase, sale and return, so the balance on hand is always known.
          - title: The first in, first out method
            id: acc-first-first-out-method
            brief: FIFO assumes the oldest stock is sold first, so cost of sales uses the earliest purchase prices.
          - title: The identified cost method
            id: acc-identified-cost-method
            brief: Each item is tracked at its own cost, which suits goods that are easy to tell apart, such as cars or jewellery.

      - title: Inventory in the reports
        id: vic-acc-u12-2-2-2
        points:
          - title: Other inventory movements
            id: acc-other-inventory-movements
            brief: Returns to suppliers and from customers, goods the owner takes for private use, and stock used for advertising all change the inventory card.
          - title: Stocktakes and inventory losses
            id: acc-stocktakes-inventory-losses
            brief: A physical count compared to the records shows losses from theft or damage, or gains from errors, to adjust for.
          - title: Cost of sales and gross profit
            id: acc-cost-sales-gross-profit
            brief: Sales revenue less the cost of the goods sold is gross profit. Inventory also shows in the balance sheet and its purchases in the cash flow statement.
          - title: Inventory management
            id: acc-inventory-management
            brief: Regular counts, rotating stock, setting expected levels, stocking goods that sell together and strong controls keep inventory from tying up cash or going missing.

      - title: Accounts receivable and payable
        id: vic-acc-u12-2-2
        points:
          - title: Credit sales and accounts receivable
            id: acc-credit-sales-accounts-receivable
            brief: Goods sold on credit create accounts receivable, an asset, until the customer pays.
          - title: Credit purchases and accounts payable
            id: acc-credit-purchases-accounts-payable
            brief: Goods bought on credit create accounts payable, a liability, until the business pays its supplier.
          - title: Returns, bad debts and discounts
            id: acc-returns-bad-debts-discounts
            brief: Sales returns cut what a customer owes, purchase returns cut what the business owes, bad debts are written off, and discounts reward early payment.
          - title: Receivables and payables in the reports
            id: acc-receivables-payables-reports
            brief: Amounts owed show in the balance sheet, cash collected and paid in the cash flow statement, and bad debts and discounts in the income statement.
          - title: Managing accounts receivable
            id: acc-managing-accounts-receivable
            brief: Credit checks, clear terms, prompt invoices, an ageing list of overdue accounts and modelling options in a spreadsheet help customers pay on time.
          - title: Managing accounts payable
            id: acc-managing-accounts-payable
            brief: Paying suppliers within their terms keeps a good credit record, while not paying too early preserves cash.
          - title: Non-financial factors in credit
            id: acc-non-financial-factors-credit
            brief: Customer goodwill, supplier reliability and the business's reputation matter in credit decisions as well as the numbers.

      - title: Accounting for non-current assets
        id: vic-acc-u12-2-3
        points:
          - title: Valuing a non-current asset
            id: acc-cost-non-current-asset
            brief: A non-current asset is recorded at everything paid to get it ready for use, such as delivery and installation.
          - title: Depreciation
            id: acc-depreciation
            brief: Spreading an asset's cost as an expense over its useful life, as it wears out or becomes obsolete.
          - title: Straight-line depreciation
            id: acc-straight-line-depreciation
            brief: The same amount each year, the cost less residual value, divided by the useful life.
          - title: Reducing balance depreciation
            id: acc-reducing-balance-depreciation
            brief: A fixed percentage of the carrying amount each year, so the expense is largest early on.
          - title: Choosing a depreciation method
            id: acc-choosing-depreciation-method
            brief: Straight-line suits assets used evenly over their life. Reducing balance suits assets that lose value fastest when new, such as vehicles.
          - title: Carrying amount
            id: acc-carrying-amount
            brief: An asset's cost less its accumulated depreciation. Depreciation is an expense in the income statement, and the carrying amount shows in the balance sheet.
          - title: Managing non-current assets
            id: acc-accounting-decisions-assets
            brief: An asset register records each asset's cost, location and depreciation, which helps a business maintain, insure and replace assets on time.
