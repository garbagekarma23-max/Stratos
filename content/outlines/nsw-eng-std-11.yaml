# NSW English Standard, Year 11: the three Year 11 focus areas, 32 points.
# Drafted from NESA's English Standard 11-12 Syllabus (2024), taught in Year 11 from 2026. The structure follows the
# syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Shares the eng bank with English Advanced. Titles differ from the Advanced course so the ids never clash.
# No points on a particular set text yet: schools pick their own texts from NESA's list.

id: nsw-eng-std-11
subject: English
bank: eng
name: English Standard, Year 11
about: HSC, Reading to write, contemporary texts and literature
short: English Standard
years: [11]
place: nsw
kind: english
syllabus: NSW English Standard 11-12 Syllabus (2024), Year 11 focus areas
note: Follows the NSW English Standard syllabus. Not made or endorsed by NESA.
chips: [simile, audience, multimodal, digital text, paragraph]

units:
  - title: Reading to write
    chapters:
      - title: Techniques and their effects
        id: nsw-eng-std-11-1-1
        points:
          - title: Descriptive language
            id: eng-descriptive-language
            brief: Adjectives, verbs and sensory details that help a reader picture a scene. Teach that a strong verb often does more than several adjectives.
          - title: Comparisons in writing
            id: eng-comparisons-writing
            brief: Similes compare using like or as, and metaphors say one thing is another. Students explain what the comparison makes the reader think or feel.
          - title: Repetition and emphasis
            id: eng-repetition-emphasis
            brief: Repeating a word, phrase or structure makes an idea stand out and stick. Speeches and poems use it often.
          - title: Word choice and connotation
            id: eng-word-choice-connotation
            brief: Words carry feelings beyond their dictionary meaning. Slim and skinny mean similar things but feel different, and writers choose words for that effect.
          - title: Tone in a text
            id: eng-tone-text
            brief: Tone is the attitude a text takes, such as angry, playful or serious. Students identify tone from word choice and punctuation and say how it affects the reader.
          - title: Sentence types and effects
            id: eng-sentence-types-effects
            brief: Statements, questions, commands and exclamations each do a different job. Short sentences can add drama; long ones can build detail.

      - title: Text types and purposes
        id: nsw-eng-std-11-1-2
        points:
          - title: Why texts are written
            id: eng-texts-are-written
            brief: Texts are written to entertain, persuade, inform, explain or reflect. Knowing the purpose helps a reader understand the writer's choices.
          - title: Knowing your audience
            id: eng-knowing-your-audience
            brief: The intended reader shapes vocabulary, tone and examples. A text for children differs from one for experts, even on the same topic.
          - title: Features of persuasive texts
            id: eng-features-persuasive-texts
            brief: Persuasive texts state a position, give reasons and evidence, appeal to emotion and use techniques such as inclusive language and rhetorical questions.
          - title: Features of informative texts
            id: eng-features-informative-texts
            brief: Informative texts explain facts clearly, using headings, examples, definitions and a logical order. They aim to be accurate and easy to follow.
          - title: Features of imaginative texts
            id: eng-features-imaginative-texts
            brief: Imaginative texts create characters, settings and events. They use narrative voice, description and dialogue to engage the reader.

      - title: Writing your own texts
        id: nsw-eng-std-11-1-3
        points:
          - title: Planning a piece of writing
            id: eng-planning-piece-writing
            brief: Deciding the purpose, audience and main idea before writing, then sketching the order of ideas. A short plan saves time and keeps writing focused.
          - title: Hooking the reader
            id: eng-hooking-reader
            brief: Ways to start strongly, such as a question, a vivid moment, a surprising fact or a line of dialogue.
          - title: Paragraphing
            id: eng-paragraphing
            brief: Each paragraph focuses on one main idea. A new paragraph starts with a new idea, speaker, time or place.
          - title: Proofreading
            id: eng-proofreading
            brief: Checking a final draft for spelling, punctuation, missing words and sentences that run on. Reading aloud helps catch mistakes.

  - title: Contemporary possibilities
    chapters:
      - title: Texts in a digital world
        id: nsw-eng-std-11-2-1
        points:
          - title: Multimodal texts
            id: eng-multimodal-texts
            brief: Texts that combine words with images, sound, video or interaction, such as a website, a video essay or a game. Each mode adds meaning.
          - title: Digital platforms and audiences
            id: eng-digital-platforms-audiences
            brief: Social media, podcasts and streaming change who can publish and who reads. Audiences can comment, share and remix, so texts become conversations.
          - title: Visual techniques
            id: eng-visual-techniques
            brief: Layout, colour, framing, camera angle and the placement of figures direct where a viewer looks and how they feel.
          - title: Hybrid and new forms
            id: eng-hybrid-new-forms
            brief: Writers mix forms to make new ones, such as a story told in text messages or a documentary with animation. Mixing forms can surprise and engage audiences.
          - title: Interactive storytelling
            id: eng-interactive-storytelling
            brief: In games and choose-your-path stories, the audience shapes events. This changes the role of the reader and how meaning is made.

      - title: Responding to contemporary texts
        id: nsw-eng-std-11-2-2
        points:
          - title: Analysing a digital text
            id: eng-analysing-digital-text
            brief: Applying the same questions used for print texts to a digital one, such as purpose, audience and technique, while noticing features unique to its platform.
          - title: Credibility online
            id: eng-credibility-online
            brief: Judging whether an online text is reliable by checking who made it, why, their evidence and whether other sources agree.
          - title: Creating a multimodal text
            id: eng-creating-multimodal-text
            brief: Planning a text that uses more than one mode, such as a short video or illustrated post, so each mode supports the same idea.

  - title: Close study of literature
    chapters:
      - title: Studying a text closely
        id: nsw-eng-std-11-3-1
        points:
          - title: Characters and their development
            id: eng-characters-their-development
            brief: Tracking how a main character changes, what causes the change and what it shows about the text's ideas.
          - title: Themes in literature
            id: eng-themes-literature
            brief: A theme is an idea a text explores, such as belonging, power or loss. A theme is best stated as a sentence, not a single word.
          - title: Plot and conflict
            id: eng-plot-conflict
            brief: The plot is the sequence of events. Conflict, between characters, within a character or with society, drives the plot forward.
          - title: Context and meaning
            id: eng-context-meaning
            brief: Knowing when and where a text was written helps explain its concerns and why characters behave as they do.
          - title: Language features of a studied text
            id: eng-language-features-studied-text
            brief: Identifying the techniques a studied text uses most, such as symbolism, dialogue or imagery, and explaining how they build its themes.

      - title: Writing about literature
        id: nsw-eng-std-11-3-2
        points:
          - title: Answering the question
            id: eng-answering-question
            brief: Underlining the important words in a question and making sure every paragraph answers it, not just retells the story.
          - title: Building a paragraph
            id: eng-building-paragraph
            brief: A paragraph structure such as point, evidence, explanation and link helps make each paragraph a clear step in the argument.
          - title: Using quotations
            id: eng-using-quotations
            brief: Picking short quotations that prove a point and explaining them. A quote with no explanation earns little.
          - title: Writing an introduction
            id: eng-writing-introduction
            brief: An introduction names the text and writer, answers the question in a clear statement and outlines the main points to come.
