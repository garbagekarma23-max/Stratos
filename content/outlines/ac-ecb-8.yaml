# Australian Curriculum Economics and Business, Year 8: Australian markets, 34 points.
# Follows the Australian Curriculum: Humanities and Social Sciences, Economics and Business 7-10, Version 9.0, Year 8
# (ACARA's curriculum content document, australiancurriculum.edu.au). Checked on the official site in November 2026.
# Version 9.0 was approved by education ministers in April 2022 and released in May 2022. Each state and territory sets
# when its schools teach it, with full implementation expected by 2027 (Western Australia teaches its own version
# adapted from it). No new version is announced: ministers have scheduled the next full version for 2032.
# Structure: the year's inquiry skills are the first unit (the five concepts are taught in Year 7). The year's
# Knowledge and understanding topic is a unit, and each content description is a chapter (the first and second are
# split in two). Codes are ACARA's content description codes.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-ecb-8
subject: Economics and Business
bank: ecb
name: Economics and Business, Year 8
about: "Australian Curriculum, Year 8: Australian markets"
short: Economics and Business
years: [8]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Economics and Business, Version 9.0, Year 8"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [markets, demand, supply, income tax, budget]

units:
  - title: Skills
    chapters:
      - title: Investigating economic issues
        id: ac-ecb-8-1-1
        points:
          - title: Relevant and reliable sources
            id: ecb-relevant-reliable-sources
            brief: A relevant source is about your question. A reliable one comes from an expert or official body, is recent, and backs its claims with evidence.
            codes: [AC9HE8S02]
          - title: Finding trends in economic data
            id: ecb-finding-trends-economic-data
            brief: A trend is the general direction data moves over time, such as rising prices over five years, even if some years go against it.
            codes: [AC9HE8S03]
          - title: Costs and benefits for different groups
            id: ecb-costs-benefits-different-groups
            brief: A decision can help one group and cost another, so weigh its effects on consumers, workers, businesses and government separately.
            codes: [AC9HE8S04]
          - title: Using economic terms in explanations
            id: ecb-using-economic-terms-explanations
            brief: A clear explanation uses the right terms, such as demand and opportunity cost, and supports each claim with data from a named source.
            codes: [AC9HE8S05]

  - title: Australian markets
    chapters:
      - title: How markets work
        id: ac-ecb-8-2-1
        points:
          - title: What a market is
            id: ecb-market
            brief: A market is any place or way buyers and sellers come together to trade, from a weekend market to an online store or the share market.
            codes: [AC9HE8K01]
          - title: Sectors of the economy
            id: ecb-sectors-economy
            brief: Households, businesses, the financial sector and government all take part in the market, buying, selling, saving, lending and taxing.
            codes: [AC9HE8K01]
          - title: The circular flow of income
            id: ecb-circular-flow-income
            brief: Households sell their labour to businesses for income, and spend that income on businesses' goods and services, so money flows around the economy.
            codes: [AC9HE8K01]
          - title: How markets answer the economic questions
            id: ecb-markets-answer-economic-questions
            brief: In a market economy, buyers and sellers trading freely decide what is produced, how it is produced and who gets it.
            codes: [AC9HE8K01]

      - title: Prices
        id: ac-ecb-8-2-2
        points:
          - title: Demand
            id: ecb-demand
            brief: Demand is how much of a product buyers want and can afford at each price. As price rises, people usually buy less.
            codes: [AC9HE8K01]
          - title: Supply
            id: ecb-supply
            brief: Supply is how much of a product sellers will offer at each price. As price rises, sellers usually offer more.
            codes: [AC9HE8K01]
          - title: The equilibrium price
            id: ecb-equilibrium-price
            brief: The market price settles where the amount buyers want equals the amount sellers offer. Above it, unsold stock builds up; below it, there are shortages.
            codes: [AC9HE8K01]
          - title: What changes a price
            id: ecb-changes-price
            brief: Prices change with supply, demand, costs of making a product and competition, as petrol prices change with oil prices and how many stations compete.
            codes: [AC9HE8K01]
          - title: Prices direct resources
            id: ecb-prices-direct-resources
            brief: When a product's price rises, making it becomes more profitable, so businesses move resources into producing more of it.
            codes: [AC9HE8K01]

      - title: Business opportunities
        id: ac-ecb-8-2-3
        points:
          - title: Gaps and niches in the market
            id: ecb-gaps-niches-market
            brief: Businesses look for needs nobody is meeting well, or small groups of buyers with special wants, called a niche.
            codes: [AC9HE8K02]
          - title: Innovation
            id: ecb-innovation
            brief: Innovation is a new or better product or way of working, such as electric cars or home solar batteries, which can open new markets.
            codes: [AC9HE8K02]
          - title: Technology and new business models
            id: ecb-technology-new-business-models
            brief: Apps and the internet let businesses work in new ways, such as ride sharing, food delivery and online shops with no shopfront.
            codes: [AC9HE8K02]

      - title: The changing nature of work
        id: ac-ecb-8-2-4
        points:
          - title: Technology and jobs
            id: ecb-technology-jobs
            brief: Technology removes some jobs, such as checkout work, and creates others, such as in software and data, so workers need new skills over time.
            codes: [AC9HE8K02]
          - title: Casual and gig work
            id: ecb-casual-gig-work
            brief: More Australians work casual or gig jobs, which are flexible but often have no sick leave, holiday pay or certain hours.
            codes: [AC9HE8K02]
          - title: Outsourcing and offshoring
            id: ecb-outsourcing-offshoring
            brief: Outsourcing pays another business to do work. Offshoring moves work overseas where wages are lower.
            codes: [AC9HE8K02]
          - title: A changing workforce
            id: ecb-changing-workforce
            brief: Australia's workforce is changing with an older population, more women working, new workplace laws and businesses taking more social and environmental responsibility.
            codes: [AC9HE8K02]

      - title: First Nations businesses in markets
        id: ac-ecb-8-2-5
        points:
          - title: First Nations partnerships and cooperatives
            id: ecb-first-nations-partnerships-cooperatives
            brief: First Nations businesses often join partnerships or cooperatives to share resources and reach bigger markets in areas such as farming, fashion, design and tourism.
            codes: [AC9HE8K03]
          - title: Cultural tourism
            id: ecb-cultural-tourism
            brief: First Nations-run cultural tourism shares stories, art and knowledge of Country with visitors, on terms the community sets.
            codes: [AC9HE8K03]
          - title: Bush foods and products from Country
            id: ecb-bush-foods-products-from
            brief: Some First Nations businesses make food, skin care and medicines from native plants, drawing on knowledge held for thousands of years and protecting how it is used.
            codes: [AC9HE8K03]
          - title: Barriers to markets
            id: ecb-barriers-markets
            brief: Remote First Nations businesses can face high transport costs and little access to finance. Buying programs such as Supply Nation help them win contracts.
            codes: [AC9HE8K03]

      - title: Tax
        id: ac-ecb-8-2-6
        points:
          - title: Why governments collect tax
            id: ecb-governments-collect-tax
            brief: Governments collect tax to pay for services such as health, education, roads, defence and support payments.
            codes: [AC9HE8K04]
          - title: Income tax
            id: ecb-income-tax
            brief: Income tax is taken from what people earn. Australia has a tax-free threshold, and people on higher incomes pay a higher rate on each extra dollar.
            codes: [AC9HE8K04]
          - title: Young people and tax
            id: ecb-young-people-tax
            brief: Young workers need a tax file number, their employer takes tax from their pay, and after 30 June they lodge a tax return and may get some back.
            codes: [AC9HE8K04]
          - title: The goods and services tax
            id: ecb-goods-services-tax
            brief: The GST is a 10 per cent tax added to the price of most goods and services. Some things, such as most fresh food, are left out.
            codes: [AC9HE8K04]
          - title: Excise and import duties
            id: ecb-excise-import-duties
            brief: Excise is a tax on goods such as fuel, alcohol and tobacco, and import duties tax goods from overseas. Both raise prices and can change what people buy.
            codes: [AC9HE8K04]

      - title: Planning and budgeting
        id: ac-ecb-8-2-7
        points:
          - title: Short and long-term financial goals
            id: ecb-short-long-term-financial
            brief: A short-term goal, such as new shoes, takes weeks or months. A long-term goal, such as a car, takes years and needs a savings plan.
            codes: [AC9HE8K05]
          - title: Making a personal budget
            id: ecb-making-personal-budget
            brief: A budget lists income and expenses, separating fixed costs from changing ones, so you can see what is left to save.
            codes: [AC9HE8K05]
          - title: Saving and interest
            id: ecb-saving-interest
            brief: Money kept in a savings account earns interest, so savings grow over time, faster when interest is earned on interest.
            codes: [AC9HE8K05]
          - title: Business financial records
            id: ecb-business-financial-records
            brief: An income statement shows profit or loss, a balance sheet shows what a business owns and owes, and a cash flow statement shows money in and out.
            codes: [AC9HE8K05]
          - title: Business plans and borrowing
            id: ecb-business-plans-borrowing
            brief: A business plan sets goals and how to reach them, and lenders such as banks read it before lending money to start or grow a business.
            codes: [AC9HE8K05]
