# NSW Health and Movement Science, Year 11: the two Year 11 focus areas and the Collaborative Investigation, 31 points.
# Health and Movement Science replaced PDHPE in Stage 6: its Year 11 course started in 2025.
# Drafted from NESA's Health and Movement Science 11-12 Syllabus (2023). The structure follows the syllabus: each focus
# area is a unit. Depth studies are school-designed, so they are not here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on mental health, drugs and alcohol, and Aboriginal and Torres Strait Islander health always go to the review page.

id: nsw-hms-11
subject: Health and Movement Science
bank: hms
name: Health and Movement Science, Year 11
about: HSC, Health for individuals and the body in motion
short: Health and Movement Science
years: [11]
place: nsw
kind: standard
syllabus: NSW Health and Movement Science 11-12 Syllabus (2023), Year 11 focus areas (replaced PDHPE Stage 6)
note: Follows the NSW Health and Movement Science syllabus. Not made or endorsed by NESA.
chips: [determinants of health, Ottawa Charter, energy systems, biomechanics, skill acquisition]

units:
  - title: Health for individuals and communities
    chapters:
      - title: Understanding health
        id: nsw-hms-11-1-1
        points:
          - title: Dimensions of health
            id: hms-dimensions-health
            brief: Health has physical, mental, emotional, social and spiritual dimensions, which affect each other.
          - title: Health as dynamic and subjective
            id: hms-health-as-dynamic-subjective
            brief: A person's health changes over time and how healthy they feel depends on their own values and situation.
          - title: Determinants of health
            id: hms-determinants-health
            brief: Individual factors, such as knowledge and genetics, sociocultural factors, such as family and culture, socioeconomic factors, such as income and education, and environmental factors, such as access to services.
          - title: Health literacy
            id: hms-health-literacy
            brief: The skills to find, understand, judge and use health information to make good decisions.
          - title: Health behaviours and risk factors
            id: hms-health-behaviours-risk-factors
            brief: Behaviours such as physical activity, diet, sleep, smoking and alcohol use raise or lower the risk of illness.
          - title: Protective factors and resilience
            id: hms-protective-factors-resilience
            brief: Supportive relationships, a sense of belonging and coping skills help people stay well and recover from setbacks.

      - title: Promoting health
        id: nsw-hms-11-1-2
        points:
          - title: Health promotion
            id: hms-health-promotion
            brief: Helping people and communities take control of their health, through education, healthy environments and policy.
          - title: The Ottawa Charter
            id: hms-ottawa-charter
            brief: The WHO's 1986 framework has five action areas, building healthy public policy, creating supportive environments, strengthening community action, developing personal skills and reorienting health services.
          - title: Principles of social justice in health
            id: hms-principles-social-justice-health
            brief: Equity, diversity and supportive environments guide health promotion so that it reaches people with the greatest need.
          - title: Community health resources
            id: hms-community-health-resources
            brief: Services such as GPs, community health centres, helplines and school counsellors support people's health, but not everyone can reach them easily.
          - title: Young people's health
            id: hms-young-people-s-health
            brief: Young Australians' health is shaped by mental health, sexual health, road safety, sleep, social media and substance use, and by where they live.

  - title: The body and mind in motion
    chapters:
      - title: The body's systems
        id: nsw-hms-11-2-1
        points:
          - title: The skeletal system
            id: hms-skeletal-system
            brief: Bones support the body, protect organs and act as levers. Joints, such as hinge and ball-and-socket joints, allow different movements.
          - title: The muscular system
            id: hms-muscular-system
            brief: Skeletal muscles work in pairs, with an agonist that contracts and an antagonist that relaxes. Contractions can be concentric, eccentric or isometric.
          - title: Muscle fibre types
            id: hms-muscle-fibre-types
            brief: Slow-twitch fibres resist fatigue and suit endurance. Fast-twitch fibres contract quickly and powerfully but tire fast.
          - title: The cardiovascular system
            id: hms-cardiovascular-system
            brief: The heart pumps blood through arteries, capillaries and veins, carrying oxygen and nutrients to muscles and removing waste.
          - title: The respiratory system
            id: hms-respiratory-system
            brief: Air moves through the airways to the alveoli, where oxygen enters the blood and carbon dioxide leaves it.

      - title: Energy for movement
        id: nsw-hms-11-2-2
        points:
          - title: ATP and energy
            id: hms-atp-energy
            brief: Muscles run on ATP. The body has only a little stored, so it must keep remaking it through three energy systems.
          - title: The ATP-PC system
            id: hms-atp-pc-system
            brief: Gives energy fastest for very short, explosive efforts, such as a sprint start, but runs out in about 10 seconds.
          - title: The anaerobic glycolysis system
            id: hms-anaerobic-glycolysis-system
            brief: Breaks down glucose without oxygen for hard efforts of about 10 seconds to two minutes, producing by-products linked to fatigue.
          - title: The aerobic system
            id: hms-aerobic-system
            brief: Uses oxygen to break down carbohydrates and fats for long, steady activity. It is slow to start but lasts for hours.
          - title: Energy systems working together
            id: hms-energy-systems-working-together
            brief: All three systems work at once, and the intensity and length of the activity decide which one supplies most of the energy.

      - title: Biomechanics and skill
        id: nsw-hms-11-2-3
        points:
          - title: Motion
            id: hms-motion
            brief: Linear motion is in a straight line, angular motion turns around an axis, and general motion combines the two.
          - title: Balance and stability
            id: hms-balance-stability
            brief: A wider base, a lower centre of gravity and keeping the line of gravity over the base all make a body more stable.
          - title: Force and levers
            id: hms-force-levers
            brief: Muscles pull on bones, which act as levers to produce movement. Applying force over a longer time or distance gives more speed.
          - title: Stages of skill acquisition
            id: hms-stages-skill-acquisition
            brief: Learners move from the cognitive stage, thinking about each step, to the associative stage, refining it, to the autonomous stage, where it is automatic.
          - title: Feedback in learning skills
            id: hms-feedback-learning-skills
            brief: Feedback can be internal or external, and can describe the result (knowledge of results) or the movement itself (knowledge of performance).
          - title: Motivation and arousal
            id: hms-motivation-arousal
            brief: Intrinsic motivation comes from enjoyment, extrinsic from rewards. Performance is best at a moderate level of arousal, and anxiety can harm it.

  - title: Collaborative investigation
    chapters:
      - title: Investigating health and movement
        id: nsw-hms-11-3-1
        points:
          - title: Framing a research question
            id: hms-framing-research-question
            brief: A clear question about health or movement that a group can test with data, such as whether a warm-up changes sprint times.
          - title: Collecting data
            id: hms-collecting-data
            brief: Choosing valid methods, such as surveys, fitness tests or observations, and recording results carefully.
          - title: Working as a team
            id: hms-working-as-team
            brief: Sharing roles, communicating clearly and reflecting on how the group worked together are part of the investigation.
          - title: Research ethics
            id: hms-research-ethics
            brief: Participants must give informed consent, be kept safe and have their information kept private.
