# NSW Geography, Year 11: the four Year 11 focus areas, 34 points.
# Drafted from NESA's Geography 11-12 Syllabus (2022), taught in Year 11 since 2024. The structure follows the syllabus:
# each focus area is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-geo-11
subject: Geography
bank: geo
name: Geography, Year 11
about: HSC, Natural systems, people and environments
short: Geography
years: [11]
place: nsw
kind: standard
syllabus: NSW Geography 11-12 Syllabus (2022), Year 11 focus areas
note: Follows the NSW Geography syllabus. Not made or endorsed by NESA.
chips: [lithosphere, plate tectonics, urbanisation, sustainability, GIS]

units:
  - title: Earth's natural systems
    chapters:
      - title: Thinking geographically
        id: nsw-geo-11-1-1
        points:
          - title: Place and space
            id: geo-place-space
            brief: Place is a part of the Earth's surface with its own meaning to people. Space is how things are arranged and spread across the surface.
          - title: Environment and interconnection
            id: geo-environment-interconnection
            brief: The environment is the living and non-living world around us. Interconnection is how people, places and processes affect each other.
          - title: Scale
            id: geo-scale
            brief: Geographers look at issues at local, regional, national and global scales, and an explanation at one scale may differ at another.
          - title: Change over time
            id: geo-change-over-time
            brief: Places and environments change over different time spans, from a flood in a day to climate change over centuries.

      - title: The four spheres
        id: nsw-geo-11-1-2
        points:
          - title: The atmosphere
            id: geo-atmosphere
            brief: The layer of gases around the Earth, which holds weather and climate and keeps the planet warm through the greenhouse effect.
          - title: The hydrosphere
            id: geo-hydrosphere
            brief: All the Earth's water, in oceans, rivers, lakes, ice and groundwater, moved around by the water cycle.
          - title: The lithosphere
            id: geo-lithosphere
            brief: The Earth's crust and upper mantle, the rocks and landforms that make the surface.
          - title: The biosphere
            id: geo-biosphere
            brief: All living things and the places they live, which depend on the other three spheres.
          - title: How the spheres interact
            id: geo-spheres-interact
            brief: Energy and matter flow between the spheres, so a change in one, such as a volcanic eruption, affects the others.

      - title: Natural processes
        id: nsw-geo-11-1-3
        points:
          - title: Plate tectonics
            id: geo-plate-tectonics
            brief: The lithosphere is broken into plates that move slowly. Where they meet they cause earthquakes, volcanoes and mountain building.
          - title: Weathering and erosion
            id: geo-weathering-erosion
            brief: Weathering breaks rock down in place. Erosion carries the pieces away by water, wind and ice, shaping landforms.
          - title: The water cycle
            id: geo-water-cycle
            brief: Water evaporates, condenses into clouds, falls as precipitation and flows back to the sea over land and underground.
          - title: Atmospheric circulation and climate
            id: geo-atmospheric-circulation-climate
            brief: Uneven heating by the sun drives winds and pressure belts, which, with ocean currents, set the world's climate zones.
          - title: Natural hazards
            id: geo-natural-hazards
            brief: Events such as bushfires, floods, cyclones and droughts are natural processes that become hazards when they affect people.

  - title: People, patterns and processes
    chapters:
      - title: Population
        id: nsw-geo-11-2-1
        points:
          - title: Population distribution and density
            id: geo-population-distribution-density
            brief: Where people live and how crowded places are. People cluster near water, fertile land, jobs and good climates.
          - title: Population change
            id: geo-population-change
            brief: Population grows or shrinks through births, deaths and migration.
          - title: The demographic transition model
            id: geo-demographic-transition-model
            brief: As countries develop, death rates fall first and birth rates later, so population grows fast before it levels off.
          - title: Migration
            id: geo-migration
            brief: People move for push factors, such as war or poverty, and pull factors, such as jobs and safety, within and between countries.
          - title: Urbanisation
            id: geo-urbanisation
            brief: The growing share of people living in cities. More than half the world's people now live in urban areas.

      - title: Economic and cultural patterns
        id: nsw-geo-11-2-2
        points:
          - title: Patterns of development
            id: geo-patterns-development
            brief: Income, health and education differ greatly between and within countries, measured by indicators such as GDP per person and the Human Development Index.
          - title: Economic activity and location
            id: geo-economic-activity-location
            brief: Industries locate near resources, markets, transport and workers, and these patterns shift as technology changes.
          - title: Globalisation and flows
            id: geo-globalisation-flows
            brief: Goods, money, people and ideas move faster and further than ever, linking distant places.
          - title: Cultural diffusion
            id: geo-cultural-diffusion
            brief: Ideas, languages and cultural practices spread between places through trade, migration and media.

  - title: Human-environment interactions
    chapters:
      - title: People and the environment
        id: nsw-geo-11-3-1
        points:
          - title: Human impacts on natural systems
            id: geo-human-impacts-natural-systems
            brief: Clearing land, farming, mining and building change natural systems, from soils and rivers to the climate.
          - title: Land degradation
            id: geo-land-degradation
            brief: Soil erosion, salinity and loss of vegetation reduce the land's ability to support plants, animals and people.
          - title: Managing water
            id: geo-managing-water
            brief: Dams, irrigation and water trading support farming and cities but change rivers. The Murray-Darling Basin shows the competing demands.
          - title: Renewable and non-renewable resources
            id: geo-renewable-non-renewable-resources
            brief: Renewable resources, such as sunlight and forests, can be replaced. Non-renewable ones, such as coal, run out once used.
          - title: Aboriginal and Torres Strait Islander care for Country
            id: geo-aboriginal-torres-strait-islander
            brief: Aboriginal and Torres Strait Islander peoples have cared for Country for tens of thousands of years, and their knowledge now informs land and fire management.
          - title: Sustainable management
            id: geo-sustainable-management
            brief: Using resources in ways that meet present needs without harming future generations, balancing social, economic and environmental goals.

  - title: Geographical investigation
    chapters:
      - title: Investigating like a geographer
        id: nsw-geo-11-4-1
        points:
          - title: The inquiry process
            id: geo-inquiry-process
            brief: Asking a geographical question, gathering and processing information, analysing it and drawing conclusions that answer the question.
          - title: Fieldwork and primary data
            id: geo-fieldwork-primary-data
            brief: Collecting data first-hand through observations, measurements, surveys and interviews.
          - title: Secondary data
            id: geo-secondary-data
            brief: Using data already collected by others, such as census figures, climate records and reports, and checking how reliable it is.
          - title: Maps and spatial technologies
            id: geo-maps-spatial-technologies
            brief: Topographic maps, satellite images and geographic information systems (GIS) show and analyse where things are.
          - title: Presenting findings
            id: geo-presenting-findings
            brief: Communicating results with maps, graphs, photographs and a clear written report.
