# Australian Curriculum History, Year 9: the making of the modern world (1750 to 1918), with the year's overview and
# the historical concepts and skills, then Making and transforming the Australian nation, the First World War and the
# Industrial Revolution, 40 points.
# Follows ACARA's Australian Curriculum: Humanities and Social Sciences, History 7-10, Version 9.0 (History curriculum
# content, Years 7-10), checked on australiancurriculum.edu.au in November 2026. Version 9.0 was approved in April 2022
# and released for use from 2023; each state and territory sets when its schools start it (Queensland schools teach
# every v9 learning area by the end of 2027). No newer version is announced. Western Australia and South Australia
# teach their own versions built on it.
# The first unit is the year's overview with the Historical knowledge and skills strand's concepts and skills, taught
# as ideas. Every school studies Making and transforming the Australian nation (1750-1914) and the First World War
# (1914-1918): a unit each. The Industrial Revolution and the movement of peoples (1750-1900) and Asia and the world
# (1750-1914) are options; this outline covers the Industrial Revolution, the one most taught, as a fourth unit, and
# Asia and the world can be added later. Frontier conflict is taught plainly and the pipeline sends it to the owner.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-his-9
subject: History
bank: his
name: History, Year 9
about: "Australian Curriculum, Year 9: The making of the modern world"
short: History
years: [9]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: History, Version 9.0, Year 9"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [First Fleet, gold rush, Federation, Gallipoli, conscription, Industrial Revolution]

units:
  - title: Overview and historical skills
    chapters:
      - title: The making of the modern world
        id: ac-his-9-1-1
        points:
          - title: Imperialism
            id: his-imperialism
            brief: Imperialism is one country taking control of other lands and peoples. By 1914 European powers, Britain above all, ruled much of Africa, Asia and the Pacific.
            codes: [AC9HH9K01]
          - title: Movements of people from 1750 to 1914
            id: his-movements-people-from-1750
            brief: Millions moved in this period, some forced, such as enslaved Africans and transported convicts, and many free, seeking land, gold or work in new countries.
            codes: [AC9HH9K01]
          - title: The Atlantic slave trade and abolition
            id: his-atlantic-slave-trade-abolition
            brief: Millions of Africans were shipped to the Americas as slaves. Campaigns by enslaved people and reformers led Britain to end the trade in 1807 and slavery in its colonies in 1833.
          - title: Nationalism
            id: his-nationalism
            brief: Nationalism is the belief that people who share a language, history and culture should rule themselves as a nation. It united Germany and Italy and later fed the rivalry that led to war.
            codes: [AC9HH9K07]

      - title: Thinking about evidence and arguments
        id: ac-his-9-1-2
        points:
          - title: Reliability and usefulness compared
            id: his-reliability-usefulness-compared
            brief: A source can be unreliable yet still useful. A one-sided recruiting poster is poor evidence of what war was like but good evidence of how the government wanted people to see it.
            codes: [AC9HH9S04]
          - title: Short-term and long-term effects in history
            id: his-short-term-long-term
            brief: Effects can be short-term, such as deaths in a battle, or long-term, such as changed beliefs about a nation that last for generations.
            codes: [AC9HH9S05]
          - title: Contested interpretations
            id: his-contested-interpretations
            brief: Historians sometimes disagree strongly about the past, such as how to describe frontier conflict, because they use different evidence, questions or values.
            codes: [AC9HH9S07]
          - title: Writing a thesis statement
            id: his-writing-thesis-statement
            brief: A thesis is a one-sentence answer to the question that takes a clear position. Every paragraph of a historical argument then supports it with evidence.
            codes: [AC9HH9S08]

  - title: Making and transforming the Australian nation
    chapters:
      - title: Colonising Australia
        id: ac-his-9-2-1
        points:
          - title: Why Britain colonised Australia
            id: his-britain-colonised-australia
            brief: After losing its American colonies, Britain needed somewhere to send convicts, and a base in the Pacific. The First Fleet arrived at Sydney Cove in 1788.
            codes: [AC9HH9K01]
          - title: Terra nullius
            id: his-terra-nullius
            brief: Britain claimed the land as if it belonged to no one, an idea later called terra nullius, and made no treaty with its owners. The High Court rejected the idea in the Mabo case in 1992.
            codes: [AC9HH9K03]
          - title: Effects of colonisation on First Nations Australians
            id: his-effects-colonisation-first-nations
            brief: Disease such as smallpox, the loss of land, water and food sources, and violence devastated First Nations communities as settlement spread.
            codes: [AC9HH9K03, AC9HH9K06]
          - title: Frontier conflict and resistance
            id: his-frontier-conflict-resistance
            brief: First Nations Australians resisted the taking of their land, led by people such as Pemulwuy and Windradyne. Settlers and police carried out massacres, such as at Myall Creek in 1838.
            codes: [AC9HH9K03, AC9HH9K06]
          - title: Protection policies
            id: his-protection-policies
            brief: From the late 1800s, colonial laws let protectors control where First Nations Australians lived, worked and married, and remove children from their families.
            codes: [AC9HH9K05, AC9HH9K06]

      - title: Building a nation
        id: ac-his-9-2-2
        points:
          - title: Squatters and the wool industry
            id: his-squatters-wool-industry
            brief: Squatters took up huge areas of land for sheep, and wool became the colonies' main export, pushing settlement inland.
            codes: [AC9HH9K02]
          - title: The gold rushes
            id: his-gold-rushes
            brief: Gold found in 1851 drew hundreds of thousands of migrants, including many from China, and made the colonies richer and larger. Hostility to Chinese miners led to riots.
            codes: [AC9HH9K02, AC9HH9K04]
          - title: The Eureka Stockade
            id: his-eureka-stockade
            brief: In 1854 miners at Ballarat protested costly licences and their lack of a vote. Soldiers crushed the stockade, but miners soon won the vote.
            codes: [AC9HH9K04]
          - title: Federation
            id: his-federation
            brief: On 1 January 1901 the six colonies joined as the Commonwealth of Australia, for shared defence, free trade between the colonies and a national identity.
            codes: [AC9HH9K04, AC9HH9K05]
          - title: The White Australia policy
            id: his-white-australia-policy
            brief: The Immigration Restriction Act of 1901, one of the first federal laws, used a dictation test to keep out non-European migrants.
            codes: [AC9HH9K05]
          - title: Votes for women and early reforms
            id: his-votes-women-early-reforms
            brief: South Australian women won the vote in 1894 and women won the federal vote in 1902, though most First Nations people were shut out. An aged pension and a basic wage soon followed.
            codes: [AC9HH9K05]

  - title: The First World War
    chapters:
      - title: Causes and the call to arms
        id: ac-his-9-3-1
        points:
          - title: The long-term causes of the First World War
            id: his-long-term-causes-first
            brief: Militarism, rival alliances, imperial competition and nationalism raised tensions among Europe's great powers before 1914.
            codes: [AC9HH9K08]
          - title: The spark in 1914
            id: his-spark-1914
            brief: The killing of Archduke Franz Ferdinand in Sarajevo in June 1914 set off a chain of declarations of war through the alliance system.
            codes: [AC9HH9K08]
          - title: Why Australians enlisted
            id: his-australians-enlisted
            brief: Australians joined up out of loyalty to Britain, a sense of adventure, steady pay, and pressure from family and friends, all as volunteers.
            codes: [AC9HH9K08]
          - title: First Nations soldiers
            id: his-first-nations-soldiers
            brief: Over a thousand First Nations Australians served, even though rules often barred them. Many found fairer treatment in the army than at home, but lost it on returning.
            codes: [AC9HH9K09, AC9HH9K11]

      - title: Australians at war
        id: ac-his-9-3-2
        points:
          - title: The Gallipoli landing
            id: his-gallipoli-landing
            brief: On 25 April 1915 Australian and New Zealand troops landed at Gallipoli in Turkey, aiming to open a sea route to Russia, but were held on the steep coast.
            codes: [AC9HH9K09]
          - title: The Gallipoli campaign
            id: his-gallipoli-campaign
            brief: After eight months of fighting, disease and harsh conditions, with about 8,700 Australians dead, the troops were evacuated in December 1915.
            codes: [AC9HH9K09, AC9HH9K10]
          - title: Trench warfare on the Western Front
            id: his-trench-warfare-western-front
            brief: In France and Belgium both sides dug long lines of trenches. Machine guns, artillery and gas made attacks across no man's land very costly.
            codes: [AC9HH9K10]
          - title: Fromelles, Pozières and the Somme
            id: his-fromelles-pozi-res-somme
            brief: In 1916, at Fromelles and Pozières during the Battle of the Somme, Australians lost more men in weeks than in the whole Gallipoli campaign.
            codes: [AC9HH9K10]
          - title: The Light Horse in the Middle East
            id: his-light-horse-middle-east
            brief: Australian Light Horse troops fought the Ottoman Empire in Sinai and Palestine, including the charge at Beersheba in 1917.
            codes: [AC9HH9K09]
          - title: The Armistice
            id: his-armistice
            brief: With its allies collapsing and its army pushed back, Germany agreed to the Armistice, and fighting stopped at 11 am on 11 November 1918.
            codes: [AC9HH9K10]

      - title: The home front and remembering the war
        id: ac-his-9-3-3
        points:
          - title: The conscription referendums
            id: his-conscription-referendums
            brief: Prime Minister Hughes twice asked voters to allow conscription for overseas service, in 1916 and 1917. Both were defeated and the issue split the nation.
            codes: [AC9HH9K11]
          - title: Propaganda and censorship
            id: his-propaganda-censorship
            brief: The government used posters and newspapers to urge enlistment and censored letters and news so people would keep supporting the war.
            codes: [AC9HH9K11]
          - title: Women and the war
            id: his-women-war
            brief: Women served as nurses overseas, raised money, knitted and packed supplies, and campaigned both for and against conscription.
            codes: [AC9HH9K11]
          - title: German Australians in wartime
            id: his-german-australians-wartime
            brief: Under the War Precautions Act, thousands of people of German background were interned, and German place names were changed.
            codes: [AC9HH9K11]
          - title: Returned soldiers
            id: his-returned-soldiers
            brief: Many soldiers came home wounded or with shell shock. Soldier settlement schemes gave them farms, but many failed on poor land.
            codes: [AC9HH9K11]
          - title: The Anzac legend
            id: his-anzac-legend
            brief: The Anzac legend praises mateship, courage and endurance. Historians debate whom it leaves out, such as women and First Nations soldiers, and how much it shaped national identity.
            codes: [AC9HH9K12]

  - title: The Industrial Revolution
    chapters:
      - title: The Industrial Revolution
        id: ac-his-9-4-1
        points:
          - title: Why it began in Britain
            id: his-it-began-britain
            brief: Britain had coal and iron, money to invest, an empire for raw materials and markets, and new farming methods that freed workers for towns.
            codes: [AC9HH9K13]
          - title: Steam power and factories
            id: his-steam-power-factories
            brief: Improved steam engines, such as James Watt's, powered machines in factories, especially for cotton, and later trains and ships.
            codes: [AC9HH9K13]
          - title: Working conditions and child labour
            id: his-working-conditions-child-labour
            brief: Factory and mine workers, including young children, worked long hours for low pay in dangerous conditions.
            codes: [AC9HH9K16]
          - title: Cities and public health
            id: his-cities-public-health
            brief: Crowded cities grew fast, and dirty water spread diseases such as cholera until sewers and clean water supplies were built.
            codes: [AC9HH9K14, AC9HH9K15]
          - title: New ideas and reforms
            id: his-new-ideas-reforms
            brief: Capitalism, socialism and the Chartist push for working men's votes grew from industrial change, and Factory Acts began to limit working hours.
            codes: [AC9HH9K17, AC9HH9K18]
