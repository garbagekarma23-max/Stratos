# Victorian Curriculum Geography, Levels 7 and 8: water, liveability, landforms and changing nations, 70 points.
# Follows the Victorian Curriculum F-10 Version 2.0, Geography, Levels 7 and 8 (VCAA), checked on the VCAA's F-10
# website in November 2026. Version 2.0 was published in June 2024 and replaces Version 1.0 (2016). Schools could use it
# from 2025, and Victorian government schools must teach it from 2026 (Catholic and independent schools set their own
# timing). The Version 1.0 website closes on 31 December 2026. No newer version is announced.
# VC2.0 sets Geography in bands of two levels, so this file covers Levels 7 and 8 together.
# Structure: each sub-strand of Geographical Knowledge and Understanding is a unit (Water in the world, Place and
# liveability, Landforms and landscapes, Changing nations), with its content descriptions grouped into chapters. The
# Geographical Skills strand is the last unit, kept to the ideas behind the skills (reading maps and graphs, inquiry
# questions, data and conclusions). Fieldwork and the study of a local landform are left to class.
# Options picked where schools choose: atmospheric and hydrometeorological hazards are tropical cyclones, floods,
# drought and bushfires; geomorphological hazards are earthquakes, volcanic eruptions and tsunamis (landslides can be
# added); the urbanisation study covers Indonesia and China (the United States and India can be added); migration
# covers Australia and China; the comparison of urban patterns is Australia and the United States.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-geo-78
subject: Geography
bank: geo
name: Geography, Levels 7 and 8
about: Victorian Curriculum 2.0, Levels 7 and 8
short: Geography
years: [7, 8]
level: Levels 7 and 8
place: vic
kind: standard
syllabus: "Victorian Curriculum F-10 Version 2.0: Geography, Levels 7 and 8"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [water cycle, liveability, landforms, urbanisation, cyclones]

units:
  - title: Water in the world
    chapters:
      - title: Water as a renewable resource
        id: vic-geo-78-1-1
        points:
          - title: Renewable and non-renewable resources
            id: geo-renewable-non-renewable-resources-2
            brief: A renewable resource is replaced by natural processes, while a non-renewable one runs out once used. Water is renewable because the water cycle keeps replacing it, though some stores refill very slowly.
            codes: [VC2HG8K01]
          - title: The water cycle
            id: geo-water-cycle-2-vic
            brief: Water moves between the oceans, air and land through evaporation, transpiration, condensation, precipitation, runoff and infiltration, changing between liquid, gas and ice.
            codes: [VC2HG8K01]
          - title: Where the Earth's water is stored
            id: geo-where-earth-s-water
            brief: Almost all water is salty and in the oceans. Most fresh water is locked in ice or held underground in aquifers, and only a tiny share is in rivers and lakes.
            codes: [VC2HG8K01]
          - title: How flows of water connect places
            id: geo-flows-water-connect-places
            brief: Rivers and groundwater carry water, sediment, nutrients and pollution from one place to another, so what happens upstream changes places downstream, as in the Murray-Darling Basin.
            codes: [VC2HG8K01]

      - title: Uses and value of water
        id: vic-geo-78-1-2
        points:
          - title: Ways people use and value water
            id: geo-ways-people-use-value
            brief: Water has environmental value for ecosystems, economic value for farms, industry and power, and cultural, spiritual and aesthetic value, such as places of meaning or beauty.
            codes: [VC2HG8K02]
          - title: Water and Aboriginal and Torres Strait Islander Peoples
            id: geo-water-aboriginal-torres-strait
            brief: For Aboriginal and Torres Strait Islander Peoples, rivers, waterholes, springs and seas are part of Country, with cultural and spiritual meaning, and knowledge of finding and caring for water is passed down through generations.
            codes: [VC2HG8K02]
          - title: Water in the Asia region
            id: geo-water-asia-region
            brief: Water shapes life in Asia, such as monsoon rains for rice farming, the Mekong River's fisheries and the sacred meaning of the Ganges in Hinduism.
            codes: [VC2HG8K02]
          - title: Australia's rainfall and water resources
            id: geo-australia-s-rainfall-water
            brief: Australia is the driest inhabited continent. Most rain falls on the northern and eastern coasts and in Tasmania, while much of the inland is arid, so water is unevenly spread.
            codes: [VC2HG8K03]
          - title: Variable rainfall in Australia
            id: geo-variable-rainfall-australia
            brief: Australia's rainfall changes a lot from year to year, linked to El Niño (often drier) and La Niña (often wetter), which is why droughts and floods are common and dams store water.
            codes: [VC2HG8K03]
          - title: Climate change and Australia's water
            id: geo-climate-change-australia-s
            brief: Forecasts show less cool-season rain in southern Australia, more evaporation as it warms and heavier downpours, which puts pressure on water supplies.
            codes: [VC2HG8K03]

      - title: Water scarcity
        id: vic-geo-78-1-3
        points:
          - title: Physical and economic water scarcity
            id: geo-physical-economic-water-scarcity-vic
            brief: Physical scarcity means there is not enough water to meet demand, often from low rainfall or overuse. Economic scarcity means water exists but people lack the money or infrastructure to reach it.
            codes: [VC2HG8K04]
          - title: Managing water scarcity in Australia
            id: geo-managing-water-scarcity-australia
            brief: Australia overcomes scarcity with dams, desalination plants, recycled water, water restrictions, efficient irrigation, rainwater tanks and water trading between users in the Murray-Darling Basin.
            codes: [VC2HG8K04]
          - title: Water scarcity in West Asia and North Africa
            id: geo-water-scarcity-west-asia
            brief: This is the most water-scarce region. Countries rely on desalination, ancient groundwater and shared rivers such as the Nile and the Tigris and Euphrates, which can cause tension between nations.
            codes: [VC2HG8K04]

      - title: Weather and water hazards
        id: vic-geo-78-1-4
        points:
          - title: Natural hazards and disasters
            id: geo-natural-hazards-disasters
            brief: A natural hazard is an event that could harm people or property. It becomes a disaster when it causes major damage or loss of life that a community cannot cope with on its own.
            codes: [VC2HG8K05]
          - title: Tropical cyclones
            id: geo-tropical-cyclones
            brief: Cyclones form over warm tropical oceans and bring destructive winds, heavy rain and storm surges, mostly to northern Australia between November and April.
            codes: [VC2HG8K05]
          - title: Floods
            id: geo-floods
            brief: Floods happen when heavy rain makes rivers overflow or water pool faster than it drains. Flash floods rise in hours; river floods build over days across wide plains.
            codes: [VC2HG8K05]
          - title: Drought
            id: geo-drought-vic
            brief: A drought is a long period of below-average rainfall. It dries up water supplies, ruins crops and pasture, and hurts farm incomes and rural towns.
            codes: [VC2HG8K05]
          - title: Bushfires
            id: geo-bushfires
            brief: Hot, dry, windy weather and dry fuel make bushfire risk high. Fires threaten lives, homes and ecosystems, especially in south-eastern Australia in summer.
            codes: [VC2HG8K05]
          - title: Preparing for and responding to hazards
            id: geo-preparing-responding-hazards
            brief: Communities reduce harm through forecasting, warnings, building rules, levees and fire plans before a hazard, then emergency response and recovery after it.
            codes: [VC2HG8K05]

  - title: Place and liveability
    chapters:
      - title: Measuring liveability
        id: vic-geo-78-2-1
        points:
          - title: What liveability means
            id: geo-liveability-means-vic
            brief: Liveability is how well a place supports a good quality of life for the people who live there, such as safety, health, jobs, services and a pleasant environment.
            codes: [VC2HG8K06]
          - title: Measures of liveability
            id: geo-measures-liveability
            brief: Liveability rankings score places on environmental, economic and social measures, such as crime, health care, education, transport, housing costs and pollution.
            codes: [VC2HG8K06]
          - title: Liveability and where people live
            id: geo-liveability-where-people-live
            brief: People are drawn to places they see as liveable, but what counts as liveable differs with age, income, culture and needs, such as a family wanting schools or a retiree wanting quiet.
            codes: [VC2HG8K06]
          - title: Judging liveability with geographical concepts
            id: geo-judging-liveability-with-geographical
            brief: Geographers judge liveability using space (where services are), environment (the quality of surroundings) and interconnection (links to people, jobs and other places).
            codes: [VC2HG8K10]

      - title: What makes a place liveable
        id: vic-geo-78-2-2
        points:
          - title: Access to services and facilities
            id: geo-access-services-facilities-vic
            brief: How close and easy it is to reach schools, hospitals, shops and transport shapes how liveable a place feels. Remote places often have fewer services and rely on telehealth and online learning.
            codes: [VC2HG8K07]
          - title: Environmental quality and liveability
            id: geo-environmental-quality-liveability
            brief: Clean air and water, green space, low noise and attractive surroundings make people see a place as more liveable.
            codes: [VC2HG8K08]
          - title: Social connectedness and community identity
            id: geo-social-connectedness-community-identity
            brief: Feeling safe, belonging to a community, and having friends, family, clubs and shared events nearby all raise how liveable people find a place.
            codes: [VC2HG8K09]
          - title: Connection to Country and Place
            id: geo-connection-country-place
            brief: For Aboriginal and Torres Strait Islander Peoples, Country includes land, waters, sky and kin. Being connected to Country and Place supports identity, culture and wellbeing, and shapes how liveable a place is.
            codes: [VC2HG8K09]
          - title: Improving liveability locally
            id: geo-improving-liveability-locally
            brief: Councils and communities make places more liveable with parks, bike paths, community centres, better public transport, street trees and safer streets.
            codes: [VC2HG8K11]

  - title: Landforms and landscapes
    chapters:
      - title: Landscapes of Australia
        id: vic-geo-78-3-1
        points:
          - title: Landscapes and landforms
            id: geo-landscapes-landforms-vic
            brief: A landform is a single natural feature of the Earth's surface, such as a hill or valley. A landscape is a larger area made of many landforms together.
            codes: [VC2HG8K12]
          - title: Types of landscapes
            id: geo-types-landscapes-vic
            brief: Landscapes include mountain, coastal, riverine, desert, karst (limestone) and volcanic landscapes, each with its own typical landforms.
            codes: [VC2HG8K12]
          - title: Australia's major landforms
            id: geo-australia-s-major-landforms
            brief: Australia is old, low and flat, with the Great Dividing Range in the east, the Central Lowlands, and the Western Plateau covering most of the west.
            codes: [VC2HG8K12]
          - title: Why people value landscapes
            id: geo-people-value-landscapes
            brief: People value landscapes for their beauty, for recreation and tourism, for the resources they hold, and for their spiritual and cultural meaning.
            codes: [VC2HG8K13]
          - title: Landscapes in Aboriginal and Torres Strait Islander cultures
            id: geo-landscapes-aboriginal-torres-strait
            brief: Landforms carry deep cultural and spiritual meaning for Aboriginal and Torres Strait Islander Peoples, such as Uluru for the Anangu and Gariwerd (the Grampians) for the Djab Wurrung and Jardwadjali peoples.
            codes: [VC2HG8K13]

      - title: Shaping landforms
        id: vic-geo-78-3-2
        points:
          - title: Weathering
            id: geo-weathering-vic
            brief: Weathering breaks rock down where it sits, through physical processes like frost and heat, chemical processes like rain dissolving limestone, and living things like roots.
            codes: [VC2HG8K14]
          - title: Erosion, transport and deposition
            id: geo-erosion-transport-deposition
            brief: Erosion wears away and removes rock and soil by water, wind or ice. The material is carried away and dropped somewhere else, which builds new landforms.
            codes: [VC2HG8K14]
          - title: River landforms
            id: geo-river-landforms
            brief: Rivers cut V-shaped valleys and waterfalls near their source, form meanders and oxbow lakes in their middle course, and build floodplains and deltas where they slow down.
            codes: [VC2HG8K14]
          - title: Coastal landforms
            id: geo-coastal-landforms
            brief: Waves erode headlands into cliffs, caves, arches and stacks, such as the Twelve Apostles, and deposit sand to form beaches, spits and dunes.
            codes: [VC2HG8K14]
          - title: Tectonic forces and landforms
            id: geo-tectonic-forces-landforms
            brief: Moving tectonic plates fold and fault rock to build mountains and rift valleys, and push up volcanoes where magma reaches the surface.
            codes: [VC2HG8K14]

      - title: People changing landforms
        id: vic-geo-78-3-3
        points:
          - title: Human causes of landform change
            id: geo-human-causes-landform-change
            brief: Mining, quarrying, building, dams, land clearing and farming change landforms directly or speed up erosion.
            codes: [VC2HG8K15]
          - title: Managing coasts
            id: geo-managing-coasts-vic
            brief: Hard engineering such as sea walls and groynes protects coasts but can move erosion elsewhere. Soft approaches such as beach nourishment and replanting dunes work with natural processes.
            codes: [VC2HG8K15]
          - title: Protecting landscapes
            id: geo-protecting-landscapes
            brief: National parks, World Heritage listing and rules on development protect landforms, and Traditional Owners often share in managing them.
            codes: [VC2HG8K15]
          - title: Explaining landforms with interconnection and change
            id: geo-explaining-landforms-with-interconnection
            brief: Interconnection shows how processes such as climate, rivers and people link to shape a landform. Change shows how it formed over long time spans and can be altered quickly.
            codes: [VC2HG8K17]

      - title: Geomorphological hazards
        id: vic-geo-78-3-4
        points:
          - title: What a geomorphological hazard is
            id: geo-geomorphological-hazard
            brief: A hazard caused by processes in or on the Earth's crust, such as earthquakes, volcanic eruptions, tsunamis and landslides, most common along plate boundaries.
            codes: [VC2HG8K16]
          - title: Earthquakes
            id: geo-earthquakes-vic
            brief: Earthquakes happen when rock along a fault slips suddenly. Their impacts include collapsed buildings, landslides and fires, and they are worst where buildings are weak and populations dense.
            codes: [VC2HG8K16]
          - title: Volcanic eruptions
            id: geo-volcanic-eruptions
            brief: Volcanoes form where magma rises, often at plate boundaries such as the Pacific Ring of Fire. Eruptions bring lava, ash, gas and mudflows, but volcanic soils are also fertile.
            codes: [VC2HG8K16]
          - title: Tsunamis
            id: geo-tsunamis-vic
            brief: A tsunami is a series of huge waves, usually set off by an undersea earthquake. The 2004 Indian Ocean tsunami showed how far the damage can spread.
            codes: [VC2HG8K16]
          - title: Reducing the risk of geomorphological hazards
            id: geo-reducing-risk-geomorphological-hazards
            brief: Communities cut the harm with warning systems, earthquake-resistant buildings, land-use planning, evacuation drills and aid after the event.
            codes: [VC2HG8K16]

  - title: Changing nations
    chapters:
      - title: Urbanisation
        id: vic-geo-78-4-1
        points:
          - title: Urbanisation and why it happens
            id: geo-urbanisation-it-happens
            brief: Urbanisation is the growing share of people living in towns and cities. People are pushed from rural areas by poverty and few jobs, and pulled to cities by work, services and education.
            codes: [VC2HG8K18]
          - title: Impacts of rapid urbanisation
            id: geo-impacts-rapid-urbanisation
            brief: Fast city growth can bring jobs and higher incomes, but also slums, traffic, pollution, water shortages and the loss of farmland. Megacities of over 10 million people feel these pressures most.
            codes: [VC2HG8K18]
          - title: Urbanisation in Indonesia
            id: geo-urbanisation-indonesia
            brief: Jakarta grew fast as people moved from rural areas for work. Flooding, traffic and the city sinking from groundwater pumping led Indonesia to build a new capital, Nusantara, on Borneo.
            codes: [VC2HG8K18]
          - title: Urbanisation in China
            id: geo-urbanisation-china
            brief: China moved from a mostly rural to a mostly urban country in a few decades, as factories drew workers to coastal cities, bringing growth but also pollution and crowding.
            codes: [VC2HG8K18]

      - title: Migration and urban patterns
        id: vic-geo-78-4-2
        points:
          - title: Internal and international migration
            id: geo-internal-international-migration-vic
            brief: Internal migration is moving within a country. International migration is moving between countries. Both are driven by push and pull factors.
            codes: [VC2HG8K19]
          - title: Migration and Australia's cities
            id: geo-migration-australia-s-cities
            brief: Most migrants to Australia settle in the capital cities, especially Sydney and Melbourne, which is a large part of why those cities keep growing.
            codes: [VC2HG8K19]
          - title: Internal migration in Australia
            id: geo-internal-migration-australia-vic
            brief: Australians move between places too, such as to Queensland and Western Australia for work or climate, and from cities to the coast or country for a sea change or tree change.
            codes: [VC2HG8K19]
          - title: Internal migration in China
            id: geo-internal-migration-china-vic
            brief: Hundreds of millions of rural Chinese have moved to cities for factory and service work, one of the largest migrations in history, shaped by the hukou household registration system.
            codes: [VC2HG8K19]
          - title: Australia's urban pattern
            id: geo-australia-s-urban-pattern-vic
            brief: Australia is one of the most urbanised countries. Most people live in a few large capital cities near the coast, and each capital is far bigger than the next town in its state.
            codes: [VC2HG8K20]
          - title: Comparing Australia and the United States
            id: geo-comparing-australia-united-states-vic
            brief: Both countries are highly urbanised, but the United States has many large cities spread across the country, while Australia's people are packed into a handful of coastal capitals.
            codes: [VC2HG8K20]

      - title: Sustainable cities
        id: vic-geo-78-4-3
        points:
          - title: Urban sprawl
            id: geo-urban-sprawl
            brief: Sprawl is a city spreading outward in low-density suburbs. It uses up farmland and bush, lengthens travel, and makes services and public transport harder to provide.
            codes: [VC2HG8K21]
          - title: Making cities more sustainable
            id: geo-making-cities-more-sustainable
            brief: Cities become more sustainable with better public transport, homes closer to jobs, energy-efficient buildings, recycling and protected green space.
            codes: [VC2HG8K21]
          - title: Cities and climate change
            id: geo-cities-climate-change
            brief: Cities trap heat in the urban heat island effect, which climate change makes worse. They adapt with street trees, cool roofs, shade and flood-safe planning.
            codes: [VC2HG8K21]
          - title: Understanding urbanisation through geographical concepts
            id: geo-understanding-urbanisation-through-geographical
            brief: Space, place, interconnection, change and sustainability help explain where cities grow, what they are like, how they link to rural areas and whether their growth can last.
            codes: [VC2HG8K22]

  - title: Geographical skills
    chapters:
      - title: Maps and graphs
        id: vic-geo-78-5-1
        points:
          - title: Map scale and direction
            id: geo-map-scale-direction
            brief: Scale shows how distance on a map relates to real distance, as a ratio, a line or words. Compass points and a north arrow give direction.
            codes: [VC2HG8S03]
          - title: Grid references, latitude and longitude
            id: geo-grid-references-latitude-longitude
            brief: Area and grid references find places on a map by its grid squares, eastings then northings. Latitude and longitude locate any place on Earth in degrees north or south and east or west.
            codes: [VC2HG8S03]
          - title: Contour lines on topographic maps
            id: geo-contour-lines-topographic-maps
            brief: Contour lines join points of the same height. Lines close together show steep slopes and lines far apart show gentle ones.
            codes: [VC2HG8S03, VC2HG8S04]
          - title: Geospatial technologies
            id: geo-geospatial-technologies
            brief: GPS, satellite images and geographic information systems (GIS) collect and layer information about places so patterns can be mapped and studied.
            codes: [VC2HG8S02, VC2HG8S03]
          - title: Climate graphs
            id: geo-climate-graphs
            brief: A climate graph shows a place's average monthly rainfall as columns and temperature as a line, so its seasons and climate can be read at a glance.
            codes: [VC2HG8S03, VC2HG8S04]

      - title: Investigating like a geographer
        id: vic-geo-78-5-2
        points:
          - title: Geographical inquiry questions
            id: geo-geographical-inquiry-questions
            brief: Good inquiry questions ask what and where something is, why it is there, how it affects people and places, and what should be done.
            codes: [VC2HG8S01]
          - title: Primary and secondary data
            id: geo-primary-secondary-data-vic
            brief: Primary data is collected first-hand, such as fieldwork surveys and measurements. Secondary data comes from others, such as census figures, reports and maps.
            codes: [VC2HG8S02]
          - title: Patterns, trends and relationships
            id: geo-patterns-trends-relationships
            brief: A pattern is how something is spread across space, a trend is a change over time, and a relationship is how two things change together.
            codes: [VC2HG8S04]
          - title: Drawing conclusions and choosing actions
            id: geo-drawing-conclusions-choosing-actions
            brief: A sound conclusion rests on evidence and considers ethical values, such as fairness. A good action weighs its environmental, economic and social effects.
            codes: [VC2HG8S05, VC2HG8S06]
