# NSW Mathematics, Stage 5 core (Years 9 and 10): all 18 Stage 5 core focus areas, 59 points.
# Follows NESA's Mathematics K-10 Syllabus (2022), Stage 5 core content, checked on the NSW Curriculum website
# (curriculum.nsw.edu.au) in November 2026. It replaced the 2012 syllabus and has been taught in Years 7 to 10 since
# 2024 (the department's staggered start: Years 7 and 9 in 2024, Years 8 and 10 in 2025). NESA's curriculum reform
# timeline names no replacement. Its only change since was a glossary fix in August 2026.
# Stage 5 has core focus areas, which every student studies, and path focus areas, which schools choose. The paths
# are a separate course, nsw-mat-s5p, so that each stays a manageable size.
# Structure: each focus area is a chapter, and a focus area split into A and B is one chapter or two, by size. The
# chapters are grouped into three units: number and algebra, measurement and space, and statistics and probability.
# Each point lists its focus area's outcome code. The working mathematically outcome (MAO-WM-01) runs through every
# chapter, so it is not listed on each point. Life Skills outcomes are left out. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths). Maths Lab templates can come later, per topic.

id: nsw-mat-s5
subject: Mathematics
bank: mat
name: Mathematics, Stage 5
about: NSW Stage 5, Years 9 and 10
short: Mathematics
years: [9, 10]
level: Stage 5
place: nsw
kind: maths
syllabus: NSW Mathematics K-10 Syllabus (2022), Stage 5 core
note: Follows the NSW Mathematics syllabus. Not made or endorsed by NESA.
chips: [simple interest, scientific notation, gradient, trigonometry, box plot, tree diagram]

units:
  - title: Number and algebra
    chapters:
      - title: Earning and simple interest
        id: nsw-mat-s5-1-1
        points:
          - title: Wages and salaries
            id: mat-wages-salaries-3
            brief: A wage is paid by the hour and a salary is a set amount a year. Converting between weekly, fortnightly and yearly pay, using 52 weeks in a year.
            codes: [MA5-FIN-C-01]
          - title: Overtime, commission and piecework
            id: mat-overtime-commission-piecework
            brief: Overtime is paid at a higher rate, such as time-and-a-half (1.5 times the normal rate). Commission is a percentage of sales, and piecework pays per item made.
            codes: [MA5-FIN-C-01]
          - title: Simple interest
            id: mat-simple-interest-3
            brief: Simple interest is the same amount each period, worked out from the principal, the rate and the time with I = Prn. Making sure the rate and time use the same period.
            codes: [MA5-FIN-C-01]
          - title: Spending, GST and best buys
            id: mat-spending-gst-best-buys
            brief: Working out the cost of a purchase with discounts and GST, comparing prices by unit cost, and the cost of buying on credit or with a loan.
            codes: [MA5-FIN-C-01]

      - title: Compound interest and depreciation
        id: nsw-mat-s5-1-2
        points:
          - title: Compound interest by repeated percentages
            id: mat-compound-interest-by-repeated-2
            brief: With compound interest, each period's interest is added to the balance, so the next period earns interest on interest. Multiplying by 1 plus the rate once for each period.
            codes: [MA5-FIN-C-02]
          - title: The compound interest formula
            id: mat-compound-interest-formula-nsw
            brief: The final amount is A = P(1 + r)ⁿ, with the rate and number of periods matched to how often interest is added. The interest is A minus P.
            codes: [MA5-FIN-C-02]
          - title: Depreciation
            id: mat-depreciation-nsw
            brief: Depreciation is an item losing value over time at a set rate. The value after n periods is the starting value times (1 - r)ⁿ.
            codes: [MA5-FIN-C-02]

      - title: Algebra and indices
        id: nsw-mat-s5-1-3
        points:
          - title: Adding and subtracting algebraic fractions
            id: mat-adding-subtracting-algebraic-fractions
            brief: Fractions with pronumerals in the numerator and numbers in the denominator are added like number fractions, using a common denominator, such as x/3 + x/4 = 7x/12.
            codes: [MA5-ALG-C-01]
          - title: Multiplying and dividing algebraic fractions
            id: mat-multiplying-dividing-algebraic-fractions
            brief: Multiply numerators and denominators, cancelling common factors first. To divide, multiply by the reciprocal.
            codes: [MA5-ALG-C-01]
          - title: Expanding and collecting like terms
            id: mat-expanding-collecting-like-terms
            brief: Expanding more than one set of brackets, such as 3(x + 2) - 2(x - 5), then collecting like terms, taking care with a negative outside the brackets.
            codes: [MA5-ALG-C-01]
          - title: Index laws with pronumerals
            id: mat-index-laws-with-pronumerals
            brief: Using the index laws on terms with pronumerals and coefficients, such as 3a²b × 4a³ = 12a⁵b and (2x³)² = 4x⁶.
            codes: [MA5-IND-C-01]
          - title: Negative indices with numbers
            id: mat-negative-indices-with-numbers
            brief: A negative index means the reciprocal, so 2⁻³ = 1/2³ = 1/8. Writing numbers with negative indices as fractions and back.
            codes: [MA5-IND-C-01]

      - title: Solving linear equations
        id: nsw-mat-s5-1-4
        points:
          - title: Three-step equations
            id: mat-three-step-equations
            brief: Solving equations that need up to three inverse operations, including ones with brackets, such as 2(x + 3) - 4 = 12.
            codes: [MA5-EQU-C-01]
          - title: Pronumerals on both sides
            id: mat-pronumerals-both-sides
            brief: Move the pronumeral terms to one side by adding or subtracting the same term on both sides, then solve, such as 5x - 3 = 2x + 9.
            codes: [MA5-EQU-C-01]
          - title: Equations with a fraction
            id: mat-equations-with-fraction
            brief: Multiply both sides by the denominator to clear the fraction, then solve, such as (x + 4)/3 = 5.
            codes: [MA5-EQU-C-01]
          - title: Equations from word problems
            id: mat-equations-from-word-problems
            brief: Choosing a pronumeral for the unknown, writing an equation from the words, solving it and checking the answer makes sense.
            codes: [MA5-EQU-C-01]
          - title: Substituting into formulas
            id: mat-substituting-into-formulas-2-nsw
            brief: Putting known values into a formula, such as v = u + at, then solving the equation that results for the unknown value.
            codes: [MA5-EQU-C-01]

      - title: Numbers of any size
        id: nsw-mat-s5-1-5
        points:
          - title: Scientific notation
            id: mat-scientific-notation
            brief: A number in scientific notation is a number from 1 to less than 10 times a power of 10, such as 4.6 × 10⁵ or 3.2 × 10⁻⁴. Converting to and from ordinary numbers.
            codes: [MA5-MAG-C-01]
          - title: Very large and very small units
            id: mat-very-large-very-small
            brief: Prefixes such as mega, giga, milli, micro and nano name powers of 10, used for distances in space or the size of cells and computer storage.
            codes: [MA5-MAG-C-01]
          - title: Significant figures
            id: mat-significant-figures-nsw
            brief: Rounding to a number of significant figures, counting from the first non-zero digit, and knowing when zeros count.
            codes: [MA5-MAG-C-01]
          - title: Absolute and percentage error
            id: mat-absolute-percentage-error
            brief: The absolute error of a measurement is half the smallest unit on the instrument. Percentage error is the absolute error over the measurement, times 100.
            codes: [MA5-MAG-C-01]

      - title: Coordinate geometry
        id: nsw-mat-s5-1-6
        points:
          - title: Gradient of an interval
            id: mat-gradient-interval-nsw
            brief: Gradient is rise over run. Positive gradients slope up to the right, negative slope down, horizontal lines have gradient 0 and vertical lines have no gradient.
            codes: [MA5-LIN-C-01]
          - title: Midpoint of an interval
            id: mat-midpoint-interval-nsw
            brief: The midpoint is halfway between the two ends, found by averaging the x values and averaging the y values.
            codes: [MA5-LIN-C-01]
          - title: Distance between two points
            id: mat-distance-between-two-points-nsw
            brief: Draw a right-angled triangle with the interval as its hypotenuse, find the horizontal and vertical sides, then use Pythagoras' theorem.
            codes: [MA5-LIN-C-01]
          - title: Horizontal and vertical lines
            id: mat-horizontal-vertical-lines
            brief: A horizontal line has an equation y = c and a vertical line x = c. Parallel lines have the same gradient.
            codes: [MA5-LIN-C-01]

      - title: Equations of lines
        id: nsw-mat-s5-1-7
        points:
          - title: Gradient-intercept form
            id: mat-gradient-intercept-form
            brief: In y = mx + c, m is the gradient and c is the y-intercept. Reading both from an equation and drawing the line from them.
            codes: [MA5-LIN-C-02]
          - title: Finding the equation of a line
            id: mat-finding-equation-line
            brief: Finding m and c from a graph, or from the gradient and one point, and writing the equation as y = mx + c.
            codes: [MA5-LIN-C-02]
          - title: Parallel and perpendicular lines
            id: mat-parallel-perpendicular-lines
            brief: Parallel lines have equal gradients. Perpendicular lines have gradients that multiply to -1, so a line with gradient 2 is perpendicular to one with gradient -1/2.
            codes: [MA5-LIN-C-02]

      - title: Parabolas and exponentials
        id: nsw-mat-s5-1-8
        points:
          - title: Graphs of parabolas
            id: mat-graphs-parabolas
            brief: The graph of y = ax² + c is a parabola. a sets which way it opens and how wide it is, and c moves it up or down.
            codes: [MA5-NLI-C-01, MA5-NLI-C-02]
          - title: Features of a parabola
            id: mat-features-parabola
            brief: The vertex, the axis of symmetry and the x- and y-intercepts, and reading each from a graph or a table of values.
            codes: [MA5-NLI-C-02]
          - title: Exponential graphs
            id: mat-exponential-graphs-nsw
            brief: In y = 2ˣ, y doubles each time x goes up by 1. The curve passes through (0, 1) and gets close to the x-axis without reaching it.
            codes: [MA5-NLI-C-01, MA5-NLI-C-02]
          - title: Exponential growth and decay
            id: mat-exponential-growth-decay-2
            brief: Growth multiplies by a number greater than 1 each step, such as a population, and decay by a number between 0 and 1, such as a cooling drink.
            codes: [MA5-NLI-C-02]
          - title: Linear, quadratic or exponential
            id: mat-linear-quadratic-or-exponential
            brief: Telling the three kinds apart from a graph, a table or an equation, such as equal differences in y for linear and equal ratios for exponential.
            codes: [MA5-NLI-C-02]

  - title: Measurement and space
    chapters:
      - title: Trigonometric ratios
        id: nsw-mat-s5-2-1
        points:
          - title: Naming the sides of a right-angled triangle
            id: mat-naming-sides-right-angled
            brief: The hypotenuse is opposite the right angle. The opposite and adjacent sides depend on which angle is being used.
            codes: [MA5-TRG-C-01]
          - title: Sine, cosine and tangent
            id: mat-sine-cosine-tangent
            brief: For a given angle, sin is opposite over hypotenuse, cos is adjacent over hypotenuse and tan is opposite over adjacent, the same for every triangle with that angle.
            codes: [MA5-TRG-C-01]
          - title: Finding a side with trigonometry
            id: mat-finding-side-with-trigonometry-nsw
            brief: Choose the ratio that links the known side and the unknown side to the angle, then solve, noting whether the unknown is on the top or bottom of the fraction.
            codes: [MA5-TRG-C-01]
          - title: Finding an angle with trigonometry
            id: mat-finding-angle-with-trigonometry-nsw
            brief: Choose the ratio from the two known sides, then use the inverse function on a calculator, such as tan⁻¹, with the calculator in degree mode.
            codes: [MA5-TRG-C-01]

      - title: Elevation, depression and bearings
        id: nsw-mat-s5-2-2
        points:
          - title: Angles of elevation and depression
            id: mat-angles-elevation-depression-nsw
            brief: An angle of elevation is measured up from the horizontal and an angle of depression down from the horizontal. The two are equal as alternate angles.
            codes: [MA5-TRG-C-02]
          - title: Compass and true bearings
            id: mat-compass-true-bearings
            brief: A compass bearing such as S40°E starts from north or south. A true bearing is three digits measured clockwise from north, such as 140°.
            codes: [MA5-TRG-C-02]
          - title: Solving bearing problems
            id: mat-solving-bearing-problems
            brief: Drawing a diagram from bearings, finding the right-angled triangle, and using trigonometry or Pythagoras' theorem to find a distance or a direction.
            codes: [MA5-TRG-C-02]

      - title: Surface area and volume
        id: nsw-mat-s5-2-3
        points:
          - title: Composite areas
            id: mat-composite-areas
            brief: Finding the area of a shape made of rectangles, triangles, trapeziums and parts of circles by adding or subtracting the simpler areas.
            codes: [MA5-ARE-C-01]
          - title: Surface area of a prism
            id: mat-surface-area-prism
            brief: The surface area is the total area of every face. Drawing the net helps make sure no face is missed or counted twice.
            codes: [MA5-ARE-C-01]
          - title: Surface area of a cylinder
            id: mat-surface-area-cylinder
            brief: A closed cylinder has two circles and a curved surface that unrolls into a rectangle of length 2πr, giving 2πr² + 2πrh. An open cylinder has one circle.
            codes: [MA5-ARE-C-01]
          - title: Volume of composite solids
            id: mat-volume-composite-solids-nsw
            brief: Splitting a solid into prisms and cylinders, finding each volume and adding them, or subtracting a hole that has been cut out.
            codes: [MA5-VOL-C-01]

      - title: Similar figures
        id: nsw-mat-s5-2-4
        points:
          - title: Similar figures and scale factor
            id: mat-similar-figures-scale-factor
            brief: Similar figures have the same shape, with equal matching angles and matching sides in the same ratio. The scale factor is how many times bigger one is.
            codes: [MA5-GEO-C-01]
          - title: Finding sides in similar figures
            id: mat-finding-sides-similar-figures
            brief: Matching the corresponding sides, finding the scale factor from a known pair, then multiplying or dividing to find an unknown side.
            codes: [MA5-GEO-C-01]
          - title: Scale drawings and maps
            id: mat-scale-drawings-maps
            brief: A scale such as 1 to 50,000 means 1 cm on the map is 50,000 cm, or 500 m, in real life. Converting between map and real distances.
            codes: [MA5-GEO-C-01]

  - title: Statistics and probability
    chapters:
      - title: Spread and box plots
        id: nsw-mat-s5-3-1
        points:
          - title: Quartiles and interquartile range
            id: mat-quartiles-interquartile-range
            brief: Quartiles split ordered data into four equal parts. The interquartile range is the upper quartile minus the lower quartile, the spread of the middle half.
            codes: [MA5-DAT-C-01]
          - title: The five-number summary and box plots
            id: mat-five-number-summary-box
            brief: The minimum, lower quartile, median, upper quartile and maximum, and drawing them as a box plot.
            codes: [MA5-DAT-C-01]
          - title: Comparing datasets with box plots
            id: mat-comparing-datasets-with-box
            brief: Placing box plots side by side to compare medians and spreads, and deciding which group did better or is more consistent.
            codes: [MA5-DAT-C-01]
          - title: Standard deviation
            id: mat-standard-deviation
            brief: Standard deviation measures how far values typically are from the mean. A small standard deviation means the data is clustered, found with a calculator.
            codes: [MA5-DAT-C-01]

      - title: Data with two variables
        id: nsw-mat-s5-3-2
        points:
          - title: Independent and dependent variables
            id: mat-independent-dependent-variables
            brief: Bivariate data has two numerical variables. The independent variable goes on the horizontal axis and the dependent variable, which may depend on it, on the vertical axis.
            codes: [MA5-DAT-C-02]
          - title: Scatter plots and correlation
            id: mat-scatter-plots-correlation
            brief: A scatter plot shows each pair as a point. Describing the pattern as positive or negative, strong or weak, or no correlation.
            codes: [MA5-DAT-C-02]
          - title: Lines of best fit
            id: mat-lines-best-fit
            brief: Drawing a line of best fit by eye, with about as many points above as below, and using it to make predictions inside the data with care beyond it.
            codes: [MA5-DAT-C-02]
          - title: Correlation and cause
            id: mat-correlation-cause
            brief: Two variables can be strongly related without one causing the other, as a third factor may drive both. Judging claims made from bivariate data.
            codes: [MA5-DAT-C-02]

      - title: Multistage probability
        id: nsw-mat-s5-3-3
        points:
          - title: Tree diagrams and tables of outcomes
            id: mat-tree-diagrams-tables-outcomes
            brief: Listing the outcomes of two or more steps, such as tossing a coin then rolling a die, with a tree diagram or a two-way table of outcomes.
            codes: [MA5-PRO-C-01]
          - title: Independent and dependent events
            id: mat-independent-dependent-events-nsw
            brief: Events are independent when one does not change the chance of the other, such as drawing with replacement. Without replacement, the second draw depends on the first.
            codes: [MA5-PRO-C-01]
          - title: Multiplying along branches
            id: mat-multiplying-along-branches
            brief: The probability of a path through a tree diagram is the product of the probabilities on its branches. Add the paths that give the event.
            codes: [MA5-PRO-C-01]
          - title: Simulations
            id: mat-simulations
            brief: A simulation uses coins, dice, random numbers or a spreadsheet to model a chance situation, and many trials give an estimate of the probability.
            codes: [MA5-PRO-C-01]
