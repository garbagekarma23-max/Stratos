# VCE English, Units 1 and 2: reading and exploring texts, crafting texts and exploring argument, 33 points.
# Checked against the VCAA's VCE English and English as an Additional Language Study Design, accredited from 2023
# (Units 3 and 4 from 2024), in October 2026. Each unit is a unit here, and each area of study is a chapter, or two
# when it is large. The study design gives the units no names, so the unit titles here are our own. Every brief is in
# our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# No points on a particular text: schools pick their own in Units 1 and 2. EAL shares this study design, so these
# points suit EAL students too.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-eng-u12
subject: English
bank: eng
name: English, Units 1 and 2
about: VCE, Reading, crafting texts and argument
short: English
years: [11]
level: Units 1 and 2
place: vic
kind: english
syllabus: VCE English and EAL Study Design (from 2023), Units 1 and 2
note: Follows the VCE English study design. Not made or endorsed by the VCAA.
chips: [personal response, mentor text, purpose, persuasive language, contention]

units:
  - title: "Unit 1: Reading and crafting texts"
    chapters:
      - title: Reading and exploring texts
        id: vic-eng-u12-1-1
        points:
          - title: Making a personal response
            id: eng-making-personal-response
            brief: A personal response connects a text to your own experience and views, while still pointing to what the text shows.
          - title: Reading for inference
            id: eng-reading-inference
            brief: Good readers work out what a text suggests but does not say, from hints in word choice, detail and what is left out.
          - title: Ideas, concerns and tensions
            id: eng-ideas-themes
            brief: A text explores ideas and concerns, such as belonging or power, and tensions between people or values drive it.
          - title: The world of a text
            id: eng-world-text
            brief: Each text builds its own world of places, people, time and values, which readers enter as they read.
          - title: Characters and their choices
            id: eng-characters-their-choices
            brief: Writers show character through actions, speech, thoughts and how others react, and choices reveal what a character values.
          - title: Point of view and narration
            id: eng-point-view-narration
            brief: First-person narration gives one view from inside; third-person can range across many minds. The choice shapes what readers know.
          - title: Structure and how a text unfolds
            id: eng-structure-text-unfolds
            brief: Order of events, flashbacks, shifts in time and where a text starts and ends all shape meaning and suspense.
          - title: Writing about a text
            id: eng-writing-about-text
            brief: A good response makes a clear claim, supports it with short, well-chosen evidence and explains how the evidence shows it.

      - title: Crafting texts
        id: vic-eng-u12-1-2
        points:
          - title: Purpose, audience and context
            id: eng-purpose-audience-context-2
            brief: Every piece of writing is shaped by why it is written, who will read it and the situation it is written in.
          - title: Generating ideas
            id: eng-generating-ideas
            brief: Brainstorming, freewriting, borrowing a first line or starting from an image are ways to find and grow an idea for writing.
          - title: Mentor texts
            id: eng-mentor-texts
            brief: Studying published texts as models to learn techniques, such as how an opening hooks a reader, then trying them in your own writing.
          - title: Text types and forms
            id: eng-text-types-forms
            brief: Forms such as short stories, personal essays, speeches, podcasts, poems and feature articles each have conventions readers expect.
          - title: Language modes
            id: eng-language-modes
            brief: Writing for the page, for speaking aloud or for a screen changes how a piece is structured and how it makes meaning.
          - title: Language choices for effect
            id: eng-language-choices-effect
            brief: Word choice, imagery, sentence length and tone are chosen to create a mood or reaction in the reader.
          - title: Voice
            id: eng-voice
            brief: The personality a reader hears in a piece of writing, shaped by word choice, tone and rhythm.
          - title: Drafting and refining
            id: eng-drafting-refining
            brief: Writers draft, get feedback, revise structure and polish language, and can explain why each change was made.
          - title: Reflecting on your choices
            id: eng-writing-statement-intention
            brief: Writers explain the choices they made in a piece, and how each serves its purpose and audience.

  - title: "Unit 2: Reading texts and exploring argument"
    chapters:
      - title: Reading and exploring a second text
        id: vic-eng-u12-2-1
        points:
          - title: Analysing how a text is built
            id: eng-analysing-text-built
            brief: Analytical responses look at how a writer's choices of language, structure and form create meaning, not only what happens.
          - title: Values in a text
            id: eng-values-text
            brief: Texts show values, such as loyalty or justice, that characters hold or that the writer seems to support or question.
          - title: Context and a text
            id: eng-context-text
            brief: The historical context of a text, and the social and cultural values in it, shape its ideas and how readers respond.
          - title: Building an analytical paragraph
            id: eng-building-analytical-paragraph
            brief: A topic sentence makes a claim, evidence supports it, analysis explains it, and a link ties it back to the question.
          - title: Using quotations well
            id: eng-using-quotations-well
            brief: Short quotations woven into your own sentences show close reading better than long quotations.

      - title: Exploring argument
        id: vic-eng-u12-2-2
        points:
          - title: Issues in the media
            id: eng-issues-media
            brief: An issue is a topic people disagree on, debated in news, opinion pieces, speeches, podcasts and social media.
          - title: Contention
            id: eng-contention
            brief: The contention is the main point a writer argues, the position they want readers to accept.
          - title: Arguments and evidence
            id: eng-arguments-evidence
            brief: Arguments are the reasons that support a contention, backed by evidence such as statistics, expert views and examples.
          - title: Sequence and structure of an argument
            id: eng-sequence-structure-argument
            brief: The order of arguments, from an opening anecdote to a final call to action, guides readers to the writer's view.
          - title: Persuasive techniques
            id: eng-persuasive-techniques
            brief: Writers persuade with techniques such as appeals to emotion or fairness, inclusive language, rhetorical questions and attacks on opponents.
          - title: Tone and its effect
            id: eng-tone-effect
            brief: A writer's tone, such as outraged, measured or sarcastic, shapes how readers feel about the issue and the writer.
          - title: Visuals in persuasive texts
            id: eng-visuals-persuasive-texts
            brief: Cartoons, photos and graphics can persuade by mocking, shocking or supporting the written argument.

      - title: Spoken argument and point of view
        id: vic-eng-u12-2-3
        points:
          - title: Persuasion in spoken texts
            id: eng-persuasion-spoken-texts
            brief: In speeches, podcasts and videos, intonation, volume, pace, pauses and stress add to the persuasive effect of the words.
          - title: Context and argument
            id: eng-context-argument
            brief: When, where and for whom an argument appears changes how it is made and how audiences react.
          - title: Evaluating arguments
            id: eng-logic-reasoning-flaws
            brief: Listening closely and asking questions shows when an argument is weak, such as generalising from one case or attacking a person instead of the idea.
          - title: Presenting your own point of view
            id: eng-writing-your-own-point
            brief: Students plan and present their own spoken point of view, choosing arguments and techniques that suit their audience.
