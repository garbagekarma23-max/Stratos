# VCE Physics, Units 1 and 2: energy, motion, and how physics explains the world, 34 points.
# Drafted from the VCAA's VCE Physics Study Design, Units 1 and 2 from 2023 and Units 3 and 4 from 2024. The structure
# follows the study design: each unit is a unit here, and each area of study is a chapter. Unit 2's options and the
# investigations are school-picked or school-run, so they are not here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW Physics (the phys bank) covers much of the motion and electricity, so expect reuses and adapts.
# The study design's end date was not confirmed when this was drafted (a school guide gives 2027). Check it first.

id: vic-phys-u12
subject: Physics
bank: phys
name: Physics, Units 1 and 2
about: VCE, Heat, nuclear energy, electricity and motion
short: Physics
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Physics Study Design (from 2023), Units 1 and 2
note: Follows the VCE Physics study design. Not made or endorsed by the VCAA.
chips: [specific heat capacity, half-life, Ohm's law, momentum, Newton's laws]

units:
  - title: "Unit 1: How is energy useful to society?"
    chapters:
      - title: Light and heat
        id: vic-phys-u12-1-1
        points:
          - title: Temperature and internal energy
            id: phys-temperature-internal-energy
            brief: Temperature measures the average kinetic energy of particles. Internal energy is the total energy of all of them.
          - title: Heat transfer
            id: phys-heat-transfer
            brief: Heat moves by conduction through contact, convection through moving fluids and radiation as electromagnetic waves.
          - title: Specific heat capacity in physics
            id: phys-specific-heat-capacity-physics
            brief: Q = mcΔT gives the energy to change an object's temperature.
          - title: Latent heat
            id: phys-latent-heat-2
            brief: Energy absorbed or released during a change of state at constant temperature, Q = mL.
          - title: Thermal equilibrium
            id: phys-thermal-equilibrium
            brief: Objects in contact exchange heat until they reach the same temperature.
          - title: The electromagnetic spectrum
            id: phys-electromagnetic-spectrum-2
            brief: Radio waves to gamma rays all travel at the speed of light, differing in wavelength and frequency.
          - title: Black body radiation
            id: phys-black-body-radiation-2
            brief: Hotter objects emit more radiation and at shorter peak wavelengths, as Wien's law describes.
          - title: The greenhouse effect and climate
            id: phys-greenhouse-effect-climate
            brief: Greenhouse gases absorb and re-emit infrared radiation from Earth's surface, warming it. More of them warms it further.

      - title: Energy from the nucleus
        id: vic-phys-u12-1-2
        points:
          - title: Nuclear stability
            id: phys-nuclear-stability
            brief: The strong nuclear force holds the nucleus together against the repulsion of protons. Unstable nuclei decay.
          - title: Alpha, beta and gamma radiation
            id: phys-alpha-beta-gamma-radiation
            brief: Alpha particles are helium nuclei, beta particles are electrons or positrons, and gamma rays are high-energy photons.
          - title: Nuclear equations
            id: phys-nuclear-equations
            brief: In a decay, mass numbers and atomic numbers balance on both sides.
          - title: Half-life
            id: phys-half-life-2
            brief: The time for half the radioactive nuclei in a sample to decay.
          - title: Effects of ionising radiation
            id: phys-effects-ionising-radiation
            brief: Radiation can damage cells. Dose equivalent in sieverts accounts for the type of radiation.
          - title: Nuclear fission
            id: phys-nuclear-fission
            brief: A heavy nucleus splits into smaller ones, releasing energy and neutrons that can start a chain reaction.
          - title: Nuclear fusion
            id: phys-nuclear-fusion
            brief: Light nuclei join into a heavier one, releasing energy, as in the Sun.
          - title: Mass defect and energy
            id: phys-mass-defect-energy
            brief: The products of fission or fusion have less mass, and the missing mass becomes energy by E = mc².

      - title: Electricity
        id: vic-phys-u12-1-3
        points:
          - title: Charge and current
            id: phys-charge-current
            brief: Current is the rate of flow of charge, I = q/t, measured in amperes.
          - title: Potential difference
            id: phys-potential-difference-2
            brief: The energy each coulomb of charge gains or loses, measured in volts.
          - title: Resistance and Ohm's law
            id: phys-resistance-ohm-s-law
            brief: V = IR. Ohmic devices have a constant resistance; others, such as diodes, do not.
          - title: Series circuits
            id: phys-series-circuits
            brief: Current is the same everywhere, voltages add up to the supply, and resistances add.
          - title: Parallel circuits
            id: phys-parallel-circuits
            brief: Voltage is the same across each branch, currents add, and total resistance is less than any one branch.
          - title: Electrical power and energy
            id: phys-electrical-power-energy
            brief: P = VI, and energy used is power times time, often billed in kilowatt-hours.
          - title: Electrical safety at home
            id: phys-electrical-safety-at-home
            brief: Fuses and circuit breakers stop overloads, earthing protects metal cases, and residual current devices cut power when current leaks.

  - title: "Unit 2: How does physics help us to understand the world?"
    chapters:
      - title: Motion
        id: vic-phys-u12-2-1
        points:
          - title: Scalars and vectors
            id: phys-scalars-vectors-2
            brief: Scalars have size only, such as speed. Vectors have size and direction, such as velocity.
          - title: Displacement, velocity and acceleration
            id: phys-displacement-velocity-acceleration
            brief: Velocity is the rate of change of displacement and acceleration is the rate of change of velocity.
          - title: Motion graphs
            id: phys-motion-graphs
            brief: The gradient of a position-time graph is velocity; the area under a velocity-time graph is displacement.
          - title: Equations of motion
            id: phys-equations-motion
            brief: For constant acceleration, equations such as v = u + at and s = ut + ½at² link the quantities.
          - title: Newton's first law
            id: phys-newton-s-first-law-2
            brief: An object stays at rest or moves at constant velocity unless a net force acts on it.
          - title: Newton's second law
            id: phys-newton-s-second-law-2
            brief: Net force equals mass times acceleration, F = ma.
          - title: Newton's third law
            id: phys-newton-s-third-law-2
            brief: When one object pushes on another, the second pushes back with an equal and opposite force.
          - title: Momentum and impulse in physics
            id: phys-momentum-impulse-physics
            brief: Momentum is mass times velocity. Impulse, force times time, equals the change in momentum, and total momentum is conserved.
          - title: Work and energy
            id: phys-work-energy
            brief: Work is force times distance moved. Kinetic energy is ½mv² and gravitational potential energy is mgh.
          - title: Conservation of energy and efficiency
            id: phys-conservation-energy-efficiency
            brief: Energy is never lost but changes form. Efficiency is the useful energy out divided by the energy in.
          - title: Torque
            id: phys-torque-2
            brief: The turning effect of a force, force times the perpendicular distance from the pivot.
