# Australian Curriculum Science, Year 7: classification, ecosystems, the Earth-sun-moon system, forces, particles and
# mixtures, with Science as a human endeavour and the ideas behind Science inquiry, 40 points.
# Follows ACARA's Australian Curriculum: Science, Version 9.0 (Science curriculum content, Years 7-10), checked on
# australiancurriculum.edu.au in November 2026. Version 9.0 was approved in April 2022 and released for use from 2023;
# each state and territory sets when its schools start it (Queensland schools teach every v9 learning area by the end
# of 2027). No newer version is announced. Western Australia and South Australia teach their own versions built on it.
# The Science understanding strand is a unit, with a chapter for each content description (AC9S7U01 to U06). Science
# as a human endeavour and Science inquiry share the second unit, one chapter each: inquiry is taught as the ideas
# behind an investigation (fair tests, variables, data), not as practical work. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-sci-7
subject: Science
bank: sci
name: Science, Year 7
about: Australian Curriculum, Year 7
short: Science
years: [7]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Science, Version 9.0, Year 7"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [classification, food web, eclipse, balanced forces, particle theory, filtration]

units:
  - title: Science understanding
    chapters:
      - title: Classifying living things
        id: ac-sci-7-1-1
        points:
          - title: Why scientists classify living things
            id: sci-scientists-classify-living-things
            brief: Grouping organisms by shared features makes the huge variety of life easier to identify, study and talk about.
            codes: [AC9S7U01]
          - title: The Linnaean hierarchy
            id: sci-linnaean-hierarchy
            brief: Living things are sorted into ever smaller groups, kingdom, phylum, class, order, family, genus and species, with each group sharing more features.
            codes: [AC9S7U01]
          - title: Scientific names
            id: sci-scientific-names
            brief: Each species has a two-part Latin name, its genus then its species, such as Homo sapiens, so scientists everywhere name it the same way.
            codes: [AC9S7U01]
          - title: Using a dichotomous key
            id: sci-using-dichotomous-key
            brief: A dichotomous key identifies an organism through a series of two-way choices about its features, each choice splitting the group in two.
            codes: [AC9S7U01]
          - title: First Nations Australians' classification systems
            id: sci-first-nations-australians-classification
            brief: First Nations Australians have long classified plants and animals by features such as use, habitat, season and relationships, which can differ from the Linnaean system.
            codes: [AC9S7U01]

      - title: Food webs and ecosystems
        id: ac-sci-7-1-2
        points:
          - title: Producers, consumers and decomposers
            id: sci-producers-consumers-decomposers
            brief: Producers make their own food from sunlight, consumers eat other organisms, and decomposers such as fungi and bacteria break down dead matter and return nutrients to the soil.
            codes: [AC9S7U02]
          - title: Food chains and food webs
            id: sci-food-chains-food-webs
            brief: A food chain shows one feeding path, and the arrows point from the food to the eater. A food web joins many chains to show how an ecosystem's organisms depend on each other.
            codes: [AC9S7U02]
          - title: Energy flow in an ecosystem
            id: sci-energy-flow-ecosystem
            brief: Energy enters as sunlight, passes from one feeding level to the next, and much of it is lost as heat at each step, so there are fewer organisms higher up a food web.
            codes: [AC9S7U02]
          - title: Biotic and abiotic factors
            id: sci-biotic-abiotic-factors
            brief: Biotic factors are the living parts of an ecosystem, and abiotic factors are the non-living ones such as temperature, water, light and soil. Both affect population sizes.
            codes: [AC9S7U02]
          - title: Changes that disrupt ecosystems
            id: sci-changes-that-disrupt-ecosystems
            brief: Removing a predator or pollinator, clearing habitat or bringing in a species such as the cane toad changes populations right through a food web.
            codes: [AC9S7U02]
          - title: Fire management by First Nations Australians
            id: sci-fire-management-by-first
            brief: For tens of thousands of years, First Nations Australians have used planned, cool burning to manage Country, which has shaped where plants and animals live.
            codes: [AC9S7U02]

      - title: The Earth, sun and moon
        id: ac-sci-7-1-3
        points:
          - title: Why we have seasons
            id: sci-we-have-seasons
            brief: The Earth's axis is tilted, so through the year each hemisphere takes turns facing the sun more directly, getting more concentrated light and longer days in summer.
            codes: [AC9S7U03]
          - title: Phases of the moon
            id: sci-phases-moon
            brief: The moon reflects sunlight. As it orbits the Earth about every 29.5 days, we see different amounts of its lit half, from new moon to full moon and back.
            codes: [AC9S7U03]
          - title: Solar and lunar eclipses
            id: sci-solar-lunar-eclipses
            brief: A solar eclipse happens when the moon passes between the sun and Earth. A lunar eclipse happens when the Earth's shadow falls on the moon.
            codes: [AC9S7U03]
          - title: Tides
            id: sci-tides
            brief: The moon's gravity, and to a lesser extent the sun's, pulls on the oceans to make high and low tides. Spring tides come when the sun and moon line up.
            codes: [AC9S7U03]
          - title: First Nations Australians' knowledge of the sky
            id: sci-first-nations-australians-knowledge
            brief: First Nations Australians have used the moon's phases, the stars and seasonal signs in calendars to predict tides, seasons and when foods are ready.
            codes: [AC9S7U03]

      - title: Forces and motion
        id: ac-sci-7-1-4
        points:
          - title: What a force is
            id: sci-force
            brief: A force is a push or a pull, measured in newtons with a force meter. A force arrow shows its size by its length and its direction by where it points.
            codes: [AC9S7U04]
          - title: Balanced and unbalanced forces
            id: sci-balanced-unbalanced-forces
            brief: Balanced forces cancel out, so an object stays still or keeps moving steadily. Unbalanced forces make it start, stop, speed up, slow down or change direction.
            codes: [AC9S7U04]
          - title: Mass and the effect of a force
            id: sci-mass-effect-force
            brief: The same force changes the motion of a light object more than a heavy one, so a heavier object needs a bigger force to start or stop it.
            codes: [AC9S7U04]
          - title: Gravity, mass and weight
            id: sci-gravity-mass-weight
            brief: Gravity is a pulling force between masses. Weight is the force of Earth's gravity on an object, so it depends on mass, while mass stays the same anywhere.
            codes: [AC9S7U04]
          - title: Simple machines
            id: sci-simple-machines
            brief: Levers, pulleys and inclined planes change the size or direction of the force needed for a job, such as lifting a load with less effort.
            codes: [AC9S7U04]

      - title: Particle theory and states of matter
        id: ac-sci-7-1-5
        points:
          - title: The particle theory of matter
            id: sci-particle-theory-matter
            brief: All matter is made of tiny particles that are always moving and attract each other, with space between them.
            codes: [AC9S7U05]
          - title: Solids, liquids and gases
            id: sci-solids-liquids-gases
            brief: In a solid, particles are packed close and vibrate in place. In a liquid, they are close but slide past each other. In a gas, they are far apart and move freely, which is why gases can be squashed.
            codes: [AC9S7U05]
          - title: Changes of state
            id: sci-changes-state
            brief: Adding heat makes particles move faster and spread out, so substances melt and boil. Losing heat slows them, so substances condense and freeze.
            codes: [AC9S7U05]
          - title: Diffusion
            id: sci-diffusion
            brief: Particles spread from where there are many to where there are few, because they keep moving. Diffusion is faster in gases than in liquids, and faster when warmer.
            codes: [AC9S7U05]

      - title: Mixtures and separating them
        id: ac-sci-7-1-6
        points:
          - title: Pure substances and mixtures
            id: sci-pure-substances-mixtures
            brief: A pure substance has only one kind of particle. A mixture has two or more substances mixed but not joined, so they can be separated by physical means.
            codes: [AC9S7U06]
          - title: Solutions, solutes and solvents
            id: sci-solutions-solutes-solvents
            brief: In a solution, a solute such as salt dissolves into a solvent such as water and spreads out evenly. Water is called the universal solvent because it dissolves so much.
            codes: [AC9S7U06]
          - title: Filtration and decanting
            id: sci-filtration-decanting
            brief: Filtration catches undissolved solid particles in filter paper while the liquid passes through. Decanting pours a liquid off a solid that has settled.
            codes: [AC9S7U06]
          - title: Evaporation and crystallisation
            id: sci-evaporation-crystallisation
            brief: Heating a solution evaporates the solvent and leaves the dissolved solid behind. Slow evaporation lets larger crystals form.
            codes: [AC9S7U06]
          - title: Distillation and chromatography
            id: sci-distillation-chromatography
            brief: Distillation boils a liquid and condenses the vapour to collect it pure. Chromatography separates dissolved substances, such as dyes in ink, by how far they travel up paper.
            codes: [AC9S7U06]
          - title: Choosing a separation method
            id: sci-choosing-separation-method
            brief: The right method depends on the property that differs, such as particle size, density, solubility or boiling point, as in water treatment or First Nations Australians' yandying of seeds.
            codes: [AC9S7U06]

  - title: Science as a human endeavour and inquiry
    chapters:
      - title: Science and society
        id: ac-sci-7-2-1
        points:
          - title: How new evidence changes science
            id: sci-new-evidence-changes-science
            brief: Scientific ideas can change when new evidence or tools appear, as when better microscopes showed new groups of living things.
            codes: [AC9S7H01]
          - title: Culture and scientific knowledge
            id: sci-culture-scientific-knowledge
            brief: People from different cultures, including First Nations Australians, have built knowledge of the natural world through long observation, and their views can shape what science studies.
            codes: [AC9S7H02]
          - title: Weighing a scientific solution
            id: sci-weighing-scientific-solution
            brief: A science-based response to a problem, such as bringing in a species for pest control, has to be judged on its ethical, environmental, social and economic effects.
            codes: [AC9S7H03]
          - title: Science communication
            id: sci-science-communication
            brief: How science is reported in news, ads and social media affects what people believe and what rules governments make, so it should be clear and based on evidence.
            codes: [AC9S7H04]

      - title: Investigating like a scientist
        id: ac-sci-7-2-2
        points:
          - title: Questions, predictions and hypotheses
            id: sci-questions-predictions-hypotheses
            brief: An investigable question can be tested. A hypothesis is a testable idea that explains something, and a prediction says what will happen if it is right.
            codes: [AC9S7I01]
          - title: Independent, dependent and controlled variables
            id: sci-independent-dependent-controlled-variables
            brief: In a fair test you change one variable, measure another, and keep every other variable the same, so any change can be put down to the one you changed.
            codes: [AC9S7I02]
          - title: Measuring with precision
            id: sci-measuring-with-precision
            brief: Choosing the right instrument and reading it carefully at eye level gives precise measurements, recorded with the correct units.
            codes: [AC9S7I03]
          - title: Tables and graphs
            id: sci-tables-graphs
            brief: Results go in a table with the independent variable first. A line graph suits continuous data and a column graph suits categories.
            codes: [AC9S7I04, AC9S7I05]
          - title: Patterns, trends and anomalies
            id: sci-patterns-trends-anomalies
            brief: A trend is the general direction of the data. An anomaly is a result that does not fit the pattern, and it may come from an error.
            codes: [AC9S7I05, AC9S7I06]
