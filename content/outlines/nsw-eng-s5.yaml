# NSW English, Stage 5 (Years 9 and 10): the six Stage 5 focus areas, 69 points.
# Follows NESA's English K-10 Syllabus (2022), Stage 5 content, checked on the NSW Curriculum website
# (curriculum.nsw.edu.au) in November 2026. It replaced the English K-10 Syllabus (2012) in Years 7 to 10 from 2024
# (the department's recommended staggered start: Years 7 and 9 in 2024, Years 8 and 10 in 2025). NESA's curriculum
# reform timeline names no replacement.
# Structure: each focus area is a unit (Reading, viewing and listening; Understanding and responding A, B and C;
# Expressing ideas and composing A and B, which share the last unit). Each content group, such as Point of view or
# Style, is a chapter or part of one. Each point lists its focus area's outcome code. Life Skills outcomes are left
# out. Reading for enjoyment, reflecting and speaking practice are taught here only as the ideas behind them.
# Stage 5 builds on nsw-eng-s4, so where a concept returns the point teaches what is new at this stage.
# No set texts: schools choose their own, so every point teaches a concept with invented examples. Every brief is in
# our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-eng-s5
subject: English
bank: eng
name: English, Stage 5
about: NSW Stage 5, Years 9 and 10
short: English
years: [9, 10]
level: Stage 5
place: nsw
kind: english
syllabus: NSW English K-10 Syllabus (2022), Stage 5
note: Follows the NSW English syllabus. Not made or endorsed by NESA.
chips: [unreliable narrator, irony, thesis, film techniques, satire, genre]

units:
  - title: Reading, viewing and listening
    chapters:
      - title: Reading complex texts
        id: nsw-eng-s5-1-1
        points:
          - title: Linear and nonlinear texts
            id: eng-linear-nonlinear-texts
            brief: A linear text such as a novel is read in order from start to end. A nonlinear text such as a website or interactive story lets the reader choose a path, which changes how meaning is built.
            codes: [EN5-RVL-01]
          - title: Frame and parallel narratives
            id: eng-frame-parallel-narratives
            brief: A frame narrative places one story inside another. Parallel narratives run two story lines side by side. Both create layers of meaning as the stories comment on each other.
            codes: [EN5-RVL-01]
          - title: Ethical dilemmas in texts
            id: eng-ethical-dilemmas-texts
            brief: Many texts present problems with no simple right answer, where a character must choose between two goods or two harms. Readers weigh both sides rather than judging quickly.
            codes: [EN5-RVL-01]
          - title: Justifying a personal response
            id: eng-justifying-personal-response
            brief: A strong personal response explains why a text affected you by pointing to how it was made, such as its tone, a character's voice or the genre, not only to how you felt.
            codes: [EN5-RVL-01]
          - title: Language and identity online
            id: eng-language-identity-online
            brief: The way people speak shows who they are and which groups they belong to. Online platforms create new words and ways of speaking that signal identity.
            codes: [EN5-RVL-01]

  - title: Understanding and responding A
    chapters:
      - title: Representation and convention
        id: nsw-eng-s5-2-1
        points:
          - title: Representation as construction
            id: eng-representation-as-construction
            brief: Every text is a construction. Its composer chooses what to include and leave out, shaped by their context, their creative aims and assumptions they may not notice.
            codes: [EN5-URA-01]
          - title: Using and subverting conventions
            id: eng-using-subverting-conventions
            brief: Texts can follow the conventions of their form, adapt them or subvert them, deliberately breaking an expected pattern to surprise the audience or make a point.
            codes: [EN5-URA-01]
          - title: Nonfiction that tells a story
            id: eng-nonfiction-that-tells-story
            brief: Some nonfiction, such as memoir and feature journalism, uses fiction techniques like scene, dialogue and character to engage readers while staying true to fact.
            codes: [EN5-URA-01]
          - title: Metafiction
            id: eng-metafiction
            brief: Metafiction is writing that draws attention to itself as a text, such as a narrator who speaks to the reader about how the story is being told.
            codes: [EN5-URA-01]

      - title: Patterns of imagery
        id: nsw-eng-s5-2-2
        points:
          - title: Extended metaphor
            id: eng-extended-metaphor-nsw
            brief: A metaphor developed across a paragraph, poem or whole text, so that one comparison shapes the reader's understanding of a complex idea.
            codes: [EN5-URA-01]
          - title: Juxtaposition and contrast
            id: eng-juxtaposition-contrast
            brief: Placing two different things side by side, such as wealth and poverty in one scene, so each makes the other stand out and an idea becomes clear.
            codes: [EN5-URA-01]
          - title: Pathetic fallacy
            id: eng-pathetic-fallacy
            brief: Using weather or nature to reflect a character's feelings, such as a storm building as an argument grows, so emotion is shown without being stated.
            codes: [EN5-URA-01]
          - title: Verbal, situational and dramatic irony
            id: eng-verbal-situational-dramatic-irony
            brief: Verbal irony says the opposite of what is meant. Situational irony is an outcome opposite to what was expected. Dramatic irony is when the audience knows something a character does not.
            codes: [EN5-URA-01]
          - title: Country in Aboriginal and Torres Strait Islander writing
            id: eng-country-aboriginal-torres-strait
            brief: Many Aboriginal and Torres Strait Islander writers use imagery, symbol and metaphor drawn from Country and Place to express culture, identity and belonging. Teach reading these respectfully.
            codes: [EN5-URA-01]

      - title: Narration and focalisation
        id: nsw-eng-s5-2-3
        points:
          - title: Omniscient and limited narration
            id: eng-omniscient-limited-narration
            brief: An omniscient narrator knows every character's thoughts. A limited narrator stays close to one. Narrative distance is how near the telling sits to a character's mind.
            codes: [EN5-URA-01]
          - title: Unreliable narrators
            id: eng-unreliable-narrators
            brief: An unreliable narrator cannot be fully trusted, because they lie, misunderstand or are biased. Readers notice gaps between what the narrator says and what the details show.
            codes: [EN5-URA-01]
          - title: Multiple narrators
            id: eng-multiple-narrators
            brief: Some texts are told by several narrators in turn. Each gives a partial view, and the reader builds a fuller picture by comparing them.
            codes: [EN5-URA-01]
          - title: Author and persona
            id: eng-author-persona
            brief: The real author is different from the voice in the text. A poem's speaker or a story's narrator is a persona, so analysis says the speaker feels, not the poet feels.
            codes: [EN5-URA-01]
          - title: Direct, indirect and free indirect speech
            id: eng-direct-indirect-free-indirect
            brief: Direct speech quotes a character's words, indirect speech reports them, and free indirect speech blends a character's thoughts into the narrator's voice without quotation marks.
            codes: [EN5-URA-01]

      - title: Complex characters
        id: nsw-eng-s5-2-4
        points:
          - title: Foil characters
            id: eng-foil-characters
            brief: A foil is a character whose qualities contrast with another's, such as a careless friend beside a cautious hero, so the main character's traits stand out.
            codes: [EN5-URA-01]
          - title: Internal and external conflict
            id: eng-internal-external-conflict
            brief: External conflict is a struggle against another person, society or nature. Internal conflict is a struggle within a character's mind. Characters drive the plot through both.
            codes: [EN5-URA-01]
          - title: Characters and values
            id: eng-characters-values
            brief: Characters can reflect the values of their world, challenge them or subvert them. What happens to a character can suggest what the text approves of or questions.
            codes: [EN5-URA-01]
          - title: Building character through narration
            id: eng-building-character-through-narration
            brief: Characters can be shaped indirectly by who focalises the story and how their words are reported, not only by description and dialogue.
            codes: [EN5-URA-01]

      - title: Narrative choices
        id: nsw-eng-s5-2-5
        points:
          - title: Beginning in the middle
            id: eng-beginning-middle
            brief: Starting in the middle of the action, known as in medias res, skips or delays the orientation so a reader is pulled straight in and fills in the background later.
            codes: [EN5-URA-01]
          - title: Nonlinear structure
            id: eng-nonlinear-structure
            brief: Flashbacks, time jumps and stories told out of order control what a reader knows and when, which builds suspense or changes how events are judged.
            codes: [EN5-URA-01]
          - title: Narrative and identity
            id: eng-narrative-identity
            brief: Narratives can show and shape personal and shared identities. Writers from different cultures, including Aboriginal and Torres Strait Islander writers, choose how to represent their own experiences.
            codes: [EN5-URA-01]

  - title: Understanding and responding B
    chapters:
      - title: Theme, perspective and context
        id: nsw-eng-s5-3-1
        points:
          - title: Themes that unify a text
            id: eng-themes-that-unify-text
            brief: A theme can hold a text together, so that its characters, settings and images all feed one central idea. Showing how several parts of a text work towards the same theme.
            codes: [EN5-URB-01]
          - title: Readers and their contexts
            id: eng-readers-their-contexts
            brief: Readers bring their own time, culture and experience to a text, so different audiences can find different themes and meanings in the same work.
            codes: [EN5-URB-01]
          - title: Reading through a lens
            id: eng-reading-through-lens
            brief: A text can be read from a particular perspective, such as gender, class or culture, which brings some ideas forward. Different readings can each be supported with evidence.
            codes: [EN5-URB-01]
          - title: The composer's context
            id: eng-composer-s-context
            brief: An author's personal, cultural and political context can shape their perspective, the ideas they represent and the form they choose.
            codes: [EN5-URB-01]
          - title: Affirming and challenging values
            id: eng-affirming-challenging-values
            brief: A text can support the attitudes of its time or push against them. Comparing a text's values with those of its context shows which it does.
            codes: [EN5-URB-01]
          - title: Language and cultural knowledge
            id: eng-language-cultural-knowledge
            brief: Words from a particular language can carry cultural knowledge and ways of seeing. Writers who use Aboriginal and Torres Strait Islander Languages or Aboriginal English in texts pass on meaning that English alone may not hold.
            codes: [EN5-URB-01]

      - title: Argument and authority
        id: nsw-eng-s5-3-2
        points:
          - title: Blending subjective and objective voice
            id: eng-blending-subjective-objective-voice
            brief: Writers move between an objective voice that presents evidence and a subjective voice that gives opinion, choosing each for effect in an argument.
            codes: [EN5-URB-01]
          - title: Satire and parody
            id: eng-satire-parody
            brief: Satire uses humour, irony and exaggeration to criticise people or ideas. Parody imitates a text's style to mock it or make a point.
            codes: [EN5-URB-01]
          - title: Logical fallacies
            id: eng-logical-fallacies
            brief: Weak arguments such as attacking the person, the false choice between only two options and the slippery slope. Spotting them makes it easier to judge an argument and avoid them in your own.
            codes: [EN5-URB-01]
          - title: Questioning a text's authority
            id: eng-questioning-text-s-authority
            brief: A text's authority is not fixed. Readers test it by checking its sources and comparing it with other texts, and a second text can challenge the claims of the first.
            codes: [EN5-URB-01]
          - title: Authority in interactive texts
            id: eng-authority-interactive-texts
            brief: In games, social media and other interactive texts, users and algorithms help shape what is shown, so control over meaning is shared between the maker and the audience.
            codes: [EN5-URB-01]

      - title: Style
        id: nsw-eng-s5-3-3
        points:
          - title: Style and purpose
            id: eng-style-purpose
            brief: A text's style, its word choice, sentence patterns, imagery and form, is shaped by its purpose and in turn shapes how the reader responds.
            codes: [EN5-URB-01]
          - title: A signature style
            id: eng-signature-style
            brief: Some writers and film directors have a style recognisable across their works, through repeated subjects, structures, images or techniques.
            codes: [EN5-URB-01]
          - title: Literary movements
            id: eng-literary-movements
            brief: Groups of texts from one period share a style, such as Romantic poetry with its focus on nature, emotion and the individual, or Gothic fiction with its dark settings and dread.
            codes: [EN5-URB-01]

  - title: Understanding and responding C
    chapters:
      - title: Genre, intertextuality and value
        id: nsw-eng-s5-4-1
        points:
          - title: Genre and values
            id: eng-genre-values
            brief: The conventions of a genre carry values, such as who gets to be the hero. Noticing them shows what a text assumes about the world.
            codes: [EN5-URC-01]
          - title: How genres change
            id: eng-genres-change
            brief: Genres change over time. They are adapted, mixed into hybrids and subverted as audiences and values change, which shows in remakes and new versions of old stories.
            codes: [EN5-URC-01]
          - title: Retelling a classic
            id: eng-retelling-classic
            brief: A modern retelling keeps parts of an older story and changes others for a new audience. Judging a retelling means asking what it kept, what it changed and why.
            codes: [EN5-URC-01]
          - title: Connections between texts
            id: eng-connections-between-texts
            brief: Reading texts against each other, through shared themes, forms or references, can deepen understanding of both and of the culture they come from.
            codes: [EN5-URC-01]
          - title: How a text's reputation changes
            id: eng-text-s-reputation-changes
            brief: A text can be praised or criticised when it first appears and judged differently later, as readers' values and contexts change.
            codes: [EN5-URC-01]

  - title: Expressing ideas and composing texts
    chapters:
      - title: Sentences for effect
        id: nsw-eng-s5-5-1
        points:
          - title: Varying sentence length
            id: eng-varying-sentence-length
            brief: Mixing long and short sentences controls pace. A run of short sentences builds tension, and a long one can slow the reader down for detail or reflection.
            codes: [EN5-ECA-01]
          - title: Subject-verb agreement
            id: eng-subject-verb-agreement
            brief: A verb must agree with its subject, even when the subject is a collective noun such as team or a long noun group such as the list of names on the wall.
            codes: [EN5-ECA-01]
          - title: Choosing the passive voice
            id: eng-choosing-passive-voice
            brief: Writers choose the passive voice on purpose, to put the focus on what happened, to sound impersonal in a report, or to leave out who was responsible.
            codes: [EN5-ECA-01]
          - title: Punctuation for effect
            id: eng-punctuation-effect
            brief: A colon can set up a reveal, a semicolon can balance two ideas, and an ellipsis can show a pause or a thought left unfinished. Each changes how a reader moves through a sentence.
            codes: [EN5-ECA-01]

      - title: Words for effect
        id: nsw-eng-s5-5-2
        points:
          - title: Greek and Latin roots
            id: eng-greek-latin-roots-nsw
            brief: Many English words are built on Greek and Latin roots, such as graph (write) and port (carry). Knowing the root helps spell a word and work out its meaning.
            codes: [EN5-ECA-01]
          - title: Choosing words for tone
            id: eng-choosing-words-tone
            brief: Words with similar meanings carry different connotations, so choosing scolded or criticised or attacked changes the tone and how the reader judges a moment.
            codes: [EN5-ECA-01]
          - title: Technical vocabulary and register
            id: eng-technical-vocabulary-register
            brief: Each subject and form has its own vocabulary. Using the right technical terms, at the right level of formality, makes writing precise and credible.
            codes: [EN5-ECA-01]
          - title: Connectives that show relationships
            id: eng-connectives-that-show-relationships
            brief: Connectives show how ideas relate, such as however for contrast, therefore for cause and effect, for example for illustration, and moreover for adding weight.
            codes: [EN5-ECA-01]

      - title: Analytical and discursive writing
        id: nsw-eng-s5-5-3
        points:
          - title: A strong thesis
            id: eng-strong-thesis
            brief: A thesis answers the question with an arguable position, not a fact or a summary, and sets up the points the essay will develop.
            codes: [EN5-ECA-01]
          - title: Sustaining an argument
            id: eng-sustaining-argument
            brief: Each body paragraph opens with a topic sentence that links to the thesis, so the argument builds from one paragraph to the next.
            codes: [EN5-ECA-01]
          - title: Analysing evidence
            id: eng-analysing-evidence
            brief: Strong analysis names the technique, gives a short example, then explains its effect and how it supports the argument. Explaining how, not just what, is the difference.
            codes: [EN5-ECA-01]
          - title: Discursive writing
            id: eng-discursive-writing-2
            brief: A discursive text explores an idea from several angles without needing to win an argument, often moving from a personal experience to a wider reflection.
            codes: [EN5-ECA-01]
          - title: Writing from research
            id: eng-writing-from-research
            brief: Informative writing gathers facts from reliable sources, organises them under clear headings or topic sentences, and says where information came from.
            codes: [EN5-ECA-01]

      - title: Film and visual texts
        id: nsw-eng-s5-5-4
        points:
          - title: Camera shots
            id: eng-camera-shots
            brief: Long shots show setting, mid shots show a character's body language and close-ups show emotion or a telling detail. Each guides what the viewer notices.
            codes: [EN5-ECA-01]
          - title: Camera angles
            id: eng-camera-angles-nsw
            brief: A high angle looks down on a subject and can make it seem weak. A low angle looks up and can make it seem powerful. An eye-level shot feels neutral.
            codes: [EN5-ECA-01]
          - title: Mise-en-scène and lighting
            id: eng-mise-en-sc-ne
            brief: Mise-en-scène is everything placed in the frame, the setting, props, costume and actors' positions. Lighting, such as harsh shadows or soft light, sets the mood.
            codes: [EN5-ECA-01]
          - title: Sound and editing in film
            id: eng-sound-editing-film
            brief: Diegetic sound comes from the world of the film and non-diegetic sound, such as a score, is added over it. Editing pace, from slow cuts to quick ones, controls tension.
            codes: [EN5-ECA-01]

      - title: Poetry, drama and speeches
        id: nsw-eng-s5-5-5
        points:
          - title: The sonnet and other fixed forms
            id: eng-sonnet-other-fixed-forms
            brief: A sonnet has 14 lines with a set rhyme pattern and often a turn in its argument. Fixed forms give shape to an idea, while free verse follows no set pattern.
            codes: [EN5-ECA-01]
          - title: Rhythm, metre and enjambment
            id: eng-rhythm-metre-enjambment
            brief: Metre is the regular pattern of stressed and unstressed syllables. Enjambment runs a sentence over a line break, which can build pace or create surprise.
            codes: [EN5-ECA-01]
          - title: Conventions of drama
            id: eng-conventions-drama
            brief: A soliloquy shares a character's thoughts alone on stage, an aside is spoken to the audience unheard by others, and stage directions guide how a play is performed.
            codes: [EN5-ECA-01]
          - title: Delivering a speech
            id: eng-delivering-speech
            brief: Intonation, emphasis, pause and pace, with signposting phrases such as firstly and finally, help an audience follow and remember a spoken argument.
            codes: [EN5-ECA-01]

      - title: Planning and reflecting
        id: nsw-eng-s5-5-6
        points:
          - title: Judging sources
            id: eng-judging-sources
            brief: A reliable source has a clear author with expertise, a recent date, a purpose that is not only to sell or persuade, and claims that other sources support.
            codes: [EN5-ECB-01]
          - title: Revising for a reader
            id: eng-revising-reader
            brief: Rereading a draft as the audience would, to find what is unclear, what needs evidence and what can be cut, before polishing the language.
            codes: [EN5-ECB-01]
          - title: Reflecting on your own style
            id: eng-reflecting-your-own-style
            brief: Noticing the choices you make as a writer, what works and what you repeat, and setting a goal to try a new technique or form.
            codes: [EN5-ECB-01]
