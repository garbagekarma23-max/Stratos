# Australian Curriculum Economics and Business, Year 7: Individuals, businesses and entrepreneurs, 34 points.
# Follows the Australian Curriculum: Humanities and Social Sciences, Economics and Business 7-10, Version 9.0, Year 7
# (ACARA's curriculum content and About the subject documents, australiancurriculum.edu.au). Checked on the official
# site in November 2026. Version 9.0 was approved by education ministers in April 2022 and released in May 2022. Each
# state and territory sets when its schools teach it, with full implementation expected by 2027 (Western Australia
# teaches its own version adapted from it). No new version is announced: ministers have scheduled the next full
# version for 2032.
# Structure: the subject's five concepts and the inquiry skills are the first unit. The year's Knowledge and
# understanding topic is a unit, and each content description is a chapter (the second is split in two). Codes are
# ACARA's content description codes.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-ecb-7
subject: Economics and Business
bank: ecb
name: Economics and Business, Year 7
about: "Australian Curriculum, Year 7: Individuals, businesses and entrepreneurs"
short: Economics and Business
years: [7]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Economics and Business, Version 9.0, Year 7"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [scarcity, opportunity cost, sole trader, entrepreneur, consumer rights]

units:
  - title: Concepts and skills
    chapters:
      - title: Thinking about economics and business
        id: ac-ecb-7-1-1
        points:
          - title: The five concepts of economics and business
            id: ecb-five-concepts-economics-business
            brief: The subject is built on five ideas, resource allocation and decision-making, the business environment, entrepreneurship, work and work futures, and consumer and financial literacy.
          - title: Asking an inquiry question
            id: ecb-asking-inquiry-question
            brief: A good inquiry question about an economic or business issue is open, focused on one issue, and can be answered with evidence.
            codes: [AC9HE7S01]
          - title: Finding and organising information
            id: ecb-finding-organising-information
            brief: Information can come from government statistics, news, businesses and surveys. Note who made each source and when, and sort what you find under headings.
            codes: [AC9HE7S02]
          - title: Cause and effect in economics
            id: ecb-cause-effect-economics
            brief: A cause-and-effect relationship explains how one change leads to another, such as a drought cutting the supply of fruit and raising its price.
            codes: [AC9HE7S03]
          - title: Costs and benefits of a decision
            id: ecb-costs-benefits-decision
            brief: Before deciding, list what each choice gives (benefits) and what it takes (costs), including money, time and effects on others.
            codes: [AC9HE7S04]

  - title: Individuals, businesses and entrepreneurs
    chapters:
      - title: Scarcity and choice
        id: ac-ecb-7-2-1
        points:
          - title: Needs and wants
            id: ecb-needs-wants
            brief: Needs are things people must have to survive, such as food, water and shelter. Wants are things people would like but can live without.
            codes: [AC9HE7K01]
          - title: Scarcity
            id: ecb-scarcity
            brief: Resources such as land, labour, money and time are limited, but people's wants are unlimited, so not every want can be met.
            codes: [AC9HE7K01]
          - title: The three economic questions
            id: ecb-three-economic-questions
            brief: Because of scarcity, every economy must decide what to produce, how to produce it and for whom to produce it.
            codes: [AC9HE7K01]
          - title: Opportunity cost
            id: ecb-opportunity-cost
            brief: Opportunity cost is the next best choice given up when making a decision, such as the swim you miss by spending the afternoon riding your bike.
            codes: [AC9HE7K01]
          - title: Using resources sustainably
            id: ecb-using-resources-sustainably
            brief: Using resources sustainably means meeting needs and wants today without leaving too little for people in the future.
            codes: [AC9HE7K01]
          - title: First Nations exchange networks
            id: ecb-first-nations-exchange-networks
            brief: First Nations communities traded goods such as ochre, stone tools and food along trade routes, and shared resources through kinship ties, using limited resources carefully.
            codes: [AC9HE7K01]

      - title: Why businesses exist
        id: ac-ecb-7-2-2
        points:
          - title: What a business is
            id: ecb-business
            brief: A business makes and sells goods or services. Businesses exist to meet people's needs and wants, to make a profit and to give people jobs.
            codes: [AC9HE7K02]
          - title: Goods and services
            id: ecb-goods-services
            brief: Goods are things you can touch, such as shoes. Services are things done for you, such as a haircut.
            codes: [AC9HE7K02]
          - title: Ways businesses reach customers
            id: ecb-ways-businesses-reach-customers
            brief: Businesses sell through shopping centres, markets, small local stores, remote community stores and online.
            codes: [AC9HE7K02]
          - title: A business owned by First Nations Australians
            id: ecb-business-owned-by-first
            brief: Many First Nations Australians run businesses, in areas such as tourism, art, food and construction, often to create jobs and support their communities.
            codes: [AC9HE7K02]

      - title: Types of business
        id: ac-ecb-7-2-3
        points:
          - title: Sole traders
            id: ecb-sole-traders
            brief: A sole trader is one person who owns and runs a business, keeps all the profit and is personally responsible for all its debts.
            codes: [AC9HE7K02]
          - title: Partnerships
            id: ecb-partnerships
            brief: A partnership is owned by two or more people who share the work, profits and debts, such as a firm of lawyers.
            codes: [AC9HE7K02]
          - title: Companies
            id: ecb-companies
            brief: A company, or corporation, is owned by shareholders. It is legally separate from its owners, so they can lose only what they put in.
            codes: [AC9HE7K02]
          - title: Franchises
            id: ecb-franchises
            brief: In a franchise, a business owner pays to use another company's name, products and way of operating, such as a fast food chain.
            codes: [AC9HE7K02]
          - title: Cooperatives and not-for-profits
            id: ecb-cooperatives-not-profits
            brief: A cooperative is owned by its members, who share its benefits. A not-for-profit puts any surplus back into its purpose, such as a charity.
            codes: [AC9HE7K02]

      - title: Entrepreneurs
        id: ac-ecb-7-2-4
        points:
          - title: What an entrepreneur is
            id: ecb-entrepreneur
            brief: An entrepreneur spots an opportunity, takes a risk and organises resources to start or grow a business.
            codes: [AC9HE7K03]
          - title: Qualities of entrepreneurs
            id: ecb-qualities-entrepreneurs
            brief: Entrepreneurs tend to show initiative, creativity, willingness to take risks, persistence and the ability to lead others toward a shared vision.
            codes: [AC9HE7K03]
          - title: Values in business decisions
            id: ecb-values-business-decisions
            brief: Entrepreneurs' values shape their choices, such as being honest with customers, treating workers fairly and following the law.
            codes: [AC9HE7K03]
          - title: First Nations entrepreneurs
            id: ecb-first-nations-entrepreneurs
            brief: First Nations entrepreneurs include community-run companies such as the Gumatj Aboriginal Corporation in north-east Arnhem Land, which runs businesses on its own Country.
            codes: [AC9HE7K03]
          - title: What makes a business succeed
            id: ecb-makes-business-succeed
            brief: Successful businesses usually meet a real need, plan well, manage money carefully, keep customers happy and adapt when things change.
            codes: [AC9HE7K03]

      - title: Work and income
        id: ac-ecb-7-2-5
        points:
          - title: Why people work
            id: ecb-people-work
            brief: People work to earn income, and also for purpose, skills, friendships and a sense of contributing to their community.
            codes: [AC9HE7K04]
          - title: Types of work
            id: ecb-types-work
            brief: Work can be full-time, part-time or casual, paid or unpaid, such as volunteering or caring for family at home.
            codes: [AC9HE7K04]
          - title: Ways to earn an income
            id: ecb-ways-earn-income
            brief: People earn income from wages and salaries, profits from a business, dividends from shares, rent from property, and government payments.
            codes: [AC9HE7K04]
          - title: Work and identity
            id: ecb-work-identity
            brief: Work can shape how people see themselves and their role in the community, and affects their standard of living.
            codes: [AC9HE7K04]

      - title: Consumers' rights and responsibilities
        id: ac-ecb-7-2-6
        points:
          - title: Rights and responsibilities
            id: ecb-rights-responsibilities
            brief: A right is something you are entitled to. A responsibility is something you are expected to do. Consumers and businesses have both.
            codes: [AC9HE7K05]
          - title: Consumer guarantees
            id: ecb-consumer-guarantees
            brief: Under Australian Consumer Law, products must be safe, work as described and last a reasonable time, or you can ask for a repair, replacement or refund.
            codes: [AC9HE7K05]
          - title: Cooling-off periods
            id: ecb-cooling-off-periods
            brief: Some contracts, such as those signed with a door-to-door seller, give a few days in which the buyer can change their mind and cancel.
            codes: [AC9HE7K05]
          - title: Business responsibilities to consumers
            id: ecb-business-responsibilities-consumers
            brief: Businesses must meet safety standards, give honest information and recall products found to be unsafe.
            codes: [AC9HE7K05]
          - title: Budgeting before you buy
            id: ecb-budgeting-before-you-buy
            brief: A budget compares money coming in with money going out, which helps you plan to save for something before you buy it.
            codes: [AC9HE7K05]
