# Australian Curriculum Economics and Business, Year 10: Productivity, growth and living standards, 34 points.
# Follows the Australian Curriculum: Humanities and Social Sciences, Economics and Business 7-10, Version 9.0, Year 10
# (ACARA's curriculum content document, australiancurriculum.edu.au). Checked on the official site in November 2026.
# Version 9.0 was approved by education ministers in April 2022 and released in May 2022. Each state and territory sets
# when its schools teach it, with full implementation expected by 2027 (Western Australia teaches its own version
# adapted from it). No new version is announced: ministers have scheduled the next full version for 2032. In Years 9
# and 10 some states and schools offer Economics and Business as an elective.
# Structure: the year's inquiry skills are the first unit (the five concepts are taught in Year 7). The year's
# Knowledge and understanding topic is a unit, and each content description is a chapter (the first two share
# three chapters, split by idea). Codes are ACARA's content description codes.
# Left out: monetary policy and the Reserve Bank, which the Year 10 content does not name (it names fiscal policy).
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-ecb-10
subject: Economics and Business
bank: ecb
name: Economics and Business, Year 10
about: "Australian Curriculum, Year 10: Productivity, growth and living standards"
short: Economics and Business
years: [10]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Economics and Business, Version 9.0, Year 10"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [GDP, inflation, fiscal policy, superannuation, productivity]

units:
  - title: Skills
    chapters:
      - title: Evaluating economic issues
        id: ac-ecb-10-1-1
        points:
          - title: Using economic indicators as evidence
            id: ecb-using-economic-indicators-as
            brief: Figures such as the unemployment rate or inflation give hard evidence for a claim about the economy, but check the period and source they cover.
            codes: [AC9HE10S02, AC9HE10S03]
          - title: Short-term and long-term effects
            id: ecb-short-term-long-term
            brief: A decision can help now and cost later, or the reverse, such as borrowing for study, so weigh effects over time as well as on different groups.
            codes: [AC9HE10S03, AC9HE10S04]
          - title: Spotting bias in a source
            id: ecb-spotting-bias-source
            brief: A source can lean one way because of who made it or paid for it, so compare it with others and look for data, not only opinion.
            codes: [AC9HE10S02]
          - title: Recommending a course of action
            id: ecb-recommending-course-action
            brief: A recommendation names the best option, explains why it beats the others on the criteria, and says what it will cost and who it will affect.
            codes: [AC9HE10S04, AC9HE10S05]

  - title: Productivity, growth and living standards
    chapters:
      - title: Economic indicators
        id: ac-ecb-10-2-1
        points:
          - title: What an economic indicator is
            id: ecb-economic-indicator
            brief: An economic indicator is a statistic that shows how the economy is going, such as the growth rate, unemployment or inflation.
            codes: [AC9HE10K01]
          - title: Economic growth and GDP
            id: ecb-economic-growth-gdp
            brief: Gross domestic product is the value of all goods and services made in a country in a year. Economic growth is GDP rising.
            codes: [AC9HE10K01]
          - title: The unemployment rate
            id: ecb-unemployment-rate
            brief: The unemployment rate is the share of people in the labour force who are looking for work but have none.
            codes: [AC9HE10K01]
          - title: Inflation
            id: ecb-inflation
            brief: Inflation is a general rise in prices over time, measured in Australia by the consumer price index, so each dollar buys less.
            codes: [AC9HE10K01]
          - title: Material and non-material living standards
            id: ecb-material-non-material-living
            brief: Material living standards are the goods and services people can buy. Non-material ones include health, safety, free time and a clean environment.
            codes: [AC9HE10K01, AC9HE10K02]

      - title: The government and the economy
        id: ac-ecb-10-2-2
        points:
          - title: The government's economic objectives
            id: ecb-government-s-economic-objectives
            brief: The Australian Government aims for steady economic growth, full employment and stable prices, to keep living standards rising.
            codes: [AC9HE10K01]
          - title: Responding to indicators
            id: ecb-responding-indicators
            brief: When indicators change, the government acts, such as funding apprenticeships and training places when unemployment rises.
            codes: [AC9HE10K01]
          - title: Fiscal policy
            id: ecb-fiscal-policy
            brief: Fiscal policy is the government's use of its spending and taxes to manage the economy, such as spending more to support jobs in a slowdown.
            codes: [AC9HE10K02]
          - title: The federal Budget
            id: ecb-federal-budget
            brief: Each year the federal Budget sets out the government's planned spending and revenue. Spending more than it collects is a deficit, and less is a surplus.
            codes: [AC9HE10K02]

      - title: Sharing income and wealth
        id: ac-ecb-10-2-3
        points:
          - title: Income and wealth
            id: ecb-income-wealth
            brief: Income is money received over a period, such as wages. Wealth is the value of what someone owns, such as a home, savings and shares, less what they owe.
            codes: [AC9HE10K02]
          - title: Why living standards differ
            id: ecb-living-standards-differ
            brief: Unemployment, low pay, illness and where people live mean some Australians have much lower living standards than others, and some live in poverty.
            codes: [AC9HE10K02]
          - title: Progressive taxation
            id: ecb-progressive-taxation
            brief: A progressive tax takes a larger share of income as income rises, which narrows the gap between high and low incomes.
            codes: [AC9HE10K02]
          - title: Transfer payments
            id: ecb-transfer-payments
            brief: Transfer payments are government payments to people who need support, such as the Age Pension, Youth Allowance and JobSeeker Payment.
            codes: [AC9HE10K02]
          - title: Services for everyone
            id: ecb-services-everyone
            brief: Medicare and public schools give everyone health care and education whatever their income, which lifts living standards for people on low incomes.
            codes: [AC9HE10K02]

      - title: Major financial decisions
        id: ac-ecb-10-2-4
        points:
          - title: Minor and major decisions
            id: ecb-minor-major-decisions
            brief: A minor decision, such as lunch, costs little and is easy to undo. A major one, such as a car or a home, costs a lot, lasts years and needs planning.
            codes: [AC9HE10K03]
          - title: What influences a major purchase
            id: ecb-influences-major-purchase
            brief: Price, finance available, marketing, convenience, age and ethical or environmental concerns all shape what people decide to buy.
            codes: [AC9HE10K03]
          - title: The cost of borrowing
            id: ecb-cost-borrowing
            brief: A loan costs more than its price because of interest and fees, so check the interest rate, the total repaid and whether you can meet each repayment.
            codes: [AC9HE10K03]
          - title: The full cost of a car
            id: ecb-full-cost-car
            brief: A car costs more than its price, with registration, insurance, fuel, servicing and depreciation, the fall in its value over time.
            codes: [AC9HE10K03]
          - title: Buying a home
            id: ecb-buying-home
            brief: Most people buy a home with a deposit and a mortgage, a loan repaid over many years, which also brings costs such as rates, insurance and repairs.
            codes: [AC9HE10K03]

      - title: Superannuation
        id: ac-ecb-10-2-5
        points:
          - title: What superannuation is
            id: ecb-superannuation
            brief: Superannuation is money saved during working life, invested and kept until retirement, so people have income when they stop work.
            codes: [AC9HE10K04]
          - title: The superannuation guarantee
            id: ecb-superannuation-guarantee
            brief: Employers must pay a set share of each worker's wages into their super fund. Workers can also add their own money.
            codes: [AC9HE10K04]
          - title: Superannuation investment options
            id: ecb-superannuation-investment-options
            brief: Funds offer options from safer to riskier. Younger workers often choose growth options because they have decades to recover from falls.
            codes: [AC9HE10K04]
          - title: Managing your superannuation
            id: ecb-managing-your-superannuation
            brief: Check fees and returns, combine several accounts into one, and find lost super, so fees do not eat into your savings.
            codes: [AC9HE10K04]
          - title: Superannuation and the Age Pension
            id: ecb-superannuation-age-pension
            brief: More super means fewer people need the full Age Pension, which eases the cost to government as the population ages.
            codes: [AC9HE10K04]

      - title: Productivity and the workforce
        id: ac-ecb-10-2-6
        points:
          - title: What productivity is
            id: ecb-productivity
            brief: Productivity is how much is produced from the resources used, such as output per hour worked. Higher productivity lets wages and living standards rise.
            codes: [AC9HE10K05]
          - title: Ways to raise productivity
            id: ecb-ways-raise-productivity
            brief: Businesses raise productivity through training, new equipment and technology, research, and methods such as just-in-time stock that cut waste.
            codes: [AC9HE10K05]
          - title: Organisational structures
            id: ecb-organisational-structures
            brief: A vertical structure has many levels of managers. A flat, horizontal structure has few, so decisions are quicker and workers have more say.
            codes: [AC9HE10K05]
          - title: Managing a workforce
            id: ecb-managing-workforce
            brief: Businesses keep good workers with fair pay, flexible hours, paid parental leave, safe workplaces and chances to use their initiative.
            codes: [AC9HE10K05]
          - title: First Nations workforce and business programs
            id: ecb-first-nations-workforce-business
            brief: Programs such as cross-cultural training, Indigenous employment targets and First Nations chambers of commerce help First Nations Australians find work and start businesses.
            codes: [AC9HE10K05]
          - title: Entrepreneurs and change
            id: ecb-entrepreneurs-change
            brief: Entrepreneurs respond to changing conditions with new ideas and technology, such as businesses that turn waste into products or sell clean energy.
            codes: [AC9HE10K05]
