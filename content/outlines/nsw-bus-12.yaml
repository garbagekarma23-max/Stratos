# NSW Business Studies, Year 12: Operations, Marketing, Finance and Human resources, 106 points.
# Drafted from NESA's Business Studies Stage 6 Syllabus (2010), the syllabus taught in Year 12 in 2026. The structure
# follows the syllabus: each HSC topic is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: a new Business Studies 11-12 Syllabus is in development at NESA. Check its start date before the
# first run.

id: nsw-bus-12
subject: Business Studies
bank: bus
name: Business Studies, Year 12
about: HSC, Operations, marketing, finance and human resources
short: Business Studies
years: [12]
place: nsw
kind: standard
syllabus: NSW Business Studies Stage 6 Syllabus (2010), Year 12 (HSC) course, all four topics
note: Follows the NSW Business Studies syllabus. Not made or endorsed by NESA.
chips: [just in time, marketing mix, current ratio, gearing, enterprise agreement]

units:
  - title: Operations
    chapters:
      - title: The role of operations
        id: nsw-bus-12-1-1
        points:
          - title: What operations management is
            id: bus-operations-management
            brief: Operations is the part of a business that turns inputs into the goods or services it sells. Managing it well lowers costs and lifts quality.
          - title: The strategic role of operations
            id: bus-strategic-role-operations
            brief: Operations can give a business an edge over competitors through cost leadership (being cheapest) or good and service differentiation (being different or better).
          - title: Goods and services in operations
            id: bus-goods-services-operations
            brief: Goods can be stored and made away from customers. Services are usually made and used at the same time, often with the customer present.
          - title: Operations and other parts of the business
            id: bus-operations-other-parts-business
            brief: Operations depends on marketing for demand forecasts, finance for funds and human resources for skilled staff.

      - title: Influences on operations
        id: nsw-bus-12-1-2
        points:
          - title: Globalisation and operations
            id: bus-globalisation-operations
            brief: Global markets let businesses source inputs and make goods anywhere, and bring competition from around the world.
          - title: Technology in operations
            id: bus-technology-operations
            brief: Automation, robotics and computer systems speed up production and cut errors, but cost a lot to set up and can replace jobs.
          - title: Quality expectations and cost-based competition
            id: bus-quality-expectations-cost-based
            brief: Customers expect high quality, while competitors push prices down. Operations must balance the two.
          - title: Government policy and legal regulation
            id: bus-government-policy-legal-regulation
            brief: Laws on work safety, the environment, consumer protection and industry rules shape how operations are run.
          - title: Environmental sustainability and CSR in operations
            id: bus-environmental-sustainability-csr-operations
            brief: Cutting waste, emissions and energy use, and treating suppliers and workers fairly, are expected of operations and can also save money.

      - title: The operations process
        id: nsw-bus-12-1-3
        points:
          - title: Inputs to operations
            id: bus-inputs-operations
            brief: Transformed resources are changed in the process, such as materials and information. Transforming resources do the changing, such as staff, equipment and buildings.
          - title: Transformation processes
            id: bus-transformation-processes
            brief: The steps that turn inputs into outputs. They differ by volume, variety, variation in demand and how visible they are to customers.
          - title: Sequencing and scheduling
            id: bus-sequencing-scheduling
            brief: Putting tasks in order and setting when each happens, using tools such as Gantt charts and critical path analysis.
          - title: Outputs and customer service
            id: bus-outputs-customer-service
            brief: Outputs are the goods and services made. Customer service and warranties are part of what the customer gets and judges.

      - title: Performance and supply chains
        id: nsw-bus-12-1-4
        points:
          - title: Performance objectives
            id: bus-performance-objectives
            brief: Operations aims for quality, speed, dependability, flexibility, customisation and low cost. Improving one often costs another.
          - title: New product design and development
            id: bus-new-product-design-development
            brief: Designing goods and services that customers want and that can be made efficiently helps a business stay ahead of competitors.
          - title: Supply chain management
            id: bus-supply-chain-management
            brief: Managing the flow of materials from suppliers to the customer, through logistics, e-commerce and global sourcing.
          - title: Outsourcing in operations
            id: bus-outsourcing-operations
            brief: Paying another business to do part of the work, such as manufacturing or customer service, to cut costs or get expertise. It reduces control.
          - title: Technology choices
            id: bus-technology-choices
            brief: Choosing between leading-edge technology, which costs more but may give an advantage, and established technology, which is proven and cheaper.

      - title: Inventory, quality and change
        id: nsw-bus-12-1-5
        points:
          - title: Inventory management
            id: bus-inventory-management
            brief: Holding stock avoids running out but costs money to store. Stock can be valued by first in, first out (FIFO) or last in, first out (LIFO).
          - title: Just in time
            id: bus-just-time
            brief: Materials arrive only as they are needed, which cuts storage costs but leaves the business exposed if a supplier is late.
          - title: Quality management
            id: bus-quality-management
            brief: Quality control inspects outputs, quality assurance sets standards for the process, and total quality management makes quality everyone's job.
          - title: Continuous improvement
            id: bus-continuous-improvement
            brief: Making many small improvements over time, often from staff suggestions, rather than waiting for big changes.
          - title: Overcoming resistance in operations
            id: bus-overcoming-resistance-operations
            brief: Changing operations brings financial costs, purchasing costs, retraining and redundancy costs, and staff inertia, which managers must plan for.
          - title: Global operations strategies
            id: bus-global-operations-strategies
            brief: Global businesses gain from global sourcing, economies of scale, learning from other markets, and research and development.

  - title: Marketing
    chapters:
      - title: The role of marketing
        id: nsw-bus-12-2-1
        points:
          - title: What marketing is
            id: bus-marketing
            brief: Marketing is finding out what customers want and getting it to them profitably. It is far more than advertising.
          - title: The strategic role of marketing
            id: bus-strategic-role-marketing
            brief: Marketing links the business to its customers and helps it win and keep them, building sales, market share and profit.
          - title: Approaches to marketing
            id: bus-approaches-marketing
            brief: The production approach focuses on making goods, the selling approach on pushing them, and the marketing approach on what customers want.
          - title: Relationship and societal marketing
            id: bus-relationship-societal-marketing
            brief: Relationship marketing builds long-term customer loyalty. The societal marketing approach also weighs what is good for society.
          - title: Types of markets
            id: bus-types-markets
            brief: Markets can be resource, industrial, intermediate, consumer, mass or niche markets, each needing a different approach.

      - title: Influences on marketing
        id: nsw-bus-12-2-2
        points:
          - title: Psychological influences on customers
            id: bus-psychological-influences-customers
            brief: Perception, motivation, attitudes and personality shape what customers choose to buy.
          - title: Sociocultural and economic influences on customers
            id: bus-sociocultural-economic-influences-customers
            brief: Family, friends, social class and culture affect choices, and so do income and the state of the economy.
          - title: Consumer law and marketing
            id: bus-consumer-law-marketing
            brief: Under the Australian Consumer Law, businesses must not make misleading or false claims, must honour consumer guarantees and must not use unfair practices.
          - title: Ethics in marketing
            id: bus-ethics-marketing
            brief: Marketers should be truthful, avoid harmful products being promoted to children, compete fairly and never disguise selling as research.

      - title: The marketing process
        id: nsw-bus-12-2-3
        points:
          - title: Situational analysis
            id: bus-situational-analysis
            brief: Looking at where the business stands now, through a SWOT analysis and where its products sit in the product life cycle.
          - title: Market research
            id: bus-market-research
            brief: Collecting data to understand customers and the market. Primary data is gathered first-hand and secondary data already exists.
          - title: Marketing objectives
            id: bus-marketing-objectives
            brief: Measurable goals, such as raising market share by 5% in a year, that marketing strategies are designed to meet.
          - title: Identifying target markets
            id: bus-identifying-target-markets
            brief: Choosing the group of customers the business will aim at, through mass marketing, market segmentation or a niche.
          - title: Implementing and monitoring the plan
            id: bus-implementing-monitoring-plan
            brief: Putting the marketing plan into action, tracking results against the objectives and changing strategies that are not working.

      - title: Segmentation, positioning and product
        id: nsw-bus-12-2-4
        points:
          - title: Market segmentation
            id: bus-market-segmentation
            brief: Splitting a market into groups by demographics, geography, lifestyle or behaviour, so each can be targeted.
          - title: Differentiation and positioning
            id: bus-differentiation-positioning
            brief: Making a product stand out from competitors and placing it in customers' minds, for example as the cheapest, the most luxurious or the most reliable.
          - title: The marketing mix
            id: bus-marketing-mix
            brief: The 4Ps, product, price, promotion and place, combined to meet the target market's needs. Services add people, processes and physical evidence.
          - title: Product decisions
            id: bus-product-decisions
            brief: Decisions about features, quality, branding and packaging. A strong brand builds trust and lets a business charge more.

      - title: Price, promotion and place
        id: nsw-bus-12-2-5
        points:
          - title: Pricing methods
            id: bus-pricing-methods
            brief: Cost-based pricing adds a markup, market-based pricing follows demand, and competition-based pricing follows competitors.
          - title: Pricing strategies
            id: bus-pricing-strategies
            brief: Skimming starts high for a new product, penetration starts low to win share, and loss leaders, price points and price bundling draw customers in.
          - title: Price and perceived quality
            id: bus-price-perceived-quality
            brief: Customers often read a high price as a sign of quality, so cutting a price can harm a premium brand.
          - title: The promotion mix
            id: bus-promotion-mix
            brief: Advertising, personal selling, sales promotions, public relations and social media are used together to reach customers.
          - title: Distribution channels
            id: bus-distribution-channels
            brief: Getting products to customers, directly or through wholesalers and retailers, with intensive, selective or exclusive distribution.
          - title: Physical distribution
            id: bus-physical-distribution
            brief: Transport, warehousing and stock control that move goods to where customers buy them.

      - title: E-marketing and global marketing
        id: nsw-bus-12-2-6
        points:
          - title: E-marketing
            id: bus-e-marketing
            brief: Marketing through websites, social media, email and search, which can target customers closely and measure results quickly.
          - title: Global branding
            id: bus-global-branding
            brief: Using one brand name, logo and image around the world, which saves money and builds recognition.
          - title: Standardisation and customisation
            id: bus-standardisation-customisation
            brief: A standardised product is the same everywhere. A customised one is changed for each market's tastes, laws or culture.
          - title: Global pricing and positioning
            id: bus-global-pricing-positioning
            brief: Setting prices across countries, allowing for costs, competition, currency and local incomes, and choosing how to position against local rivals.

  - title: Finance
    chapters:
      - title: The role of financial management
        id: nsw-bus-12-3-1
        points:
          - title: The strategic role of financial management
            id: bus-strategic-role-financial-management
            brief: Planning and monitoring a business's money so it has the funds it needs, uses them well and meets its goals.
          - title: Financial objectives
            id: bus-financial-objectives
            brief: Profitability, growth, efficiency, liquidity (paying short-term debts) and solvency (paying long-term debts), which can conflict.
          - title: Short-term and long-term objectives
            id: bus-short-term-long-term
            brief: Short-term objectives are tactical and operational, set for a year or less. Long-term ones are strategic, set for several years.
          - title: Finance and other parts of the business
            id: bus-finance-other-parts-business
            brief: Financial decisions affect, and depend on, operations, marketing and human resources.

      - title: Sources of finance
        id: nsw-bus-12-3-2
        points:
          - title: Internal sources of finance
            id: bus-internal-sources-finance
            brief: Money from inside the business, such as the owner's contribution and retained profits. It costs no interest but may be limited.
          - title: Short-term borrowing
            id: bus-short-term-borrowing
            brief: Overdrafts, commercial bills and factoring, used to fund day-to-day needs. They are quick to arrange but can cost more.
          - title: Long-term borrowing
            id: bus-long-term-borrowing
            brief: Mortgages, debentures, unsecured notes and leasing fund large purchases over years, with regular interest payments.
          - title: Equity finance
            id: bus-equity-finance
            brief: Raising money by selling shares, such as ordinary shares on the ASX or to private equity. No repayments, but ownership is shared.
          - title: Debt and equity compared
            id: bus-debt-equity-compared
            brief: Debt is quicker and keeps control but adds interest and risk. Equity has no repayments but dilutes ownership and profit.
          - title: The matching principle
            id: bus-matching-principle
            brief: Short-term assets should be funded with short-term finance, and long-term assets with long-term finance.

      - title: Influences on financial management
        id: nsw-bus-12-3-3
        points:
          - title: Financial institutions
            id: bus-financial-institutions
            brief: Banks, investment banks, finance companies, superannuation funds, life insurers and unit trusts supply finance in different forms.
          - title: The share market
            id: bus-share-market
            brief: The ASX is where companies raise money by issuing shares and where existing shares are traded.
          - title: Government influences on finance
            id: bus-government-influences-finance
            brief: ASIC regulates companies and financial markets, and company tax takes a share of profits.
          - title: Global market influences
            id: bus-global-market-influences
            brief: The world economic outlook, the availability of funds and interest rates around the world affect what finance costs and whether it is available.

      - title: Financial statements
        id: nsw-bus-12-3-4
        points:
          - title: The income statement
            id: bus-income-statement
            brief: Shows revenue, expenses and profit or loss over a period. Gross profit is sales minus cost of goods sold.
          - title: The balance sheet
            id: bus-balance-sheet
            brief: Shows assets, liabilities and owner's equity at one point in time. Assets = liabilities + owner's equity.
          - title: The cash flow statement
            id: bus-cash-flow-statement
            brief: Shows cash coming in and going out over a period, from operating, investing and financing activities.
          - title: Budgets
            id: bus-budgets
            brief: Plans of expected income and spending, such as operating, project and financial budgets, used to control the business.
          - title: Limits of financial reports
            id: bus-limits-financial-reports
            brief: Reports can hide problems through normalised earnings, capitalised expenses, valuing assets and the timing of issues, and may leave out debts.

      - title: Financial ratios
        id: nsw-bus-12-3-5
        points:
          - title: Liquidity ratio
            id: bus-liquidity-ratio
            brief: The current ratio, current assets ÷ current liabilities, shows whether a business can pay its short-term debts. Around 2 to 1 is often seen as healthy.
          - title: Gearing ratio
            id: bus-gearing-ratio
            brief: Debt to equity, total liabilities ÷ total equity, shows how much the business relies on borrowed money. High gearing means more risk.
          - title: Profitability ratios
            id: bus-profitability-ratios
            brief: Gross profit ratio, net profit ratio and return on owner's equity show how well the business turns sales and investment into profit.
          - title: Efficiency ratios
            id: bus-efficiency-ratios
            brief: The expense ratio shows costs as a share of sales. Accounts receivable turnover shows how quickly customers pay.
          - title: Comparing ratios
            id: bus-comparing-ratios
            brief: A ratio means little alone. Compare it over time, with similar businesses and with the business's own targets.
          - title: Ethics in financial reporting
            id: bus-ethics-financial-reporting
            brief: Businesses must report honestly, follow accounting standards and have their accounts audited. Misleading reports break the law and the trust of investors.

      - title: Financial management strategies
        id: nsw-bus-12-3-6
        points:
          - title: Cash flow management
            id: bus-cash-flow-management
            brief: Spreading payments across the year, offering discounts for early payment and using factoring keep enough cash on hand.
          - title: Working capital management
            id: bus-working-capital-management
            brief: Working capital is current assets minus current liabilities. Managing cash, receivables, stock and payables keeps it at a healthy level.
          - title: Leasing and sale and lease back
            id: bus-leasing-sale-lease-back
            brief: Leasing gives the use of assets without buying them. Sale and lease back sells an asset and rents it back, freeing up cash.
          - title: Profitability management
            id: bus-profitability-management
            brief: Controlling fixed and variable costs and lifting revenue through marketing and pricing improve profit.
          - title: Exchange rates and international business
            id: bus-exchange-rates-international-business
            brief: A rise in the Australian dollar makes exports dearer and imports cheaper, and a fall does the opposite, which changes what overseas sales are worth.
          - title: Hedging and international payments
            id: bus-hedging-international-payments
            brief: Hedging cuts the risk from currency changes, through derivatives such as forward contracts, swaps and options. Letters of credit and payment in advance make overseas payment safer.

  - title: Human resources
    chapters:
      - title: The role of human resource management
        id: nsw-bus-12-4-1
        points:
          - title: The strategic role of human resource management
            id: bus-strategic-role-human-resource
            brief: Managing people so the business has staff with the right skills and motivation to meet its goals.
          - title: Outsourcing human resources
            id: bus-outsourcing-human-resources
            brief: Using outside firms for tasks such as payroll, recruitment or training, at home or overseas, which saves costs but reduces control.
          - title: Human resources and other parts of the business
            id: bus-human-resources-other-parts
            brief: Every part of a business depends on its people, so HR decisions affect operations, marketing and finance.

      - title: Influences on human resources
        id: nsw-bus-12-4-2
        points:
          - title: Stakeholders in the workplace
            id: bus-stakeholders-workplace
            brief: Employers, employees, employer associations, unions, government organisations and society each shape how people are managed.
          - title: Employment contracts
            id: bus-employment-contracts
            brief: Common law contracts, modern awards and enterprise agreements set pay and conditions. The National Employment Standards set the minimum for all.
          - title: Work health and safety law
            id: bus-work-health-safety-law
            brief: Employers must provide a safe workplace and workers must work safely. Breaches can bring heavy fines.
          - title: Anti-discrimination and equal opportunity
            id: bus-anti-discrimination-equal-opportunity
            brief: Laws ban treating workers unfairly because of sex, race, age, disability or other attributes, in hiring, pay and promotion.
          - title: The Fair Work system
            id: bus-fair-work-system
            brief: The Fair Work Act 2009 sets the rules for employment. The Fair Work Commission sets minimum wages and settles disputes, and the Fair Work Ombudsman enforces the law.
          - title: Economic, social and technological influences
            id: bus-economic-social-technological-influences
            brief: The economy, changing work patterns such as part-time and remote work, and new technology all change how people are employed and managed.

      - title: The human resource process
        id: nsw-bus-12-4-3
        points:
          - title: Acquisition
            id: bus-acquisition
            brief: Working out what staff are needed, then recruiting and selecting them.
          - title: Development
            id: bus-development
            brief: Training and development build staff skills, from induction for new workers to programs for future managers.
          - title: Maintenance
            id: bus-maintenance
            brief: Keeping good staff through pay, conditions, a safe workplace and support.
          - title: Separation
            id: bus-separation
            brief: Staff leave through resignation, retirement, redundancy or dismissal, each with legal and practical steps.

      - title: Human resource strategies
        id: nsw-bus-12-4-4
        points:
          - title: Leadership style
            id: bus-leadership-style
            brief: Autocratic, democratic and laissez-faire styles suit different situations and affect how motivated staff are.
          - title: Job design
            id: bus-job-design
            brief: Designing jobs as general or specific tasks, with variety and responsibility, to keep workers engaged.
          - title: Recruitment
            id: bus-recruitment
            brief: Finding staff from inside the business, which is cheaper and rewards staff, or from outside, which brings new ideas.
          - title: Training and development
            id: bus-training-development
            brief: On-the-job and off-the-job training improve skills, and development prepares staff for future roles.
          - title: Performance management
            id: bus-performance-management
            brief: Setting goals, reviewing work and giving feedback. It can aim to develop staff or to make decisions on pay and promotion.
          - title: Rewards
            id: bus-rewards
            brief: Monetary rewards, such as pay and bonuses, and non-monetary ones, such as flexible hours and recognition, motivate staff. Performance pay links rewards to results.

      - title: Disputes and effectiveness
        id: nsw-bus-12-4-5
        points:
          - title: Workplace disputes
            id: bus-workplace-disputes
            brief: Disputes arise over pay, conditions, safety, job security and management decisions.
          - title: Resolving disputes
            id: bus-resolving-disputes
            brief: Negotiation, mediation and grievance procedures settle most disputes. The Fair Work Commission can conciliate or arbitrate when they cannot.
          - title: Corporate culture
            id: bus-corporate-culture
            brief: The shared values and behaviours in a business. A positive culture lifts morale and keeps staff.
          - title: Measuring human resource effectiveness
            id: bus-measuring-human-resource-effectiveness
            brief: Staff turnover, absenteeism, accidents, levels of disputes, benchmarking and worker satisfaction surveys show how well people are being managed.
