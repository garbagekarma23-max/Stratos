# VCE Psychology, Units 1 and 2: development, the brain, social cognition and perception, 58 points.
# Checked against the VCAA's VCE Psychology Study Design, accredited from 2023, in October 2026. Each unit is a unit
# here, and each area of study is a chapter, or two when it is large. The investigations are school-run, so their
# science skills are a short chapter here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on mental health and Aboriginal and Torres Strait Islander knowledge always go to the review page.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

