units:
  - title: "Unit 1: How are behaviour and mental processes shaped?"
    chapters:
      - title: What shapes psychological development
        id: vic-psy-u12-1-1
        points:
          - title: Nature and nurture together
            id: psy-nature-nurture-together
            brief: Development comes from heredity (genes passed down) and environment (experiences, people, culture) working together, not from either one alone.
          - title: The biopsychosocial approach
            id: psy-biopsychosocial-approach
            brief: A model that explains development and behaviour through biological, psychological and social factors at once, and how they affect each other.
          - title: Emotional development
            id: psy-emotional-development
            brief: How a person learns to recognise, express and manage emotions, starting with attachment to carers in infancy and growing through childhood and adolescence.
          - title: Cognitive development and Piaget
            id: psy-cognitive-development-piaget
            brief: Piaget proposed four stages of thinking (sensorimotor, preoperational, concrete operational, formal operational), each with new abilities such as object permanence or abstract reasoning.
          - title: Psychosocial development and Erikson
            id: psy-psychosocial-development-erikson
            brief: Erikson proposed eight stages across life, each with a social conflict to resolve, such as identity versus role confusion in adolescence.
          - title: Sensitive and critical periods
            id: psy-sensitive-critical-periods
            brief: A sensitive period is a time when a skill develops most easily. A critical period is a narrow window after which some development may not happen at all.

      - title: Typical and atypical behaviour
        id: vic-psy-u12-1-2
        points:
          - title: Criteria for typical behaviour
            id: psy-criteria-typical-behaviour
            brief: Behaviour can be judged typical or atypical by social norms, cultural norms, statistical rarity, how well it lets a person function, and personal perceptions.
          - title: Limits of each criterion
            id: psy-limits-each-criterion
            brief: Each criterion has a weakness. Rare behaviour can be healthy, and norms change across cultures and over time, so no single test is enough.
          - title: Neurotypical and neurodivergent
            id: psy-neurotypical-neurodivergent
            brief: Neurotypical describes brains that work in the most common ways. Neurodivergent describes natural variation, such as autism or ADHD, as difference rather than fault.
          - title: Labels and their effects
            id: psy-labels-their-effects
            brief: A diagnosis can open the way to support, but a label can also lead to stigma, lowered expectations and people being seen only through it.
          - title: Mental wellbeing as a continuum
            id: psy-mental-wellbeing-as-continuum
            brief: Mental wellbeing ranges along a continuum from flourishing to struggling, and a person can move along it over time.

      - title: How we came to understand the brain
        id: vic-psy-u12-1-3
        points:
          - title: Brain versus heart debate
            id: psy-brain-versus-heart-debate
            brief: Early thinkers argued over whether the brain or the heart was the source of thought and feeling. Evidence from injuries and dissection settled it on the brain.
          - title: Mind and body questions
            id: psy-mind-body-questions
            brief: Philosophers asked whether the mind is separate from the body (dualism) or part of it (monism). Modern psychology studies mental processes through the brain.
          - title: Phrenology
            id: psy-phrenology
            brief: Phrenology claimed bumps on the skull showed a person's traits. It was never supported by evidence, but it pushed the idea that brain areas have different jobs.
          - title: Brain ablation and lesioning
            id: psy-brain-ablation-lesioning
            brief: Removing or damaging part of an animal's brain and watching what changes showed which areas link to which functions.
          - title: Neuroimaging
            id: psy-neuroimaging
            brief: CT and MRI show the brain's structure. PET and fMRI show which areas are active during a task, so researchers can link function to place.

      - title: The brain and behaviour
        id: vic-psy-u12-1-4
        points:
          - title: Hindbrain, midbrain and forebrain
            id: psy-hindbrain-midbrain-forebrain
            brief: The hindbrain runs survival functions and balance, the midbrain relays sensory and movement information, and the forebrain handles complex thought.
          - title: The cerebellum
            id: psy-cerebellum
            brief: The cerebellum coordinates movement, balance and posture, and helps learn motor skills such as riding a bike.
          - title: The cerebral cortex and its lobes
            id: psy-cerebral-cortex-lobes
            brief: "The cortex has four lobes: frontal (planning, movement, speech production), parietal (touch and body position), temporal (hearing and memory) and occipital (vision)."
          - title: Neuroplasticity
            id: psy-neuroplasticity
            brief: The brain changes its structure in response to experience. Developmental plasticity shapes the young brain; adaptive plasticity helps it recover after damage.
          - title: Acquired brain injury
            id: psy-acquired-brain-injury
            brief: An ABI is damage after birth, from a blow, stroke or lack of oxygen. It can change biological, psychological and social functioning.
          - title: Chronic traumatic encephalopathy
            id: psy-chronic-traumatic-encephalopathy
            brief: CTE is a brain disease linked to repeated head knocks, such as in contact sport. It can affect memory, mood and behaviour, and is confirmed only after death.

  - title: "Unit 2: How do internal and external factors influence behaviour and mental processes?"
    chapters:
      - title: Social cognition
        id: vic-psy-u12-2-1
        points:
          - title: Person perception
            id: psy-person-perception
            brief: The quick judgements we form about other people from cues such as appearance, body language and what we already believe.
          - title: Attributions
            id: psy-attributions
            brief: Explaining behaviour by the person (internal) or the situation (external). The fundamental attribution error leans too far toward the person when judging others.
          - title: The tri-component model of attitudes
            id: psy-tri-component-model-attitudes
            brief: An attitude has three parts that can disagree with each other, affective (feelings), behavioural (actions) and cognitive (beliefs).
          - title: Stereotypes, prejudice and discrimination
            id: psy-stereotypes-prejudice-discrimination
            brief: A stereotype is a belief about a group, prejudice is a negative attitude toward it, and discrimination is acting unfairly toward its members.
          - title: Cognitive dissonance
            id: psy-cognitive-dissonance
            brief: The discomfort of holding beliefs that clash with actions. People reduce it by changing a belief, changing the action or explaining the gap away.
          - title: Heuristics in decisions
            id: psy-heuristics-decisions
            brief: Mental shortcuts such as availability and anchoring make decisions fast, but can lead to systematic errors.

      - title: Social influence
        id: vic-psy-u12-2-2
        points:
          - title: Conformity and Asch
            id: psy-conformity-asch
            brief: Conformity is changing behaviour to match a group. Asch's line study found many people gave a clearly wrong answer to match others.
          - title: What affects conformity
            id: psy-affects-conformity
            brief: Group size, unanimity, deindividuation and social proof all change how likely someone is to conform. Normative and informational influence explain why.
          - title: Obedience and Milgram
            id: psy-obedience-milgram
            brief: Obedience is following orders from an authority. Milgram found most people kept giving what they thought were shocks when told to.
          - title: Status, power and culture
            id: psy-status-power-culture
            brief: A person's status and power in a group, and cultural norms, shape how people act toward them and how much influence they have.
          - title: Media and behaviour
            id: psy-media-behaviour
            brief: Media, including social media, can spread prosocial messages and connection, but can also feed comparison, misinformation and harmful norms.
          - title: Reducing prejudice
            id: psy-reducing-prejudice
            brief: Strategies such as contact between groups on equal terms, shared goals and challenging stereotypes can reduce prejudice.

      - title: Sensation and perception
        id: vic-psy-u12-2-3
        points:
          - title: Sensation and perception compared
            id: psy-sensation-perception-compared
            brief: Sensation is detecting stimuli with sense receptors. Perception is the brain selecting, organising and interpreting that information.
          - title: Reception, transduction and transmission
            id: psy-reception-transduction-transmission
            brief: Receptors detect a stimulus, transduction turns it into electrical impulses, and transmission carries those impulses to the brain.
          - title: Gestalt principles
            id: psy-gestalt-principles
            brief: The brain groups visual information using principles such as figure-ground, closure, similarity and proximity.
          - title: Depth cues
            id: psy-depth-cues
            brief: Binocular cues use both eyes, such as convergence and retinal disparity. Monocular cues work with one eye, such as linear perspective and interposition.
          - title: Perceptual set
            id: psy-perceptual-set
            brief: Expectations, context, past experience and motivation prepare us to see or taste things a certain way.
          - title: Gustatory perception
            id: psy-gustatory-perception
            brief: Taste combines signals from taste receptors with smell, texture and sight. Age, genes and food packaging all shape it.
          - title: Visual illusions
            id: psy-visual-illusions
            brief: Illusions such as the Müller-Lyer and Ames room show perception can be wrong even when we know the truth.
          - title: Distortions of taste
            id: psy-distortions-taste
            brief: Taste can be fooled, as when food colour changes what flavour people report, or a miracle berry makes sour food taste sweet.

      - title: Research methods in psychology
        id: vic-psy-u12-2-4
        points:
          - title: Variables and hypotheses
            id: psy-variables-hypotheses
            brief: The independent variable is changed, the dependent variable is measured, and a hypothesis predicts how one affects the other in a given population.
          - title: Controlled and extraneous variables
            id: psy-controlled-extraneous-variables
            brief: Extraneous variables could affect results. Controlled variables are kept the same so only the independent variable changes. A confounding variable has already affected the results.
          - title: Sampling
            id: psy-sampling
            brief: A sample is drawn from a population. Random and stratified sampling help it represent the population, so results can be generalised.
          - title: Experimental designs
            id: psy-experimental-designs
            brief: Within-subjects, between-subjects and mixed designs each handle participant differences and order effects in their own way.
          - title: Ethics in research
            id: psy-ethics-research
            brief: Psychology research must protect participants with informed consent, voluntary participation, withdrawal rights, confidentiality and debriefing, and only use deception when justified.
          - title: Data and error
            id: psy-data-error
            brief: Data can be qualitative or quantitative, and primary or secondary. Random errors scatter results; systematic errors push them one way.
