# VCE Psychology, Units 1 and 2: development, the brain, social cognition and perception, 48 points.
# Drafted from the VCAA's VCE Psychology Study Design, accreditation period 2023 to 2027. The structure follows the
# study design: each unit is a unit here, and each area of study is a chapter, or two when it is large. The research
# investigation in each unit is school-run, so its science skills are one chapter here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on mental health and Aboriginal and Torres Strait Islander knowledge always go to the review page.
# In transition: the accreditation ends 31 December 2027. Check for a new study design before running this for 2028.

id: vic-psy-u12
subject: Psychology
bank: psy
name: Psychology, Units 1 and 2
about: VCE, Development, the brain, social influence and perception
short: Psychology
years: [11]
level: Units 1 and 2
