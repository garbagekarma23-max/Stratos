# VCE General Mathematics, Units 1 and 2: data, sequences and finance, linear relations, matrices, networks, and
# measurement and trigonometry, 48 points.
# Drafted from the VCAA's VCE Mathematics Study Design, accreditation period 2023 to 2027. In Units 1 and 2 schools
# pick and order the topics, so each unit here is an area of study and each chapter a topic. Every brief is in our own
# words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths). NSW Mathematics Standard (the mat bank) shares much of this, so
# expect reuses and adapts.
# In transition: the accreditation ends 31 December 2027. Check for a new study design before running this for 2028.

id: vic-mat-gen-u12
subject: Mathematics
bank: mat
name: General Mathematics, Units 1 and 2
about: VCE, Data, finance, relations, matrices and networks
short: General Mathematics
years: [11]
level: Units 1 and 2
place: vic
kind: maths
syllabus: VCE Mathematics Study Design (2023 to 2027), General Mathematics Units 1 and 2
note: Follows the VCE Mathematics study design. Not made or endorsed by the VCAA.
chips: [five-number summary, recurrence relation, compound interest, matrix, Euler trail]

units:
  - title: Data analysis, probability and statistics
    chapters:
      - title: Investigating data distributions
        id: vic-mat-gen-u12-1-1
        points:
          - title: Types of data
            id: mat-types-data-2
            brief: Categorical data sorts into groups (nominal or ordinal). Numerical data is counted (discrete) or measured (continuous).
          - title: Displaying categorical data
            id: mat-displaying-categorical-data
            brief: Frequency tables, bar charts and segmented bar charts show how often each category occurs.
          - title: Histograms and dot plots
            id: mat-histograms-dot-plots
            brief: Histograms and dot plots show the shape of numerical data, such as symmetric, positively skewed or negatively skewed.
          - title: Mean, median and mode
            id: mat-mean-median-mode-2
            brief: The mean is the sum divided by the count, the median the middle value and the mode the most common. Skew pulls the mean toward the tail.
          - title: Range, IQR and standard deviation
            id: mat-range-iqr-standard-deviation
            brief: The range is highest less lowest, the IQR is Q3 less Q1, and the standard deviation measures typical distance from the mean.
          - title: The five-number summary and boxplots
            id: mat-five-number-summary-boxplots
            brief: Minimum, Q1, median, Q3 and maximum, drawn as a boxplot. A value more than 1.5 IQRs beyond the box is an outlier.
          - title: Comparing distributions
            id: mat-comparing-distributions
            brief: Back-to-back stem plots and parallel boxplots compare groups by centre, spread, shape and outliers.

      - title: Investigating associations
        id: vic-mat-gen-u12-1-2
        points:
          - title: Scatterplots
            id: mat-scatterplots-2
            brief: A scatterplot shows the link between two numerical variables, with the explanatory variable on the horizontal axis.
          - title: Describing an association
            id: mat-describing-association
            brief: Describe direction (positive or negative), form (linear or not) and strength (weak, moderate or strong).
          - title: Two-way tables
            id: mat-two-way-tables-2
            brief: Two-way frequency tables compare two categorical variables, using row or column percentages.
          - title: Lines of good fit
            id: mat-lines-good-fit
            brief: A line drawn through a scatterplot by eye can be used to predict one variable from the other.
          - title: Interpolation and extrapolation
            id: mat-interpolation-extrapolation-2
            brief: Predicting within the data's range is interpolation and is more reliable than extrapolation beyond it.

  - title: Algebra, number and structure
    chapters:
      - title: Sequences and recursion
        id: vic-mat-gen-u12-2-1
        points:
          - title: Arithmetic sequences
            id: mat-arithmetic-sequences-2
            brief: Each term adds the same common difference, d. The nth term is a + (n − 1)d.
          - title: Geometric sequences
            id: mat-geometric-sequences-2
            brief: Each term is multiplied by the same common ratio, r. The nth term is a × r^(n − 1).
          - title: First-order recurrence relations
            id: mat-first-order-recurrence-relations
            brief: A rule giving each term from the one before, such as u(n+1) = u(n) + 4, with a starting value u0.
          - title: Linear growth and decay
            id: mat-linear-growth-decay
            brief: Adding or subtracting the same amount each step, as in simple interest or flat-rate depreciation.
          - title: Geometric growth and decay
            id: mat-geometric-growth-decay
            brief: Multiplying by the same factor each step, as in compound interest or reducing balance depreciation.

      - title: Financial arithmetic
        id: vic-mat-gen-u12-2-2
        points:
          - title: Percentage increase and decrease
            id: mat-percentage-increase-decrease-2
            brief: To raise a value by 10%, multiply by 1.1. To lower it by 10%, multiply by 0.9.
          - title: GST and price
            id: mat-gst-price
            brief: GST in Australia is 10%. A price including GST is the price without it times 1.1.
          - title: Simple interest
            id: mat-simple-interest-2
            brief: Interest on the starting amount only, I = PrT/100, so the balance grows by the same amount each period.
          - title: Compound interest
            id: mat-compound-interest-2
            brief: Interest added to the balance and earning interest itself, A = P(1 + r/100)^n with r per period.
          - title: Comparing purchase options
            id: mat-comparing-purchase-options
            brief: Cash, credit cards, buy now pay later and loans differ in interest, fees and total cost.
          - title: Inflation and purchasing power
            id: mat-inflation-purchasing-power
            brief: Inflation means the same money buys less over time, so a price rising with inflation stays the same in real terms.

  - title: Functions, relations and graphs
    chapters:
      - title: Linear relations and modelling
        id: vic-mat-gen-u12-3-1
        points:
          - title: Gradient and intercept
            id: mat-gradient-intercept
            brief: In y = mx + c, m is the gradient (rise over run) and c is the y-intercept.
          - title: Finding a linear rule
            id: mat-finding-linear-rule
            brief: Two points give the gradient, then substituting one point gives the intercept.
          - title: Linear models in context
            id: mat-linear-models-context
            brief: A gradient is a rate, such as cost per kilometre, and the intercept is a starting value, such as a call-out fee.
          - title: Simultaneous linear equations
            id: mat-simultaneous-linear-equations-2
            brief: The intersection of two lines solves both equations, found by graphing, substitution or elimination, such as a break-even point.
          - title: Piecewise and step graphs
            id: mat-piecewise-step-graphs
            brief: Graphs made of different rules over different intervals, such as parking fees that jump at each hour.
          - title: Direct and inverse variation
            id: mat-direct-inverse-variation
            brief: In direct variation y = kx; in inverse variation y = k/x, so one doubles as the other halves.

  - title: Discrete mathematics
    chapters:
      - title: Matrices
        id: vic-mat-gen-u12-4-1
        points:
          - title: What a matrix is
            id: mat-matrix
            brief: A rectangular array of numbers. Its order is rows by columns, such as 2 × 3.
          - title: Adding and scaling matrices
            id: mat-adding-scaling-matrices
            brief: Matrices of the same order add element by element. Scalar multiplication multiplies every element.
          - title: Multiplying matrices
            id: mat-multiplying-matrices
            brief: An m × n matrix times an n × p matrix gives an m × p matrix, each element a row times a column.
          - title: Identity and inverse matrices
            id: mat-identity-inverse-matrices
            brief: The identity matrix leaves a matrix unchanged. A square matrix with a non-zero determinant has an inverse.
          - title: Matrices in context
            id: mat-matrices-context
            brief: Matrices can store data such as sales by shop and month, and multiplying them can total costs or revenue.

      - title: Graphs and networks
        id: vic-mat-gen-u12-4-2
        points:
          - title: Vertices, edges and degree
            id: mat-vertices-edges-degree
            brief: A graph has vertices joined by edges. The degree of a vertex is the number of edges that meet it.
          - title: Walks, trails, paths and circuits
            id: mat-walks-trails-paths-circuits
            brief: A walk is any route, a trail repeats no edge, a path repeats no vertex, and a circuit or cycle ends where it began.
          - title: Euler trails and circuits
            id: mat-euler-trails-circuits
            brief: An Euler trail uses every edge once. A connected graph has an Euler circuit if every vertex has even degree.
          - title: Hamiltonian paths and cycles
            id: mat-hamiltonian-paths-cycles
            brief: A Hamiltonian path visits every vertex once. A Hamiltonian cycle also returns to the start.
          - title: Planar graphs and Euler's formula
            id: mat-planar-graphs-euler-s
            brief: A planar graph can be drawn without edges crossing, and then v − e + f = 2.
          - title: Shortest path
            id: mat-shortest-path
            brief: In a weighted graph, the shortest path between two vertices has the smallest total weight.

  - title: Space and measurement
    chapters:
      - title: Measurement and trigonometry
        id: vic-mat-gen-u12-5-1
        points:
          - title: Perimeter and area
            id: mat-perimeter-area-2
            brief: Area formulas for rectangles, triangles, trapeziums and circles, and adding or subtracting shapes for composite figures.
          - title: Surface area and volume
            id: mat-surface-area-volume
            brief: Volume of a prism is base area times height. Surface area adds the areas of every face.
          - title: Similarity and scale factors
            id: mat-similarity-scale-factors
            brief: Similar shapes have matching angles and sides in the same ratio k. Areas scale by k² and volumes by k³.
          - title: Pythagoras' theorem
            id: mat-pythagoras-theorem
            brief: In a right-angled triangle, a² + b² = c², where c is the hypotenuse.
          - title: Sine, cosine and tangent ratios
            id: mat-sine-cosine-tangent-ratios
            brief: In a right-angled triangle, sin is opposite over hypotenuse, cos adjacent over hypotenuse and tan opposite over adjacent.
          - title: The sine and cosine rules
            id: mat-sine-cosine-rules
            brief: For any triangle, the sine rule links sides to opposite angles and the cosine rule finds a side or angle from the other three parts.
          - title: Area of a triangle with sine
            id: mat-area-triangle-with-sine
            brief: Area = ½ab sin C, using two sides and the angle between them.
          - title: Bearings and angles of elevation
            id: mat-bearings-angles-elevation
            brief: Bearings are measured clockwise from north. Angles of elevation and depression are measured from the horizontal.
