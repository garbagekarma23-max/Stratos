# VCE Economics, Units 3 and 4: the Australian economy and economic management, 47 points.
# Drafted from the VCAA's VCE Economics Study Design, accreditation period 2023 to 2027. The structure follows the
# study design: each unit is a unit here, and each area of study is a chapter, or two when it is large. Every brief is
# in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# also_match [e] has the matcher look in the Economics bank (econ-points.js) too. NSW Economics Year 12 (the eco bank)
# covers the same Australian policies, so expect reuses and adapts.
# In transition: the accreditation ends 31 December 2027. Check for a new study design before running this for 2028.

id: vic-eco-u34
subject: Economics
bank: eco
name: Economics, Units 3 and 4
about: VCE, The Australian economy and economic management
short: Economics
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Economics Study Design (2023 to 2027), Units 3 and 4
note: Follows the VCE Economics study design. Not made or endorsed by the VCAA.
chips: [market failure, inflation target, terms of trade, cash rate, productivity]
also_match: [e]

units:
  - title: "Unit 3: Australia's economic prosperity"
    chapters:
      - title: The market system
        id: vic-eco-u34-1-1
        points:
          - title: Allocating resources through markets
            id: eco-allocating-resources-through-markets
            brief: In a market economy, relative prices signal what is scarce and wanted, so resources flow to where they are valued most.
          - title: Non-price factors in demand
            id: eco-non-price-factors-demand
            brief: Disposable income, interest rates, consumer confidence, preferences and prices of related goods shift demand.
          - title: Non-price factors in supply
            id: eco-non-price-factors-supply
            brief: Production costs, productivity, technology, the number of firms, climate and taxes or subsidies shift supply.
          - title: Price elasticity of supply
            id: eco-price-elasticity-supply-2
            brief: How much quantity supplied responds to a price change. Spare capacity, stocks and time make supply more elastic.
          - title: Elasticity and decisions
            id: eco-elasticity-decisions
            brief: Businesses and governments use elasticity to judge the effect of price changes on revenue and of taxes on prices.
          - title: Efficiency in markets
            id: eco-efficiency-markets
            brief: Allocative efficiency gives the goods people value most, productive efficiency uses the least resources, and dynamic efficiency adapts over time.
          - title: Effects of competition
            id: eco-effects-competition
            brief: Strong competition pushes prices down, lifts quality and drives innovation; weak competition lets firms raise prices.

      - title: Market failure and government intervention
        id: vic-eco-u34-1-2
        points:
          - title: Public goods
            id: eco-public-goods-2
            brief: Goods that are non-rival and non-excludable, such as street lighting, which markets under-supply because people can use them without paying.
          - title: Externalities
            id: eco-externalities-2
            brief: Costs or benefits that fall on people outside a transaction. Negative ones, such as pollution, are over-produced; positive ones, such as education, under-produced.
          - title: Asymmetric information
            id: eco-asymmetric-information
            brief: When one side of a deal knows more than the other, such as a used car seller, markets can give poor results.
          - title: Common access resources
            id: eco-common-access-resources
            brief: Resources that are rival but hard to exclude people from, such as fish stocks, which tend to be overused.
          - title: Government intervention to correct failure
            id: eco-government-intervention-correct-failure
            brief: Taxes, subsidies, regulation, direct provision and information campaigns can each correct a market failure.
          - title: Government failure
            id: eco-government-failure
            brief: Intervention can make outcomes worse, through poor information, high costs, unintended effects or political pressure.

      - title: Domestic macroeconomic goals
        id: vic-eco-u34-1-3
        points:
          - title: Aggregate demand factors
            id: eco-aggregate-demand-factors
            brief: Interest rates, consumer and business confidence, disposable income, the exchange rate and world growth change total spending.
          - title: Aggregate supply factors
            id: eco-aggregate-supply-factors
            brief: Productivity, the size and skills of the workforce, input costs, technology and natural events change the economy's capacity.
          - title: Low and stable inflation
            id: eco-low-stable-inflation
            brief: The goal is inflation of 2 to 3 per cent on average over time. The CPI measures it as the change in prices of a basket of goods.
          - title: Demand-pull and cost-push inflation
            id: eco-demand-pull-cost-push
            brief: Demand-pull inflation comes from spending growing faster than capacity. Cost-push inflation comes from rising costs of production.
          - title: Consequences of inflation
            id: eco-consequences-inflation
            brief: High inflation erodes purchasing power, distorts decisions and hurts those on fixed incomes. Deflation brings its own harm.
          - title: Strong and sustainable growth
            id: eco-strong-sustainable-growth
            brief: Growth near the economy's long-run trend, about 3 per cent in real GDP, that lifts living standards without inflation or environmental harm.
          - title: Full employment
            id: eco-full-employment
            brief: The lowest unemployment possible without inflation rising, with only frictional, structural and seasonal unemployment left.
          - title: Measuring the labour market
            id: eco-measuring-labour-market
            brief: The unemployment rate is the unemployed as a share of the labour force. The participation rate is the labour force as a share of the working-age population.
          - title: Types of unemployment
            id: eco-types-unemployment
            brief: Cyclical unemployment comes from weak demand, structural from a mismatch of skills, frictional from moving between jobs, and seasonal from the time of year.
          - title: Living standards and the goals
            id: eco-living-standards-goals
            brief: Meeting the goals lifts material living standards, but growth can also cost non-material ones, such as the environment.

      - title: Australia and the world economy
        id: vic-eco-u34-1-4
        points:
          - title: Absolute and comparative advantage
            id: eco-absolute-comparative-advantage
            brief: A country has a comparative advantage in what it can make at a lower opportunity cost. Specialising in it and trading lifts total output.
          - title: Gains from trade
            id: eco-gains-from-trade
            brief: Trade gives access to cheaper goods, bigger markets, economies of scale, competition and new technology.
          - title: Protection
            id: eco-protection
            brief: Tariffs, quotas and subsidies shield local industries, but raise prices and lower efficiency.
          - title: The exchange rate
            id: eco-exchange-rate
            brief: The price of the Australian dollar in another currency, set by demand and supply in the foreign exchange market.
          - title: Factors moving the exchange rate
            id: eco-factors-moving-exchange-rate
            brief: Interest rate gaps, commodity prices, the terms of trade and investor confidence change demand for the Australian dollar.
          - title: The terms of trade
            id: eco-terms-trade-2
            brief: An index of export prices relative to import prices. A rise means each export buys more imports.
          - title: Effects of a change in the dollar
            id: eco-effects-change-dollar
            brief: A falling dollar makes exports cheaper and imports dearer, lifting export industries but raising some prices.
          - title: The balance of payments
            id: eco-balance-payments-2
            brief: A record of a country's transactions with the world. The current account covers trade and income; the capital and financial account covers investment.

  - title: "Unit 4: Managing the economy"
    chapters:
      - title: Budgetary policy
        id: vic-eco-u34-2-1
        points:
          - title: The Commonwealth budget
            id: eco-commonwealth-budget
            brief: The government's annual plan of revenue and spending, which shapes aggregate demand and the economy's goals.
          - title: Budget outcomes
            id: eco-budget-outcomes-2
            brief: A deficit is spending above revenue, a surplus is revenue above spending. The underlying cash balance is the usual measure.
          - title: Automatic stabilisers
            id: eco-automatic-stabilisers-2
            brief: Tax revenue and welfare spending move with the business cycle without any decision, softening booms and busts.
          - title: Discretionary changes
            id: eco-discretionary-changes
            brief: Deliberate changes to tax and spending, such as cutting tax to boost spending in a downturn.
          - title: Expansionary and contractionary stance
            id: eco-expansionary-contractionary-stance
            brief: An expansionary budget adds to aggregate demand; a contractionary one subtracts from it.
          - title: Strengths and limits of budgetary policy
            id: eco-strengths-limits-budgetary-policy
            brief: It can target regions and groups, but it takes time to plan and pass, and debt has to be paid back.

      - title: Monetary policy
        id: vic-eco-u34-2-2
        points:
          - title: The Reserve Bank and its goals
            id: eco-reserve-bank-goals
            brief: The RBA runs monetary policy to keep prices stable and support full employment, independent of the government.
          - title: The cash rate
            id: eco-cash-rate
            brief: The interest rate on overnight loans between banks, which the RBA sets as its main policy tool.
          - title: The transmission mechanism
            id: eco-transmission-mechanism
            brief: A change in the cash rate passes through to other interest rates, saving, borrowing, asset prices, the exchange rate and in time spending and inflation.
          - title: Strengths and limits of monetary policy
            id: eco-strengths-limits-monetary-policy
            brief: It can be changed quickly and is independent, but takes time to work fully and acts on the whole country at once.

      - title: Aggregate supply policies
        id: vic-eco-u34-2-3
        points:
          - title: Why supply-side policies matter
            id: eco-supply-side-policies-matter
            brief: Policies that lift productivity and capacity let the economy grow faster without inflation.
          - title: Education and training
            id: eco-education-training
            brief: Spending on schools, universities and vocational training lifts workers' skills and productivity.
          - title: Infrastructure
            id: eco-infrastructure
            brief: Roads, rail, ports and digital networks cut business costs and raise the economy's capacity.
          - title: Competition policy
            id: eco-competition-policy-2
            brief: Laws enforced by the ACCC stop anti-competitive conduct, pushing firms to cut costs and innovate.
          - title: Environmental and energy policy
            id: eco-environmental-energy-policy
            brief: Policies on energy supply and emissions affect production costs and whether growth can be sustained.
          - title: Strengths and limits of supply-side policies
            id: eco-strengths-limits-supply-side
            brief: They lift living standards in the long run, but take years to work and can be costly up front.
