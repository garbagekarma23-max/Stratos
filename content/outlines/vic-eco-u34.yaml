# VCE Economics, Units 3 and 4: the Australian economy and economic management, 68 points.
# Checked against the VCAA's VCE Economics Study Design, accredited from 2023, in October 2026. Each unit is a unit
# here, and each area of study is a chapter, or two when it is large. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# also_match [e] has the matcher look in the Economics bank (econ-points.js) too. NSW Economics Year 12 (the eco bank)
# covers the same Australian policies, so expect reuses and adapts.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-eco-u34
subject: Economics
bank: eco
name: Economics, Units 3 and 4
about: VCE, The Australian economy and economic management
short: Economics
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Economics Study Design (from 2023), Units 3 and 4
note: Follows the VCE Economics study design. Not made or endorsed by the VCAA.
chips: [market failure, inflation target, terms of trade, cash rate, productivity]
also_match: [e]

units:
  - title: "Unit 3: Australia's living standards"
    chapters:
      - title: Scarcity, efficiency and markets
        id: vic-eco-u34-1-1
        points:
          - title: Relative scarcity and the PPF
            id: eco-relative-scarcity-ppf
            brief: Needs and wants outrun resources, so choices carry an opportunity cost. The production possibility frontier shows those choices and the three economic questions.
          - title: Types of efficiency
            id: eco-efficiency-markets
            brief: Allocative efficiency makes what people value most, productive efficiency uses the fewest resources, dynamic efficiency adapts over time, and intertemporal efficiency balances now against later.
          - title: Conditions for a competitive market
            id: eco-conditions-competitive-market
            brief: A free, perfectly competitive market has many buyers and sellers, similar products, good information, free entry and exit, and no government interference.
          - title: Allocating resources through markets
            id: eco-allocating-resources-through-markets
            brief: In a market economy, relative prices signal what is scarce and wanted, so resources flow to where they are valued most.
          - title: Competitive markets and living standards
            id: eco-effects-competition
            brief: Strong competition pushes prices down, lifts quality and drives new ideas, so resources go where they are valued most and living standards rise.

      - title: Demand, supply and elasticity
        id: vic-eco-u34-1-2-2
        points:
          - title: The theory of the law of demand
            id: eco-theory-law-demand
            brief: Demand falls as price rises because of the income effect, where buying power shrinks, and the substitution effect, where other goods look cheaper.
          - title: Non-price factors in demand
            id: eco-non-price-factors-demand
            brief: Disposable income, prices of substitutes and complements, preferences, interest rates, population and consumer confidence shift the demand curve.
          - title: The theory of the law of supply
            id: eco-theory-law-supply
            brief: Supply rises with price because the profit motive draws producers to make more when each unit earns more.
          - title: Non-price factors in supply
            id: eco-non-price-factors-supply
            brief: Production costs, the number of suppliers, technology, productivity and the climate shift the supply curve.
          - title: Shifts and new equilibrium
            id: eco-shifts-new-equilibrium
            brief: A shift in demand or supply changes the equilibrium price and quantity traded. Both curves can move at once.
          - title: Price elasticity of demand
            id: eco-price-elasticity-demand-2
            brief: How much quantity demanded responds to a price change. Necessities, goods with few substitutes, cheap items and the short term are inelastic.
          - title: Price elasticity of supply
            id: eco-price-elasticity-supply-2
            brief: How much quantity supplied responds to a price change. Spare capacity, a short production period and goods that store well make supply more elastic.

      - title: Market failure and government intervention
        id: vic-eco-u34-1-2
        points:
          - title: Public goods
            id: eco-public-goods-2
            brief: Goods that are non-rival and non-excludable, such as street lighting, which markets under-supply because people can use them without paying.
          - title: Externalities
            id: eco-externalities-2
            brief: Costs or benefits that fall on people outside a transaction. Negative ones, such as pollution, are over-produced; positive ones, such as education, under-produced.
          - title: Asymmetric information
            id: eco-asymmetric-information
            brief: When one side of a deal knows more than the other, such as a used car seller, markets can give poor results.
          - title: Common access resources
            id: eco-common-access-resources
            brief: Resources that are rival but hard to exclude people from, such as fish stocks, which tend to be overused.
          - title: Government intervention to correct failure
            id: eco-government-intervention-correct-failure
            brief: Indirect taxes, subsidies, regulation, advertising campaigns and direct provision can each correct a market failure.
          - title: Government failure
            id: eco-government-failure
            brief: An intervention can lower efficiency by accident, such as a rule that raises costs or a subsidy that keeps a wasteful industry going.

      - title: The macroeconomy
        id: vic-eco-u34-1-4-2
        points:
          - title: Material and non-material living standards
            id: eco-living-standards-goals
            brief: Living standards depend on access to goods and services and on things such as the environment, health, safety and literacy.
          - title: The five-sector circular flow model
            id: eco-five-sector-circular-flow-3
            brief: Households, businesses, government, financial institutions and the overseas sector link through income, spending, saving, tax and trade.
          - title: The business cycle and its causes
            id: eco-business-cycle-causes
            brief: Shifts in aggregate demand and supply push the economy through expansion, peak, contraction and trough.
          - title: Aggregate demand factors
            id: eco-aggregate-demand-factors
            brief: Interest rates, consumer and business confidence, disposable income, the exchange rate and world growth change total spending.
          - title: Aggregate supply factors
            id: eco-aggregate-supply-factors
            brief: Productivity, the size and skills of the workforce, input costs, technology and natural events change the economy's capacity.

      - title: Growth and full employment
        id: vic-eco-u34-1-3
        points:
          - title: Strong and sustainable growth
            id: eco-strong-sustainable-growth
            brief: Growth in real GDP near the economy's long-run trend, about 3 per cent a year, that lifts living standards and can be kept up.
          - title: Growth that is too fast or too slow
            id: eco-growth-that-too-fast
            brief: Growth that is too fast brings inflation, environmental harm and pressure on the current account. Growth that is too slow brings unemployment.
          - title: Full employment
            id: eco-full-employment
            brief: The lowest unemployment the economy can hold without inflation rising, called the natural rate (NAIRU), leaving only frictional and structural unemployment.
          - title: The labour force
            id: eco-labour-force
            brief: People are employed, unemployed, underemployed, hidden unemployed or long-term unemployed, and each tells a different story about jobs.
          - title: Measuring the labour market
            id: eco-measuring-labour-market
            brief: The unemployment rate, the participation rate and the labour force under-utilisation rate, which adds the underemployed to the unemployed.
          - title: Types of unemployment
            id: eco-types-unemployment
            brief: Cyclical unemployment comes from weak demand in a downturn. Structural unemployment comes from a mismatch of skills or places, and lasts longer.
          - title: The costs of unemployment
            id: eco-costs-unemployment
            brief: High unemployment wastes output and tax revenue and harms people and communities. Unemployment that is too low can push up inflation.

      - title: Low and stable inflation
        id: vic-eco-u34-1-6
        points:
          - title: Low and stable inflation
            id: eco-low-stable-inflation
            brief: The goal is inflation of 2 to 3 per cent on average. The CPI measures it, and underlying (core) inflation strips out prices that jump around.
          - title: Inflation, disinflation and deflation
            id: eco-inflation-disinflation-deflation
            brief: Inflation is rising prices, disinflation is prices rising more slowly, and deflation is prices falling.
          - title: Demand-pull and cost-push inflation
            id: eco-demand-pull-cost-push
            brief: Demand-pull inflation comes from spending growing faster than capacity. Cost-push inflation comes from rising costs of production.
          - title: Consequences of inflation
            id: eco-consequences-inflation
            brief: High inflation erodes buying power, can start a wage-price spiral and distorts spending and investment. Inflation that is too low can delay spending and cost jobs.
          - title: Explaining recent results
            id: eco-explaining-recent-results
            brief: Changes in aggregate demand and supply explain how well Australia has met its growth, jobs and inflation goals over the past two years.

      - title: Trade and the balance of payments
        id: vic-eco-u34-1-4
        points:
          - title: Gains from trade
            id: eco-gains-from-trade
            brief: Trade brings lower prices, more choice, access to resources, economies of scale, and more competition and efficiency.
          - title: The balance of payments
            id: eco-balance-payments-2
            brief: A record of a country's transactions with the world. The current account covers trade and income; the capital and financial account covers investment.
          - title: The current account balance
            id: eco-current-account-balance
            brief: Australia usually runs a current account deficit. Cyclical influences such as commodity prices move it year to year; structural ones such as low saving keep it there.
          - title: Net foreign debt and equity
            id: eco-net-foreign-debt-equity
            brief: Borrowing from overseas builds net foreign debt; selling shares and assets builds net foreign equity. Both come from funding investment with foreign saving.

      - title: The exchange rate, terms of trade and competitiveness
        id: vic-eco-u34-1-8
        points:
          - title: The exchange rate
            id: eco-exchange-rate
            brief: The price of the Australian dollar in another currency, set by demand and supply in the foreign exchange market.
          - title: Factors moving the exchange rate
            id: eco-factors-moving-exchange-rate
            brief: Interest rate gaps, commodity prices and the terms of trade, demand for exports and imports, foreign investment and inflation change demand for the Australian dollar.
          - title: The terms of trade
            id: eco-terms-trade-2
            brief: An index of export prices over import prices. Commodity prices and costs in trading partners move it, and a rise means each export buys more imports.
          - title: International competitiveness
            id: eco-international-competitiveness
            brief: How well Australian goods compete on price and quality overseas, shaped by productivity, costs, natural resources, the exchange rate and relative inflation.
          - title: Effects on the goals and living standards
            id: eco-effects-change-dollar
            brief: Changes in the exchange rate, the terms of trade and competitiveness shift exports, imports, jobs and inflation, and so the goals and living standards.

  - title: "Unit 4: Managing the economy"
    chapters:
      - title: Monetary policy
        id: vic-eco-u34-2-2
        points:
          - title: The Reserve Bank and its goals
            id: eco-reserve-bank-goals
            brief: The RBA runs monetary policy under its charter, aiming for stable prices and full employment, independent of the government.
          - title: The cash rate
            id: eco-cash-rate
            brief: The interest rate on overnight loans between banks. The RBA sets a target for it, and other interest rates follow.
          - title: Unconventional monetary policy
            id: eco-unconventional-monetary-policy-2
            brief: When the cash rate is near zero, a central bank can buy bonds or lend cheaply to banks to push other interest rates down.
          - title: The transmission mechanism
            id: eco-transmission-mechanism
            brief: "A change in the cash rate reaches spending through four channels: saving and investment, cash flow, the exchange rate, and asset prices and wealth."
          - title: The stance of monetary policy
            id: eco-stance-monetary-policy
            brief: Policy is expansionary when rates are below neutral, contractionary when above, and neutral in between. Recent changes show which way the RBA leans.
          - title: Strengths and limits of monetary policy
            id: eco-strengths-limits-monetary-policy
            brief: It can be changed quickly and is independent, but takes time to work fully and acts on the whole country at once.

      - title: The budget
        id: vic-eco-u34-2-1
        points:
          - title: The Commonwealth budget
            id: eco-commonwealth-budget
            brief: The government's yearly plan of revenue and spending. With monetary policy, it is used to steady aggregate demand over the business cycle.
          - title: Government revenue
            id: eco-government-revenue
            brief: Direct taxes on income and indirect taxes on spending, which can be progressive, regressive or proportional, plus income from government businesses and asset sales.
          - title: Government spending
            id: eco-government-spending
            brief: Current spending on day-to-day services, capital spending on long-lasting assets, and transfer payments such as pensions.
          - title: Budget outcomes
            id: eco-budget-outcomes-2
            brief: A balanced budget, a deficit or a surplus. The underlying cash balance, often shown as a share of GDP, is the usual measure.
          - title: Deficits, surpluses and public debt
            id: eco-deficits-surpluses-public-debt
            brief: A deficit is funded by borrowing or selling assets and adds to public debt. A surplus can repay debt or be saved.

      - title: Budgetary policy
        id: vic-eco-u34-2-3-2
        points:
          - title: Automatic stabilisers
            id: eco-automatic-stabilisers-2
            brief: Tax revenue and welfare spending move with the business cycle without any decision, softening booms and busts. This is the cyclical part of the budget.
          - title: Discretionary changes
            id: eco-discretionary-changes
            brief: Deliberate changes to tax and spending, the structural part of the budget, such as cutting tax to lift spending in a downturn.
          - title: Expansionary and contractionary stance
            id: eco-expansionary-contractionary-stance
            brief: An expansionary budget adds to aggregate demand; a contractionary one takes from it. Recent budgets show which way policy leans.
          - title: Strengths and limits of budgetary policy
            id: eco-strengths-limits-budgetary-policy
            brief: It can target regions and groups, but it takes time to plan and pass, and debt has to be paid back.

      - title: Budgetary aggregate supply policies
        id: vic-eco-u34-2-3
        points:
          - title: Why supply-side policies matter
            id: eco-supply-side-policies-matter
            brief: Policies that improve the quantity and quality of resources, cut costs and lift productivity let the economy grow without inflation, alongside demand policies.
          - title: Education and training
            id: eco-education-training
            brief: Spending on schools, universities and vocational training lifts workers' skills and productivity.
          - title: Research and development
            id: eco-research-development
            brief: Grants and tax breaks for research encourage new products and methods that lift productivity.
          - title: Infrastructure
            id: eco-infrastructure
            brief: Roads, rail, ports and digital networks cut business costs and raise the economy's capacity.
          - title: Tax reform
            id: eco-tax-reform-2
            brief: Changes to the tax system that reward work, saving and investment, or cut the cost of doing business, can lift supply.

      - title: Other aggregate supply policies
        id: vic-eco-u34-2-5
        points:
          - title: Skilled immigration
            id: eco-skilled-immigration
            brief: Bringing in skilled workers adds to the population and workforce, fills skill gaps and can lift productivity and participation.
          - title: Trade liberalisation
            id: eco-protection
            brief: Cutting tariffs and other protection exposes firms to competition and cheaper inputs. It can cost jobs at first and lift efficiency later.
          - title: Market-based environmental policy
            id: eco-environmental-energy-policy
            brief: Policies such as emissions trading put a price on pollution, changing costs now to protect resources for later generations.
          - title: Strengths and limits of supply-side policies
            id: eco-strengths-limits-supply-side
            brief: They lift living standards in the long run, but take years to work and can be costly up front.
