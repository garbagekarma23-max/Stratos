# NSW English Advanced, Year 12: the four Year 12 focus areas, 36 points.
# Drafted from NESA's English Advanced 11-12 Syllabus (2024), taught in Year 12 from Term 4 2026 and first examined in
# the 2027 HSC. The structure follows the syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# No points on a particular prescribed text yet: schools pick their texts from NESA's 2027 to 2028 list.

id: nsw-eng-adv-12
subject: English
bank: eng
name: English Advanced, Year 12
about: HSC, Human experiences, conversations and craft
short: English Advanced
years: [12]
place: nsw
kind: english
syllabus: NSW English Advanced 11-12 Syllabus (2024), Year 12 focus areas
note: Follows the NSW English Advanced syllabus. Not made or endorsed by NESA.
chips: [human experience, intertextuality, appropriation, critical lens, reflection]

units:
  - title: Texts and human experiences
    chapters:
      - title: Human experience in texts
        id: nsw-eng-adv-12-1-1
        points:
          - title: Individual and collective experience
            id: eng-individual-collective-experience
            brief: Texts show experiences that belong to one person, such as grief or ambition, and experiences shared by a group, such as war, migration or a community's loss.
          - title: Paradox and contradiction in people
            id: eng-paradox-contradiction-people
            brief: People often act against their own stated values or want two things at once. Texts that show these contradictions feel truer, and they invite the reader to question simple judgements.
          - title: Anomalies in behaviour
            id: eng-anomalies-behaviour
            brief: An anomaly is behaviour that breaks a pattern or surprises us, such as an act of kindness from a cruel character. Writers use anomalies to reveal what drives a person.
          - title: Emotions and motivations
            id: eng-emotions-motivations
            brief: Texts explore why people act, through fear, love, guilt, pride or hope. Students explain how a writer makes a character's motivation visible to the reader.
          - title: How texts build empathy
            id: eng-texts-build-empathy
            brief: By placing readers inside an unfamiliar life, through voice, detail and point of view, texts can widen what readers understand of others' experiences.

      - title: Representing experience
        id: nsw-eng-adv-12-1-2
        points:
          - title: Language that conveys experience
            id: eng-language-that-conveys-experience
            brief: Precise diction, imagery and rhythm let a writer convey an inner experience, such as anxiety or joy, that is hard to describe directly.
          - title: Shaping a reader's response
            id: eng-shaping-reader-s-response
            brief: Writers control what the reader knows and when, and whose view they share, so the reader feels sympathy, suspense or unease at the right moments.
          - title: Writing about experience and the text
            id: eng-writing-about-experience-text
            brief: A strong response links the question's idea of human experience to specific techniques in the text, and explains what the text suggests about people.
          - title: Answering an unseen text question
            id: eng-answering-unseen-text-question
            brief: Short-answer questions on unseen extracts ask how a technique shows an experience. Read the question first, find one or two clear examples, and explain the effect in a few sentences.

  - title: Textual conversations
    chapters:
      - title: How texts talk to each other
        id: nsw-eng-adv-12-2-1
        points:
          - title: Intertextuality
            id: eng-intertextuality
            brief: Every text draws on earlier texts. Intertextuality is the relationship between texts, through shared stories, characters, forms or ideas, and it shapes how both are read.
          - title: Allusion
            id: eng-allusion
            brief: A brief reference to another text, person or event that the reader is expected to recognise. It adds meaning in a few words.
          - title: Appropriation and transformation
            id: eng-appropriation-transformation
            brief: A later writer takes an earlier text and reshapes it for a new context, changing its setting, form or point of view. The changes reveal how values have shifted.
          - title: Context and values in paired texts
            id: eng-context-values-paired-texts
            brief: When two texts share a story but come from different times, comparing their contexts explains why they treat the same characters or ideas differently.
          - title: Changing form and medium
            id: eng-changing-form-medium
            brief: Moving a story from a play to a film, or a novel to a poem, changes what can be shown and how. Form is part of the conversation between the texts.

      - title: Writing comparatively
        id: nsw-eng-adv-12-2-2
        points:
          - title: A comparative thesis
            id: eng-comparative-thesis
            brief: A thesis for two texts makes one claim about how they relate, such as how the later text challenges the values of the earlier one, rather than two separate claims.
          - title: Integrated paragraphs
            id: eng-integrated-paragraphs
            brief: An integrated essay discusses both texts in each paragraph, around a shared idea. It shows the conversation between texts more clearly than writing on one text and then the other.
          - title: Linking language in comparison
            id: eng-linking-language-comparison
            brief: Words such as similarly, in contrast, whereas and by reshaping help a reader follow a comparison. They must be followed by explanation, not used alone.
          - title: What the conversation reveals
            id: eng-conversation-reveals
            brief: The best comparisons end by explaining what reading the texts together shows that reading either alone would not.

  - title: Critical study of literature
    chapters:
      - title: Reading critically
        id: nsw-eng-adv-12-3-1
        points:
          - title: Style across a whole text
            id: eng-style-across-whole-text
            brief: A writer's style is the pattern of choices that runs through a text, such as sentence rhythm, imagery or irony. Studying style shows how the whole text makes its meaning.
          - title: Ambiguity and multiple meanings
            id: eng-ambiguity-multiple-meanings
            brief: Some texts leave meanings open on purpose, through ambiguous endings, symbols or characters. A strong reading admits the ambiguity and argues for what it adds.
          - title: Critical lenses
            id: eng-critical-lenses
            brief: Readers can approach a text through a lens, such as a feminist, postcolonial, Marxist or psychoanalytic reading, which focuses on power, gender, class or the mind.
          - title: Using critics well
            id: eng-using-critics-well
            brief: Quoting a critic can support or sharpen an argument, but the student's own reading of the text must lead. A critic's view is evidence to test, not a replacement for analysis.
          - title: A personal and informed reading
            id: eng-personal-informed-reading
            brief: An informed personal response combines close evidence, awareness of context and other readings, and the student's own judgement about what the text achieves.

      - title: Arguing about a text
        id: nsw-eng-adv-12-3-2
        points:
          - title: A sophisticated thesis
            id: eng-sophisticated-thesis
            brief: A thesis that goes beyond the obvious, by showing tension, change or complexity in the text, such as how its ending complicates what came before.
          - title: Developing an argument across paragraphs
            id: eng-developing-argument-across-paragraphs
            brief: Each paragraph should move the argument forward, so the essay builds rather than repeats. Ordering points from simpler to more complex helps.
          - title: Analysing an extract
            id: eng-analysing-extract
            brief: When given a passage from the studied text, connect the details in front of you to the patterns and ideas of the whole text.
          - title: Writing under exam conditions
            id: eng-writing-under-exam-conditions
            brief: Planning for a few minutes, keeping a clear thesis, and leaving time for a conclusion. A focused argument earns more than covering everything.

  - title: The craft of writing
    chapters:
      - title: Writing with purpose
        id: nsw-eng-adv-12-4-1
        points:
          - title: Choosing form and audience
            id: eng-choosing-form-audience
            brief: Deciding first who the writing is for and what it should do, then picking the form that suits it, such as a short story, speech, personal essay or opinion piece.
          - title: Finding a voice
            id: eng-finding-voice
            brief: Voice comes from consistent choices in diction, rhythm and attitude. A distinct voice makes writing memorable and persuades a reader to trust the speaker.
          - title: Crafting images
            id: eng-crafting-images
            brief: A fresh, specific image is stronger than a familiar one. Writers build a central image and return to it so it gathers meaning.
          - title: Structure and pace
            id: eng-structure-pace
            brief: Paragraph length, scene breaks and the order of events control pace. Slowing down at a moment of tension, or skipping time, shapes how a reader feels.
          - title: Writing dialogue
            id: eng-writing-dialogue
            brief: Good dialogue reveals character and moves the story without stating everything. People rarely say exactly what they mean.

      - title: Reflecting and refining
        id: nsw-eng-adv-12-4-2
        points:
          - title: Persuasive writing craft
            id: eng-persuasive-writing-craft
            brief: Persuasive pieces use a clear position, evidence, appeals to reason and feeling, and a voice the reader trusts. Rhetorical questions and repetition work best used sparingly.
          - title: Discursive writing craft
            id: eng-discursive-writing-craft
            brief: A discursive piece follows a line of thought, mixes anecdote and reflection, and can change its mind along the way. Its interest lies in the thinking, not a final verdict.
          - title: Reflection statements
            id: eng-reflection-statements
            brief: A reflection explains the choices made in a piece of writing and why, linking them to a studied text or purpose. It discusses craft, not how hard the work was.
          - title: Revising for impact
            id: eng-revising-impact
            brief: Rereading a draft to cut repetition, sharpen verbs, vary sentence length and check that every part serves the piece's purpose.
