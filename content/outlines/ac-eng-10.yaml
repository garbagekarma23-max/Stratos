# Australian Curriculum English, Year 10: the Language, Literature and Literacy strands, 34 points.
# Follows ACARA's Australian Curriculum: English, Version 9.0, Year 10, checked on the official site
# (australiancurriculum.edu.au) in November 2026. Ministers approved Version 9.0 in April 2022 and ACARA published it in
# May 2022. Each state sets its own start: the ACT from 2024, Tasmania from 2023, the NT and WA (its own Western
# Australian Curriculum, adapted from it) from 2025, Queensland by the end of 2026, and South Australia's public schools
# (their own adapted version) by about 2027. ACARA has announced no new version for Years 7 to 10: the next full
# version is scheduled for approval in 2032.
# Each strand is a unit. Each chapter holds one sub-strand, or two or three small ones together, in the curriculum's
# order. Film techniques (AC9E10LA07) sit with structure and images. The codes are ACARA's content description codes.
# Schools choose their own texts, so no point names a set text or quotes one. Pure practice (giving a talk, writing an
# essay) is taught as the ideas behind it, such as what makes a good thesis statement. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-eng-10
subject: English
bank: eng
name: English, Year 10
about: Australian Curriculum, Year 10
short: English
years: [10]
place: [qld, sa, wa, tas, act, nt]
kind: english
syllabus: "Australian Curriculum: English, Version 9.0, Year 10"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [modality, syntax, thesis statement, ethos, voice, diegetic sound]

units:
  - title: Language
    chapters:
      - title: Language for interacting with others
        id: ac-eng-10-1-1
        points:
          - title: Inclusive and exclusive language
            id: eng-inclusive-exclusive-language
            codes: [AC9E10LA01]
            brief: Inclusive language, such as we and our, draws people in, while jargon, labels and stereotypes can shut people out or make them seem less.
          - title: Language that empowers or disempowers
            id: eng-language-that-empowers-or
            codes: [AC9E10LA01]
            brief: The way a group is named and described can give it a voice and respect, or take them away, so word choice has real social effects.
          - title: Evaluation reveals values
            id: eng-evaluation-reveals-values
            codes: [AC9E10LA02]
            brief: Whenever a writer judges something, openly or through hints, the judgement shows what the writer values.
          - title: Modality
            id: eng-modality
            codes: [AC9E10LA02]
            brief: Modal words such as must, should, might and certainly show how sure or forceful a writer is, from high to low modality.

      - title: Text structure, paragraphs and images
        id: ac-eng-10-1-2
        points:
          - title: Judging how well a structure works
            id: eng-judging-well-structure-works
            codes: [AC9E10LA03]
            brief: Readers evaluate whether a text's structure and language features actually achieve its purpose, such as whether an argument's order builds to a convincing end.
          - title: Varying paragraph structure
            id: eng-varying-paragraph-structure
            codes: [AC9E10LA04]
            brief: Writers vary paragraph length and shape, such as a one-line paragraph for impact, while keeping the links that hold a text together.
          - title: Integrating words and images
            id: eng-integrating-words-images
            codes: [AC9E10LA04]
            brief: In reports, websites and picture books, paragraphs and images are placed together so each explains or extends the other.
          - title: Film techniques and representation
            id: eng-film-techniques-representation
            codes: [AC9E10LA07]
            brief: Lighting, colour, framing and editing shape how a film represents a person or place, such as harsh lighting making a character seem threatening.
          - title: Diegetic and non-diegetic sound
            id: eng-diegetic-non-diegetic-sound
            codes: [AC9E10LA07]
            brief: Diegetic sound comes from the world of the film, such as dialogue, while non-diegetic sound, such as a soundtrack, is added for the audience and shapes mood.

      - title: Language for expressing and developing ideas
        id: ac-eng-10-1-3
        points:
          - title: Sentence structures for effect
            id: eng-sentence-structures-effect
            codes: [AC9E10LA05]
            brief: Writers craft sentences for effect, such as a long build-up that saves the main point for the end, or parallel structures that create balance.
          - title: Syntax and style
            id: eng-syntax-style
            codes: [AC9E10LA06]
            brief: Syntax is the order of words in a sentence, and changing it, such as moving a phrase to the front, shifts emphasis and shapes a writer's style.
          - title: Precise academic vocabulary
            id: eng-precise-academic-vocabulary
            codes: [AC9E10LA08]
            brief: Academic writing uses exact technical words, such as juxtaposition or characterisation, instead of vague words like thing or good.
          - title: Experimenting with punctuation
            id: eng-experimenting-with-punctuation
            codes: [AC9E10LA09]
            brief: Authors sometimes leave out or bend punctuation on purpose, such as dropping speech marks, to create a voice, a rhythm or a feeling.

  - title: Literature
    chapters:
      - title: Literature and contexts, and responding to literature
        id: ac-eng-10-2-1
        points:
          - title: How context shapes representation
            id: eng-context-shapes-representation
            codes: [AC9E10LE01]
            brief: Readers evaluate how the time, place and culture a literary text comes from shape the way it represents individuals, groups and places.
          - title: First Nations Australian voices and context
            id: eng-first-nations-australian-voices
            codes: [AC9E10LE01]
            brief: Works by First Nations Australian authors are read with their context in mind, including histories, connection to Country and the right to tell their own stories.
          - title: Extending interpretations
            id: eng-extending-interpretations
            codes: [AC9E10LE02]
            brief: A text can support more than one interpretation, and a strong reader tests others' readings against the text and builds on them.
          - title: Social, moral and ethical positions
            id: eng-social-moral-ethical-positions
            codes: [AC9E10LE04]
            brief: Literature takes positions on what is right or fair, and readers evaluate those positions rather than simply accepting them.
          - title: Aesthetic qualities and audience response
            id: eng-aesthetic-qualities-audience-response
            codes: [AC9E10LE03]
            brief: The beauty or power of a text's language, structure and images, and where it is read or seen, shape how an audience responds.

      - title: Examining and creating literature
        id: ac-eng-10-2-2
        points:
          - title: Intertextual connections and interpretation
            id: eng-intertextual-connections-interpretation
            codes: [AC9E10LE05]
            brief: Links to other texts, along with structure and devices, open up new readings of a text and change how it is interpreted.
          - title: Evaluating aesthetic qualities
            id: eng-evaluating-aesthetic-qualities
            codes: [AC9E10LE07]
            brief: To evaluate aesthetic qualities, readers explain which features make a text striking or moving and how well they work together.
          - title: Voice as a literary device
            id: eng-voice-as-literary-device
            codes: [AC9E10LE06]
            brief: Voice is the personality that comes through a text's narration or speaker, and it shapes how readers feel about what they read.
          - title: Voice across poetry, novels and film
            id: eng-voice-across-poetry-novels
            codes: [AC9E10LE06]
            brief: Voice works differently in each form, such as through rhythm in poetry, narration in a novel and voice-over in film.
          - title: Sustaining a voice
            id: eng-sustaining-voice
            codes: [AC9E10LE08]
            brief: In their own literary writing, students keep a consistent voice by choosing words, sentence patterns and details that fit the speaker throughout.

  - title: Literacy
    chapters:
      - title: Texts in context and interacting with others
        id: ac-eng-10-3-1
        points:
          - title: Representation in non-fiction and media
            id: eng-representation-non-fiction-media
            codes: [AC9E10LY01]
            brief: Documentaries, news and opinion pieces represent people and events through selection and framing, which reflects their context and purpose.
          - title: Structure and features of spoken texts
            id: eng-structure-features-spoken-texts
            codes: [AC9E10LY02]
            brief: Listeners explain why a speech is structured as it is and how features such as anecdotes, pauses and repetition affect the audience.
          - title: Implicit and explicit values
            id: eng-implicit-explicit-values
            codes: [AC9E10LY03]
            brief: Values and attitudes can be stated outright or hidden in word choice, examples and assumptions, and readers learn to spot both.

      - title: Analytical reading and writing
        id: ac-eng-10-3-2
        points:
          - title: Organising ideas for a purpose
            id: eng-organising-ideas-purpose
            codes: [AC9E10LY04]
            brief: Authors order and link ideas to achieve a purpose, such as answering objections before they are raised, and readers judge how well it works.
          - title: Interpreting abstract ideas
            id: eng-interpreting-abstract-ideas
            codes: [AC9E10LY05]
            brief: Readers combine strategies, such as questioning, connecting and inferring, to make sense of complex and abstract ideas in a text.
          - title: Writing a thesis statement
            id: eng-writing-thesis-statement
            codes: [AC9E10LY06]
            brief: A thesis statement gives an essay's main argument in one or two clear sentences that answer the question and can be argued with evidence.
          - title: Analytical paragraphs
            id: eng-analytical-paragraphs
            codes: [AC9E10LY06]
            brief: An analytical paragraph makes a point, gives evidence, names the technique and explains its effect, then links back to the thesis.
          - title: Comparative analytical writing
            id: eng-comparative-analytical-writing
            codes: [AC9E10LY06]
            brief: A comparative essay discusses two texts together, point by point, showing how each handles the same idea alike or differently.

      - title: Rhetoric and word knowledge
        id: ac-eng-10-3-3
        points:
          - title: Ethos, pathos and logos
            id: eng-ethos-pathos-logos
            codes: [AC9E10LY07]
            brief: Persuaders appeal to credibility (ethos), emotion (pathos) and logic (logos), and strong speeches balance all three.
          - title: Rhetorical devices
            id: eng-rhetorical-devices
            codes: [AC9E10LY07]
            brief: Devices such as anaphora (repeating an opening phrase), the rule of three and antithesis (setting opposites side by side) make speeches persuasive and memorable.
          - title: Spelling patterns from other languages
            id: eng-spelling-patterns-from-other
            codes: [AC9E10LY08]
            brief: English borrows words from other languages and often keeps their spelling patterns, such as the French endings in ballet and unique.
