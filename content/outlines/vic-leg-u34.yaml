# VCE Legal Studies, Units 3 and 4: rights and justice, and the people, the law and reform, 53 points.
# Checked against the VCAA's VCE Legal Studies Study Design, accredited from 2024, in October 2026. Each unit is a
# unit here, and each area of study is a chapter, or two when it is large. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Courts, bodies and laws here are Victorian or Commonwealth. A NSW point the matcher finds needs adapting for
# Victoria's courts and laws. Points on the 1967 and 2023 referendums always go to the review page.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-leg-u34
subject: Legal Studies
bank: leg
name: Legal Studies, Units 3 and 4
about: VCE, Rights, justice and law reform
short: Legal Studies
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Legal Studies Study Design (from 2024), Units 3 and 4
note: Follows the VCE Legal Studies study design. Not made or endorsed by the VCAA.
chips: [plea negotiation, committal, VCAT, separation of powers, Victorian Law Reform Commission]

units:
  - title: "Unit 3: Rights and justice"
    chapters:
      - title: Principles and rights in criminal cases
        id: vic-leg-u34-1-1
        points:
          - title: Summary and indictable offences in Unit 3
            id: leg-summary-indictable-offences-unit
            brief: Summary offences are minor and heard in the Magistrates' Court. Indictable offences are serious and may go to trial before a jury.
          - title: Principles of criminal justice
            id: leg-principles-criminal-justice
            brief: The accused is presumed innocent, and the prosecution bears the burden of proving guilt beyond reasonable doubt.
          - title: Fairness in the justice system
            id: leg-fairness-justice-system
            brief: Fairness means fair processes, such as an independent decision-maker, a chance to know the case and a fair hearing.
          - title: Equality in the justice system
            id: leg-equality-justice-system
            brief: Equality means people are treated the same, and where that would disadvantage someone, measures are taken to correct it.
          - title: Access in the justice system
            id: leg-access-justice-system
            brief: Access means people can learn about their rights and use the justice system to protect them.
          - title: Rights of the accused
            id: leg-rights-accused
            brief: The right to be presumed innocent, to silence, to a trial without unreasonable delay and to a trial by jury for indictable offences.
          - title: Rights of victims
            id: leg-rights-victims
            brief: Victims can give evidence in other ways, such as by video link, be told about the proceedings, and be told when the offender is likely to be released.

      - title: Help in a criminal case
        id: vic-leg-u34-1-2
        points:
          - title: Victoria Legal Aid
            id: leg-victoria-legal-aid
            brief: VLA gives free information, advice and, for those who qualify, lawyers for accused people, and helps victims of crime.
          - title: Community legal centres
            id: leg-community-legal-centres
            brief: Independent services that give free legal help to accused people and victims, often to those who cannot get Legal Aid.
          - title: Plea negotiations
            id: leg-plea-negotiations
            brief: Talks where the accused agrees to plead guilty, often to fewer or lesser charges, saving time and cost but raising concerns about fairness.
          - title: Legal practitioners
            id: leg-legal-practitioners
            brief: Lawyers know the law and procedure, prepare and present the case, and help an accused or a victim understand their options.

      - title: Criminal trials
        id: vic-leg-u34-1-3-2
        points:
          - title: Why have a court hierarchy
            id: leg-have-court-hierarchy
            brief: A hierarchy lets courts specialise in cases of different seriousness and lets a party appeal to a higher court.
          - title: Judges and magistrates in criminal cases
            id: leg-judges-magistrates-criminal-cases
            brief: They manage the hearing, decide questions of law, direct the jury and pass sentence. The parties present their cases.
          - title: Juries in criminal trials
            id: leg-juries-criminal-trials
            brief: Twelve people from the community decide on the facts whether the accused is guilty, and their verdict must usually be unanimous.
          - title: Factors affecting justice in criminal cases
            id: leg-factors-affecting-justice-criminal
            brief: Costs, time and cultural differences can stop the criminal system achieving fairness, equality and access.

      - title: Sentencing
        id: vic-leg-u34-1-4
        points:
          - title: Purposes of sanctions
            id: leg-purposes-sanctions-unit-3
            brief: Sanctions aim to rehabilitate, punish, deter the offender and others, denounce the crime and protect the community.
          - title: Sanctions and their purposes
            id: leg-sanctions-their-purposes
            brief: Fines, community correction orders and imprisonment each serve some purposes better than others.
          - title: Factors in sentencing in Unit 3
            id: leg-factors-sentencing-unit-3
            brief: Judges weigh aggravating factors, mitigating factors, a guilty plea and victim impact statements when they sentence.

      - title: Starting a civil claim
        id: vic-leg-u34-1-3
        points:
          - title: Principles of civil justice
            id: leg-principles-civil-justice
            brief: The plaintiff bears the burden of proof and must prove the claim on the balance of probabilities.
          - title: Before starting a civil claim
            id: leg-before-starting-civil-claim
            brief: A plaintiff weighs costs, whether the time limit has passed, and whether a win could be enforced against the defendant.
          - title: Mediation, conciliation and arbitration
            id: leg-mediation-conciliation-arbitration
            brief: In mediation a neutral person helps parties agree, in conciliation they also suggest options, and in arbitration they make a binding decision.
          - title: Consumer Affairs Victoria
            id: leg-consumer-affairs-victoria
            brief: A government body that gives information and helps settle consumer and tenancy disputes for free.
          - title: The Victorian Civil and Administrative Tribunal
            id: leg-victorian-civil-administrative-tribunal
            brief: VCAT settles many civil disputes, such as consumer and tenancy claims, more cheaply and quickly than a court.

      - title: Civil disputes in court
        id: vic-leg-u34-1-6
        points:
          - title: Courts in civil disputes
            id: leg-courts-civil-disputes-2
            brief: A hierarchy of courts spreads civil cases by size and complexity for administrative convenience, and allows appeals.
          - title: Judges, juries and lawyers in civil cases
            id: leg-judges-juries-lawyers-civil
            brief: Judges manage the case, including case management to narrow issues, and decide law. A jury of six may decide facts. Lawyers present each side.
          - title: Class actions
            id: leg-class-actions
            brief: One claim brought for a group with similar claims, which shares costs and gives access to people who could not sue alone.
          - title: Remedies in civil cases
            id: leg-remedies-civil-cases
            brief: Damages compensate for loss, and injunctions order a party to stop or to do something.
          - title: Factors affecting justice in civil cases
            id: leg-factors-affecting-justice-civil
            brief: Costs and time affect whether the civil system can deliver fairness, equality and access.

  - title: "Unit 4: The people, the law and reform"
    chapters:
      - title: Parliament and the Constitution
        id: vic-leg-u34-2-1
        points:
          - title: The Commonwealth Constitution
            id: leg-commonwealth-constitution
            brief: The Constitution sets out how federal parliament is made up, what it may make laws on, and how it shares power with the states.
          - title: The Crown and the Houses of Parliament
            id: leg-roles-parliament-courts
            brief: A bill becomes law only when both houses pass it and the Crown's representative, the Governor or Governor-General, gives royal assent.
          - title: The division of law-making powers
            id: leg-division-law-making-powers
            brief: Powers are exclusive (Commonwealth only), concurrent (shared) or residual (left to the states). Commonwealth law wins where the two clash.
          - title: Section 109
            id: leg-section-109
            brief: Where a state law and a Commonwealth law conflict, section 109 of the Constitution makes the Commonwealth law win and the state law invalid to that extent.
          - title: A High Court case on law-making powers
            id: leg-high-court-case-law
            brief: High Court decisions on what the Constitution allows, such as on Commonwealth tax powers, have shifted power between the states and the Commonwealth.
          - title: The bicameral structure of parliament
            id: leg-bicameral-structure-parliament
            brief: Two houses must pass a bill. A hostile upper house can block or slow laws, and a friendly one may pass them with little review.
          - title: Other pressures on parliament
            id: leg-other-pressures-parliament
            brief: International treaties and pressure, and the need to reflect the views of voters, shape what laws parliament can and will make.

      - title: The Constitution as a check on parliament
        id: vic-leg-u34-2-2-2
        points:
          - title: The High Court and the Constitution
            id: leg-high-court-constitution
            brief: The High Court interprets the Constitution and protects representative government, striking down laws made outside parliament's power.
          - title: Separation of powers
            id: leg-separation-powers-2
            brief: Legislative, executive and judicial powers are held by different bodies, so no one body has too much power.
          - title: Express rights in the Constitution
            id: leg-express-rights-constitution
            brief: The Constitution protects a few rights expressly, such as the right to trial by jury for Commonwealth indictable offences.

      - title: Courts and law-making
        id: vic-leg-u34-2-3
        points:
          - title: Courts and statutory interpretation
            id: leg-courts-statutory-interpretation
            brief: Judges interpret unclear words in an Act when applying it, which can widen or narrow its meaning and becomes precedent.
          - title: The doctrine of precedent
            id: leg-doctrine-precedent
            brief: Lower courts follow binding precedent from higher courts in the same hierarchy. Other decisions are persuasive, and precedents can be reversed, overruled, distinguished or disapproved.
          - title: Factors affecting courts as law-makers
            id: leg-strengths-weaknesses-courts-as
            brief: Precedent, judicial conservatism or activism, the cost and time of cases, and the need for standing limit when and how courts make law.
          - title: Courts and parliament
            id: leg-courts-parliament
            brief: Parliament is supreme and can codify or abrogate common law. Courts can still influence parliament through their decisions and comments.

      - title: Law reform
        id: vic-leg-u34-2-2
        points:
          - title: Why laws change
            id: leg-laws-change
            brief: Laws change when society's values shift, new technology arises, or a law no longer works.
          - title: Petitions and demonstrations
            id: leg-petitions-demonstrations
            brief: Petitions show numbers supporting change, and demonstrations draw public and media attention to an issue.
          - title: Courts and law reform
            id: leg-courts-law-reform
            brief: Cases can expose problems in the law and push parliament to act, as well as change common law directly.
          - title: The media and law reform
            id: leg-media-law-reform
            brief: Traditional and social media can raise awareness and put pressure on parliament to change the law.
          - title: The Victorian Law Reform Commission
            id: leg-victorian-law-reform-commission
            brief: An independent body that researches law reform referred by government and makes recommendations. A recent inquiry shows how much it can achieve.
          - title: Royal commissions
            id: leg-royal-commissions
            brief: Inquiries with strong powers to investigate a matter and recommend changes, such as on institutional abuse or aged care.
          - title: Parliamentary committees
            id: leg-parliamentary-committees
            brief: Groups of members of parliament that investigate issues and recommend law reform.

      - title: Constitutional reform
        id: vic-leg-u34-2-5
        points:
          - title: Why change the Constitution
            id: leg-change-constitution
            brief: The Constitution was written in the 1890s, so changes may be sought to reflect new values, rights or ways of governing.
          - title: Changing the Constitution
            id: leg-changing-constitution
            brief: "A change must pass both Commonwealth houses, then win a double majority in a referendum: a national majority and a majority in most states."
          - title: What makes a referendum succeed
            id: leg-makes-referendum-succeed
            brief: Bipartisan support, public understanding and a clear, simple question make a referendum more likely to pass. Few have.
          - title: The 1967 and 2023 referendums
            id: leg-1967-2023-referendums
            brief: The 1967 referendum passed, counting First Nations people in the census and letting the Commonwealth make laws for them. The 2023 Voice referendum did not pass.
