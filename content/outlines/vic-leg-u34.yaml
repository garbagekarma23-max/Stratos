# VCE Legal Studies, Units 3 and 4: rights and justice, and the people, the law and reform, 43 points.
# Drafted from the VCAA's VCE Legal Studies Study Design, accredited from 2024. The structure follows the study design:
# each unit is a unit here, and each area of study is a chapter, or two when it is large. Every brief is in our own
# words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Courts, bodies and laws here are Victorian or Commonwealth. A NSW point the matcher finds needs adapting for
# Victoria's courts and laws. Points on the Koori Court and Aboriginal legal services always go to the review page.

id: vic-leg-u34
subject: Legal Studies
bank: leg
name: Legal Studies, Units 3 and 4
about: VCE, Rights, justice and law reform
short: Legal Studies
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Legal Studies Study Design (from 2024), Units 3 and 4
note: Follows the VCE Legal Studies study design. Not made or endorsed by the VCAA.
chips: [plea negotiation, committal, VCAT, separation of powers, Victorian Law Reform Commission]

units:
  - title: "Unit 3: Rights and justice"
    chapters:
      - title: Fundamentals of justice
        id: vic-leg-u34-1-1
        points:
          - title: Fairness in the justice system
            id: leg-fairness-justice-system
            brief: Fairness means fair processes, such as an independent decision-maker, a chance to know the case and a fair hearing.
          - title: Equality in the justice system
            id: leg-equality-justice-system
            brief: Equality means people are treated the same, and where that would disadvantage someone, measures are taken to correct it.
          - title: Access in the justice system
            id: leg-access-justice-system
            brief: Access means people can learn about their rights and use the justice system to protect them.
          - title: Victoria Legal Aid
            id: leg-victoria-legal-aid
            brief: VLA gives free information, advice and, for those who qualify, lawyers in criminal and some civil cases.
          - title: Community legal centres
            id: leg-community-legal-centres
            brief: Independent services that give free legal help, often to people who cannot get Legal Aid.
          - title: Aboriginal legal services
            id: leg-aboriginal-legal-services
            brief: Services such as the Victorian Aboriginal Legal Service give culturally safe legal help to Aboriginal and Torres Strait Islander people.

      - title: The criminal justice system
        id: vic-leg-u34-1-2
        points:
          - title: Rights of the accused
            id: leg-rights-accused
            brief: The right to be presumed innocent, to silence, to a trial without unreasonable delay and to a trial by jury for indictable offences.
          - title: Rights of victims
            id: leg-rights-victims
            brief: Victims have rights to be told about the case, to give a victim impact statement and to be protected from contact with the accused.
          - title: Plea negotiations
            id: leg-plea-negotiations
            brief: Talks where the accused agrees to plead guilty, often to fewer or lesser charges, saving time and cost but raising concerns about fairness.
          - title: Committal proceedings
            id: leg-committal-proceedings
            brief: Steps in the Magistrates' Court before an indictable offence goes to a higher court, testing whether there is enough evidence.
          - title: Why have a court hierarchy
            id: leg-have-court-hierarchy
            brief: A hierarchy lets courts specialise, allows appeals to higher courts and lets precedent be set from the top.
          - title: Judges and magistrates in criminal cases
            id: leg-judges-magistrates-criminal-cases
            brief: They manage the trial, decide questions of law, explain the law to the jury and pass sentence.
          - title: Juries in criminal trials
            id: leg-juries-criminal-trials
            brief: Twelve people from the community decide on the facts whether the accused is guilty, and their verdict must usually be unanimous.
          - title: Legal practitioners
            id: leg-legal-practitioners
            brief: Lawyers prepare and present each side's case, and help people understand the law and their options.
          - title: Factors affecting justice in criminal cases
            id: leg-factors-affecting-justice-criminal
            brief: Cost, time and cultural factors can stop people achieving fairness, equality and access in the criminal system.
          - title: Purposes of sanctions in Unit 3
            id: leg-purposes-sanctions-unit-3
            brief: A sanction can punish, deter, denounce, protect the community and rehabilitate, and one sanction may aim at several.
          - title: Sanctions and their purposes
            id: leg-sanctions-their-purposes
            brief: Fines, community correction orders and imprisonment each serve some purposes better than others.

      - title: The civil justice system
        id: vic-leg-u34-1-3
        points:
          - title: Before starting a civil claim
            id: leg-before-starting-civil-claim
            brief: A plaintiff weighs cost, time, the chance of winning, whether the defendant can pay, and other ways of settling.
          - title: Mediation, conciliation and arbitration
            id: leg-mediation-conciliation-arbitration
            brief: In mediation a neutral person helps parties agree, in conciliation they also suggest options, and in arbitration they make a binding decision.
          - title: Consumer Affairs Victoria
            id: leg-consumer-affairs-victoria
            brief: A government body that gives information and helps settle consumer and tenancy disputes for free.
          - title: The Victorian Civil and Administrative Tribunal
            id: leg-victorian-civil-administrative-tribunal
            brief: VCAT settles many civil disputes, such as consumer and tenancy claims, more cheaply and quickly than a court.
          - title: Courts in civil disputes
            id: leg-courts-civil-disputes
            brief: Courts hear complex or high-value civil claims and appeals, and can enforce their decisions.
          - title: Judges, juries and lawyers in civil cases
            id: leg-judges-juries-lawyers-civil
            brief: Judges manage the case and decide law, a civil jury of six may decide facts and damages, and lawyers present each side.
          - title: Class actions
            id: leg-class-actions
            brief: One claim brought for a group with similar claims, which shares costs and gives access to people who could not sue alone.
          - title: Remedies in civil cases
            id: leg-remedies-civil-cases
            brief: Damages compensate for loss, and injunctions order a party to stop or to do something.
          - title: Factors affecting justice in civil cases
            id: leg-factors-affecting-justice-civil
            brief: Cost, time and cultural factors affect whether civil justice is fair, equal and accessible.

  - title: "Unit 4: The people, the law and reform"
    chapters:
      - title: The people and the law-makers
        id: vic-leg-u34-2-1
        points:
          - title: The roles of parliament and the courts
            id: leg-roles-parliament-courts
            brief: Parliament makes laws for the community. Courts settle disputes and in doing so make law and interpret statutes.
          - title: The Commonwealth Constitution
            id: leg-commonwealth-constitution
            brief: The Constitution sets out how federal parliament is made up, what it may make laws on, and how it shares power with the states.
          - title: The division of law-making powers
            id: leg-division-law-making-powers
            brief: Powers are exclusive (Commonwealth only), concurrent (shared) or residual (left to the states). Commonwealth law wins where the two clash.
          - title: The bicameral structure of parliament
            id: leg-bicameral-structure-parliament
            brief: Two houses must pass a bill, so the upper house can review laws made by the lower house.
          - title: Separation of powers
            id: leg-separation-powers-2
            brief: Legislative, executive and judicial powers are held by different bodies, so no one body has too much power.
          - title: The High Court and the Constitution
            id: leg-high-court-constitution
            brief: The High Court interprets the Constitution and can strike down laws made outside parliament's power.
          - title: Express rights in the Constitution
            id: leg-express-rights-constitution
            brief: The Constitution protects a few rights expressly, such as the right to trial by jury for Commonwealth indictable offences.
          - title: Changing the Constitution
            id: leg-changing-constitution
            brief: The Constitution can only be changed by a referendum passing with a national majority and a majority in most states.
          - title: Courts and statutory interpretation
            id: leg-courts-statutory-interpretation
            brief: Judges interpret the meaning of words in an Act when applying it, and their reading becomes precedent.
          - title: Strengths and weaknesses of courts as law-makers
            id: leg-strengths-weaknesses-courts-as
            brief: Courts can make law quickly in a real case and independent of politics, but only when a case arises and they cannot change the law broadly.

      - title: The people and reform
        id: vic-leg-u34-2-2
        points:
          - title: Why laws change
            id: leg-laws-change
            brief: Laws change when society's values shift, new technology arises, or a law no longer works.
          - title: Petitions and demonstrations
            id: leg-petitions-demonstrations
            brief: Petitions show numbers supporting change, and demonstrations draw public and media attention to an issue.
          - title: The media and law reform
            id: leg-media-law-reform
            brief: Traditional and social media can raise awareness and put pressure on parliament to change the law.
          - title: Courts and law reform
            id: leg-courts-law-reform
            brief: Cases can expose problems in the law and push parliament to act, as well as change common law directly.
          - title: The Victorian Law Reform Commission
            id: leg-victorian-law-reform-commission
            brief: An independent body that researches law reform referred by government or community and makes recommendations.
          - title: Royal commissions
            id: leg-royal-commissions
            brief: Inquiries with strong powers to investigate a matter and recommend changes, such as on institutional abuse or aged care.
          - title: Parliamentary committees
            id: leg-parliamentary-committees
            brief: Groups of members of parliament that investigate issues and recommend law reform.
