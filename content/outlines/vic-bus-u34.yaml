# VCE Business Management, Units 3 and 4: managing and transforming a business, 49 points.
# Checked against the VCAA's VCE Business Management Study Design, accredited from 2023, in October 2026. Each unit is
# a unit here, and each area of study is a chapter, or two when it is large. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Many of these ideas are in NSW Business Studies (the bus bank), so the matcher should find reuses and adapts. The
# theories named are the ones the study design sets, so a reused point must name the same theorist.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-bus-u34
subject: Business Management
bank: bus
name: Business Management, Units 3 and 4
about: VCE, Managing and transforming a business
short: Business Management
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Business Management Study Design (from 2023), Units 3 and 4
note: Follows the VCE Business Management study design. Not made or endorsed by the VCAA.
chips: [stakeholders, management styles, goal-setting theory, lean management, force field analysis]

units:
  - title: "Unit 3: Managing a business"
    chapters:
      - title: Businesses and stakeholders
        id: vic-bus-u34-1-1
        points:
          - title: Types of business
            id: bus-types-business
            brief: Sole traders, partnerships, private and public listed companies, social enterprises and government business enterprises differ in owners, liability and aims.
          - title: Social enterprises
            id: bus-social-enterprises
            brief: A social enterprise trades to meet a social or environmental purpose, and puts most of its profit back into that purpose.
          - title: Government business enterprises
            id: bus-government-business-enterprises
            brief: A business owned by government that sells goods or services and aims to make a profit while serving the public, such as Australia Post.
          - title: Business objectives
            id: bus-business-objectives-unit-3
            brief: Objectives such as making a profit, increasing market share, improving efficiency, improving effectiveness, meeting a social need and meeting shareholder expectations.
          - title: Stakeholders and their interests
            id: bus-stakeholders-their-interests
            brief: Owners, managers, employees, customers, suppliers, the general community and others each want different things from a business, which can clash.

      - title: Managing people
        id: vic-bus-u34-1-2-2
        points:
          - title: Management styles
            id: bus-management-styles
            brief: Styles run from autocratic, through persuasive, consultative and participative, to laissez-faire, giving staff more say at each step.
          - title: Choosing a management style
            id: bus-choosing-management-style
            brief: The right style depends on the task, the time available, staff experience and the manager's preference.
          - title: Management skills
            id: bus-management-skills-2
            brief: Communicating, delegating, planning, leading, decision-making and interpersonal skills. Each style leans on some skills more than others.
          - title: Corporate culture
            id: bus-corporate-culture-unit-3
            brief: Official culture is the values a business states. Real culture is how staff actually behave. Managers can shape it through rewards, symbols and their own example.

      - title: Motivating employees
        id: vic-bus-u34-1-2
        points:
          - title: Maslow's hierarchy of needs
            id: bus-maslow-s-hierarchy-needs
            brief: Maslow said people move up five levels of needs, physiological, safety, social, esteem and self-actualisation, once the level below is met.
          - title: Locke and Latham's goal-setting theory
            id: bus-locke-latham-s-goal
            brief: Goals motivate when they have clarity, challenge, commitment, feedback and suitable task complexity.
          - title: Lawrence and Nohria's four drive theory
            id: bus-lawrence-nohria-s-four
            brief: People are driven to acquire, to bond, to learn and to defend. A workplace that meets all four motivates staff best.
          - title: Performance-related pay
            id: bus-performance-related-pay
            brief: Paying bonuses, commissions or profit shares for results can lift effort, but may push staff to compete instead of cooperating.
          - title: Career advancement and training as motivation
            id: bus-career-advancement-training-as
            brief: The chance to be promoted, and investment in training, show staff a future in the business and build their skills.
          - title: Support and sanction strategies
            id: bus-support-sanction-strategies
            brief: Support strategies, such as counselling and flexible work, help staff through problems. Sanctions, such as warnings, use the threat of losing something.

      - title: Managing employees
        id: vic-bus-u34-1-3
        points:
          - title: Training options
            id: bus-training-options
            brief: On-the-job training happens while working, such as shadowing a colleague. Off-the-job training happens elsewhere, such as a course. Each has pros and cons.
          - title: Performance management
            id: bus-performance-management-2
            brief: Setting goals and measuring staff against them, through management by objectives, appraisals, self-evaluation and observation.
          - title: Termination management
            id: bus-termination-management
            brief: Employees leave by retirement, redundancy, resignation or dismissal. Each brings duties for the business, such as notice and entitlements.
          - title: Entitlements and transition
            id: bus-entitlements-transition
            brief: Departing staff are owed unpaid wages, leave and sometimes redundancy pay. Transition help, such as outplacement, eases the move.
          - title: Roles in workplace relations
            id: bus-roles-workplace-relations
            brief: Employees, human resource managers, unions, employer associations and the Fair Work Commission all play a part in setting pay and conditions.
          - title: Awards and agreements
            id: bus-awards-agreements
            brief: An award sets minimum pay and conditions for an industry. An enterprise agreement is negotiated in one workplace and must leave staff better off overall.
          - title: Resolving workplace disputes
            id: bus-resolving-workplace-disputes
            brief: Disputes are settled first through grievance procedures inside the business, then if needed through mediation or arbitration.

      - title: Operations systems
        id: vic-bus-u34-1-4
        points:
          - title: Operations in manufacturing and services
            id: bus-operations-manufacturing-services
            brief: Manufacturing makes tangible goods that can be stored. Services are intangible and often made and used at once, with the customer present.
          - title: Inputs, processes and outputs
            id: bus-inputs-processes-outputs
            brief: Operations turns inputs such as materials, labour and money into outputs, through processes that add value.
          - title: Efficiency and effectiveness
            id: bus-efficiency-effectiveness
            brief: Efficiency is making the most output from the fewest inputs. Effectiveness is how well a business meets its objectives.
          - title: Technology in operations
            id: bus-technology-operations-2
            brief: Automated production lines, robotics, computer-aided design, artificial intelligence and online services can cut costs and errors.
          - title: Materials management
            id: bus-materials-management
            brief: Forecasting demand, the master production schedule, materials requirement planning and just-in-time all keep the right materials on hand without waste.

      - title: Improving operations
        id: vic-bus-u34-1-6
        points:
          - title: Quality strategies
            id: bus-quality-strategies
            brief: Quality control inspects output for faults, quality assurance checks the process against a standard, and total quality management involves everyone in improving.
          - title: Waste minimisation
            id: bus-waste-minimisation
            brief: Reducing, reusing and recycling materials in production cuts costs and harm to the environment.
          - title: Lean management
            id: bus-waste-minimisation-lean-management
            brief: Lean management cuts any step that adds no value, using pull production, one-piece flow, takt time and zero defects.
          - title: Corporate social responsibility in operations
            id: bus-corporate-social-responsibility-operations
            brief: Using sustainable materials, cutting emissions and treating suppliers fairly go beyond what the law asks.
          - title: Global considerations in operations
            id: bus-global-considerations-operations
            brief: Global sourcing of inputs and making goods overseas can lower costs but bring risks to quality, reputation and supply.

  - title: "Unit 4: Transforming a business"
    chapters:
      - title: Reviewing performance and the need for change
        id: vic-bus-u34-2-1
        points:
          - title: Forms of business change
            id: bus-forms-business-change
            brief: Business change is any shift in how a business works. It can be proactive, made before problems arise, or reactive, made in response to them.
          - title: Performance indicators (KPIs)
            id: bus-performance-indicators-kpis
            brief: Measures of how a business is going, such as net profit, market share, productivity growth, sales, staff absenteeism and turnover, wastage, complaints and workplace accidents.
          - title: Lewin's force field analysis
            id: bus-lewin-s-force-field
            brief: Lewin said change happens when the forces for it outweigh those against it. Managers weigh and rank the forces, act, then check the result.
          - title: Driving forces for change
            id: bus-driving-forces-change
            brief: Owners, managers, employees, competitors, laws, profit, cutting costs, globalisation, technology, innovation and social attitudes can push a business to change.
          - title: Restraining forces against change
            id: bus-restraining-forces-against-change
            brief: Managers and employees who resist, lack of time, organisational inertia, laws and cost can hold change back.
          - title: Porter's generic strategies
            id: bus-porter-s-generic-strategies
            brief: Porter said a business gains an edge by lower cost (cost leadership) or by being different in a way customers value (differentiation).

      - title: Leading change
        id: vic-bus-u34-2-2
        points:
          - title: The importance of leadership in change
            id: bus-importance-leadership-change
            brief: Leaders set the direction of change, explain why it is needed and keep staff on board through it.
          - title: Management strategies to improve performance
            id: bus-management-strategies-improve-performance
            brief: Staff training, staff motivation, a change of management style, redeploying resources, innovation, new technology, cost cutting and lean production.
          - title: Redeployment of resources
            id: bus-redeployment-resources
            brief: Moving natural, labour and capital resources to where they add more value, such as shifting staff to growing parts of the business.
          - title: Developing corporate culture
            id: bus-developing-corporate-culture
            brief: Managers can build a culture that welcomes change through shared values, rewards, stories and their own example.
          - title: Senge's learning organisation
            id: bus-senge-s-learning-organisation
            brief: Senge described a business that learns and adapts, through systems thinking, personal mastery, mental models, building a shared vision and team learning.

      - title: Making change last
        id: vic-bus-u34-2-3
        points:
          - title: Overcoming resistance with low-risk strategies
            id: bus-overcoming-resistance-with-low
            brief: Communication, empowerment, support and incentives help staff accept change and keep trust.
          - title: High-risk strategies against resistance
            id: bus-high-risk-strategies-against
            brief: Manipulation and threat may force change quickly, but can damage trust, morale and the business's reputation.
          - title: Lewin's three-step change model
            id: bus-lewin-s-three-step
            brief: Unfreeze old ways, make the change, then refreeze so the new ways stick.
          - title: Effects of change on stakeholders
            id: bus-effects-change-stakeholders
            brief: Change affects managers, employees, customers, suppliers and the community in different ways, some good and some bad.
          - title: Corporate social responsibility in change
            id: bus-corporate-social-responsibility-change
            brief: Change should be carried out ethically, considering staff, the community and the environment, not only profit.
          - title: Reviewing performance indicators after change
            id: bus-reviewing-performance-indicators-after
            brief: After change, managers check the same indicators again to see whether the strategy worked.
