# Victorian Curriculum Geography, Levels 9 and 10: biomes and food, interconnection, environmental change and human
# wellbeing, 70 points.
# Follows the Victorian Curriculum F-10 Version 2.0, Geography, Levels 9 and 10 (VCAA), checked on the VCAA's F-10
# website in November 2026. Version 2.0 was published in June 2024 and replaces Version 1.0 (2016). Schools could use it
# from 2025, and Victorian government schools must teach it from 2026 (Catholic and independent schools set their own
# timing). The Version 1.0 website closes on 31 December 2026. No newer version is announced.
# VC2.0 sets Geography in bands of two levels, so this file covers Levels 9 and 10 together.
# Structure: each sub-strand of Geographical Knowledge and Understanding is a unit (Biomes and food security,
# Geographies of interconnection, Environmental change and management, Geographies of human wellbeing), with its
# content descriptions grouped into chapters. The Geographical Skills strand is the last unit, kept to the ideas behind
# the skills (reliable sources, reading relationships, forecasts and judging strategies). Fieldwork is left to class.
# Options picked where schools choose: the selected environmental issue is inland water (the Murray-Darling Basin) and
# the marine environment (the Great Barrier Reef); land, coasts, urban environments and forests can be added. The Asian
# country for differences in wellbeing is India.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-geo-910
subject: Geography
bank: geo
name: Geography, Levels 9 and 10
about: Victorian Curriculum 2.0, Levels 9 and 10
short: Geography
years: [9, 10]
level: Levels 9 and 10
place: vic
kind: standard
syllabus: "Victorian Curriculum F-10 Version 2.0: Geography, Levels 9 and 10"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [biomes, food security, embodied carbon, Murray-Darling Basin, Human Development Index]

units:
  - title: Biomes and food security
    chapters:
      - title: Biomes
        id: vic-geo-910-1-1
        points:
          - title: What a biome is
            id: geo-biome-vic
            brief: A biome is a very large region with a similar climate, plants and animals, such as tropical rainforest, desert, grassland, temperate forest or tundra.
            codes: [VC2HG10K01]
          - title: Where the world's biomes are
            id: geo-where-world-s-biomes
            brief: Biomes follow patterns of temperature and rainfall, so they form bands by latitude, with rainforests near the equator, deserts around 30 degrees and tundra near the poles.
            codes: [VC2HG10K01]
          - title: Biomass productivity
            id: geo-biomass-productivity
            brief: Biomass productivity is how much plant matter a biome grows in a year. Warm, wet biomes such as rainforests and wetlands are highest, while deserts and tundra are lowest.
            codes: [VC2HG10K01]
          - title: Australia's biomes
            id: geo-australia-s-biomes
            brief: Australia's biomes range from tropical rainforest and savanna in the north, to desert and shrubland inland, to temperate forest and grassland in the south-east and south-west.
            codes: [VC2HG10K01]
          - title: Biomes and food production
            id: geo-biomes-food-production
            brief: Grasslands and temperate forests with fertile soils and reliable rain grow most of the world's grain, so many of these biomes have been cleared and changed into farmland.
            codes: [VC2HG10K01]

      - title: Producing food
        id: vic-geo-910-1-2
        points:
          - title: Environmental factors in growing crops
            id: geo-environmental-factors-growing-crops
            brief: Climate, rainfall, soil quality, water for irrigation and the slope of the land decide which crops can grow in a place and how well.
            codes: [VC2HG10K02]
          - title: Economic factors in growing crops
            id: geo-economic-factors-growing-crops
            brief: Prices, costs of labour and inputs, access to markets and transport, trade rules and government support decide which crops farmers choose to grow.
            codes: [VC2HG10K02]
          - title: Technology and crop yields
            id: geo-technology-crop-yields
            brief: Irrigation, machinery, fertilisers, new seed varieties and precision farming with GPS and sensors raise how much food each hectare produces.
            codes: [VC2HG10K02]
          - title: The Green Revolution
            id: geo-green-revolution
            brief: From the 1960s, high-yield seeds, fertilisers and irrigation greatly raised grain harvests in Asia and Latin America, but brought costs such as water overuse and soil damage.
            codes: [VC2HG10K02]
          - title: Farming in Australia
            id: geo-farming-australia
            brief: Australia grows wheat in a belt inland of the coast, uses irrigation in the Murray-Darling Basin, runs cattle across the north, and exports much of what it produces.
            codes: [VC2HG10K02, VC2HG10K03]

      - title: Sustainable farming
        id: vic-geo-910-1-3
        points:
          - title: Land degradation from farming
            id: geo-land-degradation-from-farming
            brief: Clearing, overgrazing and poor practices can cause soil erosion, salinity (salt rising to the surface) and soil acidity, which lower what the land can grow.
            codes: [VC2HG10K03]
          - title: Farming and water use
            id: geo-farming-water-use
            brief: Irrigated farming uses most of Australia's water taken from rivers, which can leave too little for wetlands and wildlife in dry years.
            codes: [VC2HG10K03]
          - title: Economic and social sustainability of farming
            id: geo-economic-social-sustainability-farming
            brief: Farming lasts only if farms stay profitable through droughts and price swings, and if rural towns keep their people, services and young workers.
            codes: [VC2HG10K03]
          - title: Sustainable farming practices
            id: geo-sustainable-farming-practices-vic
            brief: No-till farming, crop rotation, planting trees, rotational grazing and careful water use protect soil and water so land stays productive.
            codes: [VC2HG10K03]

      - title: Feeding the future
        id: vic-geo-910-1-4
        points:
          - title: Food security
            id: geo-food-security-vic
            brief: Food security means everyone has reliable access to enough safe and nutritious food. It depends on food being available, affordable, used well and steady over time.
            codes: [VC2HG10K04]
          - title: Population growth and food demand
            id: geo-population-growth-food-demand
            brief: The world's population is projected to approach 10 billion by 2050, and rising incomes mean more meat is eaten, so much more food will be needed.
            codes: [VC2HG10K04]
          - title: Limits on producing more food
            id: geo-limits-producing-more-food
            brief: Little good farmland is left to clear, water is scarce, land is degrading, and cities and biofuel crops compete for land, which all limit how much more food can be grown.
            codes: [VC2HG10K04]
          - title: Climate change and food production
            id: geo-climate-change-food-production
            brief: Rising temperatures, changing rainfall, more droughts and floods, and rising seas threaten harvests, especially in already hot or dry regions.
            codes: [VC2HG10K04]
          - title: Improving food security
            id: geo-improving-food-security-vic
            brief: Cutting food waste, raising yields sustainably, fair trade rules, ending conflict and helping poorer farmers can feed more people without harming the environment.
            codes: [VC2HG10K04]

  - title: Geographies of interconnection
    chapters:
      - title: Transport and digital connections
        id: vic-geo-910-2-1
        points:
          - title: How transport connects places
            id: geo-transport-connects-places
            brief: Faster, cheaper transport by air, road, rail and sea lets people travel and goods move further, linking places to jobs, markets and services far away.
            codes: [VC2HG10K05]
          - title: Shrinking distances
            id: geo-shrinking-distances
            brief: As travel and communication speed up, the time it takes to reach other places falls, so the world feels smaller. Geographers call this time-space compression.
            codes: [VC2HG10K05]
          - title: Digital technology and access to services
            id: geo-digital-technology-access-services
            brief: The internet lets people shop, bank, study, see a doctor and work from far away, which changes how they use local shops and services.
            codes: [VC2HG10K05]
          - title: The digital divide
            id: geo-digital-divide-vic
            brief: The gap between people with fast, affordable internet and those without, often between cities and remote areas, or richer and poorer people and countries.
            codes: [VC2HG10K05]

      - title: Trade and its impacts
        id: vic-geo-910-2-2
        points:
          - title: Global trade in manufactured goods
            id: geo-global-trade-manufactured-goods
            brief: Many goods are now made through supply chains across several countries, with parts and assembly often in Asia because of lower costs and large workforces.
            codes: [VC2HG10K06]
          - title: Impacts of manufacturing on places in Asia
            id: geo-impacts-manufacturing-places-asia
            brief: Factories for export have brought jobs, higher incomes and city growth to countries such as China and Vietnam, along with pollution and poor conditions in some workplaces.
            codes: [VC2HG10K06]
          - title: Impacts of trade on Australia
            id: geo-impacts-trade-australia
            brief: Cheaper imports helped Australian consumers, but many local factories closed, such as car making, so jobs moved towards services and the population of some towns changed.
            codes: [VC2HG10K06]
          - title: Embodied carbon in trade
            id: geo-embodied-carbon-trade
            brief: Embodied carbon is the emissions released in making and moving a product. When goods are imported, those emissions are counted in the country that made them, not where they are used.
            codes: [VC2HG10K07]
          - title: Trade and sustainability
            id: geo-trade-sustainability
            brief: Trade can spread cleaner technology, but cheap goods such as fast fashion and electronics add to waste, emissions and resource use in other countries.
            codes: [VC2HG10K07]

      - title: Travel, culture and global spread
        id: vic-geo-910-2-3
        points:
          - title: Impacts of tourism on places
            id: geo-impacts-tourism-places
            brief: Tourism brings income and jobs but can crowd places, damage environments, raise local prices and change local culture. Limits on visitor numbers and ecotourism help manage it.
            codes: [VC2HG10K08]
          - title: Tourism on Country
            id: geo-tourism-country
            brief: Aboriginal and Torres Strait Islander Peoples run tours and cultural centres that share culture on their own terms. Visitors are asked to respect sacred sites, as when climbing Uluru ended in 2019.
            codes: [VC2HG10K08]
          - title: Spread of cultural trends
            id: geo-spread-cultural-trends
            brief: Music, fashion and entertainment now spread around the world quickly through streaming and social media, so trends can start anywhere and reach everywhere.
            codes: [VC2HG10K09]
          - title: Spread of pandemics
            id: geo-spread-pandemics
            brief: Air travel and busy trade routes let diseases spread between continents in days, as COVID-19 did in 2020, moving fastest between well-connected cities.
            codes: [VC2HG10K09]
          - title: Spread of financial crises
            id: geo-spread-financial-crises
            brief: Because banks and economies are linked, trouble in one country can spread worldwide, as the 2008 global financial crisis spread from the United States.
            codes: [VC2HG10K09]

  - title: Environmental change and management
    chapters:
      - title: Human impacts on environments
        id: vic-geo-910-3-1
        points:
          - title: Environmental functions
            id: geo-environmental-functions-vic
            brief: Environments supply resources, absorb and break down wastes, and support life with clean air, water and a stable climate. Damage to one function harms the others.
            codes: [VC2HG10K10]
          - title: Human-induced environmental change
            id: geo-human-induced-environmental-change-vic
            brief: People change environments through land clearing, pollution, overusing water, building and burning fossil fuels, which can reduce the sustainability of places.
            codes: [VC2HG10K10]
          - title: Land clearing and biodiversity loss
            id: geo-land-clearing-biodiversity-loss
            brief: Clearing native vegetation for farms and cities destroys habitat, so species decline or die out. Australia has one of the highest rates of mammal extinction in the world.
            codes: [VC2HG10K10]
          - title: Introduced species
            id: geo-introduced-species
            brief: Plants and animals brought from elsewhere, such as rabbits, foxes, cats and cane toads, can spread fast, outcompete or eat native species and damage environments.
            codes: [VC2HG10K10]

      - title: "Environmental issue: inland water"
        id: vic-geo-910-3-2
        points:
          - title: Rivers and wetlands as environments
            id: geo-rivers-wetlands-as-environments-vic
            brief: Rivers and wetlands hold water, filter it, prevent floods and give homes to fish, birds and plants. Many native species need natural floods to breed.
            codes: [VC2HG10K11]
          - title: Causes of river decline in the Murray-Darling Basin
            id: geo-causes-river-decline-murray
            brief: Taking too much water for irrigation and towns, dams and weirs that change natural flows, land clearing and drought have reduced the health of the Basin's rivers.
            codes: [VC2HG10K11]
          - title: Consequences of river decline
            id: geo-consequences-river-decline
            brief: Low flows bring salinity, toxic blue-green algae, fish kills and drying wetlands, which harm wildlife, farms, towns and First Nations communities along the rivers.
            codes: [VC2HG10K11]
          - title: Managing the Murray-Darling Basin
            id: geo-managing-murray-darling-basin
            brief: The Basin Plan sets limits on how much water can be taken and returns water to the rivers as environmental flows, but farmers, towns and environmental groups disagree about how much.
            codes: [VC2HG10K14]

      - title: "Environmental issue: the marine environment"
        id: vic-geo-910-3-3
        points:
          - title: Threats to the Great Barrier Reef
            id: geo-threats-great-barrier-reef
            brief: The reef faces warming seas, runoff of soil and fertiliser from farms, crown-of-thorns starfish and stronger cyclones.
            codes: [VC2HG10K11]
          - title: Coral bleaching
            id: geo-coral-bleaching
            brief: When the sea stays too warm, corals push out the algae that feed and colour them and turn white. Bleached coral can recover if temperatures fall, but repeated bleaching kills it.
            codes: [VC2HG10K11]
          - title: Managing the Great Barrier Reef
            id: geo-managing-great-barrier-reef
            brief: The reef is protected as a marine park with zones that limit fishing, along with work to cut farm runoff and control starfish, but its future depends most on cutting global emissions.
            codes: [VC2HG10K14]

      - title: Caring for Country
        id: vic-geo-910-3-4
        points:
          - title: Custodial responsibility
            id: geo-custodial-responsibility
            brief: Aboriginal and Torres Strait Islander Peoples see themselves as responsible for caring for Country for future generations, guided by knowledge built over tens of thousands of years.
            codes: [VC2HG10K12]
          - title: Cultural burning
            id: geo-cultural-burning
            brief: Cool, patchy fires lit at the right time of year reduce fuel, renew plants and protect habitat. Fire agencies now work with Traditional Owners to bring the practice back.
            codes: [VC2HG10K12]
          - title: Budj Bim and Gunditjmara aquaculture
            id: geo-budj-bim-gunditjmara-aquaculture
            brief: In western Victoria, the Gunditjmara people built channels, weirs and traps to farm eels thousands of years ago. Budj Bim was World Heritage listed in 2019.
            codes: [VC2HG10K12]
          - title: Indigenous rangers and protected areas
            id: geo-indigenous-rangers-protected-areas
            brief: Indigenous ranger groups care for land and sea using traditional and scientific knowledge, and Indigenous Protected Areas make up a large part of Australia's conservation estate.
            codes: [VC2HG10K12]

      - title: Worldviews and management
        id: vic-geo-910-3-5
        points:
          - title: Environmental worldviews
            id: geo-environmental-worldviews
            brief: A human-centred worldview values nature mainly for what it gives people. An earth-centred worldview sees nature as worth protecting for its own sake.
            codes: [VC2HG10K13]
          - title: Worldviews and support for sustainability
            id: geo-worldviews-support-sustainability
            brief: People's worldviews shape whether they support actions such as protecting forests or limiting development, which explains why groups disagree on environmental issues.
            codes: [VC2HG10K13]
          - title: Sustainability as a geographical concept
            id: geo-sustainability-as-geographical-concept
            brief: Sustainability means meeting people's needs now without harming the ability of environments and future generations to meet theirs. It has environmental, economic and social parts.
            codes: [VC2HG10K14]
          - title: Judging environmental management
            id: geo-judging-environmental-management
            brief: A management strategy is judged on environmental, economic and social criteria, such as whether it works, what it costs, who benefits and whether it can last.
            codes: [VC2HG10K14]

  - title: Geographies of human wellbeing
    chapters:
      - title: Measuring wellbeing
        id: vic-geo-910-4-1
        points:
          - title: Human wellbeing and development
            id: geo-human-wellbeing-development-vic
            brief: Wellbeing is the quality of people's lives, including health, income, education, safety and freedom. Development is the process of improving it.
            codes: [VC2HG10K15]
          - title: Income per person as a measure
            id: geo-income-per-person-as
            brief: Gross national income per person shows a country's average income, but it hides how unevenly income is shared and leaves out health and education.
            codes: [VC2HG10K15]
          - title: The Human Development Index
            id: geo-human-development-index-vic
            brief: The HDI combines life expectancy, years of schooling and income per person into one score from 0 to 1, so countries can be ranked on more than income.
            codes: [VC2HG10K15]
          - title: Other measures of wellbeing
            id: geo-other-measures-wellbeing-vic
            brief: Infant mortality, literacy rates, access to clean water and sanitation, and doctors per person each show a different side of wellbeing and how countries differ.
            codes: [VC2HG10K15]

      - title: Differences in wellbeing
        id: vic-geo-910-4-2
        points:
          - title: Differences in wellbeing within Australia
            id: geo-differences-wellbeing-within-australia
            brief: Wellbeing tends to be higher in capital cities and lower in some remote and regional areas, which often have fewer jobs, services and health care.
            codes: [VC2HG10K16]
          - title: Differences in wellbeing in India
            id: geo-differences-wellbeing-india
            brief: India has fast-growing cities and wealthy regions alongside poorer rural states, with large gaps in income, health and schooling between them.
            codes: [VC2HG10K16]
          - title: Why wellbeing differs between places
            id: geo-wellbeing-differs-between-places
            brief: Access to jobs, services, clean water and education, along with history, environment, conflict and government choices, explain why wellbeing differs from place to place.
            codes: [VC2HG10K16]
          - title: Aboriginal and Torres Strait Islander wellbeing
            id: geo-aboriginal-torres-strait-islander-2
            brief: On average, Aboriginal and Torres Strait Islander Peoples face gaps in life expectancy, health and education, linked to dispossession, discrimination and remoteness, and the gaps vary from place to place.
            codes: [VC2HG10K17]
          - title: Closing the Gap
            id: geo-closing-gap-vic
            brief: Under the National Agreement on Closing the Gap, governments and Aboriginal and Torres Strait Islander organisations share decisions and work toward targets in health, education, jobs and housing.
            codes: [VC2HG10K17]

      - title: Improving wellbeing
        id: vic-geo-910-4-3
        points:
          - title: International organisations
            id: geo-international-organisations
            brief: Bodies such as the United Nations, the World Health Organization and the World Bank fund and run programs in health, food, education and development.
            codes: [VC2HG10K18]
          - title: Non-government organisations
            id: geo-non-government-organisations-vic
            brief: Non-government organisations such as the Red Cross and Oxfam are independent of governments and run aid and community projects, often at a local scale.
            codes: [VC2HG10K18]
          - title: Australia's aid program
            id: geo-australia-s-aid-program
            brief: The Australian Government gives aid mostly to countries in the Indo-Pacific region, for health, education, disaster relief and economic growth.
            codes: [VC2HG10K18]
          - title: The Sustainable Development Goals
            id: geo-sustainable-development-goals-2-vic
            brief: The 17 United Nations goals, agreed in 2015 for 2030, aim to end poverty and hunger, improve health and education, and protect the environment.
            codes: [VC2HG10K18]

  - title: Geographical skills
    chapters:
      - title: Analysing and deciding
        id: vic-geo-910-5-1
        points:
          - title: Reliable sources of geographical data
            id: geo-reliable-sources-geographical-data
            brief: A reliable source is recent, from an expert or official body, backed by evidence and free of bias. Comparing sources shows whether data can be trusted.
            codes: [VC2HG10S02]
          - title: Scatter graphs and relationships
            id: geo-scatter-graphs-relationships
            brief: A scatter graph plots two variables to show whether they are related. A positive relationship rises together, a negative one moves in opposite directions.
            codes: [VC2HG10S03, VC2HG10S04]
          - title: Making forecasts from trends
            id: geo-making-forecasts-from-trends
            brief: Extending a trend on a graph lets geographers predict what may happen next, such as population growth, while noting that conditions can change.
            codes: [VC2HG10S04]
          - title: Perspectives and ethical values
            id: geo-perspectives-ethical-values
            brief: Different groups see an issue differently because of their interests and values. Geographers weigh these perspectives, and values such as fairness, when justifying a conclusion.
            codes: [VC2HG10S05]
          - title: Evaluating strategies with criteria
            id: geo-evaluating-strategies-with-criteria
            brief: Strategies are compared with environmental, economic and social criteria, the best one is recommended, and its likely impacts are explained.
            codes: [VC2HG10S06]
