# NSW Modern History, Year 12: the core study and one option in each of the other three sections, 41 points.
# Drafted from NESA's Modern History Stage 6 Syllabus (2017), the syllabus taught in Year 12 until the 2027 HSC. The
# structure follows the syllabus: the core and each section are units. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Schools pick one option in each of National studies, Peace and conflict, and Change in the modern world. This outline
# has one per section: Russia and the Soviet Union 1917 to 1941, Conflict in Indochina 1954 to 1979, and The changing
# world order 1945 to 2011. Check these are offered in NESA's option list, and add other options as units.
# In transition: the Modern History 11-12 Syllabus (2024) replaces this one for Year 12 from Term 4 2027 (first HSC 2028).

id: nsw-mod-12
subject: Modern History
bank: mod
name: Modern History, Year 12
about: HSC, Power and authority, Russia, Indochina and world order
short: Modern History
years: [12]
place: nsw
kind: standard
syllabus: NSW Modern History Stage 6 Syllabus (2017), Year 12 course, the core and one option per section
note: Follows the NSW Modern History syllabus. Not made or endorsed by NESA.
chips: [fascism, appeasement, Stalin, Vietnam War, Cold War]

units:
  - title: Power and authority in the modern world, 1919 to 1946
    chapters:
      - title: After World War I
        id: nsw-mod-12-1-1
        points:
          - title: The postwar settlement
            id: mod-postwar-settlement
            brief: The peace treaties redrew Europe's borders and left many people, especially in Germany, Italy and Hungary, resentful of the terms.
          - title: The League of Nations
            id: mod-league-nations
            brief: Set up to keep peace through collective security, the League lacked an army and the United States never joined, so it failed to stop aggression in the 1930s.
          - title: Challenges to democracy
            id: mod-challenges-democracy
            brief: New democracies faced economic crisis, political violence and distrust, and many gave way to authoritarian rule between the wars.
          - title: The Great Depression
            id: mod-great-depression
            brief: After the 1929 Wall Street crash, world trade collapsed and unemployment soared, which drove voters towards extreme parties.

      - title: Authoritarian regimes
        id: nsw-mod-12-1-2
        points:
          - title: Fascism in Italy
            id: mod-fascism-italy
            brief: Mussolini's Fascists used violence and the March on Rome in 1922 to take power, then built a one-party state.
          - title: The Nazi rise to power
            id: mod-nazi-rise-power
            brief: Hitler's Nazi Party grew during the Depression, he became chancellor in January 1933, and the Enabling Act let him rule as a dictator.
          - title: Militarism in Japan
            id: mod-militarism-japan
            brief: In the 1930s the army gained control of Japan's government and pursued expansion, invading Manchuria in 1931 and China in 1937.
          - title: Stalin's Soviet Union
            id: mod-stalin-s-soviet-union
            brief: Stalin built a dictatorship through a cult of personality, forced industrialisation and terror against real and imagined enemies.
          - title: Methods of control
            id: mod-methods-control
            brief: Dictatorships used propaganda, secret police, censorship, youth movements and terror to hold power and win or force support.

      - title: The road to World War II
        id: nsw-mod-12-1-3
        points:
          - title: Aggression in the 1930s
            id: mod-aggression-1930s
            brief: Japan's invasion of Manchuria, Italy's invasion of Ethiopia and Germany's rearmament and takeover of the Rhineland, Austria and Czechoslovakia went largely unchecked.
          - title: Appeasement
            id: mod-appeasement
            brief: Britain and France gave in to some of Hitler's demands, as at Munich in 1938, hoping to avoid war. Historians still debate whether it was a mistake.
          - title: The outbreak of war in 1939
            id: mod-outbreak-war-1939
            brief: The Nazi-Soviet Pact cleared the way for Germany to invade Poland on 1 September 1939, and Britain and France declared war.
          - title: The Holocaust
            id: mod-holocaust
            brief: Nazi Germany murdered about six million Jews, as well as Roma, disabled people and others, in a planned genocide.
          - title: The world after 1945
            id: mod-world-after-1945
            brief: The war ended with the defeat of Germany and Japan, the founding of the United Nations, and the United States and Soviet Union as rival superpowers.

  - title: Russia and the Soviet Union, 1917 to 1941
    chapters:
      - title: Revolution and civil war
        id: nsw-mod-12-2-1
        points:
          - title: The February Revolution of 1917
            id: mod-february-revolution-1917
            brief: War losses, food shortages and strikes led the Tsar to abdicate. A Provisional Government shared power with the Petrograd Soviet.
          - title: The October Revolution
            id: mod-october-revolution
            brief: Lenin's Bolsheviks seized power in Petrograd in October 1917, promising peace, land and bread.
          - title: Civil war and War Communism
            id: mod-civil-war-war-communism
            brief: The Bolsheviks' Red Army defeated the Whites by 1921. War Communism took grain and industry under state control and caused famine.
          - title: The New Economic Policy
            id: mod-new-economic-policy
            brief: In 1921 Lenin allowed small private trade and farming to restore the economy, which divided the Communist Party.

      - title: Stalin's rule
        id: nsw-mod-12-2-2
        points:
          - title: Stalin's rise to power
            id: mod-stalin-s-rise-power
            brief: After Lenin died in 1924, Stalin used his post as general secretary to build support and defeat rivals such as Trotsky.
          - title: Collectivisation
            id: mod-collectivisation
            brief: From 1929 peasants were forced onto collective farms. Resistance, seizures of grain and famine killed millions, especially in Ukraine.
          - title: The Five-Year Plans
            id: mod-five-year-plans
            brief: Plans from 1928 set huge targets for heavy industry, building new factories and cities at great human cost.
          - title: The Great Terror
            id: mod-great-terror
            brief: In the purges of 1936 to 1938, hundreds of thousands were executed and many more sent to Gulag labour camps, including party leaders and army officers.
          - title: Society and culture under Stalin
            id: mod-society-culture-under-stalin
            brief: Art, education and religion were controlled to serve the state, and women were expected to work and raise families.

  - title: Conflict in Indochina, 1954 to 1979
    chapters:
      - title: Escalation
        id: nsw-mod-12-3-1
        points:
          - title: The end of French rule
            id: mod-end-french-rule
            brief: The Viet Minh defeated France at Dien Bien Phu in 1954. The Geneva Accords split Vietnam in two until elections that were never held.
          - title: The two Vietnams
            id: mod-two-vietnams
            brief: The communist North under Ho Chi Minh faced the US-backed South, where the Viet Cong fought the government.
          - title: United States involvement
            id: mod-united-states-involvement
            brief: Fearing communism would spread, the United States sent advisers and, after the Gulf of Tonkin incident in 1964, combat troops. Australia also sent troops.
          - title: The nature of the war
            id: mod-nature-war
            brief: The Viet Cong and North Vietnamese used guerrilla tactics, while the United States relied on bombing and search and destroy missions.

      - title: Opposition, withdrawal and aftermath
        id: nsw-mod-12-3-2
        points:
          - title: The Tet Offensive
            id: mod-tet-offensive
            brief: The 1968 attacks across South Vietnam were a military defeat for the communists but turned many Americans against the war.
          - title: Opposition to the war
            id: mod-opposition-war
            brief: Protests grew in the United States and Australia, including the Moratorium marches of 1970, fed by conscription and casualties.
          - title: Withdrawal and the fall of Saigon
            id: mod-withdrawal-fall-saigon
            brief: US troops left after the 1973 Paris Peace Accords, and North Vietnam took Saigon in April 1975.
          - title: Cambodia and the Khmer Rouge
            id: mod-cambodia-khmer-rouge
            brief: The Khmer Rouge took power in 1975 and caused the deaths of about 1.5 to 2 million Cambodians before Vietnam invaded in 1979.
          - title: Effects of the conflict
            id: mod-effects-conflict
            brief: Millions died, the land was damaged by bombing and chemicals, and many refugees fled by boat, some resettling in Australia.

  - title: The changing world order, 1945 to 2011
    chapters:
      - title: The Cold War
        id: nsw-mod-12-4-1
        points:
          - title: Origins of the Cold War
            id: mod-origins-cold-war
            brief: Distrust between the United States and the Soviet Union grew after 1945 as Europe divided into Western and Soviet blocs.
          - title: A bipolar world
            id: mod-bipolar-world
            brief: The superpowers led rival alliances, NATO and the Warsaw Pact, competed for influence and avoided fighting each other directly.
          - title: The nuclear arms race
            id: mod-nuclear-arms-race
            brief: Both sides built huge nuclear arsenals. The Cuban Missile Crisis of 1962 brought them close to war and led to efforts to control arms.
          - title: The end of the Cold War
            id: mod-end-cold-war
            brief: Gorbachev's reforms, the fall of the Berlin Wall in 1989 and the collapse of the Soviet Union in 1991 ended the Cold War.

      - title: A new world order
        id: nsw-mod-12-4-2
        points:
          - title: A single superpower
            id: mod-single-superpower
            brief: After 1991 the United States was the only superpower, and the 1990s saw hopes for cooperation through the UN.
          - title: Conflicts after the Cold War
            id: mod-conflicts-after-cold-war
            brief: Wars in the former Yugoslavia and genocide in Rwanda in the 1990s tested the UN and the will of other countries to step in.
          - title: Terrorism and the response
            id: mod-terrorism-response
            brief: The attacks of 11 September 2001 led to the US-led war in Afghanistan and the invasion of Iraq in 2003.
          - title: The rise of new powers
            id: mod-rise-new-powers
            brief: The fast growth of China and other economies began to shift global power away from the United States by 2011.
          - title: The United Nations and world order
            id: mod-united-nations-world-order
            brief: The UN's peacekeeping and humanitarian work grew, but Security Council vetoes often blocked action.
