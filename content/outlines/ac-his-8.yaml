# Australian Curriculum History, Year 8: the ancient to the modern world (c.650 to 1750 CE), with the year's overview
# and the historical concepts and skills, then medieval Europe, the Renaissance, the Vikings, the Mongol Empire and
# Japan under the shoguns, 40 points.
# Follows ACARA's Australian Curriculum: Humanities and Social Sciences, History 7-10, Version 9.0 (History curriculum
# content, Years 7-10), checked on australiancurriculum.edu.au in November 2026. Version 9.0 was approved in April 2022
# and released for use from 2023; each state and territory sets when its schools start it (Queensland schools teach
# every v9 learning area by the end of 2027). No newer version is announced. Western Australia and South Australia
# teach their own versions built on it.
# The first unit is the year's overview with the Historical knowledge and skills strand's concepts and skills, taught
# as ideas. Schools study at least one topic from Medieval Europe and the early modern world, and at least one from
# Empires and expansions or the Asia-Pacific world. The second unit covers Medieval Europe (two chapters) and the
# Renaissance; the third covers the Vikings and the Mongol Empire from Empires and expansions, and Japan under the
# shoguns from the Asia-Pacific world. The emergence of the modern world, the Ottoman Empire, the Spanish conquest of
# the Americas, the Angkor/Khmer Empire and Polynesian expansion can be added as chapters later. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-his-8
subject: History
bank: his
name: History, Year 8
about: "Australian Curriculum, Year 8: The ancient to the modern world"
short: History
years: [8]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: History, Version 9.0, Year 8"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [feudalism, Black Death, Renaissance, Vikings, Genghis Khan, samurai]

units:
  - title: Overview and historical skills
    chapters:
      - title: From the ancient to the modern world
        id: ac-his-8-1-1
        points:
          - title: The fall of the Western Roman Empire
            id: his-fall-western-roman-empire
            brief: Invasions, weak rulers and money troubles ended Roman rule in western Europe in 476 CE, while the Eastern Empire, Byzantium, lasted another thousand years.
            codes: [AC9HH8K01]
          - title: Christianity in medieval Europe
            id: his-christianity-medieval-europe
            brief: The Catholic Church, led by the Pope, shaped daily life, learning and politics across western Europe, and was rich from the taxes and land it held.
            codes: [AC9HH8K01]
          - title: The rise of Islam
            id: his-rise-islam
            brief: Islam began in Arabia in the 7th century with the prophet Muhammad and spread quickly. Scholars in cities such as Baghdad kept and advanced learning in science, maths and medicine.
          - title: Trade routes across the world
            id: his-trade-routes-across-world
            brief: The Silk Road and sea routes carried silk, spices, ideas and also disease between China, India, the Islamic world and Europe.
          - title: Voyages of discovery
            id: his-voyages-discovery
            brief: From the late 1400s, European sailors such as Columbus and da Gama sought sea routes to Asia's riches, reaching the Americas and India and starting a new age of contact and conquest.

      - title: Weighing sources and ideas
        id: ac-his-8-1-2
        points:
          - title: Comparing sources to check accuracy
            id: his-comparing-sources-check-accuracy
            brief: When two sources made independently agree, each is more likely to be accurate. When they disagree, the historian looks for why.
            codes: [AC9HH8S04]
          - title: Bias and reliability
            id: his-bias-reliability
            brief: A biased source shows one side, often because of who made it and why, such as a monk writing about Viking raids. Knowing the bias helps judge how reliable it is.
            codes: [AC9HH8S04, AC9HH8S06]
          - title: Historical empathy
            id: his-historical-empathy
            brief: Empathy in history means understanding why people acted as they did by their own beliefs and conditions, without judging them only by today's values.
            codes: [AC9HH8S06]
          - title: Judging historical significance
            id: his-judging-historical-significance
            brief: An event or person is significant if it affected many people, had lasting effects or changed how people lived and thought, such as the printing press.
            codes: [AC9HH8S07]
          - title: Writing a historical explanation
            id: his-writing-historical-explanation
            brief: A good explanation opens with a clear point, backs it with evidence from sources, explains how the evidence supports the point, and links it to the question.
            codes: [AC9HH8S08]

  - title: Medieval Europe and the Renaissance
    chapters:
      - title: Medieval society and the Church
        id: ac-his-8-2-1
        points:
          - title: Feudalism
            id: his-feudalism
            brief: Under feudalism the king granted land to lords in return for loyalty and soldiers, and lords gave land to knights, with peasants working it at the bottom.
            codes: [AC9HH8K02]
          - title: Life on the manor
            id: his-life-manor
            brief: Most people were peasants on a lord's manor. Serfs could not leave the land, worked the lord's fields and paid him part of their crops.
            codes: [AC9HH8K02]
          - title: Knights, castles and chivalry
            id: his-knights-castles-chivalry
            brief: Knights trained for years to fight on horseback and followed a code of chivalry. Castles protected lords and showed their power over the land around them.
            codes: [AC9HH8K02]
          - title: The power of the Church
            id: his-power-church
            brief: The Church collected a tithe, a tenth of what people produced, ran monasteries that copied books and cared for the sick, and could cast people out of the Church.
            codes: [AC9HH8K02, AC9HH8K04]
          - title: Medieval law and punishment
            id: his-medieval-law-punishment
            brief: Guilt was often decided by trial by ordeal or by combat, in the belief that God would protect the innocent, and punishments were public and harsh.
            codes: [AC9HH8K04]

      - title: Medieval crises and change
        id: ac-his-8-2-2
        points:
          - title: The Crusades
            id: his-crusades
            brief: From 1095, Christian armies from Europe fought Muslim rulers for control of Jerusalem. The wars brought death on both sides but also new trade and ideas to Europe.
            codes: [AC9HH8K03]
          - title: The Black Death arrives
            id: his-black-death-arrives
            brief: Plague reached Europe in 1347 along trade routes, spread by fleas on rats and from person to person, and killed about a third of Europe's people in a few years.
            codes: [AC9HH8K03]
          - title: Effects of the Black Death
            id: his-effects-black-death
            brief: With so many workers dead, survivors demanded higher wages and freedom, which weakened feudalism and led to uprisings such as the Peasants' Revolt of 1381.
            codes: [AC9HH8K03, AC9HH8K06]
          - title: Magna Carta
            id: his-magna-carta
            brief: In 1215 English barons forced King John to agree that the king was also under the law, an early limit on a ruler's power.
            codes: [AC9HH8K04]
          - title: Joan of Arc
            id: his-joan-arc
            brief: A peasant girl who said God sent her, Joan of Arc led French forces against the English in 1429, was burned in 1431, and became a French hero and saint.
            codes: [AC9HH8K05]

      - title: The Renaissance
        id: ac-his-8-2-3
        points:
          - title: What the Renaissance was
            id: his-renaissance-was
            brief: The Renaissance, or rebirth, was a revival of Greek and Roman learning and art that began in Italian cities such as Florence in the 1400s.
            codes: [AC9HH8K01]
          - title: Humanism
            id: his-humanism
            brief: Humanists studied ancient texts and believed people could improve themselves through learning, shifting attention from the next life to human achievement.
            codes: [AC9HH8K06]
          - title: Patrons and the Medici
            id: his-patrons-medici
            brief: Rich patrons such as the Medici banking family of Florence paid artists and scholars, using art to show their wealth and power.
            codes: [AC9HH8K02]
          - title: Leonardo da Vinci
            id: his-leonardo-da-vinci
            brief: Leonardo was a painter, inventor and scientist whose notebooks of anatomy and machines show the Renaissance idea of a person skilled in many fields.
            codes: [AC9HH8K05]
          - title: The printing press
            id: his-printing-press
            brief: Gutenberg's movable-type press, from about 1450, made books faster and cheaper, spreading ideas and helping the Reformation and science.
            codes: [AC9HH8K03]

  - title: Empires and the Asia-Pacific world
    chapters:
      - title: The Vikings
        id: ac-his-8-3-1
        points:
          - title: Longships and the Viking homeland
            id: his-longships-viking-homeland
            brief: Vikings came from Scandinavia, where farmland was scarce. Their light, fast longships could cross oceans and sail up shallow rivers.
            codes: [AC9HH8K07]
          - title: Viking raids
            id: his-viking-raids
            brief: The raid on the monastery at Lindisfarne in 793 began centuries of attacks on rich, poorly defended places across the British Isles and Europe.
            codes: [AC9HH8K08]
          - title: Viking traders and settlers
            id: his-viking-traders-settlers
            brief: Vikings also traded as far as Baghdad and settled in places such as Dublin, York, Normandy, Iceland and Greenland, reaching North America about 1000 CE.
            codes: [AC9HH8K08]
          - title: Viking society and beliefs
            id: his-viking-society-beliefs
            brief: Society had jarls, free farmers and thralls, who were enslaved. A local assembly, the thing, settled disputes, and Vikings worshipped gods such as Odin and Thor.
            codes: [AC9HH8K07, AC9HH8K09]
          - title: The end of the Viking age
            id: his-end-viking-age
            brief: As Scandinavian kingdoms grew stronger and became Christian, raiding faded. The defeat at Stamford Bridge in 1066 is often taken as its end.
            codes: [AC9HH8K08, AC9HH8K11]

      - title: The Mongol Empire
        id: ac-his-8-3-2
        points:
          - title: Genghis Khan unites the Mongols
            id: his-genghis-khan-unites-mongols
            brief: In 1206 Temujin united the nomadic Mongol tribes and took the title Genghis Khan, promoting followers for loyalty and skill rather than family.
            codes: [AC9HH8K10]
          - title: How the Mongols conquered
            id: his-mongols-conquered
            brief: Mongol armies of mounted archers moved fast, used clever tactics and terror, and built the largest land empire in history.
            codes: [AC9HH8K08]
          - title: Trade under the Mongols
            id: his-trade-under-mongols
            brief: The Mongols kept the Silk Road safe and ran a relay postal system, so goods, ideas and travellers such as Marco Polo moved across Asia.
            codes: [AC9HH8K07]
          - title: Kublai Khan and the empire's decline
            id: his-kublai-khan-empire-s
            brief: Kublai Khan conquered China and founded the Yuan dynasty, but the empire split into rival khanates, and the Yuan fell in 1368.
            codes: [AC9HH8K09, AC9HH8K10]

      - title: Japan under the shoguns
        id: ac-his-8-3-3
        points:
          - title: The emperor and the shogun
            id: his-emperor-shogun
            brief: From 1192 the shogun, a military ruler, held real power in Japan, while the emperor kept a religious and ceremonial role.
            codes: [AC9HH8K14]
          - title: Samurai and bushido
            id: his-samurai-bushido
            brief: Samurai were warriors who served a lord, a daimyo, and followed bushido, a code of loyalty, honour and self-discipline.
            codes: [AC9HH8K12]
          - title: Japan's social order
            id: his-japan-s-social-order
            brief: Under the shoguns, society was ranked as samurai, then peasants, craftworkers and merchants, with the emperor and nobles above.
            codes: [AC9HH8K12]
          - title: Uniting Japan
            id: his-uniting-japan
            brief: After a century of civil war, Oda Nobunaga, Toyotomi Hideyoshi and Tokugawa Ieyasu united Japan, and the Tokugawa shogunate began in 1603.
            codes: [AC9HH8K13, AC9HH8K15]
          - title: Japan closes its borders
            id: his-japan-closes-borders
            brief: The Tokugawa shoguns banned Christianity and limited foreign trade to a few ports, giving Japan over 200 years of peace and isolation.
            codes: [AC9HH8K13]
          - title: The end of the shoguns
            id: his-end-shoguns
            brief: American warships under Perry forced Japan to open to trade in 1853, and in 1868 the Meiji Restoration ended rule by shoguns.
            codes: [AC9HH8K13, AC9HH8K16]
