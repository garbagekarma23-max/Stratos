# NSW Business Studies, Year 11: the Business management and Business planning topics, 29 points.
# The Nature of business topic is its own course, nsw-bus-11. Together they make the Year 11 course.
# Drafted from NESA's Business Studies Stage 6 Syllabus (2010), the syllabus taught in Year 11 in 2026. The structure
# follows the syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: a new Business Studies 11-12 Syllabus is in development at NESA. Check its start date before the
# first run.

id: nsw-bus-11b
subject: Business Studies
bank: bus
name: Business Studies, Year 11
about: HSC, Business management and planning
short: Business Studies
years: [11]
place: nsw
kind: standard
syllabus: NSW Business Studies Stage 6 Syllabus (2010), Year 11 course, Business management and Business planning topics
note: Follows the NSW Business Studies syllabus. Not made or endorsed by NESA.
chips: [stakeholder, scientific management, contingency, business plan, SWOT]

units:
  - title: Business management
    chapters:
      - title: The nature of management
        id: nsw-bus-11b-1-1
        points:
          - title: What managers do
            id: bus-managers-do
            brief: Managers plan, organise, lead and control the work of a business so it meets its goals. Each role links to the others.
          - title: Management skills
            id: bus-management-skills
            brief: Good managers need interpersonal skills, communication, decision-making, problem-solving and the ability to plan ahead and adapt.
          - title: Stakeholders
            id: bus-stakeholders
            brief: People with an interest in a business, such as owners, employees, customers, suppliers, the government and the community. Their interests often conflict.
          - title: Corporate social responsibility
            id: bus-corporate-social-responsibility
            brief: A business acting for the good of society and the environment beyond what the law requires, such as cutting waste or treating suppliers fairly.
          - title: Management and the triple bottom line
            id: bus-management-triple-bottom-line
            brief: Judging a business on its financial, social and environmental results, not on profit alone.

      - title: Approaches to management
        id: nsw-bus-11b-1-2
        points:
          - title: The classical scientific approach
            id: bus-classical-scientific-approach
            brief: Frederick Taylor broke work into simple, measured tasks, with workers paid for output. It raised productivity but treated workers like parts of a machine.
          - title: The classical bureaucratic approach
            id: bus-classical-bureaucratic-approach
            brief: Clear hierarchy, written rules, set roles and authority from the top, drawing on Max Weber and Henri Fayol. It brings order but can be slow and rigid.
          - title: The behavioural approach
            id: bus-behavioural-approach
            brief: Elton Mayo's Hawthorne studies suggested that attention, teamwork and meeting social needs lift motivation. Managers lead and consult rather than only command.
          - title: The political approach
            id: bus-political-approach
            brief: Businesses are made of groups with different interests competing for power and resources. Managers negotiate and build alliances.
          - title: The systems approach
            id: bus-systems-approach
            brief: A business is a system of connected parts that takes in inputs, transforms them and produces outputs, and must keep adapting to its environment.
          - title: The contingency approach
            id: bus-contingency-approach
            brief: There is no single best way to manage. The right approach depends on the situation, so managers adapt their style to the problem in front of them.

      - title: Management and change
        id: nsw-bus-11b-1-3
        points:
          - title: Forces for change
            id: bus-forces-change
            brief: External forces, such as new technology, competition and law, and internal forces, such as a new manager or poor results, push a business to change.
          - title: Resistance to change
            id: bus-resistance-change
            brief: People resist change because of costs, fear of the unknown, lost status, habit and poor communication.
          - title: Managing change well
            id: bus-managing-change-well
            brief: Explaining the need for change, involving staff, setting clear goals, training and supporting people through it make change more likely to succeed.
          - title: Force field analysis
            id: bus-force-field-analysis
            brief: Kurt Lewin's model lists forces driving change and forces resisting it. Change happens when the driving forces outweigh the restraining ones.

  - title: Business planning
    chapters:
      - title: Starting a small to medium enterprise
        id: nsw-bus-11b-2-1
        points:
          - title: The decision to start a business
            id: bus-decision-start-business
            brief: People start businesses to be their own boss, follow an idea or earn more. Before starting, they weigh their skills, money and the risk.
          - title: Market research for a new business
            id: bus-market-research-new-business
            brief: Finding out who the customers are, what they want, what competitors offer and whether enough people will buy, before spending money.
          - title: Choosing a location
            id: bus-choosing-location
            brief: Location affects costs and sales. Owners weigh access to customers, suppliers and staff, rent, visibility and competitors nearby.
          - title: Financing a new business
            id: bus-financing-new-business
            brief: Money to start can come from the owner's savings (equity) or loans (debt). Equity keeps control but risks the owner's money. Debt must be repaid with interest.
          - title: Resources needed to start
            id: bus-resources-needed-start
            brief: A new business needs premises, equipment, stock, staff and systems such as accounts. Planning these in advance avoids running short.

      - title: The business plan
        id: nsw-bus-11b-2-2
        points:
          - title: Why a business plan matters
            id: bus-business-plan-matters
            brief: A business plan sets out goals and how to reach them. It guides decisions and is used to win finance from lenders and investors.
          - title: Vision, mission and goals
            id: bus-vision-mission-goals
            brief: The vision is what the business wants to become, the mission is its purpose, and goals are measurable targets that put them into action.
          - title: SWOT analysis
            id: bus-swot-analysis
            brief: Listing internal strengths and weaknesses and external opportunities and threats, to plan around what the business can control and what it cannot.
          - title: Parts of a business plan
            id: bus-parts-business-plan
            brief: A plan covers marketing, operations, finance and human resources, each with its own goals and actions.
          - title: Levels of planning
            id: bus-levels-planning
            brief: Strategic plans cover several years for the whole business, tactical plans one to two years for a part of it, and operational plans the day-to-day.

      - title: Carrying out the plan
        id: nsw-bus-11b-2-3
        points:
          - title: Monitoring performance
            id: bus-monitoring-performance
            brief: Comparing actual results, such as sales or costs, with the plan and acting early when they fall short.
          - title: Benchmarking
            id: bus-benchmarking
            brief: Comparing a business's performance with a standard, such as a competitor or industry average, to find ways to improve.
          - title: Contingency planning
            id: bus-contingency-planning
            brief: Planning ahead for what could go wrong, such as a supplier failing, so the business can respond quickly.
          - title: Why small businesses succeed or fail
            id: bus-small-businesses-succeed-or
            brief: Good planning, enough money, sound management and knowing the customer help small businesses succeed. Cash flow problems and poor planning often cause failure.
