# NSW Commerce, Stage 5 (Years 9 and 10): the five core focus areas and three options, 70 points.
# Follows NESA's Commerce 7-10 Syllabus (2024), checked on the NSW Curriculum website (curriculum.nsw.edu.au) in
# November 2026. Schools plan for it in 2025 and 2026 and teach it from 2027 (the 200-hour course in Years 7 and 9 from
# 2027 and Years 8 and 10 from 2028; the 100-hour course in full from 2027), so this follows the new syllabus, not the
# Commerce 7-10 Syllabus (2019) it replaces. The 2019 syllabus is not available after December 2028.
# Commerce is an elective, as a 100-hour course (at least 2 core focus areas) or a 200-hour course (all 5). Schools may
# also teach it in Stage 4, but the syllabus says the Stage 4 content is identical to Stage 5's, so there is one
# outline, for Stage 5, and no nsw-com-s4.
# Structure: each core focus area is a unit, and each content group within it is a chapter (two for the large
# political system group). Each option is a unit. Options picked, among those most taught: Law in action, Investing,
# and Promoting and selling. The others (Our economy, Running a business, Political and community involvement, The
# travel consumer, Towards independence) can be added. The Thinking, researching and communicating content group is
# research and writing, so it is left out. The outcome codes (CO5-...) run across every focus area, so they are left
# off the points. Every brief is in our own words.
# also_match [leg] has the matcher look in the Legal Studies bank too, which shares the law and government ideas.
# Commerce already counts as the same subject family as Economics and Business Studies.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-com-s5
subject: Commerce
bank: ecb
name: Commerce, Stage 5
about: NSW Stage 5, Years 9 and 10
short: Commerce
years: [9, 10]
level: Stage 5
place: nsw
kind: standard
syllabus: NSW Commerce 7-10 Syllabus (2024), Stage 5
note: Follows the NSW Commerce syllabus. Not made or endorsed by NESA.
chips: [budgeting, consumer rights, scarcity, voting, payslip, shares]
also_match: [leg]

units:
  - title: The consumer and financial environment
    chapters:
      - title: Consumer decisions
        id: nsw-com-s5-1-1
        points:
          - title: The role of consumers
            id: ecb-role-consumers
            brief: A consumer buys and uses goods and services to meet needs and wants, and consumers' spending decides what businesses make.
          - title: What influences consumer decisions
            id: ecb-influences-consumer-decisions
            brief: Price, income, quality, advertising, friends and family, social media and ethical concerns all shape what consumers buy.
          - title: Pros and cons of payment methods
            id: ecb-pros-cons-payment-methods
            brief: Debit spends your own money, credit and buy now pay later borrow it and can add interest and late fees, and cash is easy to track but easy to lose.

      - title: Consumer protection
        id: nsw-com-s5-1-2
        points:
          - title: Scams and identity theft
            id: ecb-scams-identity-theft-nsw
            brief: Scams trick people out of money or details, and identity theft uses stolen personal details. Consumers guard against them by checking sellers and never sharing passwords.
          - title: Consumer guarantees
            id: ecb-consumer-guarantees-nsw
            brief: Under the Australian Consumer Law, goods must be of acceptable quality, fit for purpose and match their description, whatever the store's own policy says.
          - title: Refunds, repairs and replacements
            id: ecb-refunds-repairs-replacements
            brief: A major fault gives the consumer a choice of refund or replacement, and a minor fault lets the business choose to repair it first.
          - title: Organisations that help consumers
            id: ecb-organisations-that-help-consumers
            brief: The ACCC, NSW Fair Trading and ombudsman services handle complaints, enforce consumer laws and warn people about scams.

      - title: Financial decisions
        id: nsw-com-s5-1-3
        points:
          - title: Borrowing money
            id: ecb-borrowing-money
            brief: People borrow through personal loans, credit cards and home loans, and repay it with interest. The interest rate, fees and term decide what a loan really costs.
          - title: Budgeting
            id: ecb-budgeting
            brief: A budget lists income and expenses so spending stays within income and money is set aside for savings goals.
          - title: Superannuation
            id: ecb-superannuation-nsw
            brief: Superannuation is money saved for retirement, paid by employers into a super fund as a share of an employee's wages.
          - title: Help with financial difficulty
            id: ecb-help-with-financial-difficulty
            brief: People in money trouble can ask their lender for a hardship arrangement, see a free financial counsellor, or as a last resort go bankrupt.

  - title: The economic environment
    chapters:
      - title: Foundations of economics
        id: nsw-com-s5-2-1
        points:
          - title: The economic problem of scarcity
            id: ecb-economic-problem-scarcity
            brief: Resources are limited but people's wants are unlimited, so every society must choose what to produce, how and for whom.
          - title: Opportunity cost
            id: ecb-opportunity-cost-nsw
            brief: Opportunity cost is the next best thing given up when making a choice, such as the wage lost by studying instead of working.
          - title: The circular flow of income
            id: ecb-circular-flow-income-nsw
            brief: Households sell their labour to businesses for income, and spend it on goods and services, so money flows around the economy.
          - title: The price mechanism
            id: ecb-price-mechanism
            brief: In a market, buyers' demand and sellers' supply meet to set a price. A shortage pushes the price up and a surplus pushes it down.

      - title: Growth and government
        id: nsw-com-s5-2-2
        points:
          - title: Economic growth
            id: ecb-economic-growth
            brief: Economic growth is an increase in the goods and services an economy produces over time, measured by the change in gross domestic product (GDP).
          - title: Effects of economic growth in Australia
            id: ecb-effects-economic-growth-australia
            brief: Growth brings more jobs, higher incomes and more tax for services, but can also bring inflation, inequality and harm to the environment.
          - title: Government economic objectives
            id: ecb-government-economic-objectives
            brief: Governments aim for steady growth, low unemployment, low and stable inflation and a fair share of income.
          - title: Why governments intervene
            id: ecb-governments-intervene
            brief: Governments step into the economy to provide public goods, protect consumers and the environment, reduce inequality and smooth out booms and slumps.
          - title: How governments intervene
            id: ecb-governments-intervene-2
            brief: Governments act through taxes and spending in the budget, laws and regulation, and payments such as welfare, while the Reserve Bank sets interest rates.

  - title: The business environment
    chapters:
      - title: The nature of business
        id: nsw-com-s5-3-1
        points:
          - title: The goals of a business
            id: ecb-goals-business
            brief: Businesses aim for profit, growth, market share, good service and sometimes social or environmental goals.
          - title: Types of businesses
            id: ecb-types-businesses
            brief: Businesses can be sole traders, partnerships or companies, and small, medium or large, each with its own features.
          - title: Inputs, processes and outputs
            id: ecb-inputs-processes-outputs
            brief: A business turns inputs such as materials, labour and money through processes into outputs, the goods and services it sells.

      - title: Business performance and entrepreneurs
        id: nsw-com-s5-3-2
        points:
          - title: Recruiting skilled staff
            id: ecb-recruiting-skilled-staff
            brief: A business finds and chooses staff through job ads, applications, interviews and reference checks, and skilled staff lift its performance.
          - title: The business cycle
            id: ecb-business-cycle
            brief: The economy moves through booms, when sales and jobs grow, and recessions, when they fall, and businesses must adjust to both.
          - title: Ethical business decisions
            id: ecb-ethical-business-decisions
            brief: Ethical businesses treat workers, customers and the environment fairly, and corporate social responsibility goes beyond what the law requires.
          - title: What makes an entrepreneur
            id: ecb-makes-entrepreneur
            brief: Entrepreneurs spot opportunities, take risks, solve problems and keep going after failures to build something new.
          - title: Entrepreneurs' contribution to society
            id: ecb-entrepreneurs-contribution-society
            brief: Entrepreneurs create jobs, products and new ways of working, including Aboriginal and Torres Strait Islander entrepreneurs who build businesses on culture and community.

  - title: The legal and political environment
    chapters:
      - title: Laws and the courts
        id: nsw-com-s5-4-1
        points:
          - title: The rule of law
            id: ecb-rule-law
            brief: The rule of law means everyone, including the government, must obey the law, and laws are known, fair and applied equally.
          - title: Criminal and civil law
            id: ecb-criminal-civil-law
            brief: Criminal law deals with offences against society, prosecuted by the state. Civil law settles disputes between people, such as over contracts.
          - title: Statute law and common law
            id: ecb-statute-law-common-law
            brief: Statute law is made by parliament. Common law is made by judges when their decisions in cases set precedents for later cases.
          - title: Aboriginal customary lore
            id: ecb-aboriginal-customary-lore
            brief: Aboriginal and Torres Strait Islander communities have their own lore, passed down over thousands of years, which guides behaviour and relationships with Country.
          - title: The court hierarchy
            id: ecb-court-hierarchy
            brief: In NSW, cases start in the Local, District or Supreme Court by seriousness, federal matters go to federal courts, and the High Court is the highest court.

      - title: Australia's system of government
        id: nsw-com-s5-4-2
        points:
          - title: The Australian Constitution
            id: ecb-australian-constitution
            brief: The Constitution sets up the federal parliament, government and High Court, and divides powers between the Commonwealth and the states.
          - title: Three levels of government
            id: ecb-three-levels-government
            brief: Federal government handles matters such as defence, state government handles schools and police, and local councils handle rubbish and parks.
          - title: The two houses of federal parliament
            id: ecb-two-houses-federal-parliament
            brief: The House of Representatives forms the government and starts most laws, and the Senate reviews them and represents the states.
          - title: The separation of powers
            id: ecb-separation-powers
            brief: Power is split between parliament, which makes laws, the executive, which carries them out, and the courts, which apply them, so no one group holds all of it.

      - title: Elections and voting
        id: nsw-com-s5-4-3
        points:
          - title: Enrolling and voting
            id: ecb-enrolling-voting
            brief: Australian citizens must enrol at 18 and vote in federal and state elections, and can enrol at 16 so they are ready.
          - title: Voting methods
            id: ecb-voting-methods
            brief: First-past-the-post elects the top vote-getter, preferential voting ranks candidates, and proportional voting gives seats by share of the vote, as in the Senate.
          - title: Compulsory voting
            id: ecb-compulsory-voting
            brief: Australia makes voting compulsory, which brings high turnout, though some argue people should be free to choose not to vote.
          - title: Parties, independents and forming government
            id: ecb-parties-independents-forming-government
            brief: A party or coalition with a majority in the House of Representatives forms government. In a hung parliament, a minority government needs independents' support.
          - title: Referendums
            id: ecb-referendums
            brief: Changing the Constitution needs a referendum passed by a double majority, a national majority and a majority in at least four states.

  - title: The work environment
    chapters:
      - title: The workplace
        id: nsw-com-s5-5-1
        points:
          - title: Types of work
            id: ecb-types-work-nsw
            brief: Work can be paid or unpaid, such as volunteering, and full-time, part-time or casual, as an employee or self-employed.
          - title: Unions and employer groups
            id: ecb-unions-employer-groups
            brief: Trade unions represent workers in dealing with employers, and employer associations represent businesses.
          - title: The changing nature of work
            id: ecb-changing-nature-work
            brief: Automation, artificial intelligence, working from home and gig work such as food delivery are changing jobs and the skills they need.

      - title: Rights and disputes at work
        id: nsw-com-s5-5-2
        points:
          - title: Employers' rights and responsibilities
            id: ecb-employers-rights-responsibilities
            brief: Employers must pay correct wages, keep the workplace safe and treat staff fairly, and can expect staff to work properly and follow reasonable instructions.
          - title: Employees' rights and responsibilities
            id: ecb-employees-rights-responsibilities
            brief: Employees have the right to safety and to be free of discrimination and harassment, and must work safely and follow lawful instructions.
          - title: Awards, agreements and contracts
            id: ecb-awards-agreements-contracts
            brief: An award sets minimum pay and conditions for an industry, an enterprise agreement is negotiated for one workplace, and a common law contract is made with one worker.
          - title: Resolving workplace disputes
            id: ecb-resolving-workplace-disputes
            brief: Disputes go from a grievance procedure and negotiation to mediation, where a third party helps, and arbitration, where the Fair Work Commission decides.

      - title: Pay and tax
        id: nsw-com-s5-5-3
        points:
          - title: How people are paid
            id: ecb-people-are-paid
            brief: People are paid wages by the hour, a salary by the year, commission on sales or piece rates per item made.
          - title: Reading a payslip
            id: ecb-reading-payslip
            brief: A payslip shows hours, pay rate, gross pay, tax taken out, super paid and net pay, and an income statement totals the year.
          - title: Why we pay tax
            id: ecb-we-pay-tax
            brief: Taxes pay for public services such as schools, hospitals, roads and welfare, and income tax rises with income.
          - title: Tax file numbers and tax returns
            id: ecb-tax-file-numbers-tax
            brief: Workers need a tax file number so the right tax is taken, and each year they lodge a tax return with the ATO to settle what they owe.

  - title: "Option: Law in action"
    chapters:
      - title: Rights, crime and disputes
        id: nsw-com-s5-6-1
        points:
          - title: Children's rights
            id: ecb-children-s-rights
            brief: The United Nations Convention on the Rights of the Child, which Australia signed, protects children's rights to safety, education, health and a say.
          - title: Legal capacity and age
            id: ecb-legal-capacity-age
            brief: Legal capacity is the ability to have legal rights and duties, and the law grants them by age, such as working, driving and voting.
          - title: Young people and the police
            id: ecb-young-people-police
            brief: Young people stopped by police have rights, such as to know why and to have an adult present when questioned, and may have to give their name and address.
          - title: Elements of a crime
            id: ecb-elements-crime
            brief: To convict someone, the prosecution must prove beyond reasonable doubt both the guilty act and the guilty mind.
          - title: Punishments
            id: ecb-punishments
            brief: Punishments such as fines, community service and prison aim to deter, protect society, rehabilitate and show the community's disapproval.
          - title: Alternative dispute resolution
            id: ecb-alternative-dispute-resolution
            brief: Mediation, conciliation and arbitration settle disputes outside court, often faster, cheaper and less stressful.
          - title: Circle sentencing
            id: ecb-circle-sentencing
            brief: Circle sentencing has Aboriginal Elders and community members help a magistrate decide the sentence for an Aboriginal offender.

  - title: "Option: Investing"
    chapters:
      - title: Investing
        id: nsw-com-s5-7-1
        points:
          - title: Types of investments
            id: ecb-types-investments
            brief: Common investments are bank deposits, shares, property, bonds, managed funds and superannuation.
          - title: Risk and return
            id: ecb-risk-return-nsw
            brief: Investments that may earn more, such as shares, usually carry more risk of losing money than safer ones, such as term deposits.
          - title: Diversification
            id: ecb-diversification
            brief: Spreading money across different investments reduces risk, because a loss on one may be balanced by gains on others.
          - title: Ethical investing
            id: ecb-ethical-investing
            brief: Ethical investors avoid companies that harm people or the environment, such as tobacco or coal, and choose ones that do good.
          - title: Protecting investors
            id: ecb-protecting-investors
            brief: ASIC regulates financial advisers and markets, and advisers must be licensed and act in their clients' best interests.

  - title: "Option: Promoting and selling"
    chapters:
      - title: Promoting and selling
        id: nsw-com-s5-8-1
        points:
          - title: Why businesses promote
            id: ecb-businesses-promote
            brief: Businesses promote their goods and services to inform customers, persuade them to buy and remind them the brand exists.
          - title: Target markets and differentiation
            id: ecb-target-markets-differentiation
            brief: A target market is the group a product is aimed at, and a business makes its product stand out by price, quality, design or brand.
          - title: Promotion techniques
            id: ecb-promotion-techniques
            brief: Businesses promote through advertising, social media and influencers, sales promotions such as discounts, personal selling and publicity.
          - title: Misleading advertising
            id: ecb-misleading-advertising
            brief: The Australian Consumer Law bans false or misleading claims, bait advertising and hidden conditions in ads.
          - title: Advertising to children
            id: ecb-advertising-children
            brief: Ad Standards codes limit advertising to children, such as junk food ads, and require ads to be clearly marked as ads.
