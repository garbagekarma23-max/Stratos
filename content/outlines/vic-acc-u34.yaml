# VCE Accounting, Units 3 and 4: financial accounting, reporting, budgeting and decision-making, 37 points.
# Drafted from the VCAA's VCE Accounting Study Design, accredited from 2025. The structure follows the study design:
# each unit is a unit here, and each area of study is a chapter, or two when it is large. Every brief is in our own
# words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW has no Accounting course yet, so this is a new bank (acc). Units 1 and 2 should be run and published first, so
# these points can reuse them.

id: vic-acc-u34
subject: Accounting
bank: acc
name: Accounting, Units 3 and 4
about: VCE, Recording, reporting, budgeting and decisions
short: Accounting
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Accounting Study Design (from 2025), Units 3 and 4
note: Follows the VCE Accounting study design. Not made or endorsed by the VCAA.
chips: [double entry, accrual, balance day adjustment, cash flow statement, profitability]

units:
  - title: "Unit 3: Financial accounting for a trading business"
    chapters:
      - title: The role of accounting in business
        id: vic-acc-u34-1-1
        points:
          - title: Qualitative characteristics
            id: acc-qualitative-characteristics
            brief: Useful financial information is relevant and a faithful representation, and is better when comparable, verifiable, timely and understandable.
          - title: Assumptions of accounting
            id: acc-assumptions-accounting
            brief: Records rest on assumptions such as the entity, going concern, period, accrual basis and monetary unit, which set what is recorded and when.
          - title: Elements of financial reports
            id: acc-elements-financial-reports
            brief: Assets, liabilities, owner's equity, revenue and expenses, each with a definition that decides where an item goes.
          - title: Ethical considerations
            id: acc-ethical-considerations
            brief: Decisions should consider honesty in reporting, fair treatment of staff and suppliers, and effects on the environment and community.

      - title: Recording financial data
        id: vic-acc-u34-1-2
        points:
          - title: Double entry accounting
            id: acc-double-entry-accounting
            brief: Every transaction is recorded with at least one debit and one credit of equal value, so the ledger stays in balance.
          - title: Debit and credit rules
            id: acc-debit-credit-rules
            brief: Assets and expenses increase with a debit. Liabilities, owner's equity and revenue increase with a credit.
          - title: The general journal
            id: acc-general-journal
            brief: A journal for transactions that do not fit the special journals, such as credit purchases of assets, corrections and adjustments.
          - title: Special journals and the ledger
            id: acc-special-journals-ledger
            brief: Journals for sales, purchases, cash receipts and cash payments are posted to ledger accounts, which collect each item's balance.
          - title: The trial balance
            id: acc-trial-balance
            brief: A list of every ledger balance that checks total debits equal total credits. It does not catch every error.
          - title: Accrual and cash basis compared
            id: acc-accrual-cash-basis-compared
            brief: The accrual basis records revenue when earned and expenses when incurred, whatever the timing of cash.
          - title: Recording GST
            id: acc-recording-gst
            brief: GST collected is a liability to the tax office, GST paid is an asset to claim back, and the two are settled each period.
          - title: Inventory in the ledger
            id: acc-inventory-ledger
            brief: With a perpetual system, purchases go straight to inventory and each sale moves cost into cost of sales.

      - title: Preparing and analysing financial reports
        id: vic-acc-u34-1-3
        points:
          - title: The income statement
            id: acc-income-statement
            brief: A report of revenue less expenses over a period, from gross profit through to net profit.
          - title: The balance sheet
            id: acc-balance-sheet
            brief: A report of assets, liabilities and owner's equity at a date, each split into current and non-current.
          - title: The cash flow statement
            id: acc-cash-flow-statement
            brief: A report of cash in and out, grouped into operating, investing and financing activities.
          - title: Cash and profit compared
            id: acc-cash-profit-compared
            brief: A business can make a profit and still run short of cash, because timing of cash differs from when revenue and expenses are recorded.
          - title: Classifying cash flows
            id: acc-classifying-cash-flows
            brief: Paying wages is operating, buying equipment is investing, and a loan or capital contribution is financing.

  - title: "Unit 4: Recording, reporting, budgeting and decision-making"
    chapters:
      - title: Balance day adjustments
        id: vic-acc-u34-2-1
        points:
          - title: Why adjustments are made
            id: acc-adjustments-are-made
            brief: At the end of the period, adjustments make sure revenue and expenses belong to the period they relate to.
          - title: Prepaid expenses
            id: acc-prepaid-expenses
            brief: An expense paid in advance is an asset until it is used, then it moves to an expense.
          - title: Accrued expenses
            id: acc-accrued-expenses
            brief: An expense used but not paid yet, such as wages owing, recorded as an expense and a liability.
          - title: Accrued revenue
            id: acc-accrued-revenue
            brief: Revenue earned but not received yet, recorded as revenue and an asset.
          - title: Unearned revenue
            id: acc-unearned-revenue
            brief: Cash received before goods or services are provided, recorded as a liability until the revenue is earned.
          - title: Bad and doubtful debts
            id: acc-bad-doubtful-debts
            brief: A debt that will not be paid is written off as an expense. An allowance for doubtful debts estimates future bad debts.
          - title: Depreciation adjustments
            id: acc-depreciation-adjustments
            brief: Each period's depreciation is recorded as an expense and added to accumulated depreciation against the asset.
          - title: Disposing of a non-current asset
            id: acc-disposing-non-current-asset
            brief: Selling an asset for more or less than its carrying amount records a gain or loss on disposal.
          - title: Closing the ledger
            id: acc-closing-ledger
            brief: Revenue and expense accounts are closed to profit and loss, which is then closed to the owner's capital.

      - title: Budgeting
        id: vic-acc-u34-2-2
        points:
          - title: Why businesses budget
            id: acc-businesses-budget
            brief: Budgets plan future results, set targets, warn of cash shortfalls and give a basis to compare actual results.
          - title: The budgeted cash flow statement
            id: acc-budgeted-cash-flow-statement
            brief: An estimate of cash in and out by activity, which shows whether the business will have enough cash.
          - title: The budgeted income statement
            id: acc-budgeted-income-statement
            brief: An estimate of revenue and expenses for the coming period, built on the accrual basis.
          - title: The budgeted balance sheet
            id: acc-budgeted-balance-sheet
            brief: An estimate of assets, liabilities and owner's equity at the end of the coming period.
          - title: Variance reports
            id: acc-variance-reports
            brief: Comparing budgeted and actual figures shows favourable and unfavourable variances, which point to problems or chances.

      - title: Analysing performance
        id: vic-acc-u34-2-3
        points:
          - title: Profitability
            id: acc-profitability
            brief: Profitability is how well a business makes profit compared to its sales, assets and the owner's investment.
          - title: Profitability ratios
            id: acc-profitability-ratios
            brief: Return on owner's investment, return on assets, net profit margin and gross profit margin each compare profit with something else.
          - title: Liquidity
            id: acc-liquidity
            brief: Liquidity is the ability to pay debts as they fall due, measured by the working capital ratio and the quick asset ratio.
          - title: Efficiency ratios
            id: acc-efficiency-ratios
            brief: Asset turnover, inventory turnover, days receivable and days payable show how well the business uses its resources.
          - title: Comparing performance
            id: acc-comparing-performance
            brief: Ratios mean most when compared with the business's past results, its budget and similar businesses.
          - title: Strategies to improve performance
            id: acc-strategies-improve-performance
            brief: Raising prices, cutting costs, managing inventory, collecting debts faster and selling idle assets can lift profit or cash.
