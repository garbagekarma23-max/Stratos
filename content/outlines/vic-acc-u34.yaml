# VCE Accounting, Units 3 and 4: financial accounting, reporting, budgeting and decision-making, 46 points.
# Checked against the VCAA's VCE Accounting Study Design, accredited from 2025, in October 2026. Each unit is a unit
# here, and each area of study is a chapter, or two when it is large. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW has no Accounting course yet, so this is a new bank (acc). Units 1 and 2 should be run and published first, so
# these points can reuse them.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-acc-u34
subject: Accounting
bank: acc
name: Accounting, Units 3 and 4
about: VCE, Recording, reporting, budgeting and decisions
short: Accounting
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Accounting Study Design (from 2025), Units 3 and 4
note: Follows the VCE Accounting study design. Not made or endorsed by the VCAA.
chips: [double entry, accrual, balance day adjustment, cash flow statement, profitability]

units:
  - title: "Unit 3: Financial accounting for a trading business"
    chapters:
      - title: Accounting principles
        id: vic-acc-u34-1-1
        points:
          - title: Qualitative characteristics
            id: acc-qualitative-characteristics
            brief: Useful financial information is relevant and a faithful representation, and is better when comparable, verifiable, timely and understandable.
          - title: Assumptions of accounting
            id: acc-assumptions-accounting
            brief: Records rest on assumptions such as the entity, going concern, period, accrual basis and monetary unit, which set what is recorded and when.
          - title: Elements of financial reports
            id: acc-elements-financial-reports
            brief: Assets, liabilities, owner's equity, revenue and expenses, each defined so items can be classified, and assets and liabilities split into current and non-current.
          - title: Ethical considerations
            id: acc-ethical-considerations
            brief: Decisions should consider honesty in reporting, fair treatment of staff and suppliers, and effects on the environment and community.

      - title: Recording financial data
        id: vic-acc-u34-1-2
        points:
          - title: Double entry accounting
            id: acc-double-entry-accounting
            brief: Every transaction is recorded with at least one debit and one credit of equal value, so the ledger stays in balance.
          - title: Debit and credit rules
            id: acc-debit-credit-rules
            brief: Assets and expenses increase with a debit. Liabilities, owner's equity and revenue increase with a credit.
          - title: The general journal
            id: acc-general-journal
            brief: The journal for every transaction in Unit 3, from cash and credit trading to returns, drawings, stock used for advertising, assets the owner contributes and corrections.
          - title: The general ledger
            id: acc-special-journals-ledger
            brief: The ledger holds a T-form account for each item. Journal entries are posted to it, and each account shows its running balance.
          - title: Recording GST
            id: acc-recording-gst
            brief: GST collected and paid is recorded in a GST Clearing account, whose balance shows what the business owes the tax office or is owed back.
          - title: The trial balance
            id: acc-trial-balance
            brief: A list of every ledger balance that checks total debits equal total credits. It does not catch every error.

      - title: Valuing inventory and debts
        id: vic-acc-u34-1-3-2
        points:
          - title: Inventory in the ledger
            id: acc-inventory-ledger
            brief: With a perpetual system, FIFO or identified cost inventory cards back up the ledger, and write-downs and stock losses are recorded in both.
          - title: Product and period costs
            id: acc-product-period-costs
            brief: Costs to get goods ready for sale, such as freight in, are product costs added to inventory. Other costs are period costs, expensed as they occur.
          - title: Lower of cost and net realisable value
            id: acc-lower-cost-net-realisable
            brief: Inventory is reported at the lower of its cost and what it can be sold for less selling costs. A fall below cost is written down.
          - title: Allowance for doubtful debts
            id: acc-allowance-doubtful-debts
            brief: At the end of the period, an estimate of debts that will not be collected is recorded as an expense and an allowance against accounts receivable.
          - title: Writing off bad debts
            id: acc-writing-off-bad-debts
            brief: In the next period, a debt that will not be paid is written off against the allowance, not as a new expense.
          - title: Turnover indicators
            id: acc-turnover-indicators
            brief: Inventory turnover, accounts receivable turnover and accounts payable turnover show how many days stock sits, customers take to pay and the business takes to pay.
          - title: Managing inventory and credit
            id: acc-managing-inventory-credit
            brief: Internal controls, non-financial information and strategies such as tighter credit terms or better stock control improve how a trading business runs.

      - title: Preparing and analysing financial reports
        id: vic-acc-u34-1-3
        points:
          - title: Balancing the ledger
            id: acc-balancing-ledger
            brief: At the end of the period, asset, liability and owner's equity accounts are balanced and their balances carried forward.
          - title: Closing entries
            id: acc-closing-entries
            brief: Revenue and expense accounts are closed to a Profit and Loss Summary account, then profit and drawings are transferred to the owner's capital.
          - title: The income statement
            id: acc-income-statement
            brief: A report of revenue less expenses over a period, from gross profit through to net profit.
          - title: The balance sheet
            id: acc-balance-sheet
            brief: A report of assets, liabilities and owner's equity at a date, each split into current and non-current.
          - title: The cash flow statement
            id: acc-cash-flow-statement
            brief: A report of cash in and out, grouped into operating, investing and financing activities.
          - title: Classifying cash flows
            id: acc-classifying-cash-flows
            brief: Paying wages is operating, buying equipment is investing, and a loan or capital contribution is financing.
          - title: Cash and profit compared
            id: acc-cash-profit-compared
            brief: A business can make a profit and still run short of cash, because timing of cash differs from when revenue and expenses are recorded.

  - title: "Unit 4: Recording, reporting, budgeting and decision-making"
    chapters:
      - title: Non-current assets in the ledger
        id: vic-acc-u34-2-1-2
        points:
          - title: Buying a non-current asset
            id: acc-buying-non-current-asset
            brief: An asset bought for cash or with a loan is recorded at cost, and a loan adds a liability that is repaid over time.
          - title: Depreciation adjustments
            id: acc-depreciation-adjustments
            brief: Each period's depreciation, straight-line or reducing balance, is recorded as an expense and added to accumulated depreciation against the asset.
          - title: Depreciation methods compared
            id: acc-depreciation-methods-compared
            brief: The method chosen changes each year's profit and the carrying amount on the balance sheet, though not the total depreciated.
          - title: Disposing of a non-current asset
            id: acc-disposing-non-current-asset
            brief: Selling an asset for more or less than its carrying amount records a gain or loss. GST applies to a cash sale but not to a trade-in.

      - title: Balance day adjustments
        id: vic-acc-u34-2-1
        points:
          - title: Why adjustments are made
            id: acc-adjustments-are-made
            brief: At the end of the period, adjustments make sure revenue and expenses belong to the period they relate to.
          - title: Prepaid expenses
            id: acc-prepaid-expenses
            brief: An expense paid in advance is recorded as an asset, then moved to an expense as it is used up.
          - title: Accrued expenses
            id: acc-accrued-expenses
            brief: An expense used but not paid yet, such as wages owing, is recorded as an expense and a liability, then cleared when paid next period.
          - title: Accrued revenue
            id: acc-accrued-revenue
            brief: Revenue earned but not received yet is recorded as revenue and an asset, then cleared when the cash arrives next period.
          - title: Unearned revenue
            id: acc-unearned-revenue
            brief: A deposit received before goods or services are provided is a liability until the revenue is earned.
          - title: The adjusted trial balance
            id: acc-adjusted-trial-balance
            brief: A trial balance prepared after balance day adjustments, used to prepare the end-of-period reports.

      - title: Budgeting
        id: vic-acc-u34-2-2
        points:
          - title: Why businesses budget
            id: acc-businesses-budget
            brief: Budgets plan future results, set targets, warn of cash shortfalls and give a basis to compare actual results.
          - title: The budgeted cash flow statement
            id: acc-budgeted-cash-flow-statement
            brief: An estimate of cash in and out by activity, which shows whether the business will have enough cash.
          - title: The budgeted income statement
            id: acc-budgeted-income-statement
            brief: An estimate of revenue and expenses for the coming period, built on the accrual basis.
          - title: The budgeted balance sheet
            id: acc-budgeted-balance-sheet
            brief: An estimate of assets, liabilities and owner's equity at the end of the coming period.
          - title: Variance reports
            id: acc-variance-reports
            brief: Comparing budgeted and actual figures, and trends over several periods, shows favourable and unfavourable variances to explain.

      - title: Analysing performance
        id: vic-acc-u34-2-3
        points:
          - title: Profitability
            id: acc-profitability
            brief: Profitability is how well a business makes profit compared to its sales, assets and the owner's investment.
          - title: Profitability ratios
            id: acc-profitability-ratios
            brief: Return on owner's investment, return on assets, net profit margin and gross profit margin each compare profit with something else.
          - title: Liquidity
            id: acc-liquidity
            brief: Liquidity is the ability to pay debts as they fall due, measured by the working capital ratio and the quick asset ratio.
          - title: Efficiency ratios
            id: acc-efficiency-ratios
            brief: Asset turnover, inventory turnover, days receivable and days payable show how well the business uses its resources.
          - title: Non-financial information
            id: acc-non-financial-information
            brief: Customer satisfaction, staff turnover, product quality and reputation help explain the numbers and guide decisions.
          - title: Comparing performance
            id: acc-comparing-performance
            brief: Ratios mean most compared with past results, the budget and similar businesses, but differences in methods, timing and one-off events limit what they show.
          - title: Strategies to improve performance
            id: acc-strategies-improve-performance
            brief: Raising prices, cutting costs, managing inventory, collecting debts faster and selling idle assets can lift profit or cash.
