# Australian Curriculum English, Year 9: the Language, Literature and Literacy strands, 33 points.
# Follows ACARA's Australian Curriculum: English, Version 9.0, Year 9, checked on the official site
# (australiancurriculum.edu.au) in November 2026. Ministers approved Version 9.0 in April 2022 and ACARA published it in
# May 2022. Each state sets its own start: the ACT from 2024, Tasmania from 2023, the NT and WA (its own Western
# Australian Curriculum, adapted from it) from 2025, Queensland by the end of 2026, and South Australia's public schools
# (their own adapted version) by about 2027. ACARA has announced no new version for Years 7 to 10: the next full
# version is scheduled for approval in 2032.
# Each strand is a unit. Each chapter holds one sub-strand, or two or three small ones together, in the curriculum's
# order. Symbols in images (AC9E9LA07) sit with symbolism in literature, and creating hybrid literary texts
# (AC9E9LE06) with creating texts in Literacy. The codes are ACARA's content description codes.
# Schools choose their own texts, so no point names a set text or quotes one. Pure practice (giving a talk, publishing
# a piece) is taught as the ideas behind it. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-eng-9
subject: English
bank: eng
name: English, Year 9
about: Australian Curriculum, Year 9
short: English
years: [9]
place: [qld, sa, wa, tas, act, nt]
kind: english
syllabus: "Australian Curriculum: English, Version 9.0, Year 9"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [allusion, connotation, allegory, metonymy, bias, sentence fragment]

units:
  - title: Language
    chapters:
      - title: Language for interacting with others
        id: ac-eng-9-1-1
        points:
          - title: Language that gives power
            id: eng-language-that-gives-power
            codes: [AC9E9LA01]
            brief: Word choices such as titles, technical terms, commands and the inclusive we can give a speaker authority or make others feel part of a group.
          - title: Direct and indirect evaluation
            id: eng-direct-indirect-evaluation
            codes: [AC9E9LA02]
            brief: A writer can judge openly, such as calling a plan foolish, or indirectly, through hints, comparisons and loaded words that lead the reader to a view.
          - title: Allusion
            id: eng-allusion-2
            codes: [AC9E9LA02]
            brief: An allusion is a brief reference to a well-known person, story or event, such as calling a hard task a marathon, which brings that meaning into the text.
          - title: Evocative vocabulary
            id: eng-evocative-vocabulary
            codes: [AC9E9LA02]
            brief: Evocative words call up strong pictures and feelings, such as trudged instead of walked, and quietly carry the writer's judgement.

      - title: Text structure and organisation
        id: ac-eng-9-1-2
        points:
          - title: Subverting text conventions
            id: eng-subverting-text-conventions
            codes: [AC9E9LA03]
            brief: Authors sometimes break the usual structure of a genre, such as starting a story at the end, to surprise readers or make a point.
          - title: Combining modes in multimodal texts
            id: eng-combining-modes-multimodal-texts
            codes: [AC9E9LA03]
            brief: Multimodal texts combine words, images, sound and movement, and each mode adds meaning the others cannot.
          - title: Cohesion through pronouns and word chains
            id: eng-cohesion-through-pronouns-word
            codes: [AC9E9LA04]
            brief: Pronouns that refer back, and chains of related words, link sentences so a text reads as one connected whole.
          - title: Connectives that build an argument
            id: eng-connectives-that-build-argument
            codes: [AC9E9LA04]
            brief: Connectives such as furthermore, in contrast, therefore and despite this show how each idea adds to, opposes or follows from the last.

      - title: Language for expressing and developing ideas
        id: ac-eng-9-1-3
        points:
          - title: Sentence fragments for effect
            id: eng-sentence-fragments-effect
            codes: [AC9E9LA05]
            brief: A sentence fragment, or a dependent clause standing alone, breaks the usual rules on purpose to create emphasis, drama or a conversational voice.
          - title: Abstract nouns
            id: eng-abstract-nouns
            codes: [AC9E9LA06]
            brief: Abstract nouns name ideas and qualities, such as freedom or injustice, and they let a writer sum up a whole situation in one word.
          - title: Connotation and denotation
            id: eng-connotation-denotation
            codes: [AC9E9LA08]
            brief: Denotation is a word's dictionary meaning. Connotation is the feeling it carries, so slim and skinny mean much the same but feel different.
          - title: Vocabulary, mood and tone
            id: eng-vocabulary-mood-tone
            codes: [AC9E9LA08]
            brief: Word choices build the mood a reader feels and the tone, or attitude, the writer takes, such as playful, bitter or formal.
          - title: Punctuation for quoting and citing
            id: eng-punctuation-quoting-citing
            codes: [AC9E9LA09]
            brief: Quotation marks show borrowed words, an ellipsis shows words left out, square brackets show words changed, and a citation says where the words came from.

  - title: Literature
    chapters:
      - title: Literature and contexts, and responding to literature
        id: ac-eng-9-2-1
        points:
          - title: Representation of people and places
            id: eng-representation-people-places
            codes: [AC9E9LE01]
            brief: A representation is how a text portrays a person, group or place, and it is always shaped by the creator's choices and context.
          - title: Representation in First Nations Australian literature
            id: eng-representation-first-nations-australian
            codes: [AC9E9LE01]
            brief: First Nations Australian authors represent their own peoples, Country and histories, often challenging earlier representations made by others.
          - title: Personal response that develops
            id: eng-personal-response-that-develops
            codes: [AC9E9LE02]
            brief: A strong personal response compares first impressions of a text with what closer study of the whole text reveals.
          - title: Why readers prefer certain texts
            id: eng-readers-prefer-certain-texts
            codes: [AC9E9LE03]
            brief: Features such as genre, pace, characters readers care about and a distinctive voice explain why some texts appeal to particular readers.

      - title: Examining literature
        id: ac-eng-9-2-2
        points:
          - title: Evaluating literary style
            id: eng-evaluating-literary-style
            codes: [AC9E9LE04]
            brief: Readers judge an author's style by how well its features, such as sentence rhythm, imagery and voice, suit the text's purpose and appeal to readers.
          - title: Extended metaphor
            id: eng-extended-metaphor
            codes: [AC9E9LE05]
            brief: An extended metaphor carries one comparison through several lines or a whole text, such as treating life as a journey with roads and crossroads.
          - title: Metonymy
            id: eng-metonymy
            codes: [AC9E9LE05]
            brief: Metonymy names something by a thing closely linked to it, such as the crown for a king or queen, or Canberra for the federal government.
          - title: Allegory
            id: eng-allegory
            codes: [AC9E9LE05]
            brief: An allegory is a story whose characters and events stand for ideas or real events, so it carries a second, deeper meaning.
          - title: Symbolism in literature
            id: eng-symbolism-literature
            codes: [AC9E9LE05]
            brief: A symbol is an object, colour or setting that stands for an idea, such as a dove for peace, and it can gather meaning across a text.
          - title: Symbols in film and images
            id: eng-symbols-film-images
            codes: [AC9E9LA07]
            brief: Still and moving images use symbols, such as a broken clock or a closing door, to add meaning without words.

  - title: Literacy
    chapters:
      - title: Texts in context and interacting with others
        id: ac-eng-9-3-1
        points:
          - title: Representation in media texts
            id: eng-representation-media-texts
            codes: [AC9E9LY01]
            brief: News stories and advertisements represent people, places and events in ways that reflect the values and context of their makers.
          - title: How speakers position listeners
            id: eng-speakers-position-listeners
            codes: [AC9E9LY02]
            brief: Speakers use tone, emotive words, anecdotes and direct address to lead listeners to respond in a particular way.
          - title: Representing a perspective
            id: eng-representing-perspective
            codes: [AC9E9LY03]
            brief: A text shows a perspective through what it includes, what it leaves out and the words it uses, which can reveal bias.

      - title: Analysing ideas across texts
        id: ac-eng-9-3-2
        points:
          - title: Paragraph organisation and meaning
            id: eng-paragraph-organisation-meaning
            codes: [AC9E9LY04]
            brief: Where an author places an idea, such as first for impact or last to leave a lasting impression, changes its effect on the reader.
          - title: Comparing texts
            id: eng-comparing-texts
            codes: [AC9E9LY05]
            brief: Comparing two texts means finding how they treat the same idea alike and differently, and explaining why.
          - title: Fact, opinion and claims
            id: eng-fact-opinion-claims
            codes: [AC9E9LY05]
            brief: A fact can be checked, an opinion is a view, and a claim presented as fact still needs evidence before readers accept it.

      - title: Creating texts and word knowledge
        id: ac-eng-9-3-3
        points:
          - title: Writing critically
            id: eng-writing-critically
            codes: [AC9E9LY06]
            brief: Critical writing questions a text or idea, looking at whose views it serves and whose it leaves out, rather than just describing it.
          - title: Creating hybrid texts
            id: eng-creating-hybrid-texts
            codes: [AC9E9LE06]
            brief: Students can create hybrid literary texts, such as a story told through texts and photos, choosing structures and features to suit the audience.
          - title: Structuring a speech
            id: eng-structuring-speech
            codes: [AC9E9LY07]
            brief: A speech opens with a hook, signposts its main points, develops them with examples and closes with a memorable ending.
          - title: Spelling for effect
            id: eng-spelling-effect
            codes: [AC9E9LY08]
            brief: Writers bend spelling on purpose to show an accent, a character's way of speaking or humour, while standard spelling stays the norm.
