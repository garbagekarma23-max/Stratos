# VCE Foundation Mathematics, Units 3 and 4: number, data, money and measurement in work and life, 21 points.
# Drafted from the VCAA's VCE Mathematics Study Design, accreditation period 2023 to 2027. The structure follows the
# study design's areas of study, each a unit here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths). Run Foundation Mathematics Units 1 and 2 first, so shared points can
# be reused.
# In transition: the accreditation ends 31 December 2027. Check for a new study design before running this for 2028.

id: vic-mat-fnd-u34
subject: Mathematics
bank: mat
name: Foundation Mathematics, Units 3 and 4
about: VCE, Number, money, data and measurement at work
short: Foundation Mathematics
years: [12]
level: Units 3 and 4
place: vic
kind: maths
syllabus: VCE Mathematics Study Design (2023 to 2027), Foundation Mathematics Units 3 and 4
note: Follows the VCE Mathematics study design. Not made or endorsed by the VCAA.
chips: [linear model, loan, compound interest, statistical claim, Pythagoras]

units:
  - title: Algebra, number and structure
    chapters:
      - title: Formulas and linear relations
        id: vic-mat-fnd-u34-1-1
        points:
          - title: Rearranging formulas
            id: mat-rearranging-formulas
            brief: Making another variable the subject of a formula, such as finding hours from total pay.
          - title: Linear relations in context
            id: mat-linear-relations-context
            brief: A rule such as cost = 50 + 0.3 × km has a fixed part and a part that grows at a steady rate.
          - title: Graphing linear relations
            id: mat-graphing-linear-relations
            brief: Plotting a linear rule gives a straight line whose steepness is the rate and whose start is the fixed amount.
          - title: Comparing two plans
            id: mat-comparing-two-plans
            brief: Graphing two linear plans, such as two phone deals, shows where one becomes cheaper than the other.
          - title: Direct proportion
            id: mat-direct-proportion
            brief: When one amount doubles the other doubles too, such as cost and kilograms at a fixed price per kilogram.

  - title: Discrete mathematics
    chapters:
      - title: Financial decisions
        id: vic-mat-fnd-u34-2-1
        points:
          - title: Compound interest in everyday life
            id: mat-compound-interest-everyday-life
            brief: Interest added to the balance earns interest itself, so savings grow faster than with simple interest.
          - title: Loans and repayments
            id: mat-loans-repayments
            brief: The total paid on a loan is the repayment times the number of payments, and the interest is that less the amount borrowed.
          - title: Credit cards and buy now pay later
            id: mat-credit-cards-buy-now
            brief: Interest and late fees can make these much more expensive than the price paid.
          - title: Tax and payslips
            id: mat-tax-payslips
            brief: A payslip shows gross pay, tax withheld, superannuation and net pay.
          - title: Inflation and the cost of living
            id: mat-inflation-cost-living
            brief: When prices rise, the same income buys less, so a pay rise below inflation is a cut in real terms.
          - title: Comparing costs of owning and renting
            id: mat-comparing-costs-owning-renting
            brief: Weighing up buying against renting a car or house means comparing total costs over time, not just the price.

  - title: Data analysis, probability and statistics
    chapters:
      - title: Statistics in the news and at work
        id: vic-mat-fnd-u34-3-1
        points:
          - title: Statistical claims
            id: mat-statistical-claims
            brief: Checking a claim means asking who collected the data, how, from how many people, and whether it supports the claim.
          - title: Comparing groups with statistics
            id: mat-comparing-groups-with-statistics
            brief: Comparing medians, means and spreads of two groups, such as wages in two jobs.
          - title: Percentage change in data
            id: mat-percentage-change-data
            brief: Percentage change is the change divided by the starting value, times 100.
          - title: Two-way tables in context
            id: mat-two-way-tables-context
            brief: Tables that sort people by two categories, such as age group and transport used, read as counts or percentages.
          - title: Risk and chance
            id: mat-risk-chance
            brief: Comparing chances, such as 1 in 50 and 3%, by writing them the same way.

  - title: Space and measurement
    chapters:
      - title: Measurement at work
        id: vic-mat-fnd-u34-4-1
        points:
          - title: Pythagoras' theorem in practice
            id: mat-pythagoras-theorem-practice
            brief: Finding the length of a ladder, a ramp or a diagonal brace in a right-angled triangle.
          - title: Area and volume for jobs
            id: mat-area-volume-jobs
            brief: Working out paint, tiles, concrete or water needed, allowing for waste.
          - title: Accuracy in measurement
            id: mat-accuracy-measurement
            brief: Every measurement has an error of up to half the smallest unit, which can add up across a job.
          - title: Rates in practice
            id: mat-rates-practice
            brief: Speed, fuel use per 100 km and flow rates, and using them to plan time and cost.
          - title: Location and navigation
            id: mat-location-navigation
            brief: Grid references, compass directions and scale to plan a route on a map.
