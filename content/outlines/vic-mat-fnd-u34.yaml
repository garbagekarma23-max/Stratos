# VCE Foundation Mathematics, Units 3 and 4: number, data, money and measurement in work and life, 32 points.
# Checked against the VCAA's VCE Mathematics Study Design, accredited from 2023, in October 2026. Units 3 and 4 are
# taught as a sequence, so each area of study is a unit here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths). Run Foundation Mathematics Units 1 and 2 first, so shared points can
# be reused.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-mat-fnd-u34
subject: Mathematics
bank: mat
name: Foundation Mathematics, Units 3 and 4
about: VCE, Number, money, data and measurement at work
short: Foundation Mathematics
years: [12]
level: Units 3 and 4
place: vic
kind: maths
syllabus: VCE Mathematics Study Design (from 2023), Foundation Mathematics Units 3 and 4
note: Follows the VCE Mathematics study design. Not made or endorsed by the VCAA.
chips: [linear model, loan, compound interest, statistical claim, Pythagoras]

units:
  - title: Algebra, number and structure
    chapters:
      - title: Formulas and linear relations
        id: vic-mat-fnd-u34-1-1
        points:
          - title: Rearranging formulas
            id: mat-rearranging-formulas
            brief: Making another variable the subject of a formula, such as finding hours from total pay.
          - title: Linear relations in context
            id: mat-linear-relations-context
            brief: A rule such as cost = 50 + 0.3 × km has a fixed part and a part that grows at a steady rate.
          - title: Graphing linear relations
            id: mat-graphing-linear-relations
            brief: Plotting a linear rule gives a straight line whose steepness is the rate and whose start is the fixed amount.
          - title: Break-even points
            id: mat-comparing-two-plans
            brief: Graphing or solving two linear rules together, such as cost and income, finds the break-even point where they are equal.
          - title: Direct and indirect variation
            id: mat-direct-proportion
            brief: In direct variation both amounts grow together, such as cost and kilograms. In indirect variation one falls as the other rises, such as speed and travel time.

      - title: Estimation and accuracy
        id: vic-mat-fnd-u34-1-2
        points:
          - title: Significant figures and rounding
            id: mat-significant-figures-rounding
            brief: Rounding to a number of significant figures or decimal places to suit the job.
          - title: Quick estimates
            id: mat-quick-estimates
            brief: Leading-digit estimates, interval estimates and rounding up or down (ceiling and floor) give fast, sensible answers.
          - title: Percentage error
            id: mat-percentage-error
            brief: The error as a percentage of the true value shows how far off an estimate or measurement is.

  - title: Data analysis, probability and statistics
    chapters:
      - title: Collecting and showing data
        id: vic-mat-fnd-u34-3-1
        points:
          - title: Planning data collection
            id: mat-planning-data-collection
            brief: Deciding what data to collect, from whom, how and why, so it suits its purpose and audience.
          - title: Statistical claims
            id: mat-statistical-claims
            brief: Checking a claim means asking who collected the data, how and from how many, and spotting errors and misleading uses of statistics.
          - title: Tables and spreadsheets
            id: mat-two-way-tables-context
            brief: Building tables and spreadsheets to organise data, including tables that sort people by two categories.
          - title: Modern graph types
            id: mat-modern-graph-types
            brief: Bubble charts, radar charts, heat maps, sunburst, Mekko and stacked area charts, and when each suits the data.

      - title: Analysing data
        id: vic-mat-fnd-u34-2-2
        points:
          - title: Comparing groups with statistics
            id: mat-comparing-groups-with-statistics
            brief: Comparing medians, means, percentiles and standard deviations of two groups, such as wages in two jobs.
          - title: Cumulative frequency and percentiles
            id: mat-cumulative-frequency-percentiles
            brief: A running total of frequencies shows how many values fall below a point, and percentiles mark where a value sits.
          - title: Long-run data and relative frequency
            id: mat-risk-chance
            brief: Relative frequencies from long-term data, such as climate or disease records, estimate how likely an event is.
          - title: Predicting from data
            id: mat-predicting-from-data
            brief: Reading values within a data range (interpolation) is safer than predicting beyond it (extrapolation).

  - title: Discrete mathematics
    chapters:
      - title: Managing money
        id: vic-mat-fnd-u34-2-1
        points:
          - title: Investments and compound interest
            id: mat-compound-interest-everyday-life
            brief: Interest added to the balance earns interest itself, so investments grow faster than with simple interest.
          - title: Loans and repayments
            id: mat-loans-repayments
            brief: The total paid on a loan is the repayment times the number of payments, and the interest is that less the amount borrowed.
          - title: Credit and debit
            id: mat-credit-cards-buy-now
            brief: Debit spends your own money. Credit cards and buy now pay later borrow it, and interest and late fees can cost far more than the price.
          - title: Debt consolidation
            id: mat-debt-consolidation
            brief: Combining several debts into one loan can cut interest and payments, but may stretch the time and the total paid.
          - title: Comparing costs of owning and renting
            id: mat-comparing-costs-owning-renting
            brief: Weighing up buying against renting a car or house means comparing total costs over time, not just the price.

      - title: Tax, products and trends
        id: vic-mat-fnd-u34-3-2
        points:
          - title: Personal and business tax
            id: mat-tax-payslips
            brief: Income tax scales, the Medicare levy, superannuation and council rates for people, and company tax for businesses.
          - title: GST, invoices and BAS
            id: mat-gst-invoices-bas
            brief: Businesses add GST to invoices and report what they collected and paid on a business activity statement.
          - title: Comparing insurance
            id: mat-comparing-insurance
            brief: Comparing premiums, excesses and cover across insurance policies to choose one.
          - title: Inflation and the cost of living
            id: mat-inflation-cost-living
            brief: When prices rise, the same income buys less, so a pay rise below inflation is a cut in real terms.
          - title: Financial risk
            id: mat-financial-risk
            brief: Investments and loans carry risk, from a single job loss to a national recession, and spreading money reduces it.
          - title: Reading financial trends
            id: mat-reading-financial-trends
            brief: Data on the gender pay gap, careers, exchange rates, share prices and recessions shows how money changes over time.

  - title: Space and measurement
    chapters:
      - title: Measurement at work
        id: vic-mat-fnd-u34-4-1
        points:
          - title: Transformations and symmetry
            id: mat-transformations-symmetry
            brief: Moving, flipping, turning and resizing shapes, and spotting symmetry, in designs, plans and everyday objects.
          - title: Scale models and plans
            id: mat-scale-models-plans
            brief: Enlarging or reducing two- and three-dimensional plans and models by a scale factor.
          - title: Derived and non-metric measures
            id: mat-rates-practice
            brief: Speed, fuel use per 100 km, flow rates and measures still used in trades, such as inches, and converting between them.
          - title: Area and volume for jobs
            id: mat-area-volume-jobs
            brief: Working out perimeter, area, surface area and volume of compound shapes, such as paint, tiles or concrete needed, allowing for waste.
          - title: Tolerance, accuracy and precision
            id: mat-accuracy-measurement
            brief: Every measurement has an error. Tolerance is the error allowed, accuracy is closeness to the true value, and precision is how fine the measure is.
