# Victorian Curriculum Economics and Business, Levels 7 and 8: scarcity and markets, business and entrepreneurship,
# work, and consumer and financial literacy, 58 points.
# Follows the Victorian Curriculum F-10 Version 2.0, Economics and Business, Levels 7 and 8 (VCAA), checked on the
# VCAA's F-10 website in November 2026. Version 2.0 was published in June 2024 and replaces Version 1.0 (2016). Schools
# could use it from 2025, and Victorian government schools must teach it from 2026 (Catholic and independent schools
# set their own timing). The Version 1.0 website closes on 31 December 2026. No newer version is announced.
# VC2.0 sets Economics and Business in bands of two levels (it starts at Levels 5 and 6), so this file covers Levels 7
# and 8 together.
# Structure: each sub-strand of Knowledge and Understanding is a unit (Economic literacy, Business and
# entrepreneurship, Work, Consumer and financial literacy), with its content descriptions grouped into chapters. The
# Skills strand is the last unit, kept to the ideas behind the skills (questions, sources, graphs and weighing costs and
# benefits). There are no options to pick in this band.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-ecb-78
subject: Economics and Business
bank: ecb
name: Economics and Business, Levels 7 and 8
about: Victorian Curriculum 2.0, Levels 7 and 8
short: Economics and Business
years: [7, 8]
level: Levels 7 and 8
place: vic
kind: standard
syllabus: "Victorian Curriculum F-10 Version 2.0: Economics and Business, Levels 7 and 8"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [opportunity cost, supply and demand, entrepreneur, scams, budgeting]

units:
  - title: Economic literacy
    chapters:
      - title: Scarcity and choice
        id: vic-ecb-78-1-1
        points:
          - title: Needs and wants
            id: ecb-needs-wants-vic
            brief: Needs are things people must have to survive, such as food and shelter. Wants are things people would like but can live without.
            codes: [VC2HE8K01]
          - title: Economic resources
            id: ecb-economic-resources
            brief: Goods and services are made from natural resources (land, water, minerals), human resources (people's work and skills) and capital resources (tools, machines and buildings).
            codes: [VC2HE8K01]
          - title: The basic economic problem
            id: ecb-basic-economic-problem
            brief: People's wants are unlimited but the resources to meet them are scarce, so individuals, businesses and governments must choose how to use them.
            codes: [VC2HE8K01]
          - title: The three economic questions
            id: ecb-three-economic-questions-vic
            brief: Every society must decide what to produce, how to produce it and who gets what is produced.
            codes: [VC2HE8K01]
          - title: Opportunity cost
            id: ecb-opportunity-cost-vic
            brief: The opportunity cost of a choice is the next best option given up. Spending Saturday at work means giving up time with friends, for example.
            codes: [VC2HE8K01]
          - title: Weighing costs and benefits
            id: ecb-weighing-costs-benefits
            brief: A sensible economic decision compares what an option gives (its benefits) with what it takes (its costs, including opportunity cost) and picks the one with the greatest net benefit.
            codes: [VC2HE8K01]
          - title: Incentives
            id: ecb-incentives
            brief: An incentive is something that encourages a choice, such as a discount or a reward. A disincentive, such as a fine or a tax, discourages one.
            codes: [VC2HE8K01]

      - title: How markets work
        id: vic-ecb-78-1-2
        points:
          - title: What a market is
            id: ecb-market-vic
            brief: A market is anywhere buyers and sellers come together to trade, from a farmers market to an online store or the share market.
            codes: [VC2HE8K02]
          - title: Demand
            id: ecb-demand-vic
            brief: Demand is how much of a product buyers are willing and able to buy at each price. When the price rises, people buy less, and when it falls, they buy more.
            codes: [VC2HE8K02]
          - title: Supply
            id: ecb-supply-vic
            brief: Supply is how much of a product sellers will offer at each price. A higher price makes selling more worthwhile, so sellers offer more.
            codes: [VC2HE8K02]
          - title: Equilibrium price
            id: ecb-equilibrium-price-vic
            brief: The market price settles where the amount buyers want equals the amount sellers offer. On a graph it is where the demand and supply curves cross.
            codes: [VC2HE8K02]
          - title: Shortages and surpluses
            id: ecb-shortages-surpluses
            brief: If the price is below equilibrium, buyers want more than is offered and the price rises. If it is above, unsold stock builds up and the price falls.
            codes: [VC2HE8K02]
          - title: The price mechanism
            id: ecb-price-mechanism-vic
            brief: Rising prices signal businesses to make more of a product and buyers to use less, so prices steer scarce resources to where they are most wanted.
            codes: [VC2HE8K02]
          - title: Consumer sovereignty
            id: ecb-consumer-sovereignty
            brief: In a free market, consumers decide what gets made by what they choose to buy. Businesses that ignore what consumers want lose sales.
            codes: [VC2HE8K02]

  - title: Business and entrepreneurship
    chapters:
      - title: Why businesses exist
        id: vic-ecb-78-2-1
        points:
          - title: The purposes of business
            id: ecb-purposes-business
            brief: Businesses exist to provide goods and services people want and to make a profit for their owners. Some, such as social enterprises, also aim to solve a social or environmental problem.
            codes: [VC2HE8K03]
          - title: Business goals
            id: ecb-business-goals
            brief: Businesses set goals such as making a profit, growing, winning a bigger share of the market, serving customers well and acting sustainably.
            codes: [VC2HE8K03]
          - title: Business ownership structures
            id: ecb-business-ownership-structures
            brief: A sole trader is owned by one person, a partnership by two or more, and a company is a separate legal entity owned by shareholders. Owners of a sole trader or partnership can lose their own assets if it fails.
            codes: [VC2HE8K03]
          - title: Goods and services businesses
            id: ecb-goods-services-businesses
            brief: Businesses can be grouped by what they sell, goods you can touch or services done for you, and by industry, from primary (farming, mining) to secondary (manufacturing) and tertiary (services).
            codes: [VC2HE8K03]
          - title: Target markets
            id: ecb-target-markets
            brief: A target market is the group of customers a business aims to sell to, described by things such as age, income, location and interests.
            codes: [VC2HE8K03]
          - title: Spotting a market opportunity
            id: ecb-spotting-market-opportunity
            brief: A market opportunity is an unmet need or gap a business can fill. Businesses find them through market research, new technology and changes in how people live.
            codes: [VC2HE8K03]

      - title: Entrepreneurship
        id: vic-ecb-78-2-2
        points:
          - title: What an entrepreneur does
            id: ecb-entrepreneur-does
            brief: An entrepreneur spots an opportunity, takes the risk of starting a business and brings resources together to make something new or better.
            codes: [VC2HE8K04]
          - title: Entrepreneurship and business success
            id: ecb-entrepreneurship-business-success
            brief: Traits such as creativity, persistence, willingness to take risks and learning from failure help entrepreneurs turn an idea into a lasting business.
            codes: [VC2HE8K04]
          - title: Innovation
            id: ecb-innovation-vic
            brief: Innovation is a new product, service or way of working. It helps a business stand out, cut costs and keep customers.
            codes: [VC2HE8K04]
          - title: Aboriginal and Torres Strait Islander businesses
            id: ecb-aboriginal-torres-strait-islander
            brief: Aboriginal and Torres Strait Islander-owned businesses are a growing sector across many industries, often combining profit with goals for community, culture and Country, with buyers such as government able to seek them out.
            codes: [VC2HE8K04]
          - title: Risk and reward in starting a business
            id: ecb-risk-reward-starting-business
            brief: Starting a business can bring profit, independence and pride, but risks losing money and time, and many new businesses close within a few years.
            codes: [VC2HE8K04]

  - title: Work
    chapters:
      - title: Work and income
        id: vic-ecb-78-3-1
        points:
          - title: Why people work
            id: ecb-people-work-vic
            brief: People work for income, but also for satisfaction, purpose, skills, friendships and a sense of identity.
            codes: [VC2HE8K05]
          - title: Wages and salaries
            id: ecb-wages-salaries
            brief: A wage is paid for each hour worked, while a salary is a fixed amount for a year, paid in parts. Both are income from employment.
            codes: [VC2HE8K05]
          - title: Other sources of income
            id: ecb-other-sources-income
            brief: Australians also earn income from running a business (profit), interest on savings, dividends from shares, rent from property and government payments such as Youth Allowance.
            codes: [VC2HE8K05]
          - title: Types of employment
            id: ecb-types-employment
            brief: Full-time and part-time workers have regular hours and paid leave. Casual workers have no guaranteed hours or paid leave but get a higher hourly rate. Contractors work for themselves.
            codes: [VC2HE8K05]
          - title: Paid and unpaid work
            id: ecb-paid-unpaid-work
            brief: Not all work is paid. Caring for family, housework and volunteering are unpaid but add a great deal to the community.
            codes: [VC2HE8K05]

      - title: The changing nature of work
        id: vic-ecb-78-3-2
        points:
          - title: From making goods to providing services
            id: ecb-from-making-goods-providing
            brief: Most Australians once worked in farming or factories. Today most work in services, such as health care, education, retail and professional work.
            codes: [VC2HE8K06]
          - title: Technology and automation
            id: ecb-technology-automation
            brief: Machines, robots and artificial intelligence take over some tasks, removing some jobs while creating others that need new skills.
            codes: [VC2HE8K06]
          - title: The gig economy
            id: ecb-gig-economy
            brief: In the gig economy, people do short jobs through apps, such as food delivery or ride sharing. It is flexible but often lacks steady pay, leave and super.
            codes: [VC2HE8K06]
          - title: Flexible and remote work
            id: ecb-flexible-remote-work
            brief: More people now work from home, part-time or at flexible hours, which can help balance life and work but can blur the line between them.
            codes: [VC2HE8K06]
          - title: The future of work
            id: ecb-future-work
            brief: Jobs are expected to keep changing, so skills such as problem solving, digital skills and adapting through lifelong learning will matter more.
            codes: [VC2HE8K06]

  - title: Consumer and financial literacy
    chapters:
      - title: Consumer rights and responsibilities
        id: vic-ecb-78-4-1
        points:
          - title: The Australian Consumer Law
            id: ecb-australian-consumer-law
            brief: The Australian Consumer Law protects buyers across the country. It guarantees products are safe, work as they should and match their description.
            codes: [VC2HE8K07]
          - title: Repair, replace or refund
            id: ecb-repair-replace-or-refund
            brief: If a product has a major fault, the buyer can choose a refund or replacement; for a minor fault, the seller can choose to repair it. A "no refunds" sign cannot remove these rights.
            codes: [VC2HE8K07]
          - title: Misleading and deceptive conduct
            id: ecb-misleading-deceptive-conduct
            brief: Businesses must not mislead consumers with false claims, fake prices or hidden fees. The ACCC and Consumer Affairs Victoria enforce the rules.
            codes: [VC2HE8K07]
          - title: Consumer responsibilities
            id: ecb-consumer-responsibilities
            brief: Consumers should read terms before agreeing, keep receipts, use products as intended and complain through the right channels.
            codes: [VC2HE8K07]
          - title: Ethical business behaviour
            id: ecb-ethical-business-behaviour
            brief: Beyond what the law requires, ethical businesses treat workers fairly, tell the truth and care for the environment, which can win customers' trust.
            codes: [VC2HE8K07]

      - title: Smart consumers and scams
        id: vic-ecb-78-4-2
        points:
          - title: Comparing before you buy
            id: ecb-comparing-before-you-buy
            brief: Smart consumers compare prices and quality, use unit pricing to compare sizes, read reviews and check the full cost, including fees and delivery.
            codes: [VC2HE8K08]
          - title: How advertising persuades
            id: ecb-advertising-persuades
            brief: Ads use techniques such as celebrity endorsement, limited-time offers, bandwagon appeals and influencer posts to make people want to buy.
            codes: [VC2HE8K08]
          - title: Common financial scams
            id: ecb-common-financial-scams
            brief: Scams include phishing messages asking for passwords, fake online shops, fake prizes and offers of quick riches. Young people are often targeted on social media.
            codes: [VC2HE8K08]
          - title: Spotting and avoiding scams
            id: ecb-spotting-avoiding-scams
            brief: Warning signs include pressure to act fast, requests for gift cards or personal details and deals too good to be true. Check with Scamwatch and never share passwords or codes.
            codes: [VC2HE8K08]

      - title: Tax
        id: vic-ecb-78-4-3
        points:
          - title: What tax is and why we pay it
            id: ecb-tax-we-pay-it
            brief: Tax is money people and businesses must pay to government. It funds services everyone shares, such as schools, hospitals, roads and defence.
            codes: [VC2HE8K09]
          - title: Income tax
            id: ecb-income-tax-vic
            brief: Income tax is taken from what people earn. Australia's system is progressive, so higher incomes pay a higher rate, and the first $18,200 a year is tax free.
            codes: [VC2HE8K09]
          - title: The goods and services tax
            id: ecb-goods-services-tax-vic
            brief: The GST is a 10 per cent tax added to most goods and services. Basic food, most health care and education are exempt.
            codes: [VC2HE8K09]
          - title: Lodging a tax return
            id: ecb-lodging-tax-return
            brief: Workers need a tax file number. Each year they lodge a tax return with the Australian Taxation Office, which works out whether they paid too much or too little.
            codes: [VC2HE8K09]
          - title: How tax revenue is spent
            id: ecb-tax-revenue-spent
            brief: The biggest areas of government spending are social security and welfare, health, education and defence, along with roads and other infrastructure.
            codes: [VC2HE8K09]

      - title: Financial planning
        id: vic-ecb-78-4-4
        points:
          - title: Setting financial goals
            id: ecb-setting-financial-goals
            brief: Financial goals can be short term (new shoes), medium term (a laptop) or long term (a car or home). Clear goals with an amount and a date are easier to reach.
            codes: [VC2HE8K10]
          - title: Making a budget
            id: ecb-making-budget
            brief: A budget lists income and expenses so spending stays below income. Fixed expenses stay the same each time, while variable ones change.
            codes: [VC2HE8K10]
          - title: Saving and interest
            id: ecb-saving-interest-vic
            brief: Money saved in a bank earns interest. With compound interest, interest is earned on past interest too, so savings grow faster the longer they are left.
            codes: [VC2HE8K10]
          - title: Debt and credit
            id: ecb-debt-credit
            brief: Borrowing through credit cards, loans or buy now pay later costs more than paying upfront when fees and interest are added, and missed payments can harm a credit record.
            codes: [VC2HE8K10]

  - title: Economics and business skills
    chapters:
      - title: Investigating issues
        id: vic-ecb-78-5-1
        points:
          - title: Questions for an investigation
            id: ecb-questions-investigation
            brief: A good investigation question about an economic or business issue is focused and open, asking how or why rather than something answered by yes or no.
            codes: [VC2HE8S01]
          - title: Checking sources
            id: ecb-checking-sources
            brief: Before using information, check who made it, when, why and whether other sources agree, to judge whether it is accurate and fair.
            codes: [VC2HE8S02, VC2HE8S04]
          - title: Reading economic graphs
            id: ecb-reading-economic-graphs
            brief: Line graphs show change over time, bar graphs compare amounts, and models such as supply and demand show how two things affect each other.
            codes: [VC2HE8S03]
          - title: Cause and effect in economics
            id: ecb-cause-effect-economics-vic
            brief: Economic events have causes and effects that chain together, such as drought cutting crop supply and so raising food prices.
            codes: [VC2HE8S03]
          - title: Analysing a response to an issue
            id: ecb-analysing-response-issue
            brief: To judge a response to an economic or business issue, list its likely costs and benefits for each group affected and weigh them up.
            codes: [VC2HE8S05]
