# Australian Curriculum History, Year 10: the modern world and Australia (1918 to the present), with the year's
# overview and the historical concepts and skills, then the Second World War and Building modern Australia, 40 points.
# Follows ACARA's Australian Curriculum: Humanities and Social Sciences, History 7-10, Version 9.0 (History curriculum
# content, Years 7-10), checked on australiancurriculum.edu.au in November 2026. Version 9.0 was approved in April 2022
# and released for use from 2023; each state and territory sets when its schools start it (Queensland schools teach
# every v9 learning area by the end of 2027). No newer version is announced. Western Australia and South Australia
# teach their own versions built on it.
# The first unit is the year's overview with the Historical knowledge and skills strand's concepts and skills, taught
# as ideas. Every school studies the Second World War and Building modern Australia (post-1945): a unit each. The
# globalising world is an option; this outline takes only its Universal Declaration of Human Rights point, in the rights
# chapter, and a chapter on another global influence (popular culture, the environment movement, migration) can be
# added later. The Holocaust, prisoners of war, the Stolen Generations and First Nations Australians' rights are taught
# plainly and the pipeline sends them to the owner. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-his-10
subject: History
bank: his
name: History, Year 10
about: "Australian Curriculum, Year 10: The modern world and Australia"
short: History
years: [10]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: History, Version 9.0, Year 10"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [Great Depression, Kokoda, Holocaust, 1967 referendum, Mabo, Vietnam War]

units:
  - title: Overview and historical skills
    chapters:
      - title: The world between the wars and after
        id: ac-his-10-1-1
        points:
          - title: The Treaty of Versailles
            id: his-treaty-versailles
            brief: The 1919 peace treaty blamed Germany for the First World War, took its land and colonies, cut its army and made it pay reparations, leaving deep resentment.
          - title: The Great Depression in Australia
            id: his-great-depression-australia
            brief: After the 1929 Wall Street crash, prices for Australia's exports fell and loans dried up. By 1932 nearly a third of Australian workers had no job.
          - title: The rise of fascism
            id: his-rise-fascism
            brief: Fascist leaders such as Mussolini in Italy and Hitler in Germany used fear, nationalism and propaganda to win power, then crushed opposition and built up their armies.
          - title: The Cold War
            id: his-cold-war
            brief: After 1945 the United States and the Soviet Union, with their allies, competed for power and influence without fighting each other directly, until the Soviet Union broke up in 1991.
            codes: [AC9HH10K07]

      - title: Evaluating evidence and arguments
        id: ac-his-10-1-2
        points:
          - title: Oral history as evidence
            id: his-oral-history-as-evidence
            brief: Recorded interviews with people who lived through events give personal detail missing elsewhere, but memories fade and change, so they are checked against other sources.
            codes: [AC9HH10S02, AC9HH10S04]
          - title: Synthesising several sources
            id: his-synthesising-several-sources
            brief: Synthesising means combining evidence from several sources into one explanation, showing where they agree, where they differ and why.
            codes: [AC9HH10S08]
          - title: Judging a historian's argument
            id: his-judging-historian-s-argument
            brief: Weigh a historian's interpretation by the evidence it uses, what it leaves out, when it was written and what questions or values shaped it.
            codes: [AC9HH10S07]

  - title: The Second World War
    chapters:
      - title: Causes and course of the war
        id: ac-his-10-2-1
        points:
          - title: Causes of the Second World War
            id: his-causes-second-world-war
            brief: Resentment of the Treaty of Versailles, the Depression, the aggression of Germany, Italy and Japan, and Britain and France's policy of appeasement all led to war.
            codes: [AC9HH10K01]
          - title: The war begins in Europe
            id: his-war-begins-europe
            brief: Germany invaded Poland on 1 September 1939, and Australia joined Britain at war two days later. Blitzkrieg attacks conquered much of Europe by 1940.
            codes: [AC9HH10K01]
          - title: The war in the Pacific
            id: his-war-pacific
            brief: Japan's attack on Pearl Harbor in December 1941 brought the United States into the war, and Japan swept south through South-East Asia towards Australia.
            codes: [AC9HH10K01, AC9HH10K03]
          - title: Turning points of the war
            id: his-turning-points-war
            brief: Defeats at Midway and Stalingrad in 1942 and 1943 stopped Japan and Germany advancing, and the D-Day landings in 1944 opened a second front in western Europe.
            codes: [AC9HH10K03]
          - title: The Holocaust
            id: his-holocaust
            brief: Nazi Germany carried out the planned murder of about six million Jews, along with Roma, disabled people and others, in ghettos, mass shootings and death camps.
            codes: [AC9HH10K03]
          - title: The atomic bombs and the end of the war
            id: his-atomic-bombs-end-war
            brief: The United States dropped atomic bombs on Hiroshima and Nagasaki in August 1945, and Japan surrendered days later. Historians still debate whether the bombs were needed.
            codes: [AC9HH10K03, AC9HH10K06]

      - title: Australians in the Second World War
        id: ac-his-10-2-2
        points:
          - title: The siege of Tobruk
            id: his-siege-tobruk
            brief: In 1941 Australian troops held the Libyan port of Tobruk against German and Italian forces for months, earning the name Rats of Tobruk.
            codes: [AC9HH10K02]
          - title: The fall of Singapore and prisoners of war
            id: his-fall-singapore-prisoners-war
            brief: Singapore fell to Japan in February 1942 and about 15,000 Australians were captured. Thousands of prisoners died from starvation, disease and brutality, as on the Burma-Thailand Railway.
            codes: [AC9HH10K02]
          - title: The bombing of Darwin
            id: his-bombing-darwin
            brief: On 19 February 1942 Japanese aircraft bombed Darwin, killing more than 230 people, the first of many raids on northern Australia.
            codes: [AC9HH10K02]
          - title: The Kokoda Track
            id: his-kokoda-track
            brief: In 1942 Australian soldiers, helped by Papuan carriers, fought the Japanese along the Kokoda Track in Papua and pushed them back from Port Moresby.
            codes: [AC9HH10K02]

      - title: The home front and the war's legacy
        id: ac-his-10-2-3
        points:
          - title: Wartime government controls
            id: his-wartime-government-controls
            brief: The government rationed food and clothing, directed people into war work, censored news and interned people seen as enemy aliens.
            codes: [AC9HH10K04]
          - title: Women's changing roles in wartime
            id: his-women-s-changing-roles
            brief: Women joined the armed services and the Land Army and took jobs in factories once held by men, though usually for lower pay and only until the war ended.
            codes: [AC9HH10K04]
          - title: First Nations Australians in the Second World War
            id: his-first-nations-australians-second
            brief: Thousands of First Nations Australians served, including in the Torres Strait Light Infantry Battalion, often for less pay and without equal rights at home.
            codes: [AC9HH10K04]
          - title: Turning to the United States
            id: his-turning-united-states
            brief: With Britain unable to defend it, Prime Minister Curtin said in 1941 that Australia looked to America. The ANZUS treaty of 1951 made the alliance formal.
            codes: [AC9HH10K05]
          - title: Remembering the Second World War
            id: his-remembering-second-world-war
            brief: Anzac Day, memorials and the growth of Kokoda as a place of pilgrimage keep the war in memory, while historians debate what it means for Australian identity.
            codes: [AC9HH10K06]

  - title: Building modern Australia
    chapters:
      - title: Post-war Australia and the Cold War
        id: ac-his-10-3-1
        points:
          - title: Populate or perish
            id: his-populate-or-perish
            brief: After the war, Arthur Calwell's immigration program brought in displaced people from Europe and then other migrants, to build the population and workforce.
            codes: [AC9HH10K05, AC9HH10K08]
          - title: The end of the White Australia policy
            id: his-end-white-australia-policy
            brief: The policy was eased from 1966 and ended in 1973. Multiculturalism followed, and refugees arrived from Vietnam after 1975.
            codes: [AC9HH10K08]
          - title: Fear of communism in Australia
            id: his-fear-communism-australia
            brief: In the Cold War, Prime Minister Menzies tried to ban the Communist Party, but voters rejected the change at a referendum in 1951.
            codes: [AC9HH10K07]
          - title: The Vietnam War and conscription
            id: his-vietnam-war-conscription
            brief: To stop the spread of communism, Australia sent military advisers to Vietnam from 1962 and combat troops from 1965, including young men conscripted by a birthday ballot.
            codes: [AC9HH10K07]
          - title: The anti-war movement
            id: his-anti-war-movement
            brief: Opposition to conscription and the war grew into mass moratorium marches in 1970, and the last combat troops came home in the early 1970s.
            codes: [AC9HH10K07, AC9HH10K20]

      - title: First Nations Australians' rights before 1967
        id: ac-his-10-3-2
        points:
          - title: Protection and assimilation
            id: his-protection-assimilation
            brief: Protection policies controlled First Nations Australians' lives. Assimilation, from the 1930s, expected them to give up their cultures and live like white Australians.
            codes: [AC9HH10K09]
          - title: The Stolen Generations
            id: his-stolen-generations
            brief: For much of the 20th century, governments and churches removed First Nations children from their families, causing harm that continues across generations.
            codes: [AC9HH10K09]
          - title: The Day of Mourning
            id: his-day-mourning
            brief: On 26 January 1938, as others celebrated 150 years since the First Fleet, Aboriginal activists such as William Cooper, Jack Patten and William Ferguson met in Sydney to protest and demand equal rights.
            codes: [AC9HH10K09, AC9HH10K10]
          - title: The Freedom Ride
            id: his-freedom-ride
            brief: In 1965 Charles Perkins led university students on a bus tour of New South Wales towns to expose racial segregation in pools, cinemas and shops.
            codes: [AC9HH10K10, AC9HH10K11]
          - title: The 1967 referendum
            id: his-1967-referendum
            brief: Over 90 per cent voted to let the Commonwealth make laws for First Nations Australians and to count them in the census. It did not grant citizenship or the vote.
            codes: [AC9HH10K11]

      - title: Land rights and recognition
        id: ac-his-10-3-3
        points:
          - title: The Wave Hill walk-off
            id: his-wave-hill-walk-off
            brief: In 1966 Vincent Lingiari led Gurindji workers off Wave Hill station over pay and conditions. Their strike became a claim for land, returned to them in 1975.
            codes: [AC9HH10K11]
          - title: The Aboriginal Tent Embassy
            id: his-aboriginal-tent-embassy
            brief: In 1972 activists set up a tent on the lawn of Parliament House in Canberra to demand land rights. It became a lasting symbol of protest.
            codes: [AC9HH10K11, AC9HH10K13]
          - title: Mabo and native title
            id: his-mabo-native-title
            brief: In 1992 the High Court ruled for Eddie Koiki Mabo and the Meriam people that native title had survived colonisation, rejecting terra nullius. The Native Title Act followed.
            codes: [AC9HH10K13]
          - title: Bringing Them Home and the Apology
            id: his-bringing-them-home-apology
            brief: The 1997 Bringing Them Home report told of the Stolen Generations, and in 2008 Prime Minister Rudd apologised to them on behalf of the nation.
            codes: [AC9HH10K13]

      - title: Rights for women and for all
        id: ac-his-10-3-4
        points:
          - title: The Universal Declaration of Human Rights
            id: his-universal-declaration-human-rights
            brief: Adopted by the United Nations in 1948 after the war's horrors, it set out rights for every person. Australia's H. V. Evatt led the General Assembly that passed it.
            codes: [AC9HH10K15]
          - title: The women's movement
            id: his-women-s-movement
            brief: From the late 1960s, the women's liberation movement campaigned for equal rights in work, education, law and family life, and against discrimination.
            codes: [AC9HH10K12]
          - title: Equal pay and the marriage bar
            id: his-equal-pay-marriage-bar
            brief: Married women could keep federal public service jobs from 1966, and equal pay decisions in 1969 and 1972 set equal pay for work of equal value.
            codes: [AC9HH10K12]
          - title: Anti-discrimination laws
            id: his-anti-discrimination-laws
            brief: The Racial Discrimination Act of 1975 and the Sex Discrimination Act of 1984 made unfair treatment because of race or sex against the law.
            codes: [AC9HH10K13]
