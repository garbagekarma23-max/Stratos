# Australian Curriculum Economics and Business, Year 9: International trade and interdependence, 32 points.
# Follows the Australian Curriculum: Humanities and Social Sciences, Economics and Business 7-10, Version 9.0, Year 9
# (ACARA's curriculum content document, australiancurriculum.edu.au). Checked on the official site in November 2026.
# Version 9.0 was approved by education ministers in April 2022 and released in May 2022. Each state and territory sets
# when its schools teach it, with full implementation expected by 2027 (Western Australia teaches its own version
# adapted from it). No new version is announced: ministers have scheduled the next full version for 2032. In Years 9
# and 10 some states and schools offer Economics and Business as an elective.
# Structure: the year's inquiry skills are the first unit (the five concepts are taught in Year 7). The year's
# Knowledge and understanding topic is a unit, and each content description is a chapter (the first is split in two).
# Codes are ACARA's content description codes.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-ecb-9
subject: Economics and Business
bank: ecb
name: Economics and Business, Year 9
about: "Australian Curriculum, Year 9: International trade and interdependence"
short: Economics and Business
years: [9]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Economics and Business, Version 9.0, Year 9"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [trade, globalisation, competitive advantage, interest, scams]

units:
  - title: Skills
    chapters:
      - title: Analysing and deciding
        id: ac-ecb-9-1-1
        points:
          - title: Percentage change
            id: ecb-percentage-change
            brief: Percentage change shows how much something grew or fell compared with where it started, found by dividing the change by the starting value and multiplying by 100.
            codes: [AC9HE9S03]
          - title: Predicting consumer and financial impacts
            id: ecb-predicting-consumer-financial-impacts
            brief: Use a trend and what causes it to predict effects on people, such as rising interest rates making loan repayments larger.
            codes: [AC9HE9S03]
          - title: Deciding with criteria
            id: ecb-deciding-with-criteria
            brief: Set criteria that matter, such as cost, risk and fairness, score each option against them, and choose the one that does best overall.
            codes: [AC9HE9S04]
          - title: Building an argument with evidence
            id: ecb-building-argument-with-evidence
            brief: An argument states a position, gives reasons, supports each with evidence from named sources, and answers the main view against it.
            codes: [AC9HE9S05]

  - title: International trade and interdependence
    chapters:
      - title: Australia's financial sector
        id: ac-ecb-9-2-1
        points:
          - title: Financial institutions
            id: ecb-financial-institutions
            brief: Banks, credit unions and building societies take deposits, keep money safe, make payments and lend to people and businesses.
            codes: [AC9HE9K01]
          - title: How banks lend savings
            id: ecb-banks-lend-savings
            brief: Banks pool many people's savings and lend them to borrowers, paying savers interest and charging borrowers a higher rate to make a profit.
            codes: [AC9HE9K01]
          - title: What shapes the financial sector
            id: ecb-shapes-financial-sector
            brief: The financial sector changes with deregulation, new technology such as online banking, and how confident people and businesses feel about the future.
            codes: [AC9HE9K01]
          - title: Finance for global business
            id: ecb-finance-global-business
            brief: The financial sector helps businesses trade overseas by changing currencies, moving payments between countries, insuring goods and lending money.
            codes: [AC9HE9K01]

      - title: Investing and debt
        id: ac-ecb-9-2-2
        points:
          - title: Ways to invest
            id: ecb-ways-invest
            brief: People invest for future income through shares, term deposits, managed funds, property and superannuation.
            codes: [AC9HE9K01]
          - title: Risk and return
            id: ecb-risk-return
            brief: Investments that can earn more, such as shares, usually carry more risk of losing money than safer ones such as term deposits.
            codes: [AC9HE9K01]
          - title: Good debt and bad debt
            id: ecb-good-debt-bad-debt
            brief: Good debt pays for something that grows in value or earns income, such as study or a home. Bad debt pays for things that lose value, often at high interest.
            codes: [AC9HE9K01]
          - title: Managing debt
            id: ecb-managing-debt
            brief: Borrow only what you can repay, pay high-interest debts first and keep savings for emergencies, to avoid owing more than you can manage.
            codes: [AC9HE9K01]

      - title: Interdependence
        id: ac-ecb-9-2-3
        points:
          - title: An interdependent economy
            id: ecb-interdependent-economy
            brief: Consumers, businesses, the financial sector and government rely on each other, so a decision by one affects the others.
            codes: [AC9HE9K02]
          - title: Globalisation
            id: ecb-globalisation
            brief: Globalisation is the growing links between countries through trade, investment, technology and the movement of people and ideas.
            codes: [AC9HE9K02]
          - title: Global supply chains
            id: ecb-global-supply-chains
            brief: Transnational corporations design, make and sell products across many countries, which lowers costs but can be disrupted by events far away.
            codes: [AC9HE9K02]
          - title: How one economy affects another
            id: ecb-one-economy-affects-another
            brief: When one country's economy slows, its people buy fewer imports, so countries that export to it lose sales and jobs.
            codes: [AC9HE9K02]

      - title: Trade
        id: ac-ecb-9-2-4
        points:
          - title: Why countries trade
            id: ecb-countries-trade
            brief: Countries have different resources and skills, so they trade to sell what they have spare and buy what they cannot make as well or as cheaply.
            codes: [AC9HE9K03]
          - title: Specialisation and the benefits of trade
            id: ecb-specialisation-benefits-trade
            brief: Trade lets countries specialise in what they do best, which raises production, incomes and choice, and builds ties between countries.
            codes: [AC9HE9K03]
          - title: Exports and imports
            id: ecb-exports-imports
            brief: Exports are goods and services sold to other countries. Imports are those bought from other countries.
            codes: [AC9HE9K03]
          - title: Composition and direction of trade
            id: ecb-composition-direction-trade
            brief: The composition of trade is what a country buys and sells. The direction of trade is which countries it trades with.
            codes: [AC9HE9K03]
          - title: Australia's trade with Asia
            id: ecb-australia-s-trade-with
            brief: Asia buys most of Australia's exports, such as iron ore, coal, gas and education. China, Japan, South Korea and India are major partners.
            codes: [AC9HE9K03]
          - title: How Australia's trade has changed
            id: ecb-australia-s-trade-has
            brief: In the 1950s Britain was Australia's main trading partner and wool and wheat led its exports. Japan then took the lead, and now Asia, led by China, buys most, mainly minerals and energy.
            codes: [AC9HE9K03]

      - title: Competitive advantage
        id: ac-ecb-9-2-5
        points:
          - title: What competitive advantage is
            id: ecb-competitive-advantage
            brief: A competitive advantage is something that makes customers choose a business over its rivals, which helps it win sales and profit.
            codes: [AC9HE9K04]
          - title: Lower costs
            id: ecb-lower-costs
            brief: A business can gain an advantage by producing more cheaply, through research, efficient methods, local resources or outsourcing.
            codes: [AC9HE9K04]
          - title: Differentiation
            id: ecb-differentiation
            brief: A business can stand out with better quality, design, service or brand, made known through advertising and social media.
            codes: [AC9HE9K04]
          - title: Working with others to compete
            id: ecb-working-with-others-compete
            brief: Businesses can share promotion costs with others in their industry, work with government to export, and train skilled staff.
            codes: [AC9HE9K04]
          - title: First Nations cultural and intellectual property
            id: ecb-first-nations-cultural-intellectual
            brief: First Nations businesses protect their cultural expressions, such as art, designs and stories, through licensing and copyright, which keeps control and gives them an edge.
            codes: [AC9HE9K04]

      - title: Risks and rewards
        id: ac-ecb-9-2-6
        points:
          - title: Scams and identity theft
            id: ecb-scams-identity-theft
            brief: Scams trick people into giving money or personal details, often by pretending to be a bank or a business. Identity theft uses stolen details to commit fraud.
            codes: [AC9HE9K05]
          - title: Managing financial risk
            id: ecb-managing-financial-risk
            brief: People manage risk by setting financial goals, having insurance and savings, and checking before sharing details or paying.
            codes: [AC9HE9K05]
          - title: Consumer rewards
            id: ecb-consumer-rewards
            brief: Loyalty programs, interest on savings and returns on investments reward people, but loyalty schemes also collect data and encourage spending.
            codes: [AC9HE9K05]
          - title: Ethical consumer decisions
            id: ecb-ethical-consumer-decisions
            brief: Ethical decisions think about effects on others and the environment, such as buying products made without child labour.
            codes: [AC9HE9K05]
          - title: Corporate social responsibility
            id: ecb-corporate-social-responsibility
            brief: Corporate social responsibility is a business acting for the good of workers, communities and the environment, not only for profit.
            codes: [AC9HE9K05]
