# NSW Legal Studies, Year 12: Crime, Human rights and all seven options, 73 points.
# Drafted from NESA's Legal Studies Stage 6 Syllabus (2009), the syllabus taught in Year 12 until the 2027 HSC. The
# structure follows the syllabus: the core parts and each option are units. Students study two options; every option
# is here so each school's pair is covered. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Law changes often. The briefs name laws as they stood in 2026; the checker should flag anything out of date.
# In transition: the Legal Studies 11-12 Syllabus (2025) replaces this one for Year 12 from Term 4 2027 (first HSC 2028).

id: nsw-leg-12
subject: Legal Studies
bank: leg
name: Legal Studies, Year 12
about: HSC, Crime, human rights and options
short: Legal Studies
years: [12]
place: nsw
kind: standard
syllabus: NSW Legal Studies Stage 6 Syllabus (2009), HSC (Year 12) course, Crime, Human rights and the seven options
note: Follows the NSW Legal Studies syllabus. Not made or endorsed by NESA.
chips: [mens rea, bail, sentencing, UDHR, native title]

units:
  - title: Crime
    chapters:
      - title: The nature of crime
        id: nsw-leg-12-1-1
        points:
          - title: What a crime is
            id: leg-crime
            brief: A crime is an act or omission against society that is forbidden by law and punished by the state.
          - title: Actus reus and mens rea
            id: leg-actus-reus-mens-rea
            brief: Most crimes need a guilty act (actus reus) and a guilty mind (mens rea), such as intent or recklessness. The prosecution must prove both.
          - title: Strict and absolute liability
            id: leg-strict-absolute-liability
            brief: For some offences, such as many traffic offences, no guilty mind needs to be proved. Strict liability allows a defence of honest mistake; absolute liability does not.
          - title: Categories of crime
            id: leg-categories-crime
            brief: Offences against the person, against property, drug offences, public order offences, white collar crime, driving offences and offences against the state.
          - title: Summary and indictable offences
            id: leg-summary-indictable-offences
            brief: Summary offences are minor and heard by a magistrate. Indictable offences are serious and can be tried by a judge and jury.
          - title: Causes of crime
            id: leg-causes-crime
            brief: Social and economic factors, such as poverty and disadvantage, psychological factors, opportunity and peer pressure can all contribute to crime.

      - title: The criminal investigation process
        id: nsw-leg-12-1-2
        points:
          - title: Police powers
            id: leg-police-powers
            brief: Police can stop, search and arrest people, but their powers are set by law, in NSW mainly the Law Enforcement (Powers and Responsibilities) Act 2002.
          - title: Gathering evidence and warrants
            id: leg-gathering-evidence-warrants
            brief: Police gather evidence through searches, interviews and forensic tests. A warrant from a court is needed for many searches and for surveillance.
          - title: Rights of suspects
            id: leg-rights-suspects
            brief: Suspects have rights, such as being told why they are arrested and having access to a lawyer. The right to silence has limits in NSW.
          - title: Bail and remand
            id: leg-bail-remand
            brief: Bail releases an accused person before trial, with conditions. A person refused bail is held on remand. Bail laws balance the presumption of innocence with community safety.

      - title: The criminal trial process
        id: nsw-leg-12-1-3
        points:
          - title: The prosecution and defence
            id: leg-prosecution-defence
            brief: The prosecution, for the state, must prove the charge. The defence tests the evidence. Both sides have duties to the court.
          - title: The burden and standard of proof
            id: leg-burden-standard-proof
            brief: The prosecution carries the burden of proof and must prove guilt beyond reasonable doubt. The accused is presumed innocent.
          - title: Pleas and charge negotiation
            id: leg-pleas-charge-negotiation
            brief: An accused pleads guilty or not guilty. In charge negotiation, the accused pleads guilty to a lesser or fewer charges, which saves time but can seem unfair to victims.
          - title: Juries
            id: leg-juries
            brief: In serious trials, a jury of 12 decides guilt. NSW allows a majority verdict of 11 to 1 in some cases.
          - title: Defences to criminal charges
            id: leg-defences-criminal-charges
            brief: Complete defences, such as self-defence and duress, lead to acquittal. Partial defences, such as substantial impairment, reduce murder to manslaughter.

      - title: Sentencing and punishment
        id: nsw-leg-12-1-4
        points:
          - title: Purposes of punishment
            id: leg-purposes-punishment
            brief: Sentences aim at deterrence, retribution, rehabilitation, incapacitation and denunciation, and judges weigh these against each other.
          - title: Aggravating and mitigating factors
            id: leg-aggravating-mitigating-factors
            brief: Aggravating factors, such as violence or a prior record, make a sentence harsher. Mitigating factors, such as remorse or a guilty plea, make it lighter.
          - title: Types of penalties
            id: leg-types-penalties
            brief: Penalties range from fines and good behaviour orders to community correction orders, intensive correction orders and imprisonment.
          - title: Appeals
            id: leg-appeals
            brief: Either side can appeal against a sentence, and the accused can appeal against a conviction, to a higher court.
          - title: Alternative methods of sentencing
            id: leg-alternative-methods-sentencing
            brief: Circle sentencing involves Aboriginal elders in sentencing Aboriginal offenders. Restorative justice brings offenders and victims together.
          - title: Post-sentencing
            id: leg-post-sentencing
            brief: Parole lets prisoners serve part of a sentence in the community under supervision. Some serious offenders can be kept in custody or supervised after their sentence ends.

      - title: Young offenders and international crime
        id: nsw-leg-12-1-5
        points:
          - title: The age of criminal responsibility
            id: leg-age-criminal-responsibility
            brief: In NSW, children under 10 cannot be charged with a crime. For those aged 10 to 13, the prosecution must also prove the child knew the act was seriously wrong (doli incapax).
          - title: The Young Offenders Act 1997
            id: leg-young-offenders-act-1997
            brief: The Act lets police deal with young people through warnings, cautions and youth justice conferences instead of court, to keep them out of the system.
          - title: The Children's Court
            id: leg-children-s-court
            brief: A closed court for young offenders, with a focus on rehabilitation. Young people's names are usually kept private.
          - title: International crime
            id: leg-international-crime
            brief: Crimes against international law, such as genocide and war crimes, and transnational crimes, such as drug trafficking and cybercrime, which cross borders.
          - title: Responses to international crime
            id: leg-responses-international-crime
            brief: The International Criminal Court tries genocide, war crimes and crimes against humanity. Extradition and police cooperation deal with transnational crime.

  - title: Human rights
    chapters:
      - title: The nature of human rights
        id: nsw-leg-12-2-1
        points:
          - title: What human rights are
            id: leg-human-rights-are
            brief: Human rights belong to every person because they are human. They are universal, inherent, inalienable and indivisible.
          - title: The development of human rights
            id: leg-development-human-rights
            brief: Ideas of human rights grew through documents such as Magna Carta and the 18th-century declarations of rights, and through campaigns against slavery and for workers' and women's rights.
          - title: The Universal Declaration of Human Rights
            id: leg-universal-declaration-human-rights
            brief: Adopted by the UN General Assembly in 1948, the UDHR sets out rights for all people. It is not binding itself, but it led to binding treaties.
          - title: Types of rights
            id: leg-types-rights
            brief: Civil and political rights, such as free speech; economic, social and cultural rights, such as education; and collective rights, such as self-determination.
          - title: Sovereignty and enforcement
            id: leg-sovereignty-enforcement
            brief: Countries are sovereign, so human rights are hard to enforce against a state that will not comply. Pressure comes from the UN, other states, NGOs and the media.

      - title: Human rights in Australia
        id: nsw-leg-12-2-2
        points:
          - title: Rights in the Australian Constitution
            id: leg-rights-australian-constitution
            brief: The Constitution has few express rights, such as trial by jury for Commonwealth indictable offences, and the High Court has found an implied freedom of political communication.
          - title: Statutes that protect rights
            id: leg-statutes-that-protect-rights
            brief: Laws such as the Racial Discrimination Act 1975 and the Sex Discrimination Act 1984 protect rights in particular areas.
          - title: The Australian Human Rights Commission
            id: leg-australian-human-rights-commission
            brief: The Commission investigates complaints of discrimination, educates the public and reports on human rights.
          - title: The bill of rights debate
            id: leg-bill-rights-debate
            brief: Supporters say a bill of rights would protect rights better. Opponents say it would hand power from parliament to unelected judges. Victoria, the ACT and Queensland have human rights acts.

  - title: Consumers
    chapters:
      - title: Consumer law
        id: nsw-leg-12-3-1
        points:
          - title: Who is a consumer
            id: leg-who-consumer
            brief: A consumer buys goods or services for personal or household use. Consumer law protects them because sellers usually hold more power and information.
          - title: Contracts
            id: leg-contracts
            brief: A contract needs an offer, acceptance, consideration and an intention to be legally bound. Some terms are implied by law even if not written.
          - title: The Australian Consumer Law
            id: leg-australian-consumer-law
            brief: The ACL gives consumer guarantees, such as goods being of acceptable quality, and bans misleading or deceptive conduct and unfair contract terms.
          - title: Remedies for consumers
            id: leg-remedies-consumers
            brief: Consumers can ask for a repair, replacement or refund, complain to NSW Fair Trading, or take a claim to NCAT.
          - title: Consumer credit
            id: leg-consumer-credit
            brief: The National Consumer Credit Protection Act 2009 requires lenders to be licensed and to check that a loan is not unsuitable for the borrower.
          - title: Consumers and online shopping
            id: leg-consumers-online-shopping
            brief: Buying online raises issues of scams, sellers based overseas and data privacy, which the law is still catching up with.

  - title: Family
    chapters:
      - title: Family law
        id: nsw-leg-12-4-1
        points:
          - title: Marriage
            id: leg-marriage
            brief: The Marriage Act 1961 sets the rules for a valid marriage. Since 2017 it has allowed two people of any sex to marry.
          - title: De facto relationships
            id: leg-de-facto-relationships
            brief: Couples who live together without marrying have most of the same legal rights when they separate, under the Family Law Act 1975.
          - title: Divorce
            id: leg-divorce
            brief: Australia has no-fault divorce. A couple must show the marriage has broken down, proved by 12 months of separation.
          - title: Children after separation
            id: leg-children-after-separation
            brief: The best interests of the child are the court's first concern in deciding where a child lives and how much time they spend with each parent.
          - title: Domestic violence and the law
            id: leg-domestic-violence-law
            brief: Apprehended violence orders protect people from violence or harassment. NSW made coercive control in current or former intimate relationships a crime from 2024.
          - title: Surrogacy and birth technologies
            id: leg-surrogacy-birth-technologies
            brief: Altruistic surrogacy is legal in NSW, but paid surrogacy is a crime. The law is still working out the rights of everyone involved.

  - title: Global environment and protection
    chapters:
      - title: Environmental law
        id: nsw-leg-12-5-1
        points:
          - title: The environment as a global issue
            id: leg-environment-as-global-issue
            brief: Pollution, climate change and loss of species cross borders, so no one country can solve them alone.
          - title: International environmental agreements
            id: leg-international-environmental-agreements
            brief: Treaties such as the Paris Agreement on climate change and the Convention on Biological Diversity set shared goals, though most rely on countries keeping their own promises.
          - title: Principles of environmental law
            id: leg-principles-environmental-law
            brief: Ecologically sustainable development, the precautionary principle and intergenerational equity guide environmental law.
          - title: Australian environmental law
            id: leg-australian-environmental-law
            brief: The Environment Protection and Biodiversity Conservation Act 1999 protects matters of national environmental significance, such as world heritage areas and threatened species.
          - title: Courts and NGOs in protecting the environment
            id: leg-courts-ngos-protecting-environment
            brief: Courts such as the NSW Land and Environment Court hear environmental cases, and NGOs campaign, take legal action and monitor compliance.

  - title: Indigenous peoples
    chapters:
      - title: Indigenous peoples and the law
        id: nsw-leg-12-6-1
        points:
          - title: Indigenous peoples under international law
            id: leg-indigenous-peoples-under-international
            brief: The UN Declaration on the Rights of Indigenous Peoples (2007) sets out rights to culture, land and self-determination. Australia endorsed it in 2009.
          - title: Self-determination
            id: leg-self-determination
            brief: The right of Indigenous peoples to make decisions about their own lives, lands and communities.
          - title: Land rights and native title
            id: leg-land-rights-native-title
            brief: The Mabo decision (1992) recognised native title and rejected terra nullius. The Native Title Act 1993 set out how native title is claimed.
          - title: Aboriginal and Torres Strait Islander peoples and the justice system
            id: leg-aboriginal-torres-strait-islander
            brief: Aboriginal and Torres Strait Islander people are imprisoned at far higher rates than other Australians, which reviews and inquiries have tried to address.
          - title: Effectiveness of the law for Indigenous peoples
            id: leg-effectiveness-law-indigenous-peoples
            brief: Weighing what the law has achieved, such as native title, against continuing gaps in health, justice and recognition.

  - title: Shelter
    chapters:
      - title: Shelter and the law
        id: nsw-leg-12-7-1
        points:
          - title: Shelter as a right
            id: leg-shelter-as-right
            brief: Adequate housing is a human right in international law, but in Australia there is no legal right to housing.
          - title: Renting
            id: leg-renting
            brief: The Residential Tenancies Act 2010 (NSW) sets the rights and duties of landlords and tenants, such as bonds, repairs and notice periods.
          - title: Buying a home
            id: leg-buying-home
            brief: Most people borrow to buy a home through a mortgage, which lets the lender sell the home if repayments are not made.
          - title: Strata and community living
            id: leg-strata-community-living
            brief: Owners of units share the building and its common areas, governed by strata law and the owners corporation's by-laws.
          - title: Homelessness and public housing
            id: leg-homelessness-public-housing
            brief: Governments provide public and social housing for people on low incomes, but waiting lists are long and homelessness is rising.

  - title: Workplace
    chapters:
      - title: Workplace law
        id: nsw-leg-12-8-1
        points:
          - title: The Fair Work Act 2009
            id: leg-fair-work-act-2009
            brief: The main law for workplaces, which sets the National Employment Standards, such as leave entitlements and maximum hours.
          - title: Awards and enterprise agreements
            id: leg-awards-enterprise-agreements
            brief: Modern awards set minimum pay and conditions for an industry. Enterprise agreements are negotiated in a workplace and must leave workers better off overall.
          - title: Work health and safety
            id: leg-work-health-safety
            brief: Employers have a duty to keep workers safe, under the Work Health and Safety Act 2011 (NSW). SafeWork NSW enforces it.
          - title: Discrimination and harassment at work
            id: leg-discrimination-harassment-at-work
            brief: It is against the law to treat workers unfairly because of their sex, race, age, disability and other attributes, or to sexually harass them.
          - title: Unfair dismissal
            id: leg-unfair-dismissal
            brief: A worker sacked in a harsh, unjust or unreasonable way can apply to the Fair Work Commission for reinstatement or compensation.

  - title: World order
    chapters:
      - title: World order and the law
        id: nsw-leg-12-9-1
        points:
          - title: What world order means
            id: leg-world-order-means
            brief: World order is the set of rules, institutions and relationships that keep peace and security between countries.
          - title: The United Nations and the Security Council
            id: leg-united-nations-security-council
            brief: The UN Charter bans the use of force except in self-defence or when authorised by the Security Council, whose five permanent members can veto decisions.
          - title: Peacekeeping
            id: leg-peacekeeping
            brief: UN peacekeepers help keep peace after conflicts, with the consent of the parties, as in Timor-Leste.
          - title: International humanitarian law
            id: leg-international-humanitarian-law
            brief: The Geneva Conventions set rules for armed conflict, protecting civilians, prisoners of war and the wounded.
          - title: The responsibility to protect
            id: leg-responsibility-protect
            brief: The idea that states must protect their people from mass atrocities, and that the international community should act when they fail to.
          - title: International courts
            id: leg-international-courts
            brief: The International Court of Justice settles disputes between states, and the International Criminal Court tries individuals for the worst crimes.
