# Australian Curriculum Geography, Year 10: Environmental change and management, and Geographies of human wellbeing,
# 33 points.
# Follows the Australian Curriculum: Humanities and Social Sciences, Geography 7-10, Version 9.0, Year 10 (ACARA's
# curriculum content document, australiancurriculum.edu.au). Checked on the official site in November 2026. Version
# 9.0 was approved by education ministers in April 2022 and released in May 2022. Each state and territory sets when
# its schools teach it, with full implementation expected by 2027 (Western Australia teaches its own version adapted
# from it). No new version is announced: ministers have scheduled the next full version for 2032.
# Structure: the year's data and decision skills are the first unit (the seven concepts are taught in Year 7). Each
# Knowledge and understanding sub-strand (Environmental change and management, Geographies of human wellbeing) is a
# unit, and each content description is a chapter, or two share one when small. Codes are ACARA's content description
# codes.
# Where schools choose: schools study one changing environment of their choice. This outline uses inland water, the
# Murray-Darling Basin, as its example chapter. Coasts, marine, land and urban environments can be added. The
# wellbeing studies use India and Papua New Guinea. Other countries can be added.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-geo-10
subject: Geography
bank: geo
name: Geography, Year 10
about: "Australian Curriculum, Year 10: Environmental change and management, Geographies of human wellbeing"
short: Geography
years: [10]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Geography, Version 9.0, Year 10"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [world views, Murray-Darling, Human Development Index, wellbeing, sustainability]

units:
  - title: Geographical skills
    chapters:
      - title: Evidence and decisions
        id: ac-geo-10-1-1
        points:
          - title: Scatter graphs and correlation
            id: geo-scatter-graphs-correlation
            brief: A scatter graph plots two measures for many places to show whether they rise together, move in opposite directions or show no link. A link does not prove one causes the other.
            codes: [AC9HG10S02, AC9HG10S03]
          - title: Generalisations and predictions
            id: geo-generalisations-predictions
            brief: A generalisation is a statement that holds for most cases in the data. A prediction extends a trend into the future and is less certain the further ahead it goes.
            codes: [AC9HG10S03]
          - title: Justifying a conclusion
            id: geo-justifying-conclusion
            brief: A strong conclusion is backed by reliable data from more than one source, and says where the evidence is weak or missing.
            codes: [AC9HG10S04]
          - title: Weighing strategies with criteria
            id: geo-weighing-strategies-with-criteria
            brief: To recommend a strategy, compare options against environmental, economic and social criteria, then explain the effects the chosen one is likely to have.
            codes: [AC9HG10S05]

  - title: Environmental change and management
    chapters:
      - title: Environments under pressure
        id: ac-geo-10-2-1
        points:
          - title: Environmental functions
            id: geo-environmental-functions
            brief: Environments give resources such as water and timber, absorb wastes, provide services such as clean air and pollination, and hold spiritual meaning.
            codes: [AC9HG10K04]
          - title: Human-induced environmental change
            id: geo-human-induced-environmental-change
            brief: People change environments through pollution of air and water, loss of plant and animal species, and degraded land, rivers and seas.
            codes: [AC9HG10K01]
          - title: Conflicting views on sustainability
            id: geo-conflicting-views-sustainability
            brief: Communities, businesses and governments often disagree about sustainable use, because protecting an environment can cost jobs or profits in the short term.
            codes: [AC9HG10K01]

      - title: World views and custodianship
        id: ac-geo-10-2-2
        points:
          - title: Human-centred and earth-centred world views
            id: geo-human-centred-earth-centred
            brief: A human-centred world view values nature for what it gives people. An earth-centred world view values nature for its own sake and sees people as part of it.
            codes: [AC9HG10K02]
          - title: How world views shape management
            id: geo-world-views-shape-management
            brief: People's world views affect whether they see a change as a problem and which ways of managing it they support.
            codes: [AC9HG10K02, AC9HG10K04]
          - title: Custodial responsibility for Country
            id: geo-custodial-responsibility-country
            brief: First Nations Australians hold responsibilities to care for Country/Place, passed down through culture and law, which guide how land and water are used.
            codes: [AC9HG10K03]
          - title: Cultural fire management
            id: geo-cultural-fire-management
            brief: First Nations Australians use cool, small, patchy burns at the right time of year to reduce fuel, protect plants and animals and lower the risk of large bushfires.
            codes: [AC9HG10K03]
          - title: Indigenous rangers
            id: geo-indigenous-rangers
            brief: Indigenous ranger groups combine cultural knowledge with science to manage Country, such as controlling weeds and feral animals and protecting threatened species.
            codes: [AC9HG10K03]

      - title: Managing environmental change
        id: ac-geo-10-2-3
        points:
          - title: Protected areas
            id: geo-protected-areas-2
            brief: National parks, marine reserves and World Heritage listing protect environments by limiting what people can do there.
            codes: [AC9HG10K04]
          - title: Spatial strategies
            id: geo-spatial-strategies
            brief: Spatial strategies plan where things go, such as wildlife corridors linking patches of bush, or city plans that cut car travel and energy use.
            codes: [AC9HG10K04]
          - title: Trade-offs in environmental decisions
            id: geo-trade-offs-environmental-decisions
            brief: Traditional Owners, communities, developers, governments and environment groups weigh environmental, economic and social costs and benefits, and every choice gives something up.
            codes: [AC9HG10K04]
          - title: Comparing management between countries
            id: geo-comparing-management-between-countries
            brief: The same problem, such as waste or floods, is managed differently in Australia and other countries, depending on money, technology, laws and values.
            codes: [AC9HG10K04]

      - title: "Case study: the Murray-Darling Basin"
        id: ac-geo-10-2-4
        points:
          - title: Water use in the Murray-Darling Basin
            id: geo-water-use-murray-darling
            brief: The basin is Australia's largest river system and grows much of its food, so its water is shared between irrigation, towns and the rivers themselves.
            codes: [AC9HG10K04]
          - title: River health in the basin
            id: geo-river-health-basin
            brief: Taking too much water, dams and land clearing have led to salinity, algal blooms, fish kills and drying wetlands.
            codes: [AC9HG10K04]
          - title: The Murray-Darling Basin Plan
            id: geo-murray-darling-basin-plan
            brief: The Basin Plan sets limits on how much water can be taken and returns some to the rivers as environmental flows, which divides farmers, towns and conservationists.
            codes: [AC9HG10K04]
          - title: First Nations voices on water
            id: geo-first-nations-voices-water
            brief: First Nations peoples of the basin seek cultural flows, water they own and manage to care for Country and support their communities.
            codes: [AC9HG10K03, AC9HG10K04]

  - title: Geographies of human wellbeing
    chapters:
      - title: Measuring wellbeing
        id: ac-geo-10-3-1
        points:
          - title: Human wellbeing and development
            id: geo-human-wellbeing-development
            brief: Human wellbeing is the quality of people's lives, including health, education, income, safety and freedom. Development is the process of improving it.
            codes: [AC9HG10K05]
          - title: GDP per person
            id: geo-gdp-per-person
            brief: Gross domestic product per person shows a country's average income, but it says nothing about how fairly income is shared or about health and education.
            codes: [AC9HG10K05]
          - title: The Human Development Index
            id: geo-human-development-index
            brief: The HDI combines life expectancy, years of schooling and income per person into a score from 0 to 1, so countries can be ranked on more than income.
            codes: [AC9HG10K05]
          - title: Other wellbeing measures
            id: geo-other-wellbeing-measures
            brief: Measures such as the Multidimensional Poverty Index count what people lack, such as clean water, schooling or electricity, to show poverty that income alone misses.
            codes: [AC9HG10K05, AC9HG10K06]
          - title: The Sustainable Development Goals
            id: geo-sustainable-development-goals-2
            brief: The United Nations set 17 goals for 2030, such as ending poverty and hunger and good health and education, which countries track to improve wellbeing.
            codes: [AC9HG10K05]

      - title: Differences in wellbeing
        id: ac-geo-10-3-2
        points:
          - title: Causes of wellbeing differences
            id: geo-causes-wellbeing-differences
            brief: Wellbeing differs between and within countries because of resources, health and education services, jobs and income, technology and government.
            codes: [AC9HG10K06, AC9HG10K07]
          - title: Wellbeing within India
            id: geo-wellbeing-within-india
            brief: Wellbeing in India varies widely, with higher incomes and services in cities such as Mumbai than in poorer rural areas of states such as Rajasthan.
            codes: [AC9HG10K06]
          - title: Urban and remote Australia
            id: geo-urban-remote-australia
            brief: People in remote Australia often have lower incomes, fewer services and shorter lives on average than people in the major cities.
            codes: [AC9HG10K07]
          - title: First Nations wellbeing and Closing the Gap
            id: geo-first-nations-wellbeing-closing
            brief: Gaps remain between First Nations and other Australians in health, education and jobs. Closing the Gap sets shared targets, with First Nations communities as partners.
            codes: [AC9HG10K07]

      - title: Improving wellbeing
        id: ac-geo-10-3-3
        points:
          - title: Reducing regional inequality
            id: geo-reducing-regional-inequality
            brief: Governments run programs to lift wellbeing in poorer regions, such as building roads, clinics and schools in rural Papua New Guinea or Indonesia.
            codes: [AC9HG10K08]
          - title: Australian overseas aid
            id: geo-australian-overseas-aid
            brief: The Australian Government gives aid to countries in Asia and the Pacific for health, education, infrastructure and disaster recovery.
            codes: [AC9HG10K08]
          - title: Non-government organisations
            id: geo-non-government-organisations
            brief: Non-government organisations such as World Vision raise money and run programs, such as clean water and schooling, to improve wellbeing.
            codes: [AC9HG10K08]
          - title: Community-led change in remote communities
            id: geo-community-led-change-remote
            brief: Programs work best in remote First Nations communities when the communities lead them, such as locally run health services and ranger jobs.
            codes: [AC9HG10K08]
