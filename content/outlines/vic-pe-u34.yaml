# VCE Physical Education, Units 3 and 4: movement skills and energy, and training to improve performance, 39 points.
# Checked against the VCAA's VCE Physical Education Study Design, accredited from 2025, in October 2026. Each unit is
# a unit here, and each area of study is a chapter, or two when it is large. Practical activities are school-run, so
# only the theory is here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW Health and Movement Science (the hms bank) teaches energy systems and training, so expect some reuses.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-pe-u34
subject: Physical Education
bank: pe
name: Physical Education, Units 3 and 4
about: VCE, Skills, energy systems and training
short: Physical Education
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Physical Education Study Design (from 2025), Units 3 and 4
note: Follows the VCE Physical Education study design. Not made or endorsed by the VCAA.
chips: [stages of learning, Newton's laws, energy systems, oxygen deficit, progressive overload]

units:
  - title: "Unit 3: Movement skills and energy for physical activity, sport and exercise"
    chapters:
      - title: Learning movement skills
        id: vic-pe-u34-1-1
        points:
          - title: Classifying movement skills
            id: pe-classifying-movement-skills
            brief: Skills can be classed as fundamental or sport-specific, gross or fine, open or closed, and discrete, serial or continuous.
          - title: Skills, participation and performance
            id: pe-skills-participation-performance
            brief: Developing motor skills makes people more likely to take part and to perform well.
          - title: Sociocultural factors in skill learning
            id: pe-influences-skill-learning
            brief: Family, peers, culture, access to facilities and coaching all affect how skills develop.
          - title: Stages of learning
            id: pe-stages-learning
            brief: Learners move from the cognitive stage (thinking through each step), to the associative stage (refining), to the autonomous stage (automatic).
          - title: Direct and constraints-led coaching
            id: pe-direct-constraints-led-coaching
            brief: Linear theories suit direct coaching that breaks skills into steps; non-linear theories suit a constraints-led approach that shapes tasks and environments.
          - title: Psychological skills
            id: pe-psychological-skills
            brief: Confidence, motivation, the right level of arousal and concentration, with strategies such as imagery and self-talk, help performance.
          - title: Practice schedules
            id: pe-practice-schedules
            brief: Practice can be massed or distributed, and blocked or random, each suiting different skills and stages of learning.
          - title: Feedback
            id: pe-feedback
            brief: Feedback can be internal or external, and about the result or the movement itself. Too much can make a learner depend on it.

      - title: Biomechanics
        id: vic-pe-u34-1-2
        points:
          - title: Linear and angular motion
            id: pe-momentum-impulse
            brief: Force and torque, momentum, impulse, and speed and velocity describe how bodies move in straight lines and rotate.
          - title: Newton's laws of motion
            id: pe-newton-s-laws-motion
            brief: Inertia, acceleration in proportion to force, and equal and opposite reactions explain how athletes and objects move.
          - title: Projectile motion
            id: pe-projectile-motion
            brief: The release height, speed and angle decide how far and how high an object or body flies.
          - title: Levers in the body
            id: pe-levers-body-2
            brief: Most body movements use third-class levers, which trade force for speed. Axis, force and resistance set the mechanical advantage.
          - title: Balance and stability
            id: pe-balance-stability
            brief: A lower centre of gravity, a wider base of support and the line of gravity inside the base make a body more stable.
          - title: Qualitative movement analysis
            id: pe-qualitative-movement-analysis
            brief: Coaches prepare, observe, evaluate and correct errors to improve a movement.

      - title: Producing energy
        id: vic-pe-u34-1-3
        points:
          - title: ATP and energy for movement
            id: pe-atp-energy-movement
            brief: Muscles need ATP to contract. The body stores very little, so it must be rebuilt constantly by three energy systems.
          - title: The ATP-PC system
            id: pe-atp-pc-system
            brief: Uses phosphocreatine to rebuild ATP very fast, for about 10 seconds of maximal effort such as a sprint start.
          - title: The anaerobic glycolysis system
            id: pe-anaerobic-glycolysis-system
            brief: Breaks down glucose without oxygen for high-intensity efforts lasting up to about a minute, producing hydrogen ions that bring fatigue.
          - title: The aerobic system
            id: pe-aerobic-system
            brief: Breaks down carbohydrate and fat with oxygen to make a large amount of ATP slowly, for longer, lower-intensity activity.
          - title: The energy systems working together
            id: pe-energy-systems-working-together
            brief: All three systems work at once, but the main one depends on how hard and how long the effort is.

      - title: Oxygen use, fatigue and fuel
        id: vic-pe-u34-1-4
        points:
          - title: Oxygen uptake
            id: pe-oxygen-deficit-steady-state
            brief: At the start of exercise oxygen supply lags (oxygen deficit), then levels off (steady state), and stays high after (EPOC) as the body recovers.
          - title: Acute responses in Unit 3
            id: pe-acute-responses-unit-3
            brief: During exercise the cardiovascular, respiratory and muscular systems respond together to supply energy.
          - title: Fatigue
            id: pe-fatigue
            brief: Fatigue comes from running out of fuel, a build-up of metabolic by-products, and overheating, depending on intensity and duration.
          - title: Nutrition and hydration for performance
            id: pe-nutrition-hydration-training
            brief: Carbohydrate, protein and water before, during and after exercise improve performance, delay fatigue and help recovery.

  - title: "Unit 4: Training to improve performance"
    chapters:
      - title: Foundations of an effective training program
        id: vic-pe-u34-2-1
        points:
          - title: Activity analysis
            id: pe-activity-analysis
            brief: Watching an activity to find its movement skills, energy systems, muscles and fitness components, so training can match it.
          - title: Fitness components
            id: pe-fitness-components
            brief: Aerobic power, anaerobic capacity, muscular strength, power, endurance, speed, agility, flexibility and body composition.
          - title: Fitness testing
            id: pe-fitness-testing
            brief: Fitness tests find strengths and weaknesses, set goals and motivate. Standard, recognised tests should match what the activity needs.
          - title: Before testing
            id: pe-before-testing
            brief: Health screening and informed consent come before any fitness test.
          - title: Test reliability, validity and accuracy
            id: pe-test-reliability-validity-accuracy
            brief: A good fitness test gives consistent results, measures the right component and is close to the true value.

      - title: Implementing training
        id: vic-pe-u34-2-2
        points:
          - title: Monitoring training
            id: pe-monitoring-training
            brief: Training diaries, heart rate and ratings of perceived exertion track whether training is working and how hard it is.
          - title: A training session
            id: pe-training-session
            brief: Each session has a warm up, a conditioning phase and a cool down.
          - title: Principles of training
            id: pe-principles-training
            brief: Frequency, intensity, time, type, specificity, progressive overload, variety and individuality guide a program.
          - title: Detraining and plateaus
            id: pe-detraining-plateaus
            brief: Fitness gains are lost when training stops (detraining), and progress can stall without changes to the program.
          - title: Training methods
            id: pe-training-methods
            brief: Continuous, interval, fartlek, circuit, resistance, plyometric and flexibility training each build particular fitness components.

      - title: Chronic adaptations
        id: vic-pe-u34-2-3-2
        points:
          - title: Chronic cardiovascular adaptations
            id: pe-chronic-cardiovascular-adaptations
            brief: Months of aerobic training enlarge the heart, raise stroke volume and lower resting heart rate.
          - title: Chronic respiratory adaptations
            id: pe-chronic-respiratory-adaptations
            brief: Aerobic training makes breathing more efficient and lifts VO2 max.
          - title: Chronic muscular adaptations
            id: pe-chronic-muscular-adaptations
            brief: Resistance training grows muscle fibres (hypertrophy) and improves the nerves' control of them.
          - title: What adaptations improve
            id: pe-adaptations-improve
            brief: Training adaptations lift VO2 max, raise the lactate inflection point, speed up and strengthen muscle contractions and improve lactate tolerance.

      - title: Putting it together
        id: vic-pe-u34-2-3
        points:
          - title: Skill, biomechanics and energy together
            id: pe-skill-biomechanics-energy-together
            brief: Improving performance means linking how a skill is learned, how it is performed and the energy and fitness it needs.
          - title: Designing a program for an athlete
            id: pe-designing-program-athlete
            brief: A good program matches the activity analysis, the athlete's test results and the training principles, and changes as they improve.
