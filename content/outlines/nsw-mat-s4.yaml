# NSW Mathematics, Stage 4 (Years 7 and 8): all 16 Stage 4 focus areas, 71 points.
# Follows NESA's Mathematics K-10 Syllabus (2022), Stage 4 content, checked on the NSW Curriculum website
# (curriculum.nsw.edu.au) in November 2026. It replaced the 2012 syllabus and has been taught in Years 7 to 10 since
# 2024 (the department's staggered start: Years 7 and 9 in 2024, Years 8 and 10 in 2025). NESA's curriculum reform
# timeline names no replacement. Its only change since was a glossary fix in August 2026.
# Structure: each focus area is a chapter (Fractions, decimals and percentages is two). The chapters are grouped into
# three units: number and algebra, measurement and space, and statistics and probability. Each point lists its
# focus area's outcome code. The working mathematically outcome (MAO-WM-01) runs through every chapter, so it is not
# listed on each point. Life Skills outcomes are left out. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths). Maths Lab templates can come later, per topic.

id: nsw-mat-s4
subject: Mathematics
bank: mat
name: Mathematics, Stage 4
about: NSW Stage 4, Years 7 and 8
short: Mathematics
years: [7, 8]
level: Stage 4
place: nsw
kind: maths
syllabus: NSW Mathematics K-10 Syllabus (2022), Stage 4
note: Follows the NSW Mathematics syllabus. Not made or endorsed by NESA.
chips: [integers, percentages, index laws, Pythagoras, area, probability]

units:
  - title: Number and algebra
    chapters:
      - title: Computation with integers
        id: nsw-mat-s4-1-1
        points:
          - title: Comparing and ordering integers
            id: mat-comparing-ordering-integers
            brief: Integers are whole numbers and their negatives. On a number line, numbers to the right are larger, so -2 is greater than -7.
            codes: [MA4-INT-C-01]
          - title: Adding and subtracting integers
            id: mat-adding-subtracting-integers-nsw
            brief: Adding a negative is the same as subtracting, and subtracting a negative is the same as adding, so 5 - (-3) = 8. Using a number line to check.
            codes: [MA4-INT-C-01]
          - title: Multiplying and dividing integers
            id: mat-multiplying-dividing-integers-nsw
            brief: Two numbers with the same sign give a positive product or quotient, and different signs give a negative one, so -6 × -4 = 24 and 18 ÷ -3 = -6.
            codes: [MA4-INT-C-01]
          - title: Order of operations with integers
            id: mat-order-operations-with-integers
            brief: Brackets first, then powers, then multiplying and dividing from left to right, then adding and subtracting from left to right, keeping track of negative signs at each step.
            codes: [MA4-INT-C-01]

      - title: Fractions and decimals
        id: nsw-mat-s4-1-2
        points:
          - title: Equivalent fractions and comparing fractions
            id: mat-equivalent-fractions-comparing-fractions
            brief: Multiplying or dividing the top and bottom by the same number gives an equivalent fraction. To compare fractions, rewrite them with a common denominator.
            codes: [MA4-FRC-C-01]
          - title: Adding and subtracting fractions
            id: mat-adding-subtracting-fractions-nsw
            brief: Rewrite the fractions with the lowest common denominator, then add or subtract the numerators. Mixed numbers can be changed to improper fractions first.
            codes: [MA4-FRC-C-01]
          - title: Multiplying and dividing fractions
            id: mat-multiplying-dividing-fractions-nsw
            brief: Multiply numerators together and denominators together. To divide, multiply by the reciprocal of the second fraction. Simplify the answer.
            codes: [MA4-FRC-C-01]
          - title: Rounding decimals
            id: mat-rounding-decimals-nsw
            brief: Rounding a decimal to a given number of decimal places by looking at the next digit, 5 or more rounds up, and why a rounded answer is an approximation.
            codes: [MA4-FRC-C-01]
          - title: Recurring decimals and irrational numbers
            id: mat-recurring-decimals-irrational-numbers
            brief: Some fractions give terminating decimals and others recurring ones, written with a dot or bar. A number such as pi or the square root of 2 is irrational, because its decimal never ends or repeats.
            codes: [MA4-FRC-C-01]

      - title: Percentages
        id: nsw-mat-s4-1-3
        points:
          - title: Converting fractions, decimals and percentages
            id: mat-converting-fractions-decimals-percentages-nsw
            brief: A percentage is a fraction out of 100. Moving between the three forms, such as 3/8 = 0.375 = 37.5%.
            codes: [MA4-FRC-C-01]
          - title: One quantity as a percentage of another
            id: mat-one-quantity-as-percentage
            brief: Write the part over the whole as a fraction, with both in the same units, then multiply by 100 to get the percentage.
            codes: [MA4-FRC-C-01]
          - title: Finding a percentage of an amount
            id: mat-finding-percentage-amount
            brief: Change the percentage to a decimal or fraction and multiply, so 15% of $80 is 0.15 × 80 = $12.
            codes: [MA4-FRC-C-01]
          - title: Percentage increase and decrease
            id: mat-percentage-increase-decrease-2-nsw
            brief: Increasing by 20% is multiplying by 1.2, and decreasing by 20% is multiplying by 0.8. Used for discounts, mark-ups and GST at 10%.
            codes: [MA4-FRC-C-01]

      - title: Ratios and rates
        id: nsw-mat-s4-1-4
        points:
          - title: Simplifying ratios
            id: mat-simplifying-ratios-nsw
            brief: A ratio compares quantities of the same kind in the same units. Divide each part by the highest common factor, so 12 to 18 simplifies to 2 to 3.
            codes: [MA4-RAT-C-01]
          - title: Dividing a quantity in a ratio
            id: mat-dividing-quantity-ratio-nsw
            brief: Add the parts of the ratio to find the total number of parts, find the value of one part, then multiply. $60 shared in the ratio 2 to 3 gives $24 and $36.
            codes: [MA4-RAT-C-01]
          - title: Rates and unit rates
            id: mat-rates-unit-rates
            brief: A rate compares quantities with different units, such as km per hour. A unit rate gives the amount for one unit and is used to find the best buy.
            codes: [MA4-RAT-C-01]
          - title: Distance-time graphs
            id: mat-distance-time-graphs
            brief: On a distance-time graph, a steeper line means a faster speed and a flat line means no movement. Reading speed from the graph as distance divided by time.
            codes: [MA4-RAT-C-01]

      - title: Algebraic techniques
        id: nsw-mat-s4-1-5
        points:
          - title: Pronumerals and writing expressions
            id: mat-pronumerals-writing-expressions
            brief: A pronumeral is a letter that stands for a number. Turning words into expressions, so 5 more than twice a number is 2n + 5.
            codes: [MA4-ALG-C-01]
          - title: Substitution
            id: mat-substitution
            brief: Replacing each pronumeral with its value and working out the expression using the order of operations, such as 3a² when a = -2.
            codes: [MA4-ALG-C-01]
          - title: Adding and subtracting like terms
            id: mat-adding-subtracting-like-terms
            brief: Like terms have exactly the same pronumerals with the same powers. Only like terms can be added or subtracted, so 3x + 2y + 5x = 8x + 2y.
            codes: [MA4-ALG-C-01]
          - title: Multiplying and dividing algebraic terms
            id: mat-multiplying-dividing-algebraic-terms
            brief: Multiply the numbers, then the pronumerals, so 3a × 4b = 12ab. Dividing terms is simplifying a fraction, so 12xy ÷ 4x = 3y.
            codes: [MA4-ALG-C-01]
          - title: Expanding brackets
            id: mat-expanding-brackets-nsw
            brief: The distributive law multiplies the term outside the brackets by every term inside, so 3(x - 4) = 3x - 12, watching the sign when a negative is outside.
            codes: [MA4-ALG-C-01]
          - title: Factorising with a common factor
            id: mat-factorising-with-common-factor
            brief: Factorising is expanding in reverse. Take out the highest common factor of every term, numbers and pronumerals, so 6x + 9 = 3(2x + 3).
            codes: [MA4-ALG-C-01]

      - title: Indices
        id: nsw-mat-s4-1-6
        points:
          - title: Prime factors in index form
            id: mat-prime-factors-index-form
            brief: Writing a whole number as a product of primes with a factor tree, then in index form, so 72 = 2³ × 3².
            codes: [MA4-IND-C-01]
          - title: Square roots and cube roots
            id: mat-square-roots-cube-roots
            brief: A square root undoes squaring and a cube root undoes cubing. Finding exact roots of perfect squares and cubes, and estimating others between two whole numbers.
            codes: [MA4-IND-C-01]
          - title: Index laws for multiplying and dividing
            id: mat-index-laws-multiplying-dividing
            brief: When multiplying powers of the same base, add the indices. When dividing, subtract them. So 2⁵ × 2³ = 2⁸ and 5⁶ ÷ 5² = 5⁴.
            codes: [MA4-IND-C-01]
          - title: Power of a power and the zero index
            id: mat-power-power-zero-index-nsw
            brief: A power raised to a power multiplies the indices, so (3²)⁴ = 3⁸. Any non-zero number to the power 0 equals 1.
            codes: [MA4-IND-C-01]

      - title: Equations
        id: nsw-mat-s4-1-7
        points:
          - title: One-step equations
            id: mat-one-step-equations
            brief: An equation stays balanced when the same operation is done to both sides. Solving x + 7 = 12 or 4x = 20 with one inverse operation.
            codes: [MA4-EQU-C-01]
          - title: Two-step equations
            id: mat-two-step-equations
            brief: Undo the operations in reverse order, adding or subtracting first, then multiplying or dividing, so 3x - 5 = 16 gives x = 7.
            codes: [MA4-EQU-C-01]
          - title: Checking a solution by substitution
            id: mat-checking-solution-by-substitution
            brief: Put the solution back into the original equation. If both sides come out equal, the solution is right.
            codes: [MA4-EQU-C-01]
          - title: Simple quadratic equations
            id: mat-simple-quadratic-equations
            brief: An equation such as x² = 49 has two solutions, x = 7 and x = -7, because squaring a negative also gives a positive.
            codes: [MA4-EQU-C-01]

      - title: Linear relationships
        id: nsw-mat-s4-1-8
        points:
          - title: The Cartesian plane
            id: mat-cartesian-plane
            brief: Points are plotted as (x, y), across then up or down, on a plane with four quadrants. Naming the quadrant from the signs of the coordinates.
            codes: [MA4-LIN-C-01]
          - title: Tables of values
            id: mat-tables-values
            brief: Making a table of x and y values from a rule such as y = 2x + 1, then plotting the points. A linear relationship gives points in a straight line.
            codes: [MA4-LIN-C-01]
          - title: Solving equations with graphs
            id: mat-solving-equations-with-graphs-2
            brief: Where two lines cross, both rules are true at once. Reading the x value where a line meets a height y solves the equation.
            codes: [MA4-LIN-C-01]

  - title: Measurement and space
    chapters:
      - title: Length and circles
        id: nsw-mat-s4-2-1
        points:
          - title: Perimeter of shapes and composite figures
            id: mat-perimeter-shapes-composite-figures
            brief: Perimeter is the distance around a shape. For a composite figure, work out any missing side lengths first, then add every outside edge.
            codes: [MA4-LEN-C-01]
          - title: Parts of a circle
            id: mat-parts-circle
            brief: The centre, radius, diameter, chord, arc, sector, segment, tangent and circumference, and the fact that the diameter is twice the radius.
            codes: [MA4-LEN-C-01]
          - title: Circumference of a circle
            id: mat-circumference-circle-nsw
            brief: Pi is the circumference divided by the diameter, about 3.14. Circumference is pi times the diameter, or 2 times pi times the radius.
            codes: [MA4-LEN-C-01]

      - title: Pythagoras' theorem
        id: nsw-mat-s4-2-2
        points:
          - title: The hypotenuse and Pythagoras' theorem
            id: mat-hypotenuse-pythagoras-theorem
            brief: In a right-angled triangle, the hypotenuse is the longest side, opposite the right angle. The square on the hypotenuse equals the sum of the squares on the other two sides.
            codes: [MA4-PYT-C-01]
          - title: Finding the hypotenuse
            id: mat-finding-hypotenuse
            brief: Square the two shorter sides, add them, then take the square root, so sides 6 and 8 give a hypotenuse of 10.
            codes: [MA4-PYT-C-01]
          - title: Finding a shorter side
            id: mat-finding-shorter-side
            brief: Square the hypotenuse, subtract the square of the known shorter side, then take the square root.
            codes: [MA4-PYT-C-01]
          - title: Testing for a right angle
            id: mat-testing-right-angle
            brief: If the square of the longest side equals the sum of the squares of the other two, the triangle is right-angled. Pythagorean triads such as 3, 4, 5 and 5, 12, 13.
            codes: [MA4-PYT-C-01]
          - title: Pythagoras' theorem in problems
            id: mat-pythagoras-theorem-problems
            brief: Drawing a diagram for a worded problem, such as a ladder against a wall or the diagonal of a rectangle, finding the right-angled triangle and solving it.
            codes: [MA4-PYT-C-01]

      - title: Area
        id: nsw-mat-s4-2-3
        points:
          - title: Area of rectangles, triangles and parallelograms
            id: mat-area-rectangles-triangles-parallelograms
            brief: A rectangle is length times width, a parallelogram is base times perpendicular height, and a triangle is half of base times perpendicular height.
            codes: [MA4-ARE-C-01]
          - title: Area of trapeziums, rhombuses and kites
            id: mat-area-trapeziums-rhombuses-kites-nsw
            brief: A trapezium is half the sum of the parallel sides times the height. A rhombus or kite is half the product of its diagonals.
            codes: [MA4-ARE-C-01]
          - title: Area of a circle
            id: mat-area-circle-nsw
            brief: The area of a circle is pi times the radius squared. Using the radius, not the diameter, is the common mistake to avoid.
            codes: [MA4-ARE-C-01]
          - title: Area of sectors and composite shapes
            id: mat-area-sectors-composite-shapes
            brief: A sector's area is the fraction of the circle given by its angle over 360. A composite shape is split into simple shapes, then areas are added or subtracted.
            codes: [MA4-ARE-C-01]
          - title: Converting units of area
            id: mat-converting-units-area
            brief: Since 1 cm = 10 mm, 1 cm² = 100 mm². In the same way 1 m² = 10,000 cm², and a hectare is 10,000 m². Choosing a sensible unit for an area.
            codes: [MA4-ARE-C-01]

      - title: Volume
        id: nsw-mat-s4-2-4
        points:
          - title: Views of solids
            id: mat-views-solids
            brief: The front, side and top views of a prism or a solid built from prisms, and matching a solid to its views.
            codes: [MA4-VOL-C-01]
          - title: Volume of a prism
            id: mat-volume-prism
            brief: The volume of any prism is the area of its cross-section times its length or height, V = Ah, with the answer in cubic units.
            codes: [MA4-VOL-C-01]
          - title: Volume of a cylinder
            id: mat-volume-cylinder
            brief: A cylinder's cross-section is a circle, so its volume is pi times the radius squared times the height.
            codes: [MA4-VOL-C-01]
          - title: Volume and capacity units
            id: mat-volume-capacity-units
            brief: Converting between cubic units, and between volume and capacity, using 1 cm³ = 1 mL and 1 m³ = 1000 L.
            codes: [MA4-VOL-C-01]

      - title: Angle relationships
        id: nsw-mat-s4-2-5
        points:
          - title: Naming angles and geometry notation
            id: mat-naming-angles-geometry-notation
            brief: Naming an angle with three letters, the vertex in the middle, and the marks for equal sides, equal angles and parallel lines. Acute, right, obtuse, straight, reflex and revolution.
            codes: [MA4-ANG-C-01]
          - title: Angles at a point and on a line
            id: mat-angles-at-point-line
            brief: Angles on a straight line add to 180°, angles at a point add to 360°, and vertically opposite angles are equal.
            codes: [MA4-ANG-C-01]
          - title: Angles and parallel lines
            id: mat-angles-parallel-lines
            brief: When a transversal crosses parallel lines, corresponding angles are equal, alternate angles are equal and co-interior angles add to 180°.
            codes: [MA4-ANG-C-01]
          - title: Giving reasons for angles
            id: mat-giving-reasons-angles
            brief: Finding unknown angles in steps and naming the rule used for each step, and using the angle rules to show that two lines are parallel.
            codes: [MA4-ANG-C-01]

      - title: Triangles and quadrilaterals
        id: nsw-mat-s4-2-6
        points:
          - title: Classifying triangles
            id: mat-classifying-triangles-nsw
            brief: By sides, triangles are equilateral, isosceles or scalene. By angles, they are acute-angled, right-angled or obtuse-angled.
            codes: [MA4-GEO-C-01]
          - title: Angle sum and exterior angle of a triangle
            id: mat-angle-sum-exterior-angle
            brief: The angles of a triangle add to 180°. An exterior angle equals the sum of the two opposite interior angles.
            codes: [MA4-GEO-C-01]
          - title: Classifying quadrilaterals
            id: mat-classifying-quadrilaterals-nsw
            brief: Squares, rectangles, rhombuses, parallelograms, trapeziums and kites, and how one family includes another, such as a square being a special rectangle.
            codes: [MA4-GEO-C-01]
          - title: Properties of quadrilaterals
            id: mat-properties-quadrilaterals-nsw
            brief: Comparing quadrilaterals by their sides, angles and diagonals, such as whether the diagonals bisect each other or meet at right angles. The angles of any quadrilateral add to 360°.
            codes: [MA4-GEO-C-01]

  - title: Statistics and probability
    chapters:
      - title: Data classification and visualisation
        id: nsw-mat-s4-3-1
        points:
          - title: Categorical and numerical data
            id: mat-categorical-numerical-data-nsw
            brief: Categorical data sorts into groups, nominal with no order and ordinal with an order. Numerical data is counted (discrete) or measured (continuous).
            codes: [MA4-DAT-C-01]
          - title: Choosing a graph
            id: mat-choosing-graph
            brief: Which display suits which data, such as a column graph for categories, a line graph for change over time and a histogram for grouped numerical data.
            codes: [MA4-DAT-C-01]
          - title: Dot plots and stem-and-leaf plots
            id: mat-dot-plots-stem-leaf
            brief: Reading and building dot plots and stem-and-leaf plots, which keep every value and show where data clusters.
            codes: [MA4-DAT-C-01]
          - title: Reading graphs critically
            id: mat-reading-graphs-critically
            brief: Interpreting what a graph shows, and spotting ways a graph can mislead, such as an axis that does not start at zero or uneven scales.
            codes: [MA4-DAT-C-01]

      - title: Data analysis
        id: nsw-mat-s4-3-2
        points:
          - title: The mean
            id: mat-mean
            brief: The mean is the total of the values divided by how many values there are. Finding a missing value when the mean is known.
            codes: [MA4-DAT-C-02]
          - title: Median, mode and range
            id: mat-median-mode-range
            brief: The median is the middle value once the data is in order, the mode is the most common value, and the range is the highest minus the lowest.
            codes: [MA4-DAT-C-02]
          - title: The effect of an outlier
            id: mat-effect-outlier
            brief: An outlier is a value far from the rest. It pulls the mean towards it and changes the range a lot, but barely moves the median.
            codes: [MA4-DAT-C-02]
          - title: Comparing two datasets
            id: mat-comparing-two-datasets
            brief: Comparing two groups by their centre and spread, and drawing a conclusion that the data supports.
            codes: [MA4-DAT-C-02]

      - title: Probability
        id: nsw-mat-s4-3-3
        points:
          - title: Sample spaces and outcomes
            id: mat-sample-spaces-outcomes
            brief: The sample space is the list of all possible outcomes. Outcomes are equally likely when each has the same chance, such as the faces of a fair die.
            codes: [MA4-PRO-C-01]
          - title: Theoretical probability
            id: mat-theoretical-probability
            brief: The probability of an event is the number of favourable outcomes over the total number of equally likely outcomes, from 0 for impossible to 1 for certain.
            codes: [MA4-PRO-C-01]
          - title: Complementary events
            id: mat-complementary-events-2-nsw
            brief: The complement of an event is the event not happening. The two probabilities add to 1, so P(not A) = 1 - P(A).
            codes: [MA4-PRO-C-01]
          - title: Experimental probability
            id: mat-experimental-probability
            brief: Relative frequency is the number of times an event happened over the number of trials. The more trials, the closer it tends to get to the theoretical probability.
            codes: [MA4-PRO-C-01]
