# NSW Physics, Year 12: Modules 5 to 8, 49 points.
# Drafted from NESA's Physics Stage 6 Syllabus (2017), the syllabus taught in Year 12 until the 2027 HSC. The structure
# follows the syllabus: each module is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: the Physics 11-12 Syllabus (2025) replaces this one for Year 12 from Term 4 2027 (first HSC 2028).

id: nsw-phys-12
subject: Physics
bank: phys
name: Physics, Year 12
about: HSC, Mechanics, electromagnetism, light and the atom
short: Physics
years: [12]
place: nsw
kind: standard
syllabus: NSW Physics Stage 6 Syllabus (2017), Year 12 course, Modules 5 to 8
note: Follows the NSW Physics syllabus. Not made or endorsed by NESA.
chips: [projectile, orbit, induction, photoelectric, half-life]

units:
  - title: Advanced mechanics
    chapters:
      - title: Projectiles and circular motion
        id: nsw-phys-12-1-1
        points:
          - title: Projectile motion
            id: phys-projectile-motion
            brief: A projectile moves at constant horizontal velocity while gravity accelerates it downwards, so the two directions are treated separately.
          - title: Range and time of flight
            id: phys-range-time-flight
            brief: Launch speed and angle set how far and how long a projectile flies. Ignoring air resistance, 45° gives the longest range on level ground.
          - title: Uniform circular motion
            id: phys-uniform-circular-motion
            brief: An object moving in a circle at constant speed is accelerating towards the centre. Centripetal force is F = mv²/r.
          - title: Banked curves
            id: phys-banked-curves
            brief: Tilting a road lets part of the normal force supply the centripetal force, so cars can take the curve at a set speed without relying on friction.
          - title: Torque
            id: phys-torque
            brief: Torque is the turning effect of a force, τ = r F sin θ. A longer spanner gives more torque for the same force.

      - title: Gravity and orbits
        id: nsw-phys-12-1-2
        points:
          - title: Newton's law of universal gravitation
            id: phys-newton-s-law-universal
            brief: Every two masses attract with a force F = GMm/r², proportional to their masses and inversely to the square of their distance.
          - title: Gravitational field strength
            id: phys-gravitational-field-strength
            brief: g = GM/r², the force per kilogram at a distance r from a mass. At the Earth's surface it is about 9.8 N/kg.
          - title: Orbital motion
            id: phys-orbital-motion
            brief: For a satellite, gravity provides the centripetal force. Its orbital speed depends only on the mass it orbits and the radius.
          - title: Kepler's laws
            id: phys-kepler-s-laws
            brief: Planets move in ellipses, sweep equal areas in equal times, and r³/T² is the same for every body orbiting the same central mass.
          - title: Escape velocity and gravitational potential energy
            id: phys-escape-velocity-gravitational-potential
            brief: Gravitational potential energy is U = -GMm/r. Escape velocity is the launch speed needed to leave a planet's gravity without further thrust.

  - title: Electromagnetism
    chapters:
      - title: Charged particles and fields
        id: nsw-phys-12-2-1
        points:
          - title: Charges in electric fields
            id: phys-charges-electric-fields
            brief: A charge between parallel plates feels a constant force, F = qE with E = V/d, and moves like a projectile.
          - title: Charges in magnetic fields
            id: phys-charges-magnetic-fields
            brief: A moving charge in a magnetic field feels a force F = qvB sin θ at right angles to its motion, so it moves in a circle.
          - title: Force on a current-carrying wire
            id: phys-force-current-carrying-wire
            brief: A wire carrying current in a magnetic field feels a force F = BIL sin θ, whose direction follows the right-hand rule.
          - title: Force between parallel wires
            id: phys-force-between-parallel-wires
            brief: Two parallel wires attract if their currents run the same way and repel if opposite. The force per metre is μ₀I₁I₂/2πr.
          - title: DC motors
            id: phys-dc-motors
            brief: Forces on the sides of a current-carrying coil in a magnetic field make it turn. A split-ring commutator reverses the current each half turn.

      - title: Electromagnetic induction
        id: nsw-phys-12-2-2
        points:
          - title: Magnetic flux
            id: phys-magnetic-flux
            brief: Flux is the amount of magnetic field passing through an area, Φ = BA cos θ, measured in webers.
          - title: Faraday's law
            id: phys-faraday-s-law
            brief: A changing magnetic flux induces an emf, and the faster the flux changes, the bigger the emf.
          - title: Lenz's law
            id: phys-lenz-s-law
            brief: The induced current flows in the direction that opposes the change in flux that caused it, which follows from conservation of energy.
          - title: Generators
            id: phys-generators
            brief: Turning a coil in a magnetic field induces an alternating emf. Slip rings give AC and a commutator gives DC.
          - title: Back emf in motors
            id: phys-back-emf-motors
            brief: A spinning motor coil acts as a generator, making an emf that opposes the supply. This is why motors draw most current when starting.
          - title: Transformers
            id: phys-transformers
            brief: An alternating current in one coil induces an emf in another, with Vp/Vs = Np/Ns. Power lines use high voltage to cut energy lost as heat.
          - title: AC induction motors
            id: phys-ac-induction-motors
            brief: A rotating magnetic field induces currents in the rotor, which then turns to follow the field. They have no brushes and need little upkeep.

  - title: The nature of light
    chapters:
      - title: Light as a wave
        id: nsw-phys-12-3-1
        points:
          - title: Maxwell and electromagnetic waves
            id: phys-maxwell-electromagnetic-waves
            brief: Maxwell predicted that changing electric and magnetic fields travel together as waves at the speed of light, so light is an electromagnetic wave.
          - title: The electromagnetic spectrum
            id: phys-electromagnetic-spectrum
            brief: Radio, microwave, infrared, visible, ultraviolet, X-ray and gamma rays differ only in wavelength and frequency, and all travel at c in a vacuum.
          - title: Young's double slit experiment
            id: phys-young-s-double-slit
            brief: Light through two slits makes bright and dark bands, showing interference, which only waves do. Fringe spacing follows d sin θ = mλ.
          - title: Diffraction gratings
            id: phys-diffraction-gratings
            brief: Many narrow slits spread light into sharp bright lines, used to measure wavelengths and analyse spectra.
          - title: Polarisation
            id: phys-polarisation
            brief: Light waves can be filtered so they vibrate in one plane. Malus's law, I = I₀cos²θ, gives the intensity through a second filter.

      - title: Light as particles
        id: nsw-phys-12-3-2
        points:
          - title: Black body radiation
            id: phys-black-body-radiation
            brief: Hot objects give off a spectrum whose peak wavelength gets shorter as they get hotter, as in Wien's law. Planck explained it with energy in packets.
          - title: Photons
            id: phys-photons
            brief: Light comes in packets of energy E = hf, so higher frequency light carries more energy per photon.
          - title: The photoelectric effect
            id: phys-photoelectric-effect
            brief: Light above a threshold frequency ejects electrons from a metal, however dim it is. Einstein explained this with photons, which the wave model could not.
          - title: Spectra and stars
            id: phys-spectra-stars
            brief: Emission and absorption lines identify the elements in a star, and a star's colour shows its surface temperature.

      - title: Special relativity
        id: nsw-phys-12-3-3
        points:
          - title: The postulates of special relativity
            id: phys-postulates-special-relativity
            brief: The laws of physics are the same in every inertial frame, and the speed of light in a vacuum is the same for every observer.
          - title: Time dilation
            id: phys-time-dilation
            brief: A moving clock runs slow compared with a stationary observer's, by the Lorentz factor. Muons from the upper atmosphere reaching the ground support this.
          - title: Length contraction
            id: phys-length-contraction
            brief: A moving object is shorter along its direction of motion, as measured by a stationary observer.
          - title: Mass and energy
            id: phys-mass-energy
            brief: E = mc² means mass is a form of energy. Relativistic momentum grows without limit as speed nears c, so nothing with mass reaches it.

  - title: From the universe to the atom
    chapters:
      - title: Stars and the universe
        id: nsw-phys-12-4-1
        points:
          - title: The Big Bang and expansion
            id: phys-big-bang-expansion
            brief: The universe began hot and dense and has been expanding since. Evidence includes the cosmic microwave background and red-shifted galaxies.
          - title: Hubble's law
            id: phys-hubble-s-law
            brief: More distant galaxies move away faster, v = H₀d, which shows the universe is expanding.
          - title: The Hertzsprung-Russell diagram
            id: phys-hertzsprung-russell-diagram
            brief: A plot of stars' luminosity against surface temperature, showing the main sequence, giants and white dwarfs, and how stars change over their lives.
          - title: Fusion in stars
            id: phys-fusion-stars
            brief: Stars release energy by fusing hydrogen into helium, through the proton-proton chain in smaller stars and the CNO cycle in larger ones.

      - title: Models of the atom
        id: nsw-phys-12-4-2
        points:
          - title: Thomson and the electron
            id: phys-thomson-electron
            brief: Thomson's cathode ray experiments showed rays were made of negative particles, electrons, and measured their charge to mass ratio.
          - title: Millikan's oil drop experiment
            id: phys-millikan-s-oil-drop
            brief: Millikan balanced charged oil drops in an electric field and found charge comes in whole multiples of the electron's charge.
          - title: Rutherford's nuclear model
            id: phys-rutherford-s-nuclear-model
            brief: Alpha particles fired at gold foil mostly passed through, but a few bounced back, showing a tiny, dense, positive nucleus.
          - title: The Bohr model
            id: phys-bohr-model
            brief: Electrons sit in fixed energy levels. Moving between them absorbs or emits a photon of set energy, explaining hydrogen's line spectrum.
          - title: Matter waves
            id: phys-matter-waves
            brief: De Broglie proposed that particles have wavelengths, λ = h/mv. Electron diffraction confirmed it, and Schrödinger built a wave model of the atom.

      - title: The nucleus
        id: nsw-phys-12-4-3
        points:
          - title: Radioactive decay
            id: phys-radioactive-decay
            brief: Unstable nuclei emit alpha particles, beta particles or gamma rays. Each has different charge, mass and penetrating power.
          - title: Half-life
            id: phys-half-life
            brief: The time for half of the radioactive nuclei in a sample to decay. It is constant for each isotope.
          - title: Mass defect and binding energy
            id: phys-mass-defect-binding-energy
            brief: A nucleus has less mass than its separate parts. The missing mass is the binding energy, found with E = mc².
          - title: Fission and fusion
            id: phys-fission-fusion
            brief: Fission splits heavy nuclei and fusion joins light ones. Both release energy because the products are more tightly bound.
          - title: The standard model
            id: phys-standard-model
            brief: Matter is made of quarks and leptons, and forces are carried by particles such as photons and gluons. Protons and neutrons are made of quarks.
