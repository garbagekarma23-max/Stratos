# Victorian Curriculum 2.0 History, Levels 7 and 8: the overview, all four investigations and the historical skills, 56 points.
# Follows the VCAA's Victorian Curriculum F-10 Version 2.0, History (published June 2024), checked on the VCAA's F-10
# site (f10.vcaa.vic.edu.au) in November 2026. VC2.0 sets History in two-level bands from Levels 3 to 10, so this is
# one outline for Levels 7 and 8. VC2.0 replaced Version 1.0 (taught from 2017): optional from 2025, and taught in
# full in Victorian government schools from 2026 (Catholic and independent schools set their own timelines). No newer
# version is announced.
# Structure: each Historical Knowledge and Understanding sub-strand is a unit (the Overview and the four
# Investigations, all required at this band), and the Historical Concepts and Skills strand is the last unit.
# Options picked where schools choose: Ancient societies covers Egypt, Greece and Rome (China and India can be added);
# Europe and the Mediterranean world covers Medieval Europe and Renaissance Italy (the Emergence of the modern world,
# the Ottoman Empire, the Spanish and the Americas, and the Vikings can be added); Asia and the Pacific covers Japan
# under the Shoguns and the Mongol expansion (the Khmer Empire and Polynesian expansion can be added).
# The overview is taught in breadth, not depth, so it has fewer points. Codes are VC2.0 content description codes.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-his-78
subject: History
bank: his
name: History, Levels 7 and 8
about: Victorian Curriculum 2.0, Levels 7 and 8
short: History
years: [7, 8]
level: Levels 7 and 8
place: vic
kind: standard
syllabus: "Victorian Curriculum F-10 Version 2.0: History, Levels 7 and 8"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [Deep Time, ancient Egypt, Roman Empire, feudalism, samurai, primary sources]

units:
  - title: Overview of the ancient to the early modern world
    chapters:
      - title: The first people and societies
        id: vic-his-78-1-1
        points:
          - title: Early human migration
            id: his-early-human-migration-vic
            brief: Modern humans first lived in Africa and spread across the world over tens of thousands of years, and historians and scientists still debate the routes and timing.
            codes: [VC2HH8K01]
          - title: Reaching Sahul
            id: his-reaching-sahul
            brief: When sea levels were lower, Australia, New Guinea and Tasmania formed one landmass called Sahul, and the ancestors of Aboriginal and Torres Strait Islander Peoples reached it by sea at least 50,000 years ago.
            codes: [VC2HH8K01]
          - title: The first farmers
            id: his-first-farmers
            brief: Growing crops and keeping animals let people settle in one place, which led to villages, food surpluses, trade and new jobs beyond finding food.
            codes: [VC2HH8K02]
          - title: Features of early societies
            id: his-features-early-societies
            brief: Early societies developed tools, writing, laws, religions and social classes, which helped them organise large numbers of people.
            codes: [VC2HH8K02]
          - title: How archaeologists study the past
            id: his-archaeologists-study-past
            brief: Archaeologists excavate sites, study artefacts and date finds with methods such as carbon dating, and conserving sites and objects keeps the evidence for the future.
            codes: [VC2HH8K03]

      - title: From the ancient to the early modern world
        id: vic-his-78-1-2
        points:
          - title: The end of the Western Roman Empire
            id: his-end-western-roman-empire
            brief: The Western Roman Empire collapsed in 476 CE, while the Eastern Roman (Byzantine) Empire lasted until 1453, and much of Rome's law, language and religion carried on.
            codes: [VC2HH8K04]
          - title: The spread of world religions
            id: his-spread-world-religions
            brief: Between 600 and 1750 CE, Christianity, Islam and Buddhism spread across continents through trade, conquest and missionaries, shaping laws and ways of life.
            codes: [VC2HH8K04]
          - title: Trade and contact across the world
            id: his-trade-contact-across-world
            brief: The Silk Roads and Indian Ocean sea routes carried goods, ideas, religions and diseases between Asia, Africa and Europe.
            codes: [VC2HH8K05]
          - title: Social structures in the pre-modern world
            id: his-social-structures-pre-modern
            brief: Most pre-modern societies were ranked, with rulers and nobles at the top and peasants or enslaved people at the bottom, and few could change their place.
            codes: [VC2HH8K05]

  - title: Aboriginal and Torres Strait Islander knowledge from Deep Time
    chapters:
      - title: Country and Deep Time
        id: vic-his-78-2-1
        points:
          - title: Deep Time and the oldest continuous cultures
            id: his-deep-time-oldest-continuous
            brief: Deep Time is the tens of thousands of years Aboriginal and Torres Strait Islander Peoples have lived in Australia, making theirs the world's oldest continuous cultures.
            codes: [VC2HH8K11]
          - title: Creation stories and Country
            id: his-creation-stories-country
            brief: Creation stories, such as the Kulin Nations' stories of Bunjil, pass on knowledge of how Country, people and law came to be through story, song, dance and art.
            codes: [VC2HH8K06]
          - title: Living through environmental change
            id: his-living-through-environmental-change
            brief: As the last ice age ended, rising seas cut off Tasmania and formed the Torres Strait Islands, megafauna died out and inland lakes dried, and people adapted how and where they lived.
            codes: [VC2HH8K07]
          - title: Changing evidence about the past
            id: his-changing-evidence-about-past
            brief: Finds such as the ancient burials at Lake Mungo and dating at Madjedbebe have pushed back the known age of human life in Australia and changed how historians write about it.
            codes: [VC2HH8K11]

      - title: Communities, knowledge and care for Country
        id: vic-his-78-2-2
        points:
          - title: Kinship systems
            id: his-kinship-systems
            brief: Kinship systems, including moieties and totems, set each person's relationships, roles and responsibilities to others and to Country.
            codes: [VC2HH8K08]
          - title: Land and sea management
            id: his-land-sea-management
            brief: Aboriginal Peoples managed Country with cultural burning, fish traps and weirs, such as the Gunditjmara eel traps at Budj Bim in western Victoria.
            codes: [VC2HH8K09]
          - title: Trade networks and technologies
            id: his-trade-networks-technologies
            brief: Goods such as ochre, stone axes and shells were traded across long distances, and tools like ground-edge axes show changing technology over time.
            codes: [VC2HH8K09]
          - title: Cultural protocols and heritage
            id: his-cultural-protocols-heritage
            brief: Ancestral remains, sacred sites and artefacts must be cared for with the permission of Traditional Owners, which is why remains held in museums are being returned to Country.
            codes: [VC2HH8K10]

  - title: Ancient societies
    chapters:
      - title: Ancient Egypt
        id: vic-his-78-3-1
        points:
          - title: The Nile and Egyptian life
            id: his-nile-egyptian-life
            brief: The Nile's yearly flood left rich soil in a desert land, so farming, towns and the power of the pharaohs all grew along the river.
            codes: [VC2HH8K12]
          - title: Pharaohs and Egyptian society
            id: his-pharaohs-egyptian-society
            brief: Egyptian society was a pyramid with the pharaoh, seen as a living god, at the top, then priests and officials, scribes, craftspeople and the farmers who were most of the people.
            codes: [VC2HH8K13]
          - title: Death and the afterlife in Egypt
            id: his-death-afterlife-egypt-vic
            brief: Egyptians believed the dead lived on, so bodies were mummified and buried with goods, and pharaohs built pyramids and later hidden tombs in the Valley of the Kings.
            codes: [VC2HH8K14]
          - title: Hatshepsut
            id: his-hatshepsut-vic
            brief: Hatshepsut ruled Egypt as pharaoh for about 20 years, sending trade missions to Punt and building temples, though later rulers tried to erase her name.
            codes: [VC2HH8K17]
          - title: Egypt's legacy
            id: his-egypt-s-legacy
            brief: Egypt left hieroglyphic writing, monuments, mathematics and medicine, and the decoding of the Rosetta Stone in the 1820s opened its records to historians.
            codes: [VC2HH8K18]

      - title: Ancient Greece
        id: vic-his-78-3-2
        points:
          - title: Geography and the city-states
            id: his-geography-city-states
            brief: Mountains and sea split Greece into independent city-states such as Athens and Sparta, and poor farmland pushed Greeks to trade and found colonies.
            codes: [VC2HH8K12]
          - title: Athenian democracy
            id: his-athenian-democracy
            brief: In Athens adult male citizens voted directly on laws in the Assembly, but women, enslaved people and foreigners were left out.
            codes: [VC2HH8K13]
          - title: Life in Sparta
            id: his-life-sparta-vic
            brief: Sparta trained its boys as soldiers from age seven, relied on helots to farm, and gave women more property and freedom than Athens did.
            codes: [VC2HH8K13, VC2HH8K14]
          - title: The Persian and Peloponnesian Wars
            id: his-persian-peloponnesian-wars
            brief: Greek city-states united to defeat Persia at battles such as Marathon and Salamis, then Athens and Sparta fought each other in the Peloponnesian War, which Sparta won.
            codes: [VC2HH8K15, VC2HH8K16]
          - title: Greek gods and legacy
            id: his-greek-gods-legacy
            brief: Greeks worshipped gods such as Zeus and Athena at temples and festivals like the Olympic Games, and left ideas in philosophy, theatre and democracy still used today.
            codes: [VC2HH8K14, VC2HH8K18]

      - title: Ancient Rome
        id: vic-his-78-3-3
        points:
          - title: From republic to empire
            id: his-from-republic-empire-vic
            brief: Rome was a republic ruled by elected officials and the Senate until civil wars ended it, and Augustus became the first emperor in 27 BCE.
            codes: [VC2HH8K15]
          - title: Roman society
            id: his-roman-society-vic
            brief: Roman society was divided into patricians, plebeians and enslaved people, and the father had legal power over his whole household.
            codes: [VC2HH8K13]
          - title: The Roman army and expansion
            id: his-roman-army-expansion
            brief: Rome's trained legions conquered lands around the Mediterranean, and roads, forts and Roman law held the empire together.
            codes: [VC2HH8K16]
          - title: Julius Caesar
            id: his-julius-caesar
            brief: Julius Caesar won great victories in Gaul, crossed the Rubicon to seize power in Rome and was murdered in 44 BCE by senators who feared he would be king.
            codes: [VC2HH8K17]
          - title: Pompeii and daily life
            id: his-pompeii-daily-life
            brief: The eruption of Vesuvius in 79 CE buried Pompeii, preserving houses, food and graffiti that show historians how ordinary Romans lived.
            codes: [VC2HH8K14, VC2HH8K18]

  - title: Europe and the Mediterranean world, c. 600 to 1750
    chapters:
      - title: Medieval Europe
        id: vic-his-78-4-1
        points:
          - title: The feudal system
            id: his-feudal-system
            brief: Under feudalism the king granted land to nobles in return for loyalty and soldiers, knights served lords, and peasants worked the land for protection.
            codes: [VC2HH8K19, VC2HH8K21]
          - title: The Church in medieval life
            id: his-church-medieval-life
            brief: The Catholic Church ran schools and hospitals, collected a tithe, and shaped daily life from birth to death, and its power sometimes rivalled the king's.
            codes: [VC2HH8K19]
          - title: The Black Death
            id: his-black-death
            brief: The plague that reached Europe in 1347 killed about a third of its people, and the labour shortage that followed gave surviving peasants more power to demand better pay.
            codes: [VC2HH8K20]
          - title: The Crusades
            id: his-crusades-vic
            brief: From 1096 Christian armies from Europe fought to take Jerusalem and the Holy Land, which brought war but also trade and new ideas between Europe and the Muslim world.
            codes: [VC2HH8K20]
          - title: Magna Carta
            id: his-magna-carta-vic
            brief: In 1215 English barons forced King John to sign Magna Carta, which said the king too was under the law, an idea later used to argue for rights.
            codes: [VC2HH8K21, VC2HH8K23]

      - title: Renaissance Italy
        id: vic-his-78-4-2
        points:
          - title: What the Renaissance was
            id: his-renaissance-was-vic
            brief: The Renaissance was a rebirth of interest in Greek and Roman learning that began in Italy in the 1300s and put human abilities at the centre of art and study.
            codes: [VC2HH8K19]
          - title: Florence and the Medici
            id: his-florence-medici
            brief: The Medici banking family ruled Florence and paid artists and scholars, which made the city a centre of Renaissance art.
            codes: [VC2HH8K22]
          - title: Leonardo and Michelangelo
            id: his-leonardo-michelangelo
            brief: Leonardo da Vinci joined art with science and invention, and Michelangelo painted the Sistine Chapel ceiling and carved the statue of David.
            codes: [VC2HH8K22]
          - title: The printing press spreads ideas
            id: his-printing-press-spreads-ideas
            brief: Gutenberg's printing press of about 1450 made books cheaper and faster to make, so Renaissance and religious ideas spread across Europe.
            codes: [VC2HH8K20, VC2HH8K23]

  - title: Asia and the Pacific region, c. 600 to 1750
    chapters:
      - title: Japan under the Shoguns
        id: vic-his-78-5-1
        points:
          - title: Shoguns, daimyo and samurai
            id: his-shoguns-daimyo-samurai
            brief: In feudal Japan the emperor had little real power, while the shogun ruled as military leader, daimyo held lands and samurai warriors served them.
            codes: [VC2HH8K24, VC2HH8K26]
          - title: Bushido and samurai life
            id: his-bushido-samurai-life
            brief: Samurai followed a code of loyalty, honour and self-discipline later called bushido, and studied poetry and tea ceremony as well as fighting.
            codes: [VC2HH8K24]
          - title: Tokugawa Ieyasu unifies Japan
            id: his-tokugawa-ieyasu-unifies-japan
            brief: After long civil wars, Tokugawa Ieyasu won the Battle of Sekigahara in 1600 and became shogun in 1603, starting more than 250 years of peace.
            codes: [VC2HH8K25, VC2HH8K27]
          - title: Japan's closed country policy
            id: his-japan-s-closed-country
            brief: The Tokugawa shoguns banned Christianity and limited foreign trade to a few ports such as Nagasaki, keeping Japan largely closed off for over 200 years.
            codes: [VC2HH8K25, VC2HH8K28]

      - title: The Mongol expansion
        id: vic-his-78-5-2
        points:
          - title: Genghis Khan
            id: his-genghis-khan-vic
            brief: Genghis Khan united the Mongol tribes in 1206 and led them to conquer much of Asia, creating the largest land empire the world had seen.
            codes: [VC2HH8K27]
          - title: How the Mongols conquered
            id: his-mongols-conquered-vic
            brief: Mongol armies of skilled horse archers moved fast, used clever tactics and terror, and took in engineers from conquered peoples to besiege cities.
            codes: [VC2HH8K25]
          - title: Trade under Mongol rule
            id: his-trade-under-mongol-rule
            brief: Mongol rule made the Silk Roads safer, so goods, ideas and travellers such as Marco Polo moved more freely between China and Europe.
            codes: [VC2HH8K24]
          - title: Kublai Khan and Yuan China
            id: his-kublai-khan-yuan-china
            brief: Genghis Khan's grandson Kublai Khan conquered China and founded the Yuan dynasty, ruling Chinese people through Mongol officials.
            codes: [VC2HH8K26, VC2HH8K28]

  - title: Historical concepts and skills
    chapters:
      - title: Thinking like a historian
        id: vic-his-78-6-1
        points:
          - title: Historical questions
            id: his-historical-questions
            brief: A good historical question is open, can be answered with evidence and guides what sources to look for.
            codes: [VC2HH8S01]
          - title: Chronology and dating
            id: his-chronology-dating
            brief: Historians order events on timelines, count years as BCE and CE, and group them into centuries, so the 1400s are the 15th century.
            codes: [VC2HH8S02]
          - title: Primary and secondary sources
            id: his-primary-secondary-sources-vic
            brief: A primary source comes from the time being studied, such as a letter or a coin. A secondary source is made later, such as a textbook.
            codes: [VC2HH8S03]
          - title: How useful a source is
            id: his-useful-source
            brief: A source's usefulness depends on who made it, when, why and for whom, and on what question it is being used to answer.
            codes: [VC2HH8S04]
          - title: Perspectives in sources
            id: his-perspectives-sources
            brief: A perspective is the point of view of a person or group at the time, shaped by their beliefs, values and place in society.
            codes: [VC2HH8S05]
          - title: Continuity, change, causes and consequences
            id: his-continuity-change-causes-consequences
            brief: Continuity is what stays the same and change is what differs over time. Causes explain why something happened and consequences are its results.
            codes: [VC2HH8S07, VC2HH8S08]
          - title: Significance and interpretation
            id: his-significance-interpretation
            brief: Historians judge an event's significance by its effects at the time and later, and they can reach different interpretations from the same evidence.
            codes: [VC2HH8S06, VC2HH8S09, VC2HH8S10]
