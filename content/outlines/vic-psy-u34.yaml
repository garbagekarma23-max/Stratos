units:
  - title: "Unit 3: How does experience affect behaviour and mental processes?"
    chapters:
      - title: The nervous system
        id: vic-psy-u34-1-1
        points:
          - title: Central and peripheral nervous systems
            id: psy-central-peripheral-nervous-systems
            brief: The central nervous system is the brain and spinal cord. The peripheral nervous system carries messages between them and the rest of the body.
          - title: Somatic and autonomic nervous systems
            id: psy-somatic-autonomic-nervous-systems
            brief: The somatic system carries sensory messages in and voluntary movement messages out. The autonomic system runs organs and glands without conscious effort.
          - title: Sympathetic and parasympathetic
            id: psy-sympathetic-parasympathetic
            brief: The sympathetic nervous system readies the body for action, raising heart rate and breathing. The parasympathetic system calms it and keeps it steady.
          - title: Conscious and unconscious responses
            id: psy-conscious-unconscious-responses
            brief: A conscious response involves awareness and choice. An unconscious response, such as a spinal reflex, happens before the brain is aware of the stimulus.
          - title: The spinal reflex
            id: psy-spinal-reflex
            brief: A sensory neuron passes a signal to an interneuron in the spinal cord, which signals a motor neuron, so the body pulls away from danger before the brain registers pain.
          - title: Neurotransmitters at the synapse
            id: psy-neurotransmitters-at-synapse
            brief: A neuron releases neurotransmitters across the synaptic gap to receptors on the next neuron. Glutamate is excitatory and GABA is inhibitory.
          - title: Neuromodulators
            id: psy-neuromodulators
            brief: Neuromodulators such as dopamine and serotonin act on many neurons at once, changing how they respond. Dopamine links to reward and movement, serotonin to mood and sleep.
          - title: Synaptic plasticity
            id: psy-synaptic-plasticity
            brief: Synapses change with use. Long-term potentiation strengthens a connection that is used often; long-term depression weakens one that is not. Sprouting, rerouting and pruning also reshape them.

      - title: Stress
        id: vic-psy-u34-1-2
        points:
          - title: Stress and stressors
            id: psy-stress-stressors
            brief: Stress is a state of psychological and physiological arousal from a stressor. Stressors can be internal, such as worry, or external, such as an exam.
          - title: Fight, flight or freeze
            id: psy-fight-flight-or-freeze
            brief: An acute stress response in which the sympathetic system prepares the body to fight, run, or freeze to avoid notice.
          - title: Cortisol
            id: psy-cortisol
            brief: Cortisol is a stress hormone that keeps energy available during a long stressor, but staying high for a long time weakens the immune system.
          - title: General adaptation syndrome
            id: psy-general-adaptation-syndrome
            brief: Selye's model of the body's stress response over time, alarm reaction (shock, then countershock), resistance, then exhaustion.
          - title: The transactional model of stress
            id: psy-transactional-model-stress
            brief: Lazarus and Folkman's model says stress depends on how a person appraises a stressor and their resources to cope, in primary and secondary appraisal.
          - title: The gut-brain axis
            id: psy-gut-brain-axis
            brief: The gut and brain send signals both ways through the vagus nerve and gut microbes. Stress can change gut microbes, and gut health can affect mood.
          - title: Approach and avoidance coping
            id: psy-approach-avoidance-coping
            brief: Approach strategies deal with the stressor directly. Avoidance strategies keep away from it, which can help briefly but often leaves the problem in place.
          - title: Coping flexibility and exercise
            id: psy-coping-flexibility-exercise
            brief: Coping flexibility is noticing when a strategy is not working and switching. Exercise uses up stress hormones and improves mood and sleep.

      - title: Approaches to learning
        id: vic-psy-u34-1-3
        points:
          - title: Classical conditioning
            id: psy-classical-conditioning
            brief: A neutral stimulus paired with an unconditioned stimulus comes to cause a conditioned response, in three phases (before, during and after conditioning).
          - title: Operant conditioning
            id: psy-operant-conditioning
            brief: Learning by consequences in a three-phase model, antecedent, behaviour, consequence. Reinforcement makes a behaviour more likely; punishment makes it less likely.
          - title: Positive and negative reinforcement
            id: psy-positive-negative-reinforcement
            brief: Positive reinforcement adds something pleasant. Negative reinforcement takes away something unpleasant. Both make a behaviour more likely, unlike punishment.
          - title: Observational learning
            id: psy-observational-learning
            brief: Learning by watching a model, in five steps, attention, retention, reproduction, motivation and reinforcement.
          - title: Aboriginal and Torres Strait Islander ways of knowing
            id: psy-aboriginal-torres-strait-islander
            brief: Learning that is multimodal, connected to Country, passed on through story, song and practice, and tied to relationships and place.

      - title: Memory
        id: vic-psy-u34-1-4
        points:
          - title: The multi-store model
            id: psy-multi-store-model
            brief: Atkinson and Shiffrin's model has sensory memory, short-term memory and long-term memory, each with its own capacity and duration.
          - title: Explicit and implicit memory
            id: psy-explicit-implicit-memory
            brief: Explicit memories are recalled on purpose, such as facts and events. Implicit memories show in what we do without trying, such as skills and conditioned responses.
          - title: Episodic and semantic memory
            id: psy-episodic-semantic-memory
            brief: Episodic memory holds personal events with a time and place. Semantic memory holds general facts and knowledge.
          - title: Brain areas in memory
            id: psy-brain-areas-memory
            brief: The hippocampus forms explicit memories, the amygdala adds emotion, the neocortex stores them, and the basal ganglia and cerebellum handle implicit memory.
          - title: Autobiographical memory and imagining the future
            id: psy-autobiographical-memory-imagining-future
            brief: Recalling personal events and imagining future ones use the same episodic and semantic systems, so loss of one often affects the other.
          - title: Alzheimer's disease and memory
            id: psy-alzheimer-s-disease-memory
            brief: Alzheimer's disease damages neurons through amyloid plaques and tangles, and episodic memory is often lost first.
          - title: Aphantasia
            id: psy-aphantasia
            brief: Aphantasia is being unable to picture images in the mind. People with it can still remember facts, but often recall past events with less detail.
          - title: Mnemonics
            id: psy-mnemonics
            brief: Memory aids such as acronyms, acrostics and the method of loci link new information to cues that are easier to recall.
          - title: Sung narratives and songlines
            id: psy-sung-narratives-songlines
            brief: Aboriginal and Torres Strait Islander peoples have long kept knowledge in songs, stories and places along Country, which works as a powerful memory system.

  - title: "Unit 4: How is mental wellbeing supported and maintained?"
    chapters:
      - title: Sleep
        id: vic-psy-u34-2-1
        points:
          - title: Sleep as a state of consciousness
            id: psy-sleep-as-state-consciousness
            brief: Sleep is a naturally occurring altered state of consciousness, with less awareness of surroundings and changes in brain activity.
          - title: NREM and REM sleep
            id: psy-nrem-rem-sleep
            brief: NREM sleep has stages that get deeper, with slower brain waves. REM sleep has fast brain waves, rapid eye movements, little muscle tone and vivid dreams.
          - title: Measuring sleep
            id: psy-measuring-sleep
            brief: The EEG records brain waves, the EMG muscle activity and the EOG eye movements. Sleep diaries and video monitoring add what the person and an observer see.
          - title: Circadian and ultradian rhythms
            id: psy-circadian-ultradian-rhythms
            brief: The sleep-wake cycle follows a circadian rhythm of about 24 hours. Cycles of NREM and REM sleep through the night are ultradian rhythms.
          - title: Melatonin and the SCN
            id: psy-melatonin-scn
            brief: The suprachiasmatic nucleus responds to light and tells the pineal gland when to release melatonin, which makes us sleepy.
          - title: Sleep across the lifespan
            id: psy-sleep-across-lifespan
            brief: Total sleep and the share of REM sleep fall from infancy to old age. Adolescents' sleep timing shifts later.
          - title: Partial sleep deprivation
            id: psy-partial-sleep-deprivation
            brief: Too little sleep affects mood, thinking and reactions. Staying awake 17 hours affects a person about as much as a blood alcohol level of 0.05.
          - title: Circadian rhythm sleep disorders
            id: psy-circadian-rhythm-sleep-disorders
            brief: Delayed sleep phase syndrome and shift work disorder put sleep out of step with daily life, causing tiredness and poor functioning.
          - title: Improving sleep
            id: psy-improving-sleep
            brief: Bright light therapy and zeitgebers such as daylight, temperature and meal times help reset the body clock. Sleep hygiene builds habits that support good sleep.

      - title: Mental wellbeing
        id: vic-psy-u34-2-2
        points:
          - title: The mental wellbeing continuum
            id: psy-mental-wellbeing-continuum
            brief: Mental wellbeing ranges from mentally healthy, through a mental health problem, to a mental health disorder, and a person can move along it.
          - title: Ways of describing mental wellbeing
            id: psy-ways-describing-mental-wellbeing
            brief: Mental wellbeing can be shown by high levels of functioning, resilience, and social and emotional wellbeing.
          - title: Social and emotional wellbeing
            id: psy-social-emotional-wellbeing
            brief: For Aboriginal and Torres Strait Islander peoples, wellbeing connects body, mind, family, community, culture, Country and spirituality.
          - title: Stress, anxiety and phobia compared
            id: psy-stress-anxiety-phobia-compared
            brief: Stress responds to a stressor and passes. Anxiety continues after the stressor or without one. A phobia is an intense, irrational fear of something specific.
          - title: Biological factors in specific phobia
            id: psy-biological-factors-specific-phobia
            brief: Low GABA activity and long-term potentiation that strengthens a fear response can help a specific phobia develop and stay.
          - title: Psychological factors in specific phobia
            id: psy-psychological-factors-specific-phobia
            brief: Phobias can be learned by classical conditioning and kept by operant conditioning when avoiding the feared thing brings relief. Catastrophic thinking feeds them.
          - title: Social factors in specific phobia
            id: psy-social-factors-specific-phobia
            brief: A frightening event, learning fear from others, and stigma around seeking help can all add to a specific phobia.
          - title: Evidence-based treatments for phobia
            id: psy-evidence-based-treatments-phobia
            brief: Treatments include CBT, systematic desensitisation (gradual exposure while relaxed), breathing retraining, exercise and, briefly, medication such as benzodiazepines.
          - title: Protective factors for wellbeing
            id: psy-protective-factors-wellbeing
            brief: Good food, enough sleep, coping and mindfulness strategies, and support from family, friends and community help keep mental wellbeing high.
          - title: Cultural determinants of wellbeing
            id: psy-cultural-determinants-wellbeing
            brief: For Aboriginal and Torres Strait Islander peoples, self-determination and connection to culture, Country and community support social and emotional wellbeing.

      - title: Research methods and evidence
        id: vic-psy-u34-2-3
        points:
          - title: Types of investigations
            id: psy-types-investigations
            brief: Psychology uses controlled experiments, correlational studies, case studies, fieldwork, literature reviews and simulations, each suited to different questions.
          - title: Validity
            id: psy-validity
            brief: Internal validity asks whether a study measured what it set out to. External validity asks whether its results apply beyond the sample.
          - title: Accuracy, precision, repeatability and reproducibility
            id: psy-accuracy-precision-repeatability-reproducibility
            brief: Accuracy is closeness to the true value. Precision is closeness of results to each other. Repeatability and reproducibility ask whether the same result comes again.
          - title: Representing and judging data
            id: psy-representing-judging-data
            brief: Tables and graphs show patterns, and conclusions should only claim what the data supports, noting outliers and limits.
          - title: Ethical concepts
            id: psy-ethical-concepts
            brief: Research is judged by integrity, justice, beneficence, non-maleficence and respect, beside the ethical guidelines for participants.
