# VCE Psychology, Units 3 and 4: the nervous system, stress, learning, memory, sleep and mental wellbeing, 54 points.
# Drafted from the VCAA's VCE Psychology Study Design, accreditation period 2023 to 2027. The structure follows the
# study design: each unit is a unit here, and each area of study is a chapter, or two when it is large. The research
# investigation in Unit 4 is school-run, so its science skills are one chapter here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on stress, phobia, mental wellbeing and Aboriginal and Torres Strait Islander knowledge always go to the
# review page.
