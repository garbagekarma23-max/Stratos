# Australian Curriculum Science, Year 9: coordination and reproduction, the carbon cycle, energy transfer and
# efficiency, atoms and radioactivity, and chemical equations, with Science as a human endeavour and the ideas behind
# Science inquiry, 40 points.
# Follows ACARA's Australian Curriculum: Science, Version 9.0 (Science curriculum content, Years 7-10), checked on
# australiancurriculum.edu.au in November 2026. Version 9.0 was approved in April 2022 and released for use from 2023;
# each state and territory sets when its schools start it (Queensland schools teach every v9 learning area by the end
# of 2027). No newer version is announced. Western Australia and South Australia teach their own versions built on it.
# The Science understanding strand is a unit, with a chapter for each content description (AC9S9U01 to U07, with U04
# in two chapters). Science as a human endeavour and Science inquiry share the second unit, one chapter each: inquiry
# is taught as the ideas behind an investigation, not as practical work. Reproduction is taught as biology only.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-sci-9
subject: Science
bank: sci
name: Science, Year 9
about: Australian Curriculum, Year 9
short: Science
years: [9]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Science, Version 9.0, Year 9"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [negative feedback, carbon cycle, conduction, half-life, isotope, balanced equation]

units:
  - title: Science understanding
    chapters:
      - title: Responding to stimuli
        id: ac-sci-9-1-1
        points:
          - title: Stimulus, receptor and effector
            id: sci-stimulus-receptor-effector
            brief: A stimulus is a change inside or outside the body. Receptors detect it, a control centre such as the brain decides, and effectors such as muscles or glands respond.
            codes: [AC9S9U01]
          - title: The nervous system
            id: sci-nervous-system
            brief: Neurons carry fast electrical impulses between receptors, the brain and spinal cord, and effectors. A reflex skips the brain for a faster response.
            codes: [AC9S9U01]
          - title: The endocrine system
            id: sci-endocrine-system
            brief: Glands release hormones into the blood, which carry messages more slowly than nerves but with longer-lasting effects, such as adrenaline in a fright.
            codes: [AC9S9U01]
          - title: Negative feedback
            id: sci-negative-feedback
            brief: Negative feedback keeps conditions steady by reversing a change, as sweating cools the body when it gets too hot and shivering warms it when cold.
            codes: [AC9S9U01]
          - title: Blood glucose and diabetes
            id: sci-blood-glucose-diabetes
            brief: Insulin from the pancreas lowers blood glucose after a meal. In diabetes this feedback fails, which is why some people need insulin injections.
            codes: [AC9S9U01]

      - title: Reproduction
        id: ac-sci-9-1-2
        points:
          - title: Sexual and asexual reproduction
            id: sci-sexual-asexual-reproduction
            brief: Asexual reproduction needs one parent and makes identical offspring. Sexual reproduction joins two gametes and makes offspring that vary.
            codes: [AC9S9U02]
          - title: Gametes and fertilisation
            id: sci-gametes-fertilisation
            brief: Sperm are small and can swim to the egg. The egg is large and holds food for early growth. Fertilisation joins them to start a new organism.
            codes: [AC9S9U02]
          - title: Reproduction in flowering plants
            id: sci-reproduction-flowering-plants
            brief: Pollen is carried to the stigma by wind or animals, fertilises an ovule, and the ovule becomes a seed inside a fruit. Many plants also grow new plants from runners or bulbs.
            codes: [AC9S9U02]
          - title: Why variation helps a species survive
            id: sci-variation-helps-species-survive
            brief: Varied offspring make it more likely that some survive a change such as a new disease, while asexual reproduction is faster in a stable place.
            codes: [AC9S9U02]
          - title: Number of offspring and parental care
            id: sci-number-offspring-parental-care
            brief: Animals that care for their young usually have few offspring, while those that give no care, such as many fish, produce huge numbers.
            codes: [AC9S9U02]

      - title: The carbon cycle
        id: ac-sci-9-1-3
        points:
          - title: Earth's four spheres
            id: sci-earth-s-four-spheres
            brief: The geosphere, biosphere, hydrosphere and atmosphere are the rock, life, water and air of the Earth, and matter and energy move between them.
            codes: [AC9S9U03]
          - title: Photosynthesis and respiration in the carbon cycle
            id: sci-photosynthesis-respiration-carbon-cycle
            brief: Photosynthesis takes carbon dioxide from the air into plants, and respiration by living things returns it.
            codes: [AC9S9U03]
          - title: Combustion and carbon stores
            id: sci-combustion-carbon-stores
            brief: Carbon is stored for long times in fossil fuels, rocks, oceans and forests. Burning fossil fuels releases it quickly as carbon dioxide.
            codes: [AC9S9U03]
          - title: The greenhouse effect
            id: sci-greenhouse-effect
            brief: Gases such as carbon dioxide trap some of the heat leaving Earth, which keeps it warm enough for life. More of these gases trap more heat.
            codes: [AC9S9U03]
          - title: Capturing carbon
            id: sci-capturing-carbon
            brief: Forests, soils and oceans take up carbon naturally, and fire management by First Nations Australians and new technologies can help store more.
            codes: [AC9S9U03]

      - title: Heat and sound
        id: ac-sci-9-1-4
        points:
          - title: Conduction
            id: sci-conduction
            brief: In conduction, heat passes from particle to particle as they collide. Metals conduct heat well, while air and wool are insulators.
            codes: [AC9S9U04]
          - title: Convection
            id: sci-convection
            brief: Warm fluid spreads out, becomes less dense and rises, while cooler fluid sinks, setting up a convection current in liquids and gases.
            codes: [AC9S9U04]
          - title: Sound as a wave
            id: sci-sound-as-wave
            brief: Sound is a vibration passed through a medium by particles, so it travels faster in solids than in air and cannot travel through a vacuum.
            codes: [AC9S9U04]
          - title: Parts of a wave
            id: sci-parts-wave
            brief: Wavelength is the distance between peaks, amplitude the height of a wave, and frequency the number of waves each second. Higher frequency sounds have a higher pitch.
            codes: [AC9S9U04]

      - title: Light, electricity and energy efficiency
        id: ac-sci-9-1-5
        points:
          - title: The electromagnetic spectrum
            id: sci-electromagnetic-spectrum
            brief: Light is one part of a family of electromagnetic waves, from radio waves and microwaves through infrared and visible light to ultraviolet, X-rays and gamma rays. All travel through a vacuum.
            codes: [AC9S9U04]
          - title: Wave and particle models of light
            id: sci-wave-particle-models-light
            brief: Light behaves like a wave when it spreads and bends, and like a stream of particles called photons when it is absorbed. Each model explains different things.
            codes: [AC9S9U04]
          - title: Static and current electricity
            id: sci-static-current-electricity
            brief: Static electricity is a build-up of charge on an object. Current electricity is a flow of charge through a conductor, pushed by a voltage.
            codes: [AC9S9U04]
          - title: Conservation of energy
            id: sci-conservation-energy
            brief: Energy cannot be made or destroyed, only transferred or transformed, so the total energy in a system stays the same.
            codes: [AC9S9U05]
          - title: Efficiency and Sankey diagrams
            id: sci-efficiency-sankey-diagrams
            brief: Efficiency is useful energy out divided by total energy in, as a percentage. A Sankey diagram's arrow widths show where the energy goes.
            codes: [AC9S9U05]

      - title: Atoms and radioactivity
        id: ac-sci-9-1-6
        points:
          - title: Protons, neutrons and electrons
            id: sci-protons-neutrons-electrons
            brief: Protons are positive and neutrons have no charge, and both sit in the nucleus. Electrons are negative, far lighter, and move around it.
            codes: [AC9S9U06]
          - title: How the model of the atom changed
            id: sci-model-atom-changed
            brief: Thomson found the electron, Rutherford's gold foil experiment showed a small dense nucleus, and Chadwick found the neutron, each changing the model.
            codes: [AC9S9U06]
          - title: Atomic number, mass number and isotopes
            id: sci-atomic-number-mass-number
            brief: The atomic number is the number of protons. Isotopes of an element have the same number of protons but different numbers of neutrons.
            codes: [AC9S9U06]
          - title: Alpha, beta and gamma radiation
            id: sci-alpha-beta-gamma-radiation
            brief: Unstable nuclei decay by giving off alpha particles, beta particles or gamma rays until they become stable. Each goes a different distance through matter.
            codes: [AC9S9U06]
          - title: Half-life and radiocarbon dating
            id: sci-half-life-radiocarbon-dating
            brief: Half-life is the time for half the unstable atoms in a sample to decay. Carbon-14 dating uses it to find the age of once-living things, including evidence of First Peoples in Australia.
            codes: [AC9S9U06]

      - title: Chemical equations
        id: ac-sci-9-1-7
        points:
          - title: Reactants and products
            id: sci-reactants-products
            brief: In a reaction, the starting substances are the reactants and the new ones are the products. A word equation names them with an arrow between.
            codes: [AC9S9U07]
          - title: Conservation of mass
            id: sci-conservation-mass
            brief: Atoms are rearranged in a reaction, never made or lost, so the total mass stays the same. In an open container a gas may escape and seem to lose mass.
            codes: [AC9S9U07]
          - title: Balancing a chemical equation
            id: sci-balancing-chemical-equation
            brief: A balanced equation has the same number of each type of atom on both sides, adjusted with numbers in front of formulas, never by changing the formulas.
            codes: [AC9S9U07]

  - title: Science as a human endeavour and inquiry
    chapters:
      - title: How science is checked and used
        id: ac-sci-9-2-1
        points:
          - title: Peer review and publication
            id: sci-peer-review-publication
            brief: Scientists publish their methods and results so other experts can check them before publication and repeat them after, which is how knowledge is validated.
            codes: [AC9S9H01]
          - title: Science, technology and engineering
            id: sci-science-technology-engineering
            brief: New technology lets science find out more, such as better telescopes, and new science leads to new technology, such as medical imaging.
            codes: [AC9S9H02]
          - title: Why society takes up new science
            id: sci-society-takes-up-new
            brief: Cost, evidence, trust, government support and culture affect whether people adopt a practice, such as solar panels or recycling.
            codes: [AC9S9H03]
          - title: What gets researched
            id: sci-gets-researched
            brief: Society's needs and values steer which research gets funded, such as cutting greenhouse gases or treating common diseases.
            codes: [AC9S9H04]

      - title: Valid and reliable investigations
        id: ac-sci-9-2-2
        points:
          - title: Validity
            id: sci-validity
            brief: An investigation is valid when it tests what it set out to test, which needs controlled variables and a fair method.
            codes: [AC9S9I02, AC9S9I06]
          - title: Reproducibility and replicability
            id: sci-reproducibility-replicability
            brief: Results are replicable when the same person gets similar results again, and reproducible when others using the same method get them too.
            codes: [AC9S9I03, AC9S9I06]
          - title: Random and systematic errors
            id: sci-random-systematic-errors
            brief: Random errors scatter results either side of the true value and are reduced by repeats. Systematic errors push every result the same way, such as a scale not set to zero.
            codes: [AC9S9I02, AC9S9I06]
          - title: Mean, median and range
            id: sci-mean-median-range
            brief: The mean is the total divided by the number of results, the median is the middle result, and the range is the largest minus the smallest.
            codes: [AC9S9I04]
