# NSW Mathematics Standard 2, Year 12: the ten Year 12 Standard 2 focus areas, 53 points.
# Drafted from NESA's Mathematics Standard 11-12 Syllabus (2024), taught in Year 12 from Term 4 2026 and first examined
# in the 2027 HSC. The structure follows the syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Standard 2 only. Standard 1 shares most of these ideas: once this is published, a Standard 1 outline can reuse
# these points and add its own (depreciation and loans, right-angled triangles).
# Cards and multiple choice for now (kind: maths). Keypad templates can come later, per topic, as in Maths Lab.

id: nsw-mat-std-12
subject: Mathematics
bank: mat
name: Mathematics Standard 2, Year 12
about: HSC, Models, finance, trigonometry, networks and statistics
short: Mathematics Standard 2
years: [12]
place: nsw
kind: maths
syllabus: NSW Mathematics Standard 11-12 Syllabus (2024), Year 12 Standard 2 focus areas
note: Follows the NSW Mathematics Standard syllabus. Not made or endorsed by NESA.
chips: [break-even, annuity, bearing, critical path, z-score]

units:
  - title: Algebra
    chapters:
      - title: Algebraic relationships
        id: nsw-mat-std-12-1-1
        points:
          - title: Simultaneous linear equations
            id: mat-simultaneous-linear-equations
            brief: Finding where two straight lines meet, by graphing or substitution, and what the point means, such as when two phone plans cost the same.
          - title: Break-even analysis
            id: mat-break-even-analysis
            brief: Cost and revenue as straight lines. The business breaks even where they meet, and makes a profit beyond that point.
          - title: Exponential models
            id: mat-exponential-models
            brief: Growth or decay by a fixed percentage each period, y = a(b)ˣ, as with populations or the value of a car.
          - title: Quadratic models
            id: mat-quadratic-models
            brief: Parabolas that model situations such as the path of a thrown ball or profit against price, and reading the maximum or minimum from the graph.
          - title: Inverse variation models
            id: mat-inverse-variation-models
            brief: When y = k/x, doubling x halves y, as with travel time and speed for a fixed distance. The graph is a hyperbola.

  - title: Financial mathematics
    chapters:
      - title: Investment and loans
        id: nsw-mat-std-12-2-1
        points:
          - title: The compound interest formula
            id: mat-compound-interest-formula
            brief: FV = PV(1 + r)ⁿ, adjusting r and n when interest compounds monthly or quarterly.
          - title: Comparing investments
            id: mat-comparing-investments
            brief: Comparing simple and compound interest, and different compounding periods, to choose the better investment.
          - title: Shares and dividends
            id: mat-shares-dividends
            brief: A dividend is a share of a company's profit paid to shareholders. Dividend yield is the yearly dividend as a percentage of the share price.
          - title: Inflation and appreciation
            id: mat-inflation-appreciation
            brief: Using the compound interest formula to see how prices rise with inflation or how an asset gains value over time.
          - title: Declining balance depreciation
            id: mat-declining-balance-depreciation
            brief: An asset loses a fixed percentage of its value each year, S = V₀(1 - r)ⁿ.
          - title: Credit cards
            id: mat-credit-cards
            brief: Credit card interest is charged daily on the amount owed, often at a high rate, after any interest-free period ends.

      - title: Annuities
        id: nsw-mat-std-12-2-2
        points:
          - title: What an annuity is
            id: mat-annuity
            brief: A series of equal payments made at regular intervals that earn compound interest, such as regular saving into an account.
          - title: Future value of an annuity
            id: mat-future-value-annuity
            brief: The total an annuity grows to, found from a table of future value interest factors or a spreadsheet.
          - title: Present value from tables
            id: mat-present-value-from-tables
            brief: The single amount that, invested now, would give the same total as the annuity, found from a table of present value factors.
          - title: Loan repayments
            id: mat-loan-repayments
            brief: A loan is the present value of its repayments, so the table of present value factors gives the repayment for a given loan, rate and term.
          - title: Total interest on a loan
            id: mat-total-interest-loan
            brief: The total paid over a loan minus the amount borrowed. Longer terms mean smaller repayments but much more interest.

  - title: Measurement
    chapters:
      - title: Trigonometry
        id: nsw-mat-std-12-3-1
        points:
          - title: Trigonometric ratios in right triangles
            id: mat-trigonometric-ratios-right-triangles
            brief: Using sine, cosine and tangent to find a missing side or angle in a right-angled triangle.
          - title: Elevation and depression
            id: mat-elevation-depression
            brief: The angle of elevation looks up from the horizontal, and the angle of depression looks down. Both are used to find heights and distances.
          - title: True and compass bearings
            id: mat-true-compass-bearings
            brief: True bearings are three-figure angles clockwise from north, such as 135°T. Compass bearings name an angle from north or south towards east or west, such as S45°E.
          - title: The sine rule in non-right triangles
            id: mat-sine-rule-non-right
            brief: Using a/sin A = b/sin B to find a side or angle when a side and its opposite angle are known.
          - title: The cosine rule in non-right triangles
            id: mat-cosine-rule-non-right
            brief: Using c² = a² + b² - 2ab cos C to find a side from two sides and the angle between them, or an angle from three sides.
          - title: Area with sine
            id: mat-area-with-sine
            brief: Area = ½ab sin C for a triangle where two sides and the angle between them are known.

      - title: Ratios and rates
        id: nsw-mat-std-12-3-2
        points:
          - title: Ratios
            id: mat-ratios
            brief: Simplifying ratios and dividing a quantity in a given ratio, such as sharing $600 in the ratio 2 to 3.
          - title: Scale drawings and plans
            id: mat-scale-drawings-plans
            brief: Using a scale such as 1 to 100 to find real lengths and areas from a plan, and remembering that areas scale by the square.
          - title: Rates and conversions
            id: mat-rates-conversions
            brief: A rate compares two different units, such as km/h or $/kg. Converting a rate, such as km/h to m/s.
          - title: Energy and power
            id: mat-energy-power
            brief: Energy used is power times time. Appliances are rated in watts and electricity is billed in kilowatt-hours.
          - title: Speed, distance and time
            id: mat-speed-distance-time
            brief: Using speed = distance ÷ time and reading distance-time graphs, where the gradient is the speed.
          - title: Fuel consumption
            id: mat-fuel-consumption
            brief: Car fuel use given in litres per 100 km, and working out the fuel and cost of a trip.

  - title: Networks
    chapters:
      - title: Network flow
        id: nsw-mat-std-12-4-1
        points:
          - title: Flow networks
            id: mat-flow-networks
            brief: A directed network with a source and a sink, where each edge has a capacity, such as cars a road can carry in an hour.
          - title: Cuts
            id: mat-cuts
            brief: A cut separates the source from the sink. Its capacity is the total of the edges that flow from the source side to the sink side.
          - title: Maximum flow and minimum cut
            id: mat-maximum-flow-minimum-cut
            brief: The maximum flow through a network equals the capacity of its smallest cut.
          - title: Flow in practice
            id: mat-flow-practice
            brief: Using maximum flow to find bottlenecks in roads, pipes or data networks, and how raising one edge's capacity may change the flow.

      - title: Critical path analysis
        id: nsw-mat-std-12-4-2
        points:
          - title: Activity networks
            id: mat-activity-networks
            brief: A project drawn as a network, with activities as edges and their durations, and some activities that must wait for others to finish.
          - title: Earliest starting times
            id: mat-earliest-starting-times
            brief: A forward scan through the network, taking the largest total at each vertex, gives the earliest each activity can start and the project's shortest time.
          - title: Latest starting times
            id: mat-latest-starting-times
            brief: A backward scan, taking the smallest value at each vertex, gives the latest each activity can start without delaying the project.
          - title: Float time
            id: mat-float-time
            brief: Float is how long an activity can be delayed without delaying the whole project, the latest start minus the earliest start.
          - title: The critical path
            id: mat-critical-path
            brief: The longest path through the network, made of activities with zero float. Any delay on it delays the whole project.

  - title: Statistics
    chapters:
      - title: Bivariate data analysis
        id: nsw-mat-std-12-5-1
        points:
          - title: Scatterplots
            id: mat-scatterplots
            brief: Plotting pairs of numerical data to see whether two variables are related, with the explanatory variable on the x-axis.
          - title: Correlation
            id: mat-correlation
            brief: Describing a relationship by its direction (positive or negative), form (linear or not) and strength (strong, moderate or weak).
          - title: Pearson's correlation coefficient
            id: mat-pearson-s-correlation-coefficient
            brief: r runs from -1 to 1 and measures the strength and direction of a linear relationship. It is found with a calculator.
          - title: Least-squares regression line
            id: mat-least-squares-regression-line
            brief: The line of best fit found by a calculator, used to predict one variable from the other.
          - title: Interpolation and extrapolation
            id: mat-interpolation-extrapolation
            brief: Predicting inside the range of the data is interpolation and fairly reliable. Predicting outside it is extrapolation and less reliable.
          - title: Correlation and causation
            id: mat-correlation-causation
            brief: Two variables can move together without one causing the other, often because of a third factor.

      - title: Relative frequency and probability
        id: nsw-mat-std-12-5-2
        points:
          - title: Relative frequency
            id: mat-relative-frequency
            brief: The number of times an event happened divided by the number of trials, used to estimate probability. More trials give a better estimate.
          - title: Expected frequency
            id: mat-expected-frequency
            brief: The probability of an event times the number of trials, the number of times it is expected to happen.
          - title: Two-way tables
            id: mat-two-way-tables
            brief: Tables that sort data by two categories, used to find probabilities and compare groups.
          - title: Multistage events
            id: mat-multistage-events
            brief: Tree diagrams and tables for events with two or more steps, multiplying along branches.
          - title: Complementary events
            id: mat-complementary-events
            brief: The probability something does not happen is 1 minus the probability it does.

      - title: The normal distribution
        id: nsw-mat-std-12-5-3
        points:
          - title: Features of a normal distribution
            id: mat-features-normal-distribution
            brief: A bell-shaped, symmetric distribution in which the mean, median and mode are equal.
          - title: Standardised scores
            id: mat-standardised-scores
            brief: z = (x - mean) ÷ standard deviation, the number of standard deviations a score is from the mean.
          - title: The empirical rule
            id: mat-empirical-rule
            brief: The 68, 95, 99.7 rule. In a normal distribution, about 68% of scores lie within 1 standard deviation of the mean, 95% within 2 and 99.7% within 3.
          - title: Comparing scores with z-scores
            id: mat-comparing-scores-with-z
            brief: Converting scores from different tests to z-scores to see which performance was better relative to its group.
          - title: Quality control
            id: mat-quality-control
            brief: Using the normal distribution to decide whether a product, such as a bottle's fill, is within an acceptable range.
