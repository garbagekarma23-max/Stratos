# NSW History, Stage 4 (Years 7 and 8): the historical concepts and skills, the three historical contexts, the core
# depth study and five depth study options, 66 points.
# Follows NESA's History 7-10 Syllabus (2024), checked on the NSW Curriculum website (curriculum.nsw.edu.au) in
# November 2026. Schools plan for it in 2025 and 2026 and teach it from 2027 (NSW recommends Year 7 in 2027 and Year 8
# in 2028), so this follows the new syllabus, not the History K-10 Syllabus it replaces (dated 2012, listed on the NSW
# Curriculum website as its 2019 version), which is not available after December 2028.
# Structure: the historical concepts and skills, which the syllabus runs through all content, are the first unit.
# Historical context 1 (The ancient past), 2 (The medieval world) and 3 (The era of colonisation) are units, each with
# its core content as one or two chapters. The core depth study, Aboriginal Peoples' experiences of colonisation in
# Australia (1788 to about 1901), is two chapters in the colonisation unit.
# Options: schools choose at least one depth study option for each of the first two contexts (16 options in all), and
# at least one option across Stages 4 and 5 must be non-western. Here: Ancient Egypt, Ancient Rome and Ancient China
# (non-western, used in the NSW Department of Education's sample scope and sequence), and Medieval Europe and Mongol
# expansion (non-western, also in that sample). Ancient India, Ancient Greece, The expansion of Islam, Polynesian
# expansion across the Pacific, The Vikings, The Angkor/Khmer Empire, Japan under the Shoguns, The Ottoman Empire, The
# Black Death in Asia, Europe and North Africa, Renaissance Italy and The Spanish conquest of the Americas can be
# added as chapters. For context 3,
# which asks for at least one Indigenous community's response to colonisation, this uses Māori in Aotearoa New Zealand.
# The case study and site study are taught only as the ideas behind them. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-his-s4
subject: History
bank: his
name: History, Stage 4
about: NSW Stage 4, Years 7 and 8
short: History
years: [7, 8]
level: Stage 4
place: nsw
kind: standard
syllabus: NSW History 7-10 Syllabus (2024), Stage 4
note: Follows the NSW History syllabus. Not made or endorsed by NESA.
chips: [sources, ancient Egypt, feudalism, Mongols, Frontier Wars, Magna Carta]

units:
  - title: How historians work
    chapters:
      - title: Thinking historically
        id: nsw-his-s4-1-1
        points:
          - title: Continuity and change
            id: his-continuity-change
            brief: Historians look at what changed over a period and what stayed the same, such as farming methods that lasted for centuries while rulers came and went.
            codes: [HI4-CON-01]
          - title: Cause and effect
            id: his-cause-effect
            brief: Events have several causes, some long-term and some short-term, and lead to effects that can last for a short time or for centuries.
            codes: [HI4-CON-01, HI4-IEP-01]
          - title: Perspectives
            id: his-perspectives
            brief: People in the past saw events differently depending on who they were, and a source shows one point of view, which may leave things out.
            codes: [HI4-CPP-01]
          - title: Historical significance
            id: his-historical-significance
            brief: Historians judge how important a person, idea or event was by how many people it affected, how deeply and for how long.
            codes: [HI4-IEP-01]
          - title: Contestability
            id: his-contestability
            brief: Historians and archaeologists can reach different conclusions about the same past because they use different evidence and methods, so history is open to debate.
            codes: [HI4-CPP-01]

      - title: Sources and time
        id: nsw-his-s4-1-2
        points:
          - title: Primary and secondary sources
            id: his-primary-secondary-sources-nsw
            brief: A primary source was made at the time being studied, such as a letter or a tool. A secondary source was made later, such as a textbook.
            codes: [HI4-SOU-01]
          - title: Asking questions of a source
            id: his-asking-questions-source
            brief: To use a source as evidence, ask who made it, when, why and for whom, then judge how reliable and how useful it is for your question.
            codes: [HI4-SOU-01, HI4-INQ-01]
          - title: Dating systems
            id: his-dating-systems
            brief: BC and AD, or BCE and CE, count years before and after year 1. Years BCE count down towards it, and a century is 100 years, so the 1500s are the 16th century.
            codes: [HI4-COM-01]
          - title: Timelines and periods of history
            id: his-timelines-periods-history
            brief: Timelines put events in order, and historians divide the past into named periods, such as ancient, medieval and modern, though the dates differ around the world.
            codes: [HI4-CON-01]
          - title: The process of historical inquiry
            id: his-process-historical-inquiry
            brief: A historical inquiry starts with a question, gathers and judges sources, then uses the evidence to answer the question with the right historical terms.
            codes: [HI4-INQ-01, HI4-COM-01]

  - title: The ancient past
    chapters:
      - title: Evidence of the ancient past
        id: nsw-his-s4-2-1
        points:
          - title: Early human migration
            id: his-early-human-migration
            brief: Fossils, tools and DNA suggest modern humans spread out of Africa and across the world over tens of thousands of years.
            codes: [HI4-CON-01]
          - title: Kinds of evidence from the ancient past
            id: his-kinds-evidence-from-ancient
            brief: We learn about ancient societies from art, symbols, writing, tools, buildings, human remains and oral traditions, and each has strengths and gaps.
            codes: [HI4-SOU-01]
          - title: Science in archaeology
            id: his-science-archaeology
            brief: Archaeologists use science, such as radiocarbon dating, DNA testing and ground-scanning radar, to date and study remains without digging everything up.
            codes: [HI4-INQ-01]
          - title: Ancient Aboriginal and Torres Strait Islander histories
            id: his-ancient-aboriginal-torres-strait
            brief: Aboriginal and Torres Strait Islander Peoples have lived in Australia for more than 65,000 years. Evidence includes sites such as Lake Mungo, on Paakantyi, Mutthi Mutthi and Ngiyampaa Country, and oral traditions passed down through generations.
            codes: [HI4-CON-01, HI4-SOU-01]

      - title: Heritage and citizenship
        id: nsw-his-s4-2-2
        points:
          - title: Citizenship in the ancient world
            id: his-citizenship-ancient-world
            brief: In ancient Athens adult male citizens could vote in the assembly, and Roman citizens had legal rights, but women, slaves and foreigners were left out of both.
            codes: [HI4-CPP-01]
          - title: Ways of writing history
            id: his-ways-writing-history
            brief: History has been recorded in different ways, such as the written accounts of Herodotus in Greece and Sima Qian in China, and oral histories passed on in many cultures.
            codes: [HI4-CPP-01]
          - title: Protecting ancient sites
            id: his-protecting-ancient-sites-nsw
            brief: Ancient sites are threatened by war, looting, tourism and climate, and conservation and heritage listing help preserve them for the future.
            codes: [HI4-INQ-01]
          - title: Returning cultural objects
            id: his-returning-cultural-objects
            brief: Many objects and ancestral remains were taken from where they came from, often during colonial times, and some are now being returned to their communities.
            codes: [HI4-CPP-01]

      - title: Ancient Egypt
        id: nsw-his-s4-2-3
        points:
          - title: The Nile and Egyptian society
            id: his-nile-egyptian-society
            brief: The Nile's yearly flood left rich soil in a narrow strip of desert, so Egyptians farmed, travelled and built their society along the river.
            codes: [HI4-SPE-01]
          - title: Pharaohs and the social pyramid
            id: his-pharaohs-social-pyramid
            brief: The pharaoh ruled as a god-king at the top of society, above priests and officials, then scribes, craftworkers, farmers and slaves.
            codes: [HI4-SPE-01]
          - title: Egyptian religion and the afterlife
            id: his-egyptian-religion-afterlife
            brief: Egyptians worshipped many gods and believed in life after death, so they mummified bodies and buried them with goods for the next life.
            codes: [HI4-SPE-01]
          - title: Daily life in ancient Egypt
            id: his-daily-life-ancient-egypt
            brief: Most Egyptians were farmers. Women could own property and run businesses, and children helped their families from a young age.
            codes: [HI4-SPE-01]
          - title: Building the pyramids
            id: his-building-pyramids
            brief: The pyramids at Giza were tombs for pharaohs. Archaeology of workers' villages suggests teams of fed and housed workers, not slaves, built them, which changed earlier views.
            codes: [HI4-SPE-01, HI4-SOU-01]
          - title: "Egypt's contact and legacy"
            id: his-egypt-s-contact-legacy
            brief: Egypt traded and fought with neighbours such as the Hittites, signing one of the earliest known peace treaties, and left a legacy of writing, building and medicine.
            codes: [HI4-IEP-01]

      - title: Ancient Rome
        id: nsw-his-s4-2-4
        points:
          - title: The founding of Rome
            id: his-founding-rome
            brief: Rome grew from villages on the Tiber River in Italy, and Romans told a founding legend of the twins Romulus and Remus.
            codes: [HI4-SPE-01]
          - title: From republic to empire
            id: his-from-republic-empire
            brief: Rome was a republic led by elected consuls and the Senate until civil wars, including Julius Caesar's, ended with Augustus becoming the first emperor.
            codes: [HI4-SPE-01]
          - title: Roman society
            id: his-roman-society
            brief: Roman society was divided into patricians, plebeians and slaves. Women had few political rights, and the father led the household.
            codes: [HI4-SPE-01]
          - title: Roman religion
            id: his-roman-religion
            brief: Romans worshipped many gods in public and at home, and Christianity spread through the empire and became its official religion in the 300s CE.
            codes: [HI4-SPE-01]
          - title: "Rome's legacy"
            id: his-rome-s-legacy
            brief: Rome left roads, aqueducts, Roman law, the Latin roots of many languages and ideas about government that later societies used.
            codes: [HI4-IEP-01]

      - title: Ancient China
        id: nsw-his-s4-2-5
        points:
          - title: The Yellow River and early China
            id: his-yellow-river-early-china
            brief: Chinese civilisation grew along the Yellow River, whose floods brought fertile soil, and legends told of early rulers who tamed the floods.
            codes: [HI4-SPE-01]
          - title: The Mandate of Heaven
            id: his-mandate-heaven
            brief: Chinese dynasties claimed the right to rule from heaven, and disasters or revolts were seen as signs a dynasty had lost it.
            codes: [HI4-SPE-01]
          - title: Qin Shi Huang
            id: his-qin-shi-huang
            brief: The first emperor united China in 221 BCE, standardised writing, money and measures, began linking walls into the Great Wall and was buried with the Terracotta Army.
            codes: [HI4-IEP-01]
          - title: Confucius and Chinese beliefs
            id: his-confucius-chinese-beliefs
            brief: Confucius taught respect for family, elders and rulers, which shaped Chinese government and life, alongside Daoism and honouring ancestors.
            codes: [HI4-SPE-01]
          - title: The Silk Road and the Han legacy
            id: his-silk-road-han-legacy
            brief: Under the Han dynasty, the Silk Road carried silk, ideas and goods between China and the West, and inventions such as paper spread.
            codes: [HI4-IEP-01]

  - title: The medieval world
    chapters:
      - title: Europe after Rome
        id: nsw-his-s4-3-1
        points:
          - title: The fall of the Western Roman Empire
            id: his-fall-western-roman-empire-nsw
            brief: The Western Roman Empire broke apart in the 400s CE, and Christianity held much of Europe together as Christendom.
            codes: [HI4-CON-01]
          - title: The power of the medieval Church
            id: his-power-medieval-church
            brief: The Church was the main source of learning and authority in medieval Europe, with its own courts, taxes and land.
            codes: [HI4-CPP-01]
          - title: Social hierarchy and women in medieval Europe
            id: his-social-hierarchy-women-medieval
            brief: Sources show a ranked society of rulers, nobles, clergy and peasants, and women's lives depended on their rank, with few legal rights.
            codes: [HI4-SOU-01]
          - title: Magna Carta
            id: his-magna-carta-nsw
            brief: In 1215 English barons forced King John to agree to Magna Carta, which put the king under the law and is seen as a step towards limited government.
            codes: [HI4-IEP-01]

      - title: A connected medieval world
        id: nsw-his-s4-3-2
        points:
          - title: The spread of Islam
            id: his-spread-islam
            brief: From the 600s Islam spread from Arabia, and Islamic empires stretched across the Middle East, North Africa and Spain, becoming centres of learning.
            codes: [HI4-CON-01]
          - title: The Crusades
            id: his-crusades-nsw
            brief: From 1096 Christian armies fought a series of wars for control of Jerusalem and the Holy Land, which also brought Europeans into contact with Islamic learning and trade.
            codes: [HI4-CPP-01]
          - title: Medieval trade routes
            id: his-medieval-trade-routes
            brief: Land and sea trade routes linked Asia, Africa and Europe, carrying goods, ideas, religions and diseases between cultures.
            codes: [HI4-CON-01]
          - title: The Renaissance and the Reformation
            id: his-renaissance-reformation
            brief: The Renaissance revived interest in ancient learning and art. The Reformation, begun by Martin Luther in 1517, split the Church in Western Europe.
            codes: [HI4-CON-01]

      - title: Medieval Europe
        id: nsw-his-s4-3-3
        points:
          - title: Feudalism
            id: his-feudalism-nsw
            brief: Under feudalism the king gave land to lords in return for loyalty and soldiers, and peasants worked the land in return for protection.
            codes: [HI4-SPE-01]
          - title: Life on the manor
            id: his-life-manor-nsw
            brief: Most people were peasants on a lord's manor. Serfs could not leave, worked the lord's fields and paid in labour and produce.
            codes: [HI4-SPE-01]
          - title: The Church in everyday life
            id: his-church-everyday-life
            brief: People paid a tenth of their produce to the Church, and monasteries kept learning alive by copying books and caring for the sick.
            codes: [HI4-SPE-01]
          - title: Gothic cathedrals
            id: his-gothic-cathedrals
            brief: Gothic cathedrals, with pointed arches, flying buttresses and stained glass, showed the wealth and faith of medieval towns.
            codes: [HI4-CON-01]
          - title: The decline of feudalism
            id: his-decline-feudalism
            brief: The Black Death killed so many workers that survivors could demand wages, and as trade grew, towns and a middle class rose while feudalism weakened.
            codes: [HI4-CON-01, HI4-IEP-01]

      - title: Mongol expansion
        id: nsw-his-s4-3-4
        points:
          - title: Nomads of the steppe
            id: his-nomads-steppe
            brief: The Mongols were nomadic herders on the grasslands of Central Asia, living in tents and moving with their animals.
            codes: [HI4-SPE-01]
          - title: Genghis Khan
            id: his-genghis-khan
            brief: Temujin united the Mongol tribes and was named Genghis Khan in 1206, then led conquests across Asia.
            codes: [HI4-IEP-01]
          - title: The Mongol army
            id: his-mongol-army
            brief: Skilled horse archers, fast communication, strict discipline and terror let the Mongols build the largest land empire in history.
            codes: [HI4-SPE-01]
          - title: Trade under the Mongols
            id: his-trade-under-mongols-nsw
            brief: Mongol rule made the Silk Road safer, so trade, ideas and travellers such as Marco Polo moved more freely between Asia and Europe.
            codes: [HI4-IEP-01]
          - title: Kublai Khan and the Yuan dynasty
            id: his-kublai-khan-yuan-dynasty
            brief: Genghis Khan's grandson Kublai Khan conquered China and founded the Yuan dynasty, which ruled until 1368.
            codes: [HI4-SPE-01]

  - title: The era of colonisation
    chapters:
      - title: Exploration and empire
        id: nsw-his-s4-4-1
        points:
          - title: Why Europeans explored
            id: his-europeans-explored
            brief: From the 1400s European powers sought trade, wealth, land and converts, helped by better ships and navigation tools.
            codes: [HI4-CON-01]
          - title: The Doctrine of Discovery
            id: his-doctrine-discovery
            brief: In 1493 the Pope gave Spain the right to claim lands not ruled by Christians, an idea European powers later used to justify taking Indigenous lands.
            codes: [HI4-CPP-01]
          - title: European empires
            id: his-european-empires
            brief: Spain, Portugal, the Netherlands, France and Britain built empires across the Americas, Africa, Asia and the Pacific, taking land and resources.
            codes: [HI4-CON-01]
          - title: Māori responses to colonisation
            id: his-m-ori-responses-colonisation
            brief: Māori in Aotearoa New Zealand traded with, negotiated with and resisted the British, signing the Treaty of Waitangi in 1840 and later fighting the New Zealand Wars over land.
            codes: [HI4-CPP-01]

      - title: Colonisation and resistance in Australia
        id: nsw-his-s4-4-2
        points:
          - title: Connection to Country
            id: his-connection-country
            brief: Aboriginal Peoples' connection to Country is spiritual, cultural and lasting, unlike the British view of land as property. The British treated the land as belonging to no one (terra nullius).
            codes: [HI4-APP-01, HI4-CPP-01]
          - title: Contact and conflict at Sydney Cove
            id: his-contact-conflict-at-sydney
            brief: After 1788 the British took land and food sources around Sydney Cove, and Aboriginal people resisted, including the Bidjigal man Pemulwuy, who led attacks for over a decade.
            codes: [HI4-APP-01]
          - title: The Frontier Wars
            id: his-frontier-wars
            brief: As colonists spread across Australia, conflicts over land, water and food broke out in every colony, a long period of violence now called the Frontier Wars.
            codes: [HI4-APP-01]
          - title: Risdon Cove and the Black War
            id: his-risdon-cove-black-war
            brief: In 1804 soldiers fired on Aboriginal people at Risdon Cove in Tasmania, and the Black War of the 1820s left the Aboriginal people of Tasmania with heavy losses.
            codes: [HI4-APP-01]
          - title: Wiradjuri resistance at Bathurst
            id: his-wiradjuri-resistance-at-bathurst
            brief: As colonists took Wiradjuri land around Bathurst, Windradyne led resistance, and the governor declared martial law in 1824.
            codes: [HI4-APP-01]

      - title: Massacre, missions and survival
        id: nsw-his-s4-4-3
        points:
          - title: The Myall Creek Massacre
            id: his-myall-creek-massacre
            brief: In 1838 stockmen killed at least 28 Wirrayaraay people at Myall Creek in northern NSW, and for the first time some colonists were tried and hanged for a massacre of Aboriginal people.
            codes: [HI4-APP-01]
          - title: Religious missions
            id: his-religious-missions
            brief: Churches set up missions to convert and change Aboriginal people's ways of life, which gave some shelter but disrupted culture and language.
            codes: [HI4-APP-01]
          - title: The Aborigines Protection Board
            id: his-aborigines-protection-board
            brief: Set up in NSW in 1883, the Board controlled where Aboriginal people lived and worked, and from 1915 it could remove Aboriginal children from their families without a court hearing.
            codes: [HI4-APP-01]
          - title: Life on reserves and stations
            id: his-life-reserves-stations
            brief: Aboriginal people, including women, faced controls on reserves and stations but kept culture, family and resistance alive.
            codes: [HI4-APP-01]
          - title: Invasion, colonisation or settlement
            id: his-invasion-colonisation-or-settlement
            brief: Words such as invasion, colonisation and settlement describe 1788 from different perspectives, and many Aboriginal people see it as an invasion.
            codes: [HI4-APP-01, HI4-CPP-01]
