# NSW Society and Culture, Year 11: the three Preliminary topics and the course concepts and research methods, 27 points.
# Drafted from NESA's Society and Culture Stage 6 Syllabus (2013), the syllabus taught in Year 11 in 2026. The
# structure follows the syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: a new Society and Culture 11-12 Syllabus is in development at NESA. Check its start date before the
# first run.

id: nsw-soc-11
subject: Society and Culture
bank: soc
name: Society and Culture, Year 11
about: HSC, Social worlds, identity and communication
short: Society and Culture
years: [11]
place: nsw
kind: standard
syllabus: NSW Society and Culture Stage 6 Syllabus (2013), Preliminary (Year 11) course
note: Follows the NSW Society and Culture syllabus. Not made or endorsed by NESA.
chips: [socialisation, micro meso macro, qualitative, ethnocentrism, rites of passage]

units:
  - title: Concepts and methods
    chapters:
      - title: The course concepts
        id: nsw-soc-11-1-1
        points:
          - title: Society and culture
            id: soc-society-culture
            brief: A society is a group of people who share a territory and institutions. Culture is the shared values, beliefs, customs and ways of life they pass on.
          - title: Persons and environment
            id: soc-persons-environment
            brief: A person is an individual with a unique identity. The environment is the natural and built world people live in and are shaped by.
          - title: Time, continuity and change
            id: soc-time-continuity-change
            brief: Some parts of a society stay the same over time while others change, and studying both helps explain the present.
          - title: Power and authority
            id: soc-power-authority
            brief: Power is the ability to influence others. Authority is power accepted as legitimate, such as a parent's or a government's.
          - title: Gender and identity
            id: soc-gender-identity
            brief: Gender is the social roles and expectations attached to being a man, a woman or another identity. Identity is a person's sense of who they are.
          - title: Globalisation and technologies
            id: soc-globalisation-technologies
            brief: Globalisation links societies through trade, media and travel. Technologies change how people live, work and communicate.

      - title: Social and cultural research methods
        id: nsw-soc-11-1-2
        points:
          - title: Primary and secondary research
            id: soc-primary-secondary-research
            brief: Primary research collects new information first-hand. Secondary research uses information others have already gathered.
          - title: Qualitative and quantitative research
            id: soc-qualitative-quantitative-research
            brief: Qualitative research explores meanings and experiences in words. Quantitative research measures and counts, giving numbers to analyse.
          - title: Research methods
            id: soc-research-methods
            brief: Interviews, questionnaires, focus groups, observation, participant observation, content analysis, case studies and statistical analysis each suit different questions.
          - title: Ethical research
            id: soc-ethical-research
            brief: Researchers must get informed consent, keep information confidential, avoid harm and respect the people they study.
          - title: Reliability, validity and bias
            id: soc-reliability-validity-bias
            brief: Reliable research gives consistent results, valid research measures what it claims to, and researchers must watch for bias in themselves and their methods.

  - title: The social and cultural world
    chapters:
      - title: The social and cultural world
        id: nsw-soc-11-2-1
        points:
          - title: Micro, meso and macro levels
            id: soc-micro-meso-macro-levels
            brief: Society can be studied at the micro level of individuals and families, the meso level of groups and communities, and the macro level of whole nations and the world.
          - title: Socialisation
            id: soc-socialisation
            brief: The lifelong process of learning the norms and values of a society, which shapes how people think and act.
          - title: Agents of socialisation
            id: soc-agents-socialisation
            brief: Family, peers, school, media and religion each teach people how to behave and what to value.
          - title: Norms, values and roles
            id: soc-norms-values-roles
            brief: Norms are expected behaviours, values are what a group thinks is important, and roles are the behaviour expected of a position, such as student or parent.
          - title: Status
            id: soc-status
            brief: Ascribed status is given at birth, such as age or family background. Achieved status is earned, such as a job or qualification.

  - title: Personal and social identity
    chapters:
      - title: Personal and social identity
        id: nsw-soc-11-3-1
        points:
          - title: Self-concept
            id: soc-self-concept
            brief: How a person sees themselves, built from their own experiences and from how others treat them.
          - title: Coming of age
            id: soc-coming-age
            brief: The move from childhood to adulthood, which different cultures mark at different ages and in different ways.
          - title: Rites of passage
            id: soc-rites-passage
            brief: Ceremonies that mark a change in status, such as a bar or bat mitzvah, a graduation or a wedding.
          - title: Gender roles and identity
            id: soc-gender-roles-identity
            brief: Societies teach expectations about how people of each gender should behave, and these expectations change over time and between cultures.
          - title: Autonomy and interdependence
            id: soc-autonomy-interdependence
            brief: As young people grow, they gain autonomy, the ability to make their own choices, while still depending on others.

  - title: Intercultural communication
    chapters:
      - title: Intercultural communication
        id: nsw-soc-11-4-1
        points:
          - title: Verbal and non-verbal communication
            id: soc-verbal-non-verbal-communication
            brief: People communicate through words and through gestures, eye contact, personal space and tone, all of which differ between cultures.
          - title: Language and culture
            id: soc-language-culture
            brief: A language carries a culture's ideas and values, and some words cannot be translated directly.
          - title: Ethnocentrism and cultural relativism
            id: soc-ethnocentrism-cultural-relativism
            brief: Ethnocentrism judges other cultures by the standards of your own. Cultural relativism tries to understand a culture on its own terms.
          - title: Stereotypes and prejudice
            id: soc-stereotypes-prejudice
            brief: A stereotype is an oversimplified idea about a group, and prejudice is a judgement made without knowing the person. Both can lead to unfair treatment.
          - title: Culture shock
            id: soc-culture-shock
            brief: The confusion and stress people can feel in an unfamiliar culture, which usually eases as they adjust.
          - title: Communicating across cultures
            id: soc-communicating-across-cultures
            brief: Listening, asking questions and learning about other cultures help people communicate respectfully in a globalised world.
