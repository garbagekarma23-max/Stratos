# NSW Studies of Religion II, Year 11: the four Preliminary sections, with all five religious traditions, 39 points.
# Drafted from NESA's Studies of Religion II Stage 6 Syllabus (2009 edition), the syllabus taught in Year 11 in 2026.
# The structure follows the syllabus. Students study two traditions (Studies of Religion I) or three; all five are here.
# Studies of Religion I covers a subset of these sections, so it can reuse these points later. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on Aboriginal spiritualities always go to the review page.
# In transition: a Studies of Religion 11-12 Syllabus is out for consultation (October to December 2026). Check its
# start date before the first run.

id: nsw-sor-11
subject: Studies of Religion
bank: sor
name: Studies of Religion II, Year 11
about: HSC, The nature of religion and five traditions
short: Studies of Religion
years: [11]
place: nsw
kind: standard
syllabus: NSW Studies of Religion II Stage 6 Syllabus, Preliminary (Year 11) course
note: Follows the NSW Studies of Religion syllabus. Not made or endorsed by NESA.
chips: [transcendent, Dreaming, sacred texts, Five Pillars, sectarianism]

units:
  - title: The nature of religion and beliefs
    chapters:
      - title: The nature of religion
        id: nsw-sor-11-1-1
        points:
          - title: The supernatural dimension
            id: sor-supernatural-dimension
            brief: Religions hold beliefs about a reality beyond the everyday world. Transcendent means a divine power beyond the world; immanent means one present within it.
          - title: The characteristics of religion
            id: sor-characteristics-religion
            brief: Religions share features of beliefs, sacred texts and stories, ethics, and rituals and ceremonies, which work together as a whole.
          - title: The contribution of religion
            id: sor-contribution-religion
            brief: Religion gives individuals meaning, identity and guidance, and gives societies shared values, community and ways to mark life's stages.
          - title: The Dreaming
            id: sor-dreaming
            brief: For many Aboriginal peoples, the Dreaming is an ongoing reality that explains creation, law, kinship and connection to land, not only a time in the past.
          - title: Kinship, Country and identity
            id: sor-kinship-country-identity
            brief: In Aboriginal spiritualities, kinship sets each person's relationships and responsibilities, and Country is central to identity and spiritual life.

  - title: Religious tradition studies
    chapters:
      - title: Buddhism
        id: nsw-sor-11-2-1
        points:
          - title: The origins of Buddhism
            id: sor-origins-buddhism
            brief: Buddhism began in northern India about 2,500 years ago with Siddhartha Gautama, who became the Buddha, the awakened one.
          - title: The Four Noble Truths
            id: sor-four-noble-truths
            brief: Life involves suffering (dukkha), suffering comes from craving, it can end, and the Eightfold Path is the way to end it.
          - title: Buddhist sacred texts
            id: sor-buddhist-sacred-texts
            brief: Buddhist teachings are kept in texts such as the Pali Canon (Tipitaka), and schools such as Theravada and Mahayana value different collections.
          - title: Buddhist ethics
            id: sor-buddhist-ethics
            brief: The Five Precepts guide conduct, such as not harming living beings and not taking what is not given. Karma links actions to their results.
          - title: Buddhist practice
            id: sor-buddhist-practice
            brief: Meditation, offerings at temples and honouring the Buddha, the Dharma and the Sangha are central to Buddhist life.

      - title: Christianity
        id: nsw-sor-11-2-2
        points:
          - title: The origins of Christianity
            id: sor-origins-christianity
            brief: Christianity began in the first century CE with the followers of Jesus of Nazareth in Judea, and spread across the Roman Empire.
          - title: Principal Christian beliefs
            id: sor-principal-christian-beliefs
            brief: Christians believe in one God as Trinity (Father, Son and Holy Spirit), that Jesus is divine and human, and in his death and resurrection.
          - title: The Bible
            id: sor-bible
            brief: The Christian Bible holds the Hebrew scriptures, shared in part with Judaism, and the writings of the early church, including the four Gospels and the letters.
          - title: Christian ethics
            id: sor-christian-ethics
            brief: The Ten Commandments, the Beatitudes and Jesus's command to love God and your neighbour guide Christian ethics.
          - title: Christian worship and sacraments
            id: sor-christian-worship-sacraments
            brief: Christians gather for worship, often on Sundays. Many churches celebrate sacraments such as baptism and the Eucharist.

      - title: Hinduism
        id: nsw-sor-11-2-3
        points:
          - title: The origins of Hinduism
            id: sor-origins-hinduism
            brief: Hinduism grew over thousands of years in the Indian subcontinent and has no single founder.
          - title: Principal Hindu beliefs
            id: sor-principal-hindu-beliefs
            brief: Many Hindus believe in Brahman, the ultimate reality, in the cycle of rebirth (samsara) shaped by karma, and in liberation (moksha).
          - title: Hindu sacred texts
            id: sor-hindu-sacred-texts
            brief: Hindu texts include the Vedas, the Upanishads, and epics such as the Mahabharata, which contains the Bhagavad Gita.
          - title: Hindu ethics
            id: sor-hindu-ethics
            brief: Dharma is right duty according to a person's stage of life and place in society. Ahimsa, non-violence, is a widely held value.
          - title: Hindu practice
            id: sor-hindu-practice
            brief: Puja, worship at home or in a temple, festivals such as Diwali, and pilgrimage are important forms of Hindu practice.

      - title: Islam
        id: nsw-sor-11-2-4
        points:
          - title: The origins of Islam
            id: sor-origins-islam
            brief: Islam began in Arabia in the 7th century CE, when Muslims believe the Prophet Muhammad received God's revelation.
          - title: Principal Islamic beliefs
            id: sor-principal-islamic-beliefs
            brief: Muslims believe in one God (Allah), angels, the prophets with Muhammad the last, the revealed books, the Day of Judgement and God's decree.
          - title: The Quran and Hadith
            id: sor-quran-hadith
            brief: The Quran is the word of God revealed to Muhammad. The Hadith record the sayings and actions of the Prophet and guide practice.
          - title: The Five Pillars
            id: sor-five-pillars
            brief: The declaration of faith (shahada), prayer five times a day (salat), giving to the poor (zakat), fasting in Ramadan (sawm) and pilgrimage to Mecca (hajj).
          - title: Islamic ethics
            id: sor-islamic-ethics
            brief: Sharia, drawn from the Quran and Hadith, guides how Muslims live, and actions are judged as permitted or forbidden.

      - title: Judaism
        id: nsw-sor-11-2-5
        points:
          - title: The origins of Judaism
            id: sor-origins-judaism
            brief: Judaism traces its origins to Abraham and the covenant with God, and to Moses receiving the Torah at Sinai.
          - title: Principal Jewish beliefs
            id: sor-principal-jewish-beliefs
            brief: Jews believe in one God, the covenant between God and the Jewish people, and the importance of following God's commandments.
          - title: The Torah and the Tanakh
            id: sor-torah-tanakh
            brief: The Torah is the first five books of the Hebrew Bible, the Tanakh. The Talmud records rabbinic teaching and discussion.
          - title: Jewish ethics
            id: sor-jewish-ethics
            brief: The 613 commandments (mitzvot), including the Ten Commandments, and values such as justice and repairing the world guide Jewish life.
          - title: Jewish practice
            id: sor-jewish-practice
            brief: Observing the Sabbath (Shabbat) from Friday evening to Saturday evening, keeping kosher and festivals such as Passover are central practices.

  - title: Religions of ancient origin
    chapters:
      - title: Shinto
        id: nsw-sor-11-3-1
        points:
          - title: The origins of Shinto
            id: sor-origins-shinto
            brief: Shinto is the indigenous religion of Japan, with roots in ancient Japanese beliefs and no single founder.
          - title: Kami
            id: sor-kami
            brief: Kami are spirits or sacred powers found in nature, places, ancestors and people of great achievement.
          - title: Shrines and rituals
            id: sor-shrines-rituals
            brief: Worship takes place at shrines, marked by torii gates, through purification, offerings and prayers.
          - title: Purity in Shinto
            id: sor-purity-shinto
            brief: Shinto values purity and sincerity, and rituals of cleansing remove impurity before approaching the kami.

  - title: Religion in Australia before 1945
    chapters:
      - title: Religion in Australia before 1945
        id: nsw-sor-11-4-1
        points:
          - title: The effect of colonisation on Aboriginal spiritualities
            id: sor-effect-colonisation-aboriginal-spiritualities
            brief: Dispossession separated many Aboriginal peoples from their land, kinship groups and ceremonies, which damaged the basis of their spiritual life.
          - title: The arrival of Christianity
            id: sor-arrival-christianity
            brief: Christianity arrived with the First Fleet in 1788. The Church of England was dominant at first, with Catholic, Presbyterian and Methodist churches growing.
          - title: Sectarianism
            id: sor-sectarianism
            brief: Tension between Catholics, many of Irish descent, and Protestants shaped Australian politics, schools and work into the 20th century.
          - title: Churches in Australian society
            id: sor-churches-australian-society
            brief: Churches ran schools, hospitals and charities, and influenced laws on issues such as drinking and Sunday trading.
          - title: Other traditions before 1945
            id: sor-other-traditions-before-1945
            brief: Jewish communities, Muslim cameleers from Afghanistan and British India, and Chinese miners on the goldfields brought other traditions to Australia.
