# VCE Physical Education, Units 1 and 2: the human body in motion, and physical activity, sport, exercise and society,
# 51 points.
# Checked against the VCAA's VCE Physical Education Study Design, accredited from 2025, in October 2026. Each unit is
# a unit here, and each area of study is a chapter, or two when it is large. Practical activities are school-run, so
# only the theory is here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW Health and Movement Science (the hms bank) teaches the same body systems, so expect some reuses. Points on
# drugs that boost performance always go to the review page.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-pe-u12
subject: Physical Education
bank: pe
name: Physical Education, Units 1 and 2
about: VCE, The body in motion, and sport in society
short: Physical Education
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Physical Education Study Design (from 2025), Units 1 and 2
note: Follows the VCE Physical Education study design. Not made or endorsed by the VCAA.
chips: [synovial joint, agonist, cardiac output, sedentary behaviour, social-ecological model]

units:
  - title: "Unit 1: The human body in motion"
    chapters:
      - title: Bones, joints and muscles
        id: vic-pe-u12-1-1
        points:
          - title: Functions of the skeleton
            id: pe-functions-skeleton
            brief: The skeleton supports the body, protects organs, allows movement through levers, stores minerals and makes blood cells.
          - title: Types of bones
            id: pe-types-bones
            brief: Long, short, flat, irregular and sesamoid bones each suit a job, such as long bones for leverage.
          - title: Types of joints
            id: pe-types-joints
            brief: Joints are fibrous (no movement), cartilaginous (slight movement) or synovial (free movement).
          - title: Synovial joints
            id: pe-synovial-joints
            brief: Freely moving joints, such as the knee and shoulder, with cartilage, synovial fluid and ligaments that allow and protect movement.
          - title: Movement terms
            id: pe-movement-terms
            brief: Flexion, extension, abduction, adduction, rotation and circumduction describe how body parts move at joints.
          - title: Major muscles
            id: pe-major-muscles
            brief: The main muscles of the body, such as the quadriceps, hamstrings, deltoids and biceps, and the movements each produces.

      - title: How muscles produce movement
        id: vic-pe-u12-1-2-2
        points:
          - title: Agonists, antagonists and stabilisers
            id: pe-agonists-antagonists-stabilisers
            brief: The agonist causes a movement, the antagonist relaxes to allow it, and stabilisers hold other joints steady.
          - title: Types of muscle contraction
            id: pe-types-muscle-contraction
            brief: Concentric contractions shorten the muscle, eccentric ones lengthen it under load, and isometric ones hold it still.
          - title: Muscle fibre types
            id: pe-muscle-fibre-types
            brief: Slow-twitch fibres resist fatigue and suit endurance; fast-twitch fibres are powerful but tire quickly. Fibre arrangement also affects force.
          - title: Motor units
            id: pe-motor-units
            brief: A nerve and the fibres it controls form a motor unit. Small units are recruited first, and each unit contracts fully or not at all.
          - title: Levers in the body
            id: pe-levers-body
            brief: Bones act as levers, joints as axes and muscles as the force, producing movement in lever systems.

      - title: Injury and the musculoskeletal system
        id: vic-pe-u12-1-3
        points:
          - title: Musculoskeletal injuries
            id: pe-musculoskeletal-injuries
            brief: Acute injuries such as sprains happen suddenly; chronic problems such as overtraining syndrome, arthritis and osteoporosis develop over time.
          - title: Preventing injury
            id: pe-preventing-injury
            brief: Warming up, cooling down and proper rehabilitation help prevent injury or stop it coming back.
          - title: Physical aids
            id: pe-physical-aids
            brief: Protective equipment, taping and braces support joints and muscles and reduce the risk of injury.

      - title: The cardiovascular system
        id: vic-pe-u12-1-2
        points:
          - title: Structure of the heart
            id: pe-structure-heart
            brief: The heart has four chambers, two atria and two ventricles, with valves that keep blood flowing one way.
          - title: Blood vessels
            id: pe-blood-vessels
            brief: Arteries carry blood away from the heart, veins return it, and capillaries let gases and nutrients pass to tissues.
          - title: Components of blood
            id: pe-components-blood
            brief: Red blood cells carry oxygen, white cells fight infection, platelets help clotting, and plasma carries nutrients and wastes.
          - title: Heart rate, stroke volume and cardiac output
            id: pe-heart-rate-stroke-volume
            brief: Cardiac output is the blood pumped each minute, equal to heart rate times stroke volume.
          - title: Blood flow at rest and in exercise
            id: pe-acute-responses-exercise
            brief: During exercise, more blood goes to working muscles and less to organs such as the gut, as the heart pumps harder.
          - title: Thermoregulation
            id: pe-thermoregulation
            brief: Blood vessels widen near the skin to lose heat and narrow to keep it, controlling body temperature at rest and in exercise.

      - title: The respiratory system
        id: vic-pe-u12-1-5
        points:
          - title: The respiratory system
            id: pe-respiratory-system
            brief: Air passes through the nose, trachea, bronchi and bronchioles to the alveoli, where gas exchange happens.
          - title: Ventilation
            id: pe-ventilation
            brief: Ventilation is the air breathed each minute, equal to breathing rate times the volume of each breath.
          - title: Gas exchange
            id: pe-gas-exchange
            brief: Oxygen and carbon dioxide diffuse between the alveoli and capillaries in the lungs, and between capillaries and muscles.
          - title: Benefits of regular aerobic exercise
            id: pe-benefits-regular-aerobic-exercise
            brief: Regular aerobic exercise strengthens the heart and lungs so they deliver more oxygen to the body.

      - title: Boosting performance
        id: vic-pe-u12-1-6
        points:
          - title: Substances that boost performance
            id: pe-substances-boost-performance
            brief: Substances such as anabolic steroids build muscle but carry health risks and are banned in sport.
          - title: Boosting the cardiorespiratory system
            id: pe-boosting-cardiorespiratory-system
            brief: Altitude training is allowed; EPO, blood doping and beta blockers are banned. Each has benefits and health risks.
          - title: Ethics of boosting performance
            id: pe-ethics-boosting-performance
            brief: Using banned substances and methods raises questions of fairness, health, the spirit of sport and pressure on athletes.

  - title: "Unit 2: Physical activity, sport, exercise and society"
    chapters:
      - title: Physical activity and health
        id: vic-pe-u12-2-1
        points:
          - title: Physical activity, exercise and sport
            id: pe-physical-activity-exercise-sport
            brief: Physical activity includes play, games, formal and informal sport, active transport, chores, exercise and recreation.
          - title: Sedentary behaviour
            id: pe-sedentary-behaviour
            brief: Time spent sitting or lying while awake, such as screen time, which harms health even in people who exercise.
          - title: Physical activity guidelines
            id: pe-physical-activity-guidelines
            brief: Australia's guidelines set how much activity each age group needs, such as 60 minutes a day for young people, and to limit sitting.
          - title: Benefits of physical activity
            id: pe-benefits-physical-activity
            brief: Regular activity has physical, social, mental, emotional and spiritual benefits.
          - title: Activity levels and trends
            id: pe-activity-levels-trends
            brief: Data shows how many Australians meet the guidelines, how activity changes with age and how sedentary behaviour is rising.
          - title: Measuring physical activity
            id: pe-measuring-physical-activity
            brief: Activity can be measured with questionnaires, diaries, pedometers, accelerometers and heart rate monitors, each with strengths and limits.

      - title: Promoting physical activity
        id: vic-pe-u12-2-2-2
        points:
          - title: The social-ecological model
            id: pe-social-ecological-model
            brief: A model showing activity is shaped at several levels, the individual, social, physical environment and policy.
          - title: Barriers and enablers to activity
            id: pe-barriers-enablers-activity
            brief: Gender, family, peers, income, community and cultural norms can make it easier or harder for a person to be active.
          - title: Population-wide initiatives
            id: pe-population-wide-initiatives
            brief: Programs, policies and environments, such as bike paths or school sport, aim to get whole populations moving.
          - title: A personal activity plan
            id: pe-personal-activity-plan
            brief: A plan built around a person's goals, with self-management skills such as goal setting and self-monitoring, to be more active and sit less.

      - title: Fitness and movement assessment
        id: vic-pe-u12-2-3
        points:
          - title: Health-related fitness
            id: pe-health-related-fitness
            brief: Aerobic power, muscular strength and endurance and flexibility affect health, and each depends on factors such as age, sex and training.
          - title: Functional movement assessment
            id: pe-functional-movement-assessment
            brief: Testing how well a person moves, weighing physical, psychological and sociocultural factors before they start a program.
          - title: Screening and informed consent
            id: pe-screening-informed-consent
            brief: Health screening before activity finds risks, and informed consent means the person understands and agrees to the testing.
          - title: Reliable and valid assessment
            id: pe-reliable-valid-assessment
            brief: A reliable test gives the same result each time, a valid test measures what it should, and an accurate one is close to the true value.

      - title: Intrapersonal issues in sport
        id: vic-pe-u12-2-2
        points:
          - title: Hormones and physical activity
            id: pe-hormones-physical-activity
            brief: Hormonal changes, such as the menstrual cycle, can be considered when planning training and activity.
          - title: Injury, concussion and safety
            id: pe-injury-concussion-safety
            brief: Concussion and knee injuries are common in sport, and rules, equipment and return-to-play protocols manage the risk.
          - title: Psychological skills and sleep
            id: pe-psychological-skills-sleep
            brief: Strategies for confidence, focus and good sleep support performance and enjoyment of sport.
          - title: Mental fitness in sport
            id: pe-mental-fitness-sport
            brief: Physical activity supports mental fitness, and elite sport pathways have a duty to protect athletes' mental health.

      - title: Interpersonal and structural issues in sport
        id: vic-pe-u12-2-5
        points:
          - title: Living in the city or the country
            id: pe-living-city-or-country
            brief: Distance, facilities, cost and choice of sports differ between rural and urban areas, affecting who can play.
          - title: Coaching
            id: pe-coaching
            brief: Coaching styles, good program design and ethical behaviour, including keeping young athletes safe, shape participation and performance.
          - title: Technology in sport
            id: pe-technology-sport
            brief: Equipment, data and video review can improve performance and fairness, but raise questions about cost and advantage.
          - title: Media and sport
            id: pe-media-sport
            brief: The media shapes which sports are popular, how athletes are seen and how sport is funded.
          - title: Inclusion in sport
            id: pe-inclusion-sport
            brief: Policies and clubs can include Aboriginal and Torres Strait Islander people, people from diverse cultures, people with disability and gender-diverse people.
          - title: Gender equity in sport
            id: pe-women-sport
            brief: Gaps in pay, media coverage and the number of women coaching and running sport show where gender equity is still lacking.
