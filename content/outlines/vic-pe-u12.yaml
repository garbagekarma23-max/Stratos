# VCE Physical Education, Units 1 and 2: the human body in motion, and physical activity, sport, exercise and
# society, 36 points.
# Drafted from the VCAA's VCE Physical Education Study Design, accredited from 2025. The structure follows the study
# design: each unit is a unit here, and each area of study is a chapter. Practical activities are school-run, so only
# the theory is here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW Health and Movement Science (the hms bank) teaches the same body systems, so expect some reuses. Points on
# performance-enhancing drugs always go to the review page.

id: vic-pe-u12
subject: Physical Education
bank: pe
name: Physical Education, Units 1 and 2
about: VCE, The body in motion, and sport in society
short: Physical Education
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Physical Education Study Design (from 2025), Units 1 and 2
note: Follows the VCE Physical Education study design. Not made or endorsed by the VCAA.
chips: [synovial joint, agonist, cardiac output, sedentary behaviour, social-ecological model]

units:
  - title: "Unit 1: The human body in motion"
    chapters:
      - title: The musculoskeletal system
        id: vic-pe-u12-1-1
        points:
          - title: Functions of the skeleton
            id: pe-functions-skeleton
            brief: The skeleton supports the body, protects organs, allows movement through levers, stores minerals and makes blood cells.
          - title: Types of bones
            id: pe-types-bones
            brief: Long, short, flat, irregular and sesamoid bones each suit a job, such as long bones for leverage.
          - title: Types of joints
            id: pe-types-joints
            brief: Joints are fibrous (no movement), cartilaginous (slight movement) or synovial (free movement).
          - title: Synovial joints
            id: pe-synovial-joints
            brief: Freely moving joints, such as the knee and shoulder, with cartilage, synovial fluid and ligaments that allow and protect movement.
          - title: Movement terms
            id: pe-movement-terms
            brief: Flexion, extension, abduction, adduction, rotation and circumduction describe how body parts move at joints.
          - title: Types of muscle
            id: pe-types-muscle
            brief: Skeletal muscle moves the body and is voluntary. Smooth muscle lines organs, and cardiac muscle makes up the heart.
          - title: Agonists, antagonists and stabilisers
            id: pe-agonists-antagonists-stabilisers
            brief: The agonist causes a movement, the antagonist relaxes to allow it, and stabilisers hold other joints steady.
          - title: Types of muscle contraction
            id: pe-types-muscle-contraction
            brief: Concentric contractions shorten the muscle, eccentric ones lengthen it under load, and isometric ones hold it still.
          - title: Muscle fibre types
            id: pe-muscle-fibre-types
            brief: Slow-twitch fibres resist fatigue for endurance. Fast-twitch fibres produce force quickly for power but tire fast.
          - title: Sliding filament theory
            id: pe-sliding-filament-theory
            brief: A muscle contracts when myosin pulls actin filaments toward the centre of each sarcomere, using ATP.
          - title: Musculoskeletal injuries
            id: pe-musculoskeletal-injuries
            brief: Sprains damage ligaments, strains damage muscles or tendons, and fractures break bones. Overuse and poor technique raise the risk.
          - title: Performance-enhancing substances and the body
            id: pe-performance-enhancing-substances-body
            brief: Substances such as anabolic steroids build muscle but carry health risks and are banned in sport.

      - title: The cardiorespiratory system
        id: vic-pe-u12-1-2
        points:
          - title: Structure of the heart
            id: pe-structure-heart
            brief: The heart has four chambers, two atria and two ventricles, with valves that keep blood flowing one way.
          - title: Blood vessels
            id: pe-blood-vessels
            brief: Arteries carry blood away from the heart, veins return it, and capillaries let gases and nutrients pass to tissues.
          - title: Components of blood
            id: pe-components-blood
            brief: Red blood cells carry oxygen, white cells fight infection, platelets help clotting, and plasma carries nutrients and wastes.
          - title: The respiratory system
            id: pe-respiratory-system
            brief: Air passes through the nose, trachea, bronchi and bronchioles to the alveoli, where gas exchange happens.
          - title: Gas exchange
            id: pe-gas-exchange
            brief: Oxygen diffuses from the alveoli into the blood and carbon dioxide diffuses out, from high to low concentration.
          - title: Heart rate, stroke volume and cardiac output
            id: pe-heart-rate-stroke-volume
            brief: Cardiac output is the blood pumped each minute, equal to heart rate times stroke volume.
          - title: Ventilation
            id: pe-ventilation
            brief: Ventilation is the air breathed each minute, equal to breathing rate times the volume of each breath.
          - title: VO2 max
            id: pe-vo2-max
            brief: The most oxygen the body can take in and use each minute, a measure of aerobic fitness.
          - title: Blood pressure
            id: pe-blood-pressure
            brief: The pressure of blood on artery walls, given as systolic over diastolic. Systolic rises during exercise.
          - title: Acute responses to exercise
            id: pe-acute-responses-exercise
            brief: During exercise, heart rate, stroke volume, breathing and blood flow to working muscles all rise to meet the demand for oxygen.

  - title: "Unit 2: Physical activity, sport, exercise and society"
    chapters:
      - title: Physical activity, health and society
        id: vic-pe-u12-2-1
        points:
          - title: Physical activity, exercise and sport
            id: pe-physical-activity-exercise-sport
            brief: Physical activity is any body movement that uses energy. Exercise is planned activity to improve fitness. Sport is organised and has rules.
          - title: Sedentary behaviour
            id: pe-sedentary-behaviour
            brief: Time spent sitting or lying while awake, such as screen time, which harms health even in people who exercise.
          - title: Physical activity guidelines
            id: pe-physical-activity-guidelines
            brief: Australia's guidelines set how much activity each age group needs, such as 60 minutes a day for young people, and to limit sitting.
          - title: Benefits of physical activity
            id: pe-benefits-physical-activity
            brief: Activity lowers the risk of heart disease, diabetes and some cancers, and improves mood, sleep and social connection.
          - title: Measuring physical activity
            id: pe-measuring-physical-activity
            brief: Activity can be measured with questionnaires, diaries, pedometers, accelerometers and heart rate monitors, each with strengths and limits.
          - title: The social-ecological model
            id: pe-social-ecological-model
            brief: A model showing activity is shaped at several levels, the individual, social, physical environment and policy.
          - title: Barriers and enablers to activity
            id: pe-barriers-enablers-activity
            brief: Cost, time, safety, access and confidence can stop people being active. Support, facilities and policy can help them.

      - title: Contemporary issues in physical activity and sport
        id: vic-pe-u12-2-2
        points:
          - title: Participation across groups
            id: pe-participation-across-groups
            brief: Rates of activity and sport differ by age, gender, income, culture and disability, and some groups face more barriers.
          - title: Women in sport
            id: pe-women-sport
            brief: Women's sport has grown in pay, coverage and participation, but gaps remain with men's sport.
          - title: Inclusion in sport
            id: pe-inclusion-sport
            brief: Modified rules, accessible facilities and inclusive clubs let people with disability and diverse backgrounds take part.
          - title: Media and sport
            id: pe-media-sport
            brief: The media shapes which sports are popular, how athletes are seen and how sport is funded.
          - title: Drugs in sport
            id: pe-drugs-sport
            brief: Doping gives an unfair advantage and risks health. Anti-doping bodies test athletes and set penalties.
          - title: Violence and safety in sport
            id: pe-violence-safety-sport
            brief: Rules, tribunals and codes of conduct aim to reduce violence and injuries such as concussion.
          - title: Technology in sport
            id: pe-technology-sport
            brief: Equipment, data and video review can improve performance and fairness, but raise questions about cost and advantage.
