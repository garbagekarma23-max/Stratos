# NSW Biology, Year 12: Modules 5 to 8, 50 points.
# Drafted from NESA's Biology Stage 6 Syllabus (2017), the syllabus taught in Year 12 until the 2027 HSC. The structure
# follows the syllabus: each module is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: the Biology 11-12 Syllabus (2025) replaces this one for Year 12 from Term 4 2027 (first HSC 2028).

id: nsw-bio-12
subject: Biology
bank: bio
name: Biology, Year 12
about: HSC, Heredity, genetic change and disease
short: Biology
years: [12]
place: nsw
kind: standard
syllabus: NSW Biology Stage 6 Syllabus (2017), Year 12 course, Modules 5 to 8
note: Follows the NSW Biology syllabus. Not made or endorsed by NESA.
chips: [meiosis, mutation, pathogen, antibody, homeostasis]

units:
  - title: Heredity
    chapters:
      - title: Reproduction
        id: nsw-bio-12-1-1
        points:
          - title: Sexual and asexual reproduction
            id: bio-sexual-asexual-reproduction
            brief: Asexual reproduction makes identical offspring from one parent and is fast. Sexual reproduction combines genes from two parents and gives variation.
          - title: Reproduction in plants, fungi and bacteria
            id: bio-reproduction-plants-fungi-bacteria
            brief: Flowering plants use pollination and seeds, fungi reproduce with spores and budding, and bacteria divide by binary fission.
          - title: Fertilisation and implantation in mammals
            id: bio-fertilisation-implantation-mammals
            brief: A sperm and egg fuse to form a zygote, which divides and implants in the wall of the uterus.
          - title: Hormones in pregnancy
            id: bio-hormones-pregnancy
            brief: Hormones such as progesterone and oestrogen keep the uterus lining in place and support the pregnancy. The placenta makes some of them.

      - title: Cell replication and DNA
        id: nsw-bio-12-1-2
        points:
          - title: Mitosis
            id: bio-mitosis
            brief: Division that makes two identical cells for growth and repair, keeping the full chromosome number.
          - title: Meiosis
            id: bio-meiosis
            brief: Division that makes four sex cells with half the chromosome number. Crossing over and independent assortment create variation.
          - title: DNA structure
            id: bio-dna-structure
            brief: DNA is a double helix of two strands of nucleotides. Bases pair A with T and C with G, held by hydrogen bonds.
          - title: DNA replication
            id: bio-dna-replication
            brief: The helix unzips and each strand is a template for a new one, so each copy has one old and one new strand.
          - title: Making proteins
            id: bio-making-proteins
            brief: In transcription, a gene's DNA is copied into mRNA. In translation, ribosomes read the mRNA in codons and tRNA brings the matching amino acids to build a polypeptide.

      - title: Patterns of inheritance
        id: nsw-bio-12-1-3
        points:
          - title: Genotype and phenotype
            id: bio-genotype-phenotype
            brief: The genotype is the alleles an organism carries. The phenotype is the trait that shows, which also depends on the environment.
          - title: Dominant and recessive alleles
            id: bio-dominant-recessive-alleles
            brief: A dominant allele shows when only one copy is present. A recessive one shows only with two copies. Punnett squares predict the ratios of offspring.
          - title: Codominance and incomplete dominance
            id: bio-codominance-incomplete-dominance
            brief: In codominance both alleles show fully, as in AB blood. In incomplete dominance the result is a blend, such as pink flowers from red and white.
          - title: Sex-linked inheritance
            id: bio-sex-linked-inheritance
            brief: Genes on the X chromosome, such as for red-green colour blindness, show more often in males, who have only one X.
          - title: Pedigrees
            id: bio-pedigrees
            brief: Family trees that track a trait through generations, used to work out whether it is dominant, recessive or sex-linked.
          - title: Variation in populations
            id: bio-variation-populations
            brief: Allele frequencies describe how common each version of a gene is in a population. Genetic testing and DNA sequencing show this variation.

  - title: Genetic change
    chapters:
      - title: Mutation
        id: nsw-bio-12-2-1
        points:
          - title: Point and chromosomal mutations
            id: bio-point-chromosomal-mutations
            brief: A point mutation changes one or a few bases. A chromosomal mutation changes part or all of a chromosome, such as a deletion or duplication.
          - title: Causes of mutation
            id: bio-causes-mutation
            brief: Mutations can happen by chance during copying, or be caused by mutagens such as ultraviolet light, radiation and some chemicals.
          - title: Somatic and germline mutations
            id: bio-somatic-germline-mutations
            brief: Somatic mutations happen in body cells and are not inherited. Germline mutations happen in sex cells and can be passed on.
          - title: Coding and non-coding DNA
            id: bio-coding-non-coding-dna
            brief: Only a small part of DNA codes for proteins. Non-coding DNA includes regions that control when genes are switched on.
          - title: Gene flow and genetic drift
            id: bio-gene-flow-genetic-drift
            brief: Gene flow moves alleles between populations. Genetic drift is chance change in allele frequencies, strongest in small populations.

      - title: Biotechnology
        id: nsw-bio-12-2-2
        points:
          - title: What biotechnology is
            id: bio-biotechnology
            brief: Using living things or their parts to make products, from bread and cheese to medicines made by modified bacteria.
          - title: Reproductive technologies
            id: bio-reproductive-technologies
            brief: Artificial insemination, artificial pollination and IVF let people choose which organisms breed, in farming and in medicine.
          - title: Cloning
            id: bio-cloning
            brief: Making genetically identical copies of genes, cells or whole organisms, as with plant cuttings or the cloning of Dolly the sheep.
          - title: Recombinant DNA and transgenic organisms
            id: bio-recombinant-dna-transgenic-organisms
            brief: Cutting a gene from one organism and inserting it into another, such as the human insulin gene into bacteria, to make a transgenic organism.
          - title: Effects of biotechnology on biodiversity
            id: bio-effects-biotechnology-biodiversity
            brief: Genetic engineering and selective breeding can narrow genetic diversity in crops and livestock, which can make them vulnerable to new diseases.
          - title: Ethics of biotechnology
            id: bio-ethics-biotechnology
            brief: Biotechnology raises questions of safety, fairness, ownership of genes and changing nature, and different groups weigh them differently.

  - title: Infectious disease
    chapters:
      - title: Pathogens and spread
        id: nsw-bio-12-3-1
        points:
          - title: Types of pathogens
            id: bio-types-pathogens
            brief: Prions, viruses, bacteria, protozoa, fungi and parasites cause disease in different ways. Viruses need a host cell to reproduce.
          - title: Koch's postulates
            id: bio-koch-s-postulates
            brief: Koch's steps link a particular microbe to a disease, by finding it in sick hosts, growing it and showing it causes the disease in a healthy host.
          - title: Pasteur and germ theory
            id: bio-pasteur-germ-theory
            brief: Pasteur's experiments, including swan-neck flasks, showed microbes come from other microbes, not from nowhere, and cause decay and disease.
          - title: How diseases spread
            id: bio-diseases-spread
            brief: Diseases spread by direct contact, droplets, contaminated food or water, and vectors such as mosquitoes.
          - title: Plant responses to pathogens
            id: bio-plant-responses-pathogens
            brief: Plants have physical barriers, such as thick cell walls, and chemical defences, and can kill infected cells to stop a pathogen spreading.

      - title: The immune system
        id: nsw-bio-12-3-2
        points:
          - title: The first line of defence
            id: bio-first-line-defence
            brief: Skin, mucous membranes, cilia, stomach acid and tears stop most pathogens getting in.
          - title: The innate immune response
            id: bio-innate-immune-response
            brief: Inflammation, fever and phagocytes, which engulf pathogens, respond quickly to any invader in the same way.
          - title: The adaptive immune response
            id: bio-adaptive-immune-response
            brief: B cells make antibodies that bind particular antigens. T cells kill infected cells or help other immune cells. This response is slower but targeted.
          - title: Immune memory
            id: bio-immune-memory
            brief: Memory cells stay after an infection, so a second exposure to the same pathogen brings a faster, stronger response.

      - title: Preventing and controlling disease
        id: nsw-bio-12-3-3
        points:
          - title: Vaccination
            id: bio-vaccination
            brief: A vaccine exposes the body to a harmless form or part of a pathogen, so memory cells form without illness.
          - title: Herd immunity
            id: bio-herd-immunity
            brief: When enough people are immune, a pathogen cannot spread easily, which protects people who cannot be vaccinated.
          - title: Antibiotics and antivirals
            id: bio-antibiotics-antivirals
            brief: Antibiotics kill or stop bacteria and do nothing to viruses. Antivirals slow a virus. Overuse of antibiotics breeds resistant bacteria.
          - title: Epidemics and public health
            id: bio-epidemics-public-health
            brief: Quarantine, hygiene, clean water, contact tracing and tracking cases help stop outbreaks spreading locally and globally.
          - title: Aboriginal medicines and research
            id: bio-aboriginal-medicines-research
            brief: Aboriginal and Torres Strait Islander knowledge of plants with medicinal uses has been studied by scientists, which raises questions of consent and fair sharing of benefits.

  - title: Non-infectious disease and disorders
    chapters:
      - title: Homeostasis
        id: nsw-bio-12-4-1
        points:
          - title: Homeostasis and negative feedback
            id: bio-homeostasis-negative-feedback
            brief: Homeostasis keeps internal conditions steady. In negative feedback, a change is detected and the response reverses it.
          - title: Controlling body temperature
            id: bio-controlling-body-temperature
            brief: The hypothalamus detects temperature changes and triggers sweating, shivering and changes in blood flow to the skin.
          - title: Controlling blood glucose
            id: bio-controlling-blood-glucose
            brief: Insulin lowers blood glucose and glucagon raises it. Both are hormones made by the pancreas.
          - title: Water balance in the body
            id: bio-water-balance-body
            brief: The kidneys adjust how much water is lost in urine, under the control of a hormone called ADH.
          - title: Plant responses to stay in balance
            id: bio-plant-responses-stay-balance
            brief: Plants control water loss by closing stomata and dropping leaves in drought.

      - title: Causes and prevention
        id: nsw-bio-12-4-2
        points:
          - title: Types of non-infectious disease
            id: bio-types-non-infectious-disease
            brief: Non-infectious diseases come from genes, the environment, nutrition or how cells grow, such as cystic fibrosis, skin cancer, scurvy and heart disease.
          - title: Epidemiology
            id: bio-epidemiology
            brief: Studying patterns of disease in populations, through incidence, prevalence and mortality, to find causes and test treatments.
          - title: Prevention programs
            id: bio-prevention-programs
            brief: Programs such as skin cancer campaigns and screening find disease early or cut risk factors.
          - title: Technologies for hearing loss
            id: bio-technologies-hearing-loss
            brief: Hearing aids make sounds louder. Cochlear implants, developed in Australia, turn sound into electrical signals sent to the auditory nerve.
          - title: Technologies for vision and kidney disease
            id: bio-technologies-vision-kidney-disease
            brief: Glasses, contact lenses and laser surgery correct vision. Dialysis filters the blood when the kidneys fail.
