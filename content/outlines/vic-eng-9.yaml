# Victorian Curriculum English, Level 9 (Year 9): language, literature and literacy, 39 points.
# Follows the Victorian Curriculum F-10 Version 2.0: English, Level 9, checked on the VCAA's Version 2.0 website
# (f10.vcaa.vic.edu.au) in November 2026. VC2.0 English was published in December 2023, with familiarisation in 2024
# and implementation from 2025. It replaced English in the Victorian Curriculum F-10 Version 1.0 (taught from 2017).
# No newer version is announced; the Version 1.0 website closes on 31 December 2026.
# VC2.0 sets English by single levels, in three strands (Language, Literature, Literacy), each with sub-strands. Each
# strand is a unit here, and each chapter is one sub-strand, two small ones together, or part of a large one. Creating
# texts and speaking are covered only as the ideas behind them (contention, rebuttal, rhetorical devices, editing).
# No set texts are named, since schools choose their own, and nothing is quoted from any text. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-eng-9
subject: English
bank: eng
name: English, Year 9
about: Victorian Curriculum 2.0, Level 9
short: English
years: [9]
place: vic
kind: english
syllabus: "Victorian Curriculum F-10 Version 2.0: English, Level 9"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [allusion, sentence fragment, symbolism, allegory, unreliable narrator, rebuttal]

units:
  - title: Language
    chapters:
      - title: Building rapport and expressing values
        id: vic-eng-9-1-1
        points:
          - title: Language that builds rapport
            id: eng-language-that-builds-rapport
            brief: Inclusive pronouns such as we and us, shared jokes, a friendly tone and showing agreement draw a speaker and audience closer.
            codes: [VC2E9LA01]
          - title: Allusion
            id: eng-allusion-2-vic
            brief: An allusion is a brief reference to a well-known person, story or event, which brings its meaning into the text without explaining it.
            codes: [VC2E9LA02]
          - title: Evocative vocabulary
            id: eng-evocative-vocabulary-vic
            brief: Words chosen to call up strong feelings and pictures, such as shattered rather than broken, reveal the writer's view and stir the reader's.
            codes: [VC2E9LA02]

      - title: Adapting structure and condensing ideas
        id: vic-eng-9-1-2
        points:
          - title: Adapting a text structure
            id: eng-adapting-text-structure
            brief: Writers bend a usual structure for a purpose, such as an argument told as a story or a report told as a list, to surprise or engage readers.
            codes: [VC2E9LA03]
          - title: Condensing information with noun groups
            id: eng-condensing-information-with-noun
            brief: Long noun groups and nominalised words pack a lot of information into few words, as in the rapid growth of online shopping.
            codes: [VC2E9LA04]
          - title: Reference words and cohesion
            id: eng-reference-words-cohesion
            brief: Words such as this, these, such and the former point back to earlier ideas, linking sentences without repeating them.
            codes: [VC2E9LA04]
          - title: Abstract nouns that summarise
            id: eng-abstract-nouns-that-summarise
            brief: An abstract noun such as this injustice or the decision can sum up a whole idea from an earlier sentence and carry it forward.
            codes: [VC2E9LA06]

      - title: Sentence style and punctuation
        id: vic-eng-9-1-3
        points:
          - title: Sentence fragments for effect
            id: eng-sentence-fragments-effect-vic
            brief: A sentence fragment lacks a main clause but can be used on purpose for emphasis or shock, as long as the writer controls it.
            codes: [VC2E9LA05]
          - title: Varying sentence length
            id: eng-varying-sentence-length-vic
            brief: Mixing short and long sentences, and starting them in different ways, keeps writing lively and lets the most important point stand out.
            codes: [VC2E9LA05]
          - title: Word choice and mood
            id: eng-word-choice-mood
            brief: The vocabulary a writer chooses builds the mood of a passage, such as gloomy, peaceful or tense, and shapes the writer's style.
            codes: [VC2E9LA08]
          - title: Quotation marks, ellipses and square brackets
            id: eng-quotation-marks-ellipses-square
            brief: Quotation marks show exact words, an ellipsis shows words left out, and square brackets show words added to make a quotation fit.
            codes: [VC2E9LA09]
          - title: Citing sources
            id: eng-citing-sources
            brief: Naming the author, title and date of a source, in the text and in a reference list, gives credit and lets readers check it.
            codes: [VC2E9LA09]

      - title: Symbols, light and sound on screen
        id: vic-eng-9-1-4
        points:
          - title: Visual symbols
            id: eng-visual-symbols
            brief: Objects and colours in images can stand for ideas, such as a wilting flower for loss or red for danger or passion.
            codes: [VC2E9LA07]
          - title: Lighting and colour in film
            id: eng-lighting-colour-film
            brief: Bright, even lighting feels safe and open, while dim lighting with strong shadows creates mystery or threat.
            codes: [VC2E9LA07]
          - title: Soundtrack and silence
            id: eng-soundtrack-silence
            brief: A soundtrack can signal how to feel, and a sudden silence can make a moment shocking or tense.
            codes: [VC2E9LA07]

  - title: Literature
    chapters:
      - title: Representation and response
        id: vic-eng-9-2-1
        points:
          - title: Stereotypes and complex characters
            id: eng-stereotypes-complex-characters
            brief: A stereotype reduces a group to a few fixed traits, while a complex character has mixed qualities and can change, which makes a representation fairer.
            codes: [VC2E9LE01]
          - title: Representations of place by Aboriginal and Torres Strait Islander authors
            id: eng-representations-place-by-aboriginal
            brief: Aboriginal and Torres Strait Islander authors often represent places as Country, with deep connections to people, culture and history.
            codes: [VC2E9LE01]
          - title: How responses change on rereading
            id: eng-responses-change-rereading
            brief: A first reading gives an impression, and later readings notice more detail and patterns, which can change or deepen a personal response.
            codes: [VC2E9LE02]
          - title: Moral positions in literature
            id: eng-moral-positions-literature
            brief: Literary devices and images can lead readers to judge a character's choices as right or wrong, and to accept or question the text's values.
            codes: [VC2E9LE03]

      - title: Symbolism, allegory and metonymy
        id: vic-eng-9-2-2
        points:
          - title: Extended metaphor
            id: eng-extended-metaphor-vic
            brief: An extended metaphor carries one comparison through several lines or a whole text, such as life described as a journey.
            codes: [VC2E9LE04]
          - title: Metonymy
            id: eng-metonymy-vic
            brief: Metonymy names something by a thing closely linked to it, such as the crown for a king or queen, or the press for journalists.
            codes: [VC2E9LE04]
          - title: Allegory
            id: eng-allegory-vic
            brief: An allegory is a story whose characters and events stand for ideas or real events, so it carries a second, hidden meaning.
            codes: [VC2E9LE04]
          - title: Symbolism in literature
            id: eng-symbolism-literature-vic
            brief: A symbol is an object, character or setting that stands for something larger, often appearing again at important moments.
            codes: [VC2E9LE04]
          - title: Aesthetic qualities
            id: eng-aesthetic-qualities
            brief: Aesthetic qualities are what make a text striking or beautiful to read, such as its rhythm, imagery and shape, and how they add to meaning.
            codes: [VC2E9LE05]

      - title: Experimenting with form and voice
        id: vic-eng-9-2-3
        points:
          - title: Verse novels and graphic novels
            id: eng-verse-novels-graphic-novels
            brief: Hybrid forms mix features, such as a verse novel telling a story in poems or a graphic novel telling it through panels, words and images.
            codes: [VC2E9LE06]
          - title: The unreliable narrator
            id: eng-unreliable-narrator
            brief: An unreliable narrator cannot be fully trusted, because they lie, misunderstand or leave things out, so readers must look past what they say.
            codes: [VC2E9LE06]
          - title: Non-linear structures
            id: eng-non-linear-structures
            brief: Starting in the middle of the action, ending where the story began, or jumping between times changes how readers piece the story together.
            codes: [VC2E9LE05, VC2E9LE06]

  - title: Literacy
    chapters:
      - title: Speeches and context
        id: vic-eng-9-3-1
        points:
          - title: Rhetorical devices in speeches
            id: eng-rhetorical-devices-speeches
            brief: Speakers use groups of three, repetition at the start of lines, contrast and direct address to make ideas memorable to listeners.
            codes: [VC2E9LY02]
          - title: How a text positions its audience
            id: eng-text-positions-audience
            brief: Through what it shows first, whose voice it gives and its word choice, a text leads its audience towards a particular response.
            codes: [VC2E9LY01]
          - title: Representations of concepts over time
            id: eng-representations-concepts-over-time
            brief: Ideas such as heroism, family or success are represented differently in different times and cultures, which shows a text's context.
            codes: [VC2E9LY04]

      - title: Spelling and voice on the page
        id: vic-eng-9-3-2
        points:
          - title: Non-standard spelling for effect
            id: eng-non-standard-spelling-effect
            brief: Writers may spell words as they are spoken, or break spelling rules, to create humour, a character's voice or a distinctive style.
            codes: [VC2E9LY03]
          - title: Writing accents and dialects
            id: eng-writing-accents-dialects
            brief: Spelling and grammar can be changed on the page to show how a character speaks, which should be done with care so it is not a mockery.
            codes: [VC2E9LY03]
          - title: Spelling plurals
            id: eng-spelling-plurals
            brief: Common plural patterns such as adding -es after s, x or ch, changing y to ies, and f to ves, and plurals that change completely.
            codes: [VC2E9LY03]

      - title: Values and comparison
        id: vic-eng-9-3-3
        points:
          - title: Explicit values in language
            id: eng-explicit-values-language
            brief: Writers state their beliefs and attitudes outright through judging words, strong claims and direct calls for action.
            codes: [VC2E9LY05]
          - title: Organising ideas in paragraphs
            id: eng-organising-ideas-paragraphs
            brief: Each paragraph develops one idea from a topic sentence, and the order of paragraphs builds an argument or story towards its point.
            codes: [VC2E9LY06]
          - title: Comparing texts
            id: eng-comparing-texts-vic
            brief: Comparing two texts means finding what they share and how they differ in ideas, purpose and techniques, then explaining why.
            codes: [VC2E9LY07]

      - title: Arguing a point of view
        id: vic-eng-9-3-4
        points:
          - title: Contention and supporting arguments
            id: eng-contention-supporting-arguments
            brief: A contention is the main point a writer argues, and each supporting argument gives a reason with evidence for it.
            codes: [VC2E9LY08]
          - title: Rebuttal
            id: eng-rebuttal
            brief: A rebuttal states an opposing argument and shows why it is weak, which makes the writer's own case stronger.
            codes: [VC2E9LY08]
          - title: Editing paragraphs for control
            id: eng-editing-paragraphs-control
            brief: Editing checks that each paragraph has one clear focus, sentences are varied and correct, and the vocabulary is precise.
            codes: [VC2E9LY09]
