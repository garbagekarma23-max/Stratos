# Victorian Curriculum Mathematics, Level 8 (Year 8): number, algebra, measurement, space, statistics and probability, 39 points.
# Follows the Victorian Curriculum F-10 Version 2.0: Mathematics, Level 8, checked on the VCAA's Version 2.0 website
# (f10.vcaa.vic.edu.au) in November 2026. VC2.0 Mathematics was published in July 2023, schools began using it from
# 2024, and it is fully in place in government schools from 2025. It replaced Mathematics in the Victorian Curriculum
# F-10 Version 1.0 (taught from 2017). No newer version is announced; the Version 1.0 website closes on 31 December 2026.
# VC2.0 sets Mathematics by single levels (7, 8, 9, 10 and 10A), in six strands. The strands are paired into three
# units here (Number and algebra, Measurement and space, Statistics and probability), and each chapter is one strand
# or part of one. Content descriptions on running investigations, simulations, modelling cycles, testing algorithms
# and 3D coordinates with software are covered only as the ideas behind them. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths).

id: vic-mat-8
subject: Mathematics
bank: mat
name: Mathematics, Year 8
about: Victorian Curriculum 2.0, Level 8
short: Mathematics
years: [8]
place: vic
kind: maths
syllabus: "Victorian Curriculum F-10 Version 2.0: Mathematics, Level 8"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [index laws, percentage change, linear graphs, Pythagoras, circles, Venn diagram]

units:
  - title: Number and algebra
    chapters:
      - title: Real numbers and index laws
        id: vic-mat-8-1-1
        points:
          - title: Rational and irrational numbers
            id: mat-rational-irrational-numbers-vic
            brief: A rational number can be written as a fraction of two integers. An irrational number, such as pi or √2, cannot, and its decimal never ends or repeats.
            codes: [VC2M8N01]
          - title: Index laws for multiplying and dividing
            id: mat-index-laws-multiplying-dividing-vic
            brief: With the same base, add the indices to multiply and subtract them to divide, such as 2⁵ × 2³ = 2⁸ and 2⁵ ÷ 2³ = 2².
            codes: [VC2M8N02]
          - title: Power of a power and the zero index
            id: mat-power-power-zero-index-vic
            brief: Raising a power to a power multiplies the indices, such as (3²)⁴ = 3⁸, and any non-zero number to the power 0 equals 1.
            codes: [VC2M8N02]
          - title: Terminating and recurring decimals
            id: mat-terminating-recurring-decimals-vic
            brief: Divide the numerator by the denominator to turn a fraction into a decimal that either ends or repeats, and write repeating digits with a dot or bar.
            codes: [VC2M8N03]
          - title: Multiplying and dividing integers
            id: mat-multiplying-dividing-integers-vic
            brief: Two numbers with the same sign give a positive answer, and different signs give a negative one, such as -4 × -3 = 12.
            codes: [VC2M8N04]

      - title: Percentages and money
        id: vic-mat-8-1-2
        points:
          - title: Percentage increase and decrease
            id: mat-percentage-increase-decrease-2-vic
            brief: Multiply by a single factor, such as 1.15 for a 15% increase or 0.8 for a 20% discount.
            codes: [VC2M8N05]
          - title: Finding a percentage change
            id: mat-finding-percentage-change
            brief: Divide the change by the original amount and multiply by 100, such as a rise from $40 to $50 being a 25% increase.
            codes: [VC2M8N05]
          - title: Percentage error
            id: mat-percentage-error-2
            brief: The difference between an estimate and the true value, as a percentage of the true value.
            codes: [VC2M8N05]
          - title: Profit and loss
            id: mat-profit-loss
            brief: Profit is selling price minus cost price, a loss when negative, and it can be written as a percentage of the cost price.
            codes: [VC2M8N06]

      - title: Linear expressions and equations
        id: vic-mat-8-1-3
        points:
          - title: Simplifying with like terms
            id: mat-simplifying-with-like-terms
            brief: Like terms have the same variables to the same powers, so 5x + 3y - 2x simplifies to 3x + 3y.
            codes: [VC2M8A01]
          - title: Expanding brackets
            id: mat-expanding-brackets-vic
            brief: Multiply each term inside by the term outside, taking care with negatives, such as -2(x - 4) = -2x + 8.
            codes: [VC2M8A01]
          - title: Factorising with a common factor
            id: mat-factorising-with-common-factor-vic
            brief: Take out the highest common factor of every term and put the rest in brackets, such as 6x + 9 = 3(2x + 3).
            codes: [VC2M8A01]
          - title: Equations with brackets and unknowns on both sides
            id: mat-equations-with-brackets-unknowns
            brief: Expand any brackets, collect the unknowns on one side and the numbers on the other, then solve and check by substituting.
            codes: [VC2M8A02]

      - title: Linear relations
        id: vic-mat-8-1-4
        points:
          - title: Graphing straight lines from a table
            id: mat-graphing-straight-lines-from
            brief: Make a table of values from a rule such as y = 3x - 2, plot the points and join them with a straight line.
            codes: [VC2M8A02, VC2M8A05]
          - title: Solving equations with a graph
            id: mat-solving-equations-with-graph
            brief: Read the x value where a line reaches a given y value, or where two lines cross, to solve an equation.
            codes: [VC2M8A02]
          - title: Inequality signs and number lines
            id: mat-inequality-signs-number-lines
            brief: What <, >, ≤ and ≥ mean, and showing a solution such as x > 3 on a number line with an open or closed circle.
            codes: [VC2M8A02]
          - title: Linear models with a fixed cost
            id: mat-linear-models-with-fixed
            brief: A cost made of a fixed charge plus a rate, such as C = 20 + 5h, and using the rule or its graph to find costs and the break-even point.
            codes: [VC2M8A03]

  - title: Measurement and space
    chapters:
      - title: Perimeter, area and volume
        id: vic-mat-8-2-1
        points:
          - title: Composite shapes
            id: mat-composite-shapes
            brief: Find the area of an irregular shape by splitting it into rectangles and triangles, or by subtracting a cut-out part, and find its perimeter by adding the outside edges.
            codes: [VC2M8M01]
          - title: Volume and capacity
            id: mat-volume-capacity-2-vic
            brief: Capacity is how much a container holds. 1 cm³ holds 1 mL and 1 m³ holds 1000 L, so a prism's volume gives its capacity.
            codes: [VC2M8M02]
          - title: Circumference of a circle
            id: mat-circumference-circle-vic
            brief: The circumference is pi times the diameter, or 2 times pi times the radius.
            codes: [VC2M8M03]
          - title: Area of a circle
            id: mat-area-circle-vic
            brief: The area is pi times the radius squared, so halve the diameter first, and give the answer in square units.
            codes: [VC2M8M03]

      - title: Time, rates and Pythagoras
        id: vic-mat-8-2-2
        points:
          - title: Time zones and 24-hour time
            id: mat-time-zones-24-hour
            brief: Converting between 12-hour and 24-hour time, working out durations, and adding or subtracting hours across time zones.
            codes: [VC2M8M04]
          - title: Rates and unit rates
            id: mat-rates-unit-rates-vic
            brief: A rate compares quantities with different units, such as 120 km in 2 hours. A unit rate gives the amount for one unit, 60 km/h.
            codes: [VC2M8M05]
          - title: Speed, distance and time
            id: mat-speed-distance-time-2
            brief: Speed is distance divided by time, so distance is speed times time and time is distance divided by speed, with matching units.
            codes: [VC2M8M07]
          - title: Pythagoras' theorem for the hypotenuse
            id: mat-pythagoras-theorem-hypotenuse-vic
            brief: In a right-angled triangle, the square of the longest side equals the sum of the squares of the other two, so c = √(a² + b²).
            codes: [VC2M8M06]
          - title: Finding a shorter side with Pythagoras
            id: mat-finding-shorter-side-with
            brief: To find a shorter side, subtract the square of the known short side from the square of the hypotenuse, then take the square root.
            codes: [VC2M8M06]

      - title: Congruence and similarity
        id: vic-mat-8-2-3
        points:
          - title: Congruent figures
            id: mat-congruent-figures
            brief: Congruent figures are the same shape and size, so matching sides and angles are equal, even if one is flipped or turned.
            codes: [VC2M8SP01]
          - title: Tests for congruent triangles
            id: mat-tests-congruent-triangles-vic
            brief: Two triangles are congruent if they match by SSS, SAS, AAS or RHS. Two sides and a non-included angle is not enough.
            codes: [VC2M8SP01, VC2M8SP04]
          - title: Similar figures and scale factor
            id: mat-similar-figures-scale-factor-vic
            brief: Similar figures have equal angles and sides in the same ratio. The scale factor is a new length divided by the matching old length.
            codes: [VC2M8SP01]
          - title: Proving properties of quadrilaterals
            id: mat-proving-properties-quadrilaterals-vic
            brief: Drawing a diagonal makes congruent triangles, which show facts such as a parallelogram's opposite sides being equal and its diagonals bisecting each other.
            codes: [VC2M8SP02]
          - title: Three-dimensional coordinates
            id: mat-three-dimensional-coordinates
            brief: A point in space is given by (x, y, z), adding a third axis for height to the usual x and y.
            codes: [VC2M8SP03]

  - title: Statistics and probability
    chapters:
      - title: Samples and populations
        id: vic-mat-8-3-1
        points:
          - title: Population and sample
            id: mat-population-sample
            brief: The population is the whole group being studied. A sample is part of it, used when asking everyone is too costly or slow.
            codes: [VC2M8ST01]
          - title: Census, survey, experiment and observation
            id: mat-census-survey-experiment-observation
            brief: The ways to collect data, from a census of everyone to a sample survey, a controlled experiment or watching and recording.
            codes: [VC2M8ST01, VC2M8ST04]
          - title: Random and biased samples
            id: mat-random-biased-samples
            brief: In a random sample every member has an equal chance of being picked. A sample of volunteers or friends can be biased.
            codes: [VC2M8ST02]
          - title: Sample size and variation
            id: mat-sample-size-variation-vic
            brief: Different random samples from the same population give different results, and larger samples vary less from each other.
            codes: [VC2M8ST03]

      - title: Combined events
        id: vic-mat-8-3-2
        points:
          - title: Complementary events
            id: mat-complementary-events-2-vic
            brief: An event and its complement cover every outcome, so their probabilities add to 1 and P(not A) = 1 - P(A).
            codes: [VC2M8P01]
          - title: Two-way tables for two events
            id: mat-two-way-tables-two
            brief: A two-way table sorts outcomes by two features at once, and the counts give probabilities such as P(boy and plays sport).
            codes: [VC2M8P02]
          - title: Venn diagrams and probability
            id: mat-venn-diagrams-probability
            brief: Overlapping circles show "A and B" in the overlap and "A or B" as everything in either circle, which gives their probabilities.
            codes: [VC2M8P02]
          - title: Tree diagrams for two steps
            id: mat-tree-diagrams-two-steps
            brief: A tree diagram lists every outcome of two events, such as tossing a coin twice, so each combined outcome's probability can be counted.
            codes: [VC2M8P02, VC2M8P03]
