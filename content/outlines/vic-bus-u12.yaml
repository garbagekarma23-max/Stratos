# VCE Business Management, Units 1 and 2: planning and establishing a business, 43 points.
# Drafted from the VCAA's VCE Business Management Study Design, accreditation period 2023 to 2027. The structure follows
# the study design: each unit is a unit here, and each area of study is a chapter. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Many of these ideas are in NSW Business Studies (the bus bank), so the matcher should find reuses and adapts. Laws
# and bodies named here are Australian, which both states share.
# In transition: the accreditation ends 31 December 2027. Check for a new study design before running this for 2028.

id: vic-bus-u12
subject: Business Management
bank: bus
name: Business Management, Units 1 and 2
about: VCE, Planning and establishing a business
short: Business Management
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Business Management Study Design (2023 to 2027), Units 1 and 2
note: Follows the VCE Business Management study design. Not made or endorsed by the VCAA.
chips: [entrepreneur, external environment, sole trader, target market, induction]

units:
  - title: "Unit 1: Planning a business"
    chapters:
      - title: The business idea
        id: vic-bus-u12-1-1
        points:
          - title: Sources of business ideas
            id: bus-sources-business-ideas
            brief: Ideas come from spotting a gap in the market, a problem to solve, a hobby, new technology, or improving what others already sell.
          - title: Creativity and innovation
            id: bus-creativity-innovation
            brief: Creativity is coming up with new ideas. Innovation is turning one into a product, service or process that people use.
          - title: Entrepreneurs and intrapreneurs
            id: bus-entrepreneurs-intrapreneurs
            brief: An entrepreneur starts a business and takes on its risk. An intrapreneur brings new ideas to the business they work for.
          - title: Traits of an entrepreneur
            id: bus-traits-entrepreneur
            brief: Entrepreneurs often show willingness to take risks, persistence, creativity, a vision and the drive to act on it.
          - title: Market research for a new idea
            id: bus-market-research-new-idea
            brief: Primary research, such as surveys, and secondary research, such as industry reports, test whether customers want an idea before money is spent.
          - title: The business plan
            id: bus-business-plan
            brief: A business plan sets out the idea, goals, market, competitors, marketing, staffing and finances, and is often needed to borrow money.
          - title: Why businesses matter to the economy
            id: bus-businesses-matter-economy
            brief: Businesses provide jobs, goods and services, tax revenue and innovation, and small businesses make up most Australian businesses.

      - title: The external environment
        id: vic-bus-u12-1-2
        points:
          - title: The external environment
            id: bus-external-environment-2
            brief: Factors outside a business that it cannot control but must respond to, divided into the macro environment and the operating environment.
          - title: The operating environment
            id: bus-operating-environment
            brief: The parts of the external environment a business deals with directly and can influence, such as customers, suppliers and competitors.
          - title: The macro environment
            id: bus-macro-environment
            brief: Wider forces a business cannot influence, including economic, political, legal, social, technological and global factors.
          - title: Economic conditions
            id: bus-economic-conditions
            brief: Interest rates, inflation, unemployment and the business cycle change how much customers spend and how much it costs to borrow.
          - title: Legal and political factors
            id: bus-legal-political-factors
            brief: Laws and government decisions, such as consumer law, taxes and grants, limit what a business can do and can create chances.
          - title: Social and technological change
            id: bus-social-technological-change
            brief: Shifting values, such as care for the environment, and new technology change what customers want and how businesses work.
          - title: Global factors
            id: bus-global-factors
            brief: Overseas competitors, suppliers and markets bring both chances, such as cheaper inputs and new customers, and threats.

      - title: The internal environment and culture
        id: vic-bus-u12-1-3
        points:
          - title: The internal environment
            id: bus-internal-environment-2
            brief: Factors inside a business that it can control, such as its structure, staff, resources, culture, policies and procedures.
          - title: Business models
            id: bus-business-models
            brief: How a business is set up to make money, such as a bricks-and-mortar shop, an online store, a franchise or a mix of these.
          - title: Business objectives
            id: bus-business-objectives
            brief: Goals a business sets, such as making a profit, growing market share, meeting shareholder expectations, or meeting a social need.
          - title: Corporate culture
            id: bus-corporate-culture-2
            brief: The shared values, beliefs and ways of doing things in a business. Official culture is what it says; real culture is what staff actually do.
          - title: Policies and procedures
            id: bus-policies-procedures
            brief: A policy is a rule or guide for decisions, such as on bullying. A procedure sets the steps to follow to carry it out.

  - title: "Unit 2: Establishing a business"
    chapters:
      - title: Legal and financial requirements
        id: vic-bus-u12-2-1
        points:
          - title: Legal business structures
            id: bus-legal-business-structures
            brief: A sole trader is owned and run by one person, a partnership by two to 20, and a company is a separate legal entity owned by shareholders.
          - title: Unlimited and limited liability
            id: bus-unlimited-limited-liability
            brief: Sole traders and partners have unlimited liability, so their own assets can be taken to pay business debts. Shareholders' liability is limited to what they invested.
          - title: Registering a business
            id: bus-registering-business
            brief: A new business needs an ABN, a registered business name, GST registration once turnover passes the limit, and any licences its activity needs.
          - title: Taxation for a business
            id: bus-taxation-business
            brief: Businesses pay income tax or company tax, collect GST, withhold PAYG from wages and may pay payroll tax and fringe benefits tax.
          - title: Keeping financial records
            id: bus-keeping-financial-records
            brief: Accurate records of receipts, payments, invoices and payroll are needed for tax, for decisions and to show the business's health.
          - title: Sources of finance
            id: bus-sources-finance
            brief: A new business can be funded with the owner's savings, loans, leasing, investors or crowdfunding, each with its own cost and control.
          - title: Financial statements
            id: bus-financial-statements
            brief: A profit and loss statement shows revenue less expenses, a balance sheet shows assets, liabilities and owner's equity, and a cash flow statement shows money in and out.
          - title: Consumer protection laws
            id: bus-consumer-protection-laws
            brief: Australian Consumer Law bans misleading conduct and sets guarantees on goods and services. The ACCC enforces it.

      - title: Marketing a business
        id: vic-bus-u12-2-2
        points:
          - title: Target market
            id: bus-target-market
            brief: The group of customers a business aims its products at, described by traits such as age, income, location and interests.
          - title: The marketing mix
            id: bus-marketing-mix-2
            brief: The 7 Ps are product, price, place, promotion, people, process and physical evidence, the parts a business combines to reach its market.
          - title: Branding
            id: bus-branding
            brief: A brand is the name, logo and image that set a business apart. Strong branding builds recognition and loyalty.
          - title: Product positioning
            id: bus-product-positioning
            brief: How a business wants customers to see its product against competitors, such as cheapest, highest quality or most convenient.
          - title: Pricing methods
            id: bus-pricing-methods-2
            brief: Methods include cost-plus pricing, penetration pricing to win customers, skimming at launch, and pricing to match competitors.
          - title: Promotion and social media
            id: bus-promotion-social-media
            brief: Advertising, sales promotions, public relations and social media tell customers about a product. Social media allows cheap, targeted, two-way contact.
          - title: Customer relationships
            id: bus-customer-relationships
            brief: Keeping customers through service, loyalty programs and handling complaints well costs less than finding new ones.
          - title: Public relations
            id: bus-public-relations
            brief: Managing how the public sees a business through media releases, sponsorships, events and community work.

      - title: Staffing a business
        id: vic-bus-u12-2-3
        points:
          - title: Staffing needs
            id: bus-staffing-needs
            brief: A business works out how many staff it needs, with what skills, and whether as full-time, part-time, casual or contract workers.
          - title: Recruitment
            id: bus-recruitment-2
            brief: Finding suitable applicants, internally from current staff or externally through ads, agencies and online job boards.
          - title: Selection
            id: bus-selection
            brief: Choosing the best applicant through application forms, interviews, testing and reference checks.
          - title: Induction
            id: bus-induction
            brief: Introducing a new employee to the business, their job, the people, workplace safety and the culture, so they settle in faster.
          - title: Training
            id: bus-training
            brief: On-the-job training happens while working, such as shadowing. Off-the-job training happens away from work, such as courses.
          - title: Employment arrangements
            id: bus-employment-arrangements
            brief: Pay and conditions are set by the National Employment Standards, modern awards, enterprise agreements and individual contracts.
          - title: Employer and employee rights
            id: bus-employer-employee-rights
            brief: Employers must provide a safe workplace and fair pay. Employees must follow reasonable instructions and work safely.
          - title: The Fair Work Commission
            id: bus-fair-work-commission
            brief: The national workplace relations body sets award wages, approves enterprise agreements and helps resolve disputes.
