# VCE Business Management, Units 1 and 2: planning and establishing a business, 63 points.
# Checked against the VCAA's VCE Business Management Study Design, accredited from 2023, in October 2026. Each unit is
# a unit here, and each area of study is a chapter, or two when it is large. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Many of these ideas are in NSW Business Studies (the bus bank), so the matcher should find reuses and adapts. Laws
# and bodies named here are Australian, which both states share.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-bus-u12
subject: Business Management
bank: bus
name: Business Management, Units 1 and 2
about: VCE, Planning and establishing a business
short: Business Management
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Business Management Study Design (from 2023), Units 1 and 2
note: Follows the VCE Business Management study design. Not made or endorsed by the VCAA.
chips: [entrepreneur, external environment, sole trader, target market, induction]

units:
  - title: "Unit 1: Planning a business"
    chapters:
      - title: Entrepreneurs and opportunities
        id: vic-bus-u12-1-1
        points:
          - title: Entrepreneurs and intrapreneurs
            id: bus-entrepreneurs-intrapreneurs
            brief: Entrepreneurship is spotting an opportunity and taking on the risk to act on it. An intrapreneur does the same inside an existing business.
          - title: Why people start a business
            id: bus-people-start-business
            brief: People start businesses for independence, to make a profit, or to meet a need in the market or the community.
          - title: Traits of successful entrepreneurs and managers
            id: bus-traits-entrepreneur
            brief: Risk-taking, persistence, creativity, vision, planning and people skills help entrepreneurs and managers succeed.
          - title: Sources of business opportunity
            id: bus-sources-business-ideas
            brief: Opportunities come from innovation, gaps in the market, changing customer needs, research and development, new technology and global markets.
          - title: Creativity and innovation
            id: bus-creativity-innovation
            brief: Creativity is coming up with new ideas. Innovation is turning one into a product, service or process that people use.

      - title: From idea to concept
        id: vic-bus-u12-1-2-2
        points:
          - title: Goal setting and decision-making
            id: bus-goal-setting-decision-making
            brief: Clear goals give a new business direction, and good decisions weigh options against those goals.
          - title: Developing the business concept
            id: bus-developing-business-concept
            brief: "Turning an opportunity into a clear concept: what is sold, to whom, and why customers would choose it."
          - title: Market research and feasibility
            id: bus-market-research-new-idea
            brief: Primary and secondary research, and a first feasibility study, test whether customers want the idea and whether it can make money before much is spent.
          - title: Why businesses matter
            id: bus-businesses-matter-economy
            brief: Businesses provide jobs, goods and services, tax revenue and new ideas, adding to a nation's economic and social wellbeing.
          - title: Encouraging innovation in a nation
            id: bus-encouraging-innovation-nation
            brief: Governments and communities encourage new businesses with research funding, council grants, school programs in entrepreneurship and regional start-up hubs.

      - title: Structures, models and resources
        id: vic-bus-u12-1-3
        points:
          - title: The internal environment
            id: bus-internal-environment-2
            brief: Factors inside a business that it can control, such as its structure, staff and resources. They interact with the external environment around it.
          - title: Types of business
            id: bus-legal-business-structures
            brief: Sole traders, partnerships, private limited companies, public listed companies, social enterprises and government business enterprises suit different owners and aims.
          - title: Unlimited and limited liability
            id: bus-unlimited-limited-liability
            brief: Sole traders and partners have unlimited liability, so their own assets can be taken to pay business debts. Shareholders' liability is limited to what they invested.
          - title: Business models
            id: bus-business-models
            brief: "How a business reaches customers and makes money: online, direct-to-consumer, bricks-and-mortar, franchise, importer or exporter."
          - title: Buying a business or starting one
            id: bus-buying-business-or-starting
            brief: Buying an existing business brings customers, staff and records at once but may carry old problems. Starting new costs less but takes longer to build.
          - title: Business resources
            id: bus-business-resources
            brief: A business needs natural, labour and capital resources. Cost, availability and quality decide which it uses.
          - title: Choosing a location
            id: bus-choosing-location-2
            brief: Where a business sets up depends on customers, costs, competitors, suppliers, staff and access, or whether it needs a physical site at all.

      - title: Planning and finance
        id: vic-bus-u12-1-4
        points:
          - title: Sources of finance
            id: bus-sources-finance
            brief: A new business can be funded with the owner's savings, loans, leasing, investors or crowdfunding. Cost, control and the business's size decide which to use.
          - title: Business support services
            id: bus-business-support-services
            brief: Lawyers, accountants, technology help, community groups, networks and mentors help a new owner avoid costly mistakes.
          - title: SWOT analysis
            id: bus-swot-analysis-2
            brief: A planning tool listing internal strengths and weaknesses and external opportunities and threats, to test a decision.
          - title: The business plan
            id: bus-business-plan
            brief: A business plan sets out the idea, goals, market, competitors, marketing, staffing and finances. It guides the owner and is often needed to borrow money.

      - title: The macro environment
        id: vic-bus-u12-1-2
        points:
          - title: The external environment
            id: bus-external-environment-2
            brief: Factors outside a business that it cannot control but must plan for, split into the macro environment and the operating environment.
          - title: The macro environment
            id: bus-macro-environment
            brief: Wider forces a business cannot influence, including economic, political, legal, social, technological and global factors.
          - title: Legal and political factors
            id: bus-legal-political-factors
            brief: Laws and government rules on registration, tax, safety and consumer rights shape what a new business must do.
          - title: Societal attitudes
            id: bus-social-technological-change
            brief: Shifting values, beliefs and trends, such as care for the environment or healthy eating, change what customers want.
          - title: Economic conditions
            id: bus-economic-conditions
            brief: Interest rates, employment, tax rates and consumer confidence change how much customers spend and how much it costs to borrow.
          - title: Technological change
            id: bus-technological-change
            brief: New technology changes markets and how businesses work, so planners ask how the market may look in a few years.
          - title: Global factors
            id: bus-global-factors
            brief: Overseas competitors and markets, offshoring, exchange rates, protecting ideas with patents, copyright and trademarks, and online sales all affect planning.

      - title: The operating environment
        id: vic-bus-u12-1-6
        points:
          - title: The operating environment
            id: bus-operating-environment
            brief: The parts of the external environment a business deals with directly and can influence, such as customers, suppliers and competitors.
          - title: Customers
            id: bus-customers
            brief: A business plans around what its customers need and expect, and how those needs are changing.
          - title: Competitors
            id: bus-competitors
            brief: What competitors charge, sell and do next shapes a new business's plans.
          - title: Suppliers and the supply chain
            id: bus-suppliers-supply-chain
            brief: Where resources come from and how they reach the business affects cost, reliability and reputation.
          - title: Special interest groups
            id: bus-special-interest-groups
            brief: Environmental groups, business associations and unions can push a business to act in certain ways.
          - title: Social responsibility in planning
            id: bus-social-responsibility-planning
            brief: Planning for environmentally sound and socially responsible production, beyond what the law requires.

  - title: "Unit 2: Establishing a business"
    chapters:
      - title: Legal requirements
        id: vic-bus-u12-2-1
        points:
          - title: Registering a business
            id: bus-registering-business
            brief: A new business needs an ABN, a registered business name, often a website domain, GST registration once turnover passes the limit, and any licences its activity needs.
          - title: Consumer protection laws
            id: bus-consumer-protection-laws
            brief: Australian Consumer Law bans misleading conduct and sets guarantees on goods and services. The ACCC enforces it.
          - title: Tax compliance
            id: bus-taxation-business
            brief: Businesses must lodge returns and pay income or company tax, collect GST and withhold tax from wages, on time.
          - title: WorkSafe insurance
            id: bus-worksafe-insurance
            brief: Employers in Victoria must hold WorkSafe insurance, which covers staff injured at work.
          - title: External professionals
            id: bus-external-professionals
            brief: Accountants, lawyers and other advisers help an owner meet legal duties and set the business up well.

      - title: Setting up systems
        id: vic-bus-u12-2-2-2
        points:
          - title: Bank accounts and record keeping
            id: bus-keeping-financial-records
            brief: A separate business bank account, financial controls and accurate records of sales, payments and wages are needed for tax and for decisions.
          - title: Choosing suppliers
            id: bus-choosing-suppliers
            brief: A business weighs price, quality and reliability, and whether a supplier meets its social and environmental standards.
          - title: Policies and procedures
            id: bus-policies-procedures
            brief: A policy is a rule or guide for decisions, such as on bullying. A procedure sets the steps. Both help a business obey the law and set routines.
          - title: Technology and global issues in setting up
            id: bus-technology-global-issues-setting
            brief: Building a customer database and dealing with overseas suppliers and retailers bring choices about data, cost and risk.

      - title: Building a customer base
        id: vic-bus-u12-2-2
        points:
          - title: Marketing and business objectives
            id: bus-marketing-business-objectives
            brief: Marketing builds a customer base, which in turn helps a business meet objectives such as sales, profit and market share.
          - title: Market research practices
            id: bus-market-research-practices
            brief: Collecting data through surveys, interviews and observation, then analysing it, tells a business what customers want.
          - title: Target market
            id: bus-target-market
            brief: The group a business aims at, described by market size, segments such as age and location, and trends in what customers do.
          - title: Branding
            id: bus-branding
            brief: A brand is the name, logo and image that set a business apart. Its identity is shaped by inside and outside factors, and builds recognition and loyalty.
          - title: The marketing mix
            id: bus-marketing-mix-2
            brief: The 7 Ps are product, price, place, promotion, people, process and physical evidence, the parts a business combines to reach its market.
          - title: The product life cycle
            id: bus-product-life-cycle
            brief: Products go through introduction, growth, maturity and decline, or an extension. The best marketing changes at each stage.

      - title: Customer relations and public relations
        id: vic-bus-u12-2-4
        points:
          - title: Customer relationships
            id: bus-customer-relationships
            brief: Keeping customers through service, loyalty programs and handling complaints well costs less than finding new ones.
          - title: Technology in marketing
            id: bus-promotion-social-media
            brief: Social media, email marketing, search engine optimisation, artificial intelligence and data analytics let a business reach and learn about customers cheaply.
          - title: Public relations
            id: bus-public-relations
            brief: Managing how the public sees a business. Planned PR builds goodwill; crisis PR limits damage when something goes wrong.
          - title: Social responsibility in marketing
            id: bus-social-responsibility-marketing
            brief: Green marketing and protecting customers' private data show a business acting responsibly toward its customers.

      - title: Staffing a business
        id: vic-bus-u12-2-3
        points:
          - title: Staff and business objectives
            id: bus-staff-business-objectives
            brief: Staff who perform well help a business meet its objectives, so hiring the right people matters.
          - title: Staffing needs
            id: bus-staffing-needs
            brief: A business works out the knowledge, skills and ideas it needs from staff, and how technology changes those needs.
          - title: Job analysis
            id: bus-job-analysis
            brief: Studying a job leads to its design, a job description of the duties and a job specification of the skills needed.
          - title: Recruitment
            id: bus-recruitment-2
            brief: Finding applicants inside the business, through the intranet or word of mouth, or outside, through websites, agencies and social media. Each has pros and cons.
          - title: Selection
            id: bus-selection
            brief: Choosing the best applicant through interviews, psychological tests, work tests and online selection, each with pros and cons.
          - title: Induction
            id: bus-induction
            brief: Introducing a new employee to the business, their job, the people, workplace safety and the culture, so they settle in faster.

      - title: Employment rules and expectations
        id: vic-bus-u12-2-6
        points:
          - title: The National Employment Standards
            id: bus-employment-arrangements
            brief: Minimum conditions every employee in the national system gets, such as maximum hours, leave and notice of termination.
          - title: Employer and employee expectations
            id: bus-employer-employee-rights
            brief: Employers expect a contract, loyalty and fair notice. Employees expect fair pay and conditions, job security and work-life balance.
          - title: Legal obligations for staffing
            id: bus-legal-obligations-staffing
            brief: Workplace health and safety laws and equal employment opportunity laws set duties for every employer.
          - title: Social responsibility in staffing
            id: bus-social-responsibility-staffing
            brief: Treating staff fairly, including those recruited from overseas, goes beyond what the law requires.
