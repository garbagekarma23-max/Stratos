# Australian Curriculum English, Year 7: the Language, Literature and Literacy strands, 37 points.
# Follows ACARA's Australian Curriculum: English, Version 9.0, Year 7, checked on the official site
# (australiancurriculum.edu.au) in November 2026. Ministers approved Version 9.0 in April 2022 and ACARA published it in
# May 2022. Each state sets its own start: the ACT from 2024, Tasmania from 2023, the NT and WA (its own Western
# Australian Curriculum, adapted from it) from 2025, Queensland by the end of 2026, and South Australia's public schools
# (their own adapted version) by about 2027. ACARA has announced no new version for Years 7 to 10: the next full
# version is scheduled for approval in 2032.
# Each strand is a unit. Each chapter holds one sub-strand, or two or three small ones together, in the curriculum's
# order. The codes are ACARA's content description codes.
# Schools choose their own texts, so no point names a set text or quotes one. Pure practice (giving a talk, publishing
# a piece) is taught as the ideas behind it. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-eng-7
subject: English
bank: eng
name: English, Year 7
about: Australian Curriculum, Year 7
short: English
years: [7]
place: [qld, sa, wa, tas, act, nt]
kind: english
syllabus: "Australian Curriculum: English, Version 9.0, Year 7"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [complex sentence, colon, simile, plot structure, inference, prefix]

units:
  - title: Language
    chapters:
      - title: Language for interacting with others, and text structure
        id: ac-eng-7-1-1
        points:
          - title: Language and identity
            id: eng-language-identity-ac
            codes: [AC9E7LA01]
            brief: The words we use, such as slang, local sayings and idioms, show who we are and which groups we belong to.
          - title: Evaluative language
            id: eng-evaluative-language
            codes: [AC9E7LA02]
            brief: Words that judge a text or show a feeling about it, such as gripping, clumsy or moving, and how a fair judgement is backed up with details from the text.
          - title: Text structure follows purpose
            id: eng-text-structure-follows-purpose
            codes: [AC9E7LA03]
            brief: Texts are built to suit their purpose. A review moves from what the text is about to a judgement, and a persuasive text states a position, gives reasons, then sums up.
          - title: Introductions, topic sentences and conclusions
            id: eng-introductions-topic-sentences-conclusions
            codes: [AC9E7LA04]
            brief: An overview or introduction tells readers what is coming, a topic sentence opens each paragraph with its main idea, and a conclusion draws the ideas together.
          - title: Text connectives
            id: eng-text-connectives
            codes: [AC9E7LA04]
            brief: Words and phrases such as firstly, however, as a result and finally link ideas and show readers how one part of a text leads to the next.

      - title: Sentences and punctuation
        id: ac-eng-7-1-2
        points:
          - title: Simple, compound and complex sentences
            id: eng-simple-compound-complex-sentences
            codes: [AC9E7LA05]
            brief: A simple sentence has one main clause, a compound sentence joins two main clauses with words like and or but, and a complex sentence adds a dependent clause starting with words like because or when.
          - title: Compound-complex sentences
            id: eng-compound-complex-sentences
            codes: [AC9E7LA05]
            brief: A compound-complex sentence has at least two main clauses and one dependent clause, which lets a writer add a reason or condition and extend an idea in one sentence.
          - title: Keeping verb tense consistent
            id: eng-keeping-verb-tense-consistent
            codes: [AC9E7LA06]
            brief: Writers keep verbs in the same tense unless the time really changes, so a story told in the past tense does not slip into the present by mistake.
          - title: Using colons
            id: eng-using-colons
            codes: [AC9E7LA09]
            brief: A colon comes after a complete clause to introduce a list, an example or an explanation of what came before.
          - title: Using brackets
            id: eng-using-brackets
            codes: [AC9E7LA09]
            brief: Brackets hold extra information, such as a date or a short explanation, that the sentence still makes sense without.

      - title: Images and vocabulary
        id: ac-eng-7-1-3
        points:
          - title: Vectors in images
            id: eng-vectors-images
            codes: [AC9E7LA07]
            brief: Vectors are lines in an image, such as a pointing arm, a road or a gaze, that lead the viewer's eye to what the creator wants noticed.
          - title: Camera angles
            id: eng-camera-angles
            codes: [AC9E7LA07]
            brief: A high angle looks down and can make a subject seem small or weak, a low angle looks up and can make it seem powerful, and eye level feels equal.
          - title: Social distance in images
            id: eng-social-distance-images
            codes: [AC9E7LA07]
            brief: How close a subject appears changes how we relate to it. A close-up feels personal, a mid shot feels social and a long shot keeps the viewer at a distance.
          - title: Technical and everyday meanings
            id: eng-technical-everyday-meanings
            codes: [AC9E7LA08]
            brief: Each subject has its own technical words, and some everyday words, such as cell, volume or table, take on a special meaning in a subject.

  - title: Literature
    chapters:
      - title: Literature and contexts, and responding to literature
        id: ac-eng-7-2-1
        points:
          - title: Ideas, issues and points of view
            id: eng-ideas-issues-points-view
            codes: [AC9E7LE01]
            brief: Literary texts explore ideas and issues, such as friendship or fairness, through characters and events, and each text tells its story from a point of view.
          - title: Literature from different contexts
            id: eng-literature-from-different-contexts
            codes: [AC9E7LE01]
            brief: Readers meet stories, poems and plays from many times and places, including works by First Nations Australian authors, and the context a text comes from shapes what it shows.
          - title: Forming and justifying an opinion
            id: eng-forming-justifying-opinion
            codes: [AC9E7LE02]
            brief: A response to a character, setting or event states an opinion and backs it with reasons and details from the text, even when others see it differently.
          - title: How dialogue builds character
            id: eng-dialogue-builds-character
            codes: [AC9E7LE03]
            brief: What characters say, and how they say it, shows their personality and feelings and can make readers like, pity or distrust them.
          - title: Words for talking about texts
            id: eng-words-talking-about-texts
            codes: [AC9E7LE04]
            brief: Metalanguage is the set of terms used to discuss texts, such as narrator, setting, imagery and theme, which make a response clear and precise.

      - title: Examining and creating literature
        id: ac-eng-7-2-2
        points:
          - title: Character, setting and events together
            id: eng-character-setting-events-together
            codes: [AC9E7LE05]
            brief: In a narrative, characters, the setting and the events work together, so a stormy setting or a sudden event can reveal what a character is like.
          - title: Narrative structure
            id: eng-narrative-structure-2
            codes: [AC9E7LE05]
            brief: Many narratives move from an orientation to a complication, rising action, a climax and a resolution.
          - title: Simile, metaphor and personification
            id: eng-simile-metaphor-personification
            codes: [AC9E7LE06]
            brief: A simile compares using like or as, a metaphor says one thing is another, and personification gives human qualities to something that is not human.
          - title: Sound devices in poetry
            id: eng-sound-devices-poetry
            codes: [AC9E7LE06]
            brief: Poets use alliteration, assonance, onomatopoeia, rhyme and rhythm to create sound effects that add meaning and mood.
          - title: Imagery and layers of meaning
            id: eng-imagery-layers-meaning
            codes: [AC9E7LE06]
            brief: Imagery appeals to the senses to help readers picture a scene, and a single image can hold more than one meaning at once.
          - title: Show, don't tell
            id: eng-show-don-t-tell
            codes: [AC9E7LE07]
            brief: In their own stories, writers show a feeling through actions, details and dialogue rather than naming it outright.

  - title: Literacy
    chapters:
      - title: Texts in context and interacting with others
        id: ac-eng-7-3-1
        points:
          - title: How technology changes reading
            id: eng-technology-changes-reading
            codes: [AC9E7LY01]
            brief: Digital texts use links, scrolling, video and comments, which change how people read, create and respond to texts such as news and social media.
          - title: Discussion skills
            id: eng-discussion-skills
            codes: [AC9E7LY02]
            brief: Good discussion means listening, building on others' ideas, asking questions and disagreeing politely with reasons.
          - title: Using your voice in a presentation
            id: eng-using-your-voice-presentation
            codes: [AC9E7LY07]
            brief: Speakers vary volume, tone, pitch and pace to hold attention and make their meaning clear.

      - title: Analysing, interpreting and evaluating
        id: ac-eng-7-3-2
        points:
          - title: Language features suit audience and purpose
            id: eng-language-features-suit-audience
            codes: [AC9E7LY03]
            brief: Writers choose words and features to suit who they are writing for and why, so a text for children reads differently from a report for adults.
          - title: Ways to organise ideas
            id: eng-ways-organise-ideas
            codes: [AC9E7LY04]
            brief: Texts can arrange ideas in time order, as causes and effects, or as groups and sub-groups, called a taxonomy.
          - title: Making inferences
            id: eng-making-inferences
            codes: [AC9E7LY05]
            brief: An inference is a conclusion drawn from clues in a text, such as a character's actions, when the writer does not say it directly.
          - title: Summarising
            id: eng-summarising
            codes: [AC9E7LY05]
            brief: A summary gives the main ideas of a text briefly in your own words and leaves out minor details and examples.
          - title: Predicting and questioning while reading
            id: eng-predicting-questioning-while-reading
            codes: [AC9E7LY05]
            brief: Good readers predict what will come next, ask questions as they read and check whether they still understand.

      - title: Creating texts and word knowledge
        id: ac-eng-7-3-3
        points:
          - title: Text purposes
            id: eng-text-purposes
            codes: [AC9E7LY06]
            brief: Texts can be imaginative, reflective, informative, persuasive or analytical, and the purpose shapes the structure and language a writer chooses.
          - title: Planning, drafting and editing
            id: eng-planning-drafting-editing
            codes: [AC9E7LY06]
            brief: Writers plan their ideas, write a draft, then edit for meaning, structure, spelling and punctuation before publishing.
          - title: Greek and Latin roots
            id: eng-greek-latin-roots
            codes: [AC9E7LY08]
            brief: Many English words are built from Greek and Latin roots, such as bio for life and port for carry, which help readers spell and work out new words.
          - title: Prefixes, suffixes and base words
            id: eng-prefixes-suffixes-base-words
            codes: [AC9E7LY08]
            brief: A prefix goes before a base word and a suffix after it, changing its meaning or word class, as in unhappy and happiness.
