# NSW English Advanced, Year 11: the three Year 11 focus areas, 41 points.
# Drafted from NESA's English Advanced 11-12 Syllabus (2024), taught in Year 11 from 2026. The structure follows the
# syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# No points on a particular set text yet: schools pick their own texts from NESA's list.

id: nsw-eng-adv-11
subject: English
bank: eng
name: English Advanced, Year 11
about: HSC, Reading to write, narratives and literature
short: English Advanced
years: [11]
place: nsw
kind: english
syllabus: NSW English Advanced 11-12 Syllabus (2024), Year 11 focus areas
note: Follows the NSW English Advanced syllabus. Not made or endorsed by NESA.
chips: [imagery, narrative voice, context, thesis, archetype]

units:
  - title: Reading to write
    chapters:
      - title: Reading closely
        id: nsw-eng-adv-11-1-1
        points:
          - title: Imagery
            id: eng-imagery
            brief: Language that appeals to the senses so a reader can see, hear, smell, taste or feel a scene. Teach how a writer uses it to place the reader inside an experience.
          - title: Metaphor and simile
            id: eng-metaphor-simile
            brief: A simile compares two things using like or as. A metaphor says one thing is another. Both carry ideas from one thing to another, and an extended metaphor runs through a passage.
          - title: Personification and symbolism
            id: eng-personification-symbolism
            brief: Personification gives human qualities to something that is not human. A symbol is an object, colour or image that stands for a larger idea, and gains meaning each time it returns.
          - title: Sound devices
            id: eng-sound-devices
            brief: Alliteration repeats first consonant sounds, assonance repeats vowel sounds, and onomatopoeia imitates a sound. Teach that sound changes pace and mood, not just how a line sounds.
          - title: Tone and mood
            id: eng-tone-mood
            brief: Tone is the writer's attitude, shown through word choice. Mood is the feeling the text creates in the reader. Students should name a tone precisely, such as wry, bitter or tender.
          - title: Sentence structure and syntax
            id: eng-sentence-structure-syntax
            brief: Short sentences can create tension or emphasis. Long, layered sentences can slow the reader or build momentum. Fragments, lists and inverted word order each shape how an idea lands.

      - title: Language, purpose and audience
        id: nsw-eng-adv-11-1-2
        points:
          - title: Purpose, audience and context
            id: eng-purpose-audience-context
            brief: Every text is shaped by why it was written, who it is for, and when and where it was made. These three questions explain most of a writer's choices.
          - title: Imaginative, persuasive and informative texts
            id: eng-imaginative-persuasive-informative-texts
            brief: Imaginative texts tell stories or create worlds, persuasive texts argue for a view, and informative texts explain. Many texts blend purposes, such as a feature article that informs and persuades.
          - title: Discursive writing
            id: eng-discursive-writing
            brief: A discursive text explores an idea from several angles without needing to win an argument. It is reflective, often personal, and can end on a question rather than a firm conclusion.
          - title: Register and diction
            id: eng-register-diction
            brief: Register is how formal or informal the language is. Diction is the particular choice of words. Both signal the writer's relationship with the reader.
          - title: Point of view and voice
            id: eng-point-view-voice
            brief: First, second and third person each give a different closeness to events. Voice is the distinct personality a reader hears in the writing, built from diction, rhythm and attitude.

      - title: Writing from models
        id: nsw-eng-adv-11-1-3
        points:
          - title: Learning from a mentor text
            id: eng-learning-from-mentor-text
            brief: Reading a short published piece closely to borrow one technique for your own writing, such as its opening move, its structure or its use of a recurring image.
          - title: Showing through detail
            id: eng-showing-through-detail
            brief: Specific, concrete details let readers infer a feeling instead of being told it. A clenched jaw shows anger more strongly than the word angry.
          - title: Openings and endings
            id: eng-openings-endings
            brief: An opening hooks the reader and sets up voice and expectation. An ending can resolve, circle back to the opening, or leave a deliberate question. Both are planned, not left to chance.
          - title: Drafting and editing
            id: eng-drafting-editing
            brief: Drafting gets ideas down. Revising changes structure and meaning. Editing fixes sentences and words. Strong writers cut words that add nothing.

  - title: Narratives that shape our world
    chapters:
      - title: How narratives work
        id: nsw-eng-adv-11-2-1
        points:
          - title: Narrative structure
            id: eng-narrative-structure
            brief: Many stories move through an orientation, a complication, rising tension, a climax and a resolution. Writers bend this shape with flashbacks, frame stories or endings that stay open.
          - title: Characterisation
            id: eng-characterisation
            brief: Writers build characters through what they say, do and think, how others react to them, and direct description. A dynamic character changes over the story; a static one does not.
          - title: Setting and atmosphere
            id: eng-setting-atmosphere
            brief: Setting is the time and place of a story. It can mirror a character's state, create atmosphere, or act almost like a character itself.
          - title: Narrators and reliability
            id: eng-narrators-reliability
            brief: A narrator can be inside or outside the story, all-knowing or limited. An unreliable narrator gives an account the reader learns not to trust, which invites closer reading.
          - title: Archetypes and story patterns
            id: eng-archetypes-story-patterns
            brief: Recurring characters and plots, such as the hero's journey, the trickster or the fall from grace, appear across cultures. Writers use them to meet or overturn a reader's expectations.

      - title: Narratives, values and culture
        id: nsw-eng-adv-11-2-2
        points:
          - title: Narratives across cultures and time
            id: eng-narratives-across-cultures-time
            brief: Societies have always told stories to pass on knowledge, values and identity, from oral myths and fables to novels and films. Narratives carry the beliefs of the culture that tells them.
          - title: Narratives in many forms
            id: eng-narratives-many-forms
            brief: A story can be told in prose, poetry, film, graphic novels, podcasts, games and social media. Each form has its own tools, such as camera angles in film or panels in a graphic novel.
          - title: How narratives shape values
            id: eng-narratives-shape-values
            brief: Stories reward some behaviours and punish others, and invite readers to admire or judge characters. Over time this shapes what a community sees as normal or right.
          - title: Retelling and reimagining stories
            id: eng-retelling-reimagining-stories
            brief: Writers retell older stories to question them, update them for a new audience or give a voice to a character who was silent. Comparing versions shows what each one values.
          - title: Counter-narratives
            id: eng-counter-narratives
            brief: A counter-narrative tells a story from a perspective the dominant story left out, challenging who is seen as the hero and whose experience counts.

      - title: Responding to narratives
        id: nsw-eng-adv-11-2-3
        points:
          - title: Comparing two narratives
            id: eng-comparing-two-narratives
            brief: Putting two stories side by side to see how their forms, contexts and values differ. A good comparison explains why the differences matter, not only what they are.
          - title: Analysing a narrative technique
            id: eng-analysing-narrative-technique
            brief: Naming a technique, giving a brief example in your own words or a short quote, and explaining its effect on the reader and its link to the text's ideas.
          - title: Writing your own narrative
            id: eng-writing-your-own-narrative
            brief: Using what was learned from studying narratives to write one, choosing a narrator, a structure and a central image that carry a clear idea.

  - title: Critical study of literature
    chapters:
      - title: Studying a whole text
        id: nsw-eng-adv-11-3-1
        points:
          - title: Form and genre conventions
            id: eng-form-genre-conventions
            brief: Form is the kind of text (novel, play, poem, film). Genre is a type of story with expected features, such as gothic or dystopian. Writers follow and break these conventions to make meaning.
          - title: Context of composition
            id: eng-context-composition
            brief: The historical, social and personal circumstances in which a text was written. Context helps explain a text's concerns, but the text is more than a record of its time.
          - title: Context of reception
            id: eng-context-reception
            brief: Readers in different times and places bring their own values to a text, so the same text can be read differently in 1900 and today. This is why interpretations shift.
          - title: Structure across a whole text
            id: eng-structure-across-whole-text
            brief: How a text is ordered as a whole, through chapters, acts, stanzas or scenes, and how that order builds tension, contrast or a final effect.
          - title: Motifs and recurring images
            id: eng-motifs-recurring-images
            brief: A motif is an image, phrase or idea that returns through a text. Tracing it shows how the text develops its ideas from start to finish.

      - title: Interpreting literature
        id: nsw-eng-adv-11-3-2
        points:
          - title: Readings and interpretations
            id: eng-readings-interpretations
            brief: An interpretation is an argued view of what a text means. More than one reading can be valid, but each must be supported by close evidence from the text.
          - title: Supporting a reading with evidence
            id: eng-supporting-reading-with-evidence
            brief: Choosing short, precise quotations or references, and explaining how each one supports the argument. Evidence without analysis does not prove anything.
          - title: Why some texts endure
            id: eng-some-texts-endure
            brief: Texts that are studied for generations often explore lasting human questions, use language with unusual skill, and reward rereading. Students can argue what makes a text worth studying.

      - title: The analytical essay
        id: nsw-eng-adv-11-3-3
        points:
          - title: Writing a thesis
            id: eng-writing-thesis
            brief: A thesis is a clear, arguable answer to the question in one or two sentences. It names an idea about the text, not just a topic, and the whole essay sets out to prove it.
          - title: Topic sentences
            id: eng-topic-sentences
            brief: Each body paragraph opens with a sentence that states one step of the argument and links back to the thesis and the question.
          - title: Embedding evidence
            id: eng-embedding-evidence
            brief: Weaving short quotations into your own sentences so they read smoothly, instead of dropping in long quotes on their own.
          - title: Technique, example and effect
            id: eng-technique-example-effect
            brief: A basic analytical move. Name the technique, give the example, then explain its effect and how it supports the argument. The effect is where most marks are earned.
          - title: Conclusions
            id: eng-conclusions
            brief: A conclusion restates the thesis in fresh words, draws the argument together and may show why it matters. It adds no new evidence.
