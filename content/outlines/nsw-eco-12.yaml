# NSW Economics, Year 12: HSC Topics 2 to 4, 67 points. Topic 1, The Global Economy, is the app's existing
# Economics course (content.js).
# Drafted from NESA's Economics Stage 6 Syllabus (2009), the syllabus taught in Year 12 until the 2027 HSC. The structure
# follows the syllabus: each topic is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points marked reuse share a point (and each student's progress on it) with the Economics bank (econ-points.js).
# also_match [e] has the matcher look for the same idea in that bank for every other point.
# In transition: the Economics 11-12 Syllabus (2025) replaces this one for Year 12 from Term 4 2027 (first HSC 2028).

id: nsw-eco-12
subject: Economics
bank: eco
name: "Economics, Year 12: Australia's economy"
about: HSC, Australia's place, economic issues and policies
short: Economics
years: [12]
place: nsw
kind: standard
syllabus: NSW Economics Stage 6 Syllabus (2009), HSC (Year 12) course, Topics 2 to 4
note: Follows the NSW Economics syllabus. Not made or endorsed by NESA.
chips: [terms of trade, current account, cash rate, Gini coefficient, microeconomic reform]
also_match: [e]

units:
  - title: Australia's place in the global economy
    chapters:
      - title: Australia's trade and financial flows
        id: nsw-eco-12-1-1
        points:
          - title: What Australia exports and imports
            id: eco-australia-exports-imports
            brief: Australia's exports are led by resources such as iron ore, coal and gas, plus education, tourism and farm goods. It imports mostly manufactured goods and fuel.
          - title: Australia's trading partners
            id: eco-australia-s-trading-partners
            brief: Australia's trade has shifted from Britain and Europe towards Asia. China is its largest trading partner, followed by Japan, South Korea and the United States.
          - title: The terms of trade
            id: eco-terms-trade
            brief: The terms of trade compare export prices with import prices. When commodity prices rise, Australia's terms of trade improve and national income rises.
          - title: Foreign investment in Australia
            id: eco-foreign-investment-australia
            brief: Foreign direct investment buys a lasting stake in Australian businesses. Portfolio investment buys shares and bonds. Both fund investment that domestic saving cannot.

      - title: The balance of payments
        id: nsw-eco-12-1-2
        points:
          - title: The balance of payments
            id: eco-balance-payments
            reuse: e-bop
          - title: The capital and financial account
            id: eco-capital-financial-account
            brief: Records flows of investment and lending into and out of Australia. A current account deficit is matched by a surplus here.
          - title: Why Australia runs current account deficits
            id: eco-australia-runs-current-account
            brief: Australia has long invested more than it saves, borrowing the difference from abroad, and pays large income flows to foreign investors.
          - title: Foreign debt and foreign equity
            id: eco-foreign-debt-foreign-equity
            brief: Borrowing from abroad builds net foreign debt, and selling assets to foreigners builds foreign equity. Together they make net foreign liabilities.
          - title: Sustainability of the current account
            id: eco-sustainability-current-account
            brief: A deficit is less of a worry if it funds productive investment and export growth. The debt servicing ratio shows how much export income goes to paying interest.

      - title: Exchange rates
        id: nsw-eco-12-1-3
        points:
          - title: How the Australian dollar is set
            id: eco-australian-dollar-set
            brief: The Australian dollar floats, so its value is set by supply and demand in the foreign exchange market.
          - title: What moves the Australian dollar
            id: eco-moves-australian-dollar
            brief: Commodity prices, interest rate differences with other countries, investor confidence and speculation all move the dollar.
          - title: Appreciation and depreciation
            id: eco-appreciation-depreciation
            brief: A rising dollar makes imports cheaper and exports dearer. A falling dollar helps exporters but raises import prices and inflation.
          - title: The trade-weighted index
            id: eco-trade-weighted-index
            brief: The TWI measures the Australian dollar against a basket of trading partners' currencies, weighted by how much trade we do with each.
          - title: Floating and fixed exchange rates
            id: eco-floating-fixed-exchange-rates
            brief: Australia floated its dollar in 1983. A floating rate adjusts on its own and cushions shocks, while a fixed rate needs the central bank to defend it.

      - title: Trade policy and globalisation in Australia
        id: nsw-eco-12-1-4
        points:
          - title: Trade liberalisation in Australia
            id: eco-trade-liberalisation-australia
            brief: Since the 1980s Australia has cut tariffs sharply, exposing industries to competition and shifting resources to more efficient uses.
          - title: Australia's free trade agreements
            id: eco-australia-s-free-trade
            brief: Australia has trade agreements with partners such as China, Japan, Korea and the United States, and regional ones such as RCEP and the CPTPP.
          - title: Effects of globalisation on Australia
            id: eco-effects-globalisation-australia
            brief: Globalisation has brought cheaper imports, foreign investment and access to markets, along with job losses in some industries and exposure to global shocks.
          - title: The resources boom
            id: eco-resources-boom
            brief: Rising demand from China in the 2000s lifted commodity prices and mining investment, raising national income and the dollar but squeezing other export industries.

  - title: Economic issues
    chapters:
      - title: Economic growth
        id: nsw-eco-12-2-1
        points:
          - title: Measuring economic growth
            id: eco-measuring-economic-growth
            reuse: e-gdp
          - title: Aggregate demand
            id: eco-aggregate-demand
            reuse: e-ad
          - title: The multiplier
            id: eco-multiplier
            reuse: e-multiplier
          - title: Aggregate supply and productivity
            id: eco-aggregate-supply-productivity
            brief: Growth over the long term depends on more and better inputs, especially productivity, the output per hour of work.
          - title: The business cycle
            id: eco-business-cycle
            brief: Real GDP rises and falls around its long-term trend through upswings, booms, downswings and recessions.
          - title: Benefits of growth
            id: eco-benefits-growth
            reuse: e-growthgain
          - title: Costs of growth
            id: eco-costs-growth
            reuse: e-growthcost

      - title: Unemployment
        id: nsw-eco-12-2-2
        points:
          - title: Measuring unemployment in Australia
            id: eco-measuring-unemployment-australia
            brief: The ABS Labour Force Survey counts someone as unemployed if they had no paid work in the survey week, looked for work and could start.
          - title: Causes and effects of unemployment
            id: eco-causes-effects-unemployment
            reuse: e-unemployment
          - title: The natural rate of unemployment
            id: eco-natural-rate-unemployment
            brief: The rate below which unemployment cannot fall without inflation rising, made of frictional, seasonal and structural unemployment. Estimates for Australia change over time.
          - title: Hidden and long-term unemployment
            id: eco-hidden-long-term-unemployment
            brief: Hidden unemployment is people who want work but have stopped looking. Long-term unemployment means being out of work for a year or more, which erodes skills.
          - title: Underemployment
            id: eco-underemployment
            brief: People who have work but want more hours. Australia's underemployment rate is often close to or above its unemployment rate.

      - title: Inflation
        id: nsw-eco-12-2-3
        points:
          - title: Measuring inflation
            id: eco-measuring-inflation
            reuse: e-cpi
          - title: Causes and effects of inflation
            id: eco-causes-effects-inflation
            reuse: e-inflation
          - title: Headline and underlying inflation
            id: eco-headline-underlying-inflation
            brief: Headline inflation is the change in the whole CPI. Underlying measures, such as the trimmed mean, remove the biggest price swings to show the trend.
          - title: Inflationary expectations
            id: eco-inflationary-expectations
            brief: If people expect prices to rise, they ask for higher wages and firms raise prices, so expectations can make inflation keep going.

      - title: External stability
        id: nsw-eco-12-2-4
        points:
          - title: What external stability means
            id: eco-external-stability-means
            brief: An economy is externally stable when its current account deficit and foreign liabilities can be sustained and its currency is not prone to sharp swings.
          - title: Vulnerability to the terms of trade
            id: eco-vulnerability-terms-trade
            brief: Australia's dependence on commodity exports makes national income, the dollar and government revenue rise and fall with world commodity prices.
          - title: Credit ratings and foreign confidence
            id: eco-credit-ratings-foreign-confidence
            brief: Agencies rate how likely a government is to repay its debt. A lower rating can raise borrowing costs and weaken the dollar.

      - title: Distribution of income and wealth
        id: nsw-eco-12-2-5
        points:
          - title: Sources of income and wealth
            id: eco-sources-income-wealth
            brief: Income comes from wages, profits, interest, rent and welfare. Wealth is assets, such as housing, shares and superannuation, less debts.
          - title: The Lorenz curve and Gini coefficient
            id: eco-lorenz-curve-gini-coefficient
            brief: The Lorenz curve plots the share of income held by each share of households. The Gini coefficient runs from 0 (equal) to 1 (one person holds everything).
          - title: Inequality in Australia
            id: eco-inequality-australia
            brief: Wealth is much less evenly spread than income in Australia, and differences exist by age, gender, location and for First Nations Australians.
          - title: Costs and benefits of inequality
            id: eco-costs-benefits-inequality
            brief: Some inequality rewards effort and risk. Large gaps can harm health, social cohesion and growth, and waste the skills of people left behind.

      - title: Environmental sustainability
        id: nsw-eco-12-2-6
        points:
          - title: Ecologically sustainable development
            id: eco-ecologically-sustainable-development
            brief: Growth that meets today's needs without harming the ability of future generations to meet theirs.
          - title: The environment as a market failure
            id: eco-environment-as-market-failure
            brief: Pollution is an external cost markets ignore, and clean air and a stable climate are public goods, so markets overuse the environment.
          - title: Climate change and the economy
            id: eco-climate-change-economy
            brief: Rising emissions bring higher temperatures, more extreme weather and costs to farming, health and infrastructure.
          - title: Environmental policies in Australia
            id: eco-environmental-policies-australia
            brief: Australia uses regulation, emissions limits on large emitters, support for renewable energy and market-based tools to cut emissions.

  - title: Economic policies and management
    chapters:
      - title: The objectives of policy
        id: nsw-eco-12-3-1
        points:
          - title: Macroeconomic objectives
            id: eco-macroeconomic-objectives
            reuse: e-objectives
          - title: Conflicts between objectives and policies
            id: eco-conflicts-between-objectives-policies
            reuse: e-conflicts
          - title: Macroeconomic and microeconomic policy
            id: eco-macroeconomic-microeconomic-policy
            brief: Macroeconomic policy, fiscal and monetary, manages demand in the short run. Microeconomic policy lifts the economy's capacity over the long run.

      - title: Fiscal policy
        id: nsw-eco-12-3-2
        points:
          - title: Fiscal policy
            id: eco-fiscal-policy
            reuse: e-fiscal
          - title: Budget outcomes
            id: eco-budget-outcomes
            brief: A budget is in deficit when spending exceeds revenue and in surplus when revenue exceeds spending. The change in the outcome shows whether policy is expansionary or contractionary.
          - title: Automatic stabilisers
            id: eco-automatic-stabilisers
            brief: In a downturn, tax revenue falls and welfare spending rises on their own, cushioning the economy without any new decision.
          - title: Structural and cyclical budget parts
            id: eco-structural-cyclical-budget-parts
            brief: The cyclical part of the budget moves with the business cycle. The structural part reflects the government's policy choices.
          - title: Government debt
            id: eco-government-debt
            brief: Deficits are funded by selling government bonds, which builds public debt. Interest on the debt is a cost to future budgets.

      - title: Monetary policy
        id: nsw-eco-12-3-3
        points:
          - title: The RBA and the cash rate
            id: eco-rba-cash-rate
            brief: The RBA's Monetary Policy Board sets a target for the cash rate, the interest rate banks pay each other on overnight loans, and steers it through its market operations.
          - title: The inflation target
            id: eco-inflation-target
            brief: The RBA aims to keep inflation between 2 and 3% on average, alongside full employment.
          - title: How monetary policy works
            id: eco-monetary-policy-works
            brief: A change in the cash rate flows through to loan and deposit rates, the dollar and asset prices, changing spending and inflation over one to two years.
          - title: Unconventional monetary policy
            id: eco-unconventional-monetary-policy
            brief: When the cash rate was near zero in 2020 and 2021, the RBA bought government bonds and gave banks cheap funding to keep interest rates low.
          - title: Limits of monetary policy
            id: eco-limits-monetary-policy
            brief: Monetary policy works with long and uneven time lags, cannot target one region or industry, and can be weakened by global events.

      - title: Microeconomic policy
        id: nsw-eco-12-3-4
        points:
          - title: Microeconomic reform
            id: eco-microeconomic-reform
            brief: Policies that make industries and markets more efficient and productive, lifting the economy's long-term capacity.
          - title: Competition policy
            id: eco-competition-policy
            brief: Laws enforced by the ACCC stop firms from fixing prices or abusing market power, keeping markets competitive.
          - title: Labour market reform
            id: eco-labour-market-reform
            brief: Changes to how wages and conditions are set, such as the move to enterprise bargaining, aim to make the labour market more flexible and productive.
          - title: Tax reform
            id: eco-tax-reform
            brief: Changing the tax system to make it simpler, fairer or better for growth, as when the GST replaced older sales taxes in 2000.
          - title: Costs of microeconomic reform
            id: eco-costs-microeconomic-reform
            brief: Reform can cost jobs in protected industries, widen inequality and take years to pay off, so it can be hard to win support for.

      - title: Limits of economic policy
        id: nsw-eco-12-3-5
        points:
          - title: Time lags in policy
            id: eco-time-lags-policy
            brief: Recognising a problem, deciding on a policy and seeing its effects all take time, so policy can arrive too late or too strongly.
          - title: Global influences on policy
            id: eco-global-influences-policy
            brief: In a small open economy like Australia, world events and other countries' policies can outweigh domestic policy.
          - title: Political constraints
            id: eco-political-constraints
            brief: Governments may avoid unpopular choices, such as cutting spending, especially near an election.
          - title: The policy mix
            id: eco-policy-mix
            brief: Fiscal, monetary and microeconomic policies work best when they pull the same way and suit the problem the economy faces.
