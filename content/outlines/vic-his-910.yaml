# Victorian Curriculum 2.0 History, Levels 9 and 10: the overview, all five investigations and the historical skills, 61 points.
# Follows the VCAA's Victorian Curriculum F-10 Version 2.0, History (published June 2024), checked on the VCAA's F-10
# site (f10.vcaa.vic.edu.au) in November 2026. VC2.0 sets History in two-level bands from Levels 3 to 10, so this is
# one outline for Levels 9 and 10. VC2.0 replaced Version 1.0 (taught from 2017): optional from 2025, and taught in
# full in Victorian government schools from 2026 (Catholic and independent schools set their own timelines). No newer
# version is announced.
# Structure: each Historical Knowledge and Understanding sub-strand is a unit (the Overview and the five
# Investigations), and the Historical Concepts and Skills strand is the last unit. Students study the Overview and at
# least four Investigations, choosing Australia (1750 to 1914), The globalising world (1945 to present) or both, so
# both are here and a school can skip the one it does not teach.
# Options picked where schools choose: Asia (1750 to present) covers China and Japan (India, Indonesia and Vietnam can
# be added); The globalising world covers Migration experiences and the Environment movement (Popular culture,
# Political crisis, and Regional and global conflict can be added).
# The overview is taught in breadth, not depth, so it has fewer points. Codes are VC2.0 content description codes.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-his-910
subject: History
bank: his
name: History, Levels 9 and 10
about: Victorian Curriculum 2.0, Levels 9 and 10
short: History
years: [9, 10]
level: Levels 9 and 10
place: vic
kind: standard
syllabus: "Victorian Curriculum F-10 Version 2.0: History, Levels 9 and 10"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [Industrial Revolution, Gallipoli, Holocaust, 1967 referendum, Federation, migration]

units:
  - title: Overview of the modern world
    chapters:
      - title: The making of the modern world, 1750 to 1918
        id: vic-his-910-1-1
        points:
          - title: Causes of the Industrial Revolution
            id: his-causes-industrial-revolution
            brief: Industry took off in Britain from about 1750 because it had coal and iron, money to invest, colonies for markets and inventions such as the improved steam engine.
            codes: [VC2HH10K01]
          - title: Effects of the Industrial Revolution
            id: his-effects-industrial-revolution
            brief: Factories drew people into crowded cities with long hours, child labour and disease, which led to new laws on working conditions and to trade unions.
            codes: [VC2HH10K01]
          - title: The movement of peoples
            id: his-movement-peoples
            brief: Between 1750 and 1900 millions moved across the world, some by choice as free settlers and others by force as enslaved Africans or transported convicts.
            codes: [VC2HH10K01]
          - title: European imperialism
            id: his-european-imperialism
            brief: European powers took colonies across Asia, Africa and the Pacific for raw materials, markets and prestige, often by force and at great cost to local peoples.
            codes: [VC2HH10K01]
          - title: New political ideas
            id: his-new-political-ideas
            brief: Ideas of individual rights, democracy, nationalism and socialism spread after the American and French revolutions and changed how people thought they should be governed.
            codes: [VC2HH10K02]

      - title: The world since 1945
        id: vic-his-910-1-2
        points:
          - title: The United Nations
            id: his-united-nations-vic
            brief: The United Nations was founded in 1945, after World War II, to keep peace between countries and promote human rights and cooperation.
            codes: [VC2HH10K03]
          - title: The Cold War
            id: his-cold-war-vic
            brief: From 1945 to 1991 the United States and the Soviet Union competed for power through an arms race, a space race and wars fought by others, without fighting each other directly.
            codes: [VC2HH10K03]
          - title: Decolonisation
            id: his-decolonisation
            brief: After 1945 most colonies in Asia and Africa won independence, some through negotiation and others through long wars, as with India in 1947 and Indonesia in 1949.
            codes: [VC2HH10K04]
          - title: Movements for rights since 1945
            id: his-movements-rights-since-1945
            brief: Civil rights, Indigenous rights, women's rights, LGBTQI+ rights and environmental movements used protest, courts and elections to change laws and attitudes.
            codes: [VC2HH10K04, VC2HH10K06]
          - title: The women's movement in Australia
            id: his-women-s-movement-australia-vic
            brief: Australian women won the federal vote in 1902, equal pay rulings in 1969 and 1972, and the Sex Discrimination Act in 1984, changing their role in work and public life.
            codes: [VC2HH10K05]

  - title: Australia, 1750 to 1914
    chapters:
      - title: Colonies to a nation
        id: vic-his-910-2-1
        points:
          - title: Aboriginal and Torres Strait Islander societies in 1788
            id: his-aboriginal-torres-strait-islander-vic
            brief: In 1788 hundreds of Aboriginal and Torres Strait Islander nations, with their own languages, laws and ways of caring for Country, lived across the continent and islands.
            codes: [VC2HH10K07]
          - title: Why Britain set up colonies
            id: his-britain-set-up-colonies
            brief: Britain sent the First Fleet in 1788 to ease crowded prisons after losing its American colonies, and to gain a base in the Pacific, claiming land that was already owned.
            codes: [VC2HH10K08]
          - title: Frontier conflict and resistance
            id: his-frontier-conflict-resistance-vic
            brief: As settlers spread across Country, Aboriginal Peoples resisted in conflicts now called the Frontier Wars, such as the Eumeralla Wars on Gunditjmara Country in western Victoria.
            codes: [VC2HH10K10, VC2HH10K12]
          - title: The gold rushes
            id: his-gold-rushes-vic
            brief: Gold found in Victoria in 1851 brought hundreds of thousands of migrants, including from China, and miners' anger over licences led to the Eureka Stockade in 1854.
            codes: [VC2HH10K09, VC2HH10K10]
          - title: Federation
            id: his-federation-vic
            brief: On 1 January 1901 the six colonies joined to form the Commonwealth of Australia, and one of the new parliament's first laws was the Immigration Restriction Act behind the White Australia policy.
            codes: [VC2HH10K09, VC2HH10K11]
          - title: Australia as a social laboratory
            id: his-australia-as-social-laboratory
            brief: Early Australia tried new ideas such as the secret ballot, votes for women, a basic wage set in the Harvester case of 1907 and the age pension, though Aboriginal people were mostly left out.
            codes: [VC2HH10K11, VC2HH10K12]

  - title: Australians at war, 1914 to 1945
    chapters:
      - title: World War I
        id: vic-his-910-3-1
        points:
          - title: Causes of World War I
            id: his-causes-world-war-i
            brief: Militarism, alliances, imperial rivalry and nationalism set the stage, and the killing of Archduke Franz Ferdinand in 1914 set off the war.
            codes: [VC2HH10K13]
          - title: Why Australians enlisted
            id: his-australians-enlisted-vic
            brief: Australians joined up out of loyalty to Britain, adventure, pay and pressure from family and friends, and some Aboriginal men enlisted despite rules meant to keep them out.
            codes: [VC2HH10K14]
          - title: Gallipoli
            id: his-gallipoli-vic
            brief: Australian and New Zealand troops landed at Gallipoli on 25 April 1915 in a failed campaign against the Ottoman Empire and left in December after heavy losses.
            codes: [VC2HH10K15, VC2HH10K17]
          - title: The Western Front
            id: his-western-front-vic
            brief: On the Western Front in France and Belgium, Australians fought trench battles such as Fromelles and Pozières in 1916, where machine guns and artillery caused huge losses.
            codes: [VC2HH10K15, VC2HH10K16, VC2HH10K18]
          - title: The home front and conscription
            id: his-home-front-conscription
            brief: The war divided Australians at home, and two referendums in 1916 and 1917 on forcing men to serve overseas were both defeated.
            codes: [VC2HH10K19]
          - title: The Anzac legend
            id: his-anzac-legend-vic
            brief: The Anzac legend praises courage and mateship, and historians debate how well it fits what soldiers lived through and whose stories it leaves out.
            codes: [VC2HH10K23]

      - title: World War II
        id: vic-his-910-3-2
        points:
          - title: Causes of World War II
            id: his-causes-world-war-ii
            brief: The harsh Treaty of Versailles, the Great Depression and the expansion of Nazi Germany, Italy and Japan led to war in Europe in 1939 and the Pacific in 1941.
            codes: [VC2HH10K13]
          - title: Australians in the Pacific war
            id: his-australians-pacific-war
            brief: After Singapore fell in 1942, thousands of Australians became prisoners of war, and Australian troops fought back the Japanese advance on the Kokoda Track.
            codes: [VC2HH10K15, VC2HH10K16, VC2HH10K17]
          - title: The home front in World War II
            id: his-home-front-world-war
            brief: Darwin was bombed in 1942, goods were rationed, women took on jobs men had done, and some people of enemy background were interned.
            codes: [VC2HH10K19]
          - title: How warfare changed
            id: his-warfare-changed
            brief: Between the wars, fighting moved from trenches to tanks, aircraft and aircraft carriers, whole societies were turned to the war effort, and atomic bombs ended World War II.
            codes: [VC2HH10K18]

      - title: The Holocaust
        id: vic-his-910-3-3
        points:
          - title: Causes of the Holocaust
            id: his-causes-holocaust
            brief: Long-held antisemitism, Nazi race ideas and laws such as the Nuremberg Laws of 1935 stripped Jewish people of their rights in Germany step by step.
            codes: [VC2HH10K20]
          - title: Events of the Holocaust
            id: his-events-holocaust
            brief: Persecution grew from Kristallnacht in 1938 to ghettos and then death camps such as Auschwitz, where the Nazis murdered about six million Jews and many others.
            codes: [VC2HH10K21]
          - title: Experiences and perspectives in the Holocaust
            id: his-experiences-perspectives-holocaust
            brief: Historians study the Holocaust through the victims, the perpetrators, bystanders and those who resisted or rescued, and why people acted as they did.
            codes: [VC2HH10K22]

  - title: Asia, 1750 to the present
    chapters:
      - title: China
        id: vic-his-910-4-1
        points:
          - title: Qing China and the West
            id: his-qing-china-west
            brief: In the 1700s Qing China was rich and powerful and limited European trade to the port of Canton, seeing little it needed from the West.
            codes: [VC2HH10K24]
          - title: The Opium Wars
            id: his-opium-wars
            brief: Britain won two Opium Wars from 1839 to keep selling opium in China, and the unequal treaties that followed gave away Hong Kong and opened Chinese ports.
            codes: [VC2HH10K25]
          - title: The fall of the Qing
            id: his-fall-qing
            brief: Foreign pressure and revolts weakened the Qing, and the 1911 revolution ended over 2,000 years of rule by emperors and set up a republic.
            codes: [VC2HH10K26]
          - title: Communist China
            id: his-communist-china
            brief: Mao Zedong's Communist Party won the civil war in 1949, and campaigns such as the Great Leap Forward and the Cultural Revolution caused great suffering before market reforms began in 1978.
            codes: [VC2HH10K27, VC2HH10K28]

      - title: Japan
        id: vic-his-910-4-2
        points:
          - title: The opening of Japan
            id: his-opening-japan
            brief: American warships under Commodore Perry arrived in 1853 and forced Japan to open its ports to trade, ending two centuries of near isolation.
            codes: [VC2HH10K25]
          - title: The Meiji Restoration
            id: his-meiji-restoration
            brief: From 1868 the Meiji government put the emperor back at the centre and rapidly built railways, factories, schools and a modern army on Western models.
            codes: [VC2HH10K26, VC2HH10K28]
          - title: Japan's expansion
            id: his-japan-s-expansion
            brief: Japan defeated China and then Russia, took Korea in 1910 and invaded Manchuria in 1931, building an empire that led it into World War II.
            codes: [VC2HH10K25]
          - title: Postwar Japan
            id: his-postwar-japan
            brief: After defeat in 1945 Japan was occupied by the Allies, gained a new democratic constitution that gave up war, and grew into one of the world's largest economies.
            codes: [VC2HH10K27, VC2HH10K29]

  - title: Aboriginal and Torres Strait Islander rights and freedoms
    chapters:
      - title: Control and resistance, 1788 to 1938
        id: vic-his-910-5-1
        points:
          - title: Protection laws and reserves
            id: his-protection-laws-reserves
            brief: From the mid-1800s colonial laws moved many Aboriginal people onto reserves and missions and let officials control where they lived, worked and married.
            codes: [VC2HH10K30]
          - title: Coranderrk
            id: his-coranderrk
            brief: At Coranderrk near Healesville, Wurundjeri leader William Barak and his community farmed successfully and petitioned the government to keep their land.
            codes: [VC2HH10K30]
          - title: The Day of Mourning
            id: his-day-mourning-vic
            brief: On 26 January 1938, the 150th anniversary of British arrival, Aboriginal activists including William Cooper's Australian Aborigines' League held a Day of Mourning to demand equal rights.
            codes: [VC2HH10K30, VC2HH10K31]

      - title: Campaigns for rights since 1938
        id: vic-his-910-5-2
        points:
          - title: The Freedom Ride
            id: his-freedom-ride-vic
            brief: In 1965 Charles Perkins led university students on a bus tour of country New South Wales to expose segregation at pools, cinemas and shops.
            codes: [VC2HH10K31, VC2HH10K33]
          - title: The Wave Hill walk-off
            id: his-wave-hill-walk-off-vic
            brief: In 1966 Vincent Lingiari led Gurindji workers off Wave Hill station over pay and conditions, and their strike became a fight for land that was returned in 1975.
            codes: [VC2HH10K31, VC2HH10K32]
          - title: The 1967 referendum
            id: his-1967-referendum-vic
            brief: Over 90 per cent of voters agreed to count Aboriginal people in the census and let the Commonwealth make laws for them, though it did not give the federal vote, which a 1962 law had already given.
            codes: [VC2HH10K31, VC2HH10K34, VC2HH10K35]
          - title: Land rights and the Mabo decision
            id: his-land-rights-mabo-decision
            brief: In 1992 the High Court, in a case led by Eddie Koiki Mabo of the Meriam people, rejected terra nullius and recognised native title, followed by the Native Title Act in 1993.
            codes: [VC2HH10K34]
          - title: The Stolen Generations and the Apology
            id: his-stolen-generations-apology
            brief: Aboriginal and Torres Strait Islander children were forcibly removed from their families for decades, as the 1997 Bringing Them Home report found, and the nation apologised in 2008.
            codes: [VC2HH10K32, VC2HH10K34, VC2HH10K35]

  - title: The globalising world, 1945 to the present
    chapters:
      - title: Human rights and modern life
        id: vic-his-910-6-1
        points:
          - title: The Universal Declaration of Human Rights
            id: his-universal-declaration-human-rights-vic
            brief: Adopted by the United Nations in 1948, the declaration set out rights for every person, and Australia helped draft it while H. V. Evatt led the General Assembly.
            codes: [VC2HH10K37]
          - title: Technology and living standards
            id: his-technology-living-standards
            brief: After 1945, cars, televisions, home appliances and later computers changed how people worked, shopped and spent their free time in countries like Australia.
            codes: [VC2HH10K36]
          - title: Health and longer lives
            id: his-health-longer-lives
            brief: Antibiotics, vaccines such as the polio vaccine and better public health helped people live much longer in the 20th century.
            codes: [VC2HH10K36]

      - title: Migration experiences
        id: vic-his-910-6-2
        points:
          - title: Populate or perish
            id: his-populate-or-perish-vic
            brief: After World War II Australia started a large migration program to grow its population and workforce, taking in displaced people from Europe and assisted British migrants.
            codes: [VC2HH10K38]
          - title: Life for postwar migrants
            id: his-life-postwar-migrants
            brief: Many new arrivals stayed first in camps such as Bonegilla in Victoria and worked on projects like the Snowy Mountains Scheme, often facing hard conditions and prejudice.
            codes: [VC2HH10K40]
          - title: The end of White Australia
            id: his-end-white-australia
            brief: Governments removed race from immigration rules step by step until 1973, and Australia moved towards a policy of multiculturalism.
            codes: [VC2HH10K39, VC2HH10K41]
          - title: Refugees from Vietnam
            id: his-refugees-from-vietnam-vic
            brief: After the Vietnam War ended in 1975, many Vietnamese refugees came to Australia, some by boat, and their arrival tested and changed Australian attitudes.
            codes: [VC2HH10K38, VC2HH10K40]

      - title: The environment movement
        id: vic-his-910-6-3
        points:
          - title: The rise of environmental concern
            id: his-rise-environmental-concern
            brief: Rachel Carson's book Silent Spring in 1962 warned of pesticide harm, and growing worry about pollution led to the first Earth Day in 1970 and new environment groups.
            codes: [VC2HH10K39]
          - title: Campaigns to save Tasmanian rivers
            id: his-campaigns-save-tasmanian-rivers
            brief: The flooding of Lake Pedder in 1972 spurred activists, and the Franklin Dam blockade and a 1983 High Court ruling stopped a dam on the Franklin River.
            codes: [VC2HH10K38, VC2HH10K40]
          - title: Green bans
            id: his-green-bans
            brief: In the 1970s builders' unions in Sydney refused to work on projects that would destroy bushland and historic buildings, joining workers and residents to protect places.
            codes: [VC2HH10K40]
          - title: Climate change as a global issue
            id: his-climate-change-as-global
            brief: From the 1980s scientists warned of global warming, and agreements such as the Kyoto Protocol and the Paris Agreement tried to get countries to cut emissions.
            codes: [VC2HH10K39, VC2HH10K41]

  - title: Historical concepts and skills
    chapters:
      - title: Analysing and arguing about the past
        id: vic-his-910-7-1
        points:
          - title: Evaluating sources as evidence
            id: his-evaluating-sources-as-evidence
            brief: Judging a source means asking who made it, why, when and for whom, and whether other sources back it up, before using it as evidence.
            codes: [VC2HH10S03, VC2HH10S04]
          - title: Perspectives and interpretations
            id: his-perspectives-interpretations
            brief: A perspective is how a person saw events at the time. An interpretation is a historian's later explanation, and historians can disagree about the same events.
            codes: [VC2HH10S05, VC2HH10S06]
          - title: Short-term and long-term causes
            id: his-short-term-long-term-vic
            brief: Long-term causes build up over years, short-term causes or triggers spark an event, and consequences can be intended or unintended.
            codes: [VC2HH10S08]
          - title: Judging historical significance
            id: his-judging-historical-significance-vic
            brief: Historians judge significance by how many people an event affected, how deeply, for how long and what it explains about today.
            codes: [VC2HH10S07, VC2HH10S09]
          - title: Writing a historical argument
            id: his-writing-historical-argument
            brief: A historical argument states a clear contention, supports it with evidence from sources, deals with other views and cites its sources.
            codes: [VC2HH10S01, VC2HH10S02, VC2HH10S10]
