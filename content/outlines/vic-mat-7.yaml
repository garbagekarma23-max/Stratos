# Victorian Curriculum Mathematics, Level 7 (Year 7): number, algebra, measurement, space, statistics and probability, 44 points.
# Follows the Victorian Curriculum F-10 Version 2.0: Mathematics, Level 7, checked on the VCAA's Version 2.0 website
# (f10.vcaa.vic.edu.au) in November 2026. VC2.0 Mathematics was published in July 2023, schools began using it from
# 2024, and it is fully in place in government schools from 2025. It replaced Mathematics in the Victorian Curriculum
# F-10 Version 1.0 (taught from 2017). No newer version is announced; the Version 1.0 website closes on 31 December 2026.
# VC2.0 sets Mathematics by single levels (7, 8, 9, 10 and 10A), in six strands. The strands are paired into three
# units here (Number and algebra, Measurement and space, Statistics and probability), and each chapter is one strand
# or part of one. Content descriptions on running investigations, simulations, modelling cycles and writing algorithms
# are covered only as the ideas behind them. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths).

id: vic-mat-7
subject: Mathematics
bank: mat
name: Mathematics, Year 7
about: Victorian Curriculum 2.0, Level 7
short: Mathematics
years: [7]
place: vic
kind: maths
syllabus: "Victorian Curriculum F-10 Version 2.0: Mathematics, Level 7"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [prime factors, fractions, integers, ratio, equations, mean]

units:
  - title: Number and algebra
    chapters:
      - title: Squares, roots and prime factors
        id: vic-mat-7-1-1
        points:
          - title: Square numbers and square roots
            id: mat-square-numbers-square-roots-vic
            brief: A square number is a whole number multiplied by itself, such as 7 × 7 = 49. The square root undoes squaring, so √49 = 7.
            codes: [VC2M7N01]
          - title: Expanded notation with powers of 10
            id: mat-expanded-notation-with-powers-vic
            brief: Writing a number by its place values as powers of ten, such as 4,305 = 4 × 10³ + 3 × 10² + 5.
            codes: [VC2M7N02]
          - title: Prime factorisation with indices
            id: mat-prime-factorisation-with-indices
            brief: Breaking a number into prime factors with a factor tree, then writing repeated factors with indices, such as 72 = 2³ × 3².
            codes: [VC2M7N02]

      - title: Working with fractions
        id: vic-mat-7-1-2
        points:
          - title: Fractions and decimals on a number line
            id: mat-fractions-decimals-number-line
            brief: Placing positive and negative fractions, decimals and mixed numbers on a number line, using equivalent forms to compare them.
            codes: [VC2M7N03]
          - title: Adding and subtracting fractions
            id: mat-adding-subtracting-fractions-vic
            brief: Rewrite fractions with a common denominator, then add or subtract the numerators, such as 2/3 + 1/4 = 8/12 + 3/12 = 11/12.
            codes: [VC2M7N06]
          - title: Multiplying fractions
            id: mat-multiplying-fractions
            brief: Multiply the numerators and the denominators, changing mixed numbers to improper fractions first and simplifying at the end.
            codes: [VC2M7N05]
          - title: Dividing fractions
            id: mat-dividing-fractions
            brief: To divide by a fraction, multiply by its reciprocal, such as 3/4 ÷ 1/2 = 3/4 × 2/1 = 3/2.
            codes: [VC2M7N05]

      - title: Decimals and percentages
        id: vic-mat-7-1-3
        points:
          - title: Rounding decimals and estimating
            id: mat-rounding-decimals-estimating
            brief: Rounding to a given number of decimal places, and rounding before calculating to check an answer is reasonable.
            codes: [VC2M7N04]
          - title: Multiplying and dividing decimals
            id: mat-multiplying-dividing-decimals
            brief: Multiply as whole numbers and count the decimal places. To divide by a decimal, move the point the same way in both numbers first.
            codes: [VC2M7N05]
          - title: Finding a percentage of a quantity
            id: mat-finding-percentage-quantity
            brief: Change the percentage to a decimal or fraction and multiply, such as 15% of 60 = 0.15 × 60 = 9.
            codes: [VC2M7N07]
          - title: Writing one quantity as a percentage of another
            id: mat-writing-one-quantity-as
            brief: Divide the part by the whole and multiply by 100, using the same units for both, such as 18 out of 24 is 75%.
            codes: [VC2M7N07]

      - title: Integers and ratios
        id: vic-mat-7-1-4
        points:
          - title: Adding and subtracting integers
            id: mat-adding-subtracting-integers-vic
            brief: Ordering integers on a number line, and adding and subtracting them, where subtracting a negative number is the same as adding.
            codes: [VC2M7N08]
          - title: Simplifying ratios
            id: mat-simplifying-ratios-vic
            brief: A ratio compares parts of the same kind. Divide each part by their highest common factor, such as 12:18 = 2:3.
            codes: [VC2M7N09]
          - title: Dividing a quantity in a ratio
            id: mat-dividing-quantity-ratio-vic
            brief: Add the parts to find the total number of shares, find one share, then multiply, such as $60 in the ratio 2:3 gives $24 and $36.
            codes: [VC2M7N09]
          - title: Best buys with unit prices
            id: mat-best-buys-with-unit
            brief: Compare products of different sizes by working out the price for one unit, such as cents per 100 g, and picking the lowest.
            codes: [VC2M7N10]

      - title: Algebra basics
        id: vic-mat-7-1-5
        points:
          - title: Variables and substitution
            id: mat-variables-substitution
            brief: A letter stands for a number that can change. Substitute values into a formula, such as P = 2l + 2w, to find the unknown.
            codes: [VC2M7A01]
          - title: Writing algebraic expressions
            id: mat-writing-algebraic-expressions-vic
            brief: Turning words into algebra, such as 5 more than 3 times n is 3n + 5, and the conventions that 3n means 3 × n.
            codes: [VC2M7A02]
          - title: The laws of arithmetic
            id: mat-laws-arithmetic
            brief: The commutative, associative and distributive laws let you regroup a calculation, such as 7 × 98 = 7 × 100 - 7 × 2.
            codes: [VC2M7A02]
          - title: Solving one-variable equations
            id: mat-solving-one-variable-equations
            brief: Use inverse operations to undo each step and find the unknown, such as 3x + 5 = 20 gives x = 5, then check by substituting.
            codes: [VC2M7A03]

      - title: Patterns and graphs
        id: vic-mat-7-1-6
        points:
          - title: The Cartesian plane
            id: mat-cartesian-plane-vic
            brief: Plotting points as (x, y) in all four quadrants, reading across first and then up or down.
            codes: [VC2M7A05]
          - title: Tables of values from a rule
            id: mat-tables-values-from-rule-vic
            brief: Substitute x values into a rule such as y = 2x + 1 to fill a table, then plot the pairs to see the pattern.
            codes: [VC2M7A05]
          - title: Finding the rule for a pattern
            id: mat-finding-rule-pattern
            brief: For a growing pattern, such as squares made of matchsticks, find how much it grows each step and write a rule for the nth term.
            codes: [VC2M7A05]
          - title: Reading graphs of real data
            id: mat-reading-graphs-real-data-2-vic
            brief: What rising, flat and falling parts of a graph mean, such as a travel graph where a flat part shows a stop.
            codes: [VC2M7A04]

  - title: Measurement and space
    chapters:
      - title: Area and volume
        id: vic-mat-7-2-1
        points:
          - title: Area of rectangles and triangles
            id: mat-area-rectangles-triangles
            brief: A rectangle's area is length times width. A triangle's is half the base times the perpendicular height.
            codes: [VC2M7M01]
          - title: Area of a parallelogram
            id: mat-area-parallelogram
            brief: Cutting a triangle off one end and moving it to the other makes a rectangle, so a parallelogram's area is base times perpendicular height.
            codes: [VC2M7M01]
          - title: Volume of rectangular prisms
            id: mat-volume-rectangular-prisms
            brief: Volume is length times width times height, measured in cubic units such as cm³.
            codes: [VC2M7M02]
          - title: Volume of triangular prisms
            id: mat-volume-triangular-prisms
            brief: The volume of any right prism is the area of its cross-section times its length, so a triangular prism is ½ × b × h × length.
            codes: [VC2M7M02]

      - title: Circles and angles
        id: vic-mat-7-2-2
        points:
          - title: Pi and the parts of a circle
            id: mat-pi-parts-circle
            brief: Radius, diameter and circumference, and why the circumference divided by the diameter is always pi, about 3.14.
            codes: [VC2M7M03]
          - title: Angles on parallel lines
            id: mat-angles-parallel-lines-vic
            brief: When a transversal crosses parallel lines, corresponding angles are equal, alternate angles are equal, and co-interior angles add to 180°.
            codes: [VC2M7M04]
          - title: Angle sum of a triangle
            id: mat-angle-sum-triangle-vic
            brief: The three angles of a triangle add to 180°, so the third angle is 180° minus the other two.
            codes: [VC2M7M05]
          - title: Angle sum of a polygon
            id: mat-angle-sum-polygon
            brief: A polygon with n sides splits into n - 2 triangles, so its angles add to (n - 2) × 180°.
            codes: [VC2M7M05]

      - title: Shapes and transformations
        id: vic-mat-7-2-3
        points:
          - title: Drawing 3D objects in two dimensions
            id: mat-drawing-3d-objects-two
            brief: Nets, isometric drawings, and the front, side and top views of an object, and what each shows or hides.
            codes: [VC2M7SP01]
          - title: Classifying triangles
            id: mat-classifying-triangles-vic
            brief: Triangles named by their sides (equilateral, isosceles, scalene) and by their angles (acute, right, obtuse).
            codes: [VC2M7SP02]
          - title: Classifying quadrilaterals
            id: mat-classifying-quadrilaterals-vic
            brief: The side, angle and diagonal properties of squares, rectangles, rhombuses, parallelograms, trapeziums and kites, and how they relate.
            codes: [VC2M7SP02, VC2M7SP04]
          - title: Transformations on the Cartesian plane
            id: mat-transformations-cartesian-plane-vic
            brief: How translations, reflections in an axis and rotations about the origin change coordinates, such as reflecting in the x-axis changes the sign of y.
            codes: [VC2M7SP03]

  - title: Statistics and probability
    chapters:
      - title: Data and averages
        id: vic-mat-7-3-1
        points:
          - title: Types of data
            id: mat-types-data-3
            brief: Categorical data names groups. Numerical data is counted (discrete) or measured (continuous).
            codes: [VC2M7ST01, VC2M7ST03]
          - title: Mean, median, mode and range
            id: mat-mean-median-mode-range-vic
            brief: The mean is the total divided by the count, the median the middle value in order, the mode the most common, and the range the highest minus the lowest.
            codes: [VC2M7ST01]
          - title: Choosing a measure of centre
            id: mat-choosing-measure-centre-vic
            brief: An outlier pulls the mean towards it but barely moves the median, so the median often suits data with extreme values.
            codes: [VC2M7ST01]
          - title: Dot plots and stem-and-leaf plots
            id: mat-dot-plots-stem-leaf-vic
            brief: Reading and making dot plots and stem-and-leaf plots, and finding the median and range from them.
            codes: [VC2M7ST02]
          - title: Describing a distribution
            id: mat-describing-distribution-2
            brief: Describing data by its shape, centre and spread, and pointing out clusters, gaps and outliers.
            codes: [VC2M7ST02, VC2M7ST03]

      - title: Chance
        id: vic-mat-7-3-2
        points:
          - title: Sample spaces
            id: mat-sample-spaces
            brief: The sample space is the list of every possible outcome of an experiment, such as {1, 2, 3, 4, 5, 6} for a die.
            codes: [VC2M7P01]
          - title: Probability of a single event
            id: mat-probability-single-event
            brief: With equally likely outcomes, probability is favourable outcomes over total outcomes, a number from 0 (impossible) to 1 (certain).
            codes: [VC2M7P01]
          - title: Expected number of results
            id: mat-expected-number-results
            brief: Multiply the probability by the number of trials to predict how often an outcome should happen, such as 60 rolls giving about 10 sixes.
            codes: [VC2M7P01]
          - title: Relative frequency and the number of trials
            id: mat-relative-frequency-number-trials
            brief: Relative frequency is how often an outcome happened over the number of trials. More trials usually bring it closer to the theoretical probability.
            codes: [VC2M7P02]
