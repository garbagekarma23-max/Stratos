# NSW Science, Stage 4 (Years 7 and 8): Working scientifically and the eight Stage 4 focus areas, 70 points.
# Follows NESA's Science 7-10 Syllabus (2023), checked on the NSW Curriculum website (curriculum.nsw.edu.au) in
# November 2026. It replaces the Science 7-10 Syllabus (2018). Schools teach it in Year 7 from 2026 and Year 8 from
# 2027 (the staggered start NSW recommends), and the 2018 syllabus must not be taught after December 2027, so this
# follows the new syllabus.
# Structure: Working scientifically, Observing the Universe and Data science 1 make the first unit, since the syllabus
# runs Working scientifically through every focus area. Forces is a unit; Cells and classification with Living systems
# is a unit; Solutions and mixtures with Periodic table and atomic structure is a unit; Change is a unit. Each focus
# area's content groups become chapters, merged where a group is small. The depth study and the hands-on
# investigations are taught only as the ideas behind them (variables, fair tests, graphs). Outcome codes (SC4-...) are
# on the points. Aboriginal and Torres Strait Islander knowledges are included where the syllabus names them: astronomy,
# classification, separating mixtures and accounts of volcanic activity. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-sci-s4
subject: Science
bank: sci
name: Science, Stage 4
about: NSW Stage 4, Years 7 and 8
short: Science
years: [7, 8]
level: Stage 4
place: nsw
kind: standard
syllabus: NSW Science 7-10 Syllabus (2023), Stage 4
note: Follows the NSW Science syllabus. Not made or endorsed by NESA.
chips: [fair test, cells, food webs, density, periodic table, rock cycle]

units:
  - title: Working scientifically and the Universe
    chapters:
      - title: Investigating like a scientist
        id: nsw-sci-s4-1-1
        points:
          - title: Variables and fair tests
            id: sci-variables-fair-tests
            brief: In a fair test you change one variable (independent), measure one (dependent) and keep the rest the same (controlled), and repeat trials so results are reliable. An observational study watches without changing anything.
            codes: [SC4-WS-03, SC4-OTU-01]
          - title: Observations and inferences
            id: sci-observations-inferences
            brief: An observation is what you see or measure. An inference is an explanation you draw from observations, which further tests can support or reject.
            codes: [SC4-WS-01, SC4-WS-02]
          - title: Measuring with instruments
            id: sci-measuring-with-instruments
            brief: Choosing the right instrument and unit for length, mass, volume and temperature, and how digital and analog instruments compare in range and sensitivity, and with our senses.
            codes: [SC4-WS-01, SC4-WS-04]
          - title: Graphs and conclusions
            id: sci-graphs-conclusions
            brief: Column graphs suit categories and line graphs suit measured values that change, and a conclusion says what the trend in the data shows about the aim.
            codes: [SC4-WS-05, SC4-WS-06]

      - title: How science builds knowledge
        id: nsw-sci-s4-1-2
        points:
          - title: Theories and laws
            id: sci-theories-laws
            brief: A scientific law describes a pattern that always happens. A theory explains why, using a large body of evidence from many scientists, and both can change when new evidence appears.
            codes: [SC4-OTU-01]
          - title: Scientific models
            id: sci-scientific-models
            brief: A model, such as a diagram, a physical model or a computer simulation, represents something real using data. It helps explain and predict, but leaves some things out.
            codes: [SC4-DA1-01]
          - title: Data and data science
            id: sci-data-data-science
            brief: Data science uses data, methods and computers to find patterns. Our online activity creates data about us too, so we need to share it carefully.
            codes: [SC4-DA1-01]

      - title: Sun, Earth and Moon
        id: nsw-sci-s4-1-3
        points:
          - title: Models of the solar system
            id: sci-models-solar-system
            brief: The Earth-centred model was replaced by the Sun-centred model when new evidence, such as Galileo's telescope observations, did not fit the old one.
            codes: [SC4-OTU-01]
          - title: Phases of the Moon
            id: sci-phases-moon-nsw
            brief: The Moon reflects sunlight, and as it orbits Earth over about a month we see different amounts of its lit half, from new moon to full moon.
            codes: [SC4-OTU-01]
          - title: Solar and lunar eclipses
            id: sci-solar-lunar-eclipses-nsw
            brief: A solar eclipse happens when the Moon passes between the Sun and Earth. A lunar eclipse happens when Earth's shadow falls on the Moon.
            codes: [SC4-OTU-01]
          - title: Aboriginal and Torres Strait Islander astronomy
            id: sci-aboriginal-torres-strait-islander
            brief: Aboriginal and Torres Strait Islander Peoples have long linked the Moon's phases to the tides, and used the positions of stars, such as the Emu in the Sky, to know when seasons, weather and animal behaviour would change.
            codes: [SC4-OTU-01]

  - title: Forces
    chapters:
      - title: Forces and their effects
        id: nsw-sci-s4-2-1
        points:
          - title: Contact and non-contact forces
            id: sci-contact-non-contact-forces
            brief: Contact forces, such as friction and a push, act where objects touch. Non-contact forces, such as gravity and magnetism, act at a distance.
            codes: [SC4-FOR-01]
          - title: Balanced and unbalanced forces
            id: sci-balanced-unbalanced-forces-nsw
            brief: Force arrows show the size and direction of each force. Balanced forces leave motion unchanged, and unbalanced forces make an object speed up, slow down or change direction.
            codes: [SC4-FOR-01]
          - title: Mass and weight
            id: sci-mass-weight
            brief: Mass is the amount of matter in an object, in kilograms. Weight is the force of gravity on it, in newtons, found with weight equals mass times gravitational acceleration.
            codes: [SC4-FOR-01]

      - title: Magnets and machines
        id: nsw-sci-s4-2-2
        points:
          - title: Magnetic poles
            id: sci-magnetic-poles
            brief: Every magnet has a north and a south pole. Like poles repel, unlike poles attract, and the force gets weaker with distance.
            codes: [SC4-FOR-01]
          - title: Magnetic fields
            id: sci-magnetic-fields
            brief: A magnetic field is the area around a magnet where its force acts, shown by field lines running from north to south that are closest where the field is strongest.
            codes: [SC4-FOR-01]
          - title: Electromagnets
            id: sci-electromagnets
            brief: A current in a coil of wire makes a magnet that can be switched off. More turns, more current or an iron core make it stronger.
            codes: [SC4-FOR-01]
          - title: Levers and pulleys
            id: sci-levers-pulleys
            brief: Simple machines such as levers and pulleys change the size or direction of a force, so a smaller effort can move a larger load.
            codes: [SC4-FOR-01, SC4-WS-07]

  - title: Living things
    chapters:
      - title: Classifying living things
        id: nsw-sci-s4-3-1
        points:
          - title: Characteristics of living things
            id: sci-characteristics-living-things
            brief: Living things move, respire, are sensitive to their surroundings, grow, reproduce, excrete wastes and need nutrition.
            codes: [SC4-CLS-01]
          - title: Levels of classification
            id: sci-levels-classification
            brief: Scientists sort organisms into kingdom, phylum, class, order, family, genus and species, and name each with a two-part scientific name, its genus and species.
            codes: [SC4-CLS-01]
          - title: Identifying organisms with two-choice questions
            id: sci-identifying-organisms-with-two
            brief: A branching chart identifies an organism through a series of questions, each with two choices about a visible feature, until only one name is left.
            codes: [SC4-CLS-01]
          - title: Adaptations
            id: sci-adaptations
            brief: Structural, behavioural and physiological adaptations help organisms survive in their habitat, such as how Australian animals and plants cope with heat and little water.
            codes: [SC4-CLS-01]
          - title: Aboriginal and Torres Strait Islander classification
            id: sci-aboriginal-torres-strait-islander-2
            brief: Aboriginal and Torres Strait Islander Peoples classify plants and animals by their uses, forms and functions, a system built on deep knowledge of Country.
            codes: [SC4-CLS-01]

      - title: Cells
        id: nsw-sci-s4-3-2
        points:
          - title: Cell theory and the microscope
            id: sci-cell-theory-microscope
            brief: All living things are made of cells, cells are the basic unit of life, and new cells come from existing cells. Microscopes let us see them.
            codes: [SC4-CLS-01, SC4-WS-01]
          - title: Plant and animal cells
            id: sci-plant-animal-cells
            brief: Both have a cell membrane, cytoplasm, nucleus and mitochondria. Plant cells also have a cell wall, chloroplasts and a large vacuole. Mitochondria release energy and chloroplasts make food.
            codes: [SC4-CLS-01]
          - title: Bacterial and fungal cells
            id: sci-bacterial-fungal-cells
            brief: Bacterial cells are small and have no nucleus. Fungal cells have a nucleus and a cell wall but no chloroplasts.
            codes: [SC4-CLS-01]
          - title: Specialised cells, tissues and organs
            id: sci-specialised-cells-tissues-organs
            brief: In many-celled organisms, cells take on special shapes for special jobs, such as nerve and red blood cells. Similar cells form tissues, and tissues form organs.
            codes: [SC4-CLS-01]

      - title: Body and plant systems
        id: nsw-sci-s4-3-3
        points:
          - title: The digestive system
            id: sci-digestive-system-nsw
            brief: The mouth, stomach and intestines break food down into small molecules that pass into the blood, and wastes leave the body.
            codes: [SC4-LIV-01]
          - title: The circulatory and respiratory systems
            id: sci-circulatory-respiratory-systems
            brief: The lungs take in oxygen and remove carbon dioxide, and the heart pumps blood through blood vessels to carry these gases and nutrients to and from every cell.
            codes: [SC4-LIV-01]
          - title: The excretory system
            id: sci-excretory-system
            brief: The kidneys filter wastes from the blood to make urine, which the bladder stores, and the skin and lungs also remove wastes.
            codes: [SC4-LIV-01]
          - title: Body systems working together
            id: sci-body-systems-working-together
            brief: Body systems depend on each other, so damage to one organ or system, such as a blocked artery, affects other systems and the whole body.
            codes: [SC4-LIV-01]
          - title: Plant transport and support
            id: sci-plant-transport-support
            brief: Roots take up water and minerals, xylem carries water up the plant, phloem carries sugars from the leaves, and stems hold the plant up.
            codes: [SC4-LIV-01]

      - title: Ecosystems
        id: nsw-sci-s4-3-4
        points:
          - title: Biotic and abiotic factors
            id: sci-biotic-abiotic-factors-nsw
            brief: An ecosystem is made of living (biotic) parts, such as plants and animals, and non-living (abiotic) parts, such as water, light and soil, that affect each other.
            codes: [SC4-LIV-01]
          - title: Food chains, webs and energy pyramids
            id: sci-food-chains-webs-energy
            brief: Energy passes from producers to consumers along food chains, and only a small part passes up each level, so an energy pyramid narrows towards the top. Decomposers return matter to the soil.
            codes: [SC4-LIV-01]
          - title: Introduced species
            id: sci-introduced-species
            brief: A species brought into an ecosystem, such as the cane toad or the European rabbit, can change populations of native species by competing with, eating or poisoning them.
            codes: [SC4-LIV-01, SC4-WS-06]
          - title: Threatened species in Australia
            id: sci-threatened-species-australia
            brief: Habitat loss, introduced species, disease and climate change make species vulnerable or endangered, and Australia has one of the world's highest rates of mammal extinction.
            codes: [SC4-LIV-01]

  - title: Matter
    chapters:
      - title: States of matter and density
        id: nsw-sci-s4-4-1
        points:
          - title: The particle model
            id: sci-particle-model
            brief: Solids, liquids and gases are made of particles. In solids they are held tightly and vibrate in place, in liquids they slide past each other, and in gases they move freely and far apart.
            codes: [SC4-SOL-01]
          - title: Changes of state
            id: sci-changes-state-nsw
            brief: Melting, freezing, evaporating, boiling and condensing happen as particles gain or lose energy, and the temperature stays level on a heating graph while the state changes.
            codes: [SC4-SOL-01, SC4-WS-05]
          - title: Density
            id: sci-density
            brief: Density is mass divided by volume. The volume of an irregular object can be found by how much water it displaces, and less dense objects float on denser liquids.
            codes: [SC4-SOL-01]

      - title: Solutions
        id: nsw-sci-s4-4-2
        points:
          - title: Solutes, solvents and solutions
            id: sci-solutes-solvents-solutions
            brief: A solute dissolves in a solvent to make a solution. A substance that dissolves is soluble, and one that does not is insoluble.
            codes: [SC4-SOL-01]
          - title: Solubility and temperature
            id: sci-solubility-temperature
            brief: Solubility is how much solute dissolves in a set amount of solvent. For most solids it rises as the water gets hotter.
            codes: [SC4-SOL-01]
          - title: Dilute, concentrated and saturated
            id: sci-dilute-concentrated-saturated
            brief: A dilute solution has little solute, a concentrated one has a lot, and a saturated one can dissolve no more at that temperature.
            codes: [SC4-SOL-01]
          - title: Pure substances and mixtures
            id: sci-pure-substances-mixtures-nsw
            brief: Elements and compounds are pure substances with one kind of particle. A mixture has different substances that are not chemically joined and can be separated.
            codes: [SC4-SOL-01, SC4-PRT-01]

      - title: Separating mixtures
        id: nsw-sci-s4-4-3
        points:
          - title: Filtration
            id: sci-filtration
            brief: Filtering separates an insoluble solid from a liquid, as in treating drinking water, and sieving and decanting work in a similar way.
            codes: [SC4-SOL-01]
          - title: Evaporation and crystallisation
            id: sci-evaporation-crystallisation-nsw
            brief: Heating a solution until the solvent evaporates leaves the dissolved solid behind, often as crystals, as in making salt from seawater.
            codes: [SC4-SOL-01]
          - title: Distillation
            id: sci-distillation
            brief: Distillation boils a liquid and cools the vapour back into a liquid, separating it from dissolved solids or from liquids with different boiling points.
            codes: [SC4-SOL-01]
          - title: Chromatography
            id: sci-chromatography
            brief: Chromatography separates a mixture of dissolved substances, such as inks, because each travels a different distance up the paper with the solvent.
            codes: [SC4-SOL-01]
          - title: Aboriginal and Torres Strait Islander separation methods
            id: sci-aboriginal-torres-strait-islander-3
            brief: Aboriginal and Torres Strait Islander Peoples have long used separation methods, such as grinding and sieving seeds and soaking and washing some seeds to remove toxins before eating.
            codes: [SC4-SOL-01]

      - title: Atoms
        id: nsw-sci-s4-4-4
        points:
          - title: Protons, neutrons and electrons
            id: sci-protons-neutrons-electrons-nsw
            brief: An atom is the smallest part of an element. Its nucleus holds positive protons and neutral neutrons, and negative electrons move around it.
            codes: [SC4-PRT-01]
          - title: Atomic number and electron shells
            id: sci-atomic-number-electron-shells
            brief: The atomic number is the number of protons. In the first 18 elements, electrons fill shells around the nucleus, two in the first shell and up to eight in the next two.
            codes: [SC4-PRT-01]
          - title: Changing models of the atom
            id: sci-changing-models-atom
            brief: Models of the atom changed as new experiments gave new evidence, from Dalton's solid ball to Thomson's, Rutherford's nucleus and Bohr's electron shells.
            codes: [SC4-PRT-01]

      - title: The periodic table
        id: nsw-sci-s4-4-5
        points:
          - title: Metals, non-metals and metalloids
            id: sci-metals-non-metals-metalloids
            brief: Metals are shiny, conduct heat and electricity and can be bent. Most non-metals are dull and do not conduct. Metalloids are in between, and these properties decide how each is used.
            codes: [SC4-PRT-01]
          - title: Element symbols and compounds
            id: sci-element-symbols-compounds
            brief: Each element has a symbol of one or two letters, and a formula such as H2O or CO2 shows which elements are joined in a compound.
            codes: [SC4-PRT-01]
          - title: Groups and periods
            id: sci-groups-periods-nsw
            brief: Columns are groups of elements with similar properties and rows are periods. An element's place lets us predict its properties, such as how reactive it is.
            codes: [SC4-PRT-01]
          - title: Building the periodic table
            id: sci-building-periodic-table
            brief: Mendeleev ordered the known elements by their properties and left gaps for elements not yet found, and later discoveries filled them.
            codes: [SC4-PRT-01]

  - title: Change
    chapters:
      - title: Energy
        id: nsw-sci-s4-5-1
        points:
          - title: Energy stores
            id: sci-energy-stores
            brief: Energy can be stored as kinetic, gravitational potential, elastic, chemical and thermal energy.
            codes: [SC4-CHG-01]
          - title: Energy transfers
            id: sci-energy-transfers
            brief: Heat moves by conduction in solids, by convection in liquids and gases, and by radiation, which needs no matter, as when sunlight reaches Earth.
            codes: [SC4-CHG-01]
          - title: Energy transformations
            id: sci-energy-transformations
            brief: Energy changes from one form to another, such as chemical to kinetic in a car, and flow diagrams show the energy going in and coming out.
            codes: [SC4-CHG-01]
          - title: Conservation of energy
            id: sci-conservation-energy-nsw
            brief: Energy cannot be made or destroyed, only changed or moved. In an open system energy and matter can enter and leave, and in a closed system only energy can.
            codes: [SC4-CHG-01]

      - title: Chemical change
        id: nsw-sci-s4-5-2
        points:
          - title: Physical and chemical change
            id: sci-physical-chemical-change
            brief: A physical change, such as melting, makes no new substance. A chemical change makes a new one, shown by signs such as a colour change, gas bubbles, light or a precipitate.
            codes: [SC4-CHG-01]
          - title: Word equations
            id: sci-word-equations
            brief: A word equation names the reactants on the left and the products on the right, such as magnesium plus oxygen gives magnesium oxide.
            codes: [SC4-CHG-01]
          - title: Exothermic and endothermic reactions
            id: sci-exothermic-endothermic-reactions
            brief: Exothermic reactions give out heat and endothermic reactions take it in, which we can measure as a temperature change.
            codes: [SC4-CHG-01]
          - title: Photosynthesis and respiration
            id: sci-photosynthesis-respiration
            brief: In photosynthesis plants use light to turn carbon dioxide and water into glucose and oxygen. Respiration in cells uses glucose and oxygen to release energy.
            codes: [SC4-CHG-01]

      - title: Plate tectonics
        id: nsw-sci-s4-5-3
        points:
          - title: Moving plates
            id: sci-moving-plates
            brief: Earth's crust is broken into plates that move slowly. Where they pull apart, push together or slide past, they cause earthquakes, volcanoes and mountains.
            codes: [SC4-CHG-01]
          - title: Evidence for moving continents
            id: sci-evidence-moving-continents
            brief: Wegener saw that coastlines fit together and matching fossils and rocks are found on distant continents. Later sea floor evidence turned his idea into plate tectonics.
            codes: [SC4-CHG-01]
          - title: Aboriginal accounts of volcanoes
            id: sci-aboriginal-accounts-volcanoes
            brief: Some Aboriginal cultural accounts record volcanic activity, such as Gunditjmara accounts of Budj Bim in western Victoria, which match what geologists have found.
            codes: [SC4-CHG-01]

      - title: Rocks and fossils
        id: nsw-sci-s4-5-4
        points:
          - title: Igneous, sedimentary and metamorphic rocks
            id: sci-igneous-sedimentary-metamorphic-rocks
            brief: Igneous rocks form from cooled magma, sedimentary rocks from layers of pressed sediment, and metamorphic rocks from rock changed by heat and pressure. Rocks are made of minerals.
            codes: [SC4-CHG-01]
          - title: The rock cycle
            id: sci-rock-cycle-nsw
            brief: Weathering, erosion, burial, heat, pressure and melting slowly turn one rock type into another in a cycle.
            codes: [SC4-CHG-01]
          - title: How fossils form
            id: sci-fossils-form
            brief: A fossil forms when the remains or traces of a living thing are buried in sediment and slowly replaced by minerals, showing that different organisms lived at different times.
            codes: [SC4-CHG-01]
          - title: Relative dating of rock layers
            id: sci-relative-dating-rock-layers
            brief: In undisturbed layers of sedimentary rock, the lowest layers are oldest, so fossils in lower layers are older than those above them.
            codes: [SC4-CHG-01]
