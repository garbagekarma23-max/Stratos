# VCE Chemistry, Units 3 and 4: energy and optimising reactions, and carbon-based compounds, 44 points.
# Drafted from the VCAA's VCE Chemistry Study Design, Units 3 and 4 from 2024. The structure follows the study design:
# each unit is a unit here, and each area of study is a chapter, or two when it is large. The research investigation
# is school-run, so it is not here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW Chemistry (the chem bank) covers most of these ideas, so expect many reuses and adapts.
# The study design's end date was not confirmed when this was drafted (a school guide gives 2027). Check it first.

id: vic-chem-u34
subject: Chemistry
bank: chem
name: Chemistry, Units 3 and 4
about: VCE, Energy, rates, equilibrium and organic chemistry
short: Chemistry
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Chemistry Study Design (from 2023), Units 3 and 4
note: Follows the VCE Chemistry study design. Not made or endorsed by the VCAA.
chips: [enthalpy, galvanic cell, Le Chatelier, ester, mass spectrometry]

units:
  - title: "Unit 3: How can design and innovation help to optimise chemical processes?"
    chapters:
      - title: Fuels and energy
        id: vic-chem-u34-1-1
        points:
          - title: Fossil fuels and biofuels
            id: chem-fossil-fuels-biofuels
            brief: Coal, oil and gas formed over millions of years. Biofuels such as bioethanol are made from recent plant matter and are renewable.
          - title: Combustion
            id: chem-combustion
            brief: Complete combustion makes carbon dioxide and water. Too little oxygen makes carbon monoxide or soot.
          - title: Exothermic and endothermic reactions
            id: chem-exothermic-endothermic-reactions-2
            brief: Exothermic reactions release energy (ΔH negative). Endothermic reactions absorb it (ΔH positive).
          - title: Thermochemical equations
            id: chem-thermochemical-equations
            brief: A balanced equation with ΔH in kJ per mole, which scales with the amounts in the equation.
          - title: Energy profile diagrams
            id: chem-energy-profile-diagrams-2
            brief: Diagrams showing the energy of reactants and products, the activation energy and ΔH.
          - title: Calorimetry
            id: chem-calorimetry-2
            brief: Energy released or absorbed is found from q = mcΔT, then calibrated to account for heat loss.
          - title: Energy content of fuels
            id: chem-energy-content-fuels
            brief: The heat of combustion per gram or per mole lets fuels be compared.

      - title: Electrochemical cells
        id: vic-chem-u34-1-2
        points:
          - title: Galvanic cells
            id: chem-galvanic-cells-2
            brief: Two half-cells joined by a wire and a salt bridge turn chemical energy into electrical energy.
          - title: The electrochemical series
            id: chem-electrochemical-series
            brief: A table of half-equations ordered by strength, used to predict which reactions happen and the cell voltage.
          - title: Anode and cathode
            id: chem-anode-cathode
            brief: Oxidation happens at the anode and reduction at the cathode. In a galvanic cell the anode is negative.
          - title: Fuel cells
            id: chem-fuel-cells
            brief: Cells that are fed fuel and oxygen continuously, such as hydrogen fuel cells, making electricity with water as the product.
          - title: Electrolysis
            id: chem-electrolysis
            brief: An external power supply forces a non-spontaneous redox reaction, as in electroplating or making metals.
          - title: Rechargeable cells
            id: chem-rechargeable-cells
            brief: A cell that runs as a galvanic cell when used and as an electrolytic cell when charged.
          - title: Faraday's laws
            id: chem-faraday-s-laws
            brief: The amount of substance made in electrolysis is set by the charge passed, Q = It, and n(e⁻) = Q/F.

      - title: Rates and equilibrium
        id: vic-chem-u34-1-3
        points:
          - title: Collision theory
            id: chem-collision-theory
            brief: Particles react when they collide with enough energy and the right orientation.
          - title: Factors affecting rate
            id: chem-factors-affecting-rate
            brief: Higher temperature, concentration, pressure or surface area, and a catalyst, speed up a reaction.
          - title: Maxwell-Boltzmann distributions
            id: chem-maxwell-boltzmann-distributions
            brief: A graph of particle energies. At higher temperature more particles pass the activation energy.
          - title: Catalysts
            id: chem-catalysts
            brief: A catalyst gives a path with lower activation energy and is not used up.
          - title: Dynamic equilibrium
            id: chem-dynamic-equilibrium
            brief: In a closed system, forward and reverse reactions continue at equal rates, so amounts stay constant.
          - title: The equilibrium constant
            id: chem-equilibrium-constant-2
            brief: Kc is products over reactants, each raised to its coefficient. A large Kc means mostly products.
          - title: Le Chatelier's principle
            id: chem-le-chatelier-s-principle-2
            brief: A change to an equilibrium shifts it to partly oppose the change, such as adding a reactant making more product.
          - title: Rate and yield in industry
            id: chem-rate-yield-industry
            brief: Industry chooses conditions that balance a fast rate with a high yield, at reasonable cost.
          - title: Green chemistry principles
            id: chem-green-chemistry-principles
            brief: Designing processes to reduce waste, use safer chemicals, save energy and use renewable feedstocks.

  - title: "Unit 4: How are carbon-based compounds designed for purpose?"
    chapters:
      - title: Organic compounds and reactions
        id: vic-chem-u34-2-1
        points:
          - title: Homologous series
            id: chem-homologous-series
            brief: Families of compounds, such as alkanes, alcohols and carboxylic acids, that differ by CH₂ and share a functional group.
          - title: IUPAC naming
            id: chem-iupac-naming
            brief: Names show the main chain, its functional group, any branches and where each sits.
          - title: Structural isomers
            id: chem-structural-isomers
            brief: Compounds with the same formula but different arrangements of atoms, and so different properties.
          - title: Boiling points of organic compounds
            id: chem-boiling-points-organic-compounds
            brief: Longer chains and hydrogen bonding raise boiling points; branching lowers them.
          - title: Substitution and addition reactions
            id: chem-substitution-addition-reactions
            brief: Alkanes swap a hydrogen for a halogen. Alkenes add atoms across the double bond.
          - title: Esters and amides
            id: chem-esters-amides
            brief: An alcohol and a carboxylic acid condense to form an ester; an amine and a carboxylic acid form an amide.
          - title: Reaction pathways
            id: chem-reaction-pathways
            brief: A series of reactions turns a starting compound into a target, such as ethene to ethanol to ethanoic acid.
          - title: Atom economy and yield
            id: chem-atom-economy-yield
            brief: Atom economy is the share of reactant mass that ends up in the product. Percentage yield compares actual with theoretical.

      - title: Analysing organic compounds
        id: vic-chem-u34-2-2
        points:
          - title: Mass spectrometry
            id: chem-mass-spectrometry-2
            brief: Gives the molecular ion's mass and fragment pattern, which help identify a compound.
          - title: Infrared spectroscopy
            id: chem-infrared-spectroscopy-2
            brief: Bonds absorb particular infrared wavelengths, showing functional groups such as O-H and C=O.
          - title: Proton NMR spectroscopy
            id: chem-proton-nmr-spectroscopy
            brief: Shows how many hydrogen environments a molecule has, their surroundings and, by splitting, their neighbours.
          - title: Carbon-13 NMR spectroscopy
            id: chem-carbon-13-nmr-spectroscopy
            brief: The number of peaks shows how many different carbon environments there are.
          - title: Chromatography
            id: chem-chromatography
            brief: High-performance liquid chromatography separates compounds and measures their amounts by retention time and peak area.
          - title: Determining concentration
            id: chem-determining-concentration
            brief: Titration and calibration curves find how much of a compound is in a sample.

      - title: The chemistry of food
        id: vic-chem-u34-2-3
        points:
          - title: Carbohydrates in food
            id: chem-carbohydrates-food
            brief: Monosaccharides such as glucose join by condensation into disaccharides and polysaccharides such as starch.
          - title: Proteins and amino acids
            id: chem-proteins-amino-acids
            brief: Amino acids join by peptide links into proteins, whose shape depends on their structure.
          - title: Fats and oils
            id: chem-fats-oils
            brief: Triglycerides form from glycerol and fatty acids. Unsaturated fats have C=C bonds and are often liquid.
          - title: Vitamins
            id: chem-vitamins
            brief: Water-soluble vitamins such as C dissolve in water; fat-soluble ones such as D store in fat.
          - title: Enzymes
            id: chem-enzymes
            brief: Proteins that catalyse reactions in the body. Temperature and pH change their shape and activity.
          - title: Hydrolysis in digestion
            id: chem-hydrolysis-digestion
            brief: Digestion breaks food molecules apart by hydrolysis, the reverse of condensation.
          - title: Energy from food
            id: chem-energy-from-food
            brief: Glucose is oxidised in cellular respiration. Food energy is measured with a calorimeter in kJ per gram.
