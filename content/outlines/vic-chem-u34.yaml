# VCE Chemistry, Units 3 and 4: energy and optimising reactions, and carbon-based compounds, 64 points.
# Checked against the VCAA's VCE Chemistry Study Design, accredited from 2023 (Units 3 and 4 from 2024), in October
# 2026. Each unit is a unit here, and each area of study is a chapter, or two when it is large. The investigations are
# school-run, so their science skills are a short chapter here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW Chemistry (the chem bank) covers most of these ideas, so expect many reuses and adapts.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-chem-u34
subject: Chemistry
bank: chem
name: Chemistry, Units 3 and 4
about: VCE, Energy, rates, equilibrium and organic chemistry
short: Chemistry
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Chemistry Study Design (from 2023), Units 3 and 4
note: Follows the VCE Chemistry study design. Not made or endorsed by the VCAA.
chips: [enthalpy, galvanic cell, Le Chatelier, ester, mass spectrometry]

units:
  - title: "Unit 3: How can design and innovation help to optimise chemical processes?"
    chapters:
      - title: Fuels
        id: vic-chem-u34-1-1
        points:
          - title: Fossil fuels and biofuels
            id: chem-fossil-fuels-biofuels
            brief: Coal, natural gas and petrol are fossil fuels; biogas, bioethanol and biodiesel are biofuels that can be replaced quickly by natural processes.
          - title: Energy from food
            id: chem-energy-from-food
            brief: Carbohydrates, proteins and fats are fuels for the body, with energy values measured in kJ per gram.
          - title: Photosynthesis and respiration
            id: chem-photosynthesis-respiration
            brief: Photosynthesis stores light energy as glucose; cellular respiration releases it by oxidising glucose back to carbon dioxide and water.
          - title: Making bioethanol
            id: chem-making-bioethanol
            brief: Yeast ferments glucose to ethanol and carbon dioxide, and distillation concentrates the ethanol for use as fuel.
          - title: Combustion
            id: chem-combustion
            brief: Complete combustion of a fuel gives carbon dioxide and water; incomplete combustion also gives carbon monoxide or soot.
          - title: Limiting reactants
            id: chem-limiting-reactants
            brief: The reactant that runs out first sets how much product forms.
          - title: Stoichiometry of fuels
            id: chem-stoichiometry-fuels
            brief: Mass, volume and mole ratios find the energy released and the gases made when a fuel burns, at standard conditions.

      - title: Measuring energy changes
        id: vic-chem-u34-1-2-2
        points:
          - title: Exothermic and endothermic reactions
            id: chem-exothermic-endothermic-reactions-2
            brief: Exothermic reactions release energy (ΔH negative). Endothermic reactions absorb it (ΔH positive).
          - title: Thermochemical equations
            id: chem-thermochemical-equations
            brief: A balanced equation with ΔH in kJ per mole, which scales with the amounts in the equation.
          - title: Energy profile diagrams
            id: chem-energy-profile-diagrams-2
            brief: Diagrams showing the energy of reactants and products, the activation energy and ΔH.
          - title: Calorimetry
            id: chem-calorimetry-2
            brief: Solution calorimetry finds energy changes from temperature changes, using a calibration factor and temperature-time graphs to allow for heat loss.
          - title: Energy content and efficiency
            id: chem-energy-content-fuels
            brief: Heating water with a burning fuel estimates its energy content. Efficiency is the share of chemical energy that ends up useful.

      - title: Galvanic and fuel cells
        id: vic-chem-u34-1-2
        points:
          - title: Redox and oxidation numbers
            id: chem-redox-oxidation-numbers
            brief: Oxidation numbers track electrons to identify the oxidising agent, the reducing agent and conjugate redox pairs.
          - title: Half-equations in Unit 3
            id: chem-half-equations-unit-3
            brief: Balanced half-equations, with states, for redox reactions in acidic and basic conditions.
          - title: Galvanic cells
            id: chem-galvanic-cells-2
            brief: Two half-cells joined by a wire and a salt bridge turn chemical energy into electrical energy.
          - title: Anode and cathode
            id: chem-anode-cathode
            brief: Oxidation happens at the anode and reduction at the cathode. In a galvanic cell the anode is negative.
          - title: The electrochemical series
            id: chem-electrochemical-series
            brief: A table of half-equations ordered by strength, used to predict which reactions happen and the cell voltage.
          - title: Fuel cells
            id: chem-fuel-cells
            brief: Cells that are fed fuel and oxygen continuously, such as hydrogen fuel cells, making electricity with water as the product.
          - title: Designing better fuel cells
            id: chem-designing-better-fuel-cells
            brief: Innovation guided by green chemistry, such as energy efficiency and safer materials, is improving fuel cells for society's energy needs.

      - title: Reaction rates
        id: vic-chem-u34-1-3
        points:
          - title: Collision theory
            id: chem-collision-theory
            brief: Particles react when they collide with enough energy and the right orientation.
          - title: Factors affecting rate
            id: chem-factors-affecting-rate
            brief: Higher temperature, concentration, pressure or surface area, and a catalyst, speed up a reaction.
          - title: Maxwell-Boltzmann distributions
            id: chem-maxwell-boltzmann-distributions
            brief: A graph of particle energies. At higher temperature more particles pass the activation energy.
          - title: Catalysts
            id: chem-catalysts
            brief: A catalyst gives a path with lower activation energy and is not used up.

      - title: Equilibrium and yield
        id: vic-chem-u34-1-5
        points:
          - title: Reversible reactions and extent
            id: chem-reversible-reactions-extent
            brief: Some reactions go both ways. How fast a reaction goes (rate) differs from how far it goes (extent).
          - title: Dynamic equilibrium
            id: chem-dynamic-equilibrium
            brief: In a closed system, forward and reverse reactions continue at equal rates, so amounts stay constant.
          - title: The equilibrium constant
            id: chem-equilibrium-constant-2
            brief: Kc compares product and reactant concentrations at equilibrium. Its value depends on temperature only.
          - title: The reaction quotient
            id: chem-reaction-quotient-2
            brief: Q is worked out like Kc at any moment; comparing Q with Kc shows which way a reaction will shift.
          - title: Le Chatelier's principle
            id: chem-le-chatelier-s-principle-2
            brief: A change to an equilibrium shifts it to partly oppose the change, such as adding a reactant making more product.
          - title: Rate and yield in industry
            id: chem-rate-yield-industry
            brief: Industry chooses conditions that balance a fast rate with a high yield, at reasonable cost.
          - title: Green chemistry principles
            id: chem-green-chemistry-principles
            brief: Designing processes to reduce waste, use safer chemicals, save energy and use renewable feedstocks.

      - title: Electrolysis
        id: vic-chem-u34-1-6
        points:
          - title: Electrolysis
            id: chem-electrolysis
            brief: An external power supply forces a non-spontaneous redox reaction. The electrochemical series predicts the products from molten or aqueous chemicals.
          - title: Commercial electrolytic cells
            id: chem-commercial-electrolytic-cells
            brief: Industrial cells are designed with suitable electrodes and electrolytes, and remove products as they form.
          - title: Rechargeable cells
            id: chem-rechargeable-cells
            brief: A cell that runs as a galvanic cell when used and as an electrolytic cell when charged.
          - title: Green hydrogen
            id: chem-green-hydrogen
            brief: Electrolysis powered by solar or wind, and artificial photosynthesis, can make hydrogen without fossil fuels.
          - title: Faraday's laws
            id: chem-faraday-s-laws
            brief: The amount of substance made in electrolysis is set by the charge passed, Q = It, and n(e⁻) = Q/F.

  - title: "Unit 4: How are carbon-based compounds designed for purpose?"
    chapters:
      - title: Organic structure
        id: vic-chem-u34-2-1
        points:
          - title: Why carbon is special
            id: chem-carbon-special
            brief: Carbon has four valence electrons and forms strong bonds with itself and other atoms, giving millions of compounds.
          - title: Homologous series
            id: chem-homologous-series
            brief: Families such as alkanes, alkenes, alcohols, amines, amides, carboxylic acids and esters, drawn as molecular, structural, semi-structural or skeletal formulas.
          - title: IUPAC naming
            id: chem-iupac-naming
            brief: Names show the main chain, its functional group, any branches and where each sits.
          - title: Structural isomers
            id: chem-structural-isomers
            brief: Compounds with the same formula but different arrangements of atoms, and so different properties.
          - title: Boiling points of organic compounds
            id: chem-boiling-points-organic-compounds
            brief: Boiling point, melting point and viscosity rise with chain length and with stronger forces between molecules.

      - title: Organic reactions
        id: vic-chem-u34-2-2-2
        points:
          - title: Substitution and addition reactions
            id: chem-substitution-addition-reactions
            brief: Alkanes swap a hydrogen for a halogen. Alkenes add atoms across the double bond.
          - title: Esters and amides
            id: chem-esters-amides
            brief: An alcohol and a carboxylic acid form an ester, and esters can be hydrolysed back. An amine and a carboxylic acid form an amide.
          - title: Reaction pathways
            id: chem-reaction-pathways
            brief: A series of reactions makes a target, such as a primary amine or a carboxylic acid, from a simpler compound.
          - title: Making biodiesel
            id: chem-making-biodiesel
            brief: Plant oils react with an alcohol in transesterification to make biodiesel.
          - title: Hydrolysis and condensation of biomolecules
            id: chem-hydrolysis-digestion
            brief: Condensation builds proteins, starch, glycogen and fats; hydrolysis breaks them down again in digestion.
          - title: Atom economy and yield
            id: chem-atom-economy-yield
            brief: Percentage yield and atom economy measure how much of the reactants ends up in the product. Green chemistry favours high atom economy.

      - title: Laboratory analysis
        id: vic-chem-u34-2-2
        points:
          - title: Tests for functional groups
            id: chem-tests-functional-groups
            brief: Simple tests show a carbon-carbon double bond, a hydroxyl group or a carboxyl group.
          - title: Melting point and distillation
            id: chem-melting-point-distillation
            brief: A sharp melting point shows purity. Simple and fractional distillation separate liquids by boiling point.
          - title: Degree of unsaturation
            id: chem-degree-unsaturation
            brief: How much iodine a fat or oil absorbs shows how many carbon-carbon double bonds it has.
          - title: Redox titrations
            id: chem-determining-concentration
            brief: Titrating with an oxidising or reducing agent finds a concentration, including which reactant is in excess.

      - title: Instrumental analysis
        id: vic-chem-u34-2-4
        points:
          - title: Mass spectrometry
            id: chem-mass-spectrometry-2
            brief: Gives the molecular ion's mass and fragment pattern, which help identify a compound.
          - title: Infrared spectroscopy
            id: chem-infrared-spectroscopy-2
            brief: Bonds absorb particular infrared wavelengths, showing functional groups such as O-H and C=O.
          - title: Proton NMR spectroscopy
            id: chem-proton-nmr-spectroscopy
            brief: Shows how many hydrogen environments a molecule has, their surroundings and, by splitting, their neighbours.
          - title: Carbon-13 NMR spectroscopy
            id: chem-carbon-13-nmr-spectroscopy
            brief: The number of peaks shows how many different carbon environments there are.
          - title: Chromatography
            id: chem-chromatography-2
            brief: High performance liquid chromatography separates a mixture. Retention times identify parts, and a calibration curve finds concentration.
          - title: Combining techniques
            id: chem-combining-techniques
            brief: Mass spectrometry, infrared and NMR data together reveal the structure of an unknown organic compound.

      - title: Medicinal chemistry
        id: vic-chem-u34-2-5
        points:
          - title: Medicines from plants
            id: chem-medicines-from-plants
            brief: Solvent extraction and distillation take possible active ingredients out of plants and purify them.
          - title: Functional groups in medicines
            id: chem-functional-groups-medicines
            brief: Identifying the functional groups in a medicine's structure shows how it may react and work.
          - title: Chirality in medicines
            id: chem-chirality-medicines
            brief: A carbon with four different groups is chiral. Mirror-image forms of a medicine can act very differently in the body.
          - title: Enzymes
            id: chem-enzymes
            brief: Proteins that catalyse reactions, with primary to quaternary structure. Heat and pH change their shape and stop them working.
          - title: Enzyme inhibitors
            id: chem-enzyme-inhibitors
            brief: Some medicines block an enzyme's active site, so the real substrate cannot bind.

      - title: "Science skills: the investigation"
        id: vic-chem-u34-2-6
        points:
          - title: Variables and controlled experiments
            id: chem-variables-controlled-experiments
            brief: Changing one independent variable, measuring the dependent variable and keeping others controlled shows cause and effect.
          - title: Measurement quality in Unit 4
            id: chem-measurement-quality-unit-4
            brief: Accuracy, precision, repeatability, reproducibility, resolution and validity judge how far results can be trusted.
          - title: Reporting findings
            id: chem-reporting-findings
            brief: A scientific poster or report uses correct terms, units and conventions to present findings and their implications.
