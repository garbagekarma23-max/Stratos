# NSW Geography, Stage 4 (Years 7 and 8): the geographical concepts and tools and the four Stage 4 focus areas, 68 points.
# Follows NESA's Geography 7-10 Syllabus (2024), checked on the NSW Curriculum website (curriculum.nsw.edu.au) in
# November 2026. Schools plan for it in 2025 and 2026 and teach it from 2027, so this follows the new syllabus, not the
# Geography K-10 Syllabus (2015) it replaces. The 2015 syllabus is not available after December 2028.
# Structure: the geographical concepts and tools, which the syllabus says run through the whole course, are the first
# unit. Each Stage 4 focus area (Landscapes and landforms, Liveability of places, Water in the world, Interconnections
# and trade) is a unit, and each content group within it is a chapter. The inquiry and fieldwork content is taught here
# only as the ideas behind it (the steps, the instruments), not as fieldwork. Schools pick their own local landscape,
# place and hazard examples; the briefs use common Australian ones. Outcome codes (GE4-...) run across every focus
# area, so they are left off the points. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-geo-s4
subject: Geography
bank: geo
name: Geography, Stage 4
about: NSW Stage 4, Years 7 and 8
short: Geography
years: [7, 8]
level: Stage 4
place: nsw
kind: standard
syllabus: NSW Geography 7-10 Syllabus (2024), Stage 4
note: Follows the NSW Geography syllabus. Not made or endorsed by NESA.
chips: [landforms, liveability, water cycle, trade, grid references]

units:
  - title: Thinking and working geographically
    chapters:
      - title: The big ideas of geography
        id: nsw-geo-s4-1-1
        points:
          - title: Place as a geographical idea
            id: geo-place-as-geographical-idea
            brief: A place is a part of the Earth's surface that people give meaning to, such as a home, a town or a sacred site, and places shape people's sense of belonging.
          - title: Space and where things are
            id: geo-space-where-things-are
            brief: Space is about where features are found and how they are spread out, and how one location relates to other places nearby.
          - title: Environment as a geographical idea
            id: geo-environment-as-geographical-idea
            brief: The environment is the natural and built surroundings that people live in, which natural processes and human activity both change.
          - title: Interconnection between people and places
            id: geo-interconnection-between-people-places
            brief: Interconnection means people, places and environments are linked, so a change in one, such as a new road, affects the others.

      - title: Reading maps
        id: nsw-geo-s4-1-2
        points:
          - title: The parts of a map
            id: geo-parts-map
            brief: A useful map has a border, orientation (a north arrow), a legend, a title and a scale, often remembered as BOLTS.
          - title: Area references
            id: geo-area-references
            brief: A four-figure area reference names a grid square by its easting first, then its northing, to locate a feature roughly.
          - title: Grid references
            id: geo-grid-references
            brief: A six-figure grid reference splits each grid square into tenths to give a more exact position, again easting first.
          - title: Measuring distance with a map scale
            id: geo-measuring-distance-with-map
            brief: A line scale or ratio scale turns a distance measured on the map into the real distance on the ground.
          - title: Contour lines and slope
            id: geo-contour-lines-slope
            brief: Contour lines join places of the same height. Lines close together show a steep slope and lines far apart show a gentle one.

      - title: Graphs, fieldwork and spatial technologies
        id: nsw-geo-s4-1-3
        points:
          - title: Choosing and reading graphs
            id: geo-choosing-reading-graphs
            brief: Column, bar, line and picture graphs suit different data, and a line graph shows how something changes over time.
          - title: The fieldwork process
            id: geo-fieldwork-process
            brief: Fieldwork follows steps, from asking a geographical question to collecting and recording data, finding what it shows and sharing the findings.
          - title: Satellite images and GPS
            id: geo-satellite-images-gps
            brief: Satellite images show places from above and how they change over time, and GPS uses satellites to find an exact location.
          - title: Geographic information systems
            id: geo-geographic-information-systems
            brief: A GIS layers different kinds of data on one digital map, such as roads, rivers and population, so patterns can be compared.

  - title: Landscapes and landforms
    chapters:
      - title: What landscapes and landforms are
        id: nsw-geo-s4-2-1
        points:
          - title: Landscapes and landforms
            id: geo-landscapes-landforms-nsw
            brief: A landscape is a whole area of land with its own look, such as a coast or a desert. A landform is a single feature in it, such as a cliff or a sand dune.
          - title: Types of landscapes
            id: geo-types-landscapes
            brief: Landscapes include mountain, coastal, riverine, desert, rainforest and volcanic landscapes, each with its own landforms.
          - title: Weathering
            id: geo-weathering
            brief: Weathering breaks down rock where it sits, through physical processes such as heating and freezing, chemical processes and living things such as roots.
          - title: Erosion and deposition
            id: geo-erosion-deposition
            brief: Erosion carries broken rock away by water, wind or ice, and deposition drops it somewhere else, building landforms such as beaches and deltas.

      - title: How landscapes change
        id: nsw-geo-s4-2-2
        points:
          - title: Rivers shaping the land
            id: geo-rivers-shaping-land
            brief: Rivers cut valleys and gorges in their upper course and drop sediment to make floodplains and deltas lower down.
          - title: Coasts shaping the land
            id: geo-coasts-shaping-land
            brief: Waves erode headlands into cliffs, caves, arches and stacks, and carry sand along the shore to build beaches and spits.
          - title: Tectonic forces and mountains
            id: geo-tectonic-forces-mountains
            brief: Plates of the Earth's crust move slowly, and where they push together they fold rock up into mountains and cause volcanoes.
          - title: People changing landscapes
            id: geo-people-changing-landscapes
            brief: Human activities such as mining, farming, building dams and clearing land change landforms, sometimes faster than natural processes.

      - title: Valuing and protecting landscapes
        id: nsw-geo-s4-2-3
        points:
          - title: Why landscapes matter
            id: geo-landscapes-matter
            brief: People value landscapes for different reasons, such as beauty, recreation, farming, tourism, cultural meaning and spiritual meaning.
          - title: Aboriginal Peoples' connection to Country
            id: geo-aboriginal-peoples-connection-country
            brief: For Aboriginal and Torres Strait Islander Peoples, landscapes are part of Country, tied to identity, stories and law, as Uluru is for the Anangu.
          - title: Caring for Country
            id: geo-caring-country
            brief: Aboriginal Peoples have managed and cared for landscapes for tens of thousands of years, through practices such as cultural burning and protecting sacred sites.
          - title: Protecting landscapes at different scales
            id: geo-protecting-landscapes-at-different
            brief: Landscapes are protected locally by councils, nationally through national parks, and globally through World Heritage listing.

      - title: Geomorphic hazards
        id: nsw-geo-s4-2-4
        points:
          - title: What a geomorphic hazard is
            id: geo-geomorphic-hazard
            brief: A geomorphic hazard is a natural event in the land, such as an earthquake, volcanic eruption, landslide or tsunami, that can harm people.
          - title: What causes earthquakes and tsunamis
            id: geo-causes-earthquakes-tsunamis
            brief: Earthquakes happen when stress builds where plates meet and the rock suddenly slips. An earthquake under the sea can push up a tsunami.
          - title: What causes volcanic eruptions
            id: geo-causes-volcanic-eruptions
            brief: Molten rock called magma rises where plates pull apart or one plate slides under another, and erupts as lava, ash and gas.
          - title: What causes landslides
            id: geo-causes-landslides
            brief: Landslides happen when a slope gives way, often after heavy rain, an earthquake, or clearing the plants whose roots hold the soil.
          - title: Staying safe and responding to geomorphic hazards
            id: geo-staying-safe-responding-geomorphic
            brief: People stay safe by following warnings and drills, such as drop, cover and hold on, and communities respond with building rules, warning systems and recovery help.

  - title: Liveability of places
    chapters:
      - title: What makes a place liveable
        id: nsw-geo-s4-3-1
        points:
          - title: Liveability
            id: geo-liveability-2
            brief: Liveability is how well a place meets people's needs for a good life, such as safety, services, jobs, housing and a healthy environment.
          - title: Perceptions of a place
            id: geo-perceptions-place
            brief: People see the same place differently depending on their age, culture and experience, so one person's ideal place is not another's.
          - title: Why people live where they do
            id: geo-people-live-where-they
            brief: People choose where to live because of family, jobs, cost of housing, lifestyle, climate and cultural ties to a place.
          - title: Measuring liveability with data
            id: geo-measuring-liveability-with-data
            brief: Liveability can be compared with data such as crime rates, travel times, house prices and access to parks, and surveys of what residents think.

      - title: Influences on liveability
        id: nsw-geo-s4-3-2
        points:
          - title: Connections to a local area
            id: geo-connections-local-area
            brief: People and communities feel connected to a place through family, friends, culture, history and the places they gather, which makes it feel like home.
          - title: Access to services and facilities
            id: geo-access-services-facilities
            brief: Schools, hospitals, shops, public transport and internet access make a place more liveable, and remote places often have fewer of them.
          - title: Physical influences on liveability
            id: geo-physical-influences-liveability
            brief: Climate, natural hazards, landforms and access to water and green space affect how comfortable and safe a place is to live in.
          - title: Human influences on liveability
            id: geo-human-influences-liveability
            brief: Crime, traffic, pollution, noise, housing costs and job opportunities are human influences that make a place more or less liveable.

      - title: Making places more liveable
        id: nsw-geo-s4-3-3
        points:
          - title: Ways to improve liveability
            id: geo-ways-improve-liveability
            brief: Places become more liveable through better transport, more parks and trees, safer streets, affordable housing and community facilities.
          - title: Caring for Country and liveability
            id: geo-caring-country-liveability
            brief: Caring for Country supports the health, culture and wellbeing of Aboriginal communities, and knowledge of Country can make places better for everyone.
          - title: Community action on liveability
            id: geo-community-action-liveability
            brief: Local initiatives such as community gardens, clean-up days, youth spaces and council consultations get people involved in improving their area.

  - title: Water in the world
    chapters:
      - title: Water as a resource
        id: nsw-geo-s4-4-1
        points:
          - title: How people use water
            id: geo-people-use-water
            brief: People use water every day for drinking, cooking, washing and gardens, and in farming, industry and making electricity.
          - title: Sources of water
            id: geo-sources-water
            brief: Fresh water comes from rivers, lakes, dams and groundwater, and also from rainwater tanks, desalination plants and recycled water.
          - title: Where the world's water is
            id: geo-where-world-s-water
            brief: Most of the Earth's water is salty ocean, and most fresh water is locked in ice or underground, so only a tiny share is easy to reach.
          - title: The water cycle
            id: geo-water-cycle-2-nsw
            brief: Water evaporates, condenses into clouds, falls as precipitation, and runs off over land or soaks into the ground before returning to the sea.

      - title: Water scarcity and management
        id: nsw-geo-s4-4-2
        points:
          - title: How people affect water quality
            id: geo-people-affect-water-quality
            brief: Farm runoff, sewage, rubbish, industrial waste and stormwater carry pollutants into rivers, lakes and the sea.
          - title: Causes of water scarcity
            id: geo-causes-water-scarcity
            brief: Water scarcity comes from low or unreliable rainfall, drought, overuse and pollution, and from people being unable to afford or reach clean water.
          - title: Rainfall variability in Australia
            id: geo-rainfall-variability-australia
            brief: Australia is the driest inhabited continent, and its rainfall changes a lot from year to year, so droughts and floods both happen.
          - title: Managing water sustainably
            id: geo-managing-water-sustainably-nsw
            brief: Schools, homes and communities save water with tanks, water-wise gardens, fixing leaks, shorter showers and reusing grey water.
          - title: Aboriginal Peoples caring for water Country
            id: geo-aboriginal-peoples-caring-water
            brief: Aboriginal Peoples care for rivers, waterholes and wetlands as part of Country, guided by knowledge passed down over generations, such as fish traps at Brewarrina.

      - title: Hydrological and atmospheric hazards
        id: nsw-geo-s4-4-3
        points:
          - title: Types of water and weather hazards
            id: geo-types-water-weather-hazards
            brief: Hydrological hazards involve water, such as floods. Atmospheric hazards come from the weather, such as cyclones, severe storms, droughts and heatwaves.
          - title: What causes floods
            id: geo-causes-floods
            brief: Floods happen when heavy or long rain makes rivers overflow or water collects faster than the ground and drains can take it away.
          - title: What causes tropical cyclones
            id: geo-causes-tropical-cyclones
            brief: Tropical cyclones form over warm seas, where rising moist air feeds a spinning storm with very strong winds and heavy rain.
          - title: Early warning systems
            id: geo-early-warning-systems
            brief: The Bureau of Meteorology and emergency services use forecasts, flood gauges, alert levels and phone messages to warn people early.
          - title: Staying safe in floods and storms
            id: geo-staying-safe-floods-storms
            brief: People stay safe by having an emergency plan and kit, never driving through floodwater, and following the advice of the SES.

  - title: Interconnections and trade
    chapters:
      - title: How people connect
        id: nsw-geo-s4-5-1
        points:
          - title: Personal connections
            id: geo-personal-connections
            brief: People connect with family and friends in person, by phone and online, and these links can stretch to other countries.
          - title: Transport connecting people to goods
            id: geo-transport-connecting-people-goods
            brief: Roads, railways, shipping and planes move people and goods, connecting places to the things they need.
          - title: Digital connections to goods and services
            id: geo-digital-connections-goods-services
            brief: The internet lets people shop online, stream, bank and use services from anywhere, which changes how places connect.
          - title: Staying safe online
            id: geo-staying-safe-online
            brief: Cyber safety means protecting personal details, spotting scams and fake shops, using strong passwords and paying on secure sites.

      - title: Trade flows
        id: nsw-geo-s4-5-2
        points:
          - title: Goods and services in trade
            id: geo-goods-services-trade
            brief: Goods are things you can touch, such as food and phones. Services are work done for people, such as tourism, education and streaming.
          - title: Why places trade
            id: geo-places-trade
            brief: Places trade because no place can make everything it needs, so they sell what they make well and buy what they lack.
          - title: Access to goods and services
            id: geo-access-goods-services
            brief: Income, distance, transport, internet access and where people live affect which goods and services they can get.
          - title: Australia's trade
            id: geo-australia-s-trade
            brief: Australia exports resources such as iron ore, coal and gas, farm products and education, and imports cars, fuel and electronics.
          - title: Effects of trade on places
            id: geo-effects-trade-places
            brief: Trade can build ports and towns and bring jobs, but it can also harm environments through mining, shipping and transport emissions.

      - title: Production and consumption
        id: nsw-geo-s4-5-3
        points:
          - title: Impacts of producing goods
            id: geo-impacts-producing-goods
            brief: Making goods uses land, water, energy and raw materials, and can cause pollution and habitat loss where they are made.
          - title: Impacts of consuming goods
            id: geo-impacts-consuming-goods
            brief: Buying and using goods creates waste, such as packaging, clothes and electronics thrown away, which ends up in landfill or the ocean.
          - title: Sustainable production practices
            id: geo-sustainable-production-practices
            brief: Sustainable practices include using renewable energy, recycling materials, reducing packaging and fair trade that pays workers fairly.
          - title: Responsible consumption
            id: geo-responsible-consumption
            brief: People can cut the effects of what they buy by reducing, reusing, repairing and recycling, and by choosing products made sustainably.
