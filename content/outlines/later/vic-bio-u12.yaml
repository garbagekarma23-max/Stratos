units:
  - title: "Unit 1: How do organisms regulate their functions?"
    chapters:
      - title: How cells function
        id: vic-bio-u12-1-1
        points:
          - title: Cell theory
            id: bio-cell-theory-2
            brief: All living things are made of cells, the cell is the basic unit of life, and new cells come only from existing cells.
          - title: Prokaryotic and eukaryotic cells
            id: bio-prokaryotic-eukaryotic-cells-2
            brief: Prokaryotes lack a nucleus and membrane-bound organelles. Eukaryotes have both.
          - title: Organelles and their jobs
            id: bio-organelles-their-jobs-2
            brief: The nucleus holds DNA, mitochondria release energy, ribosomes make proteins and chloroplasts carry out photosynthesis.
          - title: Plant and animal cells compared
            id: bio-plant-animal-cells-compared-2
            brief: Plant cells have a cell wall, chloroplasts and a large vacuole, which animal cells lack.
          - title: The fluid mosaic model
            id: bio-fluid-mosaic-model-2
            brief: The plasma membrane is a phospholipid bilayer with proteins, cholesterol and carbohydrates moving within it.
          - title: Diffusion and osmosis
            id: bio-diffusion-osmosis-2
            brief: Diffusion is net movement from high to low concentration. Osmosis is the diffusion of water across a membrane.
          - title: Facilitated diffusion and active transport
            id: bio-facilitated-diffusion-active-transport
            brief: Facilitated diffusion uses protein channels without energy. Active transport uses ATP to move substances against a gradient.
          - title: Endocytosis and exocytosis
            id: bio-endocytosis-exocytosis
            brief: Cells take in large particles in vesicles (endocytosis) and release them (exocytosis).
          - title: Surface area to volume ratio
            id: bio-surface-area-volume-ratio-2
            brief: As a cell grows its volume rises faster than its surface area, which limits exchange and keeps cells small.

      - title: The cell cycle and specialisation
        id: vic-bio-u12-1-2
        points:
          - title: Binary fission
            id: bio-binary-fission
            brief: Prokaryotes copy their DNA and split in two, a fast form of cell division.
          - title: The eukaryotic cell cycle
            id: bio-eukaryotic-cell-cycle
            brief: Interphase (growth and DNA copying), mitosis (dividing the nucleus) and cytokinesis (dividing the cell).
          - title: Stages of mitosis
            id: bio-stages-mitosis
            brief: Prophase, metaphase, anaphase and telophase separate copied chromosomes into two identical nuclei.
          - title: Apoptosis
            id: bio-apoptosis
            brief: Programmed cell death that removes damaged or unneeded cells in a controlled way.
          - title: Cancer and the cell cycle
            id: bio-cancer-cell-cycle
            brief: Mutations in genes that control the cell cycle can lead to uncontrolled division and tumours.
          - title: Stem cells
            id: bio-stem-cells
            brief: Unspecialised cells that can divide and become specialised cells. Embryonic stem cells can become more types than adult ones.
          - title: Levels of organisation
            id: bio-levels-organisation-2
            brief: Specialised cells form tissues, tissues form organs and organs form systems.

      - title: Plant and animal systems
        id: vic-bio-u12-1-3
        points:
          - title: Water transport in plants
            id: bio-water-transport-plants
            brief: Xylem carries water up from the roots, pulled by transpiration from the leaves.
          - title: Sugar transport in plants
            id: bio-sugar-transport-plants
            brief: Phloem carries sugars from where they are made or stored to where they are used.
          - title: Stomata
            id: bio-stomata
            brief: Pores in leaves that open for gas exchange and close to save water, controlled by guard cells.
          - title: The digestive system
            id: bio-digestive-system
            brief: Organs that break food down mechanically and chemically, then absorb nutrients in the small intestine.
          - title: The endocrine system
            id: bio-endocrine-system
            brief: Glands release hormones into the blood, which act on target cells with matching receptors.
          - title: The excretory system
            id: bio-excretory-system
            brief: Kidneys filter blood, removing urea and balancing water and salts.
          - title: Homeostasis
            id: bio-homeostasis
            brief: Keeping the internal environment stable, using stimulus, receptor, control centre, effector and response.
          - title: Negative feedback
            id: bio-negative-feedback
            brief: A response that reverses a change, bringing a variable back toward its set point.
          - title: Regulating body temperature
            id: bio-regulating-body-temperature
            brief: Sweating and vasodilation lose heat; shivering and vasoconstriction keep it.
          - title: Regulating blood glucose
            id: bio-regulating-blood-glucose
            brief: Insulin lowers blood glucose and glucagon raises it. Type 1 diabetes is when the body cannot make insulin.
          - title: Regulating water balance
            id: bio-regulating-water-balance
            brief: ADH makes the kidneys reabsorb more water when the body is short of it.

  - title: "Unit 2: How does inheritance impact on diversity?"
    chapters:
      - title: How inheritance is explained
        id: vic-bio-u12-2-1
        points:
          - title: Genomes, genes and alleles
            id: bio-genomes-genes-alleles
            brief: A genome is all of an organism's DNA. A gene codes for a product, and alleles are different versions of a gene.
          - title: Chromosomes and karyotypes
            id: bio-chromosomes-karyotypes
            brief: DNA is packed into chromosomes, found in matching pairs. A karyotype shows them sorted by size.
          - title: Meiosis
            id: bio-meiosis-2
            brief: Cell division that makes four gametes, each with half the chromosome number, all genetically different.
          - title: Crossing over and independent assortment
            id: bio-crossing-over-independent-assortment
            brief: Swapping sections between paired chromosomes and the random lining-up of pairs make gametes varied.
          - title: Genotype and phenotype
            id: bio-genotype-phenotype-2
            brief: The genotype is the alleles carried. The phenotype is the trait shown, shaped by genes and environment.
          - title: Dominant, recessive and codominant alleles
            id: bio-dominant-recessive-codominant-alleles
            brief: A dominant allele shows when one copy is present. Codominant alleles both show, as in AB blood type.
          - title: Monohybrid crosses
            id: bio-monohybrid-crosses
            brief: Punnett squares predict offspring ratios from one gene, such as 3:1 from two heterozygous parents.
          - title: Test crosses
            id: bio-test-crosses
            brief: Crossing with a homozygous recessive reveals whether an individual with the dominant trait is homozygous or heterozygous.
          - title: Dihybrid crosses and linked genes
            id: bio-dihybrid-crosses-linked-genes
            brief: Two unlinked genes give a 9:3:3:1 ratio. Genes close together on a chromosome are inherited together.
          - title: Pedigree charts
            id: bio-pedigree-charts
            brief: Family charts that show whether a trait is autosomal or X-linked, and dominant or recessive.

      - title: Reproductive strategies and survival
        id: vic-bio-u12-2-2
        points:
          - title: Asexual reproduction
            id: bio-asexual-reproduction
            brief: One parent produces identical offspring, by binary fission, budding, fragmentation or vegetative propagation.
          - title: Sexual reproduction
            id: bio-sexual-reproduction
            brief: Two parents' gametes combine, so offspring vary, which helps a population survive change.
          - title: Advantages of each strategy
            id: bio-advantages-each-strategy
            brief: Asexual reproduction is fast and needs no partner. Sexual reproduction makes variation.
          - title: Reproductive cloning
            id: bio-reproductive-cloning
            brief: Techniques such as somatic cell nuclear transfer make a genetically identical organism.
          - title: Structural, physiological and behavioural adaptations
            id: bio-structural-physiological-behavioural-adaptations
            brief: Adaptations can be body features, internal processes or actions that help an organism survive.
          - title: Adaptations to Australian conditions
            id: bio-adaptations-australian-conditions
            brief: Australian plants and animals have adaptations to heat, drought and fire, such as deep roots and burrowing.
          - title: Interdependencies between species
            id: bio-interdependencies-between-species
            brief: Predator-prey, competition, mutualism, parasitism and commensalism link species in an ecosystem.
          - title: Keystone species
            id: bio-keystone-species
            brief: A species whose loss would change an ecosystem much more than its numbers suggest.
          - title: Aboriginal knowledge of ecosystems
            id: bio-aboriginal-knowledge-ecosystems
            brief: Aboriginal and Torres Strait Islander peoples hold long knowledge of species and ecosystems, including fire management.
