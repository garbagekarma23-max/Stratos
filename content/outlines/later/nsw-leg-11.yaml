# NSW Legal Studies, Year 11: The legal system, The individual and the law, and Law in practice, 31 points.
# Drafted from NESA's Legal Studies Stage 6 Syllabus (2009), the syllabus taught in Year 11 in 2026. The structure
# follows the syllabus: each part is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: the Legal Studies 11-12 Syllabus (2025) replaces this one for Year 11 from Term 1 2027. Check it
# before the first run, and redraft this outline against it if Year 11 students will use the course from 2027.

id: nsw-leg-11
subject: Legal Studies
bank: leg
name: Legal Studies, Year 11
about: HSC, The legal system and the individual
short: Legal Studies
years: [11]
place: nsw
kind: standard
syllabus: NSW Legal Studies Stage 6 Syllabus (2009), Preliminary (Year 11) course, Parts I to III
note: Follows the NSW Legal Studies syllabus. Not made or endorsed by NESA.
chips: [rule of law, precedent, separation of powers, mediation, legal aid]

units:
  - title: The legal system
    chapters:
      - title: Basic legal concepts
        id: nsw-leg-11-1-1
        points:
          - title: Rules and laws
            id: leg-rules-laws
            brief: Rules guide behaviour in groups such as families and clubs. Laws are rules made by a government that apply to everyone and are enforced by the state.
          - title: Customs, values and ethics
            id: leg-customs-values-ethics
            brief: Customs are long-held practices, values are what a society thinks is important, and ethics are ideas of right and wrong. All three shape laws.
          - title: Justice
            id: leg-justice
            brief: Justice in law means fairness, equality before the law and access to the legal system, so everyone is treated the same.
          - title: Anarchy and tyranny
            id: leg-anarchy-tyranny
            brief: Anarchy is the absence of law and order. Tyranny is cruel and unfair rule by a powerful few. Law aims to avoid both.
          - title: The rule of law
            id: leg-rule-law
            brief: Everyone, including the government, is subject to the law. Laws must be known in advance and applied fairly by independent courts.

      - title: Sources of law
        id: nsw-leg-11-1-2
        points:
          - title: Aboriginal customary law
            id: leg-aboriginal-customary-law
            brief: Aboriginal and Torres Strait Islander peoples have systems of law, passed on orally for tens of thousands of years, that govern relationships with each other and with Country.
          - title: Common law and precedent
            id: leg-common-law-precedent
            brief: Common law is law made by judges. Under precedent, courts follow the earlier decisions of higher courts in similar cases.
          - title: Statute law
            id: leg-statute-law
            brief: Laws made by parliament. A bill passes through both houses and gets royal assent to become an Act.
          - title: The Australian Constitution
            id: leg-australian-constitution
            brief: The Constitution sets up the Commonwealth and divides law-making powers between it and the states. If laws clash, Commonwealth law wins under section 109.
          - title: The separation of powers
            id: leg-separation-powers
            brief: Power is split between the legislature, which makes laws, the executive, which carries them out, and the judiciary, which interprets and applies them.
          - title: International law
            id: leg-international-law
            brief: Law between countries, made through treaties and customs. Australia is bound by a treaty it ratifies, but it usually needs an Australian law to apply here.

      - title: Classifying law and reform
        id: nsw-leg-11-1-3
        points:
          - title: Public and private law
            id: leg-public-private-law
            brief: Public law involves the state, such as criminal and constitutional law. Private law governs disputes between people, such as contracts and negligence.
          - title: Criminal and civil law
            id: leg-criminal-civil-law
            brief: Criminal law deals with offences against society, prosecuted by the state. Civil law settles disputes between parties, usually with compensation.
          - title: Why law reform happens
            id: leg-law-reform-happens
            brief: Laws change when society's values change, when new ideas of justice arise, or when new technology creates new problems.
          - title: Agencies of law reform
            id: leg-agencies-law-reform
            brief: Law reform commissions, parliamentary committees, courts, the media, lobby groups and NGOs all push for and shape changes to the law.

  - title: The individual and the law
    chapters:
      - title: Rights and responsibilities
        id: nsw-leg-11-2-1
        points:
          - title: Legal rights and responsibilities
            id: leg-legal-rights-responsibilities
            brief: A legal right is something the law entitles a person to, such as the right to vote. Each right comes with responsibilities, such as obeying the law.
          - title: Legal capacity
            id: leg-legal-capacity
            brief: The ability to make legally binding decisions. Children and some adults have limited capacity, for example in signing contracts.
          - title: How rights are protected in Australia
            id: leg-rights-are-protected-australia
            brief: Australia has no bill of rights. Rights are protected by a few express rights in the Constitution, implied rights found by courts, statutes and the common law.
          - title: Duty of care and negligence
            id: leg-duty-care-negligence
            brief: People must take reasonable care not to harm others. Breaching that duty and causing harm is negligence, which can lead to a claim for damages.

      - title: Resolving disputes
        id: nsw-leg-11-2-2
        points:
          - title: Non-legal ways to resolve disputes
            id: leg-non-legal-ways-resolve
            brief: Many disputes are settled by talking, apologising or going to an ombudsman, without lawyers or courts.
          - title: Alternative dispute resolution
            id: leg-alternative-dispute-resolution
            brief: Negotiation, mediation, conciliation and arbitration settle disputes outside court, more cheaply and quickly. Only arbitration gives a binding decision.
          - title: The NSW court hierarchy
            id: leg-nsw-court-hierarchy
            brief: The Local Court hears minor matters, the District Court more serious ones and the Supreme Court the most serious. Higher courts hear appeals from lower ones.
          - title: Federal courts and the High Court
            id: leg-federal-courts-high-court
            brief: Federal courts deal with Commonwealth law. The High Court is Australia's highest court, hears final appeals and decides constitutional questions.
          - title: Tribunals
            id: leg-tribunals
            brief: Tribunals, such as NCAT in NSW, settle disputes in areas such as tenancy and consumer claims, more informally and cheaply than courts.
          - title: The adversarial system
            id: leg-adversarial-system
            brief: Two sides present their cases to an impartial judge or jury, who decides on the evidence. Critics say it favours those who can pay for better lawyers.

      - title: Access to justice
        id: nsw-leg-11-2-3
        points:
          - title: Legal aid and community legal centres
            id: leg-legal-aid-community-legal
            brief: Legal Aid NSW and community legal centres give free or cheap advice and representation to people who cannot afford a lawyer.
          - title: Barriers to justice
            id: leg-barriers-justice
            brief: Cost, delays, distance, language, disability and a lack of knowledge of the law stop some people using the legal system.
          - title: Technology and the individual
            id: leg-technology-individual
            brief: New technology raises legal issues for individuals, such as privacy online, cyberbullying, surveillance and who owns content shared online.

  - title: Law in practice
    chapters:
      - title: Studying law in practice
        id: nsw-leg-11-3-1
        points:
          - title: Using legal sources
            id: leg-using-legal-sources
            brief: Legislation, court decisions, law reform reports, media reports and NGO statements are the evidence for a legal argument.
          - title: Evaluating the effectiveness of the law
            id: leg-evaluating-effectiveness-law
            brief: Judging whether a law achieves justice by asking whether it is fair, accessible, enforceable, protects rights and balances the interests of society.
          - title: Themes in legal issues
            id: leg-themes-legal-issues
            brief: Recurring questions include how law balances individual rights with the needs of society, and whether law keeps up with change.
