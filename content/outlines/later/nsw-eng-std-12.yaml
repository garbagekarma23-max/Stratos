# NSW English Standard, Year 12: the four Year 12 focus areas, 28 points.
# Drafted from NESA's English Standard 11-12 Syllabus (2024), taught in Year 12 from Term 4 2026 and first examined in
# the 2027 HSC. The structure follows the syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Shares the eng bank with English Advanced. Titles differ from the Advanced course so the ids never clash.
# No points on a particular prescribed text yet: schools pick their texts from NESA's 2027 to 2028 list.

id: nsw-eng-std-12
subject: English
bank: eng
name: English Standard, Year 12
about: HSC, Human experiences, identity and craft
short: English Standard
years: [12]
place: nsw
kind: english
syllabus: NSW English Standard 11-12 Syllabus (2024), Year 12 focus areas
note: Follows the NSW English Standard syllabus. Not made or endorsed by NESA.
chips: [human experience, identity, dialect, voice, reflection]

units:
  - title: Texts and human experiences
    chapters:
      - title: Exploring human experience
        id: nsw-eng-std-12-1-1
        points:
          - title: What human experience means
            id: eng-human-experience-means
            brief: Human experiences are the events, feelings and relationships people go through, such as love, loss, fear, hope and belonging. Texts explore them so readers can understand people better.
          - title: Shared and personal experiences
            id: eng-shared-personal-experiences
            brief: Some experiences happen to one person and some to whole groups. Texts can show how a personal moment connects to a wider shared one.
          - title: Why people act as they do
            id: eng-people-act-as-they
            brief: Characters act from motives such as fear, love or pride, and sometimes act against what they believe. Texts invite readers to ask why.
          - title: Experiences that change people
            id: eng-experiences-that-change-people
            brief: Many texts show a character changed by an experience. Students explain what changed and how the writer shows it.

      - title: Showing experience in texts
        id: nsw-eng-std-12-1-2
        points:
          - title: Techniques that show feelings
            id: eng-techniques-that-show-feelings
            brief: Imagery, dialogue, symbolism and point of view let a writer show feelings without stating them. Students link a technique to the feeling it creates.
          - title: Linking texts to the question
            id: eng-linking-texts-question
            brief: In an essay on human experiences, each paragraph should name an experience, show how the text represents it and explain what the text suggests about people.
          - title: Short answers on unseen texts
            id: eng-short-answers-unseen-texts
            brief: Exam questions give short extracts and ask how a technique shows an experience. Answer with one clear technique, an example and its effect.

  - title: Language, identity and culture
    chapters:
      - title: Language and who we are
        id: nsw-eng-std-12-2-1
        points:
          - title: Language and identity
            id: eng-language-identity
            brief: The way a person speaks and writes shows where they come from, who they belong with and how they see themselves.
          - title: Accent, dialect and slang
            id: eng-accent-dialect-slang
            brief: Dialects and accents are varieties of a language tied to place or community, and slang is informal language that changes fast. None is wrong; each signals belonging.
          - title: Australian English
            id: eng-australian-english
            brief: Australian English has its own words, sounds and humour, shaped by British settlement, migration and Aboriginal languages. Texts use it to show Australian identity.
          - title: Code-switching
            id: eng-code-switching
            brief: Changing how you speak depending on who you are with, such as with friends, family or a teacher. Texts show code-switching to explore belonging between cultures.
          - title: First Nations voices in texts
            id: eng-first-nations-voices-texts
            brief: Texts by Aboriginal and Torres Strait Islander writers and storytellers share experiences of culture, Country and identity in their own words, and can challenge older stories told about them.

      - title: Culture in texts
        id: nsw-eng-std-12-2-2
        points:
          - title: Representing culture
            id: eng-representing-culture
            brief: Texts represent cultures through characters, settings, language and traditions. Readers ask whether a representation is fair, who made it and whose voice is heard.
          - title: Stereotypes in texts
            id: eng-stereotypes-texts
            brief: A stereotype is a fixed, oversimplified idea about a group. Some texts repeat stereotypes and others break them down by showing real complexity.
          - title: Migrant and multilingual voices
            id: eng-migrant-multilingual-voices
            brief: Texts about migration often mix languages and explore living between two cultures, including the loss and gain that come with it.
          - title: Writing about identity in texts
            id: eng-writing-about-identity-texts
            brief: An essay on identity explains how specific language choices in a text shape a character's or speaker's sense of self.

  - title: Close study of literature
    chapters:
      - title: Knowing a text well
        id: nsw-eng-std-12-3-1
        points:
          - title: The text's central concerns
            id: eng-text-s-central-concerns
            brief: Identifying the main ideas a studied text keeps returning to and stating each one as a clear sentence about people or society.
          - title: Important moments in a text
            id: eng-important-moments-text
            brief: Knowing the turning points of a studied text well enough to use them as evidence, and explaining why each one matters.
          - title: How a character is built
            id: eng-character-built
            brief: Explaining the techniques that build a main character, such as what they say, their actions and how other characters see them.
          - title: The writer's purpose
            id: eng-writer-s-purpose
            brief: Asking what the writer wanted readers to think or feel, and finding evidence in the text for that purpose.

      - title: Essays on a studied text
        id: nsw-eng-std-12-3-2
        points:
          - title: A clear line of argument
            id: eng-clear-line-argument
            brief: An essay that holds one main answer to the question from start to finish, with each paragraph adding a reason.
          - title: Analysing rather than retelling
            id: eng-analysing-rather-than-retelling
            brief: Retelling says what happens. Analysis explains how and why the writer makes it happen and what it means.
          - title: Ending an essay
            id: eng-ending-essay
            brief: A conclusion sums up the answer to the question and the main points, without new evidence.

  - title: The craft of writing
    chapters:
      - title: Crafting a short piece
        id: nsw-eng-std-12-4-1
        points:
          - title: Writing for a set purpose
            id: eng-writing-set-purpose
            brief: Exam writing tasks set a purpose, audience or stimulus. Read them carefully and make sure the piece clearly does what was asked.
          - title: Using a stimulus
            id: eng-using-stimulus
            brief: A stimulus, such as an image, quote or object, is a starting point. Use it in a central way, not as a passing mention.
          - title: Narrative voice in your own writing
            id: eng-narrative-voice-your-own
            brief: Choosing first or third person and keeping it steady. A clear, consistent narrator helps the reader follow and connect.
          - title: Vivid detail in your own writing
            id: eng-vivid-detail-your-own
            brief: Choosing a few sharp, specific details that make a scene real, rather than many general ones.
          - title: Reflecting on your writing
            id: eng-reflecting-your-writing
            brief: A reflection explains the choices you made, such as form, techniques or structure, and why they suit the purpose.
