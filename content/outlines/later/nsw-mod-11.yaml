# NSW Modern History, Year 11: Investigating modern history and The shaping of the modern world, 21 points.
# Drafted from NESA's Modern History Stage 6 Syllabus (2017), the syllabus taught in Year 11 in 2026. The structure
# follows the syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Schools choose their own case studies and Shaping of the modern world study. This outline covers the methods every
# student needs and one common choice, World War I. Other choices can be added as chapters.
# In transition: the Modern History 11-12 Syllabus (2024) replaces this one for Year 11 from Term 1 2027. Check it
# before the first run, and redraft this outline against it if Year 11 students will use the course from 2027.

id: nsw-mod-11
subject: Modern History
bank: mod
name: Modern History, Year 11
about: HSC, Historical methods and World War I
short: Modern History
years: [11]
place: nsw
kind: standard
syllabus: NSW Modern History Stage 6 Syllabus (2017), Year 11 course
note: Follows the NSW Modern History syllabus. Not made or endorsed by NESA.
chips: [primary source, historiography, perspective, Western Front, Treaty of Versailles]

units:
  - title: Investigating modern history
    chapters:
      - title: The nature of modern history
        id: nsw-mod-11-1-1
        points:
          - title: Primary and secondary sources
            id: mod-primary-secondary-sources
            brief: A primary source comes from the time studied, such as a letter or photograph. A secondary source is made later, such as a textbook. Both can be useful.
          - title: Usefulness and reliability
            id: mod-usefulness-reliability
            brief: A source's usefulness depends on the question asked. Its reliability depends on who made it, when, why and for whom.
          - title: Perspective and bias
            id: mod-perspective-bias
            brief: Every source has a point of view shaped by its creator's position. Bias does not make a source useless; it shows what that person believed or wanted others to believe.
          - title: Historiography
            id: mod-historiography
            brief: The study of how history has been written. Historians interpret the same events differently depending on their evidence, methods and own time.
          - title: History and memory
            id: mod-history-memory
            brief: How societies remember the past through commemoration, monuments and stories can differ from what historians find in the evidence.
          - title: Contested history
            id: mod-contested-history
            brief: Some events, such as the frontier wars in Australia, are debated because of new evidence, different values or political interests.

      - title: Investigating the past
        id: nsw-mod-11-1-2
        points:
          - title: Asking a historical question
            id: mod-asking-historical-question
            brief: A good inquiry question is open, focused on a time and place, and can be answered from evidence, such as why something changed.
          - title: Finding and checking sources
            id: mod-finding-checking-sources
            brief: Using libraries, archives and trusted websites, and checking where an online source came from before relying on it.
          - title: Referencing sources
            id: mod-referencing-sources
            brief: Recording where each piece of evidence came from, so readers can check it and the work is not plagiarised.
          - title: Building a historical argument
            id: mod-building-historical-argument
            brief: Making a clear claim, supporting it with evidence from several sources, and dealing with evidence that points the other way.
          - title: Causation and significance
            id: mod-causation-significance
            brief: Historians explain events through causes, both long-term and short-term, and judge significance by how much an event changed things and for how long.

  - title: The shaping of the modern world
    chapters:
      - title: World War I, causes and outbreak
        id: nsw-mod-11-2-1
        points:
          - title: Long-term causes of World War I
            id: mod-long-term-causes-world
            brief: Militarism, rival alliances, imperial competition and nationalism raised tensions among the great powers of Europe before 1914.
          - title: The July Crisis
            id: mod-july-crisis
            brief: The assassination of Archduke Franz Ferdinand in Sarajevo on 28 June 1914 set off a chain of ultimatums and mobilisations that brought war by early August.
          - title: The alliance systems
            id: mod-alliance-systems
            brief: The Triple Entente of Britain, France and Russia faced the Central Powers, led by Germany and Austria-Hungary, turning a regional crisis into a European war.
          - title: Why people supported the war
            id: mod-people-supported-war
            brief: Patriotism, belief in a short war, propaganda and duty to empire led many to welcome the war in 1914, including in Australia.

      - title: World War I, the war and its end
        id: nsw-mod-11-2-2
        points:
          - title: The Western Front
            id: mod-western-front
            brief: After 1914 the war in France and Belgium became a stalemate of trenches, where machine guns and artillery made attacks very costly.
          - title: New technology in war
            id: mod-new-technology-war
            brief: Poison gas, tanks, aircraft and submarines changed warfare but did not end the stalemate quickly.
          - title: Total war and the home front
            id: mod-total-war-home-front
            brief: Governments took control of industry, food and information, and women took on new kinds of work. Conscription divided Australia in two referendums.
          - title: Why the war ended
            id: mod-war-ended
            brief: Germany's last offensive failed in 1918, the United States entered the war, and blockade and exhaustion led Germany to accept an armistice on 11 November.
          - title: The peace settlement
            id: mod-peace-settlement
            brief: The Treaty of Versailles of 1919 blamed Germany for the war, took territory, cut its army and set reparations. It created the League of Nations.
          - title: Effects of World War I
            id: mod-effects-world-war-i
            brief: About 20 million people died. Empires collapsed, new nations formed, and bitterness over the peace helped cause later conflict.
