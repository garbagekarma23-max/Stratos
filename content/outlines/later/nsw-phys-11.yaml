# NSW Physics, Year 11: Modules 1 to 4, 46 points.
# Drafted from NESA's Physics Stage 6 Syllabus (2017), the syllabus taught in Year 11 in 2026. The structure follows the
# syllabus: each module is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: the Physics 11-12 Syllabus (2025) replaces this one for Year 11 from Term 1 2027. Check it before the
# first run, and redraft this outline against it if Year 11 students will use the course from 2027.

id: nsw-phys-11
subject: Physics
bank: phys
name: Physics, Year 11
about: HSC, Motion, forces, waves, heat and electricity
short: Physics
years: [11]
place: nsw
kind: standard
syllabus: NSW Physics Stage 6 Syllabus (2017), Year 11 course, Modules 1 to 4
note: Follows the NSW Physics syllabus. Not made or endorsed by NESA.
chips: [velocity, momentum, refraction, specific heat, resistance]

units:
  - title: Kinematics
    chapters:
      - title: Motion in a straight line
        id: nsw-phys-11-1-1
        points:
          - title: Scalars and vectors
            id: phys-scalars-vectors
            brief: A scalar has size only, such as distance and speed. A vector has size and direction, such as displacement and velocity.
          - title: Speed and velocity
            id: phys-speed-velocity
            brief: Average speed is distance over time. Average velocity is displacement over time, so a round trip has zero average velocity.
          - title: Acceleration
            id: phys-acceleration
            brief: Acceleration is the rate of change of velocity, a = (v - u)/t, in m/s². Slowing down is acceleration opposite to the motion.
          - title: Graphs of motion
            id: phys-graphs-motion
            brief: On a displacement-time graph the gradient is velocity. On a velocity-time graph the gradient is acceleration and the area is displacement.
          - title: Equations of uniform acceleration
            id: phys-equations-uniform-acceleration
            brief: v = u + at, s = ut + ½at² and v² = u² + 2as, used when acceleration is constant.

      - title: Motion in two dimensions
        id: nsw-phys-11-1-2
        points:
          - title: Adding vectors
            id: phys-adding-vectors
            brief: Adding vectors head to tail, and finding the resultant's size with Pythagoras and its direction with trigonometry.
          - title: Components of vectors
            id: phys-components-vectors
            brief: Splitting a vector into horizontal and vertical parts so each can be treated on its own.
          - title: Relative velocity
            id: phys-relative-velocity
            brief: The velocity of one object as seen from another, such as a boat crossing a flowing river or a plane in a crosswind.

  - title: Dynamics
    chapters:
      - title: Forces
        id: nsw-phys-11-2-1
        points:
          - title: Newton's first law
            id: phys-newton-s-first-law
            brief: An object stays at rest or keeps moving at constant velocity unless a net force acts on it. This is inertia.
          - title: Newton's second law
            id: phys-newton-s-second-law
            brief: Net force equals mass times acceleration, F = ma. A bigger net force or a smaller mass gives a bigger acceleration.
          - title: Newton's third law
            id: phys-newton-s-third-law
            brief: Forces come in pairs. When one object pushes on another, the second pushes back equally and oppositely on the first.
          - title: Weight, normal force and friction
            id: phys-weight-normal-force-friction
            brief: Weight is mg. The normal force acts at right angles to a surface. Friction opposes sliding and depends on the surfaces and the normal force.
          - title: Forces on a slope
            id: phys-forces-slope
            brief: On an incline, weight splits into a part along the slope and a part into it, which explains why objects slide.

      - title: Energy and work
        id: nsw-phys-11-2-2
        points:
          - title: Work
            id: phys-work
            brief: Work is done when a force moves an object along its direction, W = Fs, measured in joules.
          - title: Kinetic and potential energy
            id: phys-kinetic-potential-energy
            brief: Kinetic energy is ½mv². Gravitational potential energy near the Earth's surface is mgh.
          - title: Conservation of energy
            id: phys-conservation-energy
            brief: Energy changes form but the total stays the same. Ignoring friction, potential energy lost equals kinetic energy gained.
          - title: Power
            id: phys-power
            brief: Power is the rate of doing work, P = W/t, measured in watts. It is also force times velocity.

      - title: Momentum
        id: nsw-phys-11-2-3
        points:
          - title: Momentum
            id: phys-momentum
            brief: Momentum is mass times velocity, p = mv, a vector.
          - title: Impulse
            id: phys-impulse
            brief: Impulse is force times time, which equals the change in momentum. Airbags and crumple zones lengthen the time to lower the force.
          - title: Conservation of momentum
            id: phys-conservation-momentum
            brief: In a closed system, total momentum before a collision equals total momentum after.
          - title: Elastic and inelastic collisions
            id: phys-elastic-inelastic-collisions
            brief: In an elastic collision kinetic energy is conserved. In an inelastic one some becomes heat, sound or changes shape. Momentum is conserved in both.

  - title: Waves and thermodynamics
    chapters:
      - title: Wave properties
        id: nsw-phys-11-3-1
        points:
          - title: Transverse and longitudinal waves
            id: phys-transverse-longitudinal-waves
            brief: In transverse waves the medium moves at right angles to the wave, as in a rope. In longitudinal waves it moves along the wave, as in sound.
          - title: Describing waves
            id: phys-describing-waves
            brief: Amplitude, wavelength, frequency and period describe a wave, and wave speed v = fλ.
          - title: Reflection, refraction and diffraction
            id: phys-reflection-refraction-diffraction
            brief: Waves bounce off surfaces, change speed and direction entering a new medium, and spread out through gaps and around edges.
          - title: Superposition and standing waves
            id: phys-superposition-standing-waves
            brief: Overlapping waves add together. On a string fixed at both ends this makes standing waves with nodes and antinodes.
          - title: Resonance
            id: phys-resonance
            brief: An object vibrates strongly when pushed at its natural frequency, as when a singer shatters a glass.

      - title: Sound and light
        id: nsw-phys-11-3-2
        points:
          - title: Sound waves
            id: phys-sound-waves
            brief: Sound is a longitudinal wave of compressions and rarefactions. Pitch depends on frequency and loudness on amplitude.
          - title: The Doppler effect
            id: phys-doppler-effect
            brief: A source moving towards you sounds higher in pitch, and lower as it moves away, because the waves bunch up or spread out.
          - title: Beats
            id: phys-beats
            brief: Two sounds of close frequencies combine into a sound that rises and falls in loudness. The beat frequency is the difference between them.
          - title: Refraction of light and Snell's law
            id: phys-refraction-light-snell-s
            brief: Light bends entering a material with a different refractive index, n₁ sin θ₁ = n₂ sin θ₂.
          - title: Total internal reflection
            id: phys-total-internal-reflection
            brief: Beyond the critical angle, light inside a denser material reflects completely, which is how optical fibres carry signals.
          - title: The inverse square law
            id: phys-inverse-square-law
            brief: The intensity of light from a point source falls with the square of the distance, so twice as far gives a quarter of the intensity.

      - title: Thermodynamics
        id: nsw-phys-11-3-3
        points:
          - title: Temperature and heat
            id: phys-temperature-heat
            brief: Temperature measures the average kinetic energy of particles. Heat is energy moving from hotter to colder objects until they reach thermal equilibrium.
          - title: Specific heat capacity
            id: phys-specific-heat-capacity
            brief: The energy needed to raise 1 kg of a substance by 1 K, used in Q = mcΔT. Water's high value keeps coastal climates mild.
          - title: Latent heat
            id: phys-latent-heat
            brief: Energy absorbed or released when a substance changes state without changing temperature, Q = mL.
          - title: Conduction, convection and radiation
            id: phys-conduction-convection-radiation
            brief: Heat moves through contact, through the movement of fluids and as electromagnetic radiation, which needs no medium.

  - title: Electricity and magnetism
    chapters:
      - title: Electric charge and fields
        id: nsw-phys-11-4-1
        points:
          - title: Electric charge
            id: phys-electric-charge
            brief: Charge comes in positive and negative. Like charges repel and unlike attract. Charge is measured in coulombs.
          - title: Coulomb's law
            id: phys-coulomb-s-law
            brief: The force between two charges is proportional to the product of the charges and inversely proportional to the square of the distance between them.
          - title: Electric fields
            id: phys-electric-fields
            brief: A field around a charge exerts a force on other charges, E = F/q. Field lines point from positive to negative.
          - title: Potential difference
            id: phys-potential-difference
            brief: The work done per unit charge moving between two points, measured in volts.

      - title: Circuits and magnetism
        id: nsw-phys-11-4-2
        points:
          - title: Current
            id: phys-current
            brief: Current is the rate of flow of charge, I = q/t, measured in amperes.
          - title: Ohm's law and resistance
            id: phys-ohm-s-law-resistance
            brief: V = IR for an ohmic conductor. Resistance depends on the material, length, cross-section and temperature.
          - title: Series and parallel circuits
            id: phys-series-parallel-circuits
            brief: In series, current is the same everywhere and resistances add. In parallel, voltage is the same across each branch and the total resistance is lower.
          - title: Power in circuits
            id: phys-power-circuits
            brief: Electrical power P = VI = I²R, and energy used is power times time.
          - title: Magnetic fields from currents
            id: phys-magnetic-fields-from-currents
            brief: A current in a wire makes a circular magnetic field around it. A coil, or solenoid, makes a field like a bar magnet's.
          - title: Magnetic materials
            id: phys-magnetic-materials
            brief: Iron, nickel and cobalt can be magnetised because their tiny magnetic regions line up.
