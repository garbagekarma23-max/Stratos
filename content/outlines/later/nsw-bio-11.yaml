# NSW Biology, Year 11: Modules 1 to 4, 42 points.
# Drafted from NESA's Biology Stage 6 Syllabus (2017), the syllabus taught in Year 11 in 2026. The structure follows the
# syllabus: each module is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: the Biology 11-12 Syllabus (2025) replaces this one for Year 11 from Term 1 2027. Check it before the
# first run, and redraft this outline against it if Year 11 students will use the course from 2027.

id: nsw-bio-11
subject: Biology
bank: bio
name: Biology, Year 11
about: HSC, Cells, organisation, diversity and ecosystems
short: Biology
years: [11]
place: nsw
kind: standard
syllabus: NSW Biology Stage 6 Syllabus (2017), Year 11 course, Modules 1 to 4
note: Follows the NSW Biology syllabus. Not made or endorsed by NESA.
chips: [organelle, osmosis, enzyme, natural selection, trophic level]

units:
  - title: Cells as the basis of life
    chapters:
      - title: Cell structure
        id: nsw-bio-11-1-1
        points:
          - title: Cell theory
            id: bio-cell-theory
            brief: All living things are made of cells, the cell is the basic unit of life, and all cells come from existing cells. Microscopes made this theory possible.
          - title: Prokaryotic and eukaryotic cells
            id: bio-prokaryotic-eukaryotic-cells
            brief: Prokaryotes, such as bacteria, have no nucleus or membrane-bound organelles. Eukaryotes, such as plant and animal cells, have both and are usually larger.
          - title: Organelles and their jobs
            id: bio-organelles-their-jobs
            brief: The nucleus holds DNA, mitochondria release energy, ribosomes make proteins, the endoplasmic reticulum and Golgi body make and package molecules, and chloroplasts carry out photosynthesis.
          - title: Plant and animal cells compared
            id: bio-plant-animal-cells-compared
            brief: Plant cells have a cell wall, chloroplasts and a large vacuole, which animal cells lack.
          - title: Light and electron microscopes
            id: bio-light-electron-microscopes
            brief: Light microscopes show living cells in colour at lower magnification. Electron microscopes show far finer detail but need dead, prepared samples.

      - title: Cell function
        id: nsw-bio-11-1-2
        points:
          - title: The fluid mosaic model
            id: bio-fluid-mosaic-model
            brief: The cell membrane is a double layer of phospholipids with proteins scattered through it, which can move sideways. It controls what enters and leaves.
          - title: Diffusion and osmosis
            id: bio-diffusion-osmosis
            brief: Diffusion is the net movement of particles from high to low concentration. Osmosis is the diffusion of water across a partly permeable membrane. Neither needs energy.
          - title: Active transport, endocytosis and exocytosis
            id: bio-active-transport-endocytosis-exocytosis
            brief: Active transport uses energy to move substances against a concentration gradient. Endocytosis takes in large particles in vesicles, and exocytosis releases them.
          - title: Surface area to volume ratio
            id: bio-surface-area-volume-ratio
            brief: As a cell grows, its volume rises faster than its surface area, so exchange becomes too slow. This limits cell size and explains the shapes of some cells.
          - title: Enzymes
            id: bio-enzymes
            brief: Enzymes are proteins that speed up reactions. Each fits a particular substrate, and temperature, pH and substrate concentration change how fast it works.
          - title: Photosynthesis and respiration
            id: bio-photosynthesis-respiration
            brief: Photosynthesis uses light to make glucose and oxygen from carbon dioxide and water. Cellular respiration releases energy from glucose, mostly in mitochondria.

  - title: Organisation of living things
    chapters:
      - title: From cells to systems
        id: nsw-bio-11-2-1
        points:
          - title: Unicellular, colonial and multicellular organisms
            id: bio-unicellular-colonial-multicellular-organisms
            brief: Unicellular organisms are one cell. Colonial organisms are groups of cells that live together. Multicellular organisms have specialised cells that depend on each other.
          - title: Levels of organisation
            id: bio-levels-organisation
            brief: Cells form tissues, tissues form organs, and organs form systems, each level with a job the one below cannot do alone.
          - title: Cell differentiation
            id: bio-cell-differentiation
            brief: Cells in a multicellular organism become specialised for a task, such as nerve cells for signals, because different genes are switched on.
          - title: Autotrophs and heterotrophs
            id: bio-autotrophs-heterotrophs
            brief: Autotrophs, such as plants, make their own food. Heterotrophs, such as animals, get nutrients by eating other organisms.
          - title: Digestive systems
            id: bio-digestive-systems
            brief: Animals break food down mechanically and chemically, absorb the nutrients and remove waste. Gut structure differs between herbivores and carnivores.

      - title: Exchange and transport
        id: nsw-bio-11-2-2
        points:
          - title: Gas exchange in plants
            id: bio-gas-exchange-plants
            brief: Plants exchange gases through stomata, mainly on the underside of leaves. Guard cells open and close them, balancing gas exchange against water loss.
          - title: Gas exchange in animals
            id: bio-gas-exchange-animals
            brief: Animals exchange gases across moist, thin surfaces with large areas, such as lungs, gills or skin.
          - title: Transport in plants
            id: bio-transport-plants
            brief: Xylem carries water and minerals up from the roots, pulled by transpiration. Phloem carries sugars from where they are made to where they are needed.
          - title: Circulatory systems
            id: bio-circulatory-systems
            brief: Open circulatory systems bathe organs in fluid. Closed ones, as in mammals, keep blood in vessels pumped by a heart, which is faster and more controlled.
          - title: Blood and its parts
            id: bio-blood-parts
            brief: Red blood cells carry oxygen, white blood cells fight infection, platelets help clotting, and plasma carries dissolved nutrients, wastes and hormones.

  - title: Biological diversity
    chapters:
      - title: Adaptation and selection
        id: nsw-bio-11-3-1
        points:
          - title: Selection pressures
            id: bio-selection-pressures
            brief: Biotic and abiotic factors, such as predators, disease, drought or temperature, that affect which individuals survive and reproduce.
          - title: Structural adaptations
            id: bio-structural-adaptations
            brief: Physical features that help survival, such as a kangaroo's long tail for balance or the thick leaves of desert plants.
          - title: Physiological adaptations
            id: bio-physiological-adaptations
            brief: Internal body processes that help survival, such as producing very concentrated urine to save water.
          - title: Behavioural adaptations
            id: bio-behavioural-adaptations
            brief: Things organisms do that help survival, such as being active at night in hot climates or migrating with the seasons.
          - title: Natural selection
            id: bio-natural-selection
            brief: Individuals vary, some variations help survival and reproduction, and those are passed on more often. Over generations a population changes. Darwin and Wallace set out this idea.

      - title: Evolution
        id: nsw-bio-11-3-2
        points:
          - title: Evidence from fossils
            id: bio-evidence-from-fossils
            brief: Fossils show organisms changing through time, and transitional fossils show features of both older and newer groups.
          - title: Evidence from anatomy and embryos
            id: bio-evidence-from-anatomy-embryos
            brief: Homologous structures, such as the bones in a human arm and a whale flipper, suggest shared ancestry. Similar early embryos point the same way.
          - title: Evidence from biochemistry
            id: bio-evidence-from-biochemistry
            brief: Comparing DNA and protein sequences shows how closely species are related. More differences mean a longer time since a shared ancestor.
          - title: Speciation
            id: bio-speciation
            brief: When populations are separated, often by geography, and change until they can no longer breed together, a new species forms.
          - title: Divergent and convergent evolution
            id: bio-divergent-convergent-evolution
            brief: Divergent evolution is related species becoming different. Convergent evolution is unrelated species becoming similar because they face similar pressures.
          - title: Gradualism and punctuated equilibrium
            id: bio-gradualism-punctuated-equilibrium
            brief: Gradualism says change is slow and steady. Punctuated equilibrium says long stable periods are broken by short bursts of rapid change.

  - title: Ecosystem dynamics
    chapters:
      - title: How ecosystems work
        id: nsw-bio-11-4-1
        points:
          - title: Biotic and abiotic factors
            id: bio-biotic-abiotic-factors
            brief: Living factors, such as predators and competitors, and non-living factors, such as light, water and soil, shape where organisms live and how many there are.
          - title: Food chains, webs and energy flow
            id: bio-food-chains-webs-energy
            brief: Energy passes from producers to consumers. Only about 10% passes to each higher trophic level, which limits how long food chains can be.
          - title: Relationships between species
            id: bio-relationships-between-species
            brief: Predation, competition, mutualism (both gain), commensalism (one gains, the other is unaffected) and parasitism (one gains at the other's cost).
          - title: Predator and prey populations
            id: bio-predator-prey-populations
            brief: Predator numbers rise and fall after prey numbers, giving linked cycles.
          - title: Measuring populations
            id: bio-measuring-populations
            brief: Quadrats estimate the abundance of plants and slow animals. Capture, mark and recapture estimates the size of a mobile animal population.

      - title: Past and future ecosystems
        id: nsw-bio-11-4-2
        points:
          - title: Evidence of past ecosystems
            id: bio-evidence-past-ecosystems
            brief: Fossils, pollen in sediments, rock layers and ice cores show what past environments were like and how they changed.
          - title: Human impact on ecosystems
            id: bio-human-impact-ecosystems
            brief: Land clearing, introduced species, pollution and climate change alter ecosystems and can cause extinctions.
          - title: Aboriginal land management
            id: bio-aboriginal-land-management
            brief: Aboriginal and Torres Strait Islander peoples have managed Country for tens of thousands of years, including cultural burning that shapes vegetation and lowers fuel loads.
          - title: Invasive species
            id: bio-invasive-species
            brief: Introduced species, such as cane toads and foxes in Australia, can spread fast without natural predators and harm native species.
          - title: Conserving ecosystems
            id: bio-conserving-ecosystems
            brief: Protected areas, restoring habitat, controlling pests and monitoring threatened species help keep ecosystems working for the future.
