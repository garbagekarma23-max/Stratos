# VCE Biology, Units 3 and 4: how cells maintain life, and how life changes and responds to challenges, 54 points.
# Drafted from the VCAA's VCE Biology Study Design (2022), whose accreditation ends 31 December 2026. The structure
# follows that study design: each unit is a unit here, and each area of study is a chapter, or two when it is large.
# The investigation is school-run, so it is not here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Held back in later/: redraft it against the study design that replaces the 2022 one before running it.
# NSW Biology Year 12 (the bio bank) shares much of this, so expect reuses and adapts.

id: vic-bio-u34
subject: Biology
bank: bio
name: Biology, Units 3 and 4
about: VCE, DNA, biochemistry, immunity and evolution
short: Biology
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE Biology Study Design (2022 to 2026), Units 3 and 4
note: Follows the VCE Biology study design. Not made or endorsed by the VCAA.
chips: [transcription, CRISPR-Cas9, photosynthesis, antibody, natural selection]

units:
  - title: "Unit 3: How do cells maintain life?"
    chapters:
      - title: Nucleic acids and proteins
        id: vic-bio-u34-1-1
        points:
          - title: The structure of DNA and RNA
            id: bio-structure-dna-rna
            brief: Nucleic acids are chains of nucleotides. DNA is double-stranded with thymine; RNA is single-stranded with uracil.
          - title: Gene structure
            id: bio-gene-structure
            brief: A gene has a promoter, exons that code and introns that are removed, and the genetic code reads in triplets.
          - title: Transcription
            id: bio-transcription
            brief: RNA polymerase copies a gene's template strand into pre-mRNA in the nucleus.
          - title: RNA processing
            id: bio-rna-processing
            brief: Pre-mRNA has introns removed, a cap and a poly-A tail added, making mature mRNA.
          - title: Translation
            id: bio-translation
            brief: Ribosomes read mRNA codons and tRNA brings matching amino acids, building a polypeptide.
          - title: Gene regulation and the trp operon
            id: bio-gene-regulation-trp-operon
            brief: In bacteria, the trp operon is switched off by a repressor when tryptophan is plentiful, saving energy.
          - title: Protein structure
            id: bio-protein-structure
            brief: Proteins have primary, secondary, tertiary and sometimes quaternary structure, and shape sets their function.
          - title: The protein secretory pathway
            id: bio-protein-secretory-pathway
            brief: Proteins made on the rough ER move through the Golgi apparatus in vesicles and leave the cell by exocytosis.

      - title: DNA manipulation
        id: vic-bio-u34-1-2
        points:
          - title: Enzymes that manipulate DNA
            id: bio-enzymes-that-manipulate-dna
            brief: Endonucleases cut DNA, ligases join it and polymerases build it.
          - title: CRISPR-Cas9
            id: bio-crispr-cas9
            brief: A bacterial defence adapted to edit genes, where a guide RNA leads Cas9 to cut DNA at a chosen place.
          - title: The polymerase chain reaction
            id: bio-polymerase-chain-reaction
            brief: PCR copies DNA in cycles of denaturing, annealing primers and extending, making millions of copies.
          - title: Gel electrophoresis
            id: bio-gel-electrophoresis
            brief: An electric current pulls DNA fragments through a gel, where shorter ones move further.
          - title: Recombinant plasmids
            id: bio-recombinant-plasmids
            brief: A gene is cut and joined into a plasmid, which is put into bacteria by transformation so they make its product.
          - title: Genetically modified and transgenic organisms
            id: bio-genetically-modified-transgenic-organisms
            brief: A GMO has altered DNA. A transgenic organism carries a gene from another species, such as pest-resistant crops.
          - title: Ethics of gene technology
            id: bio-ethics-gene-technology
            brief: Gene technology raises questions about safety, access, consent and effects on farmers and ecosystems.

      - title: Biochemical pathways
        id: vic-bio-u34-1-3
        points:
          - title: Enzymes as catalysts
            id: bio-enzymes-as-catalysts
            brief: Enzymes lower activation energy. The active site binds a matching substrate, as in the induced fit model.
          - title: Factors affecting enzymes
            id: bio-factors-affecting-enzymes
            brief: Temperature, pH, and substrate and enzyme concentration change the rate of enzyme reactions.
          - title: Enzyme inhibition
            id: bio-enzyme-inhibition
            brief: Competitive inhibitors block the active site. Non-competitive inhibitors bind elsewhere and change its shape.
          - title: Coenzymes
            id: bio-coenzymes
            brief: Molecules such as ATP, NADH and NADPH carry energy, electrons or hydrogen between reactions.
          - title: Photosynthesis overview
            id: bio-photosynthesis-overview
            brief: In chloroplasts, light energy turns carbon dioxide and water into glucose and oxygen.
          - title: Light-dependent and light-independent stages
            id: bio-light-dependent-light-independent
            brief: The light-dependent stage in the thylakoids makes ATP and NADPH; the Calvin cycle in the stroma uses them to fix carbon.
          - title: C3, C4 and CAM plants
            id: bio-c3-c4-cam-plants
            brief: C4 and CAM plants avoid wasteful reactions of Rubisco in hot, dry conditions by separating steps in space or time.
          - title: Factors affecting photosynthesis
            id: bio-factors-affecting-photosynthesis
            brief: Light, carbon dioxide, temperature and water availability set the rate of photosynthesis.
          - title: Aerobic cellular respiration
            id: bio-aerobic-cellular-respiration
            brief: Glycolysis, the Krebs cycle and the electron transport chain release energy from glucose, making about 30 to 32 ATP.
          - title: Anaerobic respiration
            id: bio-anaerobic-respiration
            brief: Without oxygen, cells make only 2 ATP per glucose, producing lactic acid in animals or ethanol and carbon dioxide in yeast.
          - title: Factors affecting respiration
            id: bio-factors-affecting-respiration
            brief: Temperature, glucose and oxygen supply change the rate of cellular respiration.
          - title: Biofuels and improving crop yields
            id: bio-biofuels-improving-crop-yields
            brief: Fermenting plant matter makes biofuels, and gene editing may improve photosynthesis to raise yields.

  - title: "Unit 4: How does life change and respond to challenges?"
    chapters:
      - title: Responding to antigens
        id: vic-bio-u34-2-1
        points:
          - title: Pathogens and antigens
            id: bio-pathogens-antigens
            brief: Pathogens cause disease. Antigens are molecules that trigger an immune response, marking cells as self or non-self.
          - title: Physical, chemical and microbiological barriers
            id: bio-physical-chemical-microbiological-barriers
            brief: Skin, mucus, stomach acid, enzymes and normal bacteria stop most pathogens getting in.
          - title: Barriers in plants
            id: bio-barriers-plants
            brief: Plants defend with thick cell walls, waxy cuticles and chemicals that harm pathogens.
          - title: The innate immune response
            id: bio-innate-immune-response-2
            brief: A fast, non-specific response with inflammation, phagocytes, natural killer cells and complement proteins.
          - title: The lymphatic system
            id: bio-lymphatic-system
            brief: Lymph nodes trap antigens and are where B and T cells meet them, starting the adaptive response.
          - title: Humoral immunity
            id: bio-humoral-immunity
            brief: B cells make antibodies that bind antigens outside cells, neutralising them or marking them for destruction.
          - title: Cell-mediated immunity
            id: bio-cell-mediated-immunity
            brief: Helper T cells coordinate the response and cytotoxic T cells destroy infected or abnormal cells.
          - title: Immunological memory
            id: bio-immunological-memory
            brief: Memory B and T cells let the body respond faster and stronger to an antigen met before.
          - title: Natural and artificial immunity
            id: bio-natural-artificial-immunity
            brief: Active immunity comes from making your own antibodies, by infection or vaccination. Passive immunity comes from receiving antibodies.
          - title: Vaccination and herd immunity
            id: bio-vaccination-herd-immunity
            brief: When enough people are vaccinated, a disease cannot spread easily, protecting those who cannot be vaccinated.
          - title: Emerging and re-emerging diseases
            id: bio-emerging-re-emerging-diseases
            brief: New diseases and returning ones spread through travel, contact with animals and loss of immunity.
          - title: Monoclonal antibodies
            id: bio-monoclonal-antibodies
            brief: Antibodies made in the lab to target one antigen, used to treat cancers and autoimmune diseases.

      - title: Genetic change in populations
        id: vic-bio-u34-2-2
        points:
          - title: Mutations
            id: bio-mutations
            brief: Point mutations and changes to chromosomes create new alleles, the raw material for evolution.
          - title: The gene pool
            id: bio-gene-pool
            brief: All the alleles in a population. Evolution is a change in allele frequencies over time.
          - title: Natural selection
            id: bio-natural-selection-2
            brief: Individuals with traits suited to the environment survive and reproduce more, so their alleles become more common.
          - title: Genetic drift
            id: bio-genetic-drift
            brief: Chance changes in allele frequency, strongest in small populations, as in the bottleneck and founder effects.
          - title: Gene flow
            id: bio-gene-flow
            brief: Movement of alleles between populations when individuals migrate and breed.
          - title: Selective breeding
            id: bio-selective-breeding
            brief: Humans choose which organisms breed, changing allele frequencies and reducing genetic diversity.
          - title: Antibiotic resistance
            id: bio-antibiotic-resistance
            brief: Antibiotics kill susceptible bacteria and leave resistant ones to multiply, a case of natural selection.
          - title: Allopatric speciation
            id: bio-allopatric-speciation
            brief: A population split by a barrier evolves separately until the two groups can no longer interbreed.

      - title: Evidence for evolution
        id: vic-bio-u34-2-3
        points:
          - title: The fossil record
            id: bio-fossil-record
            brief: Fossils show organisms changing over time, dated by their position in rock layers and by radiometric dating.
          - title: Relative and absolute dating
            id: bio-relative-absolute-dating
            brief: Relative dating orders fossils by rock layers and index fossils. Absolute dating gives an age from radioactive decay.
          - title: Comparative anatomy
            id: bio-comparative-anatomy
            brief: Homologous structures suggest common ancestry. Analogous structures show similar solutions to similar problems.
          - title: Molecular evidence
            id: bio-molecular-evidence
            brief: Comparing DNA and amino acid sequences shows how closely species are related.
          - title: Phylogenetic trees
            id: bio-phylogenetic-trees
            brief: Branching diagrams showing evolutionary relationships, with shared ancestors at each branch point.
          - title: Human evolution
            id: bio-human-evolution
            brief: Hominins share features such as walking upright. Homo sapiens evolved in Africa and spread across the world.
          - title: The arrival of people in Australia
            id: bio-arrival-people-australia
            brief: Evidence shows Aboriginal peoples have lived in Australia for at least 65,000 years.
