# NSW Economics, Year 11: the six Preliminary topics, 56 points.
# Drafted from NESA's Economics Stage 6 Syllabus (2009), the syllabus taught in Year 11 in 2026. The structure follows
# the syllabus: each topic is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points marked reuse share a point (and each student's progress on it) with the Economics bank (econ-points.js).
# also_match [e] has the matcher look for the same idea in that bank for every other point.
# In transition: the Economics 11-12 Syllabus (2025) replaces this one for Year 11 from Term 1 2027. Check it before
# the first run, and redraft this outline against it if Year 11 students will use the course from 2027.

id: nsw-eco-11
subject: Economics
bank: eco
name: Economics, Year 11
about: HSC, Consumers, markets, labour, finance and government
short: Economics
years: [11]
place: nsw
kind: standard
syllabus: NSW Economics Stage 6 Syllabus (2009), Preliminary (Year 11) course, Topics 1 to 6
note: Follows the NSW Economics syllabus. Not made or endorsed by NESA.
chips: [opportunity cost, circular flow, elasticity, participation rate, RBA]
also_match: [e]

units:
  - title: Introduction to economics
    chapters:
      - title: The economic problem
        id: nsw-eco-11-1-1
        points:
          - title: The nature of economics
            id: eco-nature-economics
            reuse: e-nature
          - title: Scarcity
            id: eco-scarcity
            reuse: e-scarcity
          - title: Production possibility frontiers
            id: eco-production-possibility-frontiers
            reuse: e-ppf
          - title: The basic economic questions
            id: eco-basic-economic-questions
            brief: Every economy must decide what to produce, how to produce it and who gets it. Different economic systems answer these questions in different ways.
          - title: Free market, mixed and command economies
            id: eco-free-market-mixed-command
            reuse: e-systems

      - title: The circular flow
        id: nsw-eco-11-1-2
        points:
          - title: The five-sector circular flow model
            id: eco-five-sector-circular-flow
            brief: Income flows between households and firms, with the financial, government and overseas sectors adding injections and withdrawals.
          - title: Injections and withdrawals
            id: eco-injections-withdrawals
            reuse: e-flow
          - title: Economic decision makers
            id: eco-economic-decision-makers
            brief: Individuals, businesses and governments each make choices about scarce resources, and their decisions affect each other.
          - title: Australia's mixed economy
            id: eco-australia-s-mixed-economy
            brief: Australia relies mostly on markets, with government providing services such as health and education, setting rules and redistributing income through taxes and payments.

  - title: Consumers and business
    chapters:
      - title: Consumers
        id: nsw-eco-11-2-1
        points:
          - title: Factors in consumer choice
            id: eco-factors-consumer-choice
            brief: Consumers' choices depend on income, prices, tastes, advertising, expectations and the prices of other goods.
          - title: Sources of consumer income
            id: eco-sources-consumer-income
            brief: Households earn wages from labour, rent from land, interest from savings and profit from enterprise, and receive transfer payments from government.
          - title: Saving, spending and borrowing
            id: eco-saving-spending-borrowing
            brief: Households spend most of their income and save the rest. Borrowing lets them spend more now but must be repaid with interest.
          - title: Consumer sovereignty
            id: eco-consumer-sovereignty
            brief: The idea that consumers, through what they choose to buy, decide what businesses produce. Advertising and market power can weaken it.
          - title: Protecting consumers
            id: eco-protecting-consumers
            brief: Laws such as the Australian Consumer Law, and bodies such as the ACCC, protect consumers from misleading conduct and unsafe products.

      - title: Business
        id: nsw-eco-11-2-2
        points:
          - title: The role of business in the economy
            id: eco-role-business-economy
            brief: Businesses combine resources to produce goods and services, provide jobs and incomes, and pay taxes.
          - title: Business goals
            id: eco-business-goals
            brief: Firms aim to maximise profit, but may also aim for growth, market share, a strong reputation or meeting social and environmental goals.
          - title: Production decisions
            id: eco-production-decisions
            brief: Firms decide how much to produce and which mix of labour and capital to use, depending on costs, technology and expected demand.
          - title: Economies of scale
            id: eco-economies-scale
            brief: As a firm grows, its cost per unit can fall through bulk buying, specialisation and better technology. Past a point, it can rise again.
          - title: Business behaviour and the economy
            id: eco-business-behaviour-economy
            brief: Firms' decisions to invest, hire and set prices affect growth, employment and inflation across the economy.

  - title: Markets
    chapters:
      - title: Demand and supply
        id: nsw-eco-11-3-1
        points:
          - title: The demand curve
            id: eco-demand-curve
            reuse: e-demand
          - title: The supply curve
            id: eco-supply-curve
            reuse: e-supply
          - title: Equilibrium price and quantity
            id: eco-equilibrium-price-quantity
            reuse: e-equilibrium
          - title: Price elasticity of demand
            id: eco-price-elasticity-demand
            reuse: e-ped
          - title: Price elasticity of supply
            id: eco-price-elasticity-supply
            reuse: e-pes

      - title: Market structures and intervention
        id: nsw-eco-11-3-2
        points:
          - title: Perfect competition
            id: eco-perfect-competition
            brief: Many small firms selling identical products, with free entry and exit and full information, so no firm can set the price.
          - title: Monopolistic competition
            id: eco-monopolistic-competition
            brief: Many firms selling products that differ a little, such as cafés and hairdressers, each with a small amount of control over its price.
          - title: Oligopoly
            id: eco-oligopoly
            brief: A few large firms dominate a market, such as Australian supermarkets or banks. Each watches the others, and prices tend to be stable.
          - title: Monopoly
            id: eco-monopoly
            brief: One firm supplies the whole market, with barriers stopping others entering. It can set higher prices and produce less than a competitive market would.
          - title: Maximum and minimum prices
            id: eco-maximum-minimum-prices
            reuse: e-maxmin

  - title: Labour markets
    chapters:
      - title: How labour markets work
        id: nsw-eco-11-4-1
        points:
          - title: The demand for labour
            id: eco-demand-labour
            brief: Labour is a derived demand, wanted for what it produces. Firms hire more when demand for their goods rises or when workers become more productive.
          - title: The supply of labour
            id: eco-supply-labour
            brief: The supply of labour depends on the size and age of the population, the participation rate, wages and migration.
          - title: Labour market indicators
            id: eco-labour-market-indicators
            brief: The participation rate, unemployment rate, underemployment rate and wage growth, measured monthly by the ABS, show the health of the labour market.
          - title: Wage determination in Australia
            id: eco-wage-determination-australia
            brief: Wages are set by the Fair Work Commission's minimum wage and modern awards, by enterprise agreements and by individual contracts.
          - title: Trends in the labour market
            id: eco-trends-labour-market
            brief: Australian work has shifted towards services, part-time and casual jobs, higher female participation and gig work.

      - title: Labour market outcomes
        id: nsw-eco-11-4-2
        points:
          - title: Wage differences between jobs
            id: eco-wage-differences-between-jobs
            brief: Pay differs with skills, education, risk, the demand for the work and how much bargaining power workers have.
          - title: The gender pay gap
            id: eco-gender-pay-gap
            brief: Women in Australia earn less than men on average. Causes include the jobs and industries women work in, time out for caring and discrimination.
          - title: Unemployment and the labour market
            id: eco-unemployment-labour-market
            brief: Unemployment occurs when the supply of labour exceeds the demand for it at the going wage.
          - title: Government policy in the labour market
            id: eco-government-policy-labour-market
            brief: Governments set minimum wages, fund training, run employment services and make workplace laws that shape the labour market.

  - title: Financial markets
    chapters:
      - title: Financial markets and institutions
        id: nsw-eco-11-5-1
        points:
          - title: The role of financial markets
            id: eco-role-financial-markets
            brief: Financial markets move funds from savers to borrowers, so savings can be invested in businesses, homes and government projects.
          - title: Financial institutions
            id: eco-financial-institutions
            brief: Banks take deposits and make loans. Non-bank institutions, such as superannuation funds, insurers and finance companies, also manage and lend money.
          - title: The share market
            id: eco-share-market
            brief: Companies raise money by selling shares in the primary market. Existing shares are bought and sold on the ASX, the secondary market.
          - title: Interest rates
            id: eco-interest-rates
            brief: The interest rate is the price of borrowing money. It rises when demand for funds is high or risk is greater.

      - title: Regulating financial markets
        id: nsw-eco-11-5-2
        points:
          - title: The Reserve Bank of Australia
            id: eco-reserve-bank-australia
            brief: The RBA is Australia's central bank. It sets the cash rate, issues banknotes and keeps the financial system stable.
          - title: Regulators of the financial system
            id: eco-regulators-financial-system
            brief: APRA supervises banks, insurers and super funds so they stay sound. ASIC regulates companies, markets and financial advice.
          - title: Global financial markets
            id: eco-global-financial-markets
            brief: Money flows freely between countries, so events overseas, such as the 2008 global financial crisis, quickly affect Australian markets.
          - title: Financial risk and crises
            id: eco-financial-risk-crises
            brief: When borrowers cannot repay and asset prices fall, lenders can fail and credit dries up, which can drag the whole economy into recession.

  - title: Government and the economy
    chapters:
      - title: Why governments intervene
        id: nsw-eco-11-6-1
        points:
          - title: The roles of government
            id: eco-roles-government
            brief: Governments allocate resources, redistribute income and stabilise the economy, as well as setting the rules markets work within.
          - title: Market failure
            id: eco-market-failure
            reuse: e-failure
          - title: Externalities
            id: eco-externalities
            reuse: e-externality
          - title: Public goods
            id: eco-public-goods
            reuse: e-public
          - title: Equity and the distribution of income
            id: eco-equity-distribution-income
            brief: Markets alone can leave large gaps between rich and poor, so governments use taxes, welfare and services to make outcomes fairer.

      - title: Government revenue and spending
        id: nsw-eco-11-6-2
        points:
          - title: The federal budget
            id: eco-federal-budget
            brief: Each year the Australian Government sets out its planned revenue and spending in the budget, which shows its policy priorities.
          - title: Types of taxes
            id: eco-types-taxes
            brief: Direct taxes are on income, such as income tax. Indirect taxes are on spending, such as the GST.
          - title: Progressive, proportional and regressive taxes
            id: eco-progressive-proportional-regressive-taxes
            brief: A progressive tax takes a larger share of higher incomes, a proportional tax the same share, and a regressive tax a larger share of lower incomes.
          - title: Objectives of economic policy
            id: eco-objectives-economic-policy
            brief: Governments aim for sustainable growth, full employment, price stability, external stability, a fair distribution of income and a sustainable environment.
          - title: Fiscal and monetary policy in brief
            id: eco-fiscal-monetary-policy-brief
            brief: The government uses its budget (fiscal policy) and the RBA uses interest rates (monetary policy) to steer the economy. Year 12 covers both in depth.
