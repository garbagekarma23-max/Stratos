# VCE Modern History, Units 1 and 2: change and conflict between the wars, and the changing world order, 29 points.
# Drafted from the VCAA's VCE History Study Design (2022), whose accreditation ends 31 December 2026. The structure
# follows that study design: each unit is a unit here, and each area of study is a chapter, or two when it is large.
# Schools pick their case studies; the chapters here use common ones. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Held back in later/: redraft it against the study design that replaces the 2022 one before running it.
# NSW Modern History (the mod bank) covers some of the same events, so expect some reuses and adapts. Points on the
# Holocaust and on Aboriginal and Torres Strait Islander rights always go to the review page.

id: vic-mod-u12
subject: Modern History
bank: mod
name: Modern History, Units 1 and 2
about: VCE, Between the wars, and the world after 1945
short: Modern History
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE History Study Design (2022 to 2026), Modern History Units 1 and 2
note: Follows the VCE History study design. Not made or endorsed by the VCAA.
chips: [Treaty of Versailles, fascism, Great Depression, Cold War, civil rights]

units:
  - title: "Unit 1: Change and conflict"
    chapters:
      - title: Ideology and conflict
        id: vic-mod-u12-1-1
        points:
          - title: The world after the First World War
            id: mod-world-after-first-world
            brief: The war ended empires, killed millions and left Europe in debt, setting up the tensions of the next two decades.
          - title: The Treaty of Versailles
            id: mod-treaty-versailles
            brief: The 1919 peace treaty made Germany accept blame, pay reparations, give up land and cut its army, which many Germans resented.
          - title: The League of Nations
            id: mod-league-nations-2
            brief: Set up to keep peace through collective security, it lacked the United States and an army, and failed to stop aggression in the 1930s.
          - title: Liberal democracy
            id: mod-liberal-democracy
            brief: Government by elected representatives, with rights, the rule of law and several parties, under strain in the interwar years.
          - title: Communism in the Soviet Union
            id: mod-communism-soviet-union
            brief: Under Lenin and then Stalin, the Communist Party ruled alone, owned industry and farms, and used terror against opponents.
          - title: Fascism in Italy
            id: mod-fascism-italy-2
            brief: Mussolini's Fascists took power in 1922, promising order and national glory, and built a one-party state.
          - title: Nazism in Germany
            id: mod-nazism-germany
            brief: Hitler's Nazis rose amid the Depression and came to power in 1933, ending democracy and persecuting Jews and others.
          - title: The Great Depression
            id: mod-great-depression-2
            brief: The 1929 Wall Street crash led to a world slump, mass unemployment and support for extreme parties.
          - title: Propaganda and control
            id: mod-propaganda-control
            brief: Totalitarian states used propaganda, censorship, youth groups and secret police to control what people thought and did.
          - title: The road to the Second World War
            id: mod-road-second-world-war
            brief: Aggression by Germany, Italy and Japan, and appeasement by Britain and France, led to war in 1939.

      - title: Social and cultural change
        id: vic-mod-u12-1-2
        points:
          - title: The 1920s and modern life
            id: mod-1920s-modern-life
            brief: Cars, radio, cinema and jazz changed daily life in the 1920s, and young people challenged older ways.
          - title: Women between the wars
            id: mod-women-between-wars
            brief: Many women won the vote and new freedoms in work and dress, though most still faced limits at home and work.
          - title: Art and culture under dictatorship
            id: mod-art-culture-under-dictatorship
            brief: Dictatorships controlled art, film and writing to spread their ideas and banned what they saw as dangerous.
          - title: Challenges to the social order
            id: mod-challenges-social-order
            brief: Strikes, protests and new movements challenged class, race and gender roles between the wars.
          - title: Persecution of minorities
            id: mod-persecution-minorities
            brief: Nazi Germany stripped Jews of rights and property, leading to violence such as Kristallnacht in 1938.

  - title: "Unit 2: The changing world order"
    chapters:
      - title: The Cold War
        id: vic-mod-u12-2-1
        points:
          - title: Origins of the Cold War
            id: mod-origins-cold-war-2
            brief: After 1945 the United States and the Soviet Union, with clashing ideologies, became rival superpowers.
          - title: The Iron Curtain and Europe divided
            id: mod-iron-curtain-europe-divided
            brief: Europe split into a Soviet-controlled east and a western bloc, with Germany and Berlin divided.
          - title: Containment and the Truman Doctrine
            id: mod-containment-truman-doctrine
            brief: The United States aimed to stop communism spreading, with aid such as the Marshall Plan and alliances such as NATO.
          - title: The arms race
            id: mod-arms-race
            brief: Both superpowers built nuclear weapons, leading to the idea of mutually assured destruction.
          - title: The Cuban Missile Crisis
            id: mod-cuban-missile-crisis
            brief: In 1962 Soviet missiles in Cuba brought the world close to nuclear war, until both sides stepped back.
          - title: Proxy wars
            id: mod-proxy-wars
            brief: The superpowers fought through others in Korea, Vietnam and Afghanistan rather than directly.
          - title: The end of the Cold War
            id: mod-end-cold-war-2
            brief: Reform in the Soviet Union, the fall of the Berlin Wall in 1989 and the Soviet collapse in 1991 ended the Cold War.

      - title: Challenge and change
        id: vic-mod-u12-2-2
        points:
          - title: Decolonisation
            id: mod-decolonisation
            brief: After 1945 many colonies in Asia and Africa won independence, sometimes peacefully and sometimes through war.
          - title: The civil rights movement in the United States
            id: mod-civil-rights-movement-united
            brief: African Americans used boycotts, marches and court cases to end segregation and win voting rights.
          - title: Aboriginal and Torres Strait Islander rights in Australia
            id: mod-aboriginal-torres-strait-islander
            brief: Campaigns such as the Freedom Ride and the 1967 referendum challenged discrimination and pushed for rights and land.
          - title: The women's movement
            id: mod-women-s-movement
            brief: From the 1960s women campaigned for equal pay, legal rights and control over their own lives.
          - title: Anti-war protest
            id: mod-anti-war-protest
            brief: Opposition to the Vietnam War brought mass protest in the United States and Australia.
          - title: The end of apartheid
            id: mod-end-apartheid
            brief: Protest inside South Africa and pressure from abroad ended apartheid, leading to elections in 1994.
          - title: Methods of protest and change
            id: mod-methods-protest-change
            brief: Movements used non-violent protest, legal action, media and sometimes violence, with different results.
