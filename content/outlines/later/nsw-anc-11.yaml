# NSW Ancient History, Year 11: Investigating ancient history and Features of ancient societies, 24 points.
# Drafted from NESA's Ancient History Stage 6 Syllabus (2017), the syllabus taught in Year 11 in 2026. The structure
# follows the syllabus. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Schools choose their own case studies and features. This outline covers the methods every student needs and two
# common features of two societies. Other choices can be added as chapters.
# In transition: the Ancient History 11-12 Syllabus (2024) replaces this one for Year 11 from Term 1 2027. Check it
# before the first run, and redraft this outline against it if Year 11 students will use the course from 2027.

id: nsw-anc-11
subject: Ancient History
bank: anc
name: Ancient History, Year 11
about: HSC, Sources, archaeology and ancient societies
short: Ancient History
years: [11]
place: nsw
kind: standard
syllabus: NSW Ancient History Stage 6 Syllabus (2017), Year 11 course
note: Follows the NSW Ancient History syllabus. Not made or endorsed by NESA.
chips: [archaeology, radiocarbon dating, repatriation, mummification, Roman slavery]

units:
  - title: Investigating ancient history
    chapters:
      - title: Evidence from the ancient past
        id: nsw-anc-11-1-1
        points:
          - title: Archaeological and written sources
            id: anc-archaeological-written-sources
            brief: Archaeological sources are physical remains, such as buildings, tools and bones. Written sources include inscriptions, papyri and ancient histories. Each fills gaps in the other.
          - title: Problems with ancient sources
            id: anc-problems-with-ancient-sources
            brief: Ancient sources are often fragmentary, written by elites, copied many times and far from the events, so historians must test them carefully.
          - title: Excavation
            id: anc-excavation
            brief: Archaeologists dig in layers and record exactly where each find lies, because excavation destroys the site as it reveals it.
          - title: Dating methods
            id: anc-dating-methods
            brief: Stratigraphy uses the order of layers. Radiocarbon dating measures decay in once-living material. Dendrochronology counts tree rings.
          - title: Science in archaeology
            id: anc-science-archaeology
            brief: DNA analysis, CT scans and chemical tests of bones and residues reveal ancient diet, disease and origins without destroying evidence.

      - title: The past in the present
        id: nsw-anc-11-1-2
        points:
          - title: Preservation and conservation
            id: anc-preservation-conservation
            brief: Sites and objects decay through weather, tourism and time. Conservation slows the damage, sometimes by limiting access.
          - title: Reconstruction
            id: anc-reconstruction
            brief: Rebuilding parts of a site helps visitors understand it, but can mislead if the rebuilding guesses beyond the evidence.
          - title: Cultural heritage and ownership
            id: anc-cultural-heritage-ownership
            brief: Who owns ancient objects is debated. Many were taken to foreign museums in the past, and countries of origin now seek their return.
          - title: Repatriation
            id: anc-repatriation
            brief: Returning objects and human remains to their countries or communities of origin, as with requests for the Parthenon sculptures in London.
          - title: Representing the ancient past
            id: anc-representing-ancient-past
            brief: Museums, films, games and novels shape how people imagine the ancient world, and do not always match the evidence.
          - title: Ethics of human remains
            id: anc-ethics-human-remains
            brief: Displaying and studying human remains raises questions of respect, consent and the wishes of descendants.

  - title: Features of ancient societies
    chapters:
      - title: Death and burial in New Kingdom Egypt
        id: nsw-anc-11-2-1
        points:
          - title: Egyptian beliefs about the afterlife
            id: anc-egyptian-beliefs-about-afterlife
            brief: Egyptians believed the soul lived on if the body was preserved and the dead person's heart was judged true against the feather of Maat.
          - title: Mummification
            id: anc-mummification
            brief: Embalmers removed the organs, dried the body with natron and wrapped it in linen, a process that took about 70 days.
          - title: Tombs and the Valley of the Kings
            id: anc-tombs-valley-kings
            brief: New Kingdom pharaohs were buried in rock-cut tombs in the Valley of the Kings, decorated with texts to guide them in the afterlife.
          - title: Grave goods and texts
            id: anc-grave-goods-texts
            brief: Food, furniture, shabti figures and the Book of the Dead were placed in tombs to serve the dead in the next life.
          - title: Tutankhamun's tomb as evidence
            id: anc-tutankhamun-s-tomb-as
            brief: Found almost intact by Howard Carter in 1922, the tomb shows the wealth and rituals of a royal burial, though it may not be typical.

      - title: Slavery in ancient Rome
        id: nsw-anc-11-2-2
        points:
          - title: How people became slaves in Rome
            id: anc-people-became-slaves-rome
            brief: Slaves came from war captives, people born to enslaved mothers, abandoned children and trade from outside the empire.
          - title: The work of slaves
            id: anc-work-slaves
            brief: Slaves worked in mines, on farms, in households, as craftworkers and as educated tutors and clerks. Their treatment varied greatly.
          - title: Slaves and the law
            id: anc-slaves-law
            brief: In Roman law a slave was property. Owners had great power over them, though later laws placed some limits on cruelty.
          - title: Freedmen
            id: anc-freedmen
            brief: Many slaves were freed by their owners. Freedmen became citizens with some limits, and some grew rich.
          - title: Slave revolts
            id: anc-slave-revolts
            brief: The revolt led by Spartacus from 73 to 71 BC was the largest. Its defeat ended with thousands crucified along the Appian Way.

  - title: Historical investigation
    chapters:
      - title: Researching ancient history
        id: nsw-anc-11-3-1
        points:
          - title: Framing an inquiry question
            id: anc-framing-inquiry-question
            brief: Choosing a focused, open question about the ancient world that the available evidence can answer.
          - title: Using ancient and modern sources together
            id: anc-using-ancient-modern-sources
            brief: Weighing ancient sources against archaeology and modern historians, and noting where they agree or conflict.
          - title: Presenting a historical investigation
            id: anc-presenting-historical-investigation
            brief: Writing up an investigation with a clear argument, evidence, references and an honest note of the limits of the sources.
