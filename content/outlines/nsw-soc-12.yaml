# NSW Society and Culture, Year 12: the core and all four depth studies, 30 points.
# Drafted from NESA's Society and Culture Stage 6 Syllabus (2013), the syllabus taught in Year 12 in 2026. The
# structure follows the syllabus. Students study two depth studies; all four are here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Schools pick their own country for the continuity and change study, so the briefs stay with the ideas.
# In transition: a new Society and Culture 11-12 Syllabus is in development at NESA. Check its start date before the
# first run.

id: nsw-soc-12
subject: Society and Culture
bank: soc
name: Society and Culture, Year 12
about: HSC, Continuity and change, the PIP and depth studies
short: Society and Culture
years: [12]
place: nsw
kind: standard
syllabus: NSW Society and Culture Stage 6 Syllabus (2013), HSC (Year 12) course, the core and the four depth studies
note: Follows the NSW Society and Culture syllabus. Not made or endorsed by NESA.
chips: [modernisation, westernisation, PIP, popular culture, conformity]

units:
  - title: Social and cultural continuity and change
    chapters:
      - title: Continuity and change
        id: nsw-soc-12-1-1
        points:
          - title: The nature of continuity and change
            id: soc-nature-continuity-change
            brief: Societies change in some ways while keeping others, and studying a country over time shows how tradition and change shape each other.
          - title: Agents of change
            id: soc-agents-change
            brief: People, groups, new technologies, the economy and events such as wars can all bring social change.
          - title: Modernisation and westernisation
            id: soc-modernisation-westernisation
            brief: Modernisation is the change from traditional to industrial and urban life. Westernisation is taking on the ways of Western countries. They are not the same.
          - title: Resistance to change
            id: soc-resistance-change
            brief: People resist change to protect tradition, identity, power or security, and resistance can slow or reshape it.
          - title: Theories of change
            id: soc-theories-change
            brief: Functionalism sees change as a society adjusting to stay stable. Conflict theory sees it as the result of struggles between groups for power.

  - title: The Personal Interest Project
    chapters:
      - title: The Personal Interest Project
        id: nsw-soc-12-2-1
        points:
          - title: Choosing a topic
            id: soc-choosing-topic
            brief: A good PIP topic is something the student cares about, is narrow enough to research well and links to the course concepts.
          - title: The cross-cultural component
            id: soc-cross-cultural-component
            brief: The PIP must compare the topic across cultures, groups or times, showing how experiences differ.
          - title: Choosing a mix of methods
            id: soc-choosing-mix-methods
            brief: Using more than one research method, such as a questionnaire and interviews, gives stronger, more balanced findings.
          - title: Writing up the project
            id: soc-writing-up-project
            brief: The PIP has an introduction, a log of the research process, a central material discussing findings and a conclusion, with a resource list.
          - title: Personal reflection in the PIP
            id: soc-personal-reflection-pip
            brief: The project shows the student's own thinking and what they learned, while keeping the research objective.

  - title: Popular culture
    chapters:
      - title: Popular culture
        id: nsw-soc-12-3-1
        points:
          - title: What popular culture is
            id: soc-popular-culture
            brief: Popular culture is the music, film, games, sport, fashion and media enjoyed by large numbers of people, often spread through mass media.
          - title: Popular culture and identity
            id: soc-popular-culture-identity
            brief: People use popular culture to express who they are and to belong to groups, such as fans of a band or a sport.
          - title: Commodification
            id: soc-commodification
            brief: Turning culture into products to be bought and sold, such as merchandise and streaming subscriptions.
          - title: Global popular culture
            id: soc-global-popular-culture
            brief: Media companies and the internet spread popular culture worldwide, which can mix cultures or crowd out local ones.
          - title: Power in popular culture
            id: soc-power-popular-culture
            brief: A few large companies control much of what is produced and promoted, while social media lets ordinary people create and spread culture too.

  - title: Belief systems and ideologies
    chapters:
      - title: Belief systems and ideologies
        id: nsw-soc-12-4-1
        points:
          - title: What belief systems and ideologies are
            id: soc-belief-systems-ideologies-are
            brief: A belief system is a set of ideas about meaning and how to live, such as a religion. An ideology is a set of political or social ideas, such as liberalism.
          - title: Belief systems and identity
            id: soc-belief-systems-identity
            brief: Belief systems give people a sense of identity, community and guidance on how to act.
          - title: Belief systems and power
            id: soc-belief-systems-power
            brief: Belief systems and ideologies can support those in power or be used to challenge them.
          - title: Continuity and change in beliefs
            id: soc-continuity-change-beliefs
            brief: Beliefs change through contact with other ideas, new technology and social change, while many traditions stay strong.
          - title: Secularisation
            id: soc-secularisation
            brief: The decline of religion's influence on public life, which is uneven across countries and groups.

  - title: Social inclusion and exclusion
    chapters:
      - title: Social inclusion and exclusion
        id: nsw-soc-12-5-1
        points:
          - title: What inclusion and exclusion mean
            id: soc-inclusion-exclusion-mean
            brief: Social inclusion is being able to take part fully in society. Exclusion is being shut out of work, services, decisions or social life.
          - title: Causes of exclusion
            id: soc-causes-exclusion
            brief: Poverty, disability, discrimination, location, age and lack of education can all exclude people.
          - title: Effects of exclusion
            id: soc-effects-exclusion
            brief: Exclusion can harm health, wellbeing, income and a sense of belonging, and can carry on across generations.
          - title: Strategies for inclusion
            id: soc-strategies-inclusion
            brief: Laws against discrimination, accessible services, education and community programs help include people.
          - title: Inclusion and power
            id: soc-inclusion-power
            brief: Groups with more power often set the rules of who is included, and excluded groups may work to change them.

  - title: Social conformity and nonconformity
    chapters:
      - title: Social conformity and nonconformity
        id: nsw-soc-12-6-1
        points:
          - title: Conformity
            id: soc-conformity
            brief: Conformity is following the norms and expectations of a group, often because of social pressure or a wish to belong.
          - title: Nonconformity
            id: soc-nonconformity
            brief: Nonconformity is going against the norms, which can be a personal choice, a protest or a way to form a new group.
          - title: Sanctions
            id: soc-sanctions
            brief: Groups reward conformity and punish nonconformity, through formal sanctions such as laws and informal ones such as disapproval.
          - title: Subcultures
            id: soc-subcultures
            brief: A subculture is a group with values and styles different from the wider society, such as skaters or gamers.
          - title: Theories of conformity
            id: soc-theories-conformity
            brief: Studies such as Asch's experiments show how strongly group pressure can push people to agree, even when the group is wrong.
