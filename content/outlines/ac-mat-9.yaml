# Australian Curriculum Mathematics, Year 9: the Number, Algebra, Measurement, Space, Statistics and Probability
# strands, 39 points.
# Follows ACARA's Australian Curriculum: Mathematics, Version 9.0, Year 9, checked on the official site
# (australiancurriculum.edu.au) in November 2026. Ministers approved Version 9.0 in April 2022 and ACARA published it in
# May 2022. Each state sets its own start: the ACT from 2024, Tasmania from 2023, the NT from 2025, WA (its own Western
# Australian Curriculum, adapted from it) from 2026, Queensland by the end of 2026, and South Australia's public schools
# (their own adapted version) by about 2027. ACARA has announced no new version for Years 7 to 10: the next full
# version is scheduled for approval in 2032 (an iterative review covers Foundation to Year 2 mathematics only).
# Each strand is a unit, and its content descriptions are grouped into chapters in the curriculum's order. Number has
# only one content description in Year 9, so scientific notation (AC9M9M02, Measurement) is taught with it, and the
# trigonometric ratios (AC9M9SP01, Space) are taught with trigonometry in Measurement (AC9M9M03). The codes are
# ACARA's content description codes. Modelling content descriptions (AC9M9A05, AC9M9M05) are taught through the
# methods they use. Digital tools, investigations and the algorithm design in AC9M9SP03 are left out, except for the
# ideas behind them.
# Cards and multiple choice for now (kind: maths). Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-mat-9
subject: Mathematics
bank: mat
name: Mathematics, Year 9
about: Australian Curriculum, Year 9
short: Mathematics
years: [9]
place: [qld, sa, wa, tas, act, nt]
kind: maths
syllabus: "Australian Curriculum: Mathematics, Version 9.0, Year 9"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [scientific notation, quadratics, gradient, trigonometry, cylinder, tree diagram]

units:
  - title: Number
    chapters:
      - title: Real numbers and scientific notation
        id: ac-mat-9-1-1
        points:
          - title: The real number system
            id: mat-real-number-system
            codes: [AC9M9N01]
            brief: Real numbers are all the rational numbers (integers, fractions and terminating or recurring decimals) together with the irrational numbers, such as √5 and π.
          - title: Significant figures
            id: mat-significant-figures
            codes: [AC9M9N01]
            brief: Rounding to significant figures counts from the first non-zero digit, so 0.004 562 to 2 significant figures is 0.0046.
          - title: Scientific notation for large numbers
            id: mat-scientific-notation-large-numbers
            codes: [AC9M9M02]
            brief: A large number is written as a number from 1 to less than 10 times a positive power of 10, so 3 400 000 = 3.4 × 10⁶.
          - title: Scientific notation for small numbers
            id: mat-scientific-notation-small-numbers
            codes: [AC9M9M02]
            brief: A small number uses a negative power of 10, so 0.000 52 = 5.2 × 10⁻⁴, as in the width of a cell in metres.

  - title: Algebra
    chapters:
      - title: Index laws and expanding
        id: ac-mat-9-2-1
        points:
          - title: Index laws with variables
            id: mat-index-laws-with-variables
            codes: [AC9M9A01]
            brief: The index laws work with variables too, so x⁵ × x³ = x⁸, x⁶ ÷ x² = x⁴ and (x²)³ = x⁶, with numbers in front multiplied or divided as usual.
          - title: Negative indices
            id: mat-negative-indices
            codes: [AC9M9A01]
            brief: A negative index means a reciprocal, so 2⁻³ = 1/2³ = 1/8.
          - title: Expanding binomial products
            id: mat-expanding-binomial-products
            codes: [AC9M9A02]
            brief: Multiply each term in the first bracket by each term in the second, so (x + 3)(x + 5) = x² + 8x + 15.
          - title: Perfect squares and difference of two squares
            id: mat-perfect-squares-difference-two
            codes: [AC9M9A02]
            brief: Two special expansions, (a + b)² = a² + 2ab + b² and (a + b)(a − b) = a² − b², save time.
          - title: Factorising monic quadratics
            id: mat-factorising-monic-quadratics
            codes: [AC9M9A02]
            brief: To factorise x² + bx + c, find two numbers that multiply to c and add to b, so x² + 7x + 12 = (x + 3)(x + 4).

      - title: Coordinate geometry
        id: ac-mat-9-2-2
        points:
          - title: Gradient of an interval
            id: mat-gradient-interval
            codes: [AC9M9A03]
            brief: Gradient is rise over run, the change in y divided by the change in x between two points, and it is negative when a line slopes down to the right.
          - title: Midpoint of an interval
            id: mat-midpoint-interval
            codes: [AC9M9A03]
            brief: The midpoint is found by averaging the x-values and averaging the y-values of the two end points.
          - title: Distance between two points
            id: mat-distance-between-two-points
            codes: [AC9M9A03]
            brief: The distance between two points comes from Pythagoras' theorem, using the change in x and the change in y as the two shorter sides.
          - title: Gradient and y-intercept
            id: mat-gradient-y-intercept
            codes: [AC9M9A06]
            brief: In y = mx + c, m is the gradient and c is where the line cuts the y-axis, so changing m tilts the line and changing c shifts it up or down.

      - title: Quadratic equations and graphs
        id: ac-mat-9-2-3
        points:
          - title: Graphing parabolas
            id: mat-graphing-parabolas
            codes: [AC9M9A04]
            brief: The graph of y = x² is a U-shaped parabola with its turning point at the origin and the y-axis as its line of symmetry.
          - title: Changing a parabola
            id: mat-changing-parabola
            codes: [AC9M9A06]
            brief: In y = ax², a larger a makes the parabola narrower and a negative a turns it upside down, while adding a number shifts it up or down.
          - title: Solving quadratics by factorising
            id: mat-solving-quadratics-by-factorising
            codes: [AC9M9A04]
            brief: Factorise, then set each factor to zero, so x² − 5x + 6 = 0 becomes (x − 2)(x − 3) = 0 and x = 2 or x = 3.
          - title: Solving quadratics from a graph
            id: mat-solving-quadratics-from-graph
            codes: [AC9M9A04]
            brief: The solutions of a quadratic equation equal to zero are the x-values where its parabola crosses the x-axis.
          - title: Choosing a linear or quadratic model
            id: mat-choosing-linear-or-quadratic
            codes: [AC9M9A05]
            brief: Change by the same amount each step suits a linear model, while a path that rises then falls, such as a thrown ball, suits a quadratic one.

  - title: Measurement
    chapters:
      - title: Surface area and volume
        id: ac-mat-9-3-1
        points:
          - title: Surface area of prisms
            id: mat-surface-area-prisms
            codes: [AC9M9M01]
            brief: The surface area of a prism is the total area of all its faces, found by adding the area of each face, often using its net.
          - title: Volume of cylinders
            id: mat-volume-cylinders
            codes: [AC9M9M01]
            brief: A cylinder's volume is the area of its circular base times its height, V = πr²h.
          - title: Surface area of cylinders
            id: mat-surface-area-cylinders
            codes: [AC9M9M01]
            brief: A closed cylinder's surface area is two circles plus a curved surface that unrolls into a rectangle, giving SA = 2πr² + 2πrh.

      - title: Trigonometry, proportion and error
        id: ac-mat-9-3-2
        points:
          - title: The trigonometric ratios
            id: mat-trigonometric-ratios
            codes: [AC9M9SP01]
            brief: In a right-angled triangle, sine is opposite over hypotenuse, cosine is adjacent over hypotenuse and tangent is opposite over adjacent, and similar triangles give the same ratios for the same angle.
          - title: Finding a side with trigonometry
            id: mat-finding-side-with-trigonometry
            codes: [AC9M9M03]
            brief: Choose the ratio that links the known angle, the known side and the unknown side, then rearrange, such as x = 10 × sin 30° = 5.
          - title: Finding an angle with trigonometry
            id: mat-finding-angle-with-trigonometry
            codes: [AC9M9M03]
            brief: When two sides are known, find their ratio and use the inverse function on a calculator, such as tan⁻¹, to get the angle.
          - title: Direct proportion and scale
            id: mat-direct-proportion-scale
            codes: [AC9M9M05]
            brief: Two quantities are in direct proportion when one is always the same multiple of the other, as in a scale drawing where 1 cm stands for 2 m.
          - title: Absolute, relative and percentage error
            id: mat-absolute-relative-percentage-error
            codes: [AC9M9M04]
            brief: Every measurement is an estimate. Absolute error is the gap between a measured and an actual value, relative error is that gap divided by the actual value, and percentage error is relative error times 100.

  - title: Space
    chapters:
      - title: Enlargement and similarity
        id: ac-mat-9-4-1
        points:
          - title: Enlargements
            id: mat-enlargements
            codes: [AC9M9SP02]
            brief: An enlargement multiplies every distance from a centre by the same scale factor, so the image is the same shape but a different size.
          - title: What changes in an enlargement
            id: mat-changes-enlargement
            codes: [AC9M9SP02]
            brief: An enlargement keeps angles the same but multiplies lengths by the scale factor k, and multiplies area by k².
          - title: Finding sides in similar triangles
            id: mat-finding-sides-similar-triangles
            codes: [AC9M9SP01, AC9M9SP02]
            brief: Matching sides of similar triangles are in the same ratio, so an unknown side is found from the scale factor.
          - title: Geometric constructions as steps
            id: mat-geometric-constructions-as-steps
            codes: [AC9M9SP03]
            brief: A construction, such as bisecting an angle with a compass and ruler, is an ordered set of steps, like an algorithm, that always works.

  - title: Statistics
    chapters:
      - title: Surveys and comparing data
        id: ac-mat-9-5-1
        points:
          - title: Reading survey reports critically
            id: mat-reading-survey-reports-critically
            codes: [AC9M9ST01]
            brief: Before trusting a survey's estimate of a mean or median, check who was asked, how many, and how the data was collected.
          - title: Sampling methods and bias
            id: mat-sampling-methods-bias
            codes: [AC9M9ST02]
            brief: Sampling methods such as random, systematic and stratified samples suit different situations, and a poor method, such as an online poll, can bias results.
          - title: Misleading graphs
            id: mat-misleading-graphs-2
            codes: [AC9M9ST02]
            brief: A graph can mislead with a vertical axis that does not start at zero, uneven scales or pictures sized wrongly, which pushes a point of view.
          - title: Comparing data sets
            id: mat-comparing-data-sets-2
            codes: [AC9M9ST03]
            brief: Back-to-back stem-and-leaf plots and parallel dot plots put two data sets side by side to compare centre, spread, shape and outliers.
          - title: Choosing a display
            id: mat-choosing-display
            codes: [AC9M9ST04]
            brief: Categorical data suits a bar or pie chart, numerical data suits a histogram or dot plot, and change over time suits a line graph.

  - title: Probability
    chapters:
      - title: Compound events
        id: ac-mat-9-6-1
        points:
          - title: With and without replacement
            id: mat-with-without-replacement
            codes: [AC9M9P01]
            brief: When an item is replaced, the probabilities stay the same for the next pick. When it is not replaced, the total and the counts change.
          - title: Listing outcomes for compound events
            id: mat-listing-outcomes-compound-events
            codes: [AC9M9P01]
            brief: Arrays, tables and tree diagrams list every outcome of a two- or three-step experiment, such as tossing three coins, so each probability can be found.
          - title: And, inclusive or and exclusive or
            id: mat-inclusive-or-exclusive-or
            codes: [AC9M9P02]
            brief: A and B means both happen, inclusive A or B means either or both, and exclusive A or B means one but not both.
          - title: Estimating probability from relative frequency
            id: mat-estimating-probability-from-relative
            codes: [AC9M9P02, AC9M9P03]
            brief: When outcomes are not equally likely, the relative frequency from many trials or past data estimates the probability.
