# NSW Chemistry, Year 12: Modules 5 to 8, 47 points.
# Drafted from NESA's Chemistry Stage 6 Syllabus (2017), the syllabus taught in Year 12 until at least the 2027 HSC. The
# structure follows the syllabus: each module is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# In transition: a Chemistry 11-12 Syllabus (2025) replaces this one. Check NESA's Chemistry page for when Year 12
# moves to it.

id: nsw-chem-12
subject: Chemistry
bank: chem
name: Chemistry, Year 12
about: HSC, Equilibrium, acids, organic chemistry and analysis
short: Chemistry
years: [12]
place: nsw
kind: standard
syllabus: NSW Chemistry Stage 6 Syllabus (2017), Year 12 course, Modules 5 to 8
note: Follows the NSW Chemistry syllabus. Not made or endorsed by NESA.
chips: [Le Chatelier, buffer, titration, ester, spectroscopy]

units:
  - title: Equilibrium and acid reactions
    chapters:
      - title: Chemical equilibrium
        id: nsw-chem-12-1-1
        points:
          - title: Static and dynamic equilibrium
            id: chem-static-dynamic-equilibrium
            brief: At dynamic equilibrium, forward and reverse reactions go on at the same rate, so amounts stay constant. It needs a closed system.
          - title: Le Chatelier's principle
            id: chem-le-chatelier-s-principle
            brief: When a system at equilibrium is disturbed by a change in concentration, pressure or temperature, it shifts to partly undo the change.
          - title: The equilibrium constant
            id: chem-equilibrium-constant
            brief: K is the ratio of product concentrations to reactant concentrations, each raised to the power of its coefficient. A large K means products are favoured.
          - title: Temperature and the equilibrium constant
            id: chem-temperature-equilibrium-constant
            brief: Only temperature changes K. For an exothermic reaction, raising the temperature lowers K.
          - title: Reaction quotient
            id: chem-reaction-quotient
            brief: Q has the same form as K but uses the concentrations at any moment. Comparing Q with K shows which way the reaction will move.

      - title: Solubility equilibria
        id: nsw-chem-12-1-2
        points:
          - title: Dissolving ionic compounds
            id: chem-dissolving-ionic-compounds
            brief: When an ionic solid dissolves, water molecules surround and separate the ions. Some compounds dissolve only slightly.
          - title: The solubility product
            id: chem-solubility-product
            brief: Ksp is the equilibrium constant for a slightly soluble salt dissolving. It is used to find solubility and predict whether a precipitate will form.
          - title: Predicting precipitation
            id: chem-predicting-precipitation
            brief: If the ion product is greater than Ksp, a precipitate forms.

  - title: Acid and base reactions
    chapters:
      - title: Acids and bases
        id: nsw-chem-12-2-1
        points:
          - title: Properties of acids and bases
            id: chem-properties-acids-bases
            brief: Acids taste sour, turn blue litmus red and react with metals and carbonates. Bases feel slippery and turn red litmus blue. Indicators change colour with pH.
          - title: Arrhenius and Brønsted-Lowry definitions
            id: chem-arrhenius-br-nsted-lowry
            brief: Arrhenius said acids release H⁺ ions in water. Brønsted and Lowry said an acid donates a proton and a base accepts one, which works beyond water.
          - title: Conjugate acid-base pairs
            id: chem-conjugate-acid-base-pairs
            brief: When an acid donates a proton, what is left is its conjugate base. Strong acids have very weak conjugate bases.
          - title: Strong and weak acids
            id: chem-strong-weak-acids
            brief: A strong acid ionises fully in water. A weak acid ionises only partly. Strength is not the same as concentration.
          - title: pH and pOH
            id: chem-ph-poh
            brief: pH = -log[H⁺] and pOH = -log[OH⁻], and at 25°C pH + pOH = 14.
          - title: Acid dissociation constant
            id: chem-acid-dissociation-constant
            brief: Ka measures how far a weak acid ionises, and pKa = -log Ka. A smaller pKa means a stronger acid.

      - title: Neutralisation and analysis
        id: nsw-chem-12-2-2
        points:
          - title: Neutralisation reactions
            id: chem-neutralisation-reactions
            brief: An acid and a base react to form a salt and water, releasing heat, the enthalpy of neutralisation.
          - title: Titration
            id: chem-titration
            brief: Adding a solution of known concentration from a burette until the reaction is complete, to find an unknown concentration.
          - title: Choosing an indicator
            id: chem-choosing-indicator
            brief: The indicator must change colour near the equivalence point, which depends on whether the acid and base are strong or weak.
          - title: Titration curves
            id: chem-titration-curves
            brief: Graphs of pH against volume added, showing the equivalence point and a buffer region for weak acids.
          - title: Buffers
            id: chem-buffers
            brief: A mix of a weak acid and its conjugate base resists changes in pH when small amounts of acid or base are added, as blood does.

  - title: Organic chemistry
    chapters:
      - title: Hydrocarbons
        id: nsw-chem-12-3-1
        points:
          - title: Naming hydrocarbons
            id: chem-naming-hydrocarbons
            brief: IUPAC names give the longest carbon chain, the type of bonds and where branches sit, such as 2-methylbutane.
          - title: Alkanes, alkenes and alkynes
            id: chem-alkanes-alkenes-alkynes
            brief: Alkanes have only single bonds, alkenes at least one double bond and alkynes at least one triple bond.
          - title: Isomers
            id: chem-isomers
            brief: Compounds with the same molecular formula but different structures, such as chain, position and functional group isomers.
          - title: Reactions of alkenes
            id: chem-reactions-alkenes
            brief: Alkenes undergo addition reactions with hydrogen, halogens, hydrogen halides and water. Bromine water is decolourised by alkenes, which tests for them.
          - title: Properties of hydrocarbons
            id: chem-properties-hydrocarbons
            brief: Boiling points rise with chain length because dispersion forces grow. Hydrocarbons do not dissolve in water.

      - title: Functional groups
        id: nsw-chem-12-3-2
        points:
          - title: Alcohols
            id: chem-alcohols
            brief: Alcohols have an OH group. They can be primary, secondary or tertiary, and their boiling points are higher than alkanes because of hydrogen bonding.
          - title: Reactions of alcohols
            id: chem-reactions-alcohols
            brief: Alcohols burn, can be dehydrated to alkenes, and are oxidised to aldehydes, ketones or carboxylic acids depending on their type.
          - title: Aldehydes, ketones and carboxylic acids
            id: chem-aldehydes-ketones-carboxylic-acids
            brief: Aldehydes and ketones have a C=O group. Carboxylic acids have a COOH group and are weak acids.
          - title: Amines and amides
            id: chem-amines-amides
            brief: Amines contain nitrogen and act as weak bases. Amides form when a carboxylic acid joins an amine.
          - title: Esterification
            id: chem-esterification
            brief: A carboxylic acid and an alcohol react, with a sulfuric acid catalyst and heat under reflux, to make an ester and water.
          - title: Soaps and detergents
            id: chem-soaps-detergents
            brief: Soap molecules have a water-loving head and an oil-loving tail, so they surround grease and lift it into water.

      - title: Polymers
        id: nsw-chem-12-3-3
        points:
          - title: Addition polymers
            id: chem-addition-polymers
            brief: Alkene monomers join by opening their double bonds, as in polyethylene and PVC.
          - title: Condensation polymers
            id: chem-condensation-polymers
            brief: Monomers with two functional groups join and give off a small molecule, such as water, as in nylon and polyester.
          - title: Properties and uses of polymers
            id: chem-properties-uses-polymers
            brief: Chain length, branching and cross-links decide how strong, flexible and heat resistant a polymer is.

  - title: Applying chemical ideas
    chapters:
      - title: Analysing inorganic substances
        id: nsw-chem-12-4-1
        points:
          - title: Why chemists analyse substances
            id: chem-chemists-analyse-substances
            brief: Analysis finds what a substance is and how much is present, for water quality, food safety, mining and health.
          - title: Tests for ions
            id: chem-tests-ions
            brief: Flame tests and precipitation reactions identify metal ions and anions such as chloride, sulfate and carbonate.
          - title: Gravimetric analysis
            id: chem-gravimetric-analysis
            brief: Finding the amount of a substance by making it form a precipitate, then drying and weighing it.
          - title: Atomic absorption spectroscopy
            id: chem-atomic-absorption-spectroscopy
            brief: AAS measures how much light of a set wavelength atoms absorb, to find very low concentrations of a metal. It was developed in Australia.
          - title: Colorimetry and UV-visible spectroscopy
            id: chem-colorimetry-uv-visible-spectroscopy
            brief: The amount of light a coloured solution absorbs rises with concentration, so a calibration curve gives an unknown concentration.

      - title: Analysing organic substances
        id: nsw-chem-12-4-2
        points:
          - title: Chemical tests for organic compounds
            id: chem-chemical-tests-organic-compounds
            brief: Simple tests identify functional groups, such as bromine water for double bonds and sodium carbonate for carboxylic acids.
          - title: Mass spectrometry
            id: chem-mass-spectrometry
            brief: Molecules are ionised and broken into fragments. The pattern of masses shows the molar mass and parts of the structure.
          - title: Infrared spectroscopy
            id: chem-infrared-spectroscopy
            brief: Bonds absorb infrared light at particular wavenumbers, so peaks show which functional groups are present, such as a broad O-H peak.
          - title: Carbon-13 NMR
            id: chem-carbon-13-nmr
            brief: Each different carbon environment gives a peak, so the number of peaks shows how many kinds of carbon there are.
          - title: Proton NMR
            id: chem-proton-nmr
            brief: Peaks show the hydrogen environments, the area shows how many hydrogens, and splitting shows how many hydrogens are next door.

      - title: Chemical synthesis and design
        id: nsw-chem-12-4-3
        points:
          - title: Designing a chemical synthesis
            id: chem-designing-chemical-synthesis
            brief: Choosing reactants, conditions and steps to make a product, weighing yield, purity, cost and safety.
          - title: Yield and purity
            id: chem-yield-purity
            brief: Percentage yield compares the product made with the most that could be made. Purity is how much of the product is the wanted substance.
          - title: Sustainability in industry
            id: chem-sustainability-industry
            brief: Green chemistry aims for less waste, safer chemicals, renewable feedstocks and lower energy use.
          - title: An industrial process
            id: chem-industrial-process
            brief: How a large-scale process, such as making ammonia by the Haber process, balances rate, yield and cost using equilibrium ideas.
