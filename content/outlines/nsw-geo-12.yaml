# NSW Geography, Year 12: the three Year 12 focus areas, 29 points.
# Drafted from NESA's Geography 11-12 Syllabus (2022), taught in Year 12 since Term 4 2024 and first examined in the
# 2025 HSC. The structure follows the syllabus: each focus area is a unit. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Schools pick their own case studies, so the briefs stay with the ideas and use short examples only.

id: nsw-geo-12
subject: Geography
bank: geo
name: Geography, Year 12
about: HSC, Sustainability, places and biodiversity
short: Geography
years: [12]
place: nsw
kind: standard
syllabus: NSW Geography 11-12 Syllabus (2022), Year 12 focus areas
note: Follows the NSW Geography syllabus. Not made or endorsed by NESA.
chips: [ecological footprint, gentrification, megacity, biodiversity hotspot, ecosystem services]

units:
  - title: Global sustainability
    chapters:
      - title: Sustainable development
        id: nsw-geo-12-1-1
        points:
          - title: What sustainability means
            id: geo-sustainability-means
            brief: Meeting the needs of people today without harming the ability of future generations to meet theirs, across the environment, the economy and society.
          - title: The Sustainable Development Goals
            id: geo-sustainable-development-goals
            brief: The UN's 17 goals, agreed in 2015 for 2030, cover poverty, health, education, inequality, climate and the environment.
          - title: Ecological footprint
            id: geo-ecological-footprint
            brief: The area of land and water needed to supply what a person or country uses and absorb its waste. Rich countries have much larger footprints.
          - title: Consumption and resource use
            id: geo-consumption-resource-use
            brief: Rising consumption, especially in wealthy countries, drives demand for resources and the waste and emissions that come with them.

      - title: Responding to global challenges
        id: nsw-geo-12-1-2
        points:
          - title: Climate change as a sustainability challenge
            id: geo-climate-change-as-sustainability
            brief: Burning fossil fuels raises greenhouse gases, warming the planet and bringing more extreme weather, sea level rise and harm to ecosystems.
          - title: The circular economy
            id: geo-circular-economy
            brief: An economy that designs out waste by reusing, repairing and recycling materials instead of making, using and throwing away.
          - title: The energy transition
            id: geo-energy-transition
            brief: The shift from fossil fuels to renewable energy such as solar and wind, which brings new jobs and costs for different places.
          - title: Responses at different scales
            id: geo-responses-at-different-scales
            brief: Sustainability needs action by international agreements, national governments, businesses, communities and individuals.
          - title: Inequality and sustainability
            id: geo-inequality-sustainability
            brief: Poorer countries and communities often face the worst effects of environmental change while having caused the least of it.

  - title: Rural and urban places
    chapters:
      - title: Urban places
        id: nsw-geo-12-2-1
        points:
          - title: Defining urban and rural places
            id: geo-defining-urban-rural-places
            brief: Urban places have high population density and mostly non-farm jobs. Rural places have lower density and more land used for farming or nature.
          - title: Urban growth
            id: geo-urban-growth
            brief: Cities grow through natural increase and migration from rural areas and overseas, spreading outwards and upwards.
          - title: Megacities
            id: geo-megacities
            brief: Cities of more than 10 million people, most now in Asia, Africa and Latin America, with large informal settlements in some.
          - title: Suburbanisation and urban sprawl
            id: geo-suburbanisation-urban-sprawl
            brief: Cities spread outwards as people move to new suburbs, which uses farmland and increases car travel.
          - title: Urban renewal and gentrification
            id: geo-urban-renewal-gentrification
            brief: Old areas are redeveloped, and wealthier residents move in. Prices rise and long-term residents can be pushed out.
          - title: Liveability
            id: geo-liveability
            brief: How good a place is to live, judged by housing, transport, safety, services, green space and the environment.

      - title: Rural places and planning
        id: nsw-geo-12-2-2
        points:
          - title: Rural change
            id: geo-rural-change
            brief: Farming has become larger and more mechanised, so many rural towns have lost people and services, while some coastal towns grow.
          - title: Counter-urbanisation
            id: geo-counter-urbanisation
            brief: People moving from cities to rural areas and small towns, for lifestyle, cheaper housing or remote work.
          - title: Links between rural and urban places
            id: geo-links-between-rural-urban
            brief: Cities depend on rural areas for food, water and energy, and rural areas depend on cities for markets and services.
          - title: Planning sustainable places
            id: geo-planning-sustainable-places
            brief: Planners use urban consolidation, public transport, green space and good design to make places more sustainable and liveable.

  - title: Ecosystems and global biodiversity
    chapters:
      - title: How ecosystems work
        id: nsw-geo-12-3-1
        points:
          - title: Ecosystem functioning
            id: geo-ecosystem-functioning
            brief: Ecosystems run on energy from the sun flowing through food webs and on nutrients and water cycling between living and non-living parts.
          - title: Levels of biodiversity
            id: geo-levels-biodiversity
            brief: Biodiversity is the variety of life at three levels, genetic diversity, species diversity and ecosystem diversity.
          - title: Biodiversity hotspots
            id: geo-biodiversity-hotspots
            brief: Regions very rich in species found nowhere else that are also under severe threat. South-west Australia is one.
          - title: Ecosystem services
            id: geo-ecosystem-services
            brief: The benefits people get from ecosystems, such as clean water, pollination, food, protection from floods and cultural value.
          - title: Resilience and change
            id: geo-resilience-change
            brief: Ecosystems can absorb some disturbance and recover, but too much change can push them past a tipping point.

      - title: Threats and management
        id: nsw-geo-12-3-2
        points:
          - title: Threats to biodiversity
            id: geo-threats-biodiversity
            brief: Habitat loss, invasive species, pollution, overuse and climate change are the main causes of species decline.
          - title: Extinction in Australia
            id: geo-extinction-australia
            brief: Australia has one of the world's worst records of mammal extinctions since European arrival, mostly from cats, foxes and land clearing.
          - title: Protected areas
            id: geo-protected-areas
            brief: National parks and marine reserves protect habitats, but they work only if they are large, connected and well managed.
          - title: International action on biodiversity
            id: geo-international-action-biodiversity
            brief: Agreements such as the Convention on Biological Diversity and CITES, which controls trade in endangered species, coordinate action between countries.
          - title: Traditional knowledge in conservation
            id: geo-traditional-knowledge-conservation
            brief: Indigenous ranger programs and traditional knowledge help manage Country, monitor species and control fire and pests.
