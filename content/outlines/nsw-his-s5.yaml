# NSW History, Stage 5 (Years 9 and 10): the historical skills, the two historical contexts, the three core depth
# studies and two depth study options, 68 points.
# Follows NESA's History 7-10 Syllabus (2024), checked on the NSW Curriculum website (curriculum.nsw.edu.au) in
# November 2026. Schools plan for it in 2025 and 2026 and teach it from 2027 (NSW recommends Year 9 in 2027 and Year 10
# in 2028), so this follows the new syllabus, not the History K-10 Syllabus it replaces (dated 2012, listed on the NSW
# Curriculum website as its 2019 version), which is not available after December 2028.
# Structure: the historical skills are the first unit. Historical context 4 (The making of the modern world, 1750 to
# about 1945) is a unit, followed by its two core depth studies (Australia: making a nation, from Federation to WWI;
# Australia at war, WWII), each a unit. Historical context 5 (The modern world) and its core depth study (Human rights
# and freedoms, about 1938 to 2017) make one unit. The last unit holds the options.
# Options: schools choose at least one of ten depth study options, and at least one option across Stages 4 and 5 must
# be non-western. Here: The Industrial Revolution (1750 to 1850) and Migration experiences (1945 to about 2016,
# non-western, used in the NSW Department of Education's sample Year 10 scope and sequence). The movement of peoples,
# Imperialism in Asia, the ideas and movements option (1750 to 1918), The Holocaust, Rights and freedoms of Australian women, Popular culture
# in Australia, The environmental movement and a school-developed topic can be added as chapters. In Human rights and
# freedoms, the "one other group" is the women's movement in Australia, and the impact and legacy points cover
# all three choices: inequality, reclaiming Languages and cultures, and human rights conventions. The case study and site study are taught only as the
# ideas behind them. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-his-s5
subject: History
bank: his
name: History, Stage 5
about: NSW Stage 5, Years 9 and 10
short: History
years: [9, 10]
level: Stage 5
place: nsw
kind: standard
syllabus: NSW History 7-10 Syllabus (2024), Stage 5
note: Follows the NSW History syllabus. Not made or endorsed by NESA.
chips: [Federation, Gallipoli, Kokoda, 1967 Referendum, Freedom Ride, migration]

units:
  - title: Working as a historian
    chapters:
      - title: Evidence and argument
        id: nsw-his-s5-1-1
        points:
          - title: Usefulness and reliability
            id: his-usefulness-reliability
            brief: A source is reliable if it can be trusted to be accurate, and useful if it helps answer your question. Even a biased source can be useful as evidence of a point of view.
            codes: [HI5-INQ-01, HI5-SOU-01]
          - title: Bias and propaganda
            id: his-bias-propaganda
            brief: Bias is a one-sided view that comes from who made a source and why. Propaganda is made on purpose to persuade, often by governments in wartime.
            codes: [HI5-INQ-01]
          - title: Corroborating sources
            id: his-corroborating-sources
            brief: Historians check a source against other sources, and a claim that several independent sources support is stronger.
            codes: [HI5-SOU-01]
          - title: "Historians' interpretations"
            id: his-historians-interpretations
            brief: Historians interpret the same events differently because of the evidence they use, the questions they ask and the time they write in.
            codes: [HI5-CPP-01]
          - title: Building a historical argument
            id: his-building-historical-argument
            brief: A historical argument states a clear thesis, supports each point with evidence from sources and explains how the evidence proves the point.
            codes: [HI5-COM-01, HI5-SOU-01]

  - title: The making of the modern world
    chapters:
      - title: Revolutions and nations
        id: nsw-his-s5-2-1
        points:
          - title: The Industrial Revolution in brief
            id: his-industrial-revolution-brief
            brief: From about 1750, Britain moved from making goods by hand to making them by machines in factories, and people moved to cities for work.
            codes: [HI5-CON-01]
          - title: The American Revolution
            id: his-american-revolution
            brief: The American colonies broke from Britain in a war from 1775 to 1783, and their Declaration of Independence claimed rights to life, liberty and the pursuit of happiness.
            codes: [HI5-IEP-01]
          - title: The French Revolution
            id: his-french-revolution
            brief: From 1789 the French overthrew their king and declared the rights of man and of the citizen, spreading ideas of equality, democracy and the rule of law.
            codes: [HI5-IEP-01]
          - title: Nationalism and nation-states
            id: his-nationalism-nation-states
            brief: Nationalism is the belief that a people sharing a language and culture should rule themselves, which led to new nation-states such as Italy and Germany in the 1800s.
            codes: [HI5-CON-01]

      - title: Empire and the world wars
        id: nsw-his-s5-2-2
        points:
          - title: Empires and the movement of peoples
            id: his-empires-movement-peoples
            brief: European empires moved millions of people, through the slave trade, convict transportation to Australia and migration in search of land and work.
            codes: [HI5-CON-01]
          - title: Causes of the First World War
            id: his-causes-first-world-war
            brief: Militarism, alliances, imperial rivalry and nationalism raised tensions in Europe, and the assassination of Archduke Franz Ferdinand in 1914 set off the war.
            codes: [HI5-CON-01]
          - title: The Paris Peace Conference
            id: his-paris-peace-conference
            brief: In 1919 the winners redrew the map of Europe, set up the League of Nations and made Germany accept blame and pay reparations in the Treaty of Versailles.
            codes: [HI5-IEP-01]
          - title: Extremism between the wars
            id: his-extremism-between-wars
            brief: Anger at the peace treaties and the Great Depression helped extreme movements gain power, such as fascism in Italy, Nazism in Germany and communism in the Soviet Union.
            codes: [HI5-CON-01]

  - title: "Australia: making a nation"
    chapters:
      - title: Federation
        id: nsw-his-s5-3-1
        points:
          - title: Democracy in the colonies
            id: his-democracy-colonies
            brief: In the 1850s Australian colonies gained their own parliaments, and they were among the first places to use the secret ballot and give most men the vote.
            codes: [HI5-SPE-01]
          - title: The road to Federation
            id: his-road-federation
            brief: Supporters such as Henry Parkes argued for defence, free trade between colonies and a national identity, others had doubts, and voters approved the Constitution before the colonies federated on 1 January 1901.
            codes: [HI5-CPP-01]
          - title: "Australia's system of government"
            id: his-australia-s-system-government
            brief: Federation split power between the Commonwealth and the states, set out in the Constitution, with a parliament, government and courts, and NSW kept its own parliament for state matters.
            codes: [HI5-SPE-01]
          - title: The White Australia policy
            id: his-white-australia-policy-nsw
            brief: The Immigration Restriction Act 1901 used a dictation test to keep out people who were not white, and it shaped migration for decades.
            codes: [HI5-SPE-01]
          - title: "Workers' rights"
            id: his-workers-rights
            brief: Trade unions and the Labor Party pushed for workers' rights, and the Harvester judgment of 1907 set a basic wage to support a family.
            codes: [HI5-SPE-01]
          - title: Votes for women
            id: his-votes-women
            brief: The Commonwealth Franchise Act 1902 gave most women the right to vote and stand in federal elections, but left out most Aboriginal people and many people of Asian and Pacific background.
            codes: [HI5-SPE-01, HI5-APP-01]

      - title: Australia in the First World War
        id: nsw-his-s5-3-2
        points:
          - title: Why Australia went to war
            id: his-australia-went-war
            brief: As part of the British Empire, Australia joined the war in 1914, and many men enlisted out of loyalty to Britain, adventure or pay.
            codes: [HI5-CON-01]
          - title: Gallipoli
            id: his-gallipoli
            brief: On 25 April 1915 Australian and New Zealand troops landed at Gallipoli in Turkey, and after eight months and heavy losses they withdrew.
            codes: [HI5-SPE-01]
          - title: The Western Front
            id: his-western-front
            brief: Most Australians fought in France and Belgium, in trench battles such as Fromelles and Pozières in 1916, where casualties were very high.
            codes: [HI5-SPE-01]
          - title: The War Precautions Act and the home front
            id: his-war-precautions-act-home
            brief: The War Precautions Act 1914 let the government censor news, control the economy and intern people of German background, while women and others raised money and supplies.
            codes: [HI5-SPE-01]
          - title: The conscription votes
            id: his-conscription-votes
            brief: Australians voted twice, in 1916 and 1917, on whether men could be forced to fight overseas, bitterly divided debates that ended in No both times.
            codes: [HI5-CPP-01]
          - title: The impact of the war on different groups
            id: his-impact-war-different-groups
            brief: The war affected groups differently, such as Aboriginal soldiers who served but were not treated as equals on return, migrants under suspicion and women taking new roles.
            codes: [HI5-CPP-01, HI5-APP-01]
          - title: The Anzac legend
            id: his-anzac-legend-nsw
            brief: The Anzac legend describes soldiers as brave, loyal to their mates and tough. It is remembered on Anzac Day, and historians debate whose stories it leaves out.
            codes: [HI5-IEP-01, HI5-CPP-01]

  - title: "Australia at war: WWII"
    chapters:
      - title: Causes and campaigns
        id: nsw-his-s5-4-1
        points:
          - title: Causes of the Second World War
            id: his-causes-second-world-war-nsw
            brief: Long-term causes included the Treaty of Versailles and the Great Depression, and short-term causes included Hitler's expansion and Germany's invasion of Poland in 1939.
            codes: [HI5-CON-01]
          - title: Australia enters the war
            id: his-australia-enters-war
            brief: Prime Minister Menzies announced in September 1939 that Australia was at war because Britain was, and people enlisted for many reasons.
            codes: [HI5-CON-01]
          - title: North Africa and Crete
            id: his-north-africa-crete
            brief: Australians fought in North Africa, including the siege of Tobruk in 1941, and in the failed defence of Greece and Crete that same year.
            codes: [HI5-SPE-01]
          - title: The fall of Singapore
            id: his-fall-singapore
            brief: Japan captured Singapore in February 1942, and about 15,000 Australians became prisoners of war, a shock that showed Britain could not defend Australia.
            codes: [HI5-SPE-01]
          - title: The Battle for Australia
            id: his-battle-australia
            brief: In 1942 Japan bombed Darwin and Australians fought on the Kokoda Track in New Guinea, and Australia turned to the United States for help in the Pacific War.
            codes: [HI5-SPE-01]

      - title: The home front in WWII
        id: nsw-his-s5-4-2
        points:
          - title: Government controls
            id: his-government-controls
            brief: The government rationed food and clothing, censored the news and directed people into war work to support the war effort.
            codes: [HI5-SPE-01]
          - title: "Women's changing roles in WWII"
            id: his-women-s-changing-roles-nsw
            brief: Women joined the services and took jobs in factories and on farms that men had done, though usually for lower pay.
            codes: [HI5-SPE-01]
          - title: Aboriginal and Torres Strait Islander service in WWII
            id: his-aboriginal-torres-strait-islander
            brief: Aboriginal and Torres Strait Islander people served in the forces, including the Torres Strait Light Infantry Battalion, and worked as scouts, labourers and coast watchers.
            codes: [HI5-APP-01]
          - title: Internment of enemy aliens
            id: his-internment-enemy-aliens
            brief: People in Australia of German, Italian and Japanese background were seen as enemy aliens, and thousands were held in internment camps.
            codes: [HI5-CPP-01]

      - title: The human cost of war
        id: nsw-his-s5-4-3
        points:
          - title: Prisoners of war
            id: his-prisoners-war
            brief: Australians held by Japan, such as at Changi and on the Burma-Thailand Railway, faced starvation, disease and forced labour, and many died.
            codes: [HI5-SPE-01]
          - title: The Holocaust
            id: his-holocaust-nsw
            brief: Nazi Germany murdered about six million Jewish people, along with Roma, disabled people and others, and some survivors later rebuilt their lives in Australia.
            codes: [HI5-SPE-01]
          - title: Coming home from war
            id: his-coming-home-from-war
            brief: Returning personnel faced injuries and lasting trauma, and Aboriginal and Torres Strait Islander veterans were often left out of help such as land for soldier settlers.
            codes: [HI5-APP-01, HI5-CPP-01]
          - title: The Nuremberg trials and the Genocide Convention
            id: his-nuremberg-trials-genocide-convention
            brief: The Nuremberg trials from 1945 put Nazi leaders on trial for war crimes, and in 1948 the United Nations agreed the Genocide Convention to prevent and punish genocide.
            codes: [HI5-IEP-01]

  - title: The modern world and human rights
    chapters:
      - title: The world after 1945
        id: nsw-his-s5-5-1
        points:
          - title: The United Nations
            id: his-united-nations
            brief: The United Nations was formed in 1945 to keep peace and promote cooperation, with a General Assembly of all members and a Security Council.
            codes: [HI5-CON-01]
          - title: The Universal Declaration of Human Rights
            id: his-universal-declaration-human-rights-nsw
            brief: In 1948 the UN agreed the Universal Declaration of Human Rights, listing rights for everyone, and Australia's H. V. Evatt was President of the General Assembly when it passed.
            codes: [HI5-IEP-01]
          - title: The Cold War
            id: his-cold-war-nsw
            brief: After 1945 the United States and the Soviet Union competed for power without fighting each other directly, and fear of nuclear war shaped films, music and daily life.
            codes: [HI5-CON-01]
          - title: New technologies after 1945
            id: his-new-technologies-after-1945
            brief: Television, computers, jet travel and later the internet changed how people worked, communicated and spent their free time.
            codes: [HI5-CON-01]
          - title: Environmental awareness
            id: his-environmental-awareness
            brief: From the 1960s people grew concerned about pollution and damage to nature, which led to environmental movements and laws.
            codes: [HI5-CON-01]

      - title: Aboriginal rights before 1967
        id: nsw-his-s5-5-2
        points:
          - title: Early Aboriginal activism
            id: his-early-aboriginal-activism
            brief: Aboriginal activists such as William Cooper, Jack Patten and William Ferguson held a Day of Mourning on 26 January 1938 to demand equal rights.
            codes: [HI5-APP-01]
          - title: The US civil rights movement
            id: his-us-civil-rights-movement
            brief: African Americans, led by people such as Martin Luther King Jr, used protests and boycotts to end segregation, which inspired activists in Australia.
            codes: [HI5-CPP-01]
          - title: The 1965 Freedom Ride
            id: his-1965-freedom-ride
            brief: Charles Perkins and members of Student Action for Aborigines rode a bus through towns such as Walgett and Moree to expose racial segregation in NSW.
            codes: [HI5-APP-01]
          - title: The 1967 Referendum
            id: his-1967-referendum-nsw
            brief: Over 90 per cent of voters agreed to let the Commonwealth make laws for Aboriginal people and to count them in the census, a strong sign of support for change.
            codes: [HI5-APP-01]
          - title: The Stolen Generations
            id: his-stolen-generations-nsw
            brief: Government policies removed many Aboriginal and Torres Strait Islander children from their families, and the Bringing Them Home report of 1997 told their stories.
            codes: [HI5-APP-01]

      - title: Land rights and recognition
        id: nsw-his-s5-5-3
        points:
          - title: The Wave Hill walk-off
            id: his-wave-hill-walk-off-nsw
            brief: In 1966 Gurindji workers led by Vincent Lingiari walked off Wave Hill station over pay and conditions, and the strike became a fight for their land.
            codes: [HI5-APP-01]
          - title: The Aboriginal Tent Embassy
            id: his-aboriginal-tent-embassy-nsw
            brief: In 1972 activists set up a tent embassy outside Parliament House in Canberra to demand land rights, a protest that continues.
            codes: [HI5-APP-01]
          - title: Land rights laws
            id: his-land-rights-laws
            brief: The Aboriginal Land Rights (Northern Territory) Act 1976 and the NSW Aboriginal Land Rights Act 1983 let Aboriginal people claim back some land.
            codes: [HI5-APP-01]
          - title: Mabo and native title
            id: his-mabo-native-title-nsw
            brief: In 1992 the High Court's Mabo decision, won by Eddie Mabo for the Meriam people, rejected terra nullius, and the Native Title Act 1993 followed.
            codes: [HI5-APP-01]
          - title: Reclaiming languages and cultures
            id: his-reclaiming-languages-cultures
            brief: Aboriginal communities are reviving languages and cultural practices that colonisation suppressed, which strengthens identity and connection to Country.
            codes: [HI5-APP-01]

      - title: Rights and their legacy
        id: nsw-his-s5-5-4
        points:
          - title: The women's movement in Australia
            id: his-women-s-movement-australia
            brief: Women campaigned for equal pay, won in decisions of 1969 and 1972, for an end to the ban on married women in public service jobs and for the Sex Discrimination Act 1984.
            codes: [HI5-SPE-01]
          - title: Human rights conventions
            id: his-human-rights-conventions
            brief: International agreements, such as conventions on racial discrimination and the rights of the child, set standards that countries like Australia agree to and that shape their laws.
            codes: [HI5-IEP-01]
          - title: Closing the Gap
            id: his-closing-gap
            brief: Gaps between Aboriginal and non-Aboriginal Australians in health, education and life expectancy remain, and Closing the Gap, begun in 2008, sets targets to reduce them.
            codes: [HI5-APP-01]

  - title: Depth study options
    chapters:
      - title: The Industrial Revolution
        id: nsw-his-s5-6-1
        points:
          - title: The Agricultural Revolution
            id: his-agricultural-revolution
            brief: New farming methods and the enclosure of common land produced more food with fewer workers, so many people left villages for towns.
            codes: [HI5-CON-01]
          - title: Steam power and new inventions
            id: his-steam-power-new-inventions
            brief: The steam engine, spinning and weaving machines and railways changed how goods were made and moved.
            codes: [HI5-SPE-01]
          - title: Factories, mines and child labour
            id: his-factories-mines-child-labour
            brief: Workers, including young children, worked long hours in dangerous factories and mines for low pay.
            codes: [HI5-SPE-01]
          - title: Reform movements
            id: his-reform-movements
            brief: Reformers, trade unions and the Chartists pushed for change, and Factory Acts began to limit children's working hours.
            codes: [HI5-IEP-01]
          - title: Industrial cities and their legacy
            id: his-industrial-cities-their-legacy
            brief: Industry made Britain powerful and its cities grew fast, crowded and polluted, and the changes spread around the world.
            codes: [HI5-IEP-01]

      - title: Migration experiences
        id: nsw-his-s5-6-2
        points:
          - title: Populate or perish
            id: his-populate-or-perish-nsw
            brief: In 1945 Australia had about 7 million people, mostly of British background, and the government set out to grow the population for defence and industry.
            codes: [HI5-CON-01]
          - title: Post-war migrants
            id: his-post-war-migrants
            brief: After WWII displaced people and migrants from Britain and Europe came to Australia, many working on projects such as the Snowy Mountains Scheme.
            codes: [HI5-SPE-01]
          - title: The end of the White Australia policy
            id: his-end-white-australia-policy-nsw
            brief: The White Australia policy was eased from 1966 and ended by the Whitlam government in 1973, opening migration to people from Asia and elsewhere.
            codes: [HI5-CON-01]
          - title: Multiculturalism
            id: his-multiculturalism
            brief: In the 1970s the Whitlam and Fraser governments made multiculturalism official policy, supporting migrants to keep their cultures and languages.
            codes: [HI5-SPE-01]
          - title: Refugees from Vietnam
            id: his-refugees-from-vietnam
            brief: After the Vietnam War ended in 1975, many Vietnamese refugees fled by boat or through camps, and tens of thousands resettled in Australia.
            codes: [HI5-SPE-01]
          - title: How migration changed Australia
            id: his-migration-changed-australia
            brief: Migrants changed Australia's population, economy, food and culture, and strengthened links with their countries of origin.
            codes: [HI5-IEP-01]
