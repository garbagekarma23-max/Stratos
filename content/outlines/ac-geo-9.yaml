# Australian Curriculum Geography, Year 9: Biomes and food security, and Geographies of interconnections, 33 points.
# Follows the Australian Curriculum: Humanities and Social Sciences, Geography 7-10, Version 9.0, Year 9 (ACARA's
# curriculum content document, australiancurriculum.edu.au). Checked on the official site in November 2026. Version
# 9.0 was approved by education ministers in April 2022 and released in May 2022. Each state and territory sets when
# its schools teach it, with full implementation expected by 2027 (Western Australia teaches its own version adapted
# from it). No new version is announced: ministers have scheduled the next full version for 2032.
# Structure: the year's data skills are the first unit (the seven concepts are taught in Year 7). Each Knowledge and
# understanding sub-strand (Biomes and food security, Geographies of interconnections) is a unit, and each content
# description is a chapter, or two share one when small. Codes are ACARA's content description codes.
# Where schools choose: the farming examples are wheat and rice in Australia and Asia; the production study is e-waste;
# the tourism management example is Uluru-Kata Tjuta National Park. Other examples can be added.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-geo-9
subject: Geography
bank: geo
name: Geography, Year 9
about: "Australian Curriculum, Year 9: Biomes and food security, Geographies of interconnections"
short: Geography
years: [9]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Geography, Version 9.0, Year 9"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [biomes, food security, supply chains, tourism, trade]

units:
  - title: Geographical skills
    chapters:
      - title: Graphs and maps for patterns
        id: ac-geo-9-1-1
        points:
          - title: Reading a climate graph
            id: geo-reading-climate-graph
            brief: A climate graph shows a place's average rainfall each month as columns and its average temperature as a line, so you can read its wet and dry, hot and cool seasons.
            codes: [AC9HG9S02, AC9HG9S03]
          - title: Choropleth maps
            id: geo-choropleth-maps
            brief: A choropleth map shades areas from light to dark to show how much of something each area has, such as crop yield or internet access.
            codes: [AC9HG9S02]
          - title: Flow maps
            id: geo-flow-maps
            brief: A flow map uses arrows to show movement between places, with thicker arrows for larger flows, such as trade or tourists.
            codes: [AC9HG9S02]
          - title: Layers in a GIS
            id: geo-layers-gis
            brief: A geographical information system stores data as map layers, such as soils, rainfall and roads, which can be laid over each other to find patterns.
            codes: [AC9HG9S02, AC9HG9S03]

  - title: Biomes and food security
    chapters:
      - title: The world's biomes
        id: ac-geo-9-2-1
        points:
          - title: What a biome is
            id: geo-biome
            brief: A biome is a large region with a similar climate, soils, plants and animals, such as a tropical rainforest or a desert.
            codes: [AC9HG9K01]
          - title: Land biomes
            id: geo-land-biomes
            brief: The main land biomes are tropical rainforest, temperate forest, savanna, grassland, desert and tundra, each found in a band set mostly by climate.
            codes: [AC9HG9K01]
          - title: Water biomes
            id: geo-water-biomes
            brief: Aquatic biomes are marine, such as oceans and coral reefs, or freshwater, such as rivers, lakes and wetlands.
            codes: [AC9HG9K01]
          - title: Biome productivity
            id: geo-biome-productivity
            brief: Warm, wet biomes such as rainforests grow the most plant matter each year. Cold or dry biomes such as tundra and desert grow the least.
            codes: [AC9HG9K01]
          - title: The spheres and biomes
            id: geo-spheres-biomes
            brief: Biomes depend on the atmosphere, hydrosphere, lithosphere and biosphere working together, so human activities that change one, such as clearing or mining, change the biome.
            codes: [AC9HG9K01]

      - title: Turning biomes into farms
        id: ac-geo-9-2-2
        points:
          - title: Food and fibre from biomes
            id: geo-food-fibre-from-biomes
            brief: Grasslands grow wheat and graze sheep and cattle, rainforests give fruit, coffee, rubber and palm oil, and oceans give fish.
            codes: [AC9HG9K02]
          - title: Natural and farmed ecosystems
            id: geo-natural-farmed-ecosystems
            brief: A farm has fewer species than the natural biome it replaced, and its nutrients and water are added and taken away by people rather than cycling naturally.
            codes: [AC9HG9K02]
          - title: Changing biomes to grow more
            id: geo-changing-biomes-grow-more
            brief: Irrigation, fertilisers, pesticides, new seed varieties and terracing let people grow more food than the natural biome would allow.
            codes: [AC9HG9K02]

      - title: What makes farms productive
        id: ac-geo-9-2-3
        points:
          - title: Environmental factors in farming
            id: geo-environmental-factors-farming
            brief: Climate, soil, landform and water decide what can be grown where, such as wheat on Australia's dry plains and rice on Asia's wet river deltas.
            codes: [AC9HG9K03]
          - title: Economic factors in farming
            id: geo-economic-factors-farming
            brief: Farm output depends on land, labour, money to invest, and access to storage, transport and markets.
            codes: [AC9HG9K03]
          - title: Technology in farming
            id: geo-technology-farming
            brief: Satellite mapping, GIS, sensors and new crop varieties help farmers put water and fertiliser where needed and lift yields.
            codes: [AC9HG9K03]
          - title: Farming innovations
            id: geo-farming-innovations
            brief: Drip irrigation, crop rotation, stubble mulching, intercropping and drought-resistant crops reduce the limits the environment puts on food production.
            codes: [AC9HG9K03]

      - title: Food security
        id: ac-geo-9-2-4
        points:
          - title: What food security means
            id: geo-food-security-means
            brief: Food security means everyone can always get enough safe, healthy food. It depends on how much food is grown, whether people can afford it and whether it reaches them.
            codes: [AC9HG9K04]
          - title: Land degradation
            id: geo-land-degradation-2
            brief: Soil erosion, salinity and desertification lower how much farmland can grow, and they are often caused by clearing, overgrazing and poor irrigation.
            codes: [AC9HG9K04]
          - title: Pressures on future food supply
            id: geo-pressures-future-food-supply
            brief: Climate change, water shortages and cities spreading onto farmland all threaten how much food can be grown.
            codes: [AC9HG9K04]
          - title: Bush foods and changed biomes
            id: geo-bush-foods-changed-biomes
            brief: Clearing and grazing reduced bush foods First Nations Australians relied on, such as the yam daisy (myrrnong) in Victoria. Some bush foods are now grown and sold.
            codes: [AC9HG9K04]
          - title: Improving food security
            id: geo-improving-food-security
            brief: Cutting food waste, caring for soil, trade and research into new crops all help make sure there is enough food in future.
            codes: [AC9HG9K04]

  - title: Geographies of interconnections
    chapters:
      - title: Connecting people and places
        id: ac-geo-9-3-1
        points:
          - title: Transport and access
            id: geo-transport-access
            brief: Roads, flights and public transport decide how easily people reach jobs, services and other places, which changes how they use and see a place.
            codes: [AC9HG9K05]
          - title: Supply chains
            id: geo-supply-chains
            brief: A supply chain is every step a product takes from raw material to buyer, such as cotton grown, spun, sewn into a T-shirt, shipped and sold.
            codes: [AC9HG9K05]
          - title: The digital divide
            id: geo-digital-divide
            brief: Internet access is uneven between and within countries, with remote and poorer areas often left with slow or no connection.
            codes: [AC9HG9K05]
          - title: Services across borders
            id: geo-services-across-borders
            brief: Fast internet lets businesses provide services from far away, such as call centres in India and the Philippines serving Australian customers.
            codes: [AC9HG9K05]

      - title: Travel and tourism
        id: ac-geo-9-3-2
        points:
          - title: Growth of tourism
            id: geo-growth-tourism
            brief: Cheaper flights, higher incomes and the internet have made tourism one of the world's largest industries.
            codes: [AC9HG9K06]
          - title: Impacts of tourism
            id: geo-impacts-tourism
            brief: Tourism brings jobs and money but can crowd places, damage environments and change local cultures.
            codes: [AC9HG9K06]
          - title: Managing tourism at Uluru-Kata Tjuta
            id: geo-managing-tourism-at-uluru
            brief: Uluru-Kata Tjuta National Park is jointly managed by Anangu Traditional Owners and Parks Australia. Climbing Uluru was closed in 2019 out of respect for its cultural meaning.
            codes: [AC9HG9K06]

      - title: Trade and production
        id: ac-geo-9-3-3
        points:
          - title: Trade links places
            id: geo-trade-links-places
            brief: Places are linked by buying and selling goods and services at every scale, from a local shop to global exports.
            codes: [AC9HG9K07]
          - title: Changing trade links
            id: geo-changing-trade-links
            brief: Trade connections change over time. Australia once traded mostly with Britain and now trades mostly with Asia.
            codes: [AC9HG9K07]
          - title: How production affects places
            id: geo-production-affects-places
            brief: Mining, farming, forestry and factories change the places that make goods, through jobs, pollution and cleared land.
            codes: [AC9HG9K08]
          - title: E-waste and a product's life
            id: geo-e-waste-product-s
            brief: A phone's life runs from mining metals to making, selling and throwing it away. Its e-waste often ends up in poorer countries where it harms health and land.
            codes: [AC9HG9K08]
          - title: Managing waste sustainably
            id: geo-managing-waste-sustainably
            brief: Reducing, reusing and recycling, and laws making businesses take back old products, cut the harm waste does to places.
            codes: [AC9HG9K08]
