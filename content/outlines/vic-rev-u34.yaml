# VCE History: Revolutions, Units 3 and 4: the causes and consequences of four revolutions, 70 points.
# Checked against the VCAA's VCE History Study Design, accredited from 2022, in October 2026. A school teaches two of
# the four revolutions, one in each unit, each with an area of study on causes and one on consequences, within dates
# the study design sets. All four are here, each as a unit, so any pair works. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Revolutions is a Units 3 and 4 study only. Modern History Units 1 and 2 (vic-mod-u12) is the usual path into it.
# NSW Modern History (the mod bank) covers the Russian Revolution, so expect some reuses and adapts.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-rev-u34
subject: Modern History
bank: mod
name: History Revolutions, Units 3 and 4
about: VCE, American, French, Russian and Chinese revolutions
short: Revolutions
years: [12]
level: Units 3 and 4
place: vic
kind: standard
syllabus: VCE History Study Design (from 2022), Revolutions Units 3 and 4
note: Follows the VCE History study design. Not made or endorsed by the VCAA.
chips: [Declaration of Independence, Estates-General, Bolsheviks, Long March, revolutionary ideas]

units:
  - title: The American Revolution
    chapters:
      - title: Causes of the American Revolution
        id: vic-rev-u34-1-1
        points:
          - title: The colonies before 1763
            id: mod-colonies-before-1763
            brief: Thirteen British colonies largely governed themselves through elected assemblies and grew wealthy through trade.
          - title: The French and Indian War
            id: mod-seven-years-war-debt
            brief: Britain's victory over France in North America by 1763 left it in debt, so it looked to the colonies to pay for their defence.
          - title: British policy after 1763
            id: mod-british-policy-after-1763
            brief: Trade rules, the Proclamation line limiting western settlement and new taxes showed tighter British control of the colonies.
          - title: Taxation without representation
            id: mod-taxation-without-representation
            brief: Colonists objected to taxes such as the Stamp Act, passed by a parliament in which they had no members.
          - title: The Boston Tea Party and the Coercive Acts
            id: mod-boston-tea-party-coercive
            brief: Colonists destroyed taxed tea in 1773, and Britain answered with laws that colonists called the Intolerable Acts.
          - title: Enlightenment ideas in America
            id: mod-enlightenment-ideas-america
            brief: Ideas of natural rights and government by consent, from writers such as Locke and Paine, shaped colonial thinking.
          - title: Leaders of the American cause
            id: mod-leaders-american-cause
            brief: George III, George Washington, Samuel Adams, John Hancock, Thomas Paine and Thomas Jefferson each shaped the road to independence.
          - title: Popular movements in America
            id: mod-colonial-resistance
            brief: The Patriots, the Sons and Daughters of Liberty, Committees of Correspondence and Provincial Congresses organised colonists against British rule.
          - title: The Declaration of Independence
            id: mod-declaration-independence
            brief: In 1776 the Continental Congress declared the colonies independent, listing grievances against the king.

      - title: Consequences of the American Revolution
        id: vic-rev-u34-1-2
        points:
          - title: Winning the war
            id: mod-winning-war
            brief: With help from France, the Continental Army defeated Britain, which recognised independence in the Treaty of Paris in 1783.
          - title: The Articles of Confederation
            id: mod-articles-confederation
            brief: The first national government was weak, unable to tax or control trade, which led to calls for change.
          - title: Shays' Rebellion
            id: mod-shays-rebellion
            brief: A revolt of indebted farmers in 1786 and 1787 showed the weakness of the national government and pushed leaders to change it.
          - title: The Constitution of 1787
            id: mod-constitution-1787
            brief: A new constitution created a federal government with separated powers and checks and balances.
          - title: The Bill of Rights
            id: mod-bill-rights
            brief: The first ten amendments protected rights such as freedom of speech and religion.
          - title: Leaders of the new nation
            id: mod-leaders-new-nation
            brief: George Washington, Alexander Hamilton, Patrick Henry and James Madison shaped the new government and argued over its powers.
          - title: Who the revolution left out
            id: mod-who-revolution-left-out
            brief: Loyalists lost homes and land, while enslaved people, women and Native Americans gained little, and slavery continued in much of the new nation.
          - title: Change and continuity in America
            id: mod-change-continuity-america
            brief: Between 1754 and 1789 government changed greatly, but much of society, including slavery, stayed the same.

  - title: The French Revolution
    chapters:
      - title: Causes of the French Revolution
        id: vic-rev-u34-2-1
        points:
          - title: The Old Regime
            id: mod-old-regime
            brief: French society was split into three estates, with the clergy and nobles holding privileges and the Third Estate paying most taxes.
          - title: Royal debt and financial crisis
            id: mod-royal-debt-financial-crisis
            brief: Wars, including aid to the American Revolution, left the crown nearly bankrupt by the 1780s.
          - title: The crisis of 1787 and 1788
            id: mod-crisis-1787-1788
            brief: The nobles' revolt against tax reform and protests such as the Day of Tiles forced the king to call the Estates-General.
          - title: Enlightenment ideas in France
            id: mod-enlightenment-ideas-france
            brief: Writers such as Rousseau and Voltaire questioned absolute monarchy, privilege and the church.
          - title: Leaders before the revolution
            id: mod-leaders-before-revolution
            brief: Louis XVI and Marie Antoinette, the writer Sieyès, Lafayette and the finance minister Necker shaped the crisis.
          - title: The Estates-General of 1789
            id: mod-estates-general-1789
            brief: Called to solve the crisis, it deadlocked over voting until the Third Estate declared itself the National Assembly.
          - title: The fall of the Bastille
            id: mod-fall-bastille
            brief: On 14 July 1789 Parisians stormed the Bastille, showing the crown had lost control of the capital.
          - title: Peasants, workers and the Great Fear
            id: mod-peasants-workers-great-fear
            brief: Hungry Parisian workers and peasants who attacked noble estates in mid-1789 pushed the revolution further.

      - title: Consequences of the French Revolution
        id: vic-rev-u34-2-2
        points:
          - title: The end of feudal privilege
            id: mod-end-feudal-privilege
            brief: In August 1789 the Assembly abolished feudal dues and noble privileges.
          - title: The Declaration of the Rights of Man
            id: mod-declaration-rights-man
            brief: The 1789 declaration proclaimed liberty, equality before the law and the sovereignty of the nation.
          - title: The October Days
            id: mod-october-days
            brief: In October 1789 Parisian women marched to Versailles and brought the royal family back to Paris.
          - title: The Civil Constitution of the Clergy
            id: mod-civil-constitution-clergy
            brief: The state's reform of the church split the clergy and turned many Catholics against the revolution.
          - title: The end of the monarchy
            id: mod-end-monarchy
            brief: After the king's failed flight in 1791 and war with Austria, the monarchy fell in 1792 and Louis XVI was executed in 1793.
          - title: The Terror
            id: mod-terror
            brief: The Committee of Public Safety used mass arrests and executions in 1793 and 1794 to defend the revolution.
          - title: Leaders of the revolution
            id: mod-robespierre
            brief: Danton, Marat and Robespierre led the radical revolution, and Robespierre drove the Terror until his own execution in 1794.
          - title: The revolution and ordinary people
            id: mod-revolution-ordinary-people
            brief: Peasants, sans-culottes and women took part in and were changed by the revolution, but gains were uneven.
          - title: Change and continuity in France
            id: mod-change-continuity-france
            brief: Between 1774 and 1795 privilege and absolute monarchy ended, but many hopes for equality were not met.

  - title: The Russian Revolution
    chapters:
      - title: Causes of the Russian Revolution
        id: vic-rev-u34-3-1
        points:
          - title: Tsarist autocracy
            id: mod-tsarist-autocracy
            brief: Nicholas II ruled with near-total power, backed by the army, the church and secret police.
          - title: Social and economic conditions
            id: mod-social-economic-conditions
            brief: Most Russians were poor peasants, while fast industrial growth crowded workers into harsh city conditions.
          - title: The 1905 Revolution
            id: mod-1905-revolution
            brief: Defeat by Japan and Bloody Sunday sparked strikes and revolts, and the October Manifesto created the Duma, which the tsar later limited.
          - title: Reform and reaction
            id: mod-reform-reaction
            brief: Stolypin's land reforms and harsh repression between 1906 and 1914 failed to settle the empire.
          - title: Revolutionary ideas
            id: mod-revolutionary-ideas
            brief: Liberal ideas, Marxism and Lenin's idea of a party leading the workers challenged the tsar's rule.
          - title: Revolutionary parties
            id: mod-revolutionary-parties
            brief: The Bolsheviks, Mensheviks and Socialist Revolutionaries offered different paths to change.
          - title: The First World War and Russia
            id: mod-first-world-war-russia
            brief: Defeats, huge losses and food shortages destroyed support for the tsar.
          - title: The tsar, the tsarina and Rasputin
            id: mod-tsar-tsarina-rasputin
            brief: Nicholas II, Alexandra and Rasputin's influence at court damaged the monarchy's standing during the war.
          - title: The February Revolution
            id: mod-february-revolution
            brief: In February 1917 strikes and a mutiny in Petrograd forced Nicholas II to give up the throne.
          - title: The Provisional Government and the Soviets
            id: mod-provisional-government-soviets
            brief: Power was shared between the Provisional Government and the Petrograd Soviet, in an uneasy dual power.
          - title: The October Revolution
            id: mod-october-revolution-2
            brief: In October 1917 Lenin's Bolsheviks seized power in Petrograd.

      - title: Consequences of the Russian Revolution
        id: vic-rev-u34-3-2
        points:
          - title: The first Bolshevik decrees
            id: mod-first-bolshevik-decrees
            brief: Decrees on land and peace gave land to peasants and sought an end to the war.
          - title: The Constituent Assembly
            id: mod-constituent-assembly
            brief: The Bolsheviks shut down the elected assembly in January 1918 after other parties won most seats.
          - title: The Treaty of Brest-Litovsk
            id: mod-treaty-brest-litovsk
            brief: In 1918 Russia left the war, giving up large territories to Germany.
          - title: The Civil War
            id: mod-civil-war
            brief: The Reds fought the Whites and others from 1918 to 1921, and the Bolsheviks won.
          - title: War Communism and the Red Terror
            id: mod-war-communism-red-terror
            brief: The Bolsheviks took grain, ran industry and used terror against opponents, causing famine and revolt.
          - title: The New Economic Policy
            id: mod-new-economic-policy-2
            brief: In 1921 Lenin allowed some private trade to revive the economy.
          - title: Building a one-party state
            id: mod-building-one-party-state
            brief: By the mid-1920s the Communist Party had banned other parties and controlled the state.
          - title: Leaders of the new state
            id: mod-leaders-new-state
            brief: Lenin, Trotsky, Dzerzhinsky of the Cheka and Alexandra Kollontai shaped Soviet Russia in its first years.
          - title: Change and continuity in Russia
            id: mod-change-continuity-russia
            brief: Between 1896 and 1927 the tsar was replaced, but one-party rule and a secret police kept older patterns of power.

  - title: The Chinese Revolution
    chapters:
      - title: Causes of the Chinese Revolution
        id: vic-rev-u34-4-1
        points:
          - title: The early Republic
            id: mod-fall-qing-dynasty
            brief: After the Qing fell in 1912, Yuan Shikai took power and tried to make himself emperor, and the Republic failed to unite China.
          - title: The warlord era
            id: mod-warlord-era
            brief: After 1916 China split among regional warlords, with no strong central government.
          - title: The May Fourth Movement
            id: mod-may-fourth-movement
            brief: The New Culture Movement and the 1919 protests against the Treaty of Versailles fed nationalism and interest in new ideas, including communism.
          - title: The Guomindang and the Communists
            id: mod-guomindang-communists
            brief: Sun Yixian's Three Principles guided the Nationalists, who worked with the Communists until Jiang Jieshi turned on them in the 1927 Shanghai Massacre.
          - title: The Long March
            id: mod-long-march
            brief: In 1934 and 1935 the Communists retreated thousands of kilometres, and Mao Zedong rose to lead them.
          - title: Mao Zedong Thought
            id: mod-mao-zedong-thought
            brief: Mao adapted communism to China, putting peasants rather than city workers at the centre of revolution.
          - title: The war against Japan
            id: mod-war-against-japan
            brief: Japan's invasion weakened the Nationalists, while the Communists grew strong among peasants.
          - title: The Civil War and 1949
            id: mod-civil-war-1949
            brief: The Communists defeated the Nationalists and proclaimed the People's Republic of China in 1949.

      - title: Consequences of the Chinese Revolution
        id: vic-rev-u34-4-2
        points:
          - title: Land reform
            id: mod-land-reform
            brief: Land was taken from landlords and given to peasants, often with violence against landlords.
          - title: Thought reform and mass campaigns
            id: mod-thought-reform-mass-campaigns
            brief: Campaigns such as the Three Antis and Five Antis targeted officials, business owners and critics in the early 1950s.
          - title: The first Five-Year Plan
            id: mod-first-five-year-plan
            brief: Soviet-style planning built heavy industry in the 1950s.
          - title: The Hundred Flowers Campaign
            id: mod-hundred-flowers-campaign
            brief: Mao invited criticism in 1956 and 1957, then punished many critics in the Anti-Rightist Campaign.
          - title: The Great Leap Forward
            id: mod-great-leap-forward
            brief: A drive from 1958 to industrialise fast through communes led to a famine in which millions died.
          - title: The Cultural Revolution
            id: mod-cultural-revolution
            brief: From 1966 Mao encouraged Red Guards to attack officials and old culture, causing chaos and persecution.
          - title: Leaders of the People's Republic
            id: mod-leaders-people-s-republic
            brief: Mao, Lin Biao, Liu Shaoqi and Jiang Qing struggled over the direction of the new state.
          - title: Change and continuity in China
            id: mod-change-continuity-china
            brief: Between 1912 and 1976 landlords and the old elite lost power, but one-party rule and hardship for many continued.
