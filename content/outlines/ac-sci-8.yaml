# Australian Curriculum Science, Year 8: cells and body systems, plate tectonics and rocks, energy, and elements,
# compounds and chemical change, with Science as a human endeavour and the ideas behind Science inquiry, 40 points.
# Follows ACARA's Australian Curriculum: Science, Version 9.0 (Science curriculum content, Years 7-10), checked on
# australiancurriculum.edu.au in November 2026. Version 9.0 was approved in April 2022 and released for use from 2023;
# each state and territory sets when its schools start it (Queensland schools teach every v9 learning area by the end
# of 2027). No newer version is announced. Western Australia and South Australia teach their own versions built on it.
# The Science understanding strand is a unit, with a chapter for each content description (AC9S8U01 to U07). Science
# as a human endeavour and Science inquiry share the second unit, one chapter each: inquiry is taught as the ideas
# behind an investigation, not as practical work. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-sci-8
subject: Science
bank: sci
name: Science, Year 8
about: Australian Curriculum, Year 8
short: Science
years: [8]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Science, Version 9.0, Year 8"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [cell, organelle, plate boundary, rock cycle, kinetic energy, chemical change]

units:
  - title: Science understanding
    chapters:
      - title: Cells
        id: ac-sci-8-1-1
        points:
          - title: Cells as the building blocks of life
            id: sci-cells-as-building-blocks
            brief: All living things are made of one or more cells, the smallest units that carry out the processes of life. Most can only be seen with a microscope.
            codes: [AC9S8U01]
          - title: Parts of an animal cell
            id: sci-parts-animal-cell
            brief: The nucleus controls the cell and holds its genetic material, the cell membrane controls what goes in and out, and cytoplasm is where most reactions happen.
            codes: [AC9S8U01]
          - title: Parts of a plant cell
            id: sci-parts-plant-cell
            brief: Plant cells also have a rigid cell wall for support, chloroplasts where photosynthesis happens, and a large vacuole that stores water and keeps the cell firm.
            codes: [AC9S8U01]
          - title: Using a light microscope
            id: sci-using-light-microscope
            brief: Total magnification is the eyepiece lens times the objective lens. Focus with the lowest power first, then move to higher power for detail.
            codes: [AC9S8U01]
          - title: Specialised cells
            id: sci-specialised-cells
            brief: Cells have shapes suited to their jobs, such as long nerve cells that carry messages, red blood cells that carry oxygen and root hair cells that take in water.
            codes: [AC9S8U01, AC9S8U02]

      - title: Tissues, organs and systems
        id: ac-sci-8-1-2
        points:
          - title: From cells to organ systems
            id: sci-from-cells-organ-systems
            brief: Similar cells form tissues, tissues form organs, and organs work together in organ systems that keep the whole organism alive.
            codes: [AC9S8U02]
          - title: The digestive system
            id: sci-digestive-system
            brief: The mouth, stomach and intestines break food down into small molecules, and the small intestine absorbs them into the blood.
            codes: [AC9S8U02]
          - title: The circulatory system
            id: sci-circulatory-system
            brief: The heart pumps blood through arteries, capillaries and veins, carrying oxygen and nutrients to cells and taking wastes away.
            codes: [AC9S8U02]
          - title: The respiratory system
            id: sci-respiratory-system
            brief: Air moves through the trachea and bronchi to the alveoli in the lungs, where oxygen passes into the blood and carbon dioxide passes out.
            codes: [AC9S8U02]
          - title: Transport systems in plants
            id: sci-transport-systems-plants
            brief: Xylem carries water and minerals up from the roots, and phloem carries sugars made in the leaves to the rest of the plant, much as blood vessels do in animals.
            codes: [AC9S8U02]

      - title: Plate tectonics
        id: ac-sci-8-1-3
        points:
          - title: Layers of the Earth
            id: sci-layers-earth
            brief: The Earth has a thin crust, a hot mantle that flows very slowly, and a metal core. The crust and top of the mantle form rigid plates.
            codes: [AC9S8U03]
          - title: What moves the plates
            id: sci-moves-plates
            brief: Plates move a few centimetres a year, driven by convection in the mantle, ridge push at spreading ridges and slab pull where a plate sinks.
            codes: [AC9S8U03]
          - title: Divergent, convergent and transform boundaries
            id: sci-divergent-convergent-transform-boundaries
            brief: Plates move apart at divergent boundaries, forming ridges and rift valleys; push together at convergent ones, forming mountains and trenches; and slide past each other at transform ones.
            codes: [AC9S8U03]
          - title: Earthquakes and volcanoes
            id: sci-earthquakes-volcanoes
            brief: Most earthquakes and volcanoes happen along plate boundaries, such as the Pacific Ring of Fire, where plates grind, sink or pull apart.
            codes: [AC9S8U03]
          - title: Evidence for plate tectonics
            id: sci-evidence-plate-tectonics
            brief: Matching coastlines, fossils and rocks across oceans, mapped sea-floor ridges such as Marie Tharp's, and magnetic stripes on the sea floor support the theory.
            codes: [AC9S8U03]

      - title: Rocks and the rock cycle
        id: ac-sci-8-1-4
        points:
          - title: Igneous rocks
            id: sci-igneous-rocks
            brief: Igneous rocks form when molten rock cools. Cooling slowly underground gives large crystals, as in granite; cooling fast at the surface gives small ones, as in basalt.
            codes: [AC9S8U04]
          - title: Sedimentary rocks
            id: sci-sedimentary-rocks
            brief: Sedimentary rocks form when sediments are laid down in layers, buried and cemented over long times. They are where most fossils are found.
            codes: [AC9S8U04]
          - title: Metamorphic rocks
            id: sci-metamorphic-rocks
            brief: Metamorphic rocks form when heat and pressure change existing rock without melting it, as limestone becomes marble.
            codes: [AC9S8U04]
          - title: The rock cycle
            id: sci-rock-cycle
            brief: Weathering, erosion, deposition, burial, heat, pressure, melting and uplift turn one type of rock into another, mostly over millions of years.
            codes: [AC9S8U04]
          - title: How rocks are used
            id: sci-rocks-are-used
            brief: A rock's properties, which come from how it formed, decide its use, as First Nations Australians chose particular stones for grindstones and cutting tools.
            codes: [AC9S8U04]

      - title: Energy
        id: ac-sci-8-1-5
        points:
          - title: Kinetic and potential energy
            id: sci-kinetic-potential-energy
            brief: Kinetic energy is energy of movement, including heat, sound and electricity. Potential energy is stored, such as gravitational, elastic and chemical energy.
            codes: [AC9S8U05]
          - title: Energy transfer and transformation
            id: sci-energy-transfer-transformation
            brief: Energy is transferred when it moves from one object to another, and transformed when it changes form, as chemical energy in a battery becomes electrical energy.
            codes: [AC9S8U05]
          - title: Energy flow diagrams
            id: sci-energy-flow-diagrams
            brief: A flow diagram shows the energy forms in a system in order, such as chemical to electrical to light and heat in a torch. Most changes also give off some heat that is not wanted.
            codes: [AC9S8U05]
          - title: Energy in a swinging or rolling system
            id: sci-energy-swinging-or-rolling
            brief: On a roller-coaster or a pendulum, gravitational potential energy and kinetic energy change back and forth as height and speed change.
            codes: [AC9S8U05]

      - title: Elements, compounds and mixtures
        id: ac-sci-8-1-6
        points:
          - title: Atoms and elements
            id: sci-atoms-elements
            brief: An element is made of only one type of atom and cannot be broken down chemically. Each has a one or two letter symbol, such as O for oxygen and Na for sodium.
            codes: [AC9S8U06]
          - title: Molecules and compounds
            id: sci-molecules-compounds
            brief: A molecule is two or more atoms joined. A compound has two or more different elements chemically joined in fixed amounts, with properties unlike its elements.
            codes: [AC9S8U06]
          - title: Reading chemical formulas
            id: sci-reading-chemical-formulas
            brief: A formula shows the atoms in a substance. In H2O, the small 2 means two hydrogen atoms with one oxygen atom.
            codes: [AC9S8U06]
          - title: Telling elements, compounds and mixtures apart
            id: sci-telling-elements-compounds-mixtures
            brief: Particle diagrams and models show elements as one kind of atom, compounds as joined different atoms, and mixtures as separate substances together.
            codes: [AC9S8U06]
          - title: The periodic table begins
            id: sci-periodic-table-begins
            brief: Mendeleev arranged the known elements by mass and properties in 1869 and left gaps for elements not yet found. Metals sit on the left and non-metals on the right.
            codes: [AC9S8U06]

      - title: Physical and chemical change
        id: ac-sci-8-1-7
        points:
          - title: Physical changes
            id: sci-physical-changes
            brief: In a physical change, such as melting or dissolving, no new substance forms and the change is usually easy to reverse.
            codes: [AC9S8U07]
          - title: Chemical changes
            id: sci-chemical-changes
            brief: In a chemical change, atoms rearrange to make new substances with new properties, and the change is usually hard to reverse.
            codes: [AC9S8U07]
          - title: Signs of a chemical reaction
            id: sci-signs-chemical-reaction
            brief: Gas bubbles, a new solid (precipitate), a colour change, light, or a temperature change suggest a chemical reaction has happened.
            codes: [AC9S8U07]
          - title: Reactions that release or take in heat
            id: sci-reactions-that-release-or
            brief: Exothermic reactions release energy and warm their surroundings, such as burning. Endothermic reactions take in energy and cool them, such as an instant ice pack.
            codes: [AC9S8U07]

  - title: Science as a human endeavour and inquiry
    chapters:
      - title: How science develops
        id: ac-sci-8-2-1
        points:
          - title: Models of matter change over time
            id: sci-models-matter-change-over
            brief: Ideas about matter changed from Democritus's indivisible atoms to Dalton's atomic theory, as new experiments and instruments gave new evidence.
            codes: [AC9S8H01, AC9S8H02]
          - title: Science and decisions about resources
            id: sci-science-decisions-about-resources
            brief: Mining, or a plan to restore land after it, is weighed on its ethical, environmental, social and economic effects, including on Country.
            codes: [AC9S8H03]
          - title: Judging science in the media
            id: sci-judging-science-media
            brief: A science claim is more trustworthy when it names its source, shows its evidence and comes from experts, rather than from opinion or someone selling something.
            codes: [AC9S8H04]

      - title: Planning and judging an investigation
        id: ac-sci-8-2-2
        points:
          - title: Writing an aim and hypothesis
            id: sci-writing-aim-hypothesis
            brief: An aim says what an investigation will find out. A good hypothesis links the independent and dependent variables and can be shown wrong.
            codes: [AC9S8I01]
          - title: Repeat trials and averages
            id: sci-repeat-trials-averages
            brief: Repeating each trial and averaging the results reduces the effect of random errors and shows whether results are reproducible.
            codes: [AC9S8I02, AC9S8I04]
          - title: Risk assessment
            id: sci-risk-assessment
            brief: A risk assessment lists each hazard in a method, how likely and how serious harm is, and how to reduce it, such as safety glasses with acids.
            codes: [AC9S8I02]
          - title: Drawing a conclusion
            id: sci-drawing-conclusion
            brief: A conclusion answers the aim, says whether the data supports the hypothesis, and uses the results as evidence.
            codes: [AC9S8I06, AC9S8I07]
