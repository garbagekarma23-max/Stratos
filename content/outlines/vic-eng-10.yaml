# Victorian Curriculum English, Level 10 (Year 10): language, literature and literacy, 37 points.
# Follows the Victorian Curriculum F-10 Version 2.0: English, Level 10, checked on the VCAA's Version 2.0 website
# (f10.vcaa.vic.edu.au) in November 2026. VC2.0 English was published in December 2023, with familiarisation in 2024
# and implementation from 2025. It replaced English in the Victorian Curriculum F-10 Version 1.0 (taught from 2017).
# No newer version is announced; the Version 1.0 website closes on 31 December 2026.
# VC2.0 sets English by single levels, in three strands (Language, Literature, Literacy), each with sub-strands. Each
# strand is a unit here, and each chapter is one sub-strand, two small ones together, or part of a large one. Creating
# texts and speaking are covered only as the ideas behind them (thesis, evidence, voice, formality, refining).
# No set texts are named, since schools choose their own, and nothing is quoted from any text. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-eng-10
subject: English
bank: eng
name: English, Year 10
about: Victorian Curriculum 2.0, Level 10
short: English
years: [10]
place: vic
kind: english
syllabus: "Victorian Curriculum F-10 Version 2.0: English, Level 10"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [passive voice, syntax, mise en scene, interpretation, satire, thesis statement]

units:
  - title: Language
    chapters:
      - title: Language, power and values
        id: vic-eng-10-1-1
        points:
          - title: Inclusive and exclusive language
            id: eng-inclusive-exclusive-language-vic
            brief: Language can draw people in, as with we and our, or shut them out, as with jargon, in-jokes and talk of us and them.
            codes: [VC2E10LA01]
          - title: Language that empowers or disempowers
            id: eng-language-that-empowers-or-vic
            brief: Labels, the names given to groups and who is made the subject of a sentence can give people dignity and agency or take them away.
            codes: [VC2E10LA01]
          - title: Implicit and explicit evaluation
            id: eng-implicit-explicit-evaluation
            brief: Writers judge openly with clear opinion words, or quietly through connotation and which details they include, and both reveal their values.
            codes: [VC2E10LA02]

      - title: Evaluating text structure
        id: vic-eng-10-1-2
        points:
          - title: Judging how well a structure works
            id: eng-judging-well-structure-works-vic
            brief: Evaluating a structure means asking whether its order, sections and paragraphing help the text achieve its purpose for its audience.
            codes: [VC2E10LA03]
          - title: Frames and circular structures
            id: eng-frames-circular-structures
            brief: A frame story sits inside another, and a circular structure ends where it began, both creating links that make readers compare start and end.
            codes: [VC2E10LA04]
          - title: Cohesion across an extended essay
            id: eng-cohesion-across-extended-essay
            brief: An introduction that maps the argument, topic sentences that echo it and linking words between paragraphs hold a long essay together.
            codes: [VC2E10LA04]

      - title: Syntax, voice and precise words
        id: vic-eng-10-1-3
        points:
          - title: Syntax and style
            id: eng-syntax-style-vic
            brief: Syntax is the order of words in a sentence. Moving a phrase to the front or holding the main point to the end changes emphasis and style.
            codes: [VC2E10LA06]
          - title: Parallel structure
            id: eng-parallel-structure
            brief: Repeating the same grammatical pattern across a list or a pair of clauses gives balance and rhythm and makes ideas easy to compare.
            codes: [VC2E10LA05]
          - title: Active and passive voice
            id: eng-active-passive-voice-vic
            brief: The active voice says who did an action. The passive voice puts the action first and can hide who did it, as in mistakes were made.
            codes: [VC2E10LA05]
          - title: Shades of meaning
            id: eng-shades-meaning
            brief: Choosing the most precise word from a group of near synonyms, such as ask, request, demand and plead, gives exactly the meaning intended.
            codes: [VC2E10LA08]
          - title: Punctuation for rhythm and effect
            id: eng-punctuation-rhythm-effect
            brief: Writers use punctuation on purpose to control pace and emphasis, such as an ellipsis for hesitation or a single-word sentence for impact.
            codes: [VC2E10LA09]

      - title: Representation on screen
        id: vic-eng-10-1-4
        points:
          - title: Mise en scene
            id: eng-mise-en-scene
            brief: Everything placed in the frame, such as setting, costume, props, lighting and where actors stand, which together build meaning in a shot.
            codes: [VC2E10LA07]
          - title: Editing choices in film
            id: eng-editing-choices-film
            brief: The order and length of shots, cuts, montage and slow motion change how viewers understand people and events on screen.
            codes: [VC2E10LA07]
          - title: Documentary techniques
            id: eng-documentary-techniques
            brief: Interviews, archival footage, voice-over and the choice of who speaks shape how a documentary represents its subject.
            codes: [VC2E10LA07]

  - title: Literature
    chapters:
      - title: Context and interpretation
        id: vic-eng-10-2-1
        points:
          - title: How a text reflects its context
            id: eng-text-reflects-context
            brief: Evaluating how a text's attitudes, assumptions and representations of people and places reflect the time and culture it came from.
            codes: [VC2E10LE01]
          - title: Reading Aboriginal and Torres Strait Islander literature in context
            id: eng-reading-aboriginal-torres-strait
            brief: Texts by Aboriginal and Torres Strait Islander authors are best read with attention to the author's community and history, and to cultures that continue today.
            codes: [VC2E10LE01]
          - title: Building an interpretation
            id: eng-building-interpretation
            brief: An interpretation is a reasoned view of what a text means, built from patterns of evidence across the whole text.
            codes: [VC2E10LE02]
          - title: Other readings of a text
            id: eng-other-readings-text
            brief: Readers can interpret the same text differently, such as by focusing on power, gender or history, and weighing other readings sharpens your own.
            codes: [VC2E10LE02]
          - title: Ethical dilemmas in literature
            id: eng-ethical-dilemmas-literature
            brief: Literature often puts characters in situations with no easy right answer, which invites readers to weigh competing values.
            codes: [VC2E10LE03]

      - title: Voice and intertextual connections
        id: vic-eng-10-2-2
        points:
          - title: Voice as a literary device
            id: eng-voice-as-literary-device-vic
            brief: A writer builds a voice through diction, rhythm, attitude and point of view, and a distinct voice can make readers trust, pity or doubt a speaker.
            codes: [VC2E10LE05]
          - title: Comparing voice across texts
            id: eng-comparing-voice-across-texts
            brief: Setting two voices side by side shows how different choices of word, sentence and attitude create different emotional effects.
            codes: [VC2E10LE05]
          - title: Parody, pastiche and homage
            id: eng-parody-pastiche-homage
            brief: A parody copies a text's style to mock it, a pastiche imitates a style playfully, and an homage borrows from a text to honour it.
            codes: [VC2E10LE04]
          - title: How endings shape interpretation
            id: eng-endings-shape-interpretation
            brief: A text's ending, whether resolved, open or twisting, changes how readers understand everything before it.
            codes: [VC2E10LE04]

      - title: Sustaining a voice in writing
        id: vic-eng-10-2-3
        points:
          - title: Keeping a voice consistent
            id: eng-keeping-voice-consistent
            brief: A sustained voice keeps the same viewpoint, vocabulary and attitude throughout, so the speaker feels real from start to finish.
            codes: [VC2E10LE06]
          - title: Transforming a text into a new form
            id: eng-transforming-text-into-new
            brief: Retelling a text in another form or from another character's view, such as a monologue or a letter, changes what readers notice and feel.
            codes: [VC2E10LE06]
          - title: The dramatic monologue
            id: eng-dramatic-monologue
            brief: A dramatic monologue is one character speaking to a silent listener, revealing more about themselves than they mean to.
            codes: [VC2E10LE06]

  - title: Literacy
    chapters:
      - title: Discussion, formality and representation
        id: vic-eng-10-3-1
        points:
          - title: Supporting a view in discussion
            id: eng-supporting-view-discussion
            brief: In discussion, a strong contribution states a view about a text, backs it with an example, and responds to what others have said.
            codes: [VC2E10LY01]
          - title: Choosing the level of formality
            id: eng-choosing-level-formality
            brief: A speaker may mix formal and informal language on purpose, such as a casual story inside a formal speech, to connect with an audience.
            codes: [VC2E10LY02]
          - title: Evaluating representations of concepts
            id: eng-evaluating-representations-concepts
            brief: Judging how fairly and fully a text represents a concept such as success or justice, and how that reflects its context.
            codes: [VC2E10LY04]
          - title: Playing with spelling for effect
            id: eng-playing-with-spelling-effect
            brief: Advertisers, poets and brands bend standard spelling on purpose to catch the eye or create a sound, which works only when the standard form is known.
            codes: [VC2E10LY03]

      - title: Implicit values and complex ideas
        id: vic-eng-10-3-2
        points:
          - title: Implicit values
            id: eng-implicit-values
            brief: A text can carry values without stating them, through what it treats as normal, who it centres and what it leaves out.
            codes: [VC2E10LY05]
          - title: Irony and satire
            id: eng-irony-satire
            brief: Irony is a gap between what is said or expected and what is meant or happens. Satire uses irony and humour to criticise people or society.
            codes: [VC2E10LY05]
          - title: Organising ideas for a purpose
            id: eng-organising-ideas-purpose-vic
            brief: Analysing why a writer orders ideas as they do, such as saving the strongest point for last or opening with a story, and judging how well it works.
            codes: [VC2E10LY06]
          - title: Inferring themes
            id: eng-inferring-themes
            brief: A theme is an idea about life that a text explores, worked out by inference from patterns in its characters, conflicts and symbols.
            codes: [VC2E10LY07]

      - title: Writing analytically
        id: vic-eng-10-3-3
        points:
          - title: Writing a thesis statement
            id: eng-writing-thesis-statement-vic
            brief: A thesis statement gives a clear, arguable answer to the question in one or two sentences, and the essay goes on to prove it.
            codes: [VC2E10LY08]
          - title: Integrating evidence and analysis
            id: eng-integrating-evidence-analysis
            brief: Good analysis embeds short quotations, names the technique, and explains how it creates meaning, rather than retelling the plot.
            codes: [VC2E10LY08]
          - title: Refining an analytical essay
            id: eng-refining-analytical-essay
            brief: Refining checks that every paragraph supports the thesis, evidence is explained, expression is concise, and the conclusion does more than repeat.
            codes: [VC2E10LY09]
