# Victorian Curriculum Mathematics, Level 10 (Year 10): number, algebra, measurement, space, statistics and probability, 42 points.
# Follows the Victorian Curriculum F-10 Version 2.0: Mathematics, Level 10, checked on the VCAA's Version 2.0 website
# (f10.vcaa.vic.edu.au) in November 2026. VC2.0 Mathematics was published in July 2023, schools began using it from
# 2024, and it is fully in place in government schools from 2025. It replaced Mathematics in the Victorian Curriculum
# F-10 Version 1.0 (taught from 2017). No newer version is announced; the Version 1.0 website closes on 31 December 2026.
# VC2.0 sets Mathematics by single levels (7, 8, 9, 10 and 10A), in six strands. The strands are paired into three
# units here (Number and algebra, Measurement and space, Statistics and probability), and each chapter is one strand
# or part of one. Level 10A, the optional extension, is its own outline (vic-mat-10a). Content descriptions on running
# investigations, simulations, modelling cycles and programming algorithms are covered only as the ideas behind them.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths).

id: vic-mat-10
subject: Mathematics
bank: mat
name: Mathematics, Year 10
about: Victorian Curriculum 2.0, Level 10
short: Mathematics
years: [10]
place: vic
kind: maths
syllabus: "Victorian Curriculum F-10 Version 2.0: Mathematics, Level 10"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [algebraic fractions, simultaneous equations, compound interest, box plot, networks, conditional probability]

units:
  - title: Number and algebra
    chapters:
      - title: Algebraic techniques
        id: vic-mat-10-1-1
        points:
          - title: Exact values and rounding errors
            id: mat-exact-values-rounding-errors
            brief: Rounding a value early and using it again and again lets small errors grow, so keep exact values such as √2 or 1/3 until the end.
            codes: [VC2M10N01]
          - title: Taking out an algebraic common factor
            id: mat-taking-out-algebraic-common
            brief: Take out the highest common factor including variables, such as 6x²y - 9xy = 3xy(2x - 3).
            codes: [VC2M10A01]
          - title: Index laws for algebraic products and quotients
            id: mat-index-laws-algebraic-products
            brief: Simplify expressions such as (4a³b)(2ab²) = 8a⁴b³ and 12x⁵ ÷ 3x² = 4x³ by dealing with numbers and each variable in turn.
            codes: [VC2M10A02]
          - title: Adding and subtracting algebraic fractions
            id: mat-adding-subtracting-algebraic-fractions-vic
            brief: Find a common denominator, rewrite each fraction, then combine the numerators, such as x/3 + x/4 = 7x/12.
            codes: [VC2M10A03]
          - title: Multiplying and dividing algebraic fractions
            id: mat-multiplying-dividing-algebraic-fractions-vic
            brief: Multiply straight across, or multiply by the reciprocal to divide, cancelling common factors before you multiply.
            codes: [VC2M10A03]

      - title: Equations, formulas and inequalities
        id: vic-mat-10-1-2
        points:
          - title: Changing the subject of a formula
            id: mat-changing-subject-formula-2-vic
            brief: Use inverse operations to get one variable on its own, such as rearranging v = u + at to make a the subject.
            codes: [VC2M10A05]
          - title: Writing equations from word problems
            id: mat-writing-equations-from-word
            brief: Name the unknown with a letter, write the facts as an equation, solve it, and check the answer makes sense in the situation.
            codes: [VC2M10A07]
          - title: Equations with algebraic fractions
            id: mat-equations-with-algebraic-fractions-vic
            brief: Multiply every term by the lowest common denominator to clear the fractions, then solve as usual.
            codes: [VC2M10A12]
          - title: Solving multi-step linear inequalities
            id: mat-solving-multi-step-linear
            brief: Solve like an equation, but reverse the inequality sign when multiplying or dividing both sides by a negative number.
            codes: [VC2M10A08]

      - title: Simultaneous equations and lines
        id: vic-mat-10-1-3
        points:
          - title: Solving simultaneous equations with graphs
            id: mat-solving-simultaneous-equations-with
            brief: The solution of two linear equations is the point where their lines cross. Parallel lines never cross, so there is no solution.
            codes: [VC2M10A09]
          - title: The substitution method
            id: mat-substitution-method
            brief: Make one variable the subject of one equation and substitute it into the other, leaving one equation with one unknown.
            codes: [VC2M10A09]
          - title: The elimination method
            id: mat-elimination-method
            brief: Add or subtract the equations, after multiplying one if needed, so that one variable cancels out.
            codes: [VC2M10A09]
          - title: Parallel and perpendicular lines
            id: mat-parallel-perpendicular-lines-vic
            brief: Parallel lines have equal gradients. Perpendicular lines have gradients that multiply to -1, such as 2 and -1/2.
            codes: [VC2M10A10]

      - title: Quadratic equations
        id: vic-mat-10-1-4
        points:
          - title: Factorising quadratics with a common factor first
            id: mat-factorising-quadratics-with-common
            brief: Take out any common factor before factorising the quadratic left inside, such as 2x² + 10x + 12 = 2(x + 2)(x + 3).
            codes: [VC2M10A04]
          - title: Solving quadratic equations by factorising
            id: mat-solving-quadratic-equations-by
            brief: Rearrange so one side is zero, factorise, then use the null factor law, such as x² - x = 6 giving x = 3 or x = -2.
            codes: [VC2M10A13]
          - title: Solving equations by guess, check and refine
            id: mat-solving-equations-by-guess
            brief: When algebra is hard, test values, see whether each is too high or too low, and narrow in on the solution, checking for more than one.
            codes: [VC2M10A16]

      - title: Non-linear relations and growth
        id: vic-mat-10-1-5
        points:
          - title: Recognising non-linear graphs
            id: mat-recognising-non-linear-graphs
            brief: The shapes of a parabola (y = x²), a hyperbola (y = 1/x), a circle (x² + y² = r²) and an exponential curve (y = 2ˣ), from their equations.
            codes: [VC2M10A11]
          - title: Solving simple exponential equations
            id: mat-solving-simple-exponential-equations-vic
            brief: Write both sides as powers of the same base and set the indices equal, such as 2ˣ = 32 = 2⁵, so x = 5.
            codes: [VC2M10A14]
          - title: Compound interest
            id: mat-compound-interest-3-vic
            brief: Interest is added each period and then earns interest itself, so A = P(1 + r)ⁿ, growing faster than simple interest.
            codes: [VC2M10A15]
          - title: Exponential growth and decay
            id: mat-exponential-growth-decay-2-vic
            brief: A quantity that grows or shrinks by the same percentage each period, such as a population or a car's value, is multiplied by the same factor each time.
            codes: [VC2M10A15]
          - title: Inverse proportion
            id: mat-inverse-proportion
            brief: When one quantity doubles and the other halves, they are inversely proportional, y = k/x, such as speed and travel time for a fixed trip.
            codes: [VC2M10A15]

  - title: Measurement and space
    chapters:
      - title: Measurement and trigonometry
        id: vic-mat-10-2-1
        points:
          - title: Surface area of composite objects
            id: mat-surface-area-composite-objects
            brief: Add the areas of the faces that are on the outside, leaving out any faces hidden where two solids join.
            codes: [VC2M10M01]
          - title: Logarithmic scales
            id: mat-logarithmic-scales-vic
            brief: On scales such as the Richter scale, decibels and pH, each step up of 1 means 10 times as much, not 1 more.
            codes: [VC2M10M02]
          - title: Angles of elevation and depression
            id: mat-angles-elevation-depression-vic
            brief: An angle of elevation is measured up from the horizontal and an angle of depression down from it, and they form right-angled triangles to solve.
            codes: [VC2M10M03]
          - title: True bearings
            id: mat-true-bearings-vic
            brief: A true bearing is the angle measured clockwise from north, written with three digits, such as 045°T for north-east.
            codes: [VC2M10M03]

      - title: Proof and networks
        id: vic-mat-10-2-2
        points:
          - title: Writing a geometric proof
            id: mat-writing-geometric-proof
            brief: A deductive proof moves from given facts to the result in steps, giving a known property or theorem as the reason for each step.
            codes: [VC2M10SP01]
          - title: Using congruence in proofs
            id: mat-using-congruence-proofs
            brief: Proving two triangles congruent shows that their matching sides and angles are equal, which proves other facts about a shape.
            codes: [VC2M10SP01]
          - title: Networks, vertices and edges
            id: mat-networks-vertices-edges-vic
            brief: A network shows connections as vertices joined by edges, and the degree of a vertex is the number of edges meeting there.
            codes: [VC2M10SP02]
          - title: Paths and connected networks
            id: mat-paths-connected-networks
            brief: A network is connected when there is a path between every pair of vertices, and paths model routes such as roads or deliveries.
            codes: [VC2M10SP02]

  - title: Statistics and probability
    chapters:
      - title: Quartiles and box plots
        id: vic-mat-10-3-1
        points:
          - title: Quartiles and interquartile range
            id: mat-quartiles-interquartile-range-vic
            brief: Quartiles split ordered data into four equal parts. The interquartile range, Q3 minus Q1, is the spread of the middle half.
            codes: [VC2M10ST01]
          - title: Five-number summary and box plots
            id: mat-five-number-summary-box-vic
            brief: The minimum, Q1, median, Q3 and maximum are drawn as a box plot, which shows the centre, spread and shape at a glance.
            codes: [VC2M10ST01]
          - title: Identifying outliers with the IQR
            id: mat-identifying-outliers-with-iqr
            brief: A value more than 1.5 × IQR below Q1 or above Q3 counts as an outlier and is shown as a separate point.
            codes: [VC2M10ST01]
          - title: Comparing data with parallel box plots
            id: mat-comparing-data-with-parallel
            brief: Box plots on the same scale compare medians, IQRs and ranges, and show which group is higher or more spread out.
            codes: [VC2M10ST01]

      - title: Bivariate data and claims
        id: vic-mat-10-3-2
        points:
          - title: Scatterplots and association
            id: mat-scatterplots-association-vic
            brief: A scatterplot shows two numerical variables, and the association is described by its direction, strength and whether it is linear.
            codes: [VC2M10ST02]
          - title: Lines of good fit
            id: mat-lines-good-fit-2
            brief: A straight line drawn through the middle of the points to predict one variable from the other, more safely inside the data than beyond it.
            codes: [VC2M10ST02]
          - title: Two-way tables for categorical variables
            id: mat-two-way-tables-categorical-vic
            brief: Comparing row or column percentages in a two-way table shows whether two categorical variables seem related.
            codes: [VC2M10ST03]
          - title: Time series data
            id: mat-time-series-data
            brief: Data recorded over time, with time on the horizontal axis, read for trends, seasonal patterns and unusual points.
            codes: [VC2M10ST05]
          - title: Judging statistical claims
            id: mat-judging-statistical-claims
            brief: Check a claim against its data, its sample and its display, and watch for bias, and for correlation being sold as cause.
            codes: [VC2M10ST04]

      - title: Conditional probability and independence
        id: vic-mat-10-3-3
        points:
          - title: Three-step experiments
            id: mat-three-step-experiments
            brief: Extend a tree diagram to three steps, such as three coin tosses, and multiply along the branches for each outcome.
            codes: [VC2M10P02]
          - title: Independent events
            id: mat-independent-events-3
            brief: Events are independent when one does not change the other's probability, and then P(A and B) = P(A) × P(B).
            codes: [VC2M10P02]
          - title: Conditional probability
            id: mat-conditional-probability-3-vic
            brief: The probability of A given B counts only the outcomes where B happened, so the sample space shrinks to B.
            codes: [VC2M10P01]
          - title: Conditional probability from a two-way table
            id: mat-conditional-probability-from-two-vic
            brief: To find a probability given a condition, use only the row or column for that condition as the total.
            codes: [VC2M10P01]
