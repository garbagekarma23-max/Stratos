# NSW English, Stage 4 (Years 7 and 8): the six Stage 4 focus areas, 67 points.
# Follows NESA's English K-10 Syllabus (2022), Stage 4 content, checked on the NSW Curriculum website
# (curriculum.nsw.edu.au) in November 2026. It replaced the English K-10 Syllabus (2012) in Years 7 to 10 from 2024
# (the department's recommended staggered start: Years 7 and 9 in 2024, Years 8 and 10 in 2025). NESA's curriculum
# reform timeline names no replacement.
# Structure: each focus area is a unit (Reading, viewing and listening; Understanding and responding A, B and C;
# Expressing ideas and composing A and B, which share the last unit). Each content group, such as Point of view or
# Sentence-level grammar and punctuation, is a chapter or part of one. Each point lists its focus area's outcome code.
# Life Skills outcomes are left out. Reading for enjoyment, reflecting and speaking practice are taught here only as
# the ideas behind them.
# No set texts: schools choose their own, so every point teaches a concept with invented examples. Every brief is in
# our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-eng-s4
subject: English
bank: eng
name: English, Stage 4
about: NSW Stage 4, Years 7 and 8
short: English
years: [7, 8]
level: Stage 4
place: nsw
kind: english
syllabus: NSW English K-10 Syllabus (2022), Stage 4
note: Follows the NSW English syllabus. Not made or endorsed by NESA.
chips: [simile, point of view, theme, persuasive, complex sentence, modality]

units:
  - title: Reading, viewing and listening
    chapters:
      - title: Reading closely
        id: nsw-eng-s4-1-1
        points:
          - title: Reading pathways
            id: eng-reading-pathways
            brief: Different texts are read along different paths. A novel is read line by line, a web page by scanning headings and links, and a graphic novel panel by panel. Knowing the path helps work out a text's form and purpose.
            codes: [EN4-RVL-01]
          - title: Working out new words
            id: eng-working-out-new-words
            brief: Using clues in the sentence around a word, and its parts such as a prefix, root or suffix, to work out what an unfamiliar word means.
            codes: [EN4-RVL-01]
          - title: Literal and implied meaning
            id: eng-literal-implied-meaning
            brief: The literal meaning is what a text says on the surface. The implied meaning is what a reader infers from details, such as a character who says they are fine while slamming a door.
            codes: [EN4-RVL-01]
          - title: Ambiguity
            id: eng-ambiguity
            brief: A detail is ambiguous when it can be read in more than one way. Writers leave some meanings open on purpose, through tone, symbols, connotation or hints about what is to come.
            codes: [EN4-RVL-01]
          - title: Empathy, sympathy and antipathy
            id: eng-empathy-sympathy-antipathy
            brief: Empathy is sharing a character's feelings, sympathy is feeling sorry for them, and antipathy is disliking them. Writers shape which one a reader feels through a character's choices and motives.
            codes: [EN4-RVL-01]
          - title: How language changes
            id: eng-language-changes
            brief: English keeps changing as technology and contact with other cultures bring new words and new meanings for old ones, such as the way the word cloud now also means online storage.
            codes: [EN4-RVL-01]

  - title: Understanding and responding A
    chapters:
      - title: Language, purpose and audience
        id: nsw-eng-s4-2-1
        points:
          - title: Objective and subjective language
            id: eng-objective-subjective-language
            brief: Objective language sticks to facts that can be checked. Subjective language shows the writer's feelings and opinions. Telling them apart in a report and in a review.
            codes: [EN4-URA-01]
          - title: Formal and informal register
            id: eng-formal-informal-register-nsw
            brief: Register is how formal language is. Writers choose words, sentence length and tone to suit their purpose and audience, such as a letter to a principal compared with a text to a friend.
            codes: [EN4-URA-01]
          - title: Words Australian English has borrowed
            id: eng-words-australian-english-has
            brief: Australian English has taken words from many languages, including Aboriginal languages, such as kangaroo from the Guugu Yimithirr language of far north Queensland, and others from French, Greek and Latin.
            codes: [EN4-URA-01]
          - title: Naming techniques in analysis
            id: eng-naming-techniques-analysis
            brief: Metalanguage is the set of terms used to talk about language, such as simile or first person. Naming a technique precisely, then explaining its effect, makes analysis clear.
            codes: [EN4-URA-01]

      - title: Figurative language
        id: nsw-eng-s4-2-2
        points:
          - title: Simile and metaphor
            id: eng-simile-metaphor
            brief: A simile compares two things using like or as. A metaphor says one thing is another. Both carry qualities from one thing to another to help a reader see it in a new way.
            codes: [EN4-URA-01]
          - title: Personification
            id: eng-personification
            brief: Giving human actions or feelings to something that is not human, such as wind that whispers, to make it vivid or to set a mood.
            codes: [EN4-URA-01]
          - title: Hyperbole and oxymoron
            id: eng-hyperbole-oxymoron
            brief: Hyperbole is deliberate exaggeration for effect. An oxymoron joins two opposite words, such as deafening silence, to capture a feeling that is hard to name.
            codes: [EN4-URA-01]
          - title: Connotation and denotation
            id: eng-connotation-denotation-nsw
            brief: Denotation is a word's dictionary meaning. Connotation is the feelings it carries, so slim and skinny mean much the same but feel different to a reader.
            codes: [EN4-URA-01]
          - title: Imagery
            id: eng-imagery-2
            brief: Language that appeals to the senses of sight, sound, smell, taste and touch, so the reader can picture a scene and feel its mood.
            codes: [EN4-URA-01]
          - title: Symbol and motif
            id: eng-symbol-motif
            brief: A symbol is an object or image that stands for a bigger idea, such as a locked gate for being shut out. A motif is an image or idea that returns through a text and builds a theme.
            codes: [EN4-URA-01]

      - title: Point of view
        id: nsw-eng-s4-2-3
        points:
          - title: First-person narration
            id: eng-first-person-narration
            brief: A first-person narrator tells the story as I. The reader gets close to their thoughts but sees only what they know and believe.
            codes: [EN4-URA-01]
          - title: Second-person and third-person narration
            id: eng-second-person-third-person
            brief: Second person speaks to the reader as you. Third person uses he, she or they, and can be limited to one character's view or omniscient, knowing everything.
            codes: [EN4-URA-01]
          - title: Narrator and focaliser
            id: eng-narrator-focaliser
            brief: The narrator is the voice telling the story. The focaliser is the character whose eyes the reader sees through. A novel can switch focalisers between chapters to show the same events two ways.
            codes: [EN4-URA-01]
          - title: Tense and the order of events
            id: eng-tense-order-events
            brief: A story told in the present tense feels immediate and one in the past feels reflective. Flashbacks and jumps forward change the order of events and what the reader knows.
            codes: [EN4-URA-01]

      - title: Character and narrative
        id: nsw-eng-s4-2-4
        points:
          - title: Direct and indirect characterisation
            id: eng-direct-indirect-characterisation
            brief: Direct characterisation tells the reader what a character is like. Indirect characterisation shows it through what they say, do and think, and how others react to them.
            codes: [EN4-URA-01]
          - title: Flat, round, static and dynamic characters
            id: eng-flat-round-static-dynamic
            brief: A flat character has one or two traits and a round one is complex. A static character stays the same and a dynamic one changes through the story.
            codes: [EN4-URA-01]
          - title: Stereotypes and archetypes
            id: eng-stereotypes-archetypes
            brief: A stereotype is an oversimplified idea of a type of person. An archetype is a character pattern found across many stories, such as the mentor or the trickster.
            codes: [EN4-URA-01]
          - title: Protagonist and antagonist
            id: eng-protagonist-antagonist
            brief: The protagonist is the main character the story follows. The antagonist is the person or force that works against them and creates conflict.
            codes: [EN4-URA-01]
          - title: Narrative structure
            id: eng-narrative-structure-2-nsw
            brief: Most narratives move from orientation through a complication and rising action to a climax and resolution. How the resolution answers the complication can meet or surprise a reader's expectations.
            codes: [EN4-URA-01]
          - title: Setting and subplot
            id: eng-setting-subplot
            brief: Setting is the time and place of a story, which shapes its mood. A subplot is a smaller story line that runs beside the main plot and adds to its ideas.
            codes: [EN4-URA-01]

  - title: Understanding and responding B
    chapters:
      - title: Theme and perspective
        id: nsw-eng-s4-3-1
        points:
          - title: Subject and theme
            id: eng-subject-theme
            brief: The subject is what a text is about, such as a friendship. The theme is the idea the text suggests about it, written as a sentence, such as that loyalty is tested by change.
            codes: [EN4-URB-01]
          - title: How texts build a theme
            id: eng-texts-build-theme
            brief: Themes grow from patterns, such as repeated images, contrasts between characters and what happens at the end. Tracing a pattern is how a reader supports a claim about theme.
            codes: [EN4-URB-01]
          - title: Perspective
            id: eng-perspective
            brief: A perspective is a way of seeing the world shaped by a person's experiences, values and background. Two characters can see the same event very differently.
            codes: [EN4-URB-01]
          - title: Context
            id: eng-context
            brief: Context is the time, place and culture a text comes from and is read in. It shapes the composer's choices and the way readers respond.
            codes: [EN4-URB-01]
          - title: Words and cultural context
            id: eng-words-cultural-context
            brief: The meaning of a word can depend on culture. Aboriginal English is a dialect with its own rules, and words such as Country and mob carry meanings tied to land, family and community.
            codes: [EN4-URB-01]

      - title: Argument and style
        id: nsw-eng-s4-3-2
        points:
          - title: Persuasive language devices
            id: eng-persuasive-language-devices
            brief: Rhetorical questions, emotive words, inclusive language such as we and us, and lists of three, and how each one moves an audience towards a view.
            codes: [EN4-URB-01]
          - title: Ethos, pathos and logos
            id: eng-ethos-pathos-logos-nsw
            brief: Three ways to persuade. Ethos builds trust in the speaker, pathos appeals to feelings, and logos appeals to reason with facts and logic.
            codes: [EN4-URB-01]
          - title: Evidence and authority
            id: eng-evidence-authority
            brief: Facts, statistics, expert opinion and examples support an argument. Choosing reliable sources and putting the strongest evidence in the right place gives a text authority.
            codes: [EN4-URB-01]
          - title: Personal voice
            id: eng-personal-voice
            brief: Voice is the personality a reader hears in writing, created by word choice, sentence rhythm, humour and tone. A strong personal voice keeps a reader engaged.
            codes: [EN4-URB-01]
          - title: Style
            id: eng-style
            brief: Style is the distinctive way a text is written, its vocabulary, sentence patterns, imagery and form. Style can belong to a writer, a time period, a culture or a genre.
            codes: [EN4-URB-01]

  - title: Understanding and responding C
    chapters:
      - title: Genre and connections between texts
        id: nsw-eng-s4-4-1
        points:
          - title: Genre conventions
            id: eng-genre-conventions
            brief: A genre is a group of texts that share patterns of plot, setting, character types and language, such as mystery, fantasy or science fiction. Readers use these patterns to make predictions.
            codes: [EN4-URC-01]
          - title: Breaking and mixing genres
            id: eng-breaking-mixing-genres
            brief: Writers can play with a genre's conventions or break them to surprise readers, and can mix two genres, such as a science fiction western.
            codes: [EN4-URC-01]
          - title: Allusion and intertextuality
            id: eng-allusion-intertextuality
            brief: Intertextuality is when a text draws on another, through an allusion such as a character's name, a borrowed plot or a famous line, which adds meaning for readers who notice it.
            codes: [EN4-URC-01]
          - title: Adaptation and appropriation
            id: eng-adaptation-appropriation
            brief: An adaptation moves a text into a new form, such as a novel into a film. An appropriation reshapes it for a new time, place or audience, which changes what it means.
            codes: [EN4-URC-01]
          - title: Why texts are valued
            id: eng-texts-are-valued
            brief: People value texts for their ideas, their style and what they do in society, such as a speech that helped change a law or a story that keeps a culture's history alive.
            codes: [EN4-URC-01]

  - title: Expressing ideas and composing texts
    chapters:
      - title: Building sentences
        id: nsw-eng-s4-5-1
        points:
          - title: Clauses and phrases
            id: eng-clauses-phrases
            brief: A clause has a verb and its subject. A phrase is a group of words without both. A main clause makes sense alone, and a subordinate clause depends on it.
            codes: [EN4-ECA-01]
          - title: Simple, compound and complex sentences
            id: eng-simple-compound-complex-sentences-nsw
            brief: A simple sentence has one clause. A compound sentence joins main clauses with and, but or so. A complex sentence adds a subordinate clause with a word such as because or although.
            codes: [EN4-ECA-01]
          - title: The four sentence types
            id: eng-four-sentence-types
            brief: Declarative sentences state, interrogative ones ask, imperative ones command and exclamatory ones show strong feeling. Each suits a different purpose, such as imperatives in a recipe.
            codes: [EN4-ECA-01]
          - title: Adjectival and adverbial clauses
            id: eng-adjectival-adverbial-clauses
            brief: An adjectival clause, starting with who, which or that, adds detail to a noun. An adverbial clause tells when, where, why or how, and moving it to the front of a sentence changes the emphasis.
            codes: [EN4-ECA-01]

      - title: Grammar for meaning
        id: nsw-eng-s4-5-2
        points:
          - title: Noun groups
            id: eng-noun-groups
            brief: A noun group is a noun with the words around it. A short noun group is clear and simple, and an elaborated one, such as the old timber jetty by the river, adds precise detail.
            codes: [EN4-ECA-01]
          - title: Nominalisation
            id: eng-nominalisation-nsw
            brief: Turning a verb or adjective into a noun, such as decide into decision, to make writing sound more formal and to pack more ideas into a sentence.
            codes: [EN4-ECA-01]
          - title: Modality
            id: eng-modality-nsw
            brief: Modal words show how certain or forceful a statement is, from high (must, certainly) to low (might, possibly). Writers choose modality to sound confident or cautious.
            codes: [EN4-ECA-01]
          - title: Active and passive voice
            id: eng-active-passive-voice
            brief: In the active voice the doer comes first (the dog chased the cat). In the passive the receiver comes first (the cat was chased), and the doer can be left out to hide who was responsible.
            codes: [EN4-ECA-01]
          - title: Keeping tense consistent
            id: eng-keeping-tense-consistent
            brief: Choosing a tense that suits the purpose, such as present tense for analysing a text, and staying in it unless there is a reason to change.
            codes: [EN4-ECA-01]
          - title: Pronouns and connectives for cohesion
            id: eng-pronouns-connectives-cohesion
            brief: Cohesion is how a text holds together. Pronouns must point clearly to a noun, and connectives such as however, therefore and meanwhile link ideas across sentences.
            codes: [EN4-ECA-01]

      - title: Punctuation and spelling
        id: nsw-eng-s4-5-3
        points:
          - title: Commas and brackets
            id: eng-commas-brackets
            brief: Commas separate items in a list, follow an introductory clause and mark off extra information. Brackets also hold extra information that the sentence could do without.
            codes: [EN4-ECA-01]
          - title: Colons and semicolons
            id: eng-colons-semicolons
            brief: A colon introduces a list, an explanation or an example. A semicolon joins two closely related main clauses that could each stand alone.
            codes: [EN4-ECA-01]
          - title: Punctuating quotations
            id: eng-punctuating-quotations
            brief: Quotation marks go around the exact words used. A short quotation can be woven into your own sentence so the sentence still reads smoothly.
            codes: [EN4-ECA-01]
          - title: Spelling with prefixes and suffixes
            id: eng-spelling-with-prefixes-suffixes
            brief: Many long words are built from parts. Knowing prefixes, roots and suffixes, and rules such as dropping a final e before -ing, helps spell unfamiliar words.
            codes: [EN4-ECA-01]

      - title: Analytical and persuasive writing
        id: nsw-eng-s4-5-4
        points:
          - title: Three purposes for writing
            id: eng-three-purposes-writing
            brief: Imaginative texts entertain and explore experience, informative texts explain or report, and persuasive texts argue for a view. The purpose shapes the structure and language.
            codes: [EN4-ECA-01]
          - title: Topic sentences and paragraphs
            id: eng-topic-sentences-paragraphs
            brief: A topic sentence states the paragraph's main point. The paragraph then explains it, gives evidence and links back to the question or argument.
            codes: [EN4-ECA-01]
          - title: Introductions and thesis statements
            id: eng-introductions-thesis-statements
            brief: An introduction orients the reader to the topic and gives a thesis, a clear statement of the writer's position or argument that the rest of the text supports.
            codes: [EN4-ECA-01]
          - title: Conclusions
            id: eng-conclusions-2
            brief: A conclusion draws the argument together and restates the position in fresh words, without repeating whole sentences or adding new points.
            codes: [EN4-ECA-01]
          - title: Counterargument and rebuttal
            id: eng-counterargument-rebuttal
            brief: A counterargument states an opposing view fairly. A rebuttal answers it with reasons and evidence, which makes a persuasive text more convincing.
            codes: [EN4-ECA-01]

      - title: Imaginative, visual and spoken texts
        id: nsw-eng-s4-5-5
        points:
          - title: Poetic forms
            id: eng-poetic-forms
            brief: Forms such as haiku, limerick, ballad and free verse, and how each form's rules for lines, syllables or rhyme shape what a poem can do.
            codes: [EN4-ECA-01]
          - title: Retelling from another viewpoint
            id: eng-retelling-from-another-viewpoint
            brief: Transforming a story by telling it from a different character's view, changing its ending or moving it into a new form shows how a writer's choices create meaning.
            codes: [EN4-ECA-01]
          - title: Visual techniques
            id: eng-visual-techniques-nsw
            brief: Salience (what the eye goes to first), colour, framing, vectors and gaze, and how each guides a viewer through an image such as a poster.
            codes: [EN4-ECA-01]
          - title: Speaking to an audience
            id: eng-speaking-audience
            brief: Volume, pace, pause, tone and emphasis in the voice, with gesture and eye contact, change how a spoken text lands with its audience.
            codes: [EN4-ECA-01]

      - title: Planning and reflecting
        id: nsw-eng-s4-5-6
        points:
          - title: Planning for audience and purpose
            id: eng-planning-audience-purpose
            brief: Before writing, decide who the audience is, what the text must do and which form suits it, then sort ideas into a logical order.
            codes: [EN4-ECB-01]
          - title: Drafting, editing and proofreading
            id: eng-drafting-editing-proofreading
            brief: Drafting gets ideas down. Editing improves the ideas, structure and word choice. Proofreading catches spelling, punctuation and grammar errors at the end.
            codes: [EN4-ECB-01]
          - title: Using feedback
            id: eng-using-feedback
            brief: Comparing a draft with the task, a model text or a classmate's comments to find what to change, and reflecting on what worked for next time.
            codes: [EN4-ECB-01]
