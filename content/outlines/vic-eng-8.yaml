# Victorian Curriculum English, Level 8 (Year 8): language, literature and literacy, 39 points.
# Follows the Victorian Curriculum F-10 Version 2.0: English, Level 8, checked on the VCAA's Version 2.0 website
# (f10.vcaa.vic.edu.au) in November 2026. VC2.0 English was published in December 2023, with familiarisation in 2024
# and implementation from 2025. It replaced English in the Victorian Curriculum F-10 Version 1.0 (taught from 2017).
# No newer version is announced; the Version 1.0 website closes on 31 December 2026.
# VC2.0 sets English by single levels, in three strands (Language, Literature, Literacy), each with sub-strands. Each
# strand is a unit here, and each chapter is one sub-strand, two small ones together, or part of a large one. Creating
# texts and speaking are covered only as the ideas behind them (structure, register, persuasive techniques, revising).
# No set texts are named, since schools choose their own, and nothing is quoted from any text. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-eng-8
subject: English
bank: eng
name: English, Year 8
about: Victorian Curriculum 2.0, Level 8
short: English
years: [8]
place: vic
kind: english
syllabus: "Victorian Curriculum F-10 Version 2.0: English, Level 8"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [nominalisation, semicolon, intertextuality, tone, bias, persuasive techniques]

units:
  - title: Language
    chapters:
      - title: Language, roles and judgement
        id: vic-eng-8-1-1
        points:
          - title: Language and relationships
            id: eng-language-relationships-vic
            brief: How formal or casual we are, the names we call people and how we ask for things shape relationships and show roles, such as student and teacher.
            codes: [VC2E8LA01]
          - title: Modality
            id: eng-modality-vic
            brief: Words such as might, should and must show how certain or forceful a writer is, from low to high modality.
            codes: [VC2E8LA02]
          - title: Figurative language in judgements
            id: eng-figurative-language-judgements
            brief: A simile or metaphor can pack an opinion into an image, such as calling a decision a slap in the face, adding a judgement as well as a picture.
            codes: [VC2E8LA02]

      - title: Hybrid texts and cohesion
        id: vic-eng-8-1-2
        points:
          - title: Hybrid texts
            id: eng-hybrid-texts-vic
            brief: A hybrid text mixes the structures and features of more than one text type, such as a story told through diary entries and news reports.
            codes: [VC2E8LA03]
          - title: Building an analytical paragraph
            id: eng-building-analytical-paragraph-2
            brief: A strong paragraph makes a claim, supports it with evidence, explains how the evidence proves the claim, and links back to the main argument.
            codes: [VC2E8LA04]
          - title: Embedding quotations
            id: eng-embedding-quotations
            brief: Short quotations work best woven into your own sentence so it still reads smoothly, rather than dropped in on their own.
            codes: [VC2E8LA04]

      - title: Clauses, nominalisation and punctuation
        id: vic-eng-8-1-3
        points:
          - title: Main and subordinate clauses
            id: eng-main-subordinate-clauses
            brief: A main clause makes sense on its own. A subordinate clause adds information but depends on the main clause to make sense.
            codes: [VC2E8LA05]
          - title: Embedded clauses
            id: eng-embedded-clauses-vic
            brief: An embedded clause sits inside another clause to add detail about a noun, often starting with who, which or that.
            codes: [VC2E8LA05]
          - title: Nominalisation
            id: eng-nominalisation-vic
            brief: Turning a verb or adjective into a noun, such as decide into decision, makes writing sound more formal and less personal.
            codes: [VC2E8LA06]
          - title: Semicolons
            id: eng-semicolons
            brief: A semicolon joins two closely linked main clauses without a joining word, and separates list items that already contain commas.
            codes: [VC2E8LA09]
          - title: Dashes for emphasis and asides
            id: eng-dashes-emphasis-asides
            brief: A dash can set off an aside or add a sudden twist at the end of a sentence, and is less formal than brackets or a colon.
            codes: [VC2E8LA09]

      - title: Vocabulary and intertextual images
        id: vic-eng-8-1-4
        points:
          - title: Academic vocabulary
            id: eng-academic-vocabulary-vic
            brief: Words used for study across subjects, such as analyse, significant, consequently and evidence, which make writing precise and formal.
            codes: [VC2E8LA08]
          - title: Connotation
            id: eng-connotation
            brief: Words with the same basic meaning can carry different feelings, such as slim and skinny, and writers choose between them on purpose.
            codes: [VC2E8LA08]
          - title: Intertextuality in images and film
            id: eng-intertextuality-images-film
            brief: A poster, advertisement or film scene can echo a famous painting, film or story, and the reference adds a layer of meaning for viewers who notice it.
            codes: [VC2E8LA07]

  - title: Literature
    chapters:
      - title: Values and positions in literature
        id: vic-eng-8-2-1
        points:
          - title: Values in literary texts
            id: eng-values-literary-texts
            brief: Characters' choices and how the story treats them show the values of individuals and groups, such as loyalty, fairness or ambition.
            codes: [VC2E8LE01]
          - title: Aboriginal and Torres Strait Islander perspectives in literature
            id: eng-aboriginal-torres-strait-islander-vic
            brief: Texts by Aboriginal and Torres Strait Islander authors can share perspectives on identity, community and history that readers should consider in the author's own context.
            codes: [VC2E8LE01]
          - title: A writer's style
            id: eng-writer-s-style
            brief: Style is the way a writer writes, built from their word choice, sentence patterns, devices and structure, and readers form opinions about it.
            codes: [VC2E8LE02]
          - title: Positioning readers on ethical issues
            id: eng-positioning-readers-ethical-issues
            brief: Writers lead readers to approve or disapprove of a character or choice through what they show, what they leave out and how they describe it.
            codes: [VC2E8LE03]

      - title: Allusion, tone and voice
        id: vic-eng-8-2-2
        points:
          - title: Intertextual references in literature
            id: eng-intertextual-references-literature-vic
            brief: A reference to a myth, fairy tale or well-known story lets a writer borrow its meaning, and recognising it gives the reader a new understanding.
            codes: [VC2E8LE04]
          - title: Tone
            id: eng-tone
            brief: Tone is the writer's attitude that comes through the words, such as playful, bitter or serious.
            codes: [VC2E8LE05]
          - title: Narrative voice
            id: eng-narrative-voice
            brief: Voice is the personality of the narrator that readers hear in the writing, made by word choice, sentence rhythm and attitude.
            codes: [VC2E8LE05]
          - title: Sentence patterns for effect
            id: eng-sentence-patterns-effect
            brief: Short sentences can build tension or shock, long flowing ones can slow the pace, and repeated patterns can build emphasis.
            codes: [VC2E8LE05]
          - title: Imagery
            id: eng-imagery-2-vic
            brief: Imagery is description that appeals to the senses, creating pictures, sounds and feelings in the reader's mind.
            codes: [VC2E8LE05]

      - title: Genre and story devices
        id: vic-eng-8-2-3
        points:
          - title: Genre conventions
            id: eng-genre-conventions-vic
            brief: Each genre has familiar features readers expect, such as a mystery's clues and suspects or a fantasy's invented world and magic.
            codes: [VC2E8LE06, VC2E8LE02]
          - title: Foreshadowing
            id: eng-foreshadowing
            brief: Foreshadowing drops hints about what will happen later, building suspense and making the ending feel earned.
            codes: [VC2E8LE06]
          - title: Flashback
            id: eng-flashback
            brief: A flashback interrupts the story to show an earlier event, revealing a character's past or explaining the present.
            codes: [VC2E8LE06]

  - title: Literacy
    chapters:
      - title: Discussion, register and representation
        id: vic-eng-8-3-1
        points:
          - title: Stated and implied meaning
            id: eng-stated-implied-meaning
            brief: A text's stated meaning is what it says outright, its implied meaning is what it suggests, and discussions can support or challenge either.
            codes: [VC2E8LY01]
          - title: Register in speaking
            id: eng-register-speaking
            brief: Register is how formal our language is. A speech to a school assembly needs a different register from a chat with friends.
            codes: [VC2E8LY02]
          - title: Representation of people, places and events
            id: eng-representation-people-places-events
            brief: Texts show a version of people, places and events, not the whole truth, and that version reflects when, where and by whom the text was made.
            codes: [VC2E8LY04]

      - title: Spelling technical words
        id: vic-eng-8-3-2
        points:
          - title: Word families for spelling
            id: eng-word-families-spelling
            brief: Linking a word to its family, such as sign, signal and signature, shows letters you cannot hear and helps you spell it.
            codes: [VC2E8LY03]
          - title: Homophones
            id: eng-homophones-vic
            brief: Homophones sound the same but differ in spelling and meaning, such as their, there and they're, or affect and effect.
            codes: [VC2E8LY03]
          - title: Common endings in academic words
            id: eng-common-endings-academic-words
            brief: Choosing between endings that sound alike, such as -tion and -sion, -ance and -ence, or -able and -ible, in subject words.
            codes: [VC2E8LY03]

      - title: Analysing perspective
        id: vic-eng-8-3-3
        points:
          - title: Perspective and bias
            id: eng-perspective-bias
            brief: A perspective is the viewpoint a text comes from. Bias is when a text favours one side, by its word choice or by what it leaves out.
            codes: [VC2E8LY05]
          - title: How quotations can be repurposed
            id: eng-quotations-can-be-repurposed
            brief: A quotation taken out of its context can be made to mean something different, so check where it came from and what surrounded it.
            codes: [VC2E8LY05]
          - title: Problem-solution and compare-contrast structures
            id: eng-problem-solution-compare-contrast
            brief: Writers organise ideas by setting out a problem then its solutions, or by comparing and contrasting two things point by point.
            codes: [VC2E8LY06]
          - title: Questioning a text
            id: eng-questioning-text
            brief: Evaluating a text means asking who made it, why, what evidence it gives and what it leaves out, before accepting its ideas.
            codes: [VC2E8LY07]

      - title: Persuading and reporting
        id: vic-eng-8-3-4
        points:
          - title: Persuasive techniques
            id: eng-persuasive-techniques-2
            brief: Rhetorical questions, inclusive language, emotive words, repetition and expert opinion are common ways to persuade an audience.
            codes: [VC2E8LY08]
          - title: News report structure
            id: eng-news-report-structure
            brief: A news report puts the most important facts first, answering who, what, when, where, why and how, then adds detail in order of importance.
            codes: [VC2E8LY08]
          - title: Revising for clarity and coherence
            id: eng-revising-clarity-coherence
            brief: Revising checks that ideas are in a logical order, paragraphs link, and each sentence says exactly what is meant.
            codes: [VC2E8LY09]
