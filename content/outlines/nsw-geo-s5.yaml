# NSW Geography, Stage 5 (Years 9 and 10): the Stage 5 geographical tools and the four Stage 5 focus areas, 69 points.
# Follows NESA's Geography 7-10 Syllabus (2024), checked on the NSW Curriculum website (curriculum.nsw.edu.au) in
# November 2026. Schools plan for it in 2025 and 2026 and teach it from 2027, so this follows the new syllabus, not the
# Geography K-10 Syllabus (2015) it replaces. The 2015 syllabus is not available after December 2028.
# Structure: the Stage 5 tools and inquiry skills, which the syllabus says run through the whole course, are the first
# unit. Each Stage 5 focus area (Biomes and sustainable agriculture, Changing places, Environmental change and
# management, Human wellbeing) is a unit, and each content group within it is a chapter or two. The geographical
# concepts are taught in Stage 4 (nsw-geo-s4) and run through the briefs here. Fieldwork and inquiry are taught only as
# the ideas behind them.
# Where schools choose: Biomes and productivity has schools study ONE biome; the points cover biomes in general and the
# grasslands, the biome most used for food, as an example. Changing places has schools pick another country and ONE
# Australian city; the briefs use China and Sydney. Environmental change and management has ONE environment compared
# with another country; the two case study chapters cover coastal environments and inland water, two of the most
# taught, and others (marine, mountain, arid, urban) can be added. Human wellbeing has schools pick a country; the
# briefs use India. Outcome codes (GE5-...) run across every focus area, so they are left off the points.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: nsw-geo-s5
subject: Geography
bank: geo
name: Geography, Stage 5
about: NSW Stage 5, Years 9 and 10
short: Geography
years: [9, 10]
level: Stage 5
place: nsw
kind: standard
syllabus: NSW Geography 7-10 Syllabus (2024), Stage 5
note: Follows the NSW Geography syllabus. Not made or endorsed by NESA.
chips: [biomes, food security, migration, urbanisation, human wellbeing]

units:
  - title: Geographical tools and inquiry
    chapters:
      - title: Topographic map skills
        id: nsw-geo-s5-1-1
        points:
          - title: Large-scale and small-scale maps
            id: geo-large-scale-small-scale
            brief: A large-scale map shows a small area in great detail, and a small-scale map shows a large area with little detail.
          - title: Latitude and longitude
            id: geo-latitude-longitude-nsw
            brief: Lines of latitude run east to west and measure degrees north or south of the equator. Longitude measures degrees east or west of Greenwich, and both use degrees and minutes.
          - title: The 16-point compass and bearings
            id: geo-16-point-compass-bearings
            brief: The 16-point compass adds directions such as NNE and WSW, and a bearing gives direction as an angle from 0 to 360 degrees clockwise from north.
          - title: Calculating distance and area with a ratio scale
            id: geo-calculating-distance-area-with
            brief: With a scale such as 1 to 25,000, one centimetre on the map is 250 metres on the ground, and area is found by counting grid squares.
          - title: Local relief and gradient
            id: geo-local-relief-gradient
            brief: Local relief is the difference between the highest and lowest points in an area. Gradient is the rise over the horizontal distance, written as a ratio such as 1 in 20.

      - title: Thematic maps, statistics and spatial data
        id: nsw-geo-s5-1-2
        points:
          - title: Choropleth maps
            id: geo-choropleth-maps-nsw
            brief: A choropleth map shades areas in darker or lighter colours to show how much of something each area has, such as population density.
          - title: Reading synoptic charts
            id: geo-reading-synoptic-charts
            brief: On a synoptic chart, isobars join places of equal air pressure. Close isobars mean strong winds, highs bring fine weather and lows and fronts bring rain.
          - title: Population pyramids
            id: geo-population-pyramids
            brief: A population pyramid shows a country's people by age and sex. A wide base means many young people, and a narrow base with a wide top means an ageing population.
          - title: Scatter plots and correlation
            id: geo-scatter-plots-correlation
            brief: A scatter plot shows whether two sets of data are linked, such as income and life expectancy, with a positive, negative or no correlation.

      - title: Geographical inquiry
        id: nsw-geo-s5-1-3
        points:
          - title: Steps of a geographical inquiry
            id: geo-steps-geographical-inquiry
            brief: An inquiry starts with a question and a plan, collects and processes information, draws conclusions, proposes action and then evaluates how well it worked.
          - title: Primary and secondary data
            id: geo-primary-secondary-data-nsw
            brief: Primary data is collected first-hand, such as by surveys and fieldwork. Secondary data comes from others, such as census figures and reports.
          - title: Evaluating an inquiry
            id: geo-evaluating-inquiry
            brief: A good evaluation asks whether the data was reliable and enough, whether sources were biased, and what could be done better next time.

  - title: Biomes and sustainable agriculture
    chapters:
      - title: Earth's biomes
        id: nsw-geo-s5-2-1
        points:
          - title: What a biome is
            id: geo-biome-nsw
            brief: A biome is a large region with a similar climate, soils, plants and animals, such as a desert, tundra or tropical rainforest.
          - title: Where the biomes are
            id: geo-where-biomes-are
            brief: Biomes form broad bands across the world, with rainforests near the equator, deserts near the tropics and tundra near the poles.
          - title: Why biomes differ
            id: geo-biomes-differ
            brief: Climate is the main factor, especially temperature and rainfall, along with latitude, altitude, soils and distance from the sea.
          - title: Biomes as a natural resource
            id: geo-biomes-as-natural-resource
            brief: Biomes provide food, fibres such as cotton and wool, timber, medicines and clean water, and they store carbon.
          - title: Grassland biomes and food
            id: geo-grassland-biomes-food
            brief: Grasslands, such as the Australian rangelands and the North American prairies, are used for grazing and grain growing, but face drought and soil erosion.

      - title: Producing food
        id: nsw-geo-s5-2-2
        points:
          - title: Changing biomes to grow more food
            id: geo-changing-biomes-grow-more-nsw
            brief: People alter biomes to grow food by clearing vegetation, irrigating, terracing slopes, draining wetlands and adding fertilisers.
          - title: Factors in food supply
            id: geo-factors-food-supply
            brief: Food supply in Australia and Asia depends on environmental factors such as climate and water, and on land, technology, labour and money.
          - title: Factors in food demand
            id: geo-factors-food-demand
            brief: Demand for food grows with population, rising incomes and changing diets, such as more meat and dairy eaten across Asia.
          - title: Environmental impacts of food production
            id: geo-environmental-impacts-food-production
            brief: Farming can cause land clearing, soil erosion, salinity, water pollution from fertilisers, overuse of rivers and loss of biodiversity.

      - title: Food security
        id: nsw-geo-s5-2-3
        points:
          - title: What food security is
            id: geo-food-security
            brief: Food security means all people always have enough safe and nutritious food. Food insecurity is when they do not.
          - title: Threats to food security
            id: geo-threats-food-security
            brief: Poverty, conflict, drought, climate change, land degradation, food waste and rising prices all threaten food security.
          - title: Sustainable farming practices
            id: geo-sustainable-farming-practices
            brief: Practices such as crop rotation, no-till farming, efficient irrigation and cutting food waste help produce food while protecting land for the future.
          - title: Aboriginal knowledges and food systems
            id: geo-aboriginal-knowledges-food-systems
            brief: Aboriginal Peoples grew, harvested and stored native grains, tubers and seeds for thousands of years, and this knowledge can help build food systems suited to Australia.

  - title: Changing places
    chapters:
      - title: Why people move
        id: nsw-geo-s5-3-1
        points:
          - title: Push and pull factors
            id: geo-push-pull-factors-nsw
            brief: Push factors, such as war, poverty or disaster, drive people away. Pull factors, such as jobs, safety and family, draw them to a place.
          - title: Types of migration
            id: geo-types-migration-nsw
            brief: Migration can be internal, within a country, or international, between countries, and voluntary or forced, as for refugees.
          - title: Effects of migration on origin and destination
            id: geo-effects-migration-origin-destination
            brief: Migrants send money home and fill job gaps where they go, but the place they leave can lose young and skilled workers.
          - title: Migration to Australia
            id: geo-migration-australia
            brief: People have migrated to Australia from Britain and Europe after World War II, and more recently from Asia, especially China and India.
          - title: Effects of migration on Australia
            id: geo-effects-migration-australia
            brief: Migration grows Australia's population and workforce, adds cultural diversity and puts pressure on housing and services in big cities.
          - title: Internal migration in Australia
            id: geo-internal-migration-australia
            brief: Australians move for work, study, retirement and lifestyle, such as sea change and tree change moves to the coast and the country.
          - title: Rural to urban migration in China
            id: geo-rural-urban-migration-china
            brief: Hundreds of millions of people in China have moved from farms to cities for factory and service jobs, one of the largest movements in history.

      - title: Urbanisation
        id: nsw-geo-s5-3-2
        points:
          - title: What urbanisation is
            id: geo-urbanisation-2
            brief: Urbanisation is the growing share of a country's people who live in towns and cities rather than in the country.
          - title: Causes and consequences of urbanisation
            id: geo-causes-consequences-urbanisation
            brief: People move to cities for jobs and services. Fast growth can bring traffic, pollution, high housing costs and informal settlements.
          - title: Australia's urban pattern
            id: geo-australia-s-urban-pattern
            brief: Australia is one of the most urbanised countries, with most people living in a few coastal capital cities.
          - title: Living in urban, rural and remote places
            id: geo-living-urban-rural-remote
            brief: Cities offer jobs and services but cost more, while rural and remote places offer space and community but have fewer services.

      - title: Planning sustainable cities
        id: nsw-geo-s5-3-3
        points:
          - title: Urban sprawl and urban consolidation
            id: geo-urban-sprawl-urban-consolidation
            brief: Urban sprawl spreads houses outward onto farmland and bush. Urban consolidation fits more homes into existing suburbs, such as apartments near transport.
          - title: Sustainable city strategies
            id: geo-sustainable-city-strategies
            brief: Cities can become more sustainable with public transport, cycleways, green space, tree cover, energy-efficient buildings and less waste.
          - title: Managing population growth in Sydney
            id: geo-managing-population-growth-sydney
            brief: Sydney manages growth with new suburbs in the west, higher density near train lines, and new transport such as the Metro, with different views from residents, councils and developers.
          - title: Planning with Country and diverse communities
            id: geo-planning-with-country-diverse
            brief: Planning for diverse communities includes Aboriginal knowledges of caring for Country, such as restoring waterways and native plants in new suburbs.

  - title: Environmental change and management
    chapters:
      - title: Environments and change
        id: nsw-geo-s5-4-1
        points:
          - title: The functions of environments
            id: geo-functions-environments
            brief: Environments provide resources, absorb and break down waste, and support life through services such as clean air, water and pollination.
          - title: Natural processes that change environments
            id: geo-natural-processes-that-change
            brief: Natural processes such as weather, erosion, fire, floods and plate movement change environments over time.
          - title: Human-induced environmental change
            id: geo-human-induced-environmental-change-nsw
            brief: People change environments through land clearing, pollution, introduced species, dams and burning fossil fuels that cause climate change.
          - title: Consequences of environmental change
            id: geo-consequences-environmental-change
            brief: Environmental change can cause loss of biodiversity and habitat, degraded soil and water, more extreme weather and harm to people's livelihoods.

      - title: Managing environmental change
        id: nsw-geo-s5-4-2
        points:
          - title: Perspectives on managing environments
            id: geo-perspectives-managing-environments
            brief: Governments, farmers, developers, scientists, environmental groups and Aboriginal communities can hold different views on how an environment should be used.
          - title: Aboriginal custodianship of Country
            id: geo-aboriginal-custodianship-country
            brief: Aboriginal custodianship sees people as responsible for caring for Country, through practices such as cultural burning and the work of Indigenous rangers.
          - title: Prevention, mitigation and preparedness
            id: geo-prevention-mitigation-preparedness-nsw
            brief: Prevention stops harm before it starts, mitigation reduces its effects, and preparedness gets people ready to respond when it happens.
          - title: Judging whether management is sustainable
            id: geo-judging-whether-management-sustainable
            brief: Management can be judged on whether it protects the environment, is fair to people and pays its way, now and for future generations.

      - title: "Case study: coastal environments"
        id: nsw-geo-s5-4-3
        points:
          - title: Coastal processes
            id: geo-coastal-processes
            brief: Waves, tides, currents and wind shape coasts, eroding headlands and moving sand along beaches and dunes.
          - title: Threats to coastal environments
            id: geo-threats-coastal-environments
            brief: Coasts are changed by building close to the shore, rising sea levels, storm erosion, pollution and loss of dune plants.
          - title: Managing coasts
            id: geo-managing-coasts
            brief: Coasts are managed with sea walls and groynes, adding sand to beaches, replanting dunes and planning rules that keep buildings back.
          - title: Comparing coasts in Australia and another country
            id: geo-comparing-coasts-australia-another
            brief: Coastal towns in Australia and low-lying countries such as Bangladesh face rising seas, but their wealth shapes how they can respond.

      - title: "Case study: inland water"
        id: nsw-geo-s5-4-4
        points:
          - title: Rivers and wetlands as environments
            id: geo-rivers-wetlands-as-environments
            brief: Rivers, lakes and wetlands store and filter water, support fish and birds, and are linked to the land around them through their catchments.
          - title: Changes to the Murray-Darling Basin
            id: geo-changes-murray-darling-basin
            brief: Dams, weirs and taking water for irrigation in the Murray-Darling Basin have reduced flows, causing salinity, algal blooms and fish deaths.
          - title: Managing inland water
            id: geo-managing-inland-water
            brief: The Murray-Darling Basin Plan sets limits on water taken and returns water to the environment, with irrigators, towns and First Nations groups holding different views.
          - title: Comparing inland water in Australia and another country
            id: geo-comparing-inland-water-australia
            brief: Rivers shared by several regions or countries, such as the Mekong, face the same competing uses as the Murray-Darling, managed in different ways.

  - title: Human wellbeing
    chapters:
      - title: Measuring wellbeing and development
        id: nsw-geo-s5-5-1
        points:
          - title: Human wellbeing
            id: geo-human-wellbeing
            brief: Human wellbeing is the quality of people's lives, including health, education, income, safety, freedom and a clean environment.
          - title: Human Development Index
            id: geo-human-development-index-nsw
            brief: The Human Development Index combines life expectancy, years of schooling and income per person to rank countries' development.
          - title: Other measures of wellbeing
            id: geo-other-measures-wellbeing
            brief: Wellbeing is also measured by GDP per person, infant mortality, literacy, access to clean water and how satisfied people say they are.
          - title: Global patterns of wellbeing
            id: geo-global-patterns-wellbeing
            brief: Wellbeing is highest in places such as Western Europe, North America and Australia, and lowest in parts of sub-Saharan Africa and South Asia.
          - title: Global challenges to wellbeing
            id: geo-global-challenges-wellbeing
            brief: Poverty, conflict, disease, climate change and unequal access to education and health care hold back wellbeing in many places.

      - title: Variations in wellbeing
        id: nsw-geo-s5-5-2
        points:
          - title: Variations within India
            id: geo-variations-within-india
            brief: In India, wellbeing varies between rich and poor states, cities and villages, and social groups, because of income, services and history.
          - title: Location and wellbeing in Australia
            id: geo-location-wellbeing-australia
            brief: In Australia, wellbeing tends to be lower in remote places, with fewer jobs, health services and schools than in the cities.
          - title: Factors behind variations in wellbeing
            id: geo-factors-behind-variations-wellbeing
            brief: Environmental, economic, social and technological factors, such as climate, jobs, education and internet access, explain why wellbeing varies.
          - title: Closing the Gap
            id: geo-closing-gap
            brief: Closing the Gap is an agreement between governments and Aboriginal and Torres Strait Islander organisations with targets for health, education and jobs.

      - title: Improving wellbeing
        id: nsw-geo-s5-5-3
        points:
          - title: Government initiatives
            id: geo-government-initiatives
            brief: Governments improve wellbeing through health care, schooling, welfare payments and building infrastructure such as water and roads.
          - title: Non-government organisations and aid
            id: geo-non-government-organisations-aid
            brief: Charities and aid groups, such as the Red Cross, and foreign aid from countries such as Australia fund projects in health, water and education.
          - title: Perspectives on wellbeing initiatives
            id: geo-perspectives-wellbeing-initiatives
            brief: People judge initiatives differently, such as whether aid reaches those in need and whether local people had a say in it.
          - title: Aboriginal Community Controlled Organisations
            id: geo-aboriginal-community-controlled-organisations
            brief: Aboriginal Community Controlled Organisations are run by local Aboriginal communities and deliver health and other services in culturally safe ways.
