# VCE Mathematical Methods, Units 3 and 4: functions, calculus, and probability and statistics, 36 points.
# Drafted from the VCAA's VCE Mathematics Study Design, accreditation period 2023 to 2027. Units 3 and 4 are taught as
# a sequence, so each unit here is an area of study and each chapter part of one. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths). Units 1 and 2 and NSW Mathematics Advanced (the mat bank) share
# much of this, so expect reuses and adapts.
# In transition: the accreditation ends 31 December 2027. Check for a new study design before running this for 2028.

id: vic-mat-meth-u34
subject: Mathematics
bank: mat
name: Mathematical Methods, Units 3 and 4
about: VCE, Functions, calculus and statistics
short: Mathematical Methods
years: [12]
level: Units 3 and 4
place: vic
kind: maths
syllabus: VCE Mathematics Study Design (2023 to 2027), Mathematical Methods Units 3 and 4
note: Follows the VCE Mathematics study design. Not made or endorsed by the VCAA.
chips: [composite function, chain rule, definite integral, binomial distribution, confidence interval]

units:
  - title: Functions, relations and graphs
    chapters:
      - title: Functions and transformations
        id: vic-mat-meth-u34-1-1
        points:
          - title: Composite functions
            id: mat-composite-functions
            brief: f(g(x)) applies g then f. It exists only when the range of g sits inside the domain of f.
          - title: Inverse functions in Unit 3
            id: mat-inverse-functions-unit-3
            brief: A one-to-one function has an inverse whose domain is the function's range. Restricting a domain can make a function one-to-one.
          - title: Sums and products of functions
            id: mat-sums-products-functions
            brief: f + g and f × g are defined on the domain shared by both, and their graphs can be sketched by adding or multiplying heights.
          - title: Transformations in mapping form
            id: mat-transformations-mapping-form
            brief: A rule such as (x, y) → (2x + 1, 3y) describes dilations, reflections and translations together.
          - title: Exponential and logarithmic graphs
            id: mat-exponential-logarithmic-graphs
            brief: y = e^x and y = log_e(x) are inverses. Transformations move their asymptotes and intercepts.
          - title: Circular function graphs
            id: mat-circular-function-graphs
            brief: y = a sin(n(x − b)) + c and its cosine and tangent forms have amplitude, period, phase and centre set by a, n, b and c.
          - title: Literal and parameter equations
            id: mat-literal-parameter-equations
            brief: Equations with a parameter, such as kx + 2 = 3, can have one, none or infinitely many solutions depending on k.

  - title: Calculus
    chapters:
      - title: Differentiation
        id: vic-mat-meth-u34-2-1
        points:
          - title: Derivatives of exponential, log and circular functions
            id: mat-derivatives-exponential-log-circular
            brief: The derivative of e^(kx) is k e^(kx), of log_e(x) is 1/x, of sin(kx) is k cos(kx) and of cos(kx) is −k sin(kx).
          - title: The chain rule
            id: mat-chain-rule-2
            brief: The derivative of f(g(x)) is f′(g(x)) × g′(x).
          - title: The product rule
            id: mat-product-rule-2
            brief: The derivative of u × v is u′v + uv′.
          - title: The quotient rule
            id: mat-quotient-rule-2
            brief: The derivative of u/v is (u′v − uv′)/v².
          - title: Stationary points and curve sketching
            id: mat-stationary-points-curve-sketching
            brief: Find where f′(x) = 0, decide their nature, and sketch with intercepts and end behaviour.
          - title: Optimisation
            id: mat-optimisation-2
            brief: Write the quantity as a function of one variable, find stationary points, and check the ends of the domain for the maximum or minimum.
          - title: Rates of change and related rates
            id: mat-rates-change-related-rates
            brief: The derivative gives an instantaneous rate, such as how fast a volume changes with time.
          - title: Newton's method
            id: mat-newton-s-method
            brief: An algorithm that improves a guess for a root using x(n+1) = x(n) − f(x(n))/f′(x(n)).

      - title: Integration
        id: vic-mat-meth-u34-2-2
        points:
          - title: Antiderivatives in Unit 3
            id: mat-antiderivatives-unit-3
            brief: Antiderivatives of x^n, e^(kx), 1/x, sin(kx) and cos(kx), each plus a constant.
          - title: Definite integrals
            id: mat-definite-integrals
            brief: The integral from a to b of f(x) is F(b) − F(a), where F is an antiderivative.
          - title: The fundamental theorem of calculus
            id: mat-fundamental-theorem-calculus
            brief: Integration and differentiation undo each other, which links the area under a curve to antiderivatives.
          - title: Area under and between curves
            id: mat-area-under-between-curves
            brief: Area is the integral of the top curve minus the bottom one, splitting where curves cross the axis or each other.
          - title: The trapezium rule
            id: mat-trapezium-rule
            brief: Approximating area with trapeziums of equal width, which improves as the width shrinks.
          - title: Average value of a function
            id: mat-average-value-function
            brief: The average value of f on [a, b] is the integral from a to b divided by b − a.

  - title: Algebra, number and structure
    chapters:
      - title: Solving equations
        id: vic-mat-meth-u34-3-1
        points:
          - title: Exponential and logarithmic equations
            id: mat-exponential-logarithmic-equations
            brief: Solve by writing both sides with the same base or by taking logarithms, checking the domain of any log.
          - title: Trigonometric equations in Unit 3
            id: mat-trigonometric-equations-unit-3
            brief: Find every solution in a domain using a reference angle, the quadrants and the period, including with transformations.
          - title: Bisection method
            id: mat-bisection-method
            brief: An algorithm that halves an interval known to contain a root, keeping the half where the sign changes.

  - title: Data analysis, probability and statistics
    chapters:
      - title: Discrete random variables
        id: vic-mat-meth-u34-4-1
        points:
          - title: Discrete probability distributions
            id: mat-discrete-probability-distributions-2
            brief: A table or rule giving the probability of each value of a random variable, with the probabilities adding to 1.
          - title: Expected value and variance
            id: mat-expected-value-variance
            brief: E(X) is the sum of x × Pr(X = x). Var(X) = E(X²) − (E(X))², and the standard deviation is its square root.
          - title: The binomial distribution
            id: mat-binomial-distribution
            brief: The number of successes in n independent trials with the same chance p, Pr(X = x) = nCx p^x (1 − p)^(n − x).
          - title: Mean and variance of a binomial
            id: mat-mean-variance-binomial
            brief: For a binomial, E(X) = np and Var(X) = np(1 − p).

      - title: Continuous random variables
        id: vic-mat-meth-u34-4-2
        points:
          - title: Probability density functions
            id: mat-probability-density-functions-2
            brief: A curve that is never negative with total area 1. Probabilities are areas under it.
          - title: Mean, median and variance of a continuous variable
            id: mat-mean-median-variance-continuous
            brief: The mean is the integral of x f(x). The median splits the area in half.
          - title: The normal distribution
            id: mat-normal-distribution-2
            brief: A symmetric bell curve set by its mean μ and standard deviation σ.
          - title: The standard normal distribution
            id: mat-standard-normal-distribution
            brief: Z = (X − μ)/σ turns any normal variable into one with mean 0 and standard deviation 1.

      - title: Sampling and confidence intervals
        id: vic-mat-meth-u34-4-3
        points:
          - title: Populations and samples
            id: mat-populations-samples
            brief: A sample statistic, such as a sample proportion, estimates a population parameter, and varies from sample to sample.
          - title: The sample proportion
            id: mat-sample-proportion
            brief: p-hat is the share of a sample with a trait. For large samples its distribution is roughly normal with mean p.
          - title: Approximate confidence intervals
            id: mat-approximate-confidence-intervals
            brief: A 95% confidence interval for p is p-hat ± 1.96 × √(p-hat(1 − p-hat)/n).
          - title: Interpreting a confidence interval
            id: mat-interpreting-confidence-interval
            brief: About 95% of intervals made this way would contain the true proportion. Larger samples give narrower intervals.
