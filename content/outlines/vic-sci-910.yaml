# Victorian Curriculum 2.0 Science, Levels 9 and 10: all three strands for the band, 63 points.
# Follows the VCAA's Victorian Curriculum F-10 Version 2.0, Science (published June 2024), checked on the VCAA's
# F-10 site (f10.vcaa.vic.edu.au) in November 2026. VC2.0 sets Science in two-level bands from Levels 3 to 10, so this
# is one outline for Levels 9 and 10. VC2.0 replaced Version 1.0 (taught from 2017): optional from 2025, and taught in
# full in Victorian government schools from 2026 (Catholic and independent schools set their own timelines). No newer
# version is announced.
# Structure: the Science Understanding strand's four sub-strands (biological, chemical, Earth and space, physical)
# are units 1 to 4, one chapter for each content description or two close ones. Science as a Human Endeavour and
# Science Inquiry are units 5 and 6, taught as the ideas behind the practical work, not the practical work itself.
# Codes are VC2.0 content description codes. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-sci-910
subject: Science
bank: sci
name: Science, Levels 9 and 10
about: Victorian Curriculum 2.0, Levels 9 and 10
short: Science
years: [9, 10]
level: Levels 9 and 10
place: vic
kind: standard
syllabus: "Victorian Curriculum F-10 Version 2.0: Science, Levels 9 and 10"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [genetics, natural selection, periodic table, climate change, big bang, Newton's laws]

units:
  - title: Biological sciences
    chapters:
      - title: Reproduction
        id: vic-sci-910-1-1
        points:
          - title: Sexual and asexual reproduction
            id: sci-sexual-asexual-reproduction-vic
            brief: Asexual reproduction makes identical offspring from one parent, quickly. Sexual reproduction joins cells from two parents, which makes varied offspring that help a species survive change.
            codes: [VC2S10U01]
          - title: Reproductive cells in animals
            id: sci-reproductive-cells-animals
            brief: Sperm cells are small and have a tail to swim, and egg cells are large with a food store. Fertilisation joins them, so each gives half the offspring's chromosomes.
            codes: [VC2S10U01]
          - title: Reproduction in flowering plants
            id: sci-reproduction-flowering-plants-vic
            brief: Anthers make pollen, which is carried by wind or animals to the stigma. Fertilisation in the ovary makes seeds, and the ovary becomes the fruit.
            codes: [VC2S10U01]

      - title: Control and coordination
        id: vic-sci-910-1-2
        points:
          - title: The nervous system
            id: sci-nervous-system-vic
            brief: The brain and spinal cord form the central nervous system. Neurons carry fast electrical messages between receptors, this system and the muscles or glands that respond.
            codes: [VC2S10U02]
          - title: Reflex actions
            id: sci-reflex-actions
            brief: A reflex is a fast, automatic response, such as pulling a hand off a hot stove, where the message passes through the spinal cord before the brain is aware of it.
            codes: [VC2S10U02]
          - title: The endocrine system and hormones
            id: sci-endocrine-system-hormones
            brief: Glands release hormones into the blood, which carry slower, longer-lasting messages to target organs, as adrenaline does in a fright.
            codes: [VC2S10U02]
          - title: Homeostasis and negative feedback
            id: sci-homeostasis-negative-feedback
            brief: Homeostasis keeps conditions inside the body steady. In negative feedback a change away from the set point triggers a response that brings it back, as sweating cools a hot body.
            codes: [VC2S10U02]
          - title: Controlling blood glucose
            id: sci-controlling-blood-glucose
            brief: When blood glucose rises the pancreas releases insulin, which lowers it, and when it falls the pancreas releases glucagon, which raises it.
            codes: [VC2S10U02]

      - title: Disease
        id: vic-sci-910-1-3
        points:
          - title: Infectious and non-infectious diseases
            id: sci-infectious-non-infectious-diseases-vic
            brief: Infectious diseases, such as influenza, are caused by pathogens and can spread between people. Non-infectious diseases, such as type 2 diabetes, come from genes, lifestyle or environment.
            codes: [VC2S10U03]
          - title: Types of pathogens
            id: sci-types-pathogens
            brief: Bacteria, viruses, fungi and parasites can all cause disease, and antibiotics work against bacteria but not viruses.
            codes: [VC2S10U03]
          - title: How infectious diseases spread
            id: sci-infectious-diseases-spread
            brief: Pathogens spread through the air, by touch, in food and water, or through animals such as mosquitoes, and knowing the route shows how to break it.
            codes: [VC2S10U03]
          - title: Controlling infectious diseases
            id: sci-controlling-infectious-diseases
            brief: Handwashing, quarantine, vaccination, medical treatment and public education campaigns each cut the spread of a disease in a different way.
            codes: [VC2S10U03]

      - title: Genetics
        id: vic-sci-910-1-4
        points:
          - title: DNA, genes and chromosomes
            id: sci-dna-genes-chromosomes-vic
            brief: DNA is a double helix that carries the instructions for building an organism. A gene is a section of DNA, and DNA is coiled into chromosomes in the nucleus.
            codes: [VC2S10U04]
          - title: Mitosis and meiosis
            id: sci-mitosis-meiosis-vic
            brief: Mitosis makes two identical body cells for growth and repair. Meiosis makes four sex cells, each with half the chromosomes and a new mix of them.
            codes: [VC2S10U04]
          - title: Alleles, genotype and phenotype
            id: sci-alleles-genotype-phenotype-vic
            brief: Alleles are different versions of a gene. A genotype is the pair an organism has, such as Bb, and the phenotype is the trait that shows, where a dominant allele masks a recessive one.
            codes: [VC2S10U04]
          - title: Punnett squares
            id: sci-punnett-squares-vic
            brief: A Punnett square crosses each parent's alleles to predict the ratio of genotypes and phenotypes in the offspring, such as 3 to 1 from two Bb parents.
            codes: [VC2S10U04]

      - title: Evolution
        id: vic-sci-910-1-5
        points:
          - title: Natural selection
            id: sci-natural-selection-vic
            brief: Members of a species vary, and those with features better suited to their environment survive and breed more, so those features become more common over generations.
            codes: [VC2S10U05]
          - title: Isolation and new species
            id: sci-isolation-new-species
            brief: When groups of a species are cut off from each other, they change separately over time until they can no longer breed together and form new species.
            codes: [VC2S10U05]
          - title: Fossil evidence for evolution
            id: sci-fossil-evidence-evolution
            brief: Fossils in older rock layers are simpler and those in younger layers more like living species, which shows how life has changed over millions of years.
            codes: [VC2S10U05]
          - title: Biogeography and embryology as evidence
            id: sci-biogeography-embryology-as-evidence
            brief: Related species found in nearby places, such as Australia's marsupials, and the similar early embryos of very different vertebrates, show that organisms share common ancestors.
            codes: [VC2S10U05]

  - title: Chemical sciences
    chapters:
      - title: Atoms and the periodic table
        id: vic-sci-910-2-1
        points:
          - title: Models of the atom over time
            id: sci-models-atom-over-time
            brief: The model of the atom changed as scientists found electrons, then a dense nucleus with protons, then neutrons, moving from Dalton's solid ball to a nucleus with electrons in shells.
            codes: [VC2S10U06, VC2S10H01]
          - title: Protons, neutrons and electrons
            id: sci-protons-neutrons-electrons-vic
            brief: The atomic number is the number of protons, and the mass number is protons plus neutrons. A neutral atom has as many electrons as protons.
            codes: [VC2S10U06]
          - title: Isotopes and radioactive decay
            id: sci-isotopes-radioactive-decay
            brief: Isotopes of an element have different numbers of neutrons. An unstable nucleus decays by giving off alpha, beta or gamma radiation, and half-life is the time for half of it to decay.
            codes: [VC2S10U06]
          - title: Groups and periods
            id: sci-groups-periods-vic
            brief: The periodic table is ordered by atomic number. Elements in a group (column) have the same number of outer electrons and react alike, and a period (row) shows a new electron shell.
            codes: [VC2S10U07]
          - title: Trends in the periodic table
            id: sci-trends-periodic-table
            brief: Metals sit on the left and non-metals on the right. Atoms get smaller across a period and larger down a group, and reactivity rises down group 1.
            codes: [VC2S10U07]

      - title: Chemical reactions
        id: vic-sci-910-2-2
        points:
          - title: Conservation of mass
            id: sci-conservation-mass-vic
            brief: In a chemical reaction atoms are rearranged, not made or destroyed, so the total mass of the products equals the total mass of the reactants.
            codes: [VC2S10U08]
          - title: Word and balanced equations
            id: sci-word-balanced-equations
            brief: A word equation names the reactants and products. A balanced equation uses formulas and numbers in front of them so each kind of atom is the same on both sides.
            codes: [VC2S10U08]
          - title: Synthesis, decomposition and displacement
            id: sci-synthesis-decomposition-displacement
            brief: In synthesis substances join into one, in decomposition one breaks into several, and in displacement a more reactive element takes the place of a less reactive one.
            codes: [VC2S10U09]
          - title: Exothermic and endothermic reactions
            id: sci-exothermic-endothermic-reactions-vic
            brief: Exothermic reactions, such as burning, release energy and warm the surroundings. Endothermic reactions, such as in a cold pack, take in energy and cool them.
            codes: [VC2S10U09]
          - title: Rates of reaction
            id: sci-rates-reaction-vic
            brief: Raising the temperature, the concentration or the surface area of a solid, or adding a catalyst, makes particles collide more often or more effectively, so a reaction speeds up.
            codes: [VC2S10U09]

  - title: Earth and space sciences
    chapters:
      - title: The carbon cycle and climate change
        id: vic-sci-910-3-1
        points:
          - title: Earth's four spheres
            id: sci-earth-s-four-spheres-vic
            brief: The atmosphere, biosphere, hydrosphere and lithosphere are linked systems, so a change in one, such as more carbon in the air, affects the others.
            codes: [VC2S10U10]
          - title: The carbon cycle
            id: sci-carbon-cycle
            brief: Photosynthesis takes carbon dioxide out of the air, while respiration, fire, volcanoes, weathering and burning fossil fuels move carbon between the spheres.
            codes: [VC2S10U10]
          - title: The greenhouse effect
            id: sci-greenhouse-effect-vic
            brief: Greenhouse gases such as carbon dioxide and methane absorb heat radiated from Earth's surface and keep the planet warm enough for life.
            codes: [VC2S10U11]
          - title: Human-induced climate change
            id: sci-human-induced-climate-change
            brief: Extra greenhouse gases from burning fossil fuels, clearing forests and farming trap more heat, which is warming the planet and changing the climate.
            codes: [VC2S10U11]
          - title: Reducing climate change
            id: sci-reducing-climate-change
            brief: Cutting emissions means changing how power is generated and how we farm, build, make goods and travel, and keeping forests standing.
            codes: [VC2S10U11]

      - title: The universe and space exploration
        id: vic-sci-910-3-2
        points:
          - title: Galaxies, stars and black holes
            id: sci-galaxies-stars-black-holes
            brief: The universe holds billions of galaxies, each with billions of stars. A black hole is a region where gravity is so strong that not even light escapes, and distances are measured in light-years.
            codes: [VC2S10U13]
          - title: The big bang theory
            id: sci-big-bang-theory-vic
            brief: The big bang theory says the universe began about 13.8 billion years ago in a hot, dense state and has been expanding and cooling ever since.
            codes: [VC2S10U13]
          - title: Evidence for the big bang
            id: sci-evidence-big-bang
            brief: Light from distant galaxies is stretched towards red, showing they are moving away, and faint microwave radiation left over from the early universe fills all of space.
            codes: [VC2S10U13]
          - title: Exploring space
            id: sci-exploring-space
            brief: Telescopes, probes and crewed missions study the origins and structure of the universe, and space research has given everyday technology such as better solar cells.
            codes: [VC2S10U12]
          - title: Living away from Earth
            id: sci-living-away-from-earth
            brief: People in space face weightlessness, radiation and the need to carry or recycle air, water and food, and solving these problems is part of space science.
            codes: [VC2S10U12]

  - title: Physical sciences
    chapters:
      - title: Waves and energy transfer
        id: vic-sci-910-4-1
        points:
          - title: Heat transfer with particles and waves
            id: sci-heat-transfer-with-particles
            brief: The particle model explains conduction and convection through matter, and the wave model explains how radiation carries heat through empty space.
            codes: [VC2S10U14]
          - title: Mechanical and electromagnetic waves
            id: sci-mechanical-electromagnetic-waves-vic
            brief: Mechanical waves, such as sound, need a medium to travel through. Electromagnetic waves, such as light, can travel through a vacuum.
            codes: [VC2S10U14]
          - title: Amplitude, wavelength and frequency
            id: sci-amplitude-wavelength-frequency
            brief: Amplitude is a wave's height from rest, wavelength is the distance between peaks and frequency is waves per second. Wave speed is frequency times wavelength.
            codes: [VC2S10U14]
          - title: The electromagnetic spectrum
            id: sci-electromagnetic-spectrum-vic
            brief: Radio waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays differ in wavelength, and each has its own uses and dangers.
            codes: [VC2S10U14]

      - title: Energy and electricity generation
        id: vic-sci-910-4-2
        points:
          - title: Conservation of energy
            id: sci-conservation-energy-vic
            brief: Energy cannot be made or destroyed, only transferred or transformed, so in any system the energy out, useful and wasted, equals the energy in.
            codes: [VC2S10U15]
          - title: Efficiency and Sankey diagrams
            id: sci-efficiency-sankey-diagrams-vic
            brief: A Sankey diagram shows energy in, useful energy out and energy wasted as arrows of different widths, and efficiency is the useful share given as a percentage.
            codes: [VC2S10U15]
          - title: Generating alternating current
            id: sci-generating-alternating-current
            brief: Turning a magnet inside a coil of wire, or a coil near a magnet, makes an alternating current. Power stations do this with turbines.
            codes: [VC2S10U16]
          - title: Turning the turbines
            id: sci-turning-turbines
            brief: Turbines can be turned by wind, water, tides, or steam from burning coal, oil or gas or from nuclear fission, and each source has its own costs and emissions.
            codes: [VC2S10U16]
          - title: Direct current from cells and batteries
            id: sci-direct-current-from-cells
            brief: Solar cells turn light straight into direct current, and batteries supply direct current from chemical energy, with no turbine or magnet.
            codes: [VC2S10U16]

      - title: Newton's laws of motion
        id: vic-sci-910-4-3
        points:
          - title: Speed and acceleration
            id: sci-speed-acceleration
            brief: Speed is distance divided by time. Acceleration is the change in velocity divided by the time taken, measured in metres per second squared.
            codes: [VC2S10U17]
          - title: Newton's first law
            id: sci-newton-s-first-law-vic
            brief: An object stays still or keeps moving at a steady speed in a straight line unless an unbalanced force acts on it, which is why seatbelts are needed.
            codes: [VC2S10U17]
          - title: Newton's second law
            id: sci-newton-s-second-law-vic
            brief: Force equals mass times acceleration, so a larger force gives a bigger acceleration and a larger mass gives a smaller one.
            codes: [VC2S10U17]
          - title: Newton's third law
            id: sci-newton-s-third-law-vic
            brief: When one object pushes on another, the second pushes back with an equal force in the opposite direction, as a rocket pushes gas down and the gas pushes it up.
            codes: [VC2S10U17]

  - title: Science as a human endeavour
    chapters:
      - title: How science is tested and used
        id: vic-sci-910-5-1
        points:
          - title: Peer review and replication
            id: sci-peer-review-replication
            brief: New findings are checked by other scientists before publication and repeated by other teams, and ideas become accepted when the evidence builds a consensus.
            codes: [VC2S10H01]
          - title: Science and technology drive each other
            id: sci-science-technology-drive-each
            brief: New technology lets scientists see more, as better telescopes did, and new science leads to new technology and engineering, as the study of electricity did.
            codes: [VC2S10H02]
          - title: Science for a sustainable future
            id: sci-science-sustainable-future
            brief: Science can offer responses to issues such as climate change, but whether society takes them up depends on their costs, effects and who gains or loses.
            codes: [VC2S10H03]
          - title: How society shapes and reads science
            id: sci-society-shapes-reads-science
            brief: People and groups can read the same evidence differently or share only the data that suits them, and society's values and needs affect which research gets funded.
            codes: [VC2S10H04]

  - title: Science inquiry
    chapters:
      - title: Designing and evaluating investigations
        id: vic-sci-910-6-1
        points:
          - title: Hypotheses and models
            id: sci-hypotheses-models
            brief: A hypothesis can be used to test a scientific model, and the results either support the model or show where it needs to change.
            codes: [VC2S10I01]
          - title: Validity, sampling and bias
            id: sci-validity-sampling-bias
            brief: A valid investigation tests what it means to test by controlling variables, using a large enough sample and avoiding bias in how samples and observations are chosen.
            codes: [VC2S10I02, VC2S10I03]
          - title: Accuracy, precision and reproducibility
            id: sci-accuracy-precision-reproducibility
            brief: Accurate results are close to the true value, precise results are close to each other, and reproducible results come out the same when others repeat the method.
            codes: [VC2S10I03, VC2S10I06]
          - title: Mean, median and range
            id: sci-mean-median-range-vic
            brief: The mean is the total divided by the number of results, the median is the middle value and the range is the highest minus the lowest, which shows how spread out data is.
            codes: [VC2S10I04, VC2S10I05]
          - title: Random and systematic errors
            id: sci-random-systematic-errors-vic
            brief: Random errors scatter results either side of the true value and are reduced by repeats. Systematic errors shift every result the same way, as an unzeroed scale does.
            codes: [VC2S10I06]
          - title: Building a scientific argument
            id: sci-building-scientific-argument
            brief: A strong argument states a claim, backs it with evidence from several sources, explains the reasoning and deals with evidence that points the other way.
            codes: [VC2S10I07, VC2S10I08]
