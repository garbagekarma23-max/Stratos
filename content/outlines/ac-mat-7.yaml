# Australian Curriculum Mathematics, Year 7: the Number, Algebra, Measurement, Space, Statistics and Probability
# strands, 42 points.
# Follows ACARA's Australian Curriculum: Mathematics, Version 9.0, Year 7, checked on the official site
# (australiancurriculum.edu.au) in November 2026. Ministers approved Version 9.0 in April 2022 and ACARA published it in
# May 2022. Each state sets its own start: the ACT from 2024, Tasmania from 2023, the NT from 2025, WA (its own Western
# Australian Curriculum, adapted from it) from 2026, Queensland by the end of 2026, and South Australia's public schools
# (their own adapted version) by about 2027. ACARA has announced no new version for Years 7 to 10: the next full
# version is scheduled for approval in 2032 (an iterative review covers Foundation to Year 2 mathematics only).
# Each strand is a unit, and its content descriptions are grouped into chapters in the curriculum's order. The codes
# are ACARA's content description codes. Modelling content descriptions (AC9M7N09, AC9M7M06) are taught through the
# methods they use, such as discounts and dividing in a ratio. Digital tools and investigations are left out, except
# for the ideas behind them.
# Cards and multiple choice for now (kind: maths). Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-mat-7
subject: Mathematics
bank: mat
name: Mathematics, Year 7
about: Australian Curriculum, Year 7
short: Mathematics
years: [7]
place: [qld, sa, wa, tas, act, nt]
kind: maths
syllabus: "Australian Curriculum: Mathematics, Version 9.0, Year 7"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [prime factors, fractions, integers, ratio, area, mean]

units:
  - title: Number
    chapters:
      - title: Squares, primes and powers
        id: ac-mat-7-1-1
        points:
          - title: Square numbers and square roots
            id: mat-square-numbers-square-roots
            codes: [AC9M7N01]
            brief: A square number is a number times itself, such as 7² = 49, and the square root undoes it, so √49 = 7. A root that is not whole lies between two whole numbers, so √43 is between 6 and 7.
          - title: Prime factorisation with index notation
            id: mat-prime-factorisation-with-index
            codes: [AC9M7N02]
            brief: Any whole number above 1 can be written as a product of primes using a factor tree, then in index form, such as 72 = 2³ × 3².
          - title: Expanded notation with powers of 10
            id: mat-expanded-notation-with-powers
            codes: [AC9M7N03]
            brief: Place value can be written with powers of 10, such as 4305 = 4 × 10³ + 3 × 10² + 5 × 10⁰.

      - title: Fractions, decimals and percentages
        id: ac-mat-7-1-2
        points:
          - title: Equivalent fractions and simplest form
            id: mat-equivalent-fractions-simplest-form
            codes: [AC9M7N04]
            brief: Multiplying or dividing the top and bottom of a fraction by the same number gives an equivalent fraction, and dividing by the highest common factor gives simplest form.
          - title: Converting fractions, decimals and percentages
            id: mat-converting-fractions-decimals-percentages
            codes: [AC9M7N04]
            brief: Switching between forms, such as 3/4 = 0.75 = 75%, and placing fractions, including negative ones, on a number line.
          - title: Rounding decimals
            id: mat-rounding-decimals
            codes: [AC9M7N05]
            brief: Rounding a decimal to a given number of places by looking at the next digit, and estimating to check an answer is reasonable.
          - title: Adding and subtracting fractions
            id: mat-adding-subtracting-fractions
            codes: [AC9M7N06]
            brief: Fractions with different denominators are added or subtracted by first rewriting them over a common denominator, including mixed numbers.
          - title: Multiplying and dividing fractions
            id: mat-multiplying-dividing-fractions
            codes: [AC9M7N06]
            brief: Multiply fractions by multiplying tops and bottoms, and divide by multiplying by the reciprocal of the second fraction.
          - title: Percentage of a quantity
            id: mat-percentage-quantity
            codes: [AC9M7N06]
            brief: Finding a percentage of an amount by turning the percentage into a fraction or decimal and multiplying, such as 15% of $80 = $12.

      - title: Integers, ratios and money
        id: ac-mat-7-1-3
        points:
          - title: Ordering integers on a number line
            id: mat-ordering-integers-number-line
            codes: [AC9M7N07]
            brief: Integers are whole numbers that can be negative, zero or positive, and numbers further right on the number line are larger, so −2 > −5.
          - title: Adding and subtracting integers
            id: mat-adding-subtracting-integers
            codes: [AC9M7N07]
            brief: Adding a negative is the same as subtracting, and subtracting a negative is the same as adding, so 3 − (−4) = 7.
          - title: Simplifying ratios
            id: mat-simplifying-ratios
            codes: [AC9M7N08]
            brief: A ratio compares quantities in the same units and is simplified by dividing each part by their highest common factor, so 12 to 18 is 2 to 3.
          - title: Dividing a quantity in a ratio
            id: mat-dividing-quantity-ratio
            codes: [AC9M7N08, AC9M7M06]
            brief: To share an amount in a ratio, add the parts, find one part, then multiply, so $60 shared 2 to 3 gives $24 and $36.
          - title: Discounts and price increases
            id: mat-discounts-price-increases
            codes: [AC9M7N09]
            brief: Finding a sale price after a percentage discount, or a new price after a percentage increase, such as adding 10% GST.

  - title: Algebra
    chapters:
      - title: Variables, expressions and formulas
        id: ac-mat-7-2-1
        points:
          - title: Writing algebraic expressions
            id: mat-writing-algebraic-expressions
            codes: [AC9M7A02]
            brief: Turning words into algebra with variables, numbers and brackets, writing 3n for 3 × n, such as 5 more than double a number as 2n + 5.
          - title: Substituting into formulas
            id: mat-substituting-into-formulas-2
            codes: [AC9M7A01, AC9M7A06]
            brief: Replacing each variable in a formula with its value and following the order of operations, such as finding P = 2l + 2w when l = 5 and w = 3.
          - title: Tables of values from a rule
            id: mat-tables-values-from-rule
            codes: [AC9M7A05]
            brief: A rule such as y = 2x + 1, or a growing pattern of shapes, makes a table of values by putting in each x.

      - title: Equations, patterns and graphs
        id: ac-mat-7-2-2
        points:
          - title: Solving one-step equations
            id: mat-solving-one-step-equations
            codes: [AC9M7A03]
            brief: Solve an equation by doing the inverse operation to both sides, so x + 7 = 12 gives x = 5 and 4x = 28 gives x = 7.
          - title: Solving two-step equations
            id: mat-solving-two-step-equations
            codes: [AC9M7A03]
            brief: Undo the operations in reverse order, adding or subtracting first, then dividing, so 3x + 5 = 20 gives x = 5. Check by substituting back.
          - title: Plotting points on the Cartesian plane
            id: mat-plotting-points-cartesian-plane
            codes: [AC9M7A05]
            brief: Points are plotted as (x, y), across then up or down, in all four quadrants, and points from a rule can show a straight-line pattern.
          - title: Reading graphs of real data
            id: mat-reading-graphs-real-data-2
            codes: [AC9M7A04]
            brief: Reading a graph of real data, such as temperature over a day, to describe how one variable changes as the other changes.

  - title: Measurement
    chapters:
      - title: Area, volume and circles
        id: ac-mat-7-3-1
        points:
          - title: Area of triangles and parallelograms
            id: mat-area-triangles-parallelograms
            codes: [AC9M7M01]
            brief: A parallelogram's area is base times perpendicular height, and a triangle's is half of base times perpendicular height.
          - title: Volume of rectangular and triangular prisms
            id: mat-volume-rectangular-triangular-prisms
            codes: [AC9M7M02]
            brief: The volume of a right prism is the area of its cross-section times its length, so a rectangular prism is length times width times height, in cubic units such as cm³.
          - title: Radius, diameter, circumference and pi
            id: mat-radius-diameter-circumference-pi
            codes: [AC9M7M03]
            brief: The diameter is twice the radius, and for every circle the circumference divided by the diameter is the same number, pi, about 3.14.

      - title: Angles
        id: ac-mat-7-3-2
        points:
          - title: Corresponding and alternate angles
            id: mat-corresponding-alternate-angles
            codes: [AC9M7M04]
            brief: When a transversal crosses parallel lines, corresponding angles (an F shape) are equal and alternate angles (a Z shape) are equal.
          - title: Co-interior angles
            id: mat-co-interior-angles
            codes: [AC9M7M04]
            brief: When a transversal crosses parallel lines, co-interior angles (a C shape) add to 180°, and they show whether lines are parallel.
          - title: Angle sum of a triangle
            id: mat-angle-sum-triangle
            codes: [AC9M7M05]
            brief: The angles inside a triangle add to 180°, so the third angle is 180° minus the other two.
          - title: Angle sum of polygons
            id: mat-angle-sum-polygons
            codes: [AC9M7M05]
            brief: A polygon splits into triangles from one vertex, so a quadrilateral's angles add to 360° and an n-sided polygon's to (n − 2) × 180°.

  - title: Space
    chapters:
      - title: Shapes, objects and transformations
        id: ac-mat-7-4-1
        points:
          - title: Classifying triangles
            id: mat-classifying-triangles
            codes: [AC9M7SP02]
            brief: Triangles are named by their sides, as equilateral, isosceles or scalene, and by their angles, as acute, right or obtuse.
          - title: Classifying quadrilaterals
            id: mat-classifying-quadrilaterals
            codes: [AC9M7SP02]
            brief: Squares, rectangles, rhombuses, parallelograms, trapeziums and kites are told apart by their parallel sides, equal sides, angles and diagonals.
          - title: Nets and views of objects
            id: mat-nets-views-objects
            codes: [AC9M7SP01]
            brief: A three-dimensional object can be drawn in two dimensions as a net, as front, side and top views, or in perspective, and each shows different things.
          - title: Translations and reflections
            id: mat-translations-reflections
            codes: [AC9M7SP03]
            brief: A translation slides each point, such as 3 right and 2 down, and a reflection in the x-axis changes (x, y) to (x, −y).
          - title: Rotations about a point
            id: mat-rotations-about-point
            codes: [AC9M7SP03]
            brief: A rotation turns a shape through an angle about a fixed point, such as 90° clockwise about the origin.
          - title: Algorithms that sort shapes
            id: mat-algorithms-that-sort-shapes
            codes: [AC9M7SP04]
            brief: An algorithm is a set of steps and yes or no decisions, such as a flowchart asking whether a shape has 4 sides, that sorts shapes into groups.

  - title: Statistics
    chapters:
      - title: Data and summary statistics
        id: ac-mat-7-5-1
        points:
          - title: Discrete and continuous data
            id: mat-discrete-continuous-data
            codes: [AC9M7ST01]
            brief: Discrete numerical data is counted, such as the number of pets, and continuous data is measured, such as height.
          - title: Mean, median, mode and range
            id: mat-mean-median-mode-range
            codes: [AC9M7ST01]
            brief: The mean is the total divided by the count, the median is the middle value in order, the mode is the most common, and the range is highest minus lowest.
          - title: Choosing a measure of centre
            id: mat-choosing-measure-centre
            codes: [AC9M7ST01, AC9M7ST03]
            brief: An outlier pulls the mean towards it, so the median often describes the centre better when data has extreme values.
          - title: Stem-and-leaf plots
            id: mat-stem-leaf-plots
            codes: [AC9M7ST02]
            brief: A stem-and-leaf plot splits each value into a stem and a leaf, keeping every value while showing the shape of the data.
          - title: Shape of a distribution
            id: mat-shape-distribution-2
            codes: [AC9M7ST02]
            brief: A distribution can be symmetric or skewed, and can have clusters, gaps and outliers, which a display makes easy to see.

  - title: Probability
    chapters:
      - title: Chance and experiments
        id: ac-mat-7-6-1
        points:
          - title: Sample spaces and probability
            id: mat-sample-spaces-probability-2
            codes: [AC9M7P01]
            brief: The sample space lists every possible outcome, such as 1 to 6 for a die. With equally likely outcomes, the probability of an event is the number of favourable outcomes divided by the total, from 0 to 1.
          - title: Expected and relative frequency
            id: mat-expected-relative-frequency
            codes: [AC9M7P01, AC9M7P02]
            brief: Relative frequency is how often an event happened in trials divided by the number of trials, and expected frequency is probability times the number of trials.
          - title: Experiments and theory
            id: mat-experiments-theory
            codes: [AC9M7P02]
            brief: Results of a chance experiment vary, but with many trials the relative frequency gets closer to the theoretical probability.
