# VCE Legal Studies, Units 1 and 2: guilt and liability, and wrongs and rights, 44 points.
# Drafted from the VCAA's VCE Legal Studies Study Design, accredited from 2024. The structure follows the study design:
# each unit is a unit here, and each area of study is a chapter. Schools pick the offences, civil laws and rights they
# study; the chapters here use common ones. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Courts, bodies and laws here are Victorian or Commonwealth. A NSW point the matcher finds needs adapting for
# Victoria's courts and laws.

id: vic-leg-u12
subject: Legal Studies
bank: leg
name: Legal Studies, Units 1 and 2
about: VCE, Guilt, liability and rights
short: Legal Studies
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Legal Studies Study Design (from 2024), Units 1 and 2
note: Follows the VCE Legal Studies study design. Not made or endorsed by the VCAA.
