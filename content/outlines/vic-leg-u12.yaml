# VCE Legal Studies, Units 1 and 2: guilt and liability, and wrongs and rights, 59 points.
# Checked against the VCAA's VCE Legal Studies Study Design, accredited from 2024, in October 2026. Each unit is a
# unit here, and each area of study is a chapter, or two when it is large. Schools pick the offences, civil laws and
# human rights issue they study; the chapters here use common ones. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Courts, bodies and laws here are Victorian or Commonwealth. A NSW point the matcher finds needs adapting for
# Victoria's courts and laws.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-leg-u12
subject: Legal Studies
bank: leg
name: Legal Studies, Units 1 and 2
about: VCE, Guilt, liability and rights
short: Legal Studies
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Legal Studies Study Design (from 2024), Units 1 and 2
note: Follows the VCE Legal Studies study design. Not made or endorsed by the VCAA.
chips: [presumption of innocence, actus reus, negligence, damages, Charter of Human Rights]

units:
  - title: "Unit 1: The presumption of innocence"
    chapters:
      - title: Legal foundations
        id: vic-leg-u12-1-1
        points:
          - title: Laws and social cohesion
            id: leg-role-laws
            brief: Individuals, laws and the legal system work together to keep society stable and protect each person's rights.
          - title: Principles of justice
            id: leg-principles-justice
            brief: Justice rests on fairness (fair processes), equality (the same treatment, or different treatment where needed) and access (understanding the system and using it).
          - title: Characteristics of an effective law
            id: leg-characteristics-effective-law
            brief: An effective law reflects society's values, is enforceable, is known, is clear and is stable.
          - title: Parliament and the courts
            id: leg-parliament-courts
            brief: Parliament makes most laws. Courts apply them and make law through precedent and statutory interpretation.
          - title: Sources of law
            id: leg-sources-law
            brief: Law comes from parliament (statute law) and from judges' decisions in cases (common law).
          - title: The Victorian court hierarchy
            id: leg-victorian-court-hierarchy
            brief: Courts are ranked from the Magistrates' Court through the County Court to the Supreme Court, so cases go to courts suited to them and decisions can be appealed.
          - title: Criminal and civil law
            id: leg-criminal-civil-law-2
            brief: Criminal law deals with offences against society, brought by the state. Civil law deals with disputes between people. One act, such as an assault, can lead to both.

      - title: Criminal law concepts
        id: vic-leg-u12-1-2
        points:
          - title: Purposes of criminal law
            id: leg-purposes-criminal-law
            brief: Criminal law protects people and property, sets standards of behaviour and allows punishment of those who break them.
          - title: The presumption of innocence
            id: leg-presumption-innocence
            brief: An accused person is treated as innocent until proven guilty, and has the right to silence.
          - title: Burden and standard of proof in criminal cases
            id: leg-burden-standard-proof-criminal
            brief: The prosecution must prove the accused guilty beyond reasonable doubt.
          - title: Elements of a crime
            id: leg-elements-crime
            brief: Most crimes need a guilty act (actus reus) and a guilty mind (mens rea), proven together.
          - title: Strict liability offences
            id: leg-strict-liability-offences
            brief: Offences such as many traffic offences need only the act proven, with no need to show intent.
          - title: Age of criminal responsibility
            id: leg-age-criminal-responsibility-2
            brief: Below a set age a child cannot be charged with a crime. Above it, up to 14, the prosecution must show the child knew it was seriously wrong.

      - title: Crimes and defences
        id: vic-leg-u12-1-3-2
        points:
          - title: Summary and indictable offences
            id: leg-summary-indictable-offences-2
            brief: Summary offences are minor and heard in the Magistrates' Court. Indictable offences are serious and can be tried before a judge and jury.
          - title: Participants in a crime
            id: leg-participants-crime
            brief: Principal offenders commit the crime. Accessories help them after it, and people can also be charged for helping before or during it.
          - title: An offence against the person
            id: leg-offence-against-person
            brief: Offences such as assault and homicide harm a person's body or life, and each has elements the prosecution must prove.
          - title: An offence against property
            id: leg-offence-against-property
            brief: Offences such as theft and burglary take or damage property, and each has elements the prosecution must prove.
          - title: Defences
            id: leg-defences
            brief: A defence such as self-defence or duress, if accepted, can mean the accused is not guilty or is guilty of a lesser offence.
          - title: Trends and impact of an offence
            id: leg-trends-impact-offence
            brief: Crime statistics show how often an offence happens in Victoria and elsewhere, and its harm reaches victims, families and the wider community.

      - title: The criminal justice system
        id: vic-leg-u12-1-4
        points:
          - title: Police and enforcement bodies
            id: leg-police-enforcement-bodies
            brief: Victoria Police and bodies given powers by law, such as transport officers, investigate and enforce criminal law.
          - title: Police powers and individual rights
            id: leg-police-powers-individual-rights
            brief: Powers to arrest, search and question are balanced by rights such as the right to silence and to a lawyer.
          - title: Courts in criminal cases
            id: leg-courts-criminal-cases
            brief: The Magistrates' Court hears summary offences, the County Court most indictable ones, and the Supreme Court the most serious, such as murder.
          - title: The jury in a criminal trial
            id: leg-jury-criminal-trial
            brief: Twelve people from the community decide the facts and whether the accused is guilty beyond reasonable doubt.
          - title: Groups facing difficulties
            id: leg-groups-facing-difficulties
            brief: First Nations people, young people, people from other cultures and languages, and people with mental illness or disability can face extra barriers in the criminal system.

      - title: Sentencing
        id: vic-leg-u12-1-3
        points:
          - title: Purposes of sanctions
            id: leg-purposes-sanctions
            brief: Sanctions aim to punish, deter the offender and others, denounce the crime, protect the community and rehabilitate the offender.
          - title: Fines
            id: leg-fines
            brief: A sum of money paid to the state, set by the offence and the offender's ability to pay.
          - title: Community correction orders
            id: leg-community-correction-orders
            brief: A sanction served in the community, with conditions such as unpaid work, treatment or supervision.
          - title: Imprisonment
            id: leg-imprisonment
            brief: The most serious sanction, used as a last resort, which removes the offender from the community.
          - title: Factors in sentencing
            id: leg-factors-sentencing
            brief: Judges weigh aggravating factors, such as violence, and mitigating factors, such as a guilty plea or remorse.
          - title: Alternative approaches to sentencing
            id: leg-alternative-approaches-sentencing
            brief: The Drug Court, the Koori Court and diversion programs try to deal with the causes of offending and reduce reoffending.
          - title: Sentencing in another state
            id: leg-sentencing-another-state
            brief: Comparing how another Australian jurisdiction sentences offenders shows other ways to meet the same purposes.

  - title: "Unit 2: Wrongs and rights"
    chapters:
      - title: Civil law concepts
        id: vic-leg-u12-2-1
        points:
          - title: Purposes of civil law
            id: leg-purposes-civil-law
            brief: Civil law protects rights and lets a wronged party be put back where they were. Its areas include negligence, defamation, contract and nuisance.
          - title: Breach, causation and loss
            id: leg-breach-causation-loss
            brief: A civil claim needs a breach of the law, proof that the breach caused the harm, and a loss such as injury, damage or lost income.
          - title: Burden and standard of proof in civil cases
            id: leg-burden-standard-proof-civil
            brief: The plaintiff must prove their case on the balance of probabilities.
          - title: Parties to a civil dispute
            id: leg-parties-civil-dispute
            brief: The plaintiff brings the claim and the defendant answers it. A group of plaintiffs can bring a class action.
          - title: Limitation of actions
            id: leg-limitation-actions
            brief: A civil claim must be brought within a set time, such as six years for many claims, or it can be lost.

      - title: Two areas of civil law
        id: vic-leg-u12-2-2-2
        points:
          - title: Negligence
            id: leg-negligence
            brief: A defendant is liable in negligence if they owed a duty of care, breached it, and caused harm that was not too remote.
          - title: Defences to negligence
            id: leg-defences-negligence
            brief: Contributory negligence reduces damages. Voluntary assumption of risk can defeat the claim.
          - title: Defamation
            id: leg-defamation
            brief: Publishing something that harms a person's reputation can be defamation. Defences include truth and honest opinion, and damages are the usual remedy.
          - title: The impact of a civil wrong
            id: leg-impact-civil-wrong
            brief: A breach can cost the injured party money, health and reputation, and can cost the defendant money and standing too.

      - title: Resolving civil disputes
        id: vic-leg-u12-2-3-2
        points:
          - title: Justice in civil disputes
            id: leg-justice-civil-disputes
            brief: "Fairness, equality and access apply to civil disputes too: a fair process, equal treatment and the ability to use the system."
          - title: Ways of settling civil disputes
            id: leg-ways-settling-civil-disputes
            brief: Negotiation, mediation, conciliation and arbitration settle disputes without a full trial.
          - title: Bodies that settle disputes
            id: leg-bodies-that-settle-disputes
            brief: Tribunals such as VCAT, ombudsmen and complaints bodies such as Consumer Affairs Victoria settle many disputes without a court.
          - title: Courts in civil disputes
            id: leg-courts-civil-disputes
            brief: The Magistrates' Court hears smaller claims, the County Court larger ones, and the Supreme Court the largest and most complex.
          - title: The jury in a civil trial
            id: leg-jury-civil-trial
            brief: In some civil trials, six jurors decide the facts, whether the defendant is liable and sometimes the damages.
          - title: Groups facing difficulties in civil justice
            id: leg-groups-facing-difficulties-civil
            brief: First Nations people, people on low incomes, young people and people in rural and remote areas can find civil justice hard to reach.

      - title: Remedies
        id: vic-leg-u12-2-2
        points:
          - title: Purposes of remedies
            id: leg-purposes-remedies
            brief: A remedy aims to restore the plaintiff to their position before the wrong, or stop the wrong continuing.
          - title: Compensatory damages
            id: leg-compensatory-damages
            brief: Money to make up for loss, covering financial losses and pain and suffering.
          - title: Other kinds of damages
            id: leg-other-kinds-damages
            brief: Nominal damages recognise a wrong with a small sum, contemptuous damages show the court thought little of the claim, and exemplary damages punish.
          - title: Injunctions
            id: leg-injunctions
            brief: A court order to stop doing something (restrictive) or to do something (mandatory).

      - title: Human rights
        id: vic-leg-u12-2-3
        points:
          - title: What human rights are
            id: leg-human-rights-are-2
            brief: Basic rights and freedoms every person has, which grew out of history and were set out in 1948 in the Universal Declaration of Human Rights.
          - title: Rights in the Constitution
            id: leg-rights-constitution
            brief: The Australian Constitution protects a few rights expressly, such as freedom of religion, and the High Court has found implied rights, such as political communication.
          - title: Rights in statute and common law
            id: leg-rights-statute-common-law
            brief: Parliaments protect rights through laws such as anti-discrimination acts, and courts protect them through common law.
          - title: The Victorian Charter of Human Rights and Responsibilities
            id: leg-victorian-charter-human-rights
            brief: A Victorian statute that lists rights, requires laws to be read consistently with them, and requires public authorities to consider them.
          - title: International treaties and Australia
            id: leg-australia-international-rights
            brief: Australia has signed human rights treaties, but they bind locally only when parliament makes them part of Australian law.

      - title: A human rights issue
        id: vic-leg-u12-2-6
        points:
          - title: Studying a human rights issue
            id: leg-studying-human-rights-issue
            brief: Students study one right in Australia, how it developed and which laws protect it, such as freedom of expression or the right to vote.
          - title: Conflicting attitudes to a right
            id: leg-conflicting-attitudes-right
            brief: People and groups often disagree on how far a right should go and how it should be balanced against others.
          - title: Reforming rights protection
            id: leg-reforming-rights-protection
            brief: Changes to protect a right better can come through new laws, a charter of rights or the courts.
          - title: People who changed rights
            id: leg-people-who-changed-rights
            brief: Individuals and groups have pushed governments and courts to protect rights better, through cases, campaigns and protest.
