# Victorian Curriculum English, Level 7 (Year 7): language, literature and literacy, 38 points.
# Follows the Victorian Curriculum F-10 Version 2.0: English, Level 7, checked on the VCAA's Version 2.0 website
# (f10.vcaa.vic.edu.au) in November 2026. VC2.0 English was published in December 2023, with familiarisation in 2024
# and implementation from 2025. It replaced English in the Victorian Curriculum F-10 Version 1.0 (taught from 2017).
# No newer version is announced; the Version 1.0 website closes on 31 December 2026.
# VC2.0 sets English by single levels, in three strands (Language, Literature, Literacy), each with sub-strands. Each
# strand is a unit here, and each chapter is one sub-strand, two small ones together, or part of a large one. Creating
# texts and speaking are covered only as the ideas behind them (purpose, audience, editing, features of voice).
# No set texts are named, since schools choose their own, and nothing is quoted from any text. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-eng-7
subject: English
bank: eng
name: English, Year 7
about: Victorian Curriculum 2.0, Level 7
short: English
years: [7]
place: vic
kind: english
syllabus: "Victorian Curriculum F-10 Version 2.0: English, Level 7"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [complex sentence, colon, camera angle, plot, simile, prefix]

units:
  - title: Language
    chapters:
      - title: Language, identity and opinion
        id: vic-eng-7-1-1
        points:
          - title: Language and identity
            id: eng-language-identity-vic
            brief: The words, slang, accent and level of formality people use show who they are and which groups they belong to.
            codes: [VC2E7LA01]
          - title: Evaluative language
            id: eng-evaluative-language-vic
            brief: Words that judge, such as brilliant, careless or unfair, show a writer's opinion, and some judge more strongly than others.
            codes: [VC2E7LA02]
          - title: Backing up an opinion
            id: eng-backing-up-opinion
            brief: An opinion is more convincing when it is supported with reasons, examples and evidence, rather than stated on its own.
            codes: [VC2E7LA02]

      - title: Text structure and cohesion
        id: vic-eng-7-1-2
        points:
          - title: How purpose shapes structure
            id: eng-purpose-shapes-structure
            brief: A narrative, an information report, a persuasive text and a procedure are each organised differently because they do different jobs.
            codes: [VC2E7LA03]
          - title: Language features change with purpose
            id: eng-language-features-change-with
            brief: A report uses technical words and facts, a persuasive text uses emotive words and opinions, and a story uses description and dialogue.
            codes: [VC2E7LA03]
          - title: Overviews, topic sentences and conclusions
            id: eng-overviews-topic-sentences-conclusions
            brief: An overview tells the reader what is coming, a topic sentence states what a paragraph is about, and a conclusion draws the ideas together.
            codes: [VC2E7LA04]

      - title: Sentences, tense and punctuation
        id: vic-eng-7-1-3
        points:
          - title: Compound and complex sentences
            id: eng-compound-complex-sentences-vic
            brief: A compound sentence joins two main clauses with a word such as and or but. A complex sentence adds a dependent clause beginning with a word such as because or although.
            codes: [VC2E7LA05]
          - title: Compound-complex sentences
            id: eng-compound-complex-sentences-2
            brief: A sentence with two or more main clauses and at least one dependent clause, used to link and explain several ideas at once.
            codes: [VC2E7LA05]
          - title: Keeping tense consistent
            id: eng-keeping-tense-consistent-vic
            brief: Staying in the past or the present tense throughout a piece, and only changing tense when the time really changes, keeps writing clear.
            codes: [VC2E7LA06]
          - title: Colons and brackets
            id: eng-colons-brackets
            brief: A colon introduces a list, an example or an explanation. Brackets add extra information the sentence would still make sense without.
            codes: [VC2E7LA09]

      - title: Words and images
        id: vic-eng-7-1-4
        points:
          - title: Everyday and technical meanings
            id: eng-everyday-technical-meanings
            brief: Some words mean one thing in everyday talk and another in a subject, such as cell, volume or table, and context shows which is meant.
            codes: [VC2E7LA08]
          - title: Camera shots and angles
            id: eng-camera-shots-angles
            brief: Close-ups show emotion, long shots show setting, a low angle makes someone look powerful and a high angle makes them look small.
            codes: [VC2E7LA07]
          - title: Sound in film
            id: eng-sound-film
            brief: Music, sound effects and silence shape how a scene feels, such as tense music building suspense before anything happens.
            codes: [VC2E7LA07]

  - title: Literature
    chapters:
      - title: Literature and its contexts
        id: vic-eng-7-2-1
        points:
          - title: The context of a text
            id: eng-context-text-2
            brief: When and where a text was written, and the culture and society around its author, shape its ideas, characters and events.
            codes: [VC2E7LE01]
          - title: Aboriginal and Torres Strait Islander literature
            id: eng-aboriginal-torres-strait-islander
            brief: Stories, poems and memoirs by Aboriginal and Torres Strait Islander authors often draw on connection to Country, family, language and long traditions of storytelling.
            codes: [VC2E7LE01]
          - title: Narrative point of view
            id: eng-narrative-point-view
            brief: A first-person narrator tells the story as I, a third-person narrator as he, she or they, and the choice changes what the reader knows.
            codes: [VC2E7LE01]
          - title: Forming an opinion about a text
            id: eng-forming-opinion-about-text
            brief: A good opinion about a character or event names a clear view, gives reasons from the text, and allows that others may read it differently.
            codes: [VC2E7LE02]

      - title: Character, setting and plot
        id: vic-eng-7-2-2
        points:
          - title: Showing character
            id: eng-showing-character
            brief: Writers reveal character directly by describing it, or indirectly through actions, dialogue, thoughts and how others react.
            codes: [VC2E7LE03, VC2E7LE04]
          - title: Setting and mood
            id: eng-setting-mood
            brief: Where and when a story happens creates a mood, such as a storm adding fear, and can reflect what characters feel.
            codes: [VC2E7LE04]
          - title: Plot structure
            id: eng-plot-structure
            brief: Most stories move through an orientation, a complication, rising action, a climax and a resolution.
            codes: [VC2E7LE04]
          - title: Types of conflict
            id: eng-types-conflict
            brief: Conflict drives a story, whether a character struggles against another person, against nature, against society or within themselves.
            codes: [VC2E7LE04]

      - title: Poetry and figurative language
        id: vic-eng-7-2-3
        points:
          - title: Simile, metaphor and personification
            id: eng-simile-metaphor-personification-vic
            brief: A simile compares using like or as, a metaphor says one thing is another, and personification gives human qualities to something that is not human.
            codes: [VC2E7LE05, VC2E7LE06]
          - title: Sound devices in poetry
            id: eng-sound-devices-poetry-vic
            brief: Alliteration repeats first sounds, assonance repeats vowel sounds, and onomatopoeia uses words that sound like what they name.
            codes: [VC2E7LE05]
          - title: Rhyme and rhythm
            id: eng-rhyme-rhythm
            brief: Rhyme links line endings, and rhythm is the beat made by stressed and unstressed syllables, which together give a poem its sound.
            codes: [VC2E7LE05]
          - title: Lines, stanzas and free verse
            id: eng-lines-stanzas-free-verse
            brief: Poems are arranged in lines and stanzas, and free verse drops a regular rhyme and rhythm so line breaks do more of the work.
            codes: [VC2E7LE05]

  - title: Literacy
    chapters:
      - title: Speaking and texts today
        id: vic-eng-7-3-1
        points:
          - title: Features of voice
            id: eng-features-voice
            brief: Pace, volume, pitch, pauses and emphasis change how a spoken message comes across to listeners.
            codes: [VC2E7LY02]
          - title: Formal spoken presentations
            id: eng-formal-spoken-presentations
            brief: A formal presentation uses a clear opening, organised points and a conclusion, with formal words suited to the audience.
            codes: [VC2E7LY02, VC2E7LY01]
          - title: How technology changes reading
            id: eng-technology-changes-reading-vic
            brief: Online texts mix words, images, video and links, are often read by scrolling and skimming, and can be shared and answered at once.
            codes: [VC2E7LY04]

      - title: Word knowledge
        id: vic-eng-7-3-2
        points:
          - title: Prefixes and suffixes
            id: eng-prefixes-suffixes
            brief: A prefix such as un- or re- changes a word's meaning, and a suffix such as -ful or -ness can change what kind of word it is.
            codes: [VC2E7LY03]
          - title: Greek and Latin roots
            id: eng-greek-latin-roots-vic
            brief: Many English words are built on Greek and Latin roots, such as graph (write) and port (carry), which help with meaning and spelling.
            codes: [VC2E7LY03]
          - title: Spelling rules for adding endings
            id: eng-spelling-rules-adding-endings
            brief: Common patterns such as doubling the last consonant (run, running), dropping a silent e (make, making) and changing y to i (happy, happiness).
            codes: [VC2E7LY03]

      - title: Reading closely
        id: vic-eng-7-3-3
        points:
          - title: Audience and purpose
            id: eng-audience-purpose
            brief: Writers choose words, tone and detail to suit who will read the text and what it is meant to do, such as inform, persuade or entertain.
            codes: [VC2E7LY05]
          - title: Ways of organising ideas
            id: eng-ways-organising-ideas
            brief: Texts can be organised in time order, as causes and effects, or by sorting things into groups and types.
            codes: [VC2E7LY06]
          - title: Making inferences
            id: eng-making-inferences-vic
            brief: An inference is a conclusion drawn from clues in the text and what the reader already knows, about something the text does not say outright.
            codes: [VC2E7LY07]
          - title: Summarising
            id: eng-summarising-vic
            brief: A summary gives only the main ideas of a text in your own words, much shorter than the original and without small details.
            codes: [VC2E7LY07]

      - title: Planning and editing texts
        id: vic-eng-7-3-4
        points:
          - title: Choosing a text type
            id: eng-choosing-text-type
            brief: Matching the form of a text, such as a letter, report, speech or story, to its purpose and audience.
            codes: [VC2E7LY08]
          - title: Multimodal texts
            id: eng-multimodal-texts-vic
            brief: A multimodal text combines two or more modes, such as words, images, sound and movement, which work together to make meaning.
            codes: [VC2E7LY08]
          - title: Editing for impact
            id: eng-editing-impact
            brief: Editing removes repetition, reorders sentences for flow and swaps weak words for precise ones, so the writing has more effect.
            codes: [VC2E7LY09]
