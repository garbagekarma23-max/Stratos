# VCE Physics, Units 3 and 4: fields, motion and electricity, and how ideas about light and matter changed, 39 points.
# Drafted from the VCAA's VCE Physics Study Design, Units 3 and 4 from 2024. The structure follows the study design:
# each unit is a unit here, and each area of study is a chapter. The practical investigation is school-run, so it is
# not here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# NSW Physics Year 12 (the phys bank) covers much of this, so expect reuses and adapts.
# The study design's end date was not confirmed when this was drafted (a school guide gives 2027). Check it first.

