# Victorian Curriculum 2.0 Science, Levels 7 and 8: all three strands for the band, 72 points.
# Follows the VCAA's Victorian Curriculum F-10 Version 2.0, Science (published June 2024), checked on the VCAA's
# F-10 site (f10.vcaa.vic.edu.au) in November 2026. VC2.0 sets Science in two-level bands from Levels 3 to 10, so this
# is one outline for Levels 7 and 8. VC2.0 replaced Version 1.0 (taught from 2017): optional from 2025, and taught in
# full in Victorian government schools from 2026 (Catholic and independent schools set their own timelines). No newer
# version is announced.
# Structure: the Science Understanding strand's four sub-strands (biological, chemical, Earth and space, physical)
# are units 1 to 4, one chapter for each content description or two close ones. Science as a Human Endeavour and
# Science Inquiry are units 5 and 6, taught as the ideas behind the practical work (what a fair test is, how to
# read a graph), not the practical work itself. Codes are VC2.0 content description codes. Every brief is in our
# own words.
# The usual name for the branching identification tool is on Stratos's banned word list, so it is called a
# dichotomous chart here.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-sci-78
subject: Science
bank: sci
name: Science, Levels 7 and 8
about: Victorian Curriculum 2.0, Levels 7 and 8
short: Science
years: [7, 8]
level: Levels 7 and 8
place: vic
kind: standard
syllabus: "Victorian Curriculum F-10 Version 2.0: Science, Levels 7 and 8"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [cells, particle model, plate tectonics, food webs, simple machines, circuits]

units:
  - title: Biological sciences
    chapters:
      - title: Classifying living things
        id: vic-sci-78-1-1
        points:
          - title: Why scientists classify
            id: sci-scientists-classify
            brief: Scientists sort living things into groups by shared features, from kingdom down to species, so the huge variety of life is easier to study and talk about.
            codes: [VC2S8U01]
          - title: Scientific names
            id: sci-scientific-names-vic
            brief: Each species has a two-part Latin name, its genus then its species, such as Phascolarctos cinereus for the koala, so scientists everywhere know exactly which organism is meant.
            codes: [VC2S8U01]
          - title: The vertebrate groups
            id: sci-vertebrate-groups
            brief: Animals with a backbone are vertebrates. Fish, amphibians, reptiles, birds and mammals are told apart by features such as body covering, breathing and how young are born.
            codes: [VC2S8U01]
          - title: Using a dichotomous chart
            id: sci-using-dichotomous-chart-vic
            brief: A dichotomous chart asks a series of two-way questions about features, and following the answers step by step leads to the name of an organism.
            codes: [VC2S8U01]

      - title: Cells
        id: vic-sci-78-1-2
        points:
          - title: Cell theory
            id: sci-cell-theory
            brief: All living things are made of cells, the cell is the smallest unit of life, and new cells come only from cells that already exist. Some organisms are one cell, others many.
            codes: [VC2S8U02]
          - title: Using a light microscope
            id: sci-using-light-microscope-vic
            brief: How to focus a light microscope and work out total magnification by multiplying the eyepiece lens by the objective lens.
            codes: [VC2S8U02, VC2S8I03]
          - title: Organelles and their jobs
            id: sci-organelles-their-jobs
            brief: Inside a cell, the nucleus holds DNA, the membrane controls what goes in and out, mitochondria release energy, ribosomes make proteins and cytoplasm holds it all.
            codes: [VC2S8U02]
          - title: Plant and animal cells compared
            id: sci-plant-animal-cells-compared
            brief: Plant cells have a cell wall, chloroplasts for photosynthesis and a large vacuole, which animal cells lack. Both have a nucleus, membrane, cytoplasm and mitochondria.
            codes: [VC2S8U02]

      - title: Systems in plants and animals
        id: vic-sci-78-1-3
        points:
          - title: From cells to organ systems
            id: sci-from-cells-organ-systems-vic
            brief: Specialised cells group into tissues, tissues into organs and organs into systems, and each cell's shape suits its job, as with nerve cells and root hair cells.
            codes: [VC2S8U03]
          - title: The digestive system
            id: sci-digestive-system-vic
            brief: The mouth, stomach, small intestine and large intestine break food down and absorb it, and the shape of each part suits what it does.
            codes: [VC2S8U03]
          - title: Transport in plants
            id: sci-transport-plants
            brief: Xylem carries water and minerals up from the roots, and phloem carries sugars made in the leaves to the rest of the plant.
            codes: [VC2S8U03]
          - title: Gas exchange in leaves and lungs
            id: sci-gas-exchange-leaves-lungs
            brief: Leaves take in carbon dioxide through stomata, and lungs take in oxygen through thin air sacs called alveoli. Both have a large, thin surface for gases to cross.
            codes: [VC2S8U03]

      - title: Ecosystems
        id: vic-sci-78-1-4
        points:
          - title: Biotic and abiotic factors
            id: sci-biotic-abiotic-factors-vic
            brief: The living parts of an ecosystem, such as plants, animals and fungi, are biotic. The non-living parts, such as water, light and temperature, are abiotic.
            codes: [VC2S8U04]
          - title: Food chains and food webs
            id: sci-food-chains-food-webs-vic
            brief: Producers make food from sunlight, consumers eat other organisms and decomposers break down dead matter. A food web links many food chains in one ecosystem.
            codes: [VC2S8U04]
          - title: Energy pyramids
            id: sci-energy-pyramids
            brief: Only about a tenth of the energy at one feeding level passes to the next, so an energy pyramid narrows towards the top and food chains are short.
            codes: [VC2S8U04]
          - title: Changes to populations
            id: sci-changes-populations
            brief: Habitat loss, climate change, seasonal migration and adding or removing a species, such as cane toads or foxes in Australia, change the size of populations in a food web.
            codes: [VC2S8U04]

  - title: Chemical sciences
    chapters:
      - title: The particle model
        id: vic-sci-78-2-1
        points:
          - title: Particles in solids, liquids and gases
            id: sci-particles-solids-liquids-gases
            brief: All matter is made of tiny moving particles that attract each other. How closely they pack and how freely they move explains why solids keep their shape and gases can be squashed.
            codes: [VC2S8U05]
          - title: Changes of state
            id: sci-changes-state-vic
            brief: Heating gives particles more energy, so substances melt, boil or sublime, and cooling reverses this. Each pure substance has its own melting and boiling point.
            codes: [VC2S8U05]
          - title: Diffusion, gas pressure and expansion
            id: sci-diffusion-gas-pressure-expansion
            brief: Moving particles spread out by diffusion, push on container walls to make gas pressure, and move further apart when heated, so most substances expand.
            codes: [VC2S8U05]
          - title: Density
            id: sci-density-vic
            brief: Density is mass divided by volume. Particles packed closely make a substance dense, and a less dense object floats on a denser liquid.
            codes: [VC2S8U05]

      - title: Mixtures and separating them
        id: vic-sci-78-2-2
        points:
          - title: Pure substances and mixtures
            id: sci-pure-substances-mixtures-vic
            brief: A pure substance has one kind of particle, while a mixture has two or more not joined together. A solution is a mixture with a solute dissolved evenly in a solvent.
            codes: [VC2S8U06]
          - title: Filtration, decantation and magnets
            id: sci-filtration-decantation-magnets
            brief: Filtration catches undissolved solids in filter paper, decantation pours a liquid off a settled solid, and a magnet pulls iron out of a mixture.
            codes: [VC2S8U06]
          - title: Evaporation, crystallisation and distillation
            id: sci-evaporation-crystallisation-distillation
            brief: Evaporating a solution leaves the dissolved solid behind, slow evaporation grows crystals, and distillation boils a liquid off and cools it back into a pure liquid.
            codes: [VC2S8U06]
          - title: Chromatography
            id: sci-chromatography-vic
            brief: Chromatography separates dissolved substances, such as the dyes in ink, because each one travels a different distance up the paper with the solvent.
            codes: [VC2S8U06]

      - title: Elements, compounds and chemical change
        id: vic-sci-78-2-3
        points:
          - title: Atoms and elements
            id: sci-atoms-elements-vic
            brief: An element is made of only one kind of atom and has a symbol, such as O for oxygen and Fe for iron. All known elements are set out in the periodic table.
            codes: [VC2S8U07]
          - title: Molecules and compounds
            id: sci-molecules-compounds-vic
            brief: A molecule is two or more atoms joined together. A compound has atoms of different elements joined in a fixed ratio and is not the same as a mixture.
            codes: [VC2S8U07]
          - title: Reading chemical formulas
            id: sci-reading-chemical-formulas-vic
            brief: A formula shows which atoms are in a substance and how many of each, so H2O has two hydrogen atoms and one oxygen atom.
            codes: [VC2S8U07]
          - title: Physical and chemical changes
            id: sci-physical-chemical-changes
            brief: A physical change, such as melting, makes no new substance and is often easy to reverse. A chemical change makes a new substance by rearranging atoms.
            codes: [VC2S8U08]
          - title: Signs of a chemical change
            id: sci-signs-chemical-change
            brief: A colour change, a temperature change, a gas given off or a solid precipitate forming in a liquid all suggest a new substance has formed.
            codes: [VC2S8U08]
          - title: Testing for gases
            id: sci-testing-gases
            brief: Oxygen relights a glowing splint, carbon dioxide turns limewater milky, and hydrogen burns with a squeaky pop.
            codes: [VC2S8U08]

  - title: Earth and space sciences
    chapters:
      - title: Earth's resources
        id: vic-sci-78-3-1
        points:
          - title: Renewable and non-renewable resources
            id: sci-renewable-non-renewable-resources
            brief: Renewable resources, such as sunlight, wind and timber, can be replaced in a human lifetime. Non-renewable ones, such as coal, oil and metal ores, cannot.
            codes: [VC2S8U09]
          - title: Extracting resources
            id: sci-extracting-resources
            brief: Mining and drilling bring jobs, energy and materials, but can damage land, water and habitats, so their benefits are weighed against their risks.
            codes: [VC2S8U09]
          - title: Producing energy sustainably
            id: sci-producing-energy-sustainably
            brief: Burning fossil fuels releases carbon dioxide and uses up limited stores, while solar, wind and hydro power cut emissions but depend on weather and place.
            codes: [VC2S8U09]

      - title: Plate tectonics
        id: vic-sci-78-3-2
        points:
          - title: Earth's layers and moving plates
            id: sci-earth-s-layers-moving
            brief: Earth has a crust, mantle, outer core and inner core. The crust and upper mantle are broken into plates that move slowly as hot mantle rock circulates beneath them.
            codes: [VC2S8U10]
          - title: Divergent and convergent boundaries
            id: sci-divergent-convergent-boundaries
            brief: Where plates move apart, new crust forms, as at mid-ocean ridges. Where they push together, one may sink beneath the other or they crumple into mountains.
            codes: [VC2S8U10]
          - title: Transform boundaries and earthquakes
            id: sci-transform-boundaries-earthquakes
            brief: Where plates slide past each other, stress builds up and is released suddenly as an earthquake, as along the San Andreas Fault.
            codes: [VC2S8U10]
          - title: Evidence for plate tectonics
            id: sci-evidence-plate-tectonics-vic
            brief: Matching coastlines, the same fossils on distant continents and young rock beside mid-ocean ridges convinced scientists to replace continental drift with plate tectonics.
            codes: [VC2S8U10, VC2S8H01]

      - title: Rocks and the rock cycle
        id: vic-sci-78-3-3
        points:
          - title: Igneous rocks
            id: sci-igneous-rocks-vic
            brief: Igneous rocks form when molten rock cools. Fast cooling at the surface gives small crystals, as in basalt, and slow cooling underground gives large ones, as in granite.
            codes: [VC2S8U11]
          - title: Sedimentary rocks
            id: sci-sedimentary-rocks-vic
            brief: Sedimentary rocks form when layers of sediment are pressed and cemented together over long periods, and they may hold fossils, as sandstone and limestone can.
            codes: [VC2S8U11]
          - title: Metamorphic rocks
            id: sci-metamorphic-rocks-vic
            brief: Heat and pressure deep underground change existing rock into metamorphic rock without melting it, so limestone becomes marble and shale becomes slate.
            codes: [VC2S8U11]
          - title: The rock cycle
            id: sci-rock-cycle-vic
            brief: Weathering, erosion, burial, heat and melting turn rocks from one type into another. Some steps take seconds, as in an eruption, and others millions of years.
            codes: [VC2S8U11]
          - title: Using rocks
            id: sci-using-rocks
            brief: A rock's hardness, strength and look come from how it formed, which decides what it is used for, such as granite for benches, and how it is mined.
            codes: [VC2S8U11]

      - title: Earth, Sun and Moon
        id: vic-sci-78-3-4
        points:
          - title: Seasons
            id: sci-seasons
            brief: Earth's axis is tilted, so as Earth orbits the Sun each hemisphere in turn leans towards it and gets more direct sunlight and longer days, which makes summer.
            codes: [VC2S8U12]
          - title: Phases of the Moon
            id: sci-phases-moon-vic
            brief: The Moon reflects sunlight, and as it orbits Earth about every 29.5 days we see different amounts of its lit half, from new moon to full moon and back.
            codes: [VC2S8U12]
          - title: Solar and lunar eclipses
            id: sci-solar-lunar-eclipses-vic
            brief: A solar eclipse happens when the Moon passes between the Sun and Earth. A lunar eclipse happens when Earth's shadow falls on the Moon.
            codes: [VC2S8U12]
          - title: Tides
            id: sci-tides-vic
            brief: The Moon's gravity, helped by the Sun's, pulls the oceans into bulges, so most coasts get two high tides and two low tides each day.
            codes: [VC2S8U12]

  - title: Physical sciences
    chapters:
      - title: Simple machines
        id: vic-sci-78-4-1
        points:
          - title: What simple machines do
            id: sci-simple-machines-do
            brief: A simple machine changes the size or direction of a force. Using less force means moving it over a longer distance, and mechanical advantage is load divided by effort.
            codes: [VC2S8U13]
          - title: Levers
            id: sci-levers
            brief: A lever turns about a fulcrum. The three classes depend on where the fulcrum, the effort and the load sit, as in a seesaw, a wheelbarrow and tweezers.
            codes: [VC2S8U13]
          - title: Inclined planes, wedges and screws
            id: sci-inclined-planes-wedges-screws
            brief: A ramp lets a load be raised with less force over a longer path. A wedge is two ramps back to back, and a screw is a ramp wrapped around a rod.
            codes: [VC2S8U13]
          - title: Pulleys and the wheel and axle
            id: sci-pulleys-wheel-axle
            brief: A single fixed pulley changes a force's direction, and more pulleys reduce the force needed. A wheel and axle, such as a doorknob, turns a small force into a larger one.
            codes: [VC2S8U13]

      - title: Forces and motion
        id: vic-sci-78-4-2
        points:
          - title: Contact and non-contact forces
            id: sci-contact-non-contact-forces-vic
            brief: A force is a push or pull measured in newtons. Friction needs touching surfaces, while gravity, magnetic and electrostatic forces act at a distance.
            codes: [VC2S8U14]
          - title: Force diagrams
            id: sci-force-diagrams
            brief: Arrows on a force diagram show each force's direction, and their lengths show its size, so the diagram shows the overall force on an object.
            codes: [VC2S8U14]
          - title: Balanced and unbalanced forces
            id: sci-balanced-unbalanced-forces-vic
            brief: Balanced forces leave an object still or moving at a steady speed. An unbalanced force makes it speed up, slow down or change direction, and the more mass it has, the bigger the force needed.
            codes: [VC2S8U14]
          - title: Mass and weight
            id: sci-mass-weight-vic
            brief: Mass is the amount of matter in an object, in kilograms. Weight is the pull of gravity on it, in newtons, about 9.8 times its mass on Earth.
            codes: [VC2S8U14]

      - title: Energy
        id: vic-sci-78-4-3
        points:
          - title: Kinetic and potential energy
            id: sci-kinetic-potential-energy-vic
            brief: Kinetic energy is energy of movement. Potential energy is stored, as gravitational energy in a raised object, elastic energy in a stretched spring and chemical energy in food.
            codes: [VC2S8U15]
          - title: Energy transformations
            id: sci-energy-transformations-vic
            brief: Energy changes from one form to another, as when a torch turns chemical energy into light and thermal energy. Energy is not made or destroyed.
            codes: [VC2S8U15]
          - title: Conduction, convection and radiation
            id: sci-conduction-convection-radiation
            brief: Heat moves through solids by conduction, through liquids and gases in currents by convection, and across empty space by radiation.
            codes: [VC2S8U15]
          - title: Energy efficiency
            id: sci-energy-efficiency-vic
            brief: Efficiency is useful energy out divided by total energy in. The rest is wasted, often as heat or sound, so an LED light is more efficient than an old globe.
            codes: [VC2S8U15]

      - title: Electricity and energy at home
        id: vic-sci-78-4-4
        points:
          - title: Household energy audits
            id: sci-household-energy-audits
            brief: An energy audit lists each appliance's power and hours of use to find where a home uses most energy, measured in kilowatt-hours.
            codes: [VC2S8U16]
          - title: Saving energy at home
            id: sci-saving-energy-at-home
            brief: Choosing efficient appliances and using insulation, shading and window placement cuts the energy a home uses, and what helps most depends on season and climate.
            codes: [VC2S8U16]
          - title: Current and voltage
            id: sci-current-voltage
            brief: In a closed circuit, current is the flow of charge, measured in amperes, and voltage is the push from the battery, measured in volts. Circuits are drawn with standard symbols.
            codes: [VC2S8U17]
          - title: Series and parallel circuits
            id: sci-series-parallel-circuits-vic
            brief: In a series circuit the parts share one path, so one broken globe stops them all. In a parallel circuit each part has its own path and keeps working.
            codes: [VC2S8U17]

  - title: Science as a human endeavour
    chapters:
      - title: Science and society
        id: vic-sci-78-5-1
        points:
          - title: Science changes with new evidence
            id: sci-science-changes-with-new
            brief: Scientific ideas, including models and theories, are revised when new evidence turns up or old evidence is read in a new way.
            codes: [VC2S8H01]
          - title: Different perspectives in science
            id: sci-different-perspectives-science
            brief: Teams that bring together different skills and worldviews, including Aboriginal and Torres Strait Islander knowledge such as seasonal calendars, can see problems more fully.
            codes: [VC2S8H02]
          - title: Socio-scientific issues
            id: sci-socio-scientific-issues
            brief: A science-based response to an issue, such as a biological control for a pest, has ethical, environmental, social and economic effects that people weigh differently.
            codes: [VC2S8H03]
          - title: Communicating science to the public
            id: sci-communicating-science-public
            brief: How science is reported shapes what people believe and the rules communities make, so checking the source and evidence behind a claim matters.
            codes: [VC2S8H04]

  - title: Science inquiry
    chapters:
      - title: Investigating scientifically
        id: vic-sci-78-6-1
        points:
          - title: Questions, predictions and hypotheses
            id: sci-questions-predictions-hypotheses-vic
            brief: An investigable question can be tested. A hypothesis is a testable explanation, and a prediction says what will happen if the hypothesis is right.
            codes: [VC2S8I01]
          - title: Variables and fair tests
            id: sci-variables-fair-tests-vic
            brief: In a fair test only the independent variable is changed, the dependent variable is measured, and every other variable is kept the same.
            codes: [VC2S8I02]
          - title: Safety, precision and repeat trials
            id: sci-safety-precision-repeat-trials
            brief: Managing risks keeps an investigation safe, choosing the right equipment makes measurements precise, and repeating trials shows whether results can be reproduced.
            codes: [VC2S8I02, VC2S8I03]
          - title: Tables and graphs
            id: sci-tables-graphs-vic
            brief: Results go in a table with units in the headings. A line graph suits two measured quantities, and a column graph suits categories.
            codes: [VC2S8I04]
          - title: Trends and anomalies
            id: sci-trends-anomalies
            brief: A trend is the overall pattern in data. An anomaly is a result that does not fit it, and it should be checked rather than simply ignored.
            codes: [VC2S8I05]
          - title: Judging conclusions and claims
            id: sci-judging-conclusions-claims
            brief: A good conclusion answers the question using the evidence, and a claim is judged by its assumptions, possible errors and any evidence against it.
            codes: [VC2S8I06, VC2S8I07, VC2S8I08]
