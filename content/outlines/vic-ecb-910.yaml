# Victorian Curriculum Economics and Business, Levels 9 and 10: the economy and policy, global trade, competitive
# business, managing people, and risk, reward and superannuation, 54 points.
# Follows the Victorian Curriculum F-10 Version 2.0, Economics and Business, Levels 9 and 10 (VCAA), checked on the
# VCAA's F-10 website in November 2026. Version 2.0 was published in June 2024 and replaces Version 1.0 (2016). Schools
# could use it from 2025, and Victorian government schools must teach it from 2026 (Catholic and independent schools
# set their own timing). The Version 1.0 website closes on 31 December 2026. No newer version is announced.
# VC2.0 sets Economics and Business in bands of two levels, so this file covers Levels 9 and 10 together.
# Structure: each sub-strand of Knowledge and Understanding is a unit (Economic literacy, Business and
# entrepreneurship, Work, Consumer and financial literacy), with its content descriptions grouped into chapters. The
# Skills strand is the last unit, kept to the ideas behind the skills (cost-benefit analysis, criteria, valid sources and
# predictions). There are no options to pick in this band. Figures (the Superannuation Guarantee, the inflation target)
# are as at November 2026.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: vic-ecb-910
subject: Economics and Business
bank: ecb
name: Economics and Business, Levels 9 and 10
about: Victorian Curriculum 2.0, Levels 9 and 10
short: Economics and Business
years: [9, 10]
level: Levels 9 and 10
place: vic
kind: standard
syllabus: "Victorian Curriculum F-10 Version 2.0: Economics and Business, Levels 9 and 10"
note: Follows the Victorian Curriculum 2.0. Not made or endorsed by the VCAA.
chips: [circular flow, cash rate, fiscal policy, competitive advantage, superannuation]

units:
  - title: Economic literacy
    chapters:
      - title: The circular flow of the economy
        id: vic-ecb-910-1-1
        points:
          - title: The two-sector circular flow model
            id: ecb-two-sector-circular-flow
            brief: Households sell their labour and other resources to businesses for income, then spend that income on the goods and services businesses make, so money flows in a loop.
            codes: [VC2HE10K01]
          - title: Adding government, finance and the overseas sector
            id: ecb-adding-government-finance-overseas
            brief: The five-sector model adds government, financial institutions and other countries, through taxes and spending, saving and investment, and imports and exports.
            codes: [VC2HE10K01]
          - title: Leakages and injections
            id: ecb-leakages-injections
            brief: Saving, tax and imports leak money out of the flow, while investment, government spending and exports inject it back. If injections exceed leakages, the economy grows.
            codes: [VC2HE10K01]
          - title: How the sectors depend on each other
            id: ecb-sectors-depend-each-other
            brief: Each sector relies on the others, so a fall in household spending cuts business sales, then jobs and incomes, then tax revenue.
            codes: [VC2HE10K01]

      - title: Measuring economic performance
        id: vic-ecb-910-1-2
        points:
          - title: Economic growth and GDP
            id: ecb-economic-growth-gdp-vic
            brief: Gross domestic product is the value of all final goods and services made in a country in a year. Growth is the rise in real GDP, which removes the effect of price rises.
            codes: [VC2HE10K03]
          - title: The unemployment rate
            id: ecb-unemployment-rate-vic
            brief: The unemployment rate is the share of the labour force without a job who are looking for one. High unemployment wastes resources and lowers living standards.
            codes: [VC2HE10K03]
          - title: Inflation and the CPI
            id: ecb-inflation-cpi
            brief: Inflation is a general rise in prices over time, measured by the consumer price index, which tracks the cost of a typical basket of goods and services.
            codes: [VC2HE10K03]
          - title: The business cycle
            id: ecb-business-cycle-vic
            brief: The economy moves through booms and slowdowns rather than growing evenly. Indicators such as GDP, jobs and inflation show which phase it is in.
            codes: [VC2HE10K03]
          - title: How indicators guide decisions
            id: ecb-indicators-guide-decisions
            brief: Governments, the Reserve Bank, businesses and households watch indicators to decide on policy, hiring, investment and spending.
            codes: [VC2HE10K03]
          - title: Living standards
            id: ecb-living-standards
            brief: Material living standards are the goods and services people can afford, often measured by GDP per person. Non-material ones include health, safety, the environment and free time.
            codes: [VC2HE10K02, VC2HE10K03]

      - title: Fiscal policy
        id: vic-ecb-910-1-3
        points:
          - title: Government's economic aims
            id: ecb-government-s-economic-aims
            brief: The government aims for strong, steady growth, low unemployment, stable prices and a fair share of income, to raise living standards.
            codes: [VC2HE10K02]
          - title: The federal budget
            id: ecb-federal-budget-vic
            brief: Each year the federal government sets out its planned revenue and spending. Spending more than it raises is a deficit; raising more than it spends is a surplus.
            codes: [VC2HE10K01, VC2HE10K02]
          - title: Expansionary and contractionary fiscal policy
            id: ecb-expansionary-contractionary-fiscal-policy
            brief: To lift a slow economy, government spends more or cuts taxes. To slow an overheating one and cool inflation, it spends less or raises taxes.
            codes: [VC2HE10K01, VC2HE10K02]
          - title: Other ways government intervenes
            id: ecb-other-ways-government-intervenes
            brief: Government also shapes the economy with welfare payments, regulations, subsidies and competition laws, to fix problems markets leave and protect consumers.
            codes: [VC2HE10K02]

      - title: Monetary policy
        id: vic-ecb-910-1-4
        points:
          - title: The Reserve Bank of Australia
            id: ecb-reserve-bank-australia
            brief: The RBA is Australia's central bank. Its Monetary Policy Board sets monetary policy independently of the government, to keep prices stable and support full employment.
            codes: [VC2HE10K02]
          - title: The cash rate
            id: ecb-cash-rate
            brief: The cash rate is the interest rate on overnight loans between banks, set by the RBA. Banks' rates on home loans and savings tend to follow it.
            codes: [VC2HE10K01, VC2HE10K02]
          - title: How interest rates affect spending
            id: ecb-interest-rates-affect-spending
            brief: Raising the cash rate makes borrowing dearer and saving more rewarding, so spending and inflation slow. Cutting it does the opposite.
            codes: [VC2HE10K02]
          - title: The inflation target
            id: ecb-inflation-target
            brief: The RBA aims to keep inflation between 2 and 3 per cent on average, because low, steady inflation helps people and businesses plan.
            codes: [VC2HE10K02]

      - title: Australia in the global economy
        id: vic-ecb-910-1-5
        points:
          - title: Why countries trade
            id: ecb-countries-trade-vic
            brief: Countries trade because each is better at making some things than others. By specialising and trading, both sides can have more than if each made everything itself.
            codes: [VC2HE10K04]
          - title: Australia's exports and imports
            id: ecb-australia-s-exports-imports
            brief: Australia mostly exports minerals such as iron ore, coal and gas, farm products, education and tourism, and imports manufactured goods such as cars, phones and fuel.
            codes: [VC2HE10K04]
          - title: Australia's changing trade partners
            id: ecb-australia-s-changing-trade
            brief: Australia once traded mostly with the United Kingdom. Today most of its trade is with Asia, and China is its largest trading partner.
            codes: [VC2HE10K04]
          - title: Globalisation
            id: ecb-globalisation-vic
            brief: Globalisation is the growing connection of the world's economies through trade, investment, money, technology and the movement of people.
            codes: [VC2HE10K04]
          - title: Costs and benefits of globalisation
            id: ecb-costs-benefits-globalisation
            brief: Globalisation brings cheaper goods, bigger markets and new jobs, but can also cost some local jobs, widen inequality and spread economic shocks between countries.
            codes: [VC2HE10K04]
          - title: Trade agreements and tariffs
            id: ecb-trade-agreements-tariffs
            brief: A tariff is a tax on imports that protects local producers but raises prices. Free trade agreements cut tariffs between countries to increase trade.
            codes: [VC2HE10K04]

  - title: Business and entrepreneurship
    chapters:
      - title: Competitive advantage
        id: vic-ecb-910-2-1
        points:
          - title: What competitive advantage is
            id: ecb-competitive-advantage-vic
            brief: A competitive advantage is something that lets a business beat its rivals and win customers, such as lower prices, better quality or a unique product.
            codes: [VC2HE10K05]
          - title: Cost leadership and differentiation
            id: ecb-cost-leadership-differentiation
            brief: A business can compete by having the lowest costs and prices, or by making its product different and better in ways customers will pay more for.
            codes: [VC2HE10K05]
          - title: The marketing mix
            id: ecb-marketing-mix
            brief: "Marketing decisions cover the 4 Ps: the product, its price, the place it is sold and how it is promoted."
            codes: [VC2HE10K05]
          - title: Branding and digital marketing
            id: ecb-branding-digital-marketing
            brief: A strong brand makes a business easy to recognise and trust. Social media, influencers and targeted online ads now carry much of a brand's message.
            codes: [VC2HE10K05]
          - title: Public relations
            id: ecb-public-relations
            brief: Public relations manages how the public sees a business, through media releases, sponsorships, community work and handling bad news well.
            codes: [VC2HE10K05]
          - title: Keeping an advantage through entrepreneurship
            id: ecb-keeping-advantage-through-entrepreneurship
            brief: Rivals copy successful ideas, so businesses keep their edge by innovating, improving products and finding new markets.
            codes: [VC2HE10K05]

  - title: Work
    chapters:
      - title: Managing people
        id: vic-ecb-910-3-1
        points:
          - title: Human resource management
            id: ecb-human-resource-management
            brief: Human resource management is how a business finds, trains, rewards and looks after its staff, so they work well and the business competes better.
            codes: [VC2HE10K06]
          - title: Recruiting and selecting staff
            id: ecb-recruiting-selecting-staff
            brief: Businesses advertise a job, sort applications, interview and check references to choose the person whose skills best fit the role.
            codes: [VC2HE10K06]
          - title: Training and development
            id: ecb-training-development
            brief: Training builds the skills staff need now, while development prepares them for future roles. Both raise productivity and help keep good staff.
            codes: [VC2HE10K06]
          - title: Motivating employees
            id: ecb-motivating-employees
            brief: Staff can be motivated with money, such as pay rises and bonuses, and without it, such as recognition, flexible hours and chances to grow.
            codes: [VC2HE10K06]
          - title: Productivity and competitiveness
            id: ecb-productivity-competitiveness
            brief: Well-managed, motivated staff produce more for each hour worked, which cuts costs and helps a business compete.
            codes: [VC2HE10K06]

      - title: Workplace relations
        id: vic-ecb-910-3-2
        points:
          - title: Pay and conditions
            id: ecb-pay-conditions
            brief: Minimum pay and conditions are set by the National Employment Standards and awards. Enterprise agreements, bargained at a workplace, can add more.
            codes: [VC2HE10K07]
          - title: The Fair Work system
            id: ecb-fair-work-system
            brief: The Fair Work Commission sets minimum wages and awards and settles disputes. The Fair Work Ombudsman helps workers and employers and enforces the rules.
            codes: [VC2HE10K07]
          - title: Trade unions
            id: ecb-trade-unions
            brief: A trade union is a group of workers who join together to bargain for better pay, conditions and safety, and to support members in disputes.
            codes: [VC2HE10K07]
          - title: Employer groups
            id: ecb-employer-groups
            brief: Employer groups represent businesses, advising them on workplace law, bargaining with unions and speaking for business to government.
            codes: [VC2HE10K07]

  - title: Consumer and financial literacy
    chapters:
      - title: Risk and reward
        id: vic-ecb-910-4-1
        points:
          - title: Risk and return
            id: ecb-risk-return-vic
            brief: Investments that can earn more usually carry more risk of losing money. Safer choices such as bank savings usually earn less.
            codes: [VC2HE10K08]
          - title: Ways to invest
            id: ecb-ways-invest-vic
            brief: People can invest in savings accounts and term deposits, shares, property, bonds or managed funds, each with its own mix of risk, return and how quickly it can be sold.
            codes: [VC2HE10K08]
          - title: Diversification
            id: ecb-diversification-vic
            brief: Spreading money across different investments means one loss does less harm. It is the idea behind not putting all your eggs in one basket.
            codes: [VC2HE10K08]
          - title: Insurance
            id: ecb-insurance
            brief: Insurance pays a regular premium to protect against a large loss, such as a car crash, a house fire or illness. An excess is the part the insured pays first.
            codes: [VC2HE10K08]
          - title: Investment scams
            id: ecb-investment-scams
            brief: Promises of high returns with no risk, pressure to act fast and unlicensed advisers are signs of an investment scam. ASIC's Moneysmart lists licensed businesses.
            codes: [VC2HE10K08]
          - title: Legal and ethical investing
            id: ecb-legal-ethical-investing
            brief: Investors must follow the law, and many also choose ethical investments that avoid harm, such as funds that leave out tobacco or fossil fuels.
            codes: [VC2HE10K08]

      - title: Superannuation and big financial decisions
        id: vic-ecb-910-4-2
        points:
          - title: What superannuation is
            id: ecb-superannuation-vic
            brief: Superannuation is money saved during working life for retirement, held in a super fund and invested until the person retires.
            codes: [VC2HE10K09]
          - title: Who contributes to super
            id: ecb-who-contributes-super
            brief: Employers must pay the Superannuation Guarantee, 12 per cent of ordinary pay, into an employee's fund. Workers can add their own voluntary contributions.
            codes: [VC2HE10K09]
          - title: How super grows
            id: ecb-super-grows
            brief: Super is invested for decades, so compound returns make it grow a lot. Fees and the choice of fund make a big difference to the final balance.
            codes: [VC2HE10K09]
          - title: Super and living standards
            id: ecb-super-living-standards
            brief: Super lets people live better in retirement, and it means fewer rely fully on the Age Pension, which eases pressure on the budget as the population ages.
            codes: [VC2HE10K09]
          - title: Big financial decisions
            id: ecb-big-financial-decisions
            brief: Choices such as buying a car, renting or buying a home, or taking out a loan depend on income, interest rates, total cost over time and personal goals.
            codes: [VC2HE10K08, VC2HE10K09]

  - title: Economics and business skills
    chapters:
      - title: Evaluating issues
        id: vic-ecb-910-5-1
        points:
          - title: Cost-benefit analysis
            id: ecb-cost-benefit-analysis
            brief: Cost-benefit analysis lists and, where possible, values all the costs and benefits of an option. If benefits outweigh costs, the option is worth taking.
            codes: [VC2HE10S05]
          - title: Evaluating with criteria
            id: ecb-evaluating-with-criteria
            brief: Options can be compared against criteria chosen in advance, such as cost, fairness, effect on the environment and how quickly it works.
            codes: [VC2HE10S05]
          - title: Validity of sources
            id: ecb-validity-sources
            brief: A valid source is authentic and accurate. Check who made it, their purpose and expertise, when it was made and whether other evidence supports it.
            codes: [VC2HE10S06]
          - title: Predicting from trends
            id: ecb-predicting-from-trends
            brief: Spotting trends and cause-and-effect links in data lets economists make logical predictions, such as rising rates slowing house prices.
            codes: [VC2HE10S03, VC2HE10S04]
