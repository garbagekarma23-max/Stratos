units:
  - title: "Unit 1: Understanding health and wellbeing"
    chapters:
      - title: Health perspectives and influences
        id: vic-hhd-u12-1-1
        points:
          - title: The WHO definition of health
            id: hhd-who-definition-health
            brief: The World Health Organization defines health as complete physical, mental and social wellbeing, not merely the absence of disease.
          - title: Dimensions of health and wellbeing
            id: hhd-dimensions-health-wellbeing
            brief: Health has physical, mental, social, emotional and spiritual dimensions, which are linked so a change in one affects the others.
          - title: Health as dynamic and subjective
            id: hhd-health-as-dynamic-subjective
            brief: Health changes over time (dynamic) and each person judges their own differently (subjective).
          - title: Youth perspectives on health
            id: hhd-youth-perspectives-health
            brief: Young people often link health to fitness, appearance, friendships and independence, which can differ from what adults stress.
          - title: Aboriginal and Torres Strait Islander views of health
            id: hhd-aboriginal-torres-strait-islander
            brief: Health is seen holistically, linking the person to family, community, culture, Country and spirit.
          - title: Prerequisites for health
            id: hhd-prerequisites-health
            brief: The WHO lists conditions needed for health, peace, shelter, education, food, income, a stable ecosystem, sustainable resources, social justice and equity.
          - title: Health in other cultures
            id: hhd-health-other-cultures
            brief: Different cultures stress different parts of health, such as the community over the individual, or traditional over Western medicine.

      - title: Health and nutrition
        id: vic-hhd-u12-1-2
        points:
          - title: Carbohydrates
            id: hhd-carbohydrates
            brief: The body's main source of energy. Complex carbohydrates and fibre release energy slowly and help digestion.
          - title: Fats
            id: hhd-fats
            brief: Fats store energy, insulate and help absorb some vitamins. Unsaturated fats are healthier than saturated and trans fats.
          - title: Protein
            id: hhd-protein
            brief: Protein builds and repairs tissue and makes enzymes and hormones. It comes from meat, fish, eggs, dairy, legumes and nuts.
          - title: Water
            id: hhd-water
            brief: Water carries nutrients, removes wastes and controls body temperature. Most of the body is water.
          - title: Vitamins
            id: hhd-vitamins
            brief: Vitamins such as D and the B group are needed in small amounts for processes such as bone growth and turning food into energy.
          - title: Minerals
            id: hhd-minerals
            brief: Minerals such as calcium for bones, iron for carrying oxygen and sodium for fluid balance are needed in small amounts.
          - title: The Australian Dietary Guidelines
            id: hhd-australian-dietary-guidelines
            brief: Five guidelines for healthy eating, including enjoying a range of foods and limiting saturated fat, added salt, sugar and alcohol.
          - title: The Australian Guide to Healthy Eating
            id: hhd-australian-guide-healthy-eating
            brief: A plate graphic showing the five food groups in the proportions to eat each day.
          - title: Influences on food choices
            id: hhd-influences-food-choices
            brief: Taste, cost, family, culture, advertising, convenience and knowledge all shape what young people eat.
          - title: Judging nutrition information
            id: hhd-judging-nutrition-information
            brief: Good nutrition advice comes from qualified sources, is backed by evidence and does not sell a quick fix.

      - title: Youth health and wellbeing
        id: vic-hhd-u12-1-3
        points:
          - title: Indicators of youth health
            id: hhd-indicators-youth-health
            brief: Data such as rates of injury, mental health problems, overweight and risky drinking show how young people are faring.
          - title: Factors affecting youth health
            id: hhd-factors-affecting-youth-health
            brief: Sleep, physical activity, food, relationships, school, income and online life all affect young people's health.
          - title: Evaluating health information
            id: hhd-evaluating-health-information
            brief: Checking the source, its evidence, its date and who funds it helps tell good health information from bad.
          - title: Health promotion for young people
            id: hhd-health-promotion-young-people
            brief: Programs and campaigns aimed at young people, such as on road safety or mental health, try to improve their health.

  - title: "Unit 2: Managing health and development"
    chapters:
      - title: Development across the lifespan
        id: vic-hhd-u12-2-1
        points:
          - title: Growth and development compared
            id: hhd-growth-development-compared
            brief: Growth is a change in size. Development is a change in ability and complexity, across physical, social, emotional and intellectual areas.
          - title: Stages of the lifespan
            id: hhd-stages-lifespan
            brief: Life runs through stages such as prenatal, infancy, childhood, youth, adulthood and old age, each with typical changes.
          - title: Physical development
            id: hhd-physical-development
            brief: Changes in the body and its systems, such as the growth spurt and puberty in youth.
          - title: Social and emotional development
            id: hhd-social-emotional-development
            brief: Learning to relate to others and to understand and manage feelings, which change as people form new relationships.
          - title: Intellectual development
            id: hhd-intellectual-development
            brief: Growth in thinking, memory, language and problem solving, which continues through life.
          - title: The move from youth to adulthood
            id: hhd-move-from-youth-adulthood
            brief: Becoming an adult brings independence, work, relationships and new responsibilities, which can affect health.
          - title: Healthy ageing and lifespan health
            id: hhd-healthy-ageing-lifespan-health
            brief: Choices made early, such as eating well and staying active, affect health and development decades later.

      - title: Health care in Australia
        id: vic-hhd-u12-2-2
        points:
          - title: Medicare
            id: hhd-medicare
            brief: Australia's public health insurance, funded by taxes and the Medicare levy, which covers or subsidises doctors, tests and public hospital care.
          - title: The Pharmaceutical Benefits Scheme
            id: hhd-pharmaceutical-benefits-scheme
            brief: The PBS subsidises many prescription medicines so they cost less for everyone, and less again for concession card holders.
          - title: Private health insurance
            id: hhd-private-health-insurance
            brief: Optional insurance that covers private hospital care and extras such as dental, encouraged by rebates and levies.
          - title: The National Disability Insurance Scheme
            id: hhd-national-disability-insurance-scheme
            brief: The NDIS funds support for people with permanent and significant disability, so they can take part in daily life.
          - title: Rights and responsibilities in health care
            id: hhd-rights-responsibilities-health-care
            brief: Patients have rights to safe care, information, privacy and respect, and responsibilities to give accurate information.
          - title: Young people and health services
            id: hhd-young-people-health-services
            brief: Young people can get their own Medicare card from age 15, and services such as headspace give confidential care.
          - title: Digital health
            id: hhd-digital-health
            brief: Telehealth, online records and health apps make care easier to reach, but raise questions about privacy and quality.
          - title: Evaluating health products and services
            id: hhd-evaluating-health-products-services
            brief: Checking claims, evidence, cost and who is giving the advice helps people choose health products and services wisely.
