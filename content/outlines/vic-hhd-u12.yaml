# VCE Health and Human Development, Units 1 and 2: understanding health and wellbeing, and managing health and
# development, 51 points.
# Checked against the VCAA's VCE Health and Human Development Study Design, accredited from 2025, in October 2026.
# Each unit is a unit here, and each area of study is a chapter, or two when it is large. Every brief is in our own
# words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on mental health, drugs and Aboriginal and Torres Strait Islander health always go to the review page.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-hhd-u12
subject: Health and Human Development
bank: hhd
name: Health and Human Development, Units 1 and 2
about: VCE, Health, nutrition, development and the health system
short: Health and Human Development
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Health and Human Development Study Design (from 2025), Units 1 and 2
note: Follows the VCE Health and Human Development study design. Not made or endorsed by the VCAA.
chips: [dimensions of health, prerequisites, macronutrients, lifespan, Medicare]

units:
  - title: "Unit 1: Understanding health and wellbeing"
    chapters:
      - title: Concepts of health
        id: vic-hhd-u12-1-1
        points:
          - title: Definitions of health
            id: hhd-who-definition-health
            brief: Health has been defined in different ways, from the absence of disease to the World Health Organization's complete physical, mental and social wellbeing.
          - title: Dimensions of health and wellbeing
            id: hhd-dimensions-health-wellbeing
            brief: Health has physical, mental, social, emotional and spiritual dimensions, which are linked so a change in one affects the others.
          - title: Health as dynamic and subjective
            id: hhd-health-as-dynamic-subjective
            brief: Health changes over time (dynamic) and each person judges their own differently (subjective).
          - title: Prerequisites for health
            id: hhd-prerequisites-health
            brief: The WHO lists conditions needed for health, peace, shelter, education, food, income, a stable ecosystem, sustainable resources, social justice and equity.
          - title: Youth perspectives on health
            id: hhd-youth-perspectives-health
            brief: Young people often link health to fitness, appearance, friendships and independence, which can differ from what adults stress.
          - title: Aboriginal and Torres Strait Islander views of health
            id: hhd-aboriginal-torres-strait-islander
            brief: Health is seen holistically, linking the person to family, community, culture, Country and spirit.

      - title: Measuring youth health
        id: vic-hhd-u12-1-2-2
        points:
          - title: Measuring health status
            id: hhd-indicators-youth-health
            brief: Incidence, prevalence, morbidity, hospitalisation, burden of disease, mortality and life expectancy describe how healthy a group is.
          - title: The health status of Australia's youth
            id: hhd-health-status-australia-s
            brief: Most young Australians rate their health highly, but mental health conditions, injury and overweight are common concerns.
          - title: Factors affecting youth health
            id: hhd-factors-affecting-youth-health
            brief: Peer group, family, education, income and health literacy help explain why health differs between young people.

      - title: Youth health and wellbeing
        id: vic-hhd-u12-1-3
        points:
          - title: Areas needing action
            id: hhd-areas-needing-action
            brief: Health data points to the areas of youth health that most need action, such as mental health, injury and alcohol use.
          - title: Programs for youth health
            id: hhd-health-promotion-young-people
            brief: Government and non-government programs, such as on road safety or mental health, aim to improve young people's health.
          - title: A youth health focus
            id: hhd-youth-health-focus
            brief: Studying one issue, such as mental health or body image, shows its effect on each dimension of health and its trends in the data.
          - title: Risk and protective factors
            id: hhd-risk-protective-factors
            brief: Risk factors make a health problem more likely; protective factors make it less likely or soften its effects.
          - title: The costs of a health issue
            id: hhd-costs-health-issue
            brief: A health issue has direct costs such as treatment, indirect costs such as lost work, and intangible costs such as pain and stress.
          - title: Youth advocacy
            id: hhd-youth-advocacy
            brief: Young people can act personally and in their communities to speak up for better and fairer health.

      - title: Nutrients
        id: vic-hhd-u12-1-2
        points:
          - title: Carbohydrates
            id: hhd-carbohydrates
            brief: The body's main source of energy. Complex carbohydrates and fibre release energy slowly and help digestion.
          - title: Fats
            id: hhd-fats
            brief: Fats store energy, insulate and help absorb some vitamins. Unsaturated fats are healthier than saturated and trans fats.
          - title: Protein
            id: hhd-protein
            brief: Protein builds and repairs tissue and makes enzymes and hormones. It comes from meat, fish, eggs, dairy, legumes and nuts.
          - title: Water
            id: hhd-water
            brief: Water carries nutrients, removes wastes and controls body temperature. Most of the body is water.
          - title: Vitamins
            id: hhd-vitamins
            brief: Vitamins C and D and folate are needed in small amounts, for processes such as healing, bone growth and healthy pregnancy.
          - title: Minerals
            id: hhd-minerals
            brief: Minerals such as calcium for bones, iron for carrying oxygen and sodium for fluid balance are needed in small amounts.

      - title: Healthy eating
        id: vic-hhd-u12-1-5
        points:
          - title: The Australian Dietary Guidelines
            id: hhd-australian-dietary-guidelines
            brief: Five guidelines for healthy eating, including enjoying a range of foods and limiting saturated fat, added salt, sugar and alcohol.
          - title: The Australian Guide to Healthy Eating
            id: hhd-australian-guide-healthy-eating
            brief: A plate graphic showing the five food groups in the proportions to eat each day.
          - title: The Healthy Eating Pyramid and Health Star Rating
            id: hhd-healthy-eating-pyramid-health
            brief: The Healthy Eating Pyramid shows how much of each food group to eat, and the Health Star Rating compares packaged foods.
          - title: Judging nutrition information
            id: hhd-judging-nutrition-information
            brief: Good nutrition advice comes from qualified sources, is backed by evidence and does not sell a quick fix.
          - title: Influences on food choices
            id: hhd-influences-food-choices
            brief: Taste, cost, family, culture, convenience, knowledge and commercial factors can help or hinder healthy eating for young people.
          - title: Marketing food to young people
            id: hhd-marketing-food-young-people
            brief: Food companies target young people with social media, influencers, sponsorship and packaging, often for less healthy foods.

  - title: "Unit 2: Managing health and development"
    chapters:
      - title: The lifespan
        id: vic-hhd-u12-2-1
        points:
          - title: Growth and development compared
            id: hhd-growth-development-compared
            brief: Growth is a change in size. Development is a change in ability and complexity, across physical, social, emotional and intellectual areas.
          - title: Stages of the lifespan
            id: hhd-stages-lifespan
            brief: Life runs through stages such as prenatal, infancy, childhood, youth, adulthood and old age, each with typical changes.
          - title: Perceptions of youth and adulthood
            id: hhd-perceptions-youth-adulthood
            brief: What it means to be young or an adult differs between people and cultures, beyond age alone.
          - title: Physical development
            id: hhd-physical-development
            brief: Changes in the body and its systems, such as the growth spurt and puberty in youth.
          - title: Social and emotional development
            id: hhd-social-emotional-development
            brief: Learning to relate to others and to understand and manage feelings, which change as people form new relationships.
          - title: Intellectual development
            id: hhd-intellectual-development
            brief: Growth in thinking, memory, language and problem solving, which continues through life.
          - title: The move from youth to adulthood
            id: hhd-move-from-youth-adulthood
            brief: Becoming an adult brings independence, work, relationships and new responsibilities, which can affect health.

      - title: Relationships and parenting
        id: vic-hhd-u12-2-2-2
        points:
          - title: Healthy and respectful relationships
            id: hhd-healthy-respectful-relationships
            brief: Respect, trust, honesty and safety mark a healthy relationship, which supports health and development.
          - title: Becoming a parent
            id: hhd-becoming-parent
            brief: Parenthood changes responsibilities, relationships and finances, and can add stress.
          - title: Support for parents
            id: hhd-support-parents
            brief: Family, friends, maternal and child health nurses and parenting services help new parents.

      - title: Early life
        id: vic-hhd-u12-2-3
        points:
          - title: Prenatal development
            id: hhd-prenatal-development
            brief: From fertilisation, a baby develops through the germinal, embryonic and fetal stages.
          - title: Risks before birth
            id: hhd-risks-before-birth
            brief: A mother's diet, smoking and alcohol during pregnancy can affect a baby's development; good nutrition and care protect it.
          - title: Development in infancy and early childhood
            id: hhd-development-infancy-early-childhood
            brief: Rapid physical, social, emotional and intellectual development happens in the first years of life.
          - title: Early life experiences
            id: hhd-early-life-experiences
            brief: Care, nutrition and stress early in life shape health and development for decades.
          - title: Health across generations
            id: hhd-health-across-generations
            brief: Parents' health and circumstances affect their children's health, and so on to the next generation.

      - title: Australia's health system
        id: vic-hhd-u12-2-2
        points:
          - title: GPs, allied and alternative health
            id: hhd-gps-allied-alternative-health
            brief: GPs are usually the first stop. Allied health includes physiotherapists and psychologists; alternative health includes naturopathy.
          - title: Medicare
            id: hhd-medicare
            brief: Australia's public health insurance, funded by taxes and the Medicare levy, which covers or subsidises doctors, tests and public hospital care.
          - title: The Pharmaceutical Benefits Scheme
            id: hhd-pharmaceutical-benefits-scheme
            brief: The PBS subsidises many prescription medicines so they cost less for everyone, and less again for concession card holders.
          - title: Private health insurance
            id: hhd-private-health-insurance
            brief: Optional insurance that covers private hospital care and extras such as dental, encouraged by rebates and levies.

      - title: Youth health literacy
        id: vic-hhd-u12-2-5
        points:
          - title: Local services for young people
            id: hhd-local-services-young-people
            brief: Community services such as headspace, school wellbeing staff and youth centres support every dimension of youth health.
          - title: Access to health services
            id: hhd-young-people-health-services
            brief: Cost, location, confidentiality worries, knowledge and culture affect whether young people use health services and information.
          - title: Rights and responsibilities in health care
            id: hhd-rights-responsibilities-health-care
            brief: Patients have rights to privacy, confidentiality and to know how their health data is stored and shared, and responsibilities such as giving honest information.
          - title: Digital health
            id: hhd-digital-health
            brief: Websites, online practitioners and health apps make information and care easier to reach, but quality and privacy vary.
          - title: Complaints and redress
            id: hhd-complaints-redress
            brief: Patients can complain to the provider, then to bodies such as the Health Complaints Commissioner, if care goes wrong.
