# VCE Health and Human Development, Units 1 and 2: understanding health and wellbeing, and managing health and
# development, 36 points.
# Drafted from the VCAA's VCE Health and Human Development Study Design, accredited from 2025. The structure follows the
# study design: each unit is a unit here, and each area of study is a chapter. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on mental health, drugs and Aboriginal and Torres Strait Islander health always go to the review page.

