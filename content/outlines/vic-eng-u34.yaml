# VCE English, Units 3 and 4: reading and responding to texts, creating texts and analysing argument, 29 points.
# Drafted from the VCAA's VCE English and English as an Additional Language Study Design, Units 3 and 4 from 2024,
# accreditation period ending 31 December 2027. The structure follows the study design: each unit is a unit here, and
# each area of study is a chapter, or two when it is large. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# No points on a particular text yet: schools pick their texts from the VCAA's text list, which changes each year.
# The four frameworks of ideas for Creating texts are named here. EAL shares this study design.
# In transition: the accreditation ends 31 December 2027. Check for a new study design before running this for 2028.

id: vic-eng-u34
subject: English
bank: eng
name: English, Units 3 and 4
about: VCE, Text response, creating texts and argument analysis
short: English
years: [12]
level: Units 3 and 4
place: vic
kind: english
syllabus: VCE English and EAL Study Design (2023 to 2027), Units 3 and 4
note: Follows the VCE English study design. Not made or endorsed by the VCAA.
chips: [text response, framework of ideas, mentor text, argument analysis, persuasive language]

units:
  - title: "Unit 3: Reading and creating texts"
    chapters:
      - title: Reading and responding to texts
        id: vic-eng-u34-1-1
        points:
          - title: The analytical text response
            id: eng-analytical-text-response
            brief: An essay that answers a topic about a set text with a clear contention, organised paragraphs and close use of evidence.
          - title: Reading an essay topic
            id: eng-reading-essay-topic
            brief: Breaking a topic into its terms, its assumption and its instruction word shows what the essay must argue.
          - title: Kinds of essay topics
            id: eng-kinds-essay-topics
            brief: Topics may ask about a theme, a character, a quotation or how the text is constructed, and each needs a different focus.
          - title: Forming an interpretation
            id: eng-forming-interpretation
            brief: An interpretation is your reading of what the text suggests, backed by evidence, which can differ from other readings.
          - title: Views and values of the author
            id: eng-views-values-author
            brief: Writers' choices hint at what they value or criticise, which a strong essay discusses with care.
          - title: How form shapes meaning
            id: eng-form-shapes-meaning
            brief: A novel, play, film, poetry collection or memoir each make meaning in their own ways, such as stage directions or camera angles.
          - title: Writing an introduction
            id: eng-writing-introduction-2
            brief: An introduction names the text and writer, responds to the topic with a contention, and maps the main points.
          - title: Writing a conclusion
            id: eng-writing-conclusion
            brief: A conclusion draws the argument together and returns to the topic, without simply repeating the paragraphs.
          - title: Writing under time
            id: eng-writing-under-time
            brief: Planning a few minutes first, choosing evidence you know well and keeping each paragraph focused helps in a timed essay.

      - title: Creating texts
        id: vic-eng-u34-1-2
        points:
          - title: Frameworks of ideas
            id: eng-frameworks-ideas
            brief: Creating texts is built around one framework of ideas, such as writing about country, protest, personal journeys or play.
          - title: Reading mentor texts closely
            id: eng-reading-mentor-texts-closely
            brief: Mentor texts show techniques to borrow, such as an opening image, a shift in tense or a repeated line.
          - title: Writing about country
            id: eng-writing-about-country
            brief: A framework exploring connections between people and places, land and environment, including Aboriginal and Torres Strait Islander connections to Country.
          - title: Writing about protest
            id: eng-writing-about-protest
            brief: A framework exploring why people speak out, resist or refuse, and the forms protest takes.
          - title: Writing about personal journeys
            id: eng-writing-about-personal-journeys
            brief: A framework exploring change, growth, identity and the paths people travel, literally or not.
          - title: Writing about play
            id: eng-writing-about-play
            brief: A framework exploring games, imagination, sport and fun, and what play shows about people.
          - title: Choosing a form for a purpose
            id: eng-choosing-form-purpose
            brief: Writers pick a form, such as a personal essay, short story, speech or opinion piece, that best suits their idea and audience.
          - title: Writing with a clear purpose
            id: eng-writing-with-clear-purpose
            brief: Every piece should aim to do something, such as reflect, persuade, inform or entertain, and its choices should serve that aim.
          - title: The written explanation
            id: eng-written-explanation
            brief: A piece explaining the writer's decisions on purpose, audience, context and language, and how the mentor texts shaped them.

  - title: "Unit 4: Reading and responding, and analysing argument"
    chapters:
      - title: Reading and responding to a second text
        id: vic-eng-u34-2-1
        points:
          - title: Comparing ideas across a text
            id: eng-comparing-ideas-across-text
            brief: Strong essays trace how an idea develops, shifts or contrasts across the whole text, not just in one scene.
          - title: Structure in an essay
            id: eng-structure-essay
            brief: Paragraphs can each take one argument, building from a simpler point to a deeper one.
          - title: Embedding evidence
            id: eng-embedding-evidence-2
            brief: Short quotations built into your own sentences, followed by analysis of their language, show close reading.
          - title: Discussing different readings
            id: eng-discussing-different-readings
            brief: Acknowledging that a moment can be read in more than one way, then arguing for one, shows depth.

      - title: Analysing argument
        id: vic-eng-u34-2-2
        points:
          - title: Identifying the contention and tone
            id: eng-identifying-contention-tone
            brief: Analysis starts with what the writer argues, to whom, in what tone and in what context.
          - title: Analysing language for persuasive effect
            id: eng-analysing-language-persuasive-effect
            brief: Good analysis names a technique and explains how it is meant to position the reader, using the writer's words.
          - title: How arguments are structured
            id: eng-arguments-are-structured
            brief: Writers order arguments to build, such as an anecdote first, then evidence, then a call to action.
          - title: Analysing visual material
            id: eng-analysing-visual-material
            brief: Images that go with an argument are analysed for how they support, sharpen or add to the written argument.
          - title: Comparing two pieces on an issue
            id: eng-comparing-two-pieces-issue
            brief: When two texts take different views, analysis compares how each tries to persuade, not which is right.
          - title: Writing the argument analysis
            id: eng-writing-argument-analysis
            brief: An analysis introduces the issue and texts, then follows the argument's structure, explaining how each part persuades.
          - title: Writing a point of view in Unit 4
            id: eng-writing-point-view-unit
            brief: Students also present their own reasoned view on an issue, using strong arguments and techniques suited to the audience.
