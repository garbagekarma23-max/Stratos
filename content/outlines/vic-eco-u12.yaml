# VCE Economics, Units 1 and 2: economic decision-making, living standards and economic issues, 53 points.
# Checked against the VCAA's VCE Economics Study Design, accredited from 2023, in October 2026. Each unit is a unit
# here, and each area of study is a chapter, or two when it is large. Unit 2's second area of study has schools pick
# two of four issues; the two issue chapters here cover income and wealth, and sustainability. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# also_match [e] has the matcher look in the Economics bank (econ-points.js) too, which shares most of Unit 1's ideas.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-eco-u12
subject: Economics
bank: eco
name: Economics, Units 1 and 2
about: VCE, Economic decision-making and living standards
short: Economics
years: [11]
level: Units 1 and 2
place: vic
kind: standard
syllabus: VCE Economics Study Design (from 2023), Units 1 and 2
note: Follows the VCE Economics study design. Not made or endorsed by the VCAA.
chips: [opportunity cost, equilibrium, nudge, GDP, living standards]
also_match: [e]

units:
  - title: "Unit 1: Economic decision-making"
    chapters:
      - title: Thinking like an economist
        id: vic-eco-u12-1-1
        points:
          - title: Microeconomics and macroeconomics
            id: eco-microeconomics-macroeconomics
            brief: Microeconomics studies single markets, consumers and businesses. Macroeconomics studies the whole economy, such as growth, jobs and prices.
          - title: Positive and normative statements
            id: eco-positive-normative-statements
            brief: A positive statement can be tested against facts. A normative statement gives an opinion about what should happen.
          - title: Factors of production
            id: eco-factors-production
            brief: The resources used to make goods and services, natural resources, labour, capital and enterprise.
          - title: The basic economic problem
            id: eco-basic-economic-problem
            brief: Wants are unlimited but resources are scarce, so every society must decide what and how much to make, how to make it and who gets it.
          - title: Opportunity cost
            id: eco-opportunity-cost
            brief: The value of the next best choice given up. Weighing it is the heart of trade-offs and cost-benefit analysis.
          - title: The production possibility frontier
            id: eco-production-possibility-frontier
            brief: A curve showing the most two goods an economy can make with its resources. Points on it are efficient, points inside waste resources, and moving along it shows opportunity cost.
          - title: Economic systems
            id: eco-economic-systems
            brief: Market, planned, mixed and traditional economies answer the three economic questions in different ways, through prices, the state, both, or custom.
          - title: The three-sector circular flow
            id: eco-circular-flow-income
            brief: Households, businesses and government trade resources, income, goods, taxes and services in a loop that shows how money moves through the economy.

      - title: Economic agents
        id: vic-eco-u12-1-2-2
        points:
          - title: Economic agents and sectors
            id: eco-economic-agents-sectors
            brief: Consumers, businesses and government make the economy's decisions. The private sector is owned by people and firms; the public sector by government.
          - title: The traditional view of consumers
            id: eco-traditional-view-consumers
            brief: Traditional economics assumes consumers act in their own interest, are rational and well informed, and try to get the most satisfaction (utility) from what they buy.
          - title: Marginal thinking
            id: eco-marginal-thinking
            brief: A rational decision weighs the extra benefit of one more unit against its extra cost, and stops where they meet.
          - title: Incentives and disincentives
            id: eco-incentives-decisions
            brief: Taxes, rebates, subsidies and regulations change what people and businesses choose, by making some actions cheaper and others dearer.
          - title: The traditional view of business and government
            id: eco-traditional-view-business-government
            brief: Traditional economics assumes businesses aim to maximise profit and government aims to maximise living standards, by stabilising the economy, improving efficiency and redistributing income.

      - title: Demand, supply and price
        id: vic-eco-u12-1-2
        points:
          - title: The law of demand
            id: eco-law-demand
            brief: As a price rises, the quantity demanded falls, other things equal. A change in price is a movement along the demand curve.
          - title: Factors that shift demand
            id: eco-factors-that-shift-demand
            brief: Disposable income, the prices of substitutes and complements, tastes, interest rates, population and consumer confidence shift the whole demand curve.
          - title: The law of supply
            id: eco-law-supply
            brief: As a price rises, the quantity supplied rises, because selling more becomes more profitable. A change in price is a movement along the supply curve.
          - title: Factors that shift supply
            id: eco-factors-that-shift-supply
            brief: Costs of production, technology, productivity, the weather and other disruptions shift the whole supply curve.
          - title: Market equilibrium
            id: eco-market-equilibrium
            brief: The price where quantity demanded equals quantity supplied. A shortage pushes the price up and a surplus pushes it down.
          - title: Changes in equilibrium
            id: eco-changes-equilibrium
            brief: A shift in demand or supply moves the market to a new equilibrium price and quantity. Working out the direction of each is the core market skill.

      - title: Competition in markets
        id: vic-eco-u12-1-4
        points:
          - title: What a market is
            id: eco-market
            brief: Any place or system where buyers and sellers trade, face to face or online. Markets set prices that guide what is made.
          - title: Perfect competition
            id: eco-perfect-competition-2
            brief: A perfectly competitive market has many small buyers and sellers, identical products, full information and free entry, so no one controls the price.
          - title: Relative prices and resource allocation
            id: eco-relative-prices-resource-allocation
            brief: When one good's price rises relative to others, producers move resources toward it and consumers move away from it.
          - title: Market structures
            id: eco-market-structures
            brief: Markets range from perfect competition through monopolistic competition and oligopoly to monopoly. More market power usually means higher prices and less efficient use of resources.
          - title: Business strategies to raise profit
            id: eco-business-strategies-raise-profit
            brief: Firms may charge different groups different prices, sell several brands of one product, or act against competition in ways the Competition and Consumer Act bans.

      - title: Behavioural economics
        id: vic-eco-u12-1-3
        points:
          - title: Traditional and behavioural economics
            id: eco-traditional-economic-thinking
            brief: Traditional economics assumes rational, informed, self-interested people. Behavioural economics tests this with experiments and finds people often act otherwise.
          - title: Bounded rationality
            id: eco-bounded-rationality
            brief: People have limited time, information and brain power, so they settle for decisions that are good enough rather than the best.
          - title: Bounded willpower
            id: eco-bounded-willpower
            brief: People often choose what feels good now over what serves them later, such as spending instead of saving.
          - title: Bounded self-interest
            id: eco-bounded-self-interest
            brief: People care about fairness and others, not only themselves, so they donate, tip and refuse unfair offers.
          - title: How government uses behavioural insights
            id: eco-nudges-choice-architecture
            brief: Governments steer choices with defaults, reminders and how options are presented, such as opt-out superannuation or organ donor sign-up, without banning anything.
          - title: How businesses use behavioural insights
            id: eco-framing-anchoring-loss-aversion
            brief: Businesses use framing, anchoring, loss aversion, free trials that roll over and limited-time offers to influence what consumers buy.

  - title: "Unit 2: Economic issues and living standards"
    chapters:
      - title: Economic activity and living standards
        id: vic-eco-u12-2-1
        points:
          - title: The purpose of economic activity
            id: eco-purpose-economic-activity
            brief: Economic activity is the making, selling and buying of goods and services. Its purpose is to meet needs and wants and so raise living standards.
          - title: Material living standards
            id: eco-material-living-standards
            brief: Access to goods and services, often measured by real GDP per person.
          - title: Non-material living standards
            id: eco-non-material-living-standards
            brief: Things money cannot buy directly, such as health, safety, freedom, the environment and leisure time.
          - title: The five-sector circular flow
            id: eco-five-sector-circular-flow-2
            brief: Adds financial institutions and the overseas sector to households, businesses and government, with saving, tax and imports leaking out and investment, spending and exports flowing in.
          - title: Measuring economic growth
            id: eco-gross-domestic-product
            brief: GDP is the market value of final goods and services made in a year. Growth is measured by the change in real GDP, which removes price rises.
          - title: Limits of GDP
            id: eco-limits-gdp
            brief: Real GDP per person misses unpaid work, the environment, how income is shared and leisure, so it is an incomplete measure of living standards.
          - title: Measures beyond GDP
            id: eco-measures-beyond-gdp
            brief: Measures such as the Human Development Index combine income with health and education to give a fuller picture of living standards.

      - title: The business cycle and growth
        id: vic-eco-u12-2-2-2
        points:
          - title: The business cycle
            id: eco-business-cycle-2
            brief: The economy moves through phases of expansion, peak, contraction and trough, rather than growing at a steady rate.
          - title: Economic indicators
            id: eco-economic-indicators
            brief: Leading indicators change before the economy does, such as building approvals; coincident ones move with it, such as GDP; lagging ones change after, such as unemployment.
          - title: Aggregate demand
            id: eco-aggregate-demand-2
            brief: "Total spending: consumption, investment, government spending, and exports less imports. Confidence, interest rates and income change it."
          - title: Aggregate supply
            id: eco-aggregate-supply
            brief: The total output businesses can make, set by the quantity and quality of resources, costs of production, technology and productivity.
          - title: Benefits of economic growth
            id: eco-economic-growth
            brief: Growth can raise incomes, create jobs, fund better health and education and help a country develop.
          - title: Costs of economic growth
            id: eco-costs-benefits-growth
            brief: Growth can bring boom and bust, congestion, pollution, environmental damage, wider inequality and affluenza, the stress of always wanting more.

      - title: "Issue: the distribution of income and wealth"
        id: vic-eco-u12-2-2
        points:
          - title: Income and wealth inequality
            id: eco-income-wealth-inequality
            brief: Income is a flow of money earned; wealth is a stock of assets owned. Both are spread unevenly, and wealth more so.
          - title: Measuring inequality
            id: eco-measuring-inequality
            brief: The Lorenz curve and Gini coefficient show how evenly income or wealth is shared. A Gini of 0 is perfectly equal.
          - title: Causes and effects of inequality
            id: eco-causes-effects-inequality
            brief: Differences in skills, jobs, inheritance and age drive inequality. Too much can harm social cohesion and growth.
          - title: Views on inequality
            id: eco-views-inequality
            brief: Households, workers, businesses and governments see inequality differently, weighing fairness, incentives to work and the cost of support.
          - title: Reducing inequality
            id: eco-reducing-inequality
            brief: Progressive taxes, welfare payments, minimum wages and public education and health reduce inequality.

      - title: "Issue: economics and environmental sustainability"
        id: vic-eco-u12-2-4
        points:
          - title: What environmental sustainability means
            id: eco-environmental-sustainability-means
            brief: Meeting needs now without leaving later generations worse off, tracked with measures such as emissions per person and land and water use.
          - title: Climate change as an economic issue
            id: eco-climate-change-as-economic
            brief: Emissions impose costs on others not paid by the polluter, a negative externality, which markets alone do not fix.
          - title: Views on sustainability
            id: eco-views-sustainability
            brief: Households, businesses, governments and groups such as farmers or miners weigh the costs and benefits of acting on the environment differently.
          - title: Policies on emissions
            id: eco-policies-emissions
            brief: Local, national and international responses, such as carbon pricing, clean energy subsidies, regulation and global agreements, each try to cut emissions at least cost.
          - title: Trade-offs between goals
            id: eco-trade-offs-between-goals
            brief: Pursuing one aim, such as faster growth, can cost another, such as the environment or equity, so policy involves choices.
