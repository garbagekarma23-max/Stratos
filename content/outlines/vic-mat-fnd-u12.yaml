# VCE Foundation Mathematics, Units 1 and 2: number, data, money and measurement for everyday life, 34 points.
# Checked against the VCAA's VCE Mathematics Study Design, accredited from 2023, in October 2026. Each unit is a unit
# here, and its areas of study are its chapters, or two when one is large. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Cards and multiple choice for now (kind: maths). Run General Mathematics first, so shared points can be reused.
# VCAA's study designs now give only the year they start (Notice to Schools 23, April 2025 changed the accreditation
# periods), and none of these has a replacement announced for 2027. Check the study's page before each run.

id: vic-mat-fnd-u12
subject: Mathematics
bank: mat
name: Foundation Mathematics, Units 1 and 2
about: VCE, Everyday number, money, data and measurement
short: Foundation Mathematics
years: [11]
level: Units 1 and 2
place: vic
kind: maths
syllabus: VCE Mathematics Study Design (from 2023), Foundation Mathematics Units 1 and 2
note: Follows the VCE Mathematics study design. Not made or endorsed by the VCAA.
chips: [percentage, budget, unit price, scale, mean]

units:
  - title: "Unit 1: Number, data, money and measurement"
    chapters:
      - title: Number in everyday life
        id: vic-mat-fnd-u12-1-1
        points:
          - title: Order of operations
            id: mat-order-operations
            brief: Brackets, then powers, then multiplication and division left to right, then addition and subtraction left to right.
          - title: Fractions, decimals and percentages
            id: mat-fractions-decimals-percentages
            brief: The same amount written three ways, such as 1/4, 0.25 and 25%, and moving between them.
          - title: Percentages of amounts
            id: mat-percentages-amounts
            brief: Find a percentage of an amount by multiplying, such as 15% of $80 is 0.15 × 80 = $12.
          - title: Ratios and rates
            id: mat-ratios-rates
            brief: A ratio compares amounts of the same kind, such as 2:3. A rate compares different units, such as km per hour.
          - title: Estimating and rounding
            id: mat-estimating-rounding
            brief: Rounding to a sensible place and estimating first catches errors, such as a calculator answer ten times too big.

      - title: Collecting and showing data
        id: vic-mat-fnd-u12-3-1
        points:
          - title: Collecting data
            id: mat-collecting-data
            brief: Surveys, measurements and observations collect data. A biased sample can give a wrong picture.
          - title: Reading tables and graphs
            id: mat-reading-tables-graphs
            brief: Reading values, trends and comparisons from tables, bar graphs, line graphs and pie charts.
          - title: Drawing charts and graphs
            id: mat-drawing-charts-graphs
            brief: Choosing and drawing a column graph, line graph, pie chart or table that fits the data, with a title, labels and scale.
          - title: Misleading graphs
            id: mat-misleading-graphs
            brief: Graphs mislead with axes that do not start at zero, uneven scales or pictures sized unfairly.

      - title: Earning and paying
        id: vic-mat-fnd-u12-2-1
        points:
          - title: Pay and payslips
            id: mat-wages-salaries-2
            brief: Working out pay from an hourly rate, overtime and penalty rates or a salary, and reading what a payslip shows.
          - title: Banking, bills and borrowing
            id: mat-banking-bills-borrowing
            brief: Bank accounts, card payments, paying bills on time and what borrowing costs, for everyday money tasks.
          - title: Tax and superannuation
            id: mat-tax-superannuation
            brief: Income tax comes out of pay, and employers pay superannuation into a fund for retirement, both as a share of earnings.
          - title: Tax and the community
            id: mat-tax-community
            brief: Taxes pay for shared services such as roads, schools and hospitals, collected by local, state and federal governments.
          - title: Fees and interest
            id: mat-simple-interest-everyday-life
            brief: Account fees, late fees and simple interest add to costs. Simple interest is the amount times the rate times the time.
          - title: Discounts and mark-ups
            id: mat-discounts-mark-ups
            brief: A 20% discount multiplies the price by 0.8. A 20% mark-up multiplies it by 1.2.

      - title: Measurement and time
        id: vic-mat-fnd-u12-4-1
        points:
          - title: Units and converting
            id: mat-units-converting
            brief: Converting between mm, cm, m and km, between g and kg, and between mL and L.
          - title: Reading scales
            id: mat-reading-scales
            brief: Reading measuring jugs, scales, thermometers, gauges and digital displays accurately, to the nearest marked unit.
          - title: Perimeter and area in practice
            id: mat-perimeter-area-practice
            brief: Working out lengths of fencing or areas of flooring, including composite shapes.
          - title: Volume and capacity
            id: mat-volume-capacity-2
            brief: Volume of rectangular prisms and cylinders, and that 1000 cm³ holds 1 L.
          - title: Time and timetables
            id: mat-time-timetables
            brief: 24-hour time, time differences and reading timetables to plan a trip.

  - title: "Unit 2: Formulas, data, money and space"
    chapters:
      - title: Formulas and patterns
        id: vic-mat-fnd-u12-2-1-2
        points:
          - title: Patterns and rules
            id: mat-patterns-rules
            brief: Writing a pattern as a rule, such as cost = 4 × number of tickets, lets you work out any value.
          - title: Using formulas
            id: mat-using-formulas
            brief: Substituting values into a formula, such as cost = 40 + 25 × hours, to work out a result.
          - title: Solving simple equations
            id: mat-solving-simple-equations
            brief: Undoing operations in reverse order to find an unknown, such as 3x + 5 = 20.

      - title: Summarising and comparing data
        id: vic-mat-fnd-u12-2-2
        points:
          - title: Mean, median and spread
            id: mat-mean-median-range-context
            brief: The mean and median give a typical value; the range and interquartile range show how spread out the data is.
          - title: Comparing data sets
            id: mat-comparing-data-sets
            brief: Putting two sets of data side by side, such as two teams' scores, with graphs and summary numbers, to draw a fair conclusion.

      - title: Managing money
        id: vic-mat-fnd-u12-2-3
        points:
          - title: Comparing products
            id: mat-unit-pricing
            brief: Comparing price per unit, features and terms, such as across phone plans or health products, to make an informed choice.
          - title: Personal budgets
            id: mat-personal-budgets
            brief: A budget lists income and expenses so spending stays within income and savings goals can be met.
          - title: Planning for life stages
            id: mat-planning-life-stages
            brief: Money needs change from school to work, renting, family and retirement, so plans change too.
          - title: Study debts and government support
            id: mat-study-debts-government-support
            brief: HECS-HELP loans are repaid through tax once income passes a threshold. Payments such as child-care support reduce costs.
          - title: Financial trends
            id: mat-financial-trends
            brief: Data on prices (CPI), interest rates, wages and house prices over time shows how costs and incomes are changing.

      - title: Shape and location
        id: vic-mat-fnd-u12-2-4
        points:
          - title: Shapes and objects
            id: mat-shapes-objects
            brief: Naming and describing simple and composite shapes and objects by their sides, angles, faces and edges.
          - title: Reading plans and diagrams
            id: mat-reading-plans-diagrams
            brief: House plans and diagrams use scales and symbols to show real sizes and layouts.
          - title: Scale and maps
            id: mat-scale-maps
            brief: A scale such as 1:50 000 turns map distances into real distances.
          - title: Routes and travel times
            id: mat-routes-travel-times
            brief: Planning a route with maps or apps, using distance and speed to estimate how long a trip will take.
