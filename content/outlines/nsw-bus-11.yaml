units:
  - title: Nature of business
    chapters:
      - title: Role of business
        id: nsw-bus-11-1-1
        points:
          - title: What a business is
            id: bus-business
            brief: An organisation that brings together resources to provide goods or services to customers, usually to make a profit. Not-for-profit organisations exist, but this course is about businesses.
          - title: Goods and services
            id: bus-goods-services
            brief: Goods are physical things a customer can own. Services are actions done for a customer. Many businesses sell both, such as a café selling food and table service.
          - title: Profit
            id: bus-profit
            brief: Profit is revenue minus expenses. It rewards owners for the risk they take and pays for growth. When expenses are more than revenue, the business makes a loss.
          - title: Business in the economy
            id: bus-business-economy
            brief: Businesses provide jobs and incomes, pay taxes that fund government services, and their output adds to the economy and to living standards. They can also harm quality of life, such as through pollution.
          - title: Entrepreneurship and innovation
            id: bus-entrepreneurship-innovation
            brief: An entrepreneur sees an opportunity and takes on the risk of starting a business. Innovation is a new or better product or way of working, and it drives competition between businesses.

      - title: Types of business
        id: nsw-bus-11-1-2
        points:
          - title: Size of a business
            id: bus-size-business
            brief: Classifying businesses by number of employees. The ABS counts a small business as fewer than 20 employees, medium as 20 to 199, and large as 200 or more. Most Australian businesses are small.
          - title: Industry sectors
            id: bus-industry-sectors
            brief: Primary (taking natural resources, such as farming and mining), secondary (making goods, such as manufacturing and construction), tertiary (services), quaternary (information and knowledge), and quinary (human services such as care, often not for profit).
          - title: Local, national and global businesses
            id: bus-local-national-global-businesses
            brief: Classifying businesses by how far they reach. A local business serves its area, a national one the whole country, and a global one many countries.
          - title: Sole traders and partnerships
            id: bus-sole-traders-partnerships
            brief: Unincorporated businesses. A sole trader has one owner, and a partnership two or more. They are easy and cheap to start, but the owners have unlimited liability, so they can lose their own assets to pay the business's debts.
          - title: Companies and limited liability
            id: bus-companies-limited-liability
            brief: An incorporated business is a legal entity separate from its owners, the shareholders, whose liability is limited to what they put in. A private company (Pty Ltd) cannot sell shares to the public. A public company (Ltd) can, and is often listed on the ASX.
          - title: Government enterprises
            id: bus-government-enterprises
            brief: Businesses owned by a government, such as Australia Post. They provide a service the government wants provided, and may also aim to make a profit.

      - title: Influences on business
        id: nsw-bus-11-1-3
        points:
          - title: The external environment
            id: bus-external-environment
            brief: Forces outside a business that it cannot control but must respond to. Split into the general environment, which affects all businesses, and the market (operating) environment of customers, suppliers and competitors.
          - title: Economic and financial influences
            id: bus-economic-financial-influences
            brief: How economic conditions (growth, recession, inflation, exchange rates) and financial conditions (interest rates and how easy it is to borrow) change what a business can sell and what it costs to operate.
          - title: Social, legal and political influences
            id: bus-social-legal-political-influences
            brief: Changes in society (tastes, values, the age of the population), laws a business must follow, and government policies all change how a business operates.
          - title: Technological, geographic and institutional influences
            id: bus-technological-geographic-institutional-influences
            brief: New technology changes products and ways of working. Location, climate and distance affect costs and customers. Institutions such as the ATO and the ACCC set and enforce rules a business works within.
          - title: Customers, suppliers and competitors
            id: bus-customers-suppliers-competitors
            brief: The market environment. Customers decide what sells, suppliers set the price and quality of inputs, and competitors push a business to improve or lower prices.
          - title: The internal environment
            id: bus-internal-environment
            brief: Things inside a business that it can control, such as its products, its location, its resources (people, money, equipment), and its management and culture.

      - title: Business growth and decline
        id: nsw-bus-11-1-4
        points:
          - title: Establishment and growth
            id: bus-establishment-growth
            brief: The first two stages of the business life cycle. Establishment is the risky start, with low sales and cash flow problems. Growth brings rising sales and profits, more staff, and new challenges in management and finance.
          - title: Maturity and after
            id: bus-maturity-after
            brief: At maturity, sales level off. After maturity a business may reach a steady state, renew itself (new products, new markets), or decline and close.
          - title: Why businesses close
            id: bus-businesses-close
            brief: A business can close by choice (the owner retires, sells or moves on) or be forced to close when it cannot pay its debts. Insolvency, and the legal processes of bankruptcy for a person and liquidation for a company.
