# Australian Curriculum Mathematics, Year 8: the Number, Algebra, Measurement, Space, Statistics and Probability
# strands, 40 points.
# Follows ACARA's Australian Curriculum: Mathematics, Version 9.0, Year 8, checked on the official site
# (australiancurriculum.edu.au) in November 2026. Ministers approved Version 9.0 in April 2022 and ACARA published it in
# May 2022. Each state sets its own start: the ACT from 2024, Tasmania from 2023, the NT from 2025, WA (its own Western
# Australian Curriculum, adapted from it) from 2026, Queensland by the end of 2026, and South Australia's public schools
# (their own adapted version) by about 2027. ACARA has announced no new version for Years 7 to 10: the next full
# version is scheduled for approval in 2032 (an iterative review covers Foundation to Year 2 mathematics only).
# Each strand is a unit, and its content descriptions are grouped into chapters in the curriculum's order. The codes
# are ACARA's content description codes. Modelling content descriptions (AC9M8N05, AC9M8A03, AC9M8M07) are taught
# through the methods they use, such as percentage change and linear models. Digital tools, investigations and the
# algorithm design in AC9M8SP04 are left out, except for the ideas behind them.
# Cards and multiple choice for now (kind: maths). Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-mat-8
subject: Mathematics
bank: mat
name: Mathematics, Year 8
about: Australian Curriculum, Year 8
short: Mathematics
years: [8]
place: [qld, sa, wa, tas, act, nt]
kind: maths
syllabus: "Australian Curriculum: Mathematics, Version 9.0, Year 8"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [index laws, Pythagoras, area of a circle, congruence, sampling, Venn diagram]

units:
  - title: Number
    chapters:
      - title: Irrational numbers, indices and decimals
        id: ac-mat-8-1-1
        points:
          - title: Rational and irrational numbers
            id: mat-rational-irrational-numbers
            codes: [AC9M8N01]
            brief: A rational number can be written as a fraction of two integers. An irrational number, such as π or √2, cannot, and its decimal never ends or repeats.
          - title: Multiplying and dividing powers
            id: mat-multiplying-dividing-powers
            codes: [AC9M8N02]
            brief: With the same base, multiply powers by adding the indices and divide by subtracting them, so 3⁴ × 3² = 3⁶ and 5⁷ ÷ 5³ = 5⁴.
          - title: Power of a power and the zero index
            id: mat-power-power-zero-index
            codes: [AC9M8N02]
            brief: A power raised to a power multiplies the indices, so (2³)² = 2⁶, and any non-zero number to the power 0 equals 1.
          - title: Terminating and recurring decimals
            id: mat-terminating-recurring-decimals
            codes: [AC9M8N03]
            brief: Dividing top by bottom turns a fraction into a decimal that either ends, such as 3/8 = 0.375, or repeats, such as 1/3 = 0.333..., shown with a dot or bar.

      - title: Integers, rational numbers and percentages
        id: ac-mat-8-1-2
        points:
          - title: Multiplying and dividing integers
            id: mat-multiplying-dividing-integers
            codes: [AC9M8N04]
            brief: Two numbers with the same sign multiply or divide to a positive, and different signs give a negative, so −6 × −3 = 18 and 20 ÷ −4 = −5.
          - title: Operations with negative fractions and decimals
            id: mat-operations-with-negative-fractions
            codes: [AC9M8N04]
            brief: The sign rules for integers also apply to negative fractions and decimals, such as −1/2 × 3/4 = −3/8.
          - title: Percentage increase and decrease
            id: mat-percentage-increase-decrease-2-ac
            codes: [AC9M8N05]
            brief: Find a new amount after a percentage change by multiplying by a single factor, such as 1.15 for a 15% increase or 0.8 for a 20% decrease.
          - title: Profit, loss and percentage change
            id: mat-profit-loss-percentage-change
            codes: [AC9M8N05]
            brief: Profit or loss is selling price minus cost price, and percentage change is the change divided by the original amount, times 100.

  - title: Algebra
    chapters:
      - title: Linear expressions
        id: ac-mat-8-2-1
        points:
          - title: Collecting like terms
            id: mat-collecting-like-terms
            codes: [AC9M8A01]
            brief: Like terms have the same variables with the same powers, such as 3x and −5x, and only like terms can be added or subtracted.
          - title: Expanding brackets
            id: mat-expanding-brackets
            codes: [AC9M8A01]
            brief: The distributive law multiplies each term inside the brackets by the term outside, so 3(2x − 4) = 6x − 12.
          - title: Factorising by the highest common factor
            id: mat-factorising-by-highest-common
            codes: [AC9M8A01]
            brief: Factorising is the reverse of expanding, taking out the highest common factor, so 8x + 12 = 4(2x + 3).
          - title: Properties of operations in algebra
            id: mat-properties-operations-algebra
            codes: [AC9M8A01]
            brief: The commutative, associative, identity and inverse properties explain why terms can be reordered and regrouped when simplifying, such as a + b = b + a.

      - title: Linear equations, inequalities and graphs
        id: ac-mat-8-2-2
        points:
          - title: Equations with brackets and variables on both sides
            id: mat-equations-with-brackets-variables
            codes: [AC9M8A02]
            brief: Expand any brackets, collect the variable terms on one side and the numbers on the other, then solve, so 5x − 3 = 2x + 9 gives x = 4.
          - title: Solving one-variable inequalities
            id: mat-solving-one-variable-inequalities
            codes: [AC9M8A02]
            brief: Inequalities are solved like equations, and the solution, such as x > 3, is a range of values shown on a number line with an open or closed circle.
          - title: Graphing linear relations
            id: mat-graphing-linear-relations-2
            codes: [AC9M8A02]
            brief: A rule such as y = 2x − 1 gives a table of values whose points lie on a straight line when plotted.
          - title: Solving an equation from a graph
            id: mat-solving-equation-from-graph
            codes: [AC9M8A02]
            brief: The x-value where a line reaches a given y-value solves the matching equation, and two lines cross where both rules are true.
          - title: Linear models
            id: mat-linear-models-2
            codes: [AC9M8A03, AC9M8A04]
            brief: A fixed amount plus a rate, such as a $20 fee plus $15 an hour, gives a linear rule, C = 15h + 20, where the rate sets the steepness.

  - title: Measurement
    chapters:
      - title: Area, circles and volume
        id: ac-mat-8-3-1
        points:
          - title: Area of trapeziums, rhombuses and kites
            id: mat-area-trapeziums-rhombuses-kites
            codes: [AC9M8M01]
            brief: A trapezium's area is half the sum of the parallel sides times the height, and a rhombus or kite's is half the product of its diagonals.
          - title: Area and perimeter of composite shapes
            id: mat-area-perimeter-composite-shapes
            codes: [AC9M8M01]
            brief: Split a composite shape into simple shapes, then add their areas, or subtract a cut-out part, and trace the outside edge for the perimeter.
          - title: Circumference of a circle
            id: mat-circumference-circle
            codes: [AC9M8M03]
            brief: The circumference is π times the diameter, C = πd, or 2πr using the radius.
          - title: Area of a circle
            id: mat-area-circle
            codes: [AC9M8M03]
            brief: A circle's area is π times the radius squared, A = πr², so a circle of radius 5 cm has area about 78.5 cm².
          - title: Volume and capacity of prisms
            id: mat-volume-capacity-prisms
            codes: [AC9M8M02]
            brief: A prism's volume is cross-section area times length, and capacity links to volume, since 1 cm³ holds 1 mL and 1000 cm³ holds 1 L.

      - title: Time, rates and Pythagoras
        id: ac-mat-8-3-2
        points:
          - title: Duration and 24-hour time
            id: mat-duration-24-hour-time
            codes: [AC9M8M04]
            brief: Converting between 12-hour and 24-hour time, such as 3:45 pm as 1545, and working out how long an event lasts.
          - title: Time zones
            id: mat-time-zones-2
            codes: [AC9M8M04]
            brief: Places in different time zones keep different clock times, so adding or subtracting the time difference gives the local time somewhere else.
          - title: Rates and best buys
            id: mat-rates-best-buys
            codes: [AC9M8M05, AC9M8M07]
            brief: A rate compares two quantities with different units, such as km/h or $/kg, and unit rates show which of two deals is the better buy.
          - title: Pythagoras' theorem for the hypotenuse
            id: mat-pythagoras-theorem-hypotenuse
            codes: [AC9M8M06]
            brief: In a right-angled triangle, the square of the hypotenuse equals the sum of the squares of the other two sides, c² = a² + b².
          - title: Pythagoras' theorem for a shorter side
            id: mat-pythagoras-theorem-shorter-side
            codes: [AC9M8M06]
            brief: To find a shorter side, subtract the square of the known short side from the square of the hypotenuse, a² = c² − b², then take the square root.

  - title: Space
    chapters:
      - title: Congruence, similarity and position
        id: ac-mat-8-4-1
        points:
          - title: Tests for congruent triangles
            id: mat-tests-congruent-triangles
            codes: [AC9M8SP01]
            brief: Two triangles are congruent if they match by SSS, SAS, AAS or RHS, so they are the same shape and size.
          - title: Similar shapes and scale factor
            id: mat-similar-shapes-scale-factor
            codes: [AC9M8SP01]
            brief: Similar shapes have equal angles and sides in the same ratio, and the scale factor is a side of the image divided by the matching side of the original.
          - title: Properties of quadrilaterals
            id: mat-properties-quadrilaterals
            codes: [AC9M8SP02]
            brief: Congruent triangles explain the properties of quadrilaterals, such as a parallelogram's opposite sides being equal and its diagonals bisecting each other.
          - title: Locating points in three dimensions
            id: mat-locating-points-three-dimensions
            codes: [AC9M8SP03]
            brief: A point in space is given by three coordinates, (x, y, z), measured along three axes at right angles to each other.

  - title: Statistics
    chapters:
      - title: Collecting data and sampling
        id: ac-mat-8-5-1
        points:
          - title: Census, sample, experiment and observation
            id: mat-census-sample-experiment-observation
            codes: [AC9M8ST01]
            brief: A census collects data from a whole population, a sample from part of it, and experiments and observations are other ways to collect data, each with costs and limits.
          - title: Primary and secondary data
            id: mat-primary-secondary-data
            codes: [AC9M8ST02]
            brief: Primary data is collected yourself for your question, and secondary data comes from someone else, such as a government report.
          - title: Random and non-random sampling
            id: mat-random-non-random-sampling
            codes: [AC9M8ST02]
            brief: In a random sample every member has an equal chance of being picked, while non-random samples, such as asking only friends, can give biased results.
          - title: Sample size and variation
            id: mat-sample-size-variation
            codes: [AC9M8ST03]
            brief: Different random samples from the same population give different results, and larger samples vary less and estimate the population better.
          - title: Making inferences from a sample
            id: mat-making-inferences-from-sample
            codes: [AC9M8ST04]
            brief: A sample's results are used to estimate something about the whole population, such as its mean, while accepting that the estimate is uncertain.

  - title: Probability
    chapters:
      - title: Complementary and combined events
        id: ac-mat-8-6-1
        points:
          - title: Complementary events
            id: mat-complementary-events-2
            codes: [AC9M8P01]
            brief: An event and its complement, not the event, have probabilities that add to 1, so if P(rain) = 0.3 then P(no rain) = 0.7.
          - title: Two-way tables
            id: mat-two-way-tables-2
            codes: [AC9M8P02]
            brief: A two-way table shows every combination of two events, such as rolling a die and tossing a coin, and is used to find probabilities.
          - title: Venn diagrams
            id: mat-venn-diagrams
            codes: [AC9M8P02]
            brief: Overlapping circles show events, where the overlap is A and B, and everything inside either circle is A or B.
          - title: Tree diagrams for two events
            id: mat-tree-diagrams-two-events
            codes: [AC9M8P02, AC9M8P03]
            brief: Each branch of a tree diagram shows an outcome, and following the branches lists every combined outcome of two steps.
