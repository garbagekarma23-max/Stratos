# Australian Curriculum Geography, Year 7: Water in the world, and Place and liveability, 41 points.
# Follows the Australian Curriculum: Humanities and Social Sciences, Geography 7-10, Version 9.0, Year 7 (ACARA's
# curriculum content and About the subject documents, australiancurriculum.edu.au). Checked on the official site in
# November 2026. Version 9.0 was approved by education ministers in April 2022 and released in May 2022. Each state and
# territory sets when its schools teach it, with full implementation expected by 2027 (Western Australia teaches its own
# version adapted from it). No new version is announced: ministers have scheduled the next full version for 2032.
# Structure: the seven geographical concepts and the inquiry skills are the first unit. Each Knowledge and understanding
# sub-strand (Water in the world, Place and liveability) is a unit, and each content description is a chapter, or two
# share one when small. Codes are ACARA's content description codes.
# Where schools choose: the hazard is drought, floods and tropical cyclones; the Asian examples are the Mekong Delta and
# the Ganges; the European example is Copenhagen. Other hazards and places can be added.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-geo-7
subject: Geography
bank: geo
name: Geography, Year 7
about: "Australian Curriculum, Year 7: Water in the world, Place and liveability"
short: Geography
years: [7]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Geography, Version 9.0, Year 7"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [water cycle, water scarcity, drought, liveability, latitude]

units:
  - title: Thinking geographically
    chapters:
      - title: The geographical concepts
        id: ac-geo-7-1-1
        points:
          - title: Place
            id: geo-place
            brief: A place is a part of the Earth's surface that people give meaning to. Geographers describe what a place is like and why people value it differently.
          - title: Space
            id: geo-space
            brief: Space is about where things are and how they are spread out. Geographers look at location, distance and the pattern something makes on a map.
          - title: Environment
            id: geo-environment
            brief: The environment is the living and non-living world around us. People depend on it and change it, and it shapes how people live.
          - title: Interconnection
            id: geo-interconnection
            brief: Nothing in geography stands alone. People, places and environments are linked, so a change in one place can affect another far away.
          - title: Sustainability
            id: geo-sustainability
            brief: Sustainability means using environments in ways that let them keep supporting people and other living things into the future.
          - title: Scale
            id: geo-scale-2
            brief: Geographers study things at local, regional, national and global scales, and the cause of something can look different at each scale.
          - title: Change
            id: geo-change
            brief: Places and environments change over time, some quickly and some over centuries. Knowing why they changed helps predict what comes next.

      - title: Maps and inquiry
        id: ac-geo-7-1-2
        points:
          - title: Map conventions
            id: geo-map-conventions
            brief: A good map has a border, orientation (a north arrow), a legend, a title, a scale and a source, often remembered as BOLTSS.
            codes: [AC9HG7S02]
          - title: Latitude and longitude
            id: geo-latitude-longitude
            brief: Lines of latitude run east to west and measure degrees north or south of the equator. Lines of longitude measure degrees east or west of the prime meridian.
            codes: [AC9HG7S02]
          - title: Describing a distribution
            id: geo-describing-distribution
            brief: A distribution is how something is spread across space. Geographers describe it as clustered, scattered, linear or even, and say where it is most and least common.
            codes: [AC9HG7S03]
          - title: Primary and secondary data
            id: geo-primary-secondary-data
            brief: Primary data is collected first-hand, such as a survey or fieldwork. Secondary data was collected by someone else, such as census figures or a report.
            codes: [AC9HG7S01, AC9HG7S02]

  - title: Water in the world
    chapters:
      - title: Water as a resource
        id: ac-geo-7-2-1
        points:
          - title: Renewable, non-renewable and continuous resources
            id: geo-renewable-non-renewable-continuous
            brief: Renewable resources, such as forests, can replace themselves. Non-renewable ones, such as coal, run out. Continuous ones, such as sunlight and wind, never run out.
            codes: [AC9HG7K01]
          - title: The water cycle
            id: geo-water-cycle-2
            brief: Water evaporates, condenses into clouds, falls as precipitation, then runs off over land or soaks into the ground and back to the sea.
            codes: [AC9HG7K01]
          - title: Forms of water
            id: geo-forms-water
            brief: Most of Earth's water is salt water, and much of the fresh water is ice or groundwater. Water vapour, ice and salt water can all become a resource.
            codes: [AC9HG7K01]
          - title: Green water and blue water
            id: geo-green-water-blue-water
            brief: Green water is the moisture held in soil that plants use. Blue water is the water in rivers, lakes, dams and underground that people can collect.
            codes: [AC9HG7K01]
          - title: How moving water changes places
            id: geo-moving-water-changes-places
            brief: Moving water links places, carrying water and soil downstream. It also erodes rock and soil, cutting valleys and shaping the land.
            codes: [AC9HG7K01]

      - title: Water in Australia
        id: ac-geo-7-2-2
        points:
          - title: Where Australia's water is
            id: geo-where-australia-s-water
            brief: Australia is the driest inhabited continent. Rain falls most on the north and east coasts, and large stores of groundwater lie under the inland, such as the Great Artesian Basin.
            codes: [AC9HG7K02]
          - title: Why water supply varies
            id: geo-water-supply-varies
            brief: Climate, seasons, landforms and high evaporation make rainfall and river flow vary a lot from place to place and year to year in Australia.
            codes: [AC9HG7K02]
          - title: Physical and economic water scarcity
            id: geo-physical-economic-water-scarcity
            brief: Physical scarcity is when there is not enough water. Economic scarcity is when water exists but people cannot reach it, because dams, pipes or money are lacking.
            codes: [AC9HG7K02]
          - title: Competing uses of water
            id: geo-competing-uses-water
            brief: Farms, towns, industry and rivers themselves all need water, so sharing it is hard, especially in dry years.
            codes: [AC9HG7K02]
          - title: Managing water sustainably
            id: geo-managing-water-sustainably
            brief: Ways to make water last include recycling grey water, harvesting stormwater, desalination, water trading and using less at home and on farms.
            codes: [AC9HG7K02]

      - title: Why water matters to people
        id: ac-geo-7-2-3
        points:
          - title: The economic value of water
            id: geo-economic-value-water
            brief: Water supports farms and towns. The Murrumbidgee Irrigation Area in New South Wales and the Mekong Delta in Vietnam both grow rice with irrigation.
            codes: [AC9HG7K03]
          - title: Water and First Nations Australians
            id: geo-water-first-nations-australians
            brief: For First Nations Australians, rivers, waterholes, soaks and springs carry cultural and spiritual meaning and connect people to Country, as well as giving water and food.
            codes: [AC9HG7K03]
          - title: Water's beauty and spiritual meaning
            id: geo-water-s-beauty-spiritual
            brief: People value water for its beauty, such as waterfalls and bays protected as national parks or World Heritage sites, and for its spiritual meaning, such as the Ganges for Hindus.
            codes: [AC9HG7K03]

      - title: Water hazards
        id: ac-geo-7-2-4
        points:
          - title: What makes a natural hazard
            id: geo-makes-natural-hazard
            brief: A natural event becomes a hazard when it can harm people or property. Atmospheric hazards come from the weather, and hydrological hazards come from water.
            codes: [AC9HG7K04]
          - title: Drought
            id: geo-drought
            brief: A drought is a long period of below-average rainfall. It dries out soil and dams, hurts farms and towns, and builds slowly over months or years.
            codes: [AC9HG7K04]
          - title: Floods and tropical cyclones
            id: geo-floods-tropical-cyclones
            brief: Floods happen when heavy rain overfills rivers or drains. Tropical cyclones form over warm seas and bring destructive winds, heavy rain and storm surges.
            codes: [AC9HG7K04]
          - title: Prevention, mitigation and preparedness
            id: geo-prevention-mitigation-preparedness
            brief: Prevention stops harm happening, mitigation reduces the harm, and preparedness gets people ready, such as levees, building rules and warning systems.
            codes: [AC9HG7K04]

  - title: Place and liveability
    chapters:
      - title: Choosing where to live
        id: ac-geo-7-3-1
        points:
          - title: What liveability means
            id: geo-liveability-means
            brief: Liveability is how well a place meets people's needs for a good life, such as safety, services, jobs, a clean environment and things to do.
            codes: [AC9HG7K05]
          - title: Measuring liveability
            id: geo-measuring-liveability
            brief: Objective measures count things, such as transport or hospitals. Subjective measures ask people how they feel about a place, so the same place can rate differently.
            codes: [AC9HG7K05]
          - title: Environmental quality and where people live
            id: geo-environmental-quality-where-people
            brief: Clean air and water, green space, views and a pleasant climate draw people to a place, and pollution pushes them away.
            codes: [AC9HG7K05]
          - title: Reasons people move to a place
            id: geo-reasons-people-move-place
            brief: People choose where to live for work, family and culture, or a lifestyle change, such as a tree change to the country or a sea change to the coast.
            codes: [AC9HG7K05]

      - title: Services and belonging
        id: ac-geo-7-3-2
        points:
          - title: Types of settlement
            id: geo-types-settlement
            brief: Australian settlements range from urban cities to rural towns, remote and very remote communities, depending on their size and distance from services.
            codes: [AC9HG7K06]
          - title: Access to services
            id: geo-access-services
            brief: Hospitals, schools and shops cluster in cities, so people in remote places often travel far for them, which affects liveability.
            codes: [AC9HG7K06]
          - title: Transport, technology and access
            id: geo-transport-technology-access
            brief: Public transport, roads and the internet let people reach services and activities. Without them, a place is harder to live in.
            codes: [AC9HG7K06]
          - title: Feeling safe and connected
            id: geo-feeling-safe-connected
            brief: People rate a place as more liveable when they feel safe, included and connected to others there, and less when they feel left out or threatened.
            codes: [AC9HG7K07]
          - title: Connection to Country
            id: geo-connection-country
            brief: First Nations Australians have deep connections to Country/Place through family, culture and history, including dispossession and relocation, which shape identity and belonging.
            codes: [AC9HG7K07]

      - title: Making places more liveable
        id: ac-geo-7-3-3
        points:
          - title: Strategies to improve liveability
            id: geo-strategies-improve-liveability
            brief: Councils make places more liveable with better public spaces, walking and cycling paths, transport links and waste and recycling services.
            codes: [AC9HG7K08]
          - title: Liveability for everyone
            id: geo-liveability-everyone
            brief: A liveable place works for young people, older people and people with disability, such as with ramps, parks for teenagers and good public transport.
            codes: [AC9HG7K08]
          - title: Learning from Europe
            id: geo-learning-from-europe
            brief: Cities such as Copenhagen built safe bike lanes and car-free streets, and Australian cities can judge whether those ideas would work locally.
            codes: [AC9HG7K08]
          - title: Judging a liveability strategy
            id: geo-judging-liveability-strategy
            brief: To judge a strategy, set criteria such as cost, who benefits and its effect on the environment, then weigh the strategy against each one.
            codes: [AC9HG7K08, AC9HG7S05]
