# NSW Ancient History, Year 12: the core study and one option in each of the other three sections, 38 points.
# Drafted from NESA's Ancient History Stage 6 Syllabus (2017), the syllabus taught in Year 12 until the 2027 HSC. The
# structure follows the syllabus: the core and each section are units. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Schools pick one option in each of Ancient societies, Personalities in their times, and Historical periods. This
# outline has one per section: Spartan society, Hatshepsut, and The Augustan age. Check these are offered in NESA's
# option list, and add other options as units.
# In transition: the Ancient History 11-12 Syllabus (2024) replaces this one for Year 12 from Term 4 2027 (first HSC 2028).

id: nsw-anc-12
subject: Ancient History
bank: anc
name: Ancient History, Year 12
about: HSC, Pompeii and Herculaneum, Sparta, Hatshepsut and Augustus
short: Ancient History
years: [12]
place: nsw
kind: standard
syllabus: NSW Ancient History Stage 6 Syllabus (2017), Year 12 course, the core and one option per section
note: Follows the NSW Ancient History syllabus. Not made or endorsed by NESA.
chips: [Vesuvius, helots, ephors, Deir el-Bahri, Actium]

units:
  - title: Cities of Vesuvius, Pompeii and Herculaneum
    chapters:
      - title: The eruption and the evidence
        id: nsw-anc-12-1-1
        points:
          - title: The setting of Pompeii and Herculaneum
            id: anc-setting-pompeii-herculaneum
            brief: Two Roman towns on the Bay of Naples, Pompeii a busy trading town and Herculaneum a smaller seaside town, both near Mount Vesuvius.
          - title: The eruption of AD 79
            id: anc-eruption-ad-79
            brief: Vesuvius buried Pompeii in ash and pumice and Herculaneum in deep pyroclastic flows, which preserved the two towns differently.
          - title: Pliny the Younger's letters
            id: anc-pliny-younger-s-letters
            brief: Pliny the Younger described the eruption and his uncle's death in two letters to the historian Tacitus, the only eyewitness written account.
          - title: The history of excavation
            id: anc-history-excavation
            brief: Early digs from the 1700s hunted treasure. Fiorelli in the 1860s began careful records and plaster casts of bodies. Excavation goes on today.
          - title: Human remains as evidence
            id: anc-human-remains-as-evidence
            brief: Skeletons found at Herculaneum's boat sheds in the 1980s and 1990s reveal the health, diet and ages of the victims.

      - title: Life in the towns
        id: nsw-anc-12-1-2
        points:
          - title: The economy
            id: anc-economy
            brief: The towns traded wine, garum (fish sauce) and cloth. Shops, bakeries, fulleries and inns show a busy local economy.
          - title: Social structure
            id: anc-social-structure
            brief: Society included elite families, freedmen, slaves and women of different ranks. Freedmen could become rich and powerful.
          - title: Local politics
            id: anc-local-politics
            brief: Painted election notices on walls show candidates for local offices and who supported them.
          - title: Religion
            id: anc-religion
            brief: Temples to Roman gods and to the Egyptian goddess Isis, and household shrines called lararia, show public and private worship.
          - title: Houses and daily life
            id: anc-houses-daily-life
            brief: Houses such as the House of the Faun show wealth through wall paintings, mosaics and gardens, while graffiti records everyday thoughts.
          - title: Leisure
            id: anc-leisure
            brief: Public baths, theatres and the amphitheatre, the oldest surviving stone one, were centres of social life.

      - title: Issues today
        id: nsw-anc-12-1-3
        points:
          - title: Conserving the sites
            id: anc-conserving-sites
            brief: Weather, tourism, earlier poor restorations and collapses, such as the House of the Gladiators in 2010, threaten the sites.
          - title: Tourism and the sites
            id: anc-tourism-sites
            brief: Millions visit each year, which pays for conservation but also wears the sites down.
          - title: Changing interpretations
            id: anc-changing-interpretations
            brief: New technology and new excavations keep changing what historians think about the towns, such as the date of the eruption.

  - title: Spartan society to the Battle of Leuctra, 371 BC
    chapters:
      - title: Spartan society
        id: nsw-anc-12-2-1
        points:
          - title: The geography of Sparta
            id: anc-geography-sparta
            brief: Sparta lay in the fertile Eurotas valley in Laconia, ringed by mountains, and conquered neighbouring Messenia.
          - title: Spartiates, perioikoi and helots
            id: anc-spartiates-perioikoi-helots
            brief: Full citizens (Spartiates) were soldiers. The perioikoi were free non-citizens who traded and crafted. Helots were state-owned serfs who farmed the land.
          - title: The government of Sparta
            id: anc-government-sparta
            brief: Two kings, a council of elders (the gerousia), five ephors elected each year and an assembly of citizens shared power.
          - title: The agoge
            id: anc-agoge
            brief: Spartan boys left home at seven for a harsh state training in obedience, endurance and fighting.
          - title: Women in Sparta
            id: anc-women-sparta
            brief: Spartan women exercised, owned land and ran households while men served in the army, giving them more freedom than women in Athens.

      - title: Sparta's army and decline
        id: nsw-anc-12-2-2
        points:
          - title: The Spartan army
            id: anc-spartan-army
            brief: Spartans fought as hoplites in a phalanx, and their discipline made them the most feared soldiers in Greece.
          - title: Fear of helot revolt
            id: anc-fear-helot-revolt
            brief: Spartans, greatly outnumbered by helots, feared revolt, which shaped their military way of life and harsh control.
          - title: Religion and festivals
            id: anc-religion-festivals
            brief: Festivals such as the Karneia and Hyakinthia were central to Spartan life, and Spartans sometimes delayed going to war to complete them.
          - title: The Battle of Leuctra
            id: anc-battle-leuctra
            brief: In 371 BC Thebes defeated Sparta at Leuctra, breaking Spartan military power and soon freeing Messenia.

  - title: Hatshepsut
    chapters:
      - title: Hatshepsut's rise and reign
        id: nsw-anc-12-3-1
        points:
          - title: Hatshepsut's family background
            id: anc-hatshepsut-s-family-background
            brief: Hatshepsut was the daughter of Thutmose I and wife of Thutmose II, and became regent for the young Thutmose III.
          - title: Becoming pharaoh
            id: anc-becoming-pharaoh
            brief: Within a few years she took the full titles of pharaoh and ruled as co-regent with Thutmose III.
          - title: Claiming legitimacy
            id: anc-claiming-legitimacy
            brief: She used images of herself as a male king and a story of divine birth from the god Amun to support her right to rule.
          - title: Building at Deir el-Bahri
            id: anc-building-at-deir-el
            brief: Her mortuary temple at Deir el-Bahri, with its terraces and reliefs, recorded her achievements and her link to Amun.
          - title: The expedition to Punt
            id: anc-expedition-punt
            brief: Reliefs at Deir el-Bahri show a trading expedition to Punt that brought back incense trees, gold and exotic animals.
          - title: Erasure and evaluation
            id: anc-erasure-evaluation
            brief: Late in Thutmose III's reign many of her images were destroyed. Historians debate why, and how to judge her reign.

  - title: The Augustan age, 44 BC to AD 14
    chapters:
      - title: From Octavian to Augustus
        id: nsw-anc-12-4-1
        points:
          - title: Octavian after Caesar's death
            id: anc-octavian-after-caesar-s
            brief: Named heir in Julius Caesar's will, the young Octavian used Caesar's name and soldiers to win power after 44 BC.
          - title: The Second Triumvirate
            id: anc-second-triumvirate
            brief: Octavian, Mark Antony and Lepidus took power together in 43 BC and defeated Caesar's assassins at Philippi in 42 BC.
          - title: The Battle of Actium
            id: anc-battle-actium
            brief: In 31 BC Octavian's fleet under Agrippa defeated Antony and Cleopatra at Actium, leaving Octavian sole ruler.
          - title: The settlements of 27 and 23 BC
            id: anc-settlements-27-23-bc
            brief: Octavian appeared to restore the Republic and took the name Augustus, while gaining powers that let him control the provinces, the army and the state.

      - title: Augustus's rule
        id: nsw-anc-12-4-2
        points:
          - title: The powers of Augustus
            id: anc-powers-augustus
            brief: Augustus held tribunician power and command of the armies, and called himself princeps, first citizen, to avoid the title of king.
          - title: Social and moral reform
            id: anc-social-moral-reform
            brief: Laws encouraged marriage and children among the upper classes and punished adultery.
          - title: Building and propaganda
            id: anc-building-propaganda
            brief: Monuments such as the Ara Pacis and the Forum of Augustus, coins and poets such as Virgil spread the image of a peaceful golden age.
          - title: The problem of succession
            id: anc-problem-succession
            brief: Augustus's chosen heirs died one after another, until he adopted Tiberius, who succeeded him in AD 14.
          - title: Evaluating Augustus
            id: anc-evaluating-augustus
            brief: Ancient writers such as Tacitus and Suetonius judged Augustus differently, and historians debate whether he restored or ended the Republic.
