# Australian Curriculum Geography, Year 8: Landforms and landscapes, and Changing nations, 41 points.
# Follows the Australian Curriculum: Humanities and Social Sciences, Geography 7-10, Version 9.0, Year 8 (ACARA's
# curriculum content document, australiancurriculum.edu.au). Checked on the official site in November 2026. Version
# 9.0 was approved by education ministers in April 2022 and released in May 2022. Each state and territory sets when
# its schools teach it, with full implementation expected by 2027 (Western Australia teaches its own version adapted
# from it). No new version is announced: ministers have scheduled the next full version for 2032.
# Structure: the year's mapping and data skills are the first unit (the seven concepts are taught in Year 7). Each
# Knowledge and understanding sub-strand (Landforms and landscapes, Changing nations) is a unit, and each content
# description is a chapter, or two share one when small. Codes are ACARA's content description codes.
# Where schools choose: the hazards are earthquakes, volcanic eruptions, tsunamis and landslides; the landform examples
# are Uluru, Budj Bim and the Twelve Apostles; the urban study compares Australia with the United States, and the
# migration study uses Australia and China. Other examples can be added.
# Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-geo-8
subject: Geography
bank: geo
name: Geography, Year 8
about: "Australian Curriculum, Year 8: Landforms and landscapes, Changing nations"
short: Geography
years: [8]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Geography, Version 9.0, Year 8"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [landforms, erosion, earthquakes, urbanisation, migration]

units:
  - title: Geographical skills
    chapters:
      - title: Reading the land and its people
        id: ac-geo-8-1-1
        points:
          - title: Contour lines
            id: geo-contour-lines
            brief: Contour lines join places of the same height on a topographic map. Lines close together show steep land, and lines far apart show gentle slopes.
            codes: [AC9HG8S02, AC9HG8S03]
          - title: Drawing a cross-section
            id: geo-drawing-cross-section
            brief: A cross-section shows the shape of the land along a line on a map, drawn by marking where each contour crosses the line and plotting its height.
            codes: [AC9HG8S02]
          - title: Aerial and satellite images
            id: geo-aerial-satellite-images
            brief: Photos from above show land use, landforms and how places change over time, which a map may not show.
            codes: [AC9HG8S02, AC9HG8S03]
          - title: Population density
            id: geo-population-density
            brief: Population density is the number of people per square kilometre. Shading areas on a map by density shows where people crowd together and where few live.
            codes: [AC9HG8S03]

  - title: Landforms and landscapes
    chapters:
      - title: Landscapes of Australia and the world
        id: ac-geo-8-2-1
        points:
          - title: Landscapes and landforms
            id: geo-landscapes-landforms
            brief: A landscape is a large area with its own look, made of many landforms. A landform is a single feature such as a mountain, valley, dune or headland.
            codes: [AC9HG8K01]
          - title: Types of landscape
            id: geo-types-landscape
            brief: The world's main landscapes include mountains, deserts, grasslands, forests, wetlands and coasts, each shaped by climate and the rocks beneath.
            codes: [AC9HG8K01]
          - title: Australia's distinctive landscapes
            id: geo-australia-s-distinctive-landscapes
            brief: Australia is mostly flat and dry, with deserts in the centre, the Great Dividing Range in the east, tropical rainforests in the north and long coasts, and famous landforms such as Uluru.
            codes: [AC9HG8K02]

      - title: How landforms are made
        id: ac-geo-8-2-2
        points:
          - title: Plate tectonics and mountain building
            id: geo-plate-tectonics-mountain-building
            brief: The Earth's crust is broken into plates that move. Where they push together, rock is forced up into mountains such as the Himalayas.
            codes: [AC9HG8K01]
          - title: Folding and faulting
            id: geo-folding-faulting
            brief: Folding bends layers of rock into waves when they are squeezed. Faulting cracks rock so that blocks move up, down or sideways.
            codes: [AC9HG8K01]
          - title: Volcanism
            id: geo-volcanism
            brief: Volcanoes form where melted rock rises through the crust and erupts as lava, ash and gas, building new landforms such as cones and plateaus.
            codes: [AC9HG8K01]
          - title: Physical and chemical weathering
            id: geo-physical-chemical-weathering
            brief: Weathering breaks rock down where it sits. Physical weathering cracks it, such as by frost or heating and cooling, and chemical weathering changes it, such as by rusting or dissolving.
            codes: [AC9HG8K01]
          - title: Erosion, transportation and deposition
            id: geo-erosion-transportation-deposition
            brief: Water, wind, waves and ice wear rock away, carry the pieces and drop them elsewhere, building beaches and dunes and carving cliffs and stacks such as the Twelve Apostles.
            codes: [AC9HG8K01]
          - title: Rock types and landforms
            id: geo-rock-types-landforms
            brief: Igneous rock forms from cooled magma, sedimentary rock from layers of sediment, and metamorphic rock from heat and pressure. Harder rocks resist erosion and stand out.
            codes: [AC9HG8K01]

      - title: Valuing landscapes
        id: ac-geo-8-2-3
        points:
          - title: Country and landforms
            id: geo-country-landforms
            brief: For First Nations Australians, landforms are part of Country/Place. Aboriginal Dreaming and Torres Strait Islander Creation stories explain how the land was made and carry law and knowledge.
            codes: [AC9HG8K03]
          - title: Landforms with special significance
            id: geo-landforms-with-special-significance
            brief: Uluru is sacred to the Anangu, and Budj Bim in Gunditjmara Country holds ancient eel traps. Such places have names, stories and meanings for their Traditional Owners.
            codes: [AC9HG8K02, AC9HG8K03]
          - title: Landscapes, beauty and tourism
            id: geo-landscapes-beauty-tourism
            brief: People value landscapes for their beauty and spiritual meaning, such as Mount Fuji in Japan, and many draw tourists, which brings money and pressure.
            codes: [AC9HG8K03]

      - title: People changing landscapes
        id: ac-geo-8-2-4
        points:
          - title: Land clearing and erosion
            id: geo-land-clearing-erosion
            brief: Clearing forests for farms or palm oil, and overused walking tracks, strip the ground cover, so soil erodes and washes into rivers.
            codes: [AC9HG8K04]
          - title: Mining and urban development
            id: geo-mining-urban-development
            brief: Mines, quarries and new suburbs remove landforms and vegetation and can pollute water and air around them.
            codes: [AC9HG8K04]
          - title: River regulation
            id: geo-river-regulation
            brief: Dams, weirs and straightened channels control river flow for water supply and flood control, but change the floods that wetlands and fish need, as on the Murray-Darling.
            codes: [AC9HG8K04]
          - title: First Nations knowledge in managing landscapes
            id: geo-first-nations-knowledge-managing
            brief: Places such as Kakadu and Uluru-Kata Tjuta are jointly managed with Traditional Owners, whose knowledge of fire, plants and animals guides how the land is cared for.
            codes: [AC9HG8K04]

      - title: Geomorphological hazards
        id: ac-geo-8-2-5
        points:
          - title: Earthquakes
            id: geo-earthquakes
            brief: Earthquakes happen when stress builds along a fault and the rock suddenly slips, sending shaking waves through the ground.
            codes: [AC9HG8K05]
          - title: Volcanic eruptions as hazards
            id: geo-volcanic-eruptions-as-hazards
            brief: Eruptions threaten people with lava flows, falling ash, poisonous gases and fast flows of hot ash and rock.
            codes: [AC9HG8K05]
          - title: Tsunamis
            id: geo-tsunamis
            brief: A tsunami is a series of huge waves, usually set off by an undersea earthquake, that floods coasts far from where it started.
            codes: [AC9HG8K05]
          - title: Landslides and avalanches
            id: geo-landslides-avalanches
            brief: Landslides happen when soil and rock slide down a slope, often after heavy rain or land clearing. Avalanches are masses of snow sliding down a mountain.
            codes: [AC9HG8K05]
          - title: Reducing a geomorphological hazard's impact
            id: geo-reducing-geomorphological-hazard-s
            brief: Stronger buildings, warning systems, evacuation plans and keeping homes off unstable land cut the harm. Poorer places often suffer more because they have fewer of these.
            codes: [AC9HG8K05]

  - title: Changing nations
    chapters:
      - title: Urbanisation
        id: ac-geo-8-3-1
        points:
          - title: Urban growth and urbanisation
            id: geo-urban-growth-urbanisation
            brief: Urban growth is cities getting bigger. Urbanisation is a rising share of a country's people living in cities rather than the country.
            codes: [AC9HG8K06]
          - title: Push and pull factors
            id: geo-push-pull-factors
            brief: Push factors drive people away from a place, such as no jobs or drought. Pull factors draw them to a place, such as work, schools and services.
            codes: [AC9HG8K06]
          - title: Megacities and urban corridors
            id: geo-megacities-urban-corridors
            brief: A megacity has over 10 million people, such as Los Angeles with its surrounds. An urban corridor is a chain of cities joined together, such as Boston to Washington.
            codes: [AC9HG8K06]
          - title: Economic change and cities
            id: geo-economic-change-cities
            brief: When industries grow or close, cities change. Old industrial areas can decline or be rebuilt as new housing and offices, called urban renewal.
            codes: [AC9HG8K06]
          - title: Environmental effects of cities
            id: geo-environmental-effects-cities
            brief: Growing cities use more water and energy and make more waste and emissions, but dense cities can also share services more efficiently.
            codes: [AC9HG8K06]

      - title: Australia's urban pattern
        id: ac-geo-8-3-2
        points:
          - title: Urban concentration in Australia
            id: geo-urban-concentration-australia
            brief: Most Australians live in a few large coastal capital cities, so Australia is one of the most urbanised countries in the world.
            codes: [AC9HG8K07]
          - title: Causes of Australia's urban concentration
            id: geo-causes-australia-s-urban
            brief: European settlement began at ports, each colony grew around its capital, exports left from those ports, and the dry inland supports few people.
            codes: [AC9HG8K07]
          - title: Comparing Australia and the United States
            id: geo-comparing-australia-united-states
            brief: The United States has many large cities spread across the country, while Australia's are few and mostly on the coast.
            codes: [AC9HG8K07]
          - title: Density and distance from the city centre
            id: geo-density-distance-from-city
            brief: Population density is usually highest near the central business district and falls toward the rural-urban fringe.
            codes: [AC9HG8K07]
          - title: Planning for population growth
            id: geo-planning-population-growth
            brief: Governments plan for growing cities with new housing, transport, services and green space, aiming to keep them sustainable and liveable.
            codes: [AC9HG8K09]
          - title: Decentralisation
            id: geo-decentralisation
            brief: Decentralisation spreads people and jobs away from the biggest cities to regional centres. Canberra was planned partly with this aim.
            codes: [AC9HG8K09]

      - title: Migration
        id: ac-geo-8-3-3
        points:
          - title: Internal and international migration
            id: geo-internal-international-migration
            brief: Internal migration is moving within a country. International migration is moving from one country to another.
            codes: [AC9HG8K08]
          - title: Types of migration
            id: geo-types-migration
            brief: Migration can be permanent, temporary for work or study, circular back and forth, or forced, as for refugees escaping war or persecution.
            codes: [AC9HG8K08]
          - title: Mining and internal migration
            id: geo-mining-internal-migration
            brief: Mining booms draw workers to regions such as the Pilbara and the Bowen Basin, often as fly-in fly-out workers who live elsewhere.
            codes: [AC9HG8K08]
          - title: Internal migration in China
            id: geo-internal-migration-china
            brief: Hundreds of millions of people in China have moved from farms to coastal cities for factory work, growing the cities and leaving older people and children in villages.
            codes: [AC9HG8K08]
          - title: Migration and cultural diversity
            id: geo-migration-cultural-diversity
            brief: International migration has made Australia's cities culturally diverse, with migrants mostly settling in the large capitals.
            codes: [AC9HG8K08]
