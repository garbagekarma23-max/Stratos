# Australian Curriculum Science, Year 10: genetics and evolution, the universe and climate change, Newton's laws,
# the periodic table and types of reactions, with Science as a human endeavour and the ideas behind Science inquiry,
# 39 points.
# Follows ACARA's Australian Curriculum: Science, Version 9.0 (Science curriculum content, Years 7-10), checked on
# australiancurriculum.edu.au in November 2026. Version 9.0 was approved in April 2022 and released for use from 2023;
# each state and territory sets when its schools start it (Queensland schools teach every v9 learning area by the end
# of 2027). No newer version is announced. Western Australia and South Australia teach their own versions built on it.
# The Science understanding strand is a unit, with a chapter for each content description (AC9S10U01 to U07). Science
# as a human endeavour and Science inquiry share the second unit, one chapter each: inquiry is taught as the ideas
# behind an investigation, not as practical work. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-sci-10
subject: Science
bank: sci
name: Science, Year 10
about: Australian Curriculum, Year 10
short: Science
years: [10]
place: [qld, sa, wa, tas, act, nt]
kind: standard
syllabus: "Australian Curriculum: Science, Version 9.0, Year 10"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [DNA, Punnett square, natural selection, big bang, Newton's laws, periodic table]

units:
  - title: Science understanding
    chapters:
      - title: Genes and inheritance
        id: ac-sci-10-1-1
        points:
          - title: DNA, genes and chromosomes
            id: sci-dna-genes-chromosomes
            brief: DNA is a long molecule carrying genetic instructions. A gene is a section of DNA coding for a trait, and chromosomes are tightly coiled DNA in the nucleus.
            codes: [AC9S10U01]
          - title: Mitosis and meiosis
            id: sci-mitosis-meiosis
            brief: Mitosis makes two identical cells for growth and repair. Meiosis makes four gametes with half the chromosomes, each different, for sexual reproduction.
            codes: [AC9S10U01]
          - title: Alleles, genotype and phenotype
            id: sci-alleles-genotype-phenotype
            brief: Alleles are versions of a gene. The genotype is the pair of alleles an organism has, and the phenotype is the trait that shows. A dominant allele masks a recessive one.
            codes: [AC9S10U01]
          - title: Punnett squares
            id: sci-punnett-squares
            brief: A Punnett square crosses the parents' alleles to predict the chances of each genotype and phenotype in their offspring, such as 3 to 1 from two carriers.
            codes: [AC9S10U01]
          - title: Pedigrees and sex-linked traits
            id: sci-pedigrees-sex-linked-traits
            brief: A pedigree chart traces a trait through a family. Sex-linked genes sit on the X chromosome, so traits such as red-green colour blindness show more in males.
            codes: [AC9S10U01]
          - title: Mutations
            id: sci-mutations
            brief: A mutation is a change in DNA, caused by copying errors or by radiation and some chemicals. Most have no effect, some cause disorders such as cystic fibrosis.
            codes: [AC9S10U01]

      - title: Evolution
        id: ac-sci-10-1-2
        points:
          - title: Natural selection
            id: sci-natural-selection
            brief: Individuals vary, more are born than survive, and those with helpful traits survive and breed more, so the traits become common over generations.
            codes: [AC9S10U02]
          - title: Selection pressures and adaptation
            id: sci-selection-pressures-adaptation
            brief: A selection pressure, such as a predator, disease or drought, favours some variations, as when bacteria become resistant to an antibiotic.
            codes: [AC9S10U02]
          - title: How new species form
            id: sci-new-species-form
            brief: When populations are isolated, such as on islands, different pressures and mutations change them until they can no longer breed together.
            codes: [AC9S10U02]
          - title: Evidence for evolution
            id: sci-evidence-evolution
            brief: Fossils in rock layers, similar bone structures in different animals, similar DNA, and where species are found on Earth all support evolution.
            codes: [AC9S10U02]
          - title: Artificial selection
            id: sci-artificial-selection
            brief: People choose which plants and animals breed to get wanted traits, as with dog breeds or high-yield wheat, showing how selection changes a population.
            codes: [AC9S10U02]

      - title: The universe
        id: ac-sci-10-1-3
        points:
          - title: Stars, galaxies and the universe
            id: sci-stars-galaxies-universe
            brief: Stars group in galaxies such as the Milky Way, and the universe holds billions of galaxies. Large distances are measured in light-years.
            codes: [AC9S10U03]
          - title: The big bang theory
            id: sci-big-bang-theory
            brief: The universe began about 13.8 billion years ago from an extremely hot, dense state and has been expanding and cooling since, forming atoms, stars and galaxies.
            codes: [AC9S10U03]
          - title: Red shift and an expanding universe
            id: sci-red-shift-expanding-universe
            brief: Light from distant galaxies is stretched to longer, redder wavelengths, and Hubble found that farther galaxies move away faster, so the universe is expanding.
            codes: [AC9S10U03]
          - title: Cosmic microwave background radiation
            id: sci-cosmic-microwave-background-radiation
            brief: A faint glow of microwaves comes from every direction in space. It is the cooled leftover heat of the early universe, which supports the big bang theory.
            codes: [AC9S10U03]
          - title: Reading starlight with spectra
            id: sci-reading-starlight-with-spectra
            brief: Each element gives a pattern of lines in a spectrum, so the light from a star shows what it is made of and how it is moving.
            codes: [AC9S10U03]

      - title: Global climate change
        id: ac-sci-10-1-4
        points:
          - title: Earth's energy balance
            id: sci-earth-s-energy-balance
            brief: Earth absorbs energy from the sun and radiates heat back to space. When more is kept than lost, such as when greenhouse gases rise, the planet warms.
            codes: [AC9S10U04]
          - title: Ocean currents and climate
            id: sci-ocean-currents-climate
            brief: Ocean currents, driven by wind and differences in temperature and saltiness, carry heat around the globe and shape regional climates.
            codes: [AC9S10U04]
          - title: Evidence of climate change
            id: sci-evidence-climate-change
            brief: Rising air and ocean temperatures, rising sea levels, shrinking sea ice and glaciers, and species moving to cooler places show the climate is changing.
            codes: [AC9S10U04]
          - title: Reducing and adapting to climate change
            id: sci-reducing-adapting-climate-change
            brief: Mitigation cuts greenhouse gas emissions, such as with renewable energy. Adaptation prepares for changes, such as sea walls or heat-tolerant crops.
            codes: [AC9S10U04]

      - title: Motion and Newton's laws
        id: ac-sci-10-1-5
        points:
          - title: Speed, velocity and acceleration
            id: sci-speed-velocity-acceleration
            brief: Speed is distance divided by time. Velocity is speed in a given direction. Acceleration is the change in velocity divided by the time taken.
            codes: [AC9S10U05]
          - title: Newton's first law
            id: sci-newton-s-first-law
            brief: An object stays at rest or keeps moving at a steady velocity unless an unbalanced force acts on it. This tendency is called inertia.
            codes: [AC9S10U05]
          - title: Newton's second law
            id: sci-newton-s-second-law
            brief: Net force equals mass times acceleration (F = ma), so a bigger force or a smaller mass gives a greater acceleration.
            codes: [AC9S10U05]
          - title: Newton's third law
            id: sci-newton-s-third-law
            brief: For every action force there is an equal and opposite reaction force on the other object, as a rocket pushes gas back and the gas pushes the rocket forward.
            codes: [AC9S10U05]
          - title: Newton's laws and car safety
            id: sci-newton-s-laws-car
            brief: Seatbelts, airbags and crumple zones make a stop take longer, so the force on the people inside is smaller.
            codes: [AC9S10U05]

      - title: The periodic table
        id: ac-sci-10-1-6
        points:
          - title: Groups and periods
            id: sci-groups-periods
            brief: The periodic table orders elements by atomic number. Rows are periods and columns are groups, and elements in a group have similar properties.
            codes: [AC9S10U06]
          - title: Electron shells and the Bohr model
            id: sci-electron-shells-bohr-model
            brief: In the Bohr model, electrons sit in shells around the nucleus, holding 2, then 8, then 8 in the first three. The outer shell decides how an element reacts.
            codes: [AC9S10U06]
          - title: Metals and non-metals
            id: sci-metals-non-metals
            brief: Metals are usually shiny, conduct heat and electricity and can be bent, and sit to the left. Non-metals are usually dull, brittle insulators, and sit to the right.
            codes: [AC9S10U06]
          - title: Patterns in the groups
            id: sci-patterns-groups
            brief: Group 1 metals react strongly with water, more so down the group, and Group 18 noble gases hardly react at all because their outer shells are full.
            codes: [AC9S10U06]

      - title: Types and rates of reactions
        id: ac-sci-10-1-7
        points:
          - title: Synthesis and decomposition
            id: sci-synthesis-decomposition
            brief: In synthesis, simple substances join to make a more complex one, such as iron and oxygen forming rust. In decomposition, a compound breaks into simpler substances.
            codes: [AC9S10U07]
          - title: Displacement reactions
            id: sci-displacement-reactions
            brief: A more reactive metal pushes a less reactive one out of a compound, such as zinc placed in copper sulfate solution coating with copper.
            codes: [AC9S10U07]
          - title: Acids, bases and neutralisation
            id: sci-acids-bases-neutralisation
            brief: An acid and a base react to make a salt and water. The pH scale shows how acidic or basic a solution is, with 7 neutral.
            codes: [AC9S10U07]
          - title: Rates of reaction
            id: sci-rates-reaction
            brief: Higher temperature, higher concentration, more surface area and a catalyst all speed up a reaction, mostly by making particles collide more often or with more energy.
            codes: [AC9S10U07]

  - title: Science as a human endeavour and inquiry
    chapters:
      - title: Science in society
        id: ac-sci-10-2-1
        points:
          - title: How science corrects itself
            id: sci-science-corrects-itself
            brief: Peer review, repeated experiments and new evidence let scientists find mistakes and refine ideas, as the evidence for an expanding universe built up over decades.
            codes: [AC9S10H01]
          - title: Technology that drives discovery
            id: sci-technology-that-drives-discovery
            brief: Radio telescopes such as the Australian SKA Pathfinder and DNA sequencing machines let scientists collect data that was impossible to gather before.
            codes: [AC9S10H02]
          - title: Society steering science
            id: sci-society-steering-science
            brief: Public concern, funding and ethics decide which research goes ahead, such as climate science or limits on genetic testing.
            codes: [AC9S10H03, AC9S10H04]

      - title: Evaluating evidence and claims
        id: ac-sci-10-2-2
        points:
          - title: Correlation and causation
            id: sci-correlation-causation
            brief: Two things changing together is a correlation. It does not prove one causes the other, since a third factor or chance may explain it.
            codes: [AC9S10I05, AC9S10I06]
          - title: Sample size
            id: sci-sample-size
            brief: A larger sample gives more reliable results, because one unusual result has less effect on the average.
            codes: [AC9S10I03, AC9S10I06]
          - title: Evaluating a scientific claim
            id: sci-evaluating-scientific-claim
            brief: Judge a claim by its evidence, the size and quality of the study, whether others found the same, and who funded or made it.
            codes: [AC9S10I06, AC9S10I07]
