# NSW Health and Movement Science, Year 12: the two Year 12 focus areas, 30 points.
# Health and Movement Science replaced PDHPE in Stage 6: its Year 12 course started in Term 4 2025, first examined in
# the 2026 HSC.
# Drafted from NESA's Health and Movement Science 11-12 Syllabus (2023). The structure follows the syllabus: each focus
# area is a unit. Depth studies are school-designed, so they are not here. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on mental health, drugs, and Aboriginal and Torres Strait Islander health always go to the review page.

id: nsw-hms-12
subject: Health and Movement Science
bank: hms
name: Health and Movement Science, Year 12
about: HSC, Health in Australia and the world, and training
short: Health and Movement Science
years: [12]
place: nsw
kind: standard
syllabus: NSW Health and Movement Science 11-12 Syllabus (2023), Year 12 focus areas (replaced PDHPE Stage 6)
note: Follows the NSW Health and Movement Science syllabus. Not made or endorsed by NESA.
chips: [epidemiology, health inequity, Medicare, progressive overload, recovery]

units:
  - title: Health in an Australian and global context
    chapters:
      - title: Measuring health
        id: nsw-hms-12-1-1
        points:
          - title: Epidemiology
            id: hms-epidemiology
            brief: The study of patterns of health and disease in populations, used to set health priorities and judge whether programs work.
          - title: Measures of health status
            id: hms-measures-health-status
            brief: Life expectancy, mortality (deaths), morbidity (illness) and infant mortality are the main measures of a population's health.
          - title: Limits of epidemiology
            id: hms-limits-epidemiology
            brief: The numbers show what is happening, but not why, how people feel about their health, or the causes behind inequities.
          - title: Australia's health status
            id: hms-australia-s-health-status
            brief: Australians have one of the world's highest life expectancies, but chronic diseases such as heart disease, cancer and diabetes cause most deaths and illness.

      - title: Health priorities and inequities in Australia
        id: nsw-hms-12-1-2
        points:
          - title: Identifying health priorities
            id: hms-identifying-health-priorities
            brief: Health issues are made priorities by how common and costly they are, which groups they affect most and how preventable they are.
          - title: Chronic disease in Australia
            id: hms-chronic-disease-australia
            brief: Cardiovascular disease, cancers and diabetes share risk factors such as smoking, poor diet and inactivity, and many cases can be prevented.
          - title: Mental health as a priority
            id: hms-mental-health-as-priority
            brief: Mental health conditions are common, often start in young people, and are a leading cause of illness. Early support and reducing stigma help.
          - title: Health of Aboriginal and Torres Strait Islander peoples
            id: hms-health-aboriginal-torres-strait
            brief: Aboriginal and Torres Strait Islander peoples have lower life expectancy than other Australians, linked to the effects of colonisation, racism and unequal access to services. Community-controlled health services lead much of the response.
          - title: Rural, remote and low-income groups
            id: hms-rural-remote-low-income
            brief: People in rural and remote areas and on low incomes have poorer health on average, due to distance from services, costs and risk factors.

      - title: Health care and global health
        id: nsw-hms-12-1-3
        points:
          - title: Australia's health care system
            id: hms-australia-s-health-care
            brief: Medicare funds public hospital care and subsidises doctor visits, the PBS subsidises medicines, and private health insurance adds choice.
          - title: Equity of access to health care
            id: hms-equity-access-health-care
            brief: Costs, waiting times, distance and language can keep people from the care they need, even with a public system.
          - title: Global health inequities
            id: hms-global-health-inequities
            brief: Life expectancy differs by decades between rich and poor countries, driven by poverty, clean water, sanitation, education and access to care.
          - title: The World Health Organization
            id: hms-world-health-organization
            brief: The WHO coordinates global health, sets standards, tracks disease outbreaks and leads campaigns such as vaccination programs.
          - title: The Sustainable Development Goals and health
            id: hms-sustainable-development-goals-health
            brief: Goal 3 aims for good health and wellbeing for all by 2030, and goals on poverty, water and education also shape health.

  - title: Training for improved performance
    chapters:
      - title: Principles and types of training
        id: nsw-hms-12-2-1
        points:
          - title: Progressive overload
            id: hms-progressive-overload
            brief: Gradually increasing the training load, by frequency, intensity or time, so the body keeps adapting.
          - title: Specificity and reversibility
            id: hms-specificity-reversibility
            brief: Training should match the demands of the activity. Fitness gains are lost if training stops.
          - title: Variety, warm-up and cool-down
            id: hms-variety-warm-up-cool
            brief: Varying training keeps motivation and avoids overuse. A warm-up prepares the body and a cool-down helps recovery.
          - title: Aerobic training
            id: hms-aerobic-training
            brief: Continuous, interval and fartlek training improve the aerobic system and endurance.
          - title: Anaerobic and resistance training
            id: hms-anaerobic-resistance-training
            brief: Short, high-intensity intervals train the anaerobic systems. Resistance training with weights or body weight builds strength and power.
          - title: Flexibility training
            id: hms-flexibility-training
            brief: Static, dynamic, ballistic and PNF stretching improve range of movement, each suited to different times and sports.

      - title: Adaptations and monitoring
        id: nsw-hms-12-2-2
        points:
          - title: Physiological adaptations to training
            id: hms-physiological-adaptations-training
            brief: Training lowers resting heart rate, raises stroke volume and VO₂ max, and makes muscles bigger and better at using oxygen.
          - title: Monitoring training intensity
            id: hms-monitoring-training-intensity
            brief: Heart rate zones, the rating of perceived exertion and the talk test show how hard someone is working.
          - title: Fitness testing
            id: hms-fitness-testing
            brief: Tests such as the beep test, sit and reach, and vertical jump measure components of fitness and track progress.
          - title: Nutrition for performance
            id: hms-nutrition-performance
            brief: Carbohydrates fuel exercise, protein repairs muscle, and timing meals before, during and after training matters.
          - title: Hydration
            id: hms-hydration
            brief: Losing as little as 2% of body weight through sweat can lower performance, so athletes drink before, during and after exercise.

      - title: Recovery, supplements and the mind
        id: nsw-hms-12-2-3
        points:
          - title: Recovery strategies
            id: hms-recovery-strategies
            brief: Sleep, active recovery, hydrotherapy, massage and nutrition help the body repair between sessions.
          - title: Supplements
            id: hms-supplements
            brief: Products such as caffeine and creatine may help some athletes, but they carry risks and are not all tested for safety or purity.
          - title: Drugs in sport
            id: hms-drugs-sport
            brief: The World Anti-Doping Agency bans substances such as anabolic steroids and EPO because they harm health and give an unfair advantage.
          - title: Psychological strategies
            id: hms-psychological-strategies
            brief: Goal setting, imagery, concentration skills, self-talk and relaxation help athletes manage pressure and perform their best.
          - title: Appraising performance
            id: hms-appraising-performance
            brief: Coaches and athletes use video, statistics and feedback to judge performance and plan the next phase of training.
