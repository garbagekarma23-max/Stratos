# NSW Studies of Religion II, Year 12: the four HSC sections, with depth studies on all five religious traditions, 40 points.
# Drafted from NESA's Studies of Religion II Stage 6 Syllabus (2009 edition), the syllabus taught in Year 12 in 2026.
# The structure follows the syllabus. Studies of Religion I covers a subset of these sections. Every brief is in our
# own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.
# Points on Aboriginal spiritualities and sexual ethics always go to the review page.
# In transition: a Studies of Religion 11-12 Syllabus is out for consultation (October to December 2026). Check its
# start date before the first run.

id: nsw-sor-12
subject: Studies of Religion
bank: sor
name: Studies of Religion II, Year 12
about: HSC, Religion in Australia, depth studies, peace and non-religion
short: Studies of Religion
years: [12]
place: nsw
kind: standard
syllabus: NSW Studies of Religion II Stage 6 Syllabus, HSC (Year 12) course
note: Follows the NSW Studies of Religion syllabus. Not made or endorsed by NESA.
chips: [ecumenism, native title, bioethics, inner peace, secularism]

units:
  - title: Religion and belief systems in Australia after 1945
    chapters:
      - title: Religion in Australia after 1945
        id: nsw-sor-12-1-1
        points:
          - title: Aboriginal spiritualities and dispossession
            id: sor-aboriginal-spiritualities-dispossession
            brief: For Aboriginal peoples, separation from land, including through the Stolen Generations, cut connections with the Dreaming, kinship and ceremony.
          - title: Land rights and native title
            id: sor-land-rights-native-title
            brief: The Mabo decision (1992) and the Native Title Act 1993 recognised some Aboriginal and Torres Strait Islander connections to land, which are spiritual as well as legal.
          - title: The changing religious pattern
            id: sor-changing-religious-pattern
            brief: Since 1945, migration has made Australia more religiously diverse, Christian affiliation has fallen, and the number reporting no religion has risen sharply.
          - title: Ecumenism and interfaith dialogue
            id: sor-ecumenism-interfaith-dialogue
            brief: Ecumenism is Christian churches working together, as in the Uniting Church formed in 1977. Interfaith dialogue builds understanding between different religions.
          - title: Reconciliation and the churches
            id: sor-reconciliation-churches
            brief: Many churches have apologised for their role in removing Aboriginal children and support reconciliation with Aboriginal and Torres Strait Islander peoples.

  - title: Religious tradition depth studies
    chapters:
      - title: Buddhism in depth
        id: nsw-sor-12-2-1
        points:
          - title: A significant person in Buddhism
            id: sor-significant-person-buddhism
            brief: Figures such as the Dalai Lama, Thich Nhat Hanh or Ashoka shaped Buddhism through their teaching and example.
          - title: Buddhist bioethics
            id: sor-buddhist-bioethics
            brief: Buddhist views on issues such as euthanasia and IVF draw on the precept against harming life, compassion and the intention behind an act.
          - title: Buddhist environmental ethics
            id: sor-buddhist-environmental-ethics
            brief: Interdependence and compassion for all living beings lead many Buddhists to care for the environment.
          - title: Buddhist sexual ethics
            id: sor-buddhist-sexual-ethics
            brief: The third precept, to avoid sexual misconduct, asks Buddhists to avoid causing harm in relationships. Teachers and schools apply it differently.
          - title: A significant Buddhist practice
            id: sor-significant-buddhist-practice
            brief: Practices such as temple puja, the festival of Wesak or pilgrimage to sites linked to the Buddha express Buddhist beliefs.

      - title: Christianity in depth
        id: nsw-sor-12-2-2
        points:
          - title: A significant person in Christianity
            id: sor-significant-person-christianity
            brief: Figures such as Paul of Tarsus, Martin Luther or Catherine McAuley shaped Christianity through their beliefs and actions.
          - title: Christian bioethics
            id: sor-christian-bioethics
            brief: Christian views on issues such as euthanasia and IVF draw on the sanctity of life and the dignity of each person, and differ between churches.
          - title: Christian environmental ethics
            id: sor-christian-environmental-ethics
            brief: Many Christians see people as stewards of God's creation, responsible for caring for it.
          - title: Christian sexual ethics
            id: sor-christian-sexual-ethics
            brief: Christian teaching on sexuality draws on scripture and church tradition, and churches differ on questions such as same-sex relationships.
          - title: A significant Christian practice
            id: sor-significant-christian-practice
            brief: Practices such as baptism or the marriage ceremony mark a person's relationship with God and the church.

      - title: Hinduism in depth
        id: nsw-sor-12-2-3
        points:
          - title: A significant person in Hinduism
            id: sor-significant-person-hinduism
            brief: Figures such as Shankara or Mahatma Gandhi shaped Hindu thought and practice through their teaching and lives.
          - title: Hindu bioethics
            id: sor-hindu-bioethics
            brief: Hindu views on issues such as euthanasia draw on ahimsa, karma and the duty to preserve life.
          - title: Hindu environmental ethics
            id: sor-hindu-environmental-ethics
            brief: Belief that the divine is present in all things and the value of ahimsa lead many Hindus to respect nature.
          - title: Hindu sexual ethics
            id: sor-hindu-sexual-ethics
            brief: Hindu teaching places sexuality within marriage and dharma, and views vary across communities.
          - title: A significant Hindu practice
            id: sor-significant-hindu-practice
            brief: Practices such as puja, the marriage ceremony or pilgrimage to sites such as Varanasi express Hindu beliefs.

      - title: Islam in depth
        id: nsw-sor-12-2-4
        points:
          - title: A significant person in Islam
            id: sor-significant-person-islam
            brief: Figures such as the scholar al-Shafi'i or the Prophet's wife Aisha shaped Islamic law and tradition.
          - title: Islamic bioethics
            id: sor-islamic-bioethics
            brief: Islamic views on issues such as euthanasia and IVF draw on the belief that life belongs to God and on sharia.
          - title: Islamic environmental ethics
            id: sor-islamic-environmental-ethics
            brief: Muslims see people as khalifa, trustees of God's creation, responsible for caring for it.
          - title: Islamic sexual ethics
            id: sor-islamic-sexual-ethics
            brief: Islam places sexual relationships within marriage and values modesty, as taught in the Quran and Hadith.
          - title: A significant Islamic practice
            id: sor-significant-islamic-practice
            brief: Practices such as Friday prayer at the mosque or the hajj pilgrimage express Islamic beliefs and community.

      - title: Judaism in depth
        id: nsw-sor-12-2-5
        points:
          - title: A significant person in Judaism
            id: sor-significant-person-judaism
            brief: Figures such as Moses Maimonides or Rabbi Hillel shaped Jewish thought and practice.
          - title: Jewish bioethics
            id: sor-jewish-bioethics
            brief: Jewish views on issues such as euthanasia and IVF draw on the value of preserving life and on rabbinic interpretation.
          - title: Jewish environmental ethics
            id: sor-jewish-environmental-ethics
            brief: The idea that the earth belongs to God and the rule against needless destruction guide Jewish care for the environment.
          - title: Jewish sexual ethics
            id: sor-jewish-sexual-ethics
            brief: Jewish teaching values sexuality within marriage, and the different movements in Judaism interpret the rules differently.
          - title: A significant Jewish practice
            id: sor-significant-jewish-practice
            brief: Practices such as synagogue services, the marriage ceremony or customs of death and mourning express Jewish beliefs.

  - title: Religion and peace
    chapters:
      - title: Religion and peace
        id: nsw-sor-12-3-1
        points:
          - title: Inner peace and world peace
            id: sor-inner-peace-world-peace
            brief: Religions teach paths to inner peace, such as prayer and meditation, and see inner peace as a basis for peace between people.
          - title: Peace in Buddhism and Hinduism
            id: sor-peace-buddhism-hinduism
            brief: Buddhism teaches peace through overcoming craving and practising compassion. Hinduism teaches ahimsa and the peace of union with Brahman.
          - title: Peace in Christianity
            id: sor-peace-christianity
            brief: Christians follow Jesus's teaching to love enemies and be peacemakers, and many churches work for peace and justice.
          - title: Peace in Islam and Judaism
            id: sor-peace-islam-judaism
            brief: Islam teaches that peace comes from submission to God. Judaism values shalom, peace with wholeness, and pursuing justice.
          - title: Religious contributions to peace
            id: sor-religious-contributions-peace
            brief: Religious groups and leaders have worked for peace through interfaith dialogue, aid and campaigns against war.

  - title: Religion and non-religion
    chapters:
      - title: Religion and non-religion
        id: nsw-sor-12-4-1
        points:
          - title: Religious expression today
            id: sor-religious-expression-today
            brief: People increasingly express spirituality outside traditional institutions, and new religious movements have formed.
          - title: Non-religious worldviews
            id: sor-non-religious-worldviews
            brief: Atheism rejects belief in God, agnosticism holds that it cannot be known, and humanism finds meaning in human reason and values.
          - title: The rise of no religion in Australia
            id: sor-rise-no-religion-australia
            brief: In the 2021 census, close to two in five Australians reported no religion, a sharp rise over recent decades.
          - title: Religious and non-religious worldviews compared
            id: sor-religious-non-religious-worldviews
            brief: Worldviews differ on the source of meaning, the basis of ethics and life after death, but can share values such as care for others.
          - title: Responses of religious traditions
            id: sor-responses-religious-traditions
            brief: Religions respond to non-religion through dialogue, outreach and by adapting how they engage with society.
