# Australian Curriculum English, Year 8: the Language, Literature and Literacy strands, 31 points.
# Follows ACARA's Australian Curriculum: English, Version 9.0, Year 8, checked on the official site
# (australiancurriculum.edu.au) in November 2026. Ministers approved Version 9.0 in April 2022 and ACARA published it in
# May 2022. Each state sets its own start: the ACT from 2024, Tasmania from 2023, the NT and WA (its own Western
# Australian Curriculum, adapted from it) from 2025, Queensland by the end of 2026, and South Australia's public schools
# (their own adapted version) by about 2027. ACARA has announced no new version for Years 7 to 10: the next full
# version is scheduled for approval in 2032.
# Each strand is a unit. Each chapter holds one sub-strand, or two or three small ones together, in the curriculum's
# order. The intertextual reference in images (AC9E8LA07) sits with intertextuality in literature (AC9E8LE04). The
# codes are ACARA's content description codes.
# Schools choose their own texts, so no point names a set text or quotes one. Pure practice (giving a talk, publishing
# a piece) is taught as the ideas behind it. Every brief is in our own words.
# content/README.md explains every line. The pipeline adds an id line under each chapter and point title the first
# time it runs. Never change an id after the course is published: progress is saved by id.

id: ac-eng-8
subject: English
bank: eng
name: English, Year 8
about: Australian Curriculum, Year 8
short: English
years: [8]
place: [qld, sa, wa, tas, act, nt]
kind: english
syllabus: "Australian Curriculum: English, Version 9.0, Year 8"
note: Follows the Australian Curriculum, Version 9.0. Not made or endorsed by ACARA.
chips: [nominalisation, semicolon, intertextuality, tone, persuasive devices, homophones]

units:
  - title: Language
    chapters:
      - title: Language for interacting with others, and text structure
        id: ac-eng-8-1-1
        points:
          - title: Language and relationships
            id: eng-language-relationships
            codes: [AC9E8LA01]
            brief: How formal or casual our words are, and how we address people, shows and shapes the relationship, such as between a student and a principal or two friends.
          - title: Evaluating with simile and metaphor
            id: eng-evaluating-with-simile-metaphor
            codes: [AC9E8LA02]
            brief: A review can judge through comparison, such as calling a film a rollercoaster, which adds a layer of meaning a plain judgement lacks.
          - title: Hybrid texts
            id: eng-hybrid-texts
            codes: [AC9E8LA03]
            brief: A hybrid text mixes genres or text types, such as a novel told through diary entries and emails, to create new effects.
          - title: Building a strong paragraph
            id: eng-building-strong-paragraph
            codes: [AC9E8LA04]
            brief: A strong body paragraph makes a claim in its topic sentence, then supports it with examples and evidence and explains how they prove the claim.
          - title: Using quotations as evidence
            id: eng-using-quotations-as-evidence
            codes: [AC9E8LA04]
            brief: A short quotation woven into your own sentence backs up a claim, and it needs an explanation of what it shows.

      - title: Clauses, nominalisation and punctuation
        id: ac-eng-8-1-2
        points:
          - title: Embedded clauses
            id: eng-embedded-clauses
            codes: [AC9E8LA05]
            brief: An embedded clause sits inside a sentence, often starting with who, which or that, to add information about a noun.
          - title: Nominalisation
            id: eng-nominalisation
            codes: [AC9E8LA06]
            brief: Nominalisation turns a verb or adjective into a noun, such as decide into decision, which makes writing sound more formal and less personal.
          - title: Using semicolons
            id: eng-using-semicolons
            codes: [AC9E8LA09]
            brief: A semicolon joins two closely linked main clauses without a conjunction, and it separates items in a list when the items already contain commas.
          - title: Using dashes
            id: eng-using-dashes
            codes: [AC9E8LA09]
            brief: A dash can add an extra idea, an aside or a dramatic pause, and a pair of dashes works like brackets but draws more attention.

      - title: Intertextuality and academic vocabulary
        id: ac-eng-8-1-3
        points:
          - title: Intertextual references in images
            id: eng-intertextual-references-images
            codes: [AC9E8LA07]
            brief: A visual text can borrow from a well-known image, such as a poster copying a famous painting, so viewers bring that meaning to the new image.
          - title: Intertextual references in literature
            id: eng-intertextual-references-literature
            codes: [AC9E8LE04]
            brief: A text can refer to another text, such as a fairy tale, myth or famous story, and readers who notice it gain a deeper understanding.
          - title: Academic vocabulary
            id: eng-academic-vocabulary
            codes: [AC9E8LA08]
            brief: Academic texts use words such as analyse, significant, consequently and evidence, which are more precise and formal than everyday words.

  - title: Literature
    chapters:
      - title: Values, style and positioning
        id: ac-eng-8-2-1
        points:
          - title: Texts represent values
            id: eng-texts-represent-values
            codes: [AC9E8LE01]
            brief: The ideas and points of view in a literary text can show what a person or group believes is right, fair or important.
          - title: Values in First Nations Australian literature
            id: eng-values-first-nations-australian
            codes: [AC9E8LE01]
            brief: Literature by First Nations Australian authors can share values such as connection to Country, family and community, and readers consider the context these come from.
          - title: An author's style
            id: eng-author-s-style
            codes: [AC9E8LE02]
            brief: Style is the way an author typically writes, through choices of words, sentence lengths, devices and structure.
          - title: Positioning the reader
            id: eng-positioning-reader
            codes: [AC9E8LE03]
            brief: Writers and creators use word choice, detail and images to lead readers to feel a certain way about a character, event or issue.

      - title: Tone, imagery and creating literature
        id: ac-eng-8-2-2
        points:
          - title: Sentence patterns and tone
            id: eng-sentence-patterns-tone
            codes: [AC9E8LE05]
            brief: Short, sharp sentences can build tension, while long, flowing sentences can create a calm or dreamy tone.
          - title: Repetition for effect
            id: eng-repetition-effect
            codes: [AC9E8LE05]
            brief: Repeating a word, phrase or sentence pattern stresses an idea, builds rhythm and makes a passage memorable.
          - title: Sensory imagery
            id: eng-sensory-imagery
            codes: [AC9E8LE05]
            brief: Imagery that appeals to sight, sound, smell, taste and touch helps readers experience a scene and creates mood.
          - title: Choosing devices for an effect
            id: eng-choosing-devices-effect
            codes: [AC9E8LE06]
            brief: In their own writing, students pick devices to suit the effect they want, such as short sentences for suspense or exaggeration for humour.

  - title: Literacy
    chapters:
      - title: Texts in context and interacting with others
        id: ac-eng-8-3-1
        points:
          - title: Texts reflect contexts
            id: eng-texts-reflect-contexts
            codes: [AC9E8LY01]
            brief: A text shows the time, place and society it was made in, through its language, its attitudes and what it takes for granted.
          - title: Stated and implied meanings
            id: eng-stated-implied-meanings
            codes: [AC9E8LY02]
            brief: A speaker states some ideas directly and implies others, and a listener can support or challenge both.
          - title: Formal and informal register
            id: eng-formal-informal-register
            codes: [AC9E8LY07]
            brief: Register is how formal language is. A speech to a school assembly needs a more formal register than a chat with friends.

      - title: Analysing, interpreting and evaluating
        id: ac-eng-8-3-2
        points:
          - title: Sources and quotations in a text
            id: eng-sources-quotations-text
            codes: [AC9E8LY03]
            brief: Writers quote experts and cite sources to make a text seem reliable, and readers check who the source is and whether it can be trusted.
          - title: Persuasive devices
            id: eng-persuasive-devices
            codes: [AC9E8LY03]
            brief: Persuasive texts use devices such as rhetorical questions, emotive words, inclusive language and statistics to win readers over.
          - title: How authors organise ideas
            id: eng-authors-organise-ideas
            codes: [AC9E8LY04]
            brief: Authors can organise ideas as a problem and solution, a comparison, or from least to most important, to shape what readers think.
          - title: Evaluating ideas in texts
            id: eng-evaluating-ideas-texts
            codes: [AC9E8LY05]
            brief: Readers question a text's ideas by asking what evidence supports them and what has been left out.

      - title: Creating texts and word knowledge
        id: ac-eng-8-3-3
        points:
          - title: Elaborating ideas
            id: eng-elaborating-ideas
            codes: [AC9E8LY06]
            brief: Writers expand an idea with an example, an explanation, a detail or a comparison, so the reader understands it fully.
          - title: Structure of a persuasive essay
            id: eng-structure-persuasive-essay
            codes: [AC9E8LY06]
            brief: A persuasive essay states a position in the introduction, gives one argument per body paragraph with evidence, and restates the position in the conclusion.
          - title: Homophones
            id: eng-homophones
            codes: [AC9E8LY08]
            brief: Homophones sound the same but differ in spelling and meaning, such as their, there and they're, so the meaning tells you which to write.
          - title: Spelling strategies for new words
            id: eng-spelling-strategies-new-words
            codes: [AC9E8LY08]
            brief: Breaking a word into syllables and parts, and using known spelling rules, helps students spell and learn unfamiliar words.
